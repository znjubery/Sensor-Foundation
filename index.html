<script>
/* ── A4.js ── */
/* A4 — piezoelectric, piezoresistive and magnetic sensors: widgets for docs/A4-piezoelectric-piezoresistive-and-magnetic-sensors.md */
(function () {
  "use strict";
  const { register, C, ROLE, scene3d, fmt, mix, rng, css } = VIZ;
  const EPS0 = 8.8541878128e-12, QE = 1.602176634e-19;

  // engineering formatter: 2.3e-11 → "23 p"
  function eng(x, unit, d) {
    if (!isFinite(x)) return "—";
    const a = Math.abs(x);
    const P = [[1e9, "G"], [1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"], [1e-12, "p"], [1e-15, "f"]];
    if (a === 0) return "0 " + unit;
    for (const [m, p] of P) if (a >= m * 0.9999) return fmt(x / m, d === undefined ? (a / m >= 100 ? 0 : a / m >= 10 ? 1 : 2) : d) + " " + p + unit;
    return x.toExponential(2) + " " + unit;
  }

  // a small time-trace panel drawn straight onto the 3D canvas (corner inset)
  function inset(ctx, box, traces, cursor, labels) {
    const [x0, y0, w, h] = box;
    ctx.save();
    ctx.fillStyle = "rgba(14,17,22,0.88)"; ctx.strokeStyle = C.grid; ctx.lineWidth = 1;
    ctx.fillRect(x0, y0, w, h); ctx.strokeRect(x0, y0, w, h);
    const mid = y0 + h / 2;
    ctx.strokeStyle = C.gridFaint; ctx.beginPath(); ctx.moveTo(x0 + 4, mid); ctx.lineTo(x0 + w - 4, mid); ctx.stroke();
    traces.forEach((tr) => {
      ctx.strokeStyle = tr.col; ctx.lineWidth = tr.w || 2; ctx.beginPath();
      tr.pts.forEach(([u, v], i) => { const X = x0 + 6 + u * (w - 12), Y = mid - v * (h / 2 - 8); i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
      ctx.stroke();
    });
    if (cursor !== null && cursor !== undefined) {
      const X = x0 + 6 + cursor * (w - 12);
      ctx.strokeStyle = C.text; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(X, y0 + 4); ctx.lineTo(X, y0 + h - 4); ctx.stroke(); ctx.setLineDash([]);
    }
    ctx.font = "11px JetBrains Mono, ui-monospace, monospace"; ctx.textBaseline = "top"; ctx.textAlign = "left";
    (labels || []).forEach((l, i) => { ctx.fillStyle = l.col; ctx.fillText(l.s, x0 + 6 + i * (w / 2.2), y0 + 4); });
    ctx.restore();
  }

  // ═════════════════════════════════════ 1. the direct piezoelectric effect ═════════════════════════════════════
  register("a4-piezo-3d", {
    title: "3D · squeeze a crystal and charge appears: q = d₃₃F, then it leaks away",
    target: "After this you can explain why squeezing a crystal makes charge q = d₃₃F, why the area cancels out, and why a piezo sensor only reports changes in force.",
    caption: "grey cage = <span style='color:" + C.text + "'>negative ions</span> at the cell corners, <span style='color:" + C.teal + "'>teal</span> = positive ions in the middle of each cell. Purple arrows = the force. When the cell is squeezed the positive ions sit off-centre, every cell becomes a tiny dipole, and the faces carry the charges ±q. Step through the math; at steps 6–7 the inset (yellow) shows the amplifier output decaying with time constant τ = RC while the force (purple) is held. Try a small R: only the press and the release survive.",
    links: [
      { id: "A3", why: "the electrodes are a parallel-plate capacitor, C = ε₀ε_rA/t" },
      { id: "A7", why: "the charge amplifier and its high-pass corner f_c = 1/(2πRC)" },
      { id: "B5", why: "run backwards (voltage in, motion out) this is a piezo actuator" },
      { id: "A1", why: "a transducer with a sensitivity in pC/N" },
    ],
    build(fig, ui) {
      const MATS = [
        { name: "quartz", d: 2.3e-12, er: 4.5 },
        { name: "PVDF film", d: 33e-12, er: 12 },
        { name: "PZT ceramic", d: 400e-12, er: 1700 },
      ];
      let mat = 2, F = 10, logR = 9, step = 0, stepT0 = 0;
      const Area = 1e-4, thick = 1e-3, Cf = 100e-12;           // 10 mm × 10 mm × 1 mm crystal, 100 pF feedback capacitor
      const NX = 4, NY = 3, NZ = 3, a = 0.95;                    // cells and cell size (scene units)
      const TP = 0.5, TR = 3.0, TEND = 5.0;                      // press, release, end of the inset timeline (s)
      const tau = () => Math.pow(10, logR) * Cf;
      const vNorm = (t) => {                                     // amplifier output / (q/Cf) for a press at TP and a release at TR
        const k = tau();
        let v = 0;
        if (t >= TP) v += Math.exp(-(t - TP) / k);
        if (t >= TR) v -= Math.exp(-(t - TR) / k);
        return v;
      };
      const cursorTime = () => {
        if (step <= 0) return 0.2;
        if (step < 5) return TP + 0.02;
        const el = VIZ.reduceMotion ? 99 : Math.max(0, sc ? sc.t - stepT0 : 0);
        if (step === 5) return Math.min(TR - 0.01, TP + 0.02 + el * 0.9);
        return Math.min(TEND, TR + 0.02 + el * 0.9);
      };
      const sc = scene3d(ui.body, {
        w: 640, h: 420, scale: 58, yaw: -0.62, pitch: 0.32, center: [0, 0, 0.1], animate: !VIZ.reduceMotion,
        draw(g) {
          const tc = cursorTime();
          const pressed = step >= 1 && tc >= TP && tc < TR;
          const sq = pressed ? 0.06 + 0.1 * (F / 20) : 0;        // visual squeeze (exaggerated)
          const shift = pressed ? 0.06 + 0.16 * (F / 20) : 0;     // visual off-centre shift of the + ions
          const sz = 1 - sq, hx = (NX * a) / 2, hy = (NY * a) / 2, hz = ((NZ * a) / 2) * sz;
          const showFaces = step >= 2;
          const frac = step >= 2 ? (step >= 5 ? vNorm(tc) : 1) : 0;
          // crystal body (translucent) and its edges
          g.box([-hx, -hy, -hz], [hx, hy, hz], C.silicon, { alpha: 0.13, shade: false });
          const E = [[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]];
          for (let i = 0; i < 4; i++) {
            const [x1, y1] = E[i], [x2, y2] = E[(i + 1) % 4];
            g.line([x1, y1, hz], [x2, y2, hz], C.silicon, 1.2); g.line([x1, y1, -hz], [x2, y2, -hz], C.silicon, 1.2); g.line([x1, y1, -hz], [x1, y1, hz], C.silicon, 1.2);
          }
          // lattice: anions at the corners, cations in the cell centres
          const anion = mix(C.text, C.silicon, 0.35);
          for (let i = 0; i <= NX; i++) for (let j = 0; j <= NY; j++) for (let k = 0; k <= NZ; k++)
            g.sphere([-hx + i * a, -hy + j * a, -hz + k * a * sz], 0.1, anion);
          for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++) for (let k = 0; k < NZ; k++) {
            const c = [-hx + (i + 0.5) * a, -hy + (j + 0.5) * a, -hz + (k + 0.5) * a * sz];
            const p = [c[0], c[1], c[2] + shift];
            g.sphere(p, 0.14, C.teal);
            if (pressed && step === 1) g.arrow([c[0], c[1] - 0.001, c[2] - 0.12], [c[0], c[1] - 0.001, c[2] + shift + 0.2], mix(C.teal, C.white, 0.4), 1.6);
          }
          // electrodes
          const ez = hz + 0.06;
          g.box([-hx - 0.1, -hy - 0.1, hz], [hx + 0.1, hy + 0.1, ez], step >= 4 ? mix(C.yellow, C.silicon, 0.55) : "#aeb6bf", { alpha: 0.9 });
          g.box([-hx - 0.1, -hy - 0.1, -ez], [hx + 0.1, hy + 0.1, -hz], step >= 4 ? mix(C.yellow, C.silicon, 0.55) : "#aeb6bf", { alpha: 0.9 });
          // surface charges: number of signs ∝ |q|
          if (showFaces) {
            const nS = Math.round(Math.min(1, Math.abs(frac)) * 10);
            const top = frac >= 0 ? "+" : "−", bot = frac >= 0 ? "−" : "+";
            for (let s = 0; s < nS; s++) {
              const u = -hx + 0.3 + (s % 5) * ((2 * hx - 0.6) / 4), v = s < 5 ? -hy * 0.45 : hy * 0.45;
              g.text([u, v, ez + 0.16], top, top === "+" ? C.teal : C.text, 22);
              g.text([u, v, -ez - 0.2], bot, bot === "+" ? C.teal : C.text, 22);
            }
          }
          // force arrows
          if (pressed) {
            const L = 0.5 + 1.0 * (F / 20);
            [[-1.1, 0], [1.1, 0], [0, 0]].forEach(([x, y]) => {
              g.arrow([x, y, ez + 0.35 + L], [x, y, ez + 0.32], C.purple, 4);
              g.arrow([x, y, -ez - 0.35 - L], [x, y, -ez - 0.32], C.purple, 4);
            });
            g.text([hx + 0.55, 0, ez + 0.9], "F", C.purple, 18);
          }
          // the voltmeter / amplifier link across the electrodes
          if (step >= 4) {
            const xw = hx + 0.45;
            g.line([hx + 0.1, 0, ez], [xw, 0, ez], C.teal, 2); g.line([hx + 0.1, 0, -ez], [xw, 0, -ez], C.teal, 2);
            g.arrow([xw, 0, -ez], [xw, 0, ez], C.yellow, 3);
            g.text([xw + 0.75, 0, 0], frac >= 0 ? "V > 0" : "V < 0", C.yellow, 15);
          }
          if (step === 3) {
            g.text([0, -hy - 0.55, -hz - 0.05], "A (area cancels)", C.green, 14);
          }
          if (step >= 4) g.text([-hx - 0.4, -hy, 0], "t", C.green, 16);
        },
        overlay(ctx) {
          if (step < 5) return;
          const N = 160, pF = [], pV = [];
          for (let i = 0; i <= N; i++) {
            const t = (TEND * i) / N;
            pF.push([i / N, t >= TP && t < TR ? 0.8 : 0]);
            pV.push([i / N, 0.85 * vNorm(t)]);
          }
          inset(ctx, [420, 12, 208, 104], [{ pts: pF, col: C.purple, w: 2 }, { pts: pV, col: C.yellow, w: 2.2 }], cursorTime() / TEND,
            [{ s: "F(t)", col: C.purple }, { s: "V_out(t)", col: C.yellow }]);
          ctx.save(); ctx.font = "11px JetBrains Mono, ui-monospace, monospace"; ctx.fillStyle = C.dim; ctx.textAlign = "right";
          ctx.fillText("τ = " + eng(tau(), "s"), 622, 110); ctx.restore();
        },
      });
      ui.slider("material", 0, 2, 1, mat, (v) => { mat = v; upd(); return MATS[v].name; });
      ui.slider("force F", 1, 20, 1, F, (v) => { F = v; upd(); return v + " N"; });
      ui.slider("leak resistor R", 7, 11, 0.5, logR, (v) => { logR = v; upd(); return eng(Math.pow(10, v), "Ω"); });
      ui.steps([
        "No force. In every cell the centre of the \\(+\\) charge sits exactly on the centre of the \\(-\\) charge, so the cell has no dipole and the faces carry no charge.",
        "Squeeze with a force \\(F\\). The cell gets shorter (strain \\(\\varepsilon\\)), and in a crystal without a centre of symmetry the \\(+\\) ions move a little more than the \\(-\\) cage: each cell now holds a tiny dipole (arrows).",
        "All the dipoles point the same way, so their charges cancel inside and are left over on the two faces. The surface charge per area is the polarisation, \\( P = d_{33}\\,\\sigma = d_{33}\\,F/A \\), with stress \\( \\sigma = F/A \\).",
        "Total charge on a face: \\( q = P\\,A = d_{33}\\,F \\). The area cancels: a big and a small crystal give the same charge for the same force. Quartz: 2.3 pC/N; PVDF: 33 pC/N; PZT: about 400 pC/N.",
        "The two electrodes and the crystal between them are a capacitor, \\( C = \\varepsilon_0\\varepsilon_r A/t \\), so the open-circuit voltage is \\( V = q/C = d_{33}F\\,t/(\\varepsilon_0\\varepsilon_r A) \\). A charge amplifier instead gives \\( V_{\\text{out}} = -q/C_f \\).",
        "Hold the force. Nothing is a perfect insulator: the charge leaks through the resistance \\(R\\) with time constant \\( \\tau = RC \\), so \\( V(t) = V_0\\,e^{-t/\\tau} \\). A constant force fades away (watch the inset).",
        "Release the force. The lattice springs back, the dipoles vanish, and the charge that leaked away now shows up as the opposite voltage. The sensor reports \\(dF/dt\\)-like events: it is a high-pass filter with corner \\( f_c = 1/(2\\pi RC) \\).",
      ], (i) => { step = i; stepT0 = sc.t; upd(); });
      function upd() {
        const m = MATS[mat], q = m.d * F, Cp = (EPS0 * m.er * Area) / thick;
        ui.read.innerHTML =
          `<b style="color:${C.purple}">F = ${F} N</b> on ${m.name} (d₃₃ = ${fmt(m.d * 1e12, 1)} pC/N, ε_r = ${m.er}) → ` +
          `<b style="color:${C.teal}">q = ${eng(q, "C")}</b><br>` +
          `crystal 10×10×1 mm: C = ${eng(Cp, "F")} → open-circuit V = q/C = <b style="color:${C.yellow}">${eng(q / Cp, "V")}</b> · ` +
          `charge amp C_f = 100 pF → |V_out| = <b style="color:${C.yellow}">${eng(q / Cf, "V")}</b><br>` +
          `leak: R = ${eng(Math.pow(10, logR), "Ω")}, τ = RC_f = ${eng(tau(), "s")}, f_c = 1/(2πτ) = <b style="color:${C.green}">${eng(1 / (2 * Math.PI * tau()), "Hz")}</b>`;
        sc.render();
      }
      upd();
    },
  });

  // ═════════════════════════════════════ 2. the Hall effect ═════════════════════════════════════
  register("a4-hall-3d", {
    title: "3D · the Hall plate: moving charges pushed sideways, V_H = IB/(n q_e t)",
    target: "After this you can derive V_H = IB/(n q_e t) from a force balance, and explain why Hall sensors are made of thin, lightly doped semiconductor and not copper.",
    caption: "grey slab = a thin silicon plate; <span style='color:" + C.teal + "'>teal dots</span> = electrons carrying the current I; <span style='color:" + C.blue + "'>blue arrows</span> = the magnetic field B (the stimulus). Step through: the magnetic force (purple) bends the electrons to one edge, the piled-up charge makes an electric field (teal) that pushes back, and in balance the edges sit at a steady voltage V_H (yellow). At the last step a gear tooth sweeps past and V_H pulses: that is an ABS wheel-speed signal. Slide n from silicon to copper and watch V_H collapse.",
    links: [
      { id: "A1", why: "B → V_H is a transducer with sensitivity 1/(n q_e t) per ampere" },
      { id: "A7", why: "microvolt-to-millivolt Hall voltages need a differential amplifier" },
      { id: "A9", why: "the phone compass (Hall or AMR) is fused with the gyro for heading" },
      { id: "B4", why: "IMUs pack a magnetometer next to the accelerometer and gyro" },
    ],
    build(fig, ui) {
      let I = 1e-3, B = 0.05, logn = 22, step = 0, t0 = 0;
      const tP = 10e-6, wP = 100e-6;                    // plate thickness and width (for the readout)
      const LX = 3.0, WY = 1.35, TZ = 0.14;              // half-length, half-width, half-thickness (scene units)
      const R = rng(7), NC = 34;
      const car = Array.from({ length: NC }, () => ({ x: -LX + 2 * LX * R(), y0: (R() * 2 - 1) * (WY - 0.15), ph: R() }));
      let lastT = 0;
      const Bnow = (t) => {
        if (step < 1) return 0;
        if (step < 5) return 1;
        const ph = ((t - t0) * 0.6) % 1;                  // a gear tooth passes 0.6 times per (scene) second
        return ph < 0.45 ? 1 : 0.12;
      };
      const build = (t) => {                              // how far the edge charge has built up (0…1)
        if (step < 2) return 0;
        if (step === 2) return VIZ.reduceMotion ? 1 : Math.min(1, 1 - Math.exp(-(t - t0) / 0.9));
        return 1;
      };
      const sc = scene3d(ui.body, {
        w: 640, h: 420, scale: 62, yaw: -0.5, pitch: 0.55, center: [0, 0, 0.1], animate: !VIZ.reduceMotion,
        draw(g, t) {
          const dt = Math.max(0, Math.min(0.05, t - lastT)); lastT = t;
          const bmag = Bnow(t), bu = build(t), Bvis = bmag * Math.min(1, 0.35 + B / 0.15);
          // plate, contacts
          g.box([-LX, -WY, -TZ], [LX, WY, TZ], C.silicon, { alpha: 0.75 });
          g.box([-LX - 0.3, -WY, -TZ - 0.05], [-LX, WY, TZ + 0.05], "#c3cad2");
          g.box([LX, -WY, -TZ - 0.05], [LX + 0.3, WY, TZ + 0.05], "#c3cad2");
          g.box([-0.25, -WY - 0.22, -TZ], [0.25, -WY, TZ], "#c3cad2");
          g.box([-0.25, WY, -TZ], [0.25, WY + 0.22, TZ], "#c3cad2");
          // conventional current arrow
          g.arrow([-LX - 1.4, 0, 0], [-LX - 0.35, 0, 0], C.teal, 3.5);
          g.text([-LX - 1.0, 0, 0.35], "I", C.teal, 17);
          // B field arrows
          if (bmag > 0) {
            [-2.0, 0, 2.0].forEach((x) => [-0.7, 0.7].forEach((y) => g.arrow([x, y, -1.3], [x, y, -1.3 + 2.8 * Bvis], C.blue, 2.6)));
            g.text([-2.0, -0.7, -1.3 + 2.8 * Bvis + 0.25], "B", C.blue, 17);
          }
          // carriers (electrons drift towards −x; magnetic force (−e)(v×B) points to −y)
          const vx = 1.1, side = 0.9 * bmag * (1 - bu);
          car.forEach((c, idx) => {
            if (!VIZ.reduceMotion) c.x -= vx * dt;
            if (c.x < -LX) { c.x = LX; c.y0 = (R() * 2 - 1) * (WY - 0.15); }
            const travelled = LX - c.x;                     // since entering at +LX
            let y = c.y0 - side * travelled * 0.55;
            if (y < -WY + 0.1) y = -WY + 0.1;
            c.y = y;
            g.sphere([c.x, y, TZ + 0.1], 0.085, idx === 0 ? mix(C.teal, C.white, 0.5) : C.teal);
          });
          // edge charges and Hall field
          const nq = Math.round(bu * bmag * 9);
          for (let s = 0; s < nq; s++) {
            const x = -LX + 0.5 + s * ((2 * LX - 1) / 8);
            g.text([x, -WY - 0.05, TZ + 0.3], "−", C.text, 20);
            g.text([x, WY + 0.05, TZ + 0.3], "+", C.teal, 20);
          }
          if (bu * bmag > 0.2 && step >= 2) [-1.6, 1.6].forEach((x) => g.arrow([x, WY - 0.2, TZ + 0.05], [x, WY - 0.2 - 2.2 * bu * bmag, TZ + 0.05], mix(C.teal, C.bg, 0.25), 2));
          // force on the highlighted carrier
          const c0 = car[0];
          if (step >= 1 && step <= 3 && bmag > 0) {
            const p = [c0.x, c0.y, TZ + 0.1];
            g.arrow(p, [p[0], p[1] - 0.75, p[2]], C.purple, 3);
            if (step >= 2) g.arrow(p, [p[0], p[1] + 0.75 * bu, p[2]], C.teal, 3);
          }
          if (step === 0) g.arrow([c0.x, c0.y, TZ + 0.1], [c0.x - 0.8, c0.y, TZ + 0.1], C.white, 2);
          // voltmeter across the width
          if (step >= 4) {
            g.line([0, -WY - 0.22, 0], [0, -WY - 0.75, 0], C.teal, 2); g.line([0, WY + 0.22, 0], [0, WY + 0.75, 0], C.teal, 2);
            g.arrow([0, -WY - 0.75, 0], [0, WY + 0.75, 0], C.yellow, 2.6);
            g.text([0.35, WY + 1.0, 0.25], "V_H", C.yellow, 17);
            g.line([LX + 0.6, -WY, -TZ], [LX + 0.6, -WY, TZ], C.green, 2);
            g.text([LX + 0.95, -WY, 0], "t", C.green, 16);
          }
          if (step === 5) {
            // a gear tooth (purple steel) passing under the plate
            const ph = ((t - t0) * 0.6) % 1, x = 3.5 - 7 * ph;
            g.box([x - 0.6, -0.9, -2.0], [x + 0.6, 0.9, -1.55], mix(C.purple, C.silicon, 0.5));
          }
        },
        overlay(ctx) {
          if (step < 5) return;
          const pts = [], N = 120;
          for (let i = 0; i <= N; i++) { const ph = (i / N) * 3 % 1; pts.push([i / N, ph < 0.45 ? 0.8 : 0.1]); }
          inset(ctx, [440, 12, 188, 86], [{ pts, col: C.yellow, w: 2 }], null, [{ s: "V_H(t): pulses", col: C.yellow }]);
        },
      });
      ui.slider("current I", 0.1, 5, 0.1, I * 1e3, (v) => { I = v * 1e-3; upd(); return fmt(v, 1) + " mA"; });
      ui.slider("field B", 0, 200, 5, B * 1e3, (v) => { B = v * 1e-3; upd(); return v + " mT"; });
      ui.slider("carrier density n", 21, 29, 0.5, logn, (v) => { logn = v; upd(); return "10^" + fmt(v, 1) + " m⁻³" + (v >= 28.5 ? " (copper)" : v <= 22.5 ? " (doped Si)" : ""); });
      ui.steps([
        "A current \\(I\\) flows along the plate. In an n-type plate it is carried by electrons drifting the other way at \\( v_d = I/(n\\,q_e\\,w\\,t) \\): \\(n\\) carriers per m³, each of charge \\(q_e\\), through a cross-section \\(w\\times t\\).",
        "Switch on a field \\(B\\) through the plate. A moving charge feels the magnetic force \\( F = q_e\\,v_d\\,B \\), at right angles to both its motion and \\(B\\): the electrons bend towards one edge.",
        "Electrons pile up on that edge and leave the other edge positive. The separated charge creates a sideways electric field \\( \\mathcal E_H \\) that pushes the next electrons back (teal arrow).",
        "Steady state in about a nanosecond: electric push = magnetic push, \\( q_e\\,\\mathcal E_H = q_e\\,v_d\\,B \\), so \\( \\mathcal E_H = v_d B \\). The electrons now travel straight again.",
        "Across the width: \\( V_H = \\mathcal E_H\\,w = v_d B\\,w = \\dfrac{I B}{n\\,q_e\\,t} \\). The width cancels; a thin plate (small \\(t\\)) with few carriers (small \\(n\\)) gives a big voltage.",
        "Use it: a magnet or steel gear tooth passing the plate switches \\(B\\) on and off, so \\(V_H\\) becomes a pulse train. Pulses per second ÷ teeth = wheel revolutions per second (ABS, crankshaft, bike computer).",
      ], (i) => { step = i; t0 = sc.t; upd(); });
      function upd() {
        const n = Math.pow(10, logn), VH = (I * B) / (n * QE * tP), vd = I / (n * QE * wP * tP);
        ui.read.innerHTML =
          `I = <b style="color:${C.teal}">${fmt(I * 1e3, 1)} mA</b>, B = <b style="color:${C.blue}">${fmt(B * 1e3, 0)} mT</b>, n = 10^${fmt(logn, 1)} m⁻³, plate t = 10 µm, w = 100 µm<br>` +
          `drift speed v_d = ${eng(vd, "m/s")} · Hall field ℰ_H = v_dB = ${eng(vd * B, "V/m")}<br>` +
          `<b style="color:${C.yellow}">V_H = IB/(n q_e t) = ${eng(VH, "V")}</b> · sensitivity ${eng(I / (n * QE * tP), "V/T")} · Earth's 50 µT would give ${eng((I * 50e-6) / (n * QE * tP), "V")}`;
        if (VIZ.reduceMotion) sc.render();
      }
      upd();
    },
  });

  // ═════════════════════════════════════ 3. the phone compass ═════════════════════════════════════
  register("a4-compass-3d", {
    title: "3D · a phone compass: heading ψ = atan2(−B_y, B_x) from the Earth's ~50 µT",
    target: "After this you can turn two magnetometer readings into a heading, and see why the Earth's tilted field and a magnet in the phone case both bend the answer.",
    caption: "the <span style='color:" + C.blue + "'>blue arrow</span> is the Earth's field (about 50 µT, dipping into the ground in the northern hemisphere); the thin arrow B_h on the table is its horizontal part, the only part that points north. The <span style='color:" + C.yellow + "'>yellow arrows</span> are what the phone's two in-plane sensors read along its own x (top edge) and y (right edge) axes. Turn the phone, change where on Earth you are, then add a hard-iron offset (red, e.g. a magnetic phone case) and watch the computed heading go wrong.",
    links: [
      { id: "A8", why: "the hard-iron offset is removed by calibration (the figure-eight wave)" },
      { id: "A9", why: "heading from the compass is fused with the gyroscope" },
      { id: "B4", why: "the accelerometer gives the tilt needed for tilt compensation" },
    ],
    build(fig, ui) {
      let psi = 30, incl = 66, Btot = 50, off = 0;
      const rad = Math.PI / 180, K = 3.2 / 50;            // scene units per µT
      const sc = scene3d(ui.body, {
        w: 640, h: 420, scale: 70, yaw: -0.45, pitch: 0.78, center: [0, -0.25, -0.1],
        draw(g) {
          const p = psi * rad, f = [Math.sin(p), Math.cos(p), 0], r = [Math.cos(p), -Math.sin(p), 0];
          const Bh = Btot * Math.cos(incl * rad), Bv = Btot * Math.sin(incl * rad);
          // table and compass ring
          const ring = [];
          for (let i = 0; i <= 48; i++) { const a = (2 * Math.PI * i) / 48; ring.push([2.9 * Math.sin(a), 2.9 * Math.cos(a), -0.12]); }
          g.poly(ring.slice(0, 48), "#1b2430", { shade: false, bias: -50 });
          g.polyline(ring, C.grid, 1.2);
          [["N", 0], ["E", 90], ["S", 180], ["W", 270]].forEach(([s, a]) => g.text([3.25 * Math.sin(a * rad), 3.25 * Math.cos(a * rad), -0.12], s, s === "N" ? C.red : C.dim, 16));
          // phone (rotated box)
          const hw = 0.8, hl = 1.6, th = 0.16;
          const P = (u, v, z) => [u * r[0] + v * f[0], u * r[1] + v * f[1], z];
          const corners = [[-hw, -hl], [hw, -hl], [hw, hl], [-hw, hl]];
          const bot = corners.map(([u, v]) => P(u, v, -0.1)), top = corners.map(([u, v]) => P(u, v, -0.1 + th));
          for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; g.poly([bot[i], bot[j], top[j], top[i]], "#6b7684"); }
          g.poly(top, "#4a5562");
          g.poly([[-hw + 0.08, -hl + 0.15], [hw - 0.08, -hl + 0.15], [hw - 0.08, hl - 0.15], [-hw + 0.08, hl - 0.15]].map(([u, v]) => P(u, v, -0.1 + th + 0.005)), "#1d2a38", { shade: false, stroke: C.dim });
          g.sphere(P(0, hl - 0.25, 0.08), 0.06, C.silicon);
          // phone axes
          const o = [0, 0, 0.12];
          g.line(o, P(0, 2.3, 0.12), C.dim, 1, [4, 4]); g.line(o, P(1.9, 0, 0.12), C.dim, 1, [4, 4]);
          g.text(P(0, 2.55, 0.12), "x", C.dim, 13); g.text(P(2.1, 0, 0.12), "y", C.dim, 13);
          // Earth's field
          const hB = (Bh * K) / 2, vB = (Bv * K) / 2;
          g.arrow([0, -hB, 0.12 + vB], [0, hB, 0.12 - vB], C.blue, 3.5);
          g.text([-1.25, -hB - 0.2, 0.12 + vB + 0.1], "B (Earth)", C.blue, 15);
          g.arrow([0, -hB, 0.13], [0, hB, 0.13], mix(C.blue, C.bg, 0.3), 1.8);
          g.line([0, -hB, 0.12 + vB], [0, -hB, 0.12], C.blue, 1, [2, 4]);
          g.line([0, hB, 0.12 - vB], [0, hB, 0.12], C.blue, 1, [2, 4]);
          g.text([0.25, hB + 0.25, 0.13], "B_h", mix(C.blue, C.white, 0.2), 13);
          // what the sensors read (with the hard-iron offset on y)
          const bx = Bh * Math.cos(p), by = -Bh * Math.sin(p) + off;
          g.arrow(o, P(0, bx * K, 0.12), C.yellow, 3.2);
          g.arrow(o, P(by * K, 0, 0.12), C.yellow, 3.2);
          if (off !== 0) g.arrow(P(-off * K + by * K, 0, 0.16), P(by * K, 0, 0.16), C.red, 2.4);
          g.text(P(0, bx * K + (bx >= 0 ? 0.3 : -0.3), 0.3), "B_x", C.yellow, 14);
          g.text(P(by * K + (by >= 0 ? 0.35 : -0.35), 0, 0.3), "B_y", C.yellow, 14);

          `sensors: <b style="color:${C.yellow}">B_x = ${fmt(bx, 1)} µT, B_y = ${fmt(by, 1)} µT</b> → ψ = atan2(−B_y, B_x) = <b style="color:${C.green}">${fmt(h, 1)}°</b>` +

      }

    },

<script>
/* ── A5.js ── */
/* A5 — optical sensors: widgets for docs/A5-optical-sensors-photodiodes-image-sensors-and-lidar.md */
(function () {

  // ═════════════════════════════════════ 1. pixels are buckets for photo-electrons ═════════════════════════════════════
  register("a5-pixel-array-3d", {
    title: "3D · a camera sensor: photons rain into pixel wells, N_e electrons ± √N_e",
    target: "After this you can predict how many electrons a pixel collects, why dim photos are grainy (SNR = √N_e), and where a pixel saturates.",
    caption: "each square well is one pixel under its <b>Bayer</b> colour filter (two green, one red, one blue per 2×2 block). <span style='color:" + C.gold + "'>Gold dots</span> are photons; the <span style='color:" + C.yellow + "'>yellow fill</span> is the number of collected electrons, the output. The scene is brighter on the right (a sunlit leaf). Step through the math; from step 4 the red whiskers show ±√N_e and the inset shows the photo the pixels make (auto-brightened, like a phone at high ISO). Turn the light down and the photo turns to grain; turn it up and wells overflow (red caps).",

      const meanE = (i, j) => Math.pow(10, logL) * Math.pow(10, logT) * ETA * TF[bay(i, j)] * pattern(i, j) / 0.42;

            g.sphere([d.x, d.y, d.z + 0.5], 0.07, C.gold);
          });
          if (step === 0) g.text([-3.3, -3.3, 4.6], "photon E = hc/λ", C.gold, 14, "left");
          if (step === 5) { g.line([3.25, -3, 0], [3.25, -3, Hw], C.green, 2); g.text([3.6, -3, Hw], "full well", C.green, 13, "left"); }
        },
        overlay(ctx) {

      ui.slider("exposure", -1, 2, 0.1, logT, (v) => { logT = v; newFrame(); upd(); return fmt(Math.pow(10, v), 2) + " ms"; });
      ui.button("new frame", () => { newFrame(); t0 = sc.t - 2.6; upd(); });
      ui.steps([
        "A photon carries energy \\( E_{\\text{ph}} = h_{\\text P}c_0/\\lambda \\): 2.25 eV for green light at 550 nm. Silicon needs at least its band gap, 1.12 eV, to free an electron, so it is blind beyond \\( \\lambda = h_{\\text P}c_0/E_g \\approx 1.1\\ \\mu\\text{m} \\).",
        "Not every photon counts: the fraction that frees an electron is the quantum efficiency \\( \\eta \\) (about 0.6 here). The colour filter on top also passes only part of white light.",
        "During the exposure \\( t_{\\exp} \\) the well collects \\( N_e =\\eta\\,\\Phi\\,t_{\\exp} \\) electrons, where \\( \\Phi \\) is the photon rate on that pixel. Twice the light or twice the time: twice the electrons (watch the wells fill).",
        "Photons arrive at random, like raindrops. The count obeys Poisson statistics: its spread is \\( \\sigma_{N_e} = \\sqrt{N_e} \\) (red whiskers). Neighbouring pixels in the same light differ by about that much.",

        "The well holds at most the full-well capacity (6000 e⁻ here). Beyond that the pixel clips (red caps). Dynamic range = full well ÷ read noise = 6000/2 = 3000, about 69.5 dB or 11.6 stops.",

          `darkest corner pixel: N_e = ${fmt(lo, 0)} e⁻, SNR = ${fmt(snr(lo), 1)} · full well 6000 e⁻, read noise 2 e⁻ · ` +
          `<span style="color:${sat ? C.red : C.dim}">${sat} of 36 pixels saturated</span>`;
        if (VIZ.reduceMotion) sc.render();
      }
      upd();
    },
  });

  // ═════════════════════════════════════ 2. LiDAR: time of flight to a point cloud ═════════════════════════════════════
  register("a5-tof-3d", {
    title: "3D · a car's LiDAR: d = c t / 2, one laser pulse at a time, into a point cloud",
    target: "After this you can turn an echo time into a distance, say how timing resolution limits depth, and explain how a spinning LiDAR builds a point cloud.",
    caption: "a car (grey) with a LiDAR on its roof faces a street with a pedestrian, a tree, a parked van and a wall. The <span style='color:" + C.gold + "'>gold ray</span> is the laser pulse. Steps 1–4 follow one pulse to the pedestrian and back; steps 5–6 sweep 8 laser channels across the scene and the dots appear, coloured by distance. Coarsen the timing resolution and the cloud breaks into shells, c·Δt/2 apart. In the last step the solid objects fade: the points are all the car really knows.",
    links: [
      { id: "A9", why: "LiDAR points are fused with camera, radar and IMU data" },
      { id: "A7", why: "a time-to-digital converter measures t to tens of picoseconds" },
      { id: "A8", why: "timing jitter becomes distance noise, σ_d = cσ_t/2" },
      { id: "B4", why: "the car's IMU says where the LiDAR was when each pulse fired" },
    ],
    build(fig, ui) {
      let logDt = -9, step = 0, t0 = 0;
      const ELS = [-15, -11, -8, -5.5, -3.5, -1.5, 0.5, 2.5].map((d) => (d * Math.PI) / 180);
      const AZ0 = -62, AZ1 = 62, DAZ = 1.6;
      const O = [0, 0.4, 1.75];
      const boxes = [
        { a: [-7, 13, 0], b: [-0.5, 14, 3.2], col: "#8a7f72" },          // wall
        { a: [2.2, 9.5, 0], b: [4.0, 14.0, 2.1], col: "#5a6f8a" },        // parked van
      ];
      const cyls = [
        { x: 1.6, y: 6.0, r: 0.28, z0: 0, z1: 1.75, col: C.purple },     // pedestrian
        { x: -3.0, y: 6.5, r: 0.22, z0: 0, z1: 2.2, col: "#8a6a4a" },     // tree trunk
      ];
      const sph = [{ c: [-3.0, 6.5, 3.0], r: 1.1, col: "#4f8f4f" }];      // tree crown
      const ped = [cyls[0].x, cyls[0].y, 1.1];
      function hit(o, d) {
        let best = 40;
        if (d[2] < 0) best = Math.min(best, -o[2] / d[2]);
        boxes.forEach(({ a, b }) => {
          let tn = -1e9, tf = 1e9;
          for (let k = 0; k < 3; k++) {
            if (Math.abs(d[k]) < 1e-9) { if (o[k] < a[k] || o[k] > b[k]) return; continue; }
            let t1 = (a[k] - o[k]) / d[k], t2 = (b[k] - o[k]) / d[k];

            tn = Math.max(tn, t1); tf = Math.min(tf, t2);
          }
          if (tn <= tf && tn > 0) best = Math.min(best, tn);
        });
        cyls.forEach((c) => {
          const ox = o[0] - c.x, oy = o[1] - c.y, A = d[0] * d[0] + d[1] * d[1], B = 2 * (ox * d[0] + oy * d[1]), Cc = ox * ox + oy * oy - c.r * c.r;
          const disc = B * B - 4 * A * Cc; if (disc < 0 || A < 1e-12) return;
          const t = (-B - Math.sqrt(disc)) / (2 * A), z = o[2] + t * d[2];
          if (t > 0 && z >= c.z0 && z <= c.z1) best = Math.min(best, t);
        });
        sph.forEach((s) => {
          const oc = [o[0] - s.c[0], o[1] - s.c[1], o[2] - s.c[2]], B = oc[0] * d[0] + oc[1] * d[1] + oc[2] * d[2];
          const Cc = oc[0] * oc[0] + oc[1] * oc[1] + oc[2] * oc[2] - s.r * s.r, disc = B * B - Cc;
          if (disc < 0) return; const t = -B - Math.sqrt(disc); if (t > 0) best = Math.min(best, t);
        });

      }
      const dirOf = (az, el) => [Math.cos(el) * Math.sin(az), Math.cos(el) * Math.cos(az), Math.sin(el)];
      let cloud = [];
      function scan() {
        const r = rng(11), dd = (C0 * Math.pow(10, logDt)) / 2;

        for (let az = AZ0; az <= AZ1 + 1e-9; az += DAZ) ELS.forEach((el) => {
          const d = dirOf((az * Math.PI) / 180, el), t = hit(O, d);
          if (t === null) return;
          const meas = Math.max(0.1, Math.round((t + 0.25 * dd * gauss(r)) / dd) * dd);   // timing bins + a little jitter
          cloud.push({ az, p: [O[0] + meas * d[0], O[1] + meas * d[1], O[2] + meas * d[2]], d: meas });
        });
      }
      scan();
      const pedDir = (() => { const v = [ped[0] - O[0], ped[1] - O[1], ped[2] - O[2]], L = Math.hypot(...v); return v.map((x) => x / L); })();
      const pedT = hit(O, pedDir);
      const sc = scene3d(ui.body, {
        w: 640, h: 430, scale: 31, yaw: -0.5, pitch: 0.42, center: [-0.3, 6.5, 0.6], dist: 30, animate: !VIZ.reduceMotion,
        draw(g, t) {
          const fade = step >= 5;
          const op = fade ? { alpha: 0.12, shade: false } : undefined;
          g.grid(0, [-7, 6], [-2, 15], 1, "#1a2a33");
          // our car
          g.box([-0.9, -2.0, 0.3], [0.9, 2.2, 1.05], C.silicon, op);
          g.box([-0.8, -1.0, 1.05], [0.8, 1.2, 1.55], mix(C.silicon, C.bg, 0.3), op);
          g.cylinder([O[0], O[1], 1.55], [O[0], O[1], 1.8], 0.22, "#222a33", 12);
          boxes.forEach((b) => g.box(b.a, b.b, b.col, op));
          cyls.forEach((c) => g.cylinder([c.x, c.y, c.z0], [c.x, c.y, c.z1], c.r, c.col, 12, op));
          if (!fade) { g.sphere(sph[0].c, sph[0].r, sph[0].col); g.sphere([ped[0], ped[1], 1.95], 0.2, C.purple); }
          // the single pulse (steps 0–3)
          if (step <= 3 && pedT) {
            const hp = [O[0] + pedT * pedDir[0], O[1] + pedT * pedDir[1], O[2] + pedT * pedDir[2]];
            const ph = VIZ.reduceMotion ? 0.5 : ((t - t0) * 0.5) % 1;
            g.line(O, hp, mix(C.gold, C.bg, 0.4), 1.5, [5, 4]);
            const out = step === 0 ? Math.min(1, ph * 2) : ph < 0.5 ? ph * 2 : 2 - ph * 2;
            g.sphere([O[0] + out * pedT * pedDir[0], O[1] + out * pedT * pedDir[1], O[2] + out * pedT * pedDir[2]], 0.16, C.gold);
            if (step >= 2) g.text([(O[0] + hp[0]) / 2 + 0.6, (O[1] + hp[1]) / 2, (O[2] + hp[2]) / 2 + 0.6], `d = ${fmt(pedT, 2)} m`, C.yellow, 14);
            if (step === 3) {
              const dd = (C0 * Math.pow(10, logDt)) / 2;
              for (let k = -2; k <= 2; k++) { const s = Math.round(pedT / dd + k) * dd; if (s <= 0) continue; const q = [O[0] + s * pedDir[0], O[1] + s * pedDir[1], O[2] + s * pedDir[2]]; g.sphere(q, 0.07, k === 0 ? C.yellow : C.red); }
            }
          }

            const az = AZ0 + (((t - t0) * 40) % (AZ1 - AZ0));
            ELS.forEach((el, k) => {
              if (k % 2) return;
              const d = dirOf((az * Math.PI) / 180, el), h = hit(O, d) || 25;
              g.line(O, [O[0] + h * d[0], O[1] + h * d[1], O[2] + h * d[2]], C.gold, 1.2);
            });
          }
          g.text([O[0], O[1] - 0.2, 2.35], "LiDAR", C.gold, 12);
        },
        overlay(ctx, s) {
          if (step < 4) return;
          const az = VIZ.reduceMotion ? AZ1 + 1 : AZ0 + (((s.t - t0) * 40) % (AZ1 - AZ0)) + (step >= 5 ? 1e9 : 0);
          ctx.save();
          cloud.forEach((c) => {
            if (c.az > az) return;
            const P = s.project(c.p);
            ctx.fillStyle = css(ramp(1 - Math.min(1, c.d / 18)));

          });
          ctx.restore();
        },
      });
      ui.slider("timing resolution Δt", -10.5, -8, 0.25, logDt, (v) => { logDt = v; scan(); upd(); return fmt(Math.pow(10, v) * 1e9, 2) + " ns"; });
      ui.steps([
        "At \\( t=0 \\) the laser fires a pulse a few nanoseconds long (905 or 1550 nm, invisible infrared). Light covers 30 cm per nanosecond.",
        "The pulse scatters off the pedestrian and a few photons come back to a fast photodiode (an APD or SPAD) next to the laser. A clock measures the round-trip time \\( t \\).",
        "The light went there and back, so \\( d = c_0\\,t/2 \\). For this pedestrian, the echo time is shown below; 100 m would take 667 ns.",
        "The clock ticks in steps \\( \\Delta t \\), so distance comes in steps \\( \\Delta d = c_0\\,\\Delta t/2 \\): 1 ns → 15 cm, 66.7 ps → 1 cm (red dots = the neighbouring bins).",
        "Now scan: a spinning head fires each channel at elevation \\( \\theta_e \\) while the azimuth \\( \\varphi \\) turns. Each echo gives \\( (x,y,z) = d\\,(\\cos\\theta_e\\sin\\varphi,\\ \\cos\\theta_e\\cos\\varphi,\\ \\sin\\theta_e) \\) from the sensor.",
        "The point cloud: thousands of these points per sweep (1.3 million per second for 64 channels). Points thin out with distance, spacing \\( \\approx d\\,\\Delta\\varphi \\), so far objects get few points.",
      ], (i) => { step = i; t0 = sc.t; upd(); });
      function upd() {
        const dt = Math.pow(10, logDt), dd = (C0 * dt) / 2;
        ui.read.innerHTML =
          `pedestrian: d = <b style="color:${C.yellow}">${fmt(pedT, 2)} m</b> → round trip t = 2d/c = <b>${fmt((2 * pedT) / C0 * 1e9, 2)} ns</b><br>` +
          `timing step Δt = ${fmt(dt * 1e9, 3)} ns → distance step Δd = cΔt/2 = <b style="color:${dd > 0.3 ? C.red : C.green}">${fmt(dd * 100, 1)} cm</b> · ` +
          `${cloud.length} points (8 channels × ${Math.round((AZ1 - AZ0) / DAZ) + 1} azimuths) · spacing at 10 m ≈ ${fmt(10 * (DAZ * Math.PI) / 180 * 100, 0)} cm`;
        if (VIZ.reduceMotion) sc.render();
      }
      upd();
    },
  });

  // ═════════════════════════════════════ 3. pulse oximetry ═════════════════════════════════════
  register("a5-ppg", {
    title: "Live plot · pulse oximetry: two colours of light, a ratio of ratios, SpO₂",
    target: "After this you can read heart rate from a PPG trace and turn the red and infrared pulse sizes into an oxygen saturation.",
    caption: "a finger clip or watch shines red (660 nm) and infrared (940 nm) light into the skin; a photodiode measures what comes back. Each heartbeat swells the arteries, more blood absorbs more light, and the signal dips. The traces show the dip as a percentage of the steady (DC) light. Oxygen-rich blood absorbs little red, so the red dip is small; lower the saturation and the red dip grows while the infrared one stays.",
    links: [
      { id: "A1", why: "light → photocurrent → number: the full measurement chain" },
      { id: "A7", why: "the 1% AC ripple on a big DC level needs filtering and gain" },
      { id: "A8", why: "the SpO₂ formula is an empirical calibration line" },
    ],
    build(fig, ui) {
      let spo2 = 97, hr = 72;
      const ch = chart(ui.body, { w: 640, h: 270, xr: [0, 4], yr: [-2.9, 0.6], xlabel: "time (s)", ylabel: "light change (% of DC)" });
      const red = ch.line("#ff7b6b", 2.4), ir = ch.line(C.gold, 2.4);
      const lr = ch.label("#ff7b6b", 12.5), li = ch.label(C.gold, 12.5);
      const marks = [0, 1, 2, 3, 4, 5, 6].map(() => ch.dot(C.yellow, 3.5));
      const wave = (ph) => { const a = Math.exp(-Math.pow((ph - 0.15) / 0.07, 2)), b = 0.35 * Math.exp(-Math.pow((ph - 0.45) / 0.08, 2)); return (a + b) / 1.0; };
      ui.slider("true SpO₂", 80, 100, 1, spo2, (v) => { spo2 = v; draw(); return v + " %"; });
      ui.slider("heart rate", 45, 150, 1, hr, (v) => { hr = v; draw(); return v + " bpm"; });
      function draw() {
        const Rr = (110 - spo2) / 25, acIR = 2.0, acR = Rr * acIR, f = hr / 60;
        const pr = [], pi = [];
        for (let k = 0; k <= 400; k++) {
          const t = (4 * k) / 400, ph = (t * f) % 1;
          pi.push([t, -acIR * wave(ph)]);
          pr.push([t, -acR * wave(ph)]);
        }
        red.set(pr); ir.set(pi);
        lr.set(3.05, Math.max(-2.75, -acR - 0.3), "red 660 nm"); li.set(3.05, 0.35, "infrared 940 nm");
        marks.forEach((m, k) => { const t = (k + 0.15) / f; if (t <= 4) m.set(t, -acIR * wave(0.15)); else m.set(NaN, NaN); });
        ui.read.innerHTML =
          `AC/DC: red <b style="color:#ff7b6b">${fmt(acR, 2)} %</b>, infrared <b style="color:${C.gold}">${fmt(acIR, 2)} %</b> → ratio of ratios R = ${fmt(Rr, 2)}<br>` +
          `calibration SpO₂ ≈ 110 − 25R = <b style="color:${C.green}">${fmt(110 - 25 * Rr, 1)} %</b> · peaks every ${fmt(60 / hr, 2)} s → <b style="color:${C.yellow}">${hr} bpm</b>` +
          (spo2 < 90 ? ` · <span style="color:${C.red}">below 90 %: low oxygen (hypoxaemia)</span>` : "");
      }
      draw();
    },
  });
})();

</script>
<script>
/* ── A6.js ── */
/* A6 — electrochemical sensors and biosensors: widgets for docs/A6-electrochemical-sensors-and-biosensors.md */
(function () {
  "use strict";
  const { register, C, scene3d, chart, fmt, mix, rng, gauss, H, css } = VIZ;
  const FAR = 96485.33212, RG = 8.314462618;
  const cottrell = (t, cmM, D, n, A) => n * FAR * A * cmM * Math.sqrt(D / (Math.PI * t));   // c in mol/m³ = mM

  // ═════════════════════════════════════ 1. the glucose strip ═════════════════════════════════════
  register("a6-strip-3d", {
    title: "3D · inside a glucose strip: molecules diffuse to the electrode, I ∝ c/√t",
    target: "After this you can explain how a glucose strip turns molecules into electrons, why its current decays as 1/√t (Cottrell), and why reading at a fixed time makes the current proportional to concentration.",
    caption: "a test strip seen close up: the clear box is the capillary chamber full of blood (<span style='color:" + C.water + "'>water blue</span>); <span style='color:" + C.blue + "'>blue balls</span> are glucose molecules (the measurand). On the floor are three printed electrodes: the working electrode (WE, under a green enzyme layer), the reference (RE) and the counter electrode (CE). Step through: once the meter applies its potential, every glucose that reaches the WE gives up 2 electrons (<span style='color:" + C.teal + "'>teal</span>) that run down the lead to the meter. Molecules near the electrode are used up first, so a depletion layer grows (red, thickness √(πDt)) and the hit rate falls. The inset counts hits per half second (yellow) against the Cottrell law (green).",
    links: [
      { id: "C3", why: "the depletion layer is diffusion: it grows like √t" },
      { id: "C4", why: "the blood is pulled into the chamber by capillarity, no pump" },
      { id: "A7", why: "a transimpedance amplifier turns the µA current into volts" },
      { id: "A8", why: "the limit of detection is 3σ of the blank divided by the sensitivity" },
    ],
    build(fig, ui) {
      let cmM = 8, step = 0, simT = 0, hits = [], parts = [], elec = [];
      const X0 = -2.4, X1 = 2.4, Y0 = -1.0, Y1 = 1.0, ZT = 1.7;   // chamber
      const WE = [-1.25, 1.25], RE = [-2.25, -1.6], CE = [1.6, 2.25];
      const Dsim = 0.06, TEND = 8, BIN = 0.5;
      const R = rng(5);
      function reset() {
        const N = Math.round(14 * cmM);
        parts = Array.from({ length: N }, () => [X0 + 0.05 + R() * (X1 - X0 - 0.1), Y0 + 0.05 + R() * (Y1 - Y0 - 0.1), 0.08 + R() * (ZT - 0.12)]);
        hits = new Array(Math.round(TEND / BIN)).fill(0); elec = []; simT = 0;
      }
      reset();
      const theoryRate = (t) => {                     // expected hits per second (planar Cottrell, sim units)
        const conc = parts0() / ((X1 - X0) * (Y1 - Y0) * ZT), A = (WE[1] - WE[0]) * (Y1 - Y0);
        return conc * A * Math.sqrt(Dsim / (Math.PI * Math.max(t, 0.05)));
      };
      const parts0 = () => Math.round(14 * cmM);
      let lastT = 0;
      const sc = scene3d(ui.body, {
        w: 640, h: 430, scale: 66, yaw: -0.5, pitch: 0.5, center: [0.2, 0, 0.5], animate: !VIZ.reduceMotion,
        draw(g, t) {
          const dt = Math.max(0, Math.min(0.05, t - lastT)); lastT = t;
          const on = step >= 2;
          // strip body and leads
          g.box([-3.0, -1.5, -0.12], [4.6, 1.5, 0], "#d9dde2", { bias: -60 });
          g.box([X0, Y0, 0], [X1, Y1, 0.012], "#2a3038", { bias: -30 });
          const elecBox = (r, col) => g.box([r[0], Y0 + 0.12, 0.012], [r[1], Y1 - 0.12, 0.03], col, { bias: -20 });
          elecBox(WE, "#3a434d"); elecBox(RE, "#b8bec6"); elecBox(CE, "#5f6b78");
          g.box([1.0, -0.15, 0.012], [4.4, 0.15, 0.025], on ? mix(C.teal, "#3a434d", 0.4) : "#3a434d", { bias: -20 });   // WE lead
          g.box([-2.1, 1.1, 0.012], [4.4, 1.3, 0.025], "#9aa2ab", { bias: -20 });
          g.box([2.0, -1.3, 0.012], [4.4, -1.1, 0.025], "#5f6b78", { bias: -20 });
          g.text([0, Y0 - 0.25, 0.05], "WE", C.text, 13); g.text([-1.92, Y0 - 0.25, 0.05], "RE", C.text, 13); g.text([1.92, Y0 - 0.25, 0.05], "CE", C.text, 13);
          // enzyme layer on the WE
          g.box([WE[0], Y0 + 0.12, 0.03], [WE[1], Y1 - 0.12, 0.09], mix(C.green, C.bg, step === 1 ? 0.1 : 0.45), { alpha: step === 1 ? 0.9 : 0.6, bias: -10 });
          if (step === 1) g.text([0, 0, 0.35], "glucose oxidase + mediator", C.green, 14);
          // chamber walls (transparent water)
          g.box([X0, Y0, 0.0], [X1, Y1, ZT], C.water, { alpha: 0.07, shade: false, bias: 40 });
          [[X0, Y0], [X1, Y0], [X1, Y1], [X0, Y1]].forEach(([x, y]) => g.line([x, y, 0], [x, y, ZT], mix(C.water, C.bg, 0.3), 1));
          g.polyline([[X0, Y0, ZT], [X1, Y0, ZT], [X1, Y1, ZT], [X0, Y1, ZT], [X0, Y0, ZT]], mix(C.water, C.bg, 0.3), 1);
          // depletion layer
          if (step >= 3) {
            const delta = Math.min(ZT, Math.sqrt(Math.PI * Dsim * Math.max(simT, VIZ.reduceMotion ? 5 : 0)));
            g.box([WE[0], Y0 + 0.02, 0.09], [WE[1], Y1 - 0.02, 0.09 + delta], C.red, { alpha: 0.13, shade: false, bias: 30 });
            g.line([WE[1] + 0.05, Y0, 0.09], [WE[1] + 0.05, Y0, 0.09 + delta], C.red, 2);
            g.text([WE[1] + 0.55, Y0, 0.09 + delta], "δ = √(πDt)", C.red, 13);
          }
          // molecules: random walk with reflecting walls; absorbed at the WE once the potential is on
          const sd = Math.sqrt(2 * Dsim * dt);
          if (!VIZ.reduceMotion && dt > 0) {
            if (on) simT += dt;
            for (let k = parts.length - 1; k >= 0; k--) {
              const p = parts[k];
              p[0] += sd * gauss(R); p[1] += sd * gauss(R); p[2] += sd * gauss(R);
              if (p[0] < X0 + 0.05) p[0] = 2 * (X0 + 0.05) - p[0]; if (p[0] > X1 - 0.05) p[0] = 2 * (X1 - 0.05) - p[0];
              if (p[1] < Y0 + 0.05) p[1] = 2 * (Y0 + 0.05) - p[1]; if (p[1] > Y1 - 0.05) p[1] = 2 * (Y1 - 0.05) - p[1];
              if (p[2] > ZT - 0.05) p[2] = 2 * (ZT - 0.05) - p[2];
              if (p[2] < 0.09) {
                if (on && p[0] > WE[0] && p[0] < WE[1]) {
                  parts.splice(k, 1);
                  const b = Math.floor(simT / BIN); if (b < hits.length) hits[b]++;
                  elec.push({ x: p[0], y: p[1], s: 0 }, { x: p[0] + 0.08, y: p[1] + 0.05, s: -0.1 });
                  continue;
                }
                p[2] = 2 * 0.09 - p[2];
              }
            }
            if (on && simT > TEND) reset();
          }
          parts.forEach((p) => g.sphere(p, 0.065, C.blue));
          // electrons run to the lead, then out along it to the meter
          elec = elec.filter((e) => e.s < 1);
          elec.forEach((e) => {
            if (!VIZ.reduceMotion) e.s += dt * 0.7;
            const u = Math.max(0, e.s), toLead = Math.min(1, u * 3);
            const x = u < 0.34 ? e.x + (WE[1] - e.x) * toLead : WE[1] + (4.4 - WE[1]) * ((u - 0.34) / 0.66);
            const y = u < 0.34 ? e.y * (1 - toLead) : 0;
            g.sphere([x, y, 0.07], 0.045, C.teal);
          });
          if (on) { g.arrow([3.0, 0, 0.35], [4.3, 0, 0.35], C.teal, 2.5); g.text([3.65, 0, 0.6], "e⁻ → meter", C.teal, 13); }
        },
        overlay(ctx) {
          if (step < 4) return;
          const x0 = 430, y0 = 10, w = 200, h = 104;
          ctx.save();
          ctx.fillStyle = "rgba(14,17,22,0.9)"; ctx.strokeStyle = C.grid; ctx.fillRect(x0, y0, w, h); ctx.strokeRect(x0, y0, w, h);
          const nb = hits.length, peak = Math.max(4, theoryRate(BIN / 2) * BIN * 1.1, ...hits);
          const bw = (w - 12) / nb, base = y0 + h - 14, sy = (h - 32) / peak;
          hits.forEach((v, i) => { if ((i + 1) * BIN <= simT + BIN) { ctx.fillStyle = C.yellow; ctx.fillRect(x0 + 6 + i * bw + 1, base - v * sy, bw - 2, v * sy); } });
          ctx.strokeStyle = C.green; ctx.lineWidth = 2; ctx.beginPath();
          for (let i = 0; i <= 80; i++) { const tt = 0.15 + (TEND - 0.15) * (i / 80), X = x0 + 6 + (tt / TEND) * (w - 12), Y = base - theoryRate(tt) * BIN * sy; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
          ctx.stroke();
          ctx.font = "11px JetBrains Mono, ui-monospace, monospace"; ctx.textBaseline = "top"; ctx.fillStyle = C.yellow; ctx.fillText("hits / 0.5 s", x0 + 6, y0 + 4);
          ctx.fillStyle = C.green; ctx.fillText("∝ 1/√t", x0 + 120, y0 + 4);
          ctx.fillStyle = C.dim; ctx.fillText("t → " + TEND + " s", x0 + 130, base + 2);
          ctx.restore();
        },
      });
      ui.slider("glucose c", 2, 20, 1, cmM, (v) => { cmM = v; reset(); upd(); return v + " mM (" + fmt(v * 18.016, 0) + " mg/dL)"; });
      ui.button("restart", () => { reset(); upd(); });
      ui.steps([
        "A drop of blood touches the strip's edge and capillary action pulls about half a microlitre into the chamber. Glucose (blue) is spread evenly at concentration \\( c \\) (5 mM ≈ 90 mg/dL is a normal fasting level).",
        "The working electrode carries an enzyme, glucose oxidase (GOx), and a mediator. GOx grabs only glucose, the lock-and-key selectivity, and oxidises it; the mediator carries the 2 electrons per glucose to the electrode.",
        "The meter now holds the working electrode at a fixed potential against the reference electrode (a potentiostat). Each glucose that reaches the WE delivers \\( n = 2 \\) electrons, and the counter electrode closes the circuit. Current \\( I = n\\mathcal F \\times \\) (moles arriving per second).",
        "Molecules close to the electrode are used up first. To keep arriving, the rest must diffuse across a growing empty layer of thickness \\( \\delta \\approx \\sqrt{\\pi D t} \\), about 100 µm after 5 s for \\( D = 6.7\\times10^{-10} \\) m²/s.",
        "Flux = \\( D\\,c/\\delta \\), so the current falls as the layer grows: the Cottrell equation \\( I(t) = n\\mathcal F A\\,c\\,\\sqrt{\\dfrac{D}{\\pi t}} \\). Four times longer, half the current (inset).",
        "Everything except \\( c \\) is fixed by the strip design: read the current at a fixed time (say 5 s) and \\( I \\propto c \\). One calibration factor in µA/mM turns the current into mg/dL.",
      ], (i) => { step = i; if (i === 2) reset(); upd(); });
      function upd() {
        const D = 6.7e-10, A = 1e-6;
        ui.read.innerHTML =
          `c = <b style="color:${C.blue}">${cmM} mM</b> = ${fmt(cmM * 18.016, 0)} mg/dL · real strip: n = 2, A = 1 mm², D = 6.7×10⁻¹⁰ m²/s<br>` +
          `Cottrell: I(1 s) = ${fmt(cottrell(1, cmM, D, 2, A) * 1e6, 2)} µA, <b style="color:${C.yellow}">I(5 s) = ${fmt(cottrell(5, cmM, D, 2, A) * 1e6, 2)} µA</b>, ` +
          `δ(5 s) = ${fmt(Math.sqrt(Math.PI * D * 5) * 1e6, 0)} µm · sensitivity ${fmt(cottrell(5, 1, D, 2, A) * 1e6, 2)} µA/mM`;
        if (VIZ.reduceMotion) sc.render();
      }
      upd();
    },
  });

  // ═════════════════════════════════════ 2. the Nernst equation ═════════════════════════════════════
  register("a6-nernst", {
    title: "Live plot · the Nernst line: about 59 mV per factor of ten",
    target: "After this you can derive the 59 mV/decade slope, read a pH or nitrate concentration off a potentiometric sensor, and say why the slope depends on temperature and on the ion's charge.",
    caption: "horizontal axis: log₁₀ of the ion activity (roughly its concentration in mol/L), so each grid step is a factor of ten; vertical axis: the electrode potential against the reference. For the pH electrode, log₁₀a = −7 is pH 7, where a typical glass electrode reads 0 mV. The <span style='color:" + C.green + "'>green line</span> is the Nernst model, the <span style='color:" + C.yellow + "'>yellow dot</span> a measurement read back to a pH. Step through the derivation; then change the temperature and watch the line tilt about pH 7, which is why pH meters carry a thermometer. (Lines for other ions are drawn through the same point to compare their slopes.)",
    links: [
      { id: "A1", why: "a sensor whose output is linear in log c, not in c" },
      { id: "A8", why: "two-point calibration with pH 4 and pH 7 buffers fixes the offset and the slope" },
      { id: "A2", why: "the same temperature-drift problem as a thermistor, solved by compensation" },
    ],
    build(fig, ui) {
      let T = 25, z = 1, step = 0;
      const ZS = [-1, 1, 2];
      const ch = chart(ui.body, { w: 640, h: 310, xr: [-8, 0], yr: [-450, 450], xlabel: "log₁₀ activity a   (pH = −log₁₀ a_H+)", ylabel: "V (mV)" });
      const slope = (Tc, zz) => ((RG * (Tc + 273.15) * Math.log(10)) / (zz * FAR)) * 1e3;   // mV per decade
      const Vof = (la, Tc, zz) => slope(Tc, zz) * (la + 7);                                   // 0 mV at a = 10⁻⁷
      const line = (Tc, zz) => [[-8, Vof(-8, Tc, zz)], [0, Vof(0, Tc, zz)]];
      const lines = [ch.line(C.green, 2.8), ch.line(C.dim, 1.6, "6 4"), ch.line(css(mix(C.green, C.bg, 0.35)), 2, "3 3"), ch.line(css(mix(C.purple, C.white, 0.2)), 2, "3 3")];
      const tri = [ch.line(C.yellow, 2), ch.line(C.yellow, 2)];
      const lab = [ch.label(C.green, 12.5), ch.label(C.yellow, 12.5), ch.label(C.dim, 12), ch.label(css(mix(C.green, C.white, 0.2)), 12), ch.label(css(mix(C.purple, C.white, 0.2)), 12)];
      const vl = ch.vline(C.green), hl = ch.hline(C.yellow), dot = ch.dot(C.yellow, 5.5);
      const VM = 118.3;                                                                       // a measured pH-electrode voltage
      ui.slider("temperature", 0, 60, 1, T, (v) => { T = v; draw(); return v + " °C"; });
      ui.slider("ion charge z", 0, 2, 1, 1, (v) => { z = ZS[v]; draw(); return (z > 0 ? "+" : "") + z + (z === 1 ? " (H⁺, K⁺)" : z === 2 ? " (Ca²⁺)" : " (NO₃⁻)"); });
      ui.steps([
        "Dip an electrode in a solution of an ion. Ions trade electrons with the electrode (or cross a selective membrane) until a voltage builds up that stops any further net exchange: equilibrium, and no current flows.",
        "At equilibrium the electrical work per mole balances the chemical free energy: \\( z\\mathcal F V = z\\mathcal F V^0 + R_gT\\ln a \\), with \\( a \\) the ion activity and \\( z \\) its charge. So \\( V = V^0 + \\dfrac{R_gT}{z\\mathcal F}\\ln a \\) (green line).",
        "Switch to base 10: \\( \\ln a = \\ln 10\\cdot\\log_{10} a \\). The slope per decade is \\( \\dfrac{R_gT\\ln 10}{z\\mathcal F} = \\dfrac{8.314\\times298.15\\times2.303}{96485}\\ \\text{V} = 59.16 \\) mV at 25 °C for \\( z=1 \\) (the yellow triangle spans one decade).",
        "A pH electrode responds to H⁺, and \\( \\mathrm{pH} = -\\log_{10} a_{\\mathrm{H^+}} \\). With 0 mV at pH 7: \\( V = 59.16\\ \\text{mV}\\times(7-\\mathrm{pH}) \\). Read back: the yellow dot at 118.3 mV means \\( \\mathrm{pH} = 7 - 118.3/59.16 = 5.00 \\).",
        "The slope is proportional to the absolute temperature \\( T \\): 54.2 mV at 0 °C, 61.5 mV at 37 °C (dashed: the 25 °C line). Without temperature compensation a reading 3 pH units from pH 7 is off by about 0.12 pH at body temperature.",
        "The charge matters: \\( z=2 \\) (Ca²⁺) halves the slope to 29.6 mV/decade; a negative ion such as nitrate (\\( z=-1 \\)) gives a falling line. That is the principle of every ion-selective electrode: soil nitrate, sodium in sweat, potassium in blood.",
      ], (i) => { step = i; draw(); });
      function draw() {
        const s = slope(T, z), s25 = slope(25, z);
        lines[0].set(step >= 1 ? line(T, z) : []);
        lines[1].set(step >= 4 ? line(25, z) : []);
        lines[2].set(step >= 5 ? line(T, 2) : []);
        lines[3].set(step >= 5 ? line(T, -1) : []);
        if (step >= 2) {
          const a = -4, b = -3, va = Vof(a, T, z), vb = Vof(b, T, z);
          tri[0].set([[a, va], [b, va]]); tri[1].set([[b, va], [b, vb]]);
          lab[1].set(b + 0.12, (va + vb) / 2, fmt(Math.abs(s), 1) + " mV / decade");
        } else { tri[0].set([]); tri[1].set([]); lab[1].set(-20, 0, ""); }
        lab[0].set(step >= 1 ? -7.85 : -20, step >= 1 ? (z > 0 ? 400 : -400) : 0, step >= 1 ? `V = ${fmt(s, 1)} mV × (log₁₀a + 7)` : "");
        lab[2].set(step >= 4 ? -1.3 : -20, Vof(-1.3, 25, z) + (z > 0 ? -34 : 34), step >= 4 ? "25 °C" : "");
        lab[3].set(step >= 5 ? -1.2 : -20, Vof(-1.2, T, 2) + 26, step >= 5 ? "z = 2" : "");
        lab[4].set(step >= 5 ? -2.4 : -20, Vof(-2.0, T, -1) - 30, step >= 5 ? "z = −1 (nitrate)" : "");
        const pH = 7 - VM / slope(T, 1);
        if (step >= 3 && z === 1) { const la = -pH; dot.set(la, VM); vl.set(la); hl.set(VM); }
        else { dot.set(NaN, NaN); vl.set(-20); hl.set(-1000); }
        ui.read.innerHTML =
          `T = ${T} °C, z = ${z} → slope R_gT ln10/(z𝓕) = <b style="color:${C.green}">${fmt(s, 2)} mV/decade</b> (at 25 °C: ${fmt(s25, 2)})<br>` +
          (z === 1 ? `pH electrode (0 mV at pH 7), measured <b style="color:${C.yellow}">${VM} mV</b> → pH = 7 − V/slope = <b>${fmt(pH, 2)}</b>` +
            (Math.abs(T - 25) > 0.5 ? ` · <span style="color:${C.red}">if the meter wrongly assumes 25 °C: ${fmt(7 - VM / slope(25, 1), 2)}</span>` : "") :
            `a factor of 10 in concentration moves V by ${fmt(s, 1)} mV; a 5 mV error looks like a factor ${fmt(Math.pow(10, 5 / Math.abs(s)), 2)} in concentration`);
      }
      draw();
    },
  });

  // ═════════════════════════════════════ 3. Cottrell decay and the limit of detection ═════════════════════════════════════
  register("a6-cottrell", {
    title: "Live plot · Cottrell decay: when to read a strip, and the smallest glucose it can see",
    target: "After this you can predict an amperometric sensor's current at any time, choose a reading time, and compute a limit of detection from the blank noise.",

          S("circle", { cx, cy, r: 36, fill: "#141b23", stroke: "#26313d" }, fr);
          for (let b = 0; b < 2; b++) {
            const a = th + b * Math.PI, ex = cx + L * Math.sin(a), ey = cy - L * Math.cos(a);
            S("line", { x1: cx, y1: cy, x2: ex, y2: ey, stroke: C.purple, "stroke-width": 7, "stroke-linecap": "round" }, fr);
            if (b === 0) S("circle", { cx: cx + 0.8 * L * Math.sin(a), cy: cy - 0.8 * L * Math.cos(a), r: 2.6, fill: C.yellow }, fr);
          }
          S("circle", { cx, cy, r: 4, fill: C.silicon }, fr);
          const t = S("text", { x: cx, y: 106, fill: C.dim, "font-size": 11, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, fr);
          t.textContent = "frame " + (k + 1);
        }
        const rpm = (f / 2) * 60, appRev = fa / 2;
        ui.read.innerHTML = `f = <b>${fmt(f, 1)} Hz</b> · f_s = <b>${fmt(fs, 0)} Hz</b> · Nyquist f_s/2 = ${fmt(fs / 2, 1)} Hz · ` +
          `appears as <b style="color:${ok ? C.green : C.red}">${fmt(Math.abs(fa), 2)} Hz</b> ${ok ? "(correct)" : "(alias!)"}<br>` +
          `as a two-blade propeller: ${fmt(rpm, 0)} rpm → looks like ${Math.abs(appRev) < 1e-6 ? "<b>frozen</b>" : fmt(Math.abs(appRev), 2) + " rev/s " + (appRev < 0 ? "<b>backwards</b>" : "forwards")}`;
      }
      const sF = ui.slider("signal f", 0, 200, 0.01, f, (v) => { f = v; draw(); return fmt(v, 1) + " Hz"; });
      const sS = ui.slider("sampling f_s", 10, 400, 1, 400, (v) => { fs = v; draw(); return fmt(v, 0) + " Hz"; });
      const preset = (a, b) => { f = a; fs = b; sF.set(a); sS.set(b); draw(); };
      ui.button("60 Hz hum, f_s = 400 Hz", () => preset(60, 400));
      ui.button("60 Hz hum, f_s = 100 Hz", () => preset(60, 100));
      ui.button("prop 5300 rpm, 30 fps", () => preset(176.67, 30));
      ui.button("prop 5400 rpm, 30 fps", () => preset(180, 30));
      preset(60, 100);
    },
  });

  // ── a7-adc-3d: the quantisation staircase, its error ribbon, and the 6.02 N + 1.76 dB rule ────────────
  register("a7-adc-3d", {
    title: "3D · an ADC turns a ramp into a staircase: Δ = V_ref/2^N, error rms = Δ/√12",
    target: "See how the number of bits N sets the step size Δ, why the rounding error is a uniform ±Δ/2 'noise' with rms Δ/√12, and where SNR ≈ 6.02 N + 1.76 dB comes from.",
    caption: "three layers, front to back: the <span style='color:" + C.blue + "'>analogue input</span> v(t) (blue line), the <span style='color:" + C.yellow + "'>ADC codes</span> (yellow columns, one per sample) and the <span style='color:" + C.red + "'>error</span> e = code·Δ − v, magnified so that ±Δ/2 always fills the same band. Each extra bit halves Δ and the error, which is +6.02 dB of SNR. Drag to orbit; look along the time axis to see the staircase hug the ramp.",
    links: [
      { id: "A5", why: "each camera pixel's charge goes through exactly this staircase (bit depth of a RAW photo)" },
      { id: "A8", why: "Δ/√12 adds to the other noise sources; resolution is limited by the larger one" },
      { id: "A2", why: "the bridge's millivolts need gain before they span many steps" },
    ],
    build(fig, ui) {
      let N = 3, sine = false;
      const Vref = 3.3, ns = 64, X0 = -4.2, X1 = 4.2, Zs = 4 / Vref;   // 3.3 V → 4 scene units
      const yIn = -1.7, yQ = 0, yE = 1.9, zE = 5.1, eBand = 0.55;
      const vin = (u) => (sine ? Vref / 2 + (Vref / 2) * 0.98 * Math.sin(2 * Math.PI * u) : Vref * (0.02 + 0.96 * u));
      const quant = (v) => { const d = Vref / Math.pow(2, N); const k = Math.min(Math.pow(2, N) - 1, Math.max(0, Math.floor(v / d))); return (k + 0.5) * d; };
      const sc = scene3d(ui.body, {
        w: 640, h: 420, scale: 49, yaw: -0.5, pitch: 0.3, center: [0, 0.1, 2.85], dist: 30,
        draw(g) {
          g.grid(0, [X0, X1], [-2.4, 2.6], 0.6);
          const dx = (X1 - X0) / ns, d = Vref / Math.pow(2, N);
          // input line (blue) on its own layer
          const ip = []; for (let i = 0; i <= 160; i++) { const u = i / 160; ip.push([X0 + (X1 - X0) * u, yIn, vin(u) * Zs]); }
          g.polyline(ip, C.blue, 3);
          g.poly([[X0, yIn, 0], [X1, yIn, 0], [X1, yIn, Vref * Zs], [X0, yIn, Vref * Zs]], C.blue, { alpha: 0.06, shade: false });
          // ADC code columns (yellow)
          for (let i = 0; i < ns; i++) {
            const u = (i + 0.5) / ns, q = quant(vin(u)), x = X0 + i * dx;
            g.box([x + 0.01, yQ - 0.32, 0], [x + dx - 0.01, yQ + 0.32, q * Zs], mix(C.yellow, "#8a6d10", 0.15 + 0.35 * (i % 2)));
          }
          // reference levels of the staircase (faint) when there are few of them
          if (N <= 4) for (let k = 0; k <= Math.pow(2, N); k++) g.line([X1 + 0.05, yQ + 0.32, k * d * Zs], [X1 + 0.35, yQ + 0.32, k * d * Zs], C.dim, 1);
          // error ribbon (red), magnified: ±Δ/2 → ±eBand
          g.poly([[X0, yE, zE - eBand], [X1, yE, zE - eBand], [X1, yE, zE + eBand], [X0, yE, zE + eBand]], C.red, { alpha: 0.07, shade: false });
          g.line([X0, yE, zE], [X1, yE, zE], C.dim, 1, [4, 4]);
          const ep = []; for (let i = 0; i <= 400; i++) { const u = i / 400, v = vin(u); ep.push([X0 + (X1 - X0) * u, yE, zE + ((quant(v) - v) / (d / 2)) * eBand]); }
          g.polyline(ep, C.red, 2);
          g.text([X0 - 0.2, yIn, vin(0) * Zs + 0.45], "input v(t)", C.blue, 13, "end");
          g.text([X0 - 0.2, yQ, 0.5], "ADC codes", C.yellow, 13, "end");
          g.text([X0 - 0.2, yE, zE + eBand + 0.3], "error (±Δ/2 band)", C.red, 13, "end");
          g.text([X1 + 0.3, yIn, -0.35], "time →", C.dim, 12);
          g.line([X0, yIn - 0.4, 0], [X0, yIn - 0.4, Vref * Zs], C.axis, 1.4);
          g.text([X0, yIn - 0.75, Vref * Zs], "3.3 V", C.dim, 12);
          g.text([X0, yIn - 0.75, 0], "0 V", C.dim, 12);
        },
      });
      function stats() {
        const d = Vref / Math.pow(2, N); let e2 = 0, s2 = 0; const M = 20000;
        for (let i = 0; i < M; i++) { const u = (i + 0.37) / M, v = vin(u), e = quant(v) - v; e2 += e * e; s2 += (v - Vref / 2) ** 2; }
        const erms = Math.sqrt(e2 / M), snr = 10 * Math.log10(s2 / e2);
        const vs = (x) => (x >= 1e-3 ? fmt(x * 1e3, 1) + " mV" : fmt(x * 1e6, 1) + " µV");
        ui.read.innerHTML = `N = <b>${N} bits</b> → 2^N = ${Math.pow(2, N)} levels · Δ = V_ref/2^N = <b>${vs(d)}</b> · ` +
          `error rms: measured <b style="color:${C.red}">${vs(erms)}</b>, theory Δ/√12 = ${vs(d / Math.sqrt(12))}<br>` +
          (sine ? `full-scale sine: SNR measured <b>${fmt(snr, 1)} dB</b>, rule 6.02N + 1.76 = <b>${fmt(6.02 * N + 1.76, 1)} dB</b>`
                : `ramp input: the error is a sawtooth, uniform between −Δ/2 and +Δ/2 (switch to a sine for the SNR rule)`);
      }
      ui.slider("bits N", 1, 10, 1, N, (v) => { N = v; sc.render(); stats(); return v + " bit"; });
      ui.button("ramp", () => { sine = false; sc.render(); stats(); });
      ui.button("full-scale sine", () => { sine = true; sc.render(); stats(); });
      stats();
    },
  });
})();

<script>
/* ── A8.js ── */
/* A8 — noise, resolution, calibration and drift: widgets for docs/A8-noise-resolution-calibration-and-drift.md */
(function () {
  "use strict";
  const { register, C, scene3d, chart, fmt, rng, gauss, ramp, tween, lerp, S, H } = VIZ;

  // ── a8-target: accuracy (bias) vs precision (spread) ─────────────────────────────────────────────────────
  register("a8-target", {
    title: "Accuracy vs precision · bias is a shift, noise is a spread",
    target: "Tell a systematic error (bias, fixed by calibration) from a random error (spread σ, reduced by averaging), and combine them as rms error = √(bias² + σ²).",
    caption: "each red dot is one reading; the centre of the target is the true value. The yellow ✕ is the mean of the 40 readings and the yellow circle its uncertainty σ/√40. The histogram on the right shows the horizontal coordinate of the readings: its width is the precision, its offset from the blue true value is the accuracy. Note how averaging shrinks the yellow circle but never moves it onto the bull's-eye.",
    links: [
      { id: "A1", why: "the ideal sensor line y = y₀ + S s: a wrong y₀ is pure bias" },
      { id: "A9", why: "fusion weights each sensor by its spread σ, never by its bias" },
      { id: "A6", why: "a glucose strip from a bad batch is precise but inaccurate until it is coded" },
    ],
    build(fig, ui) {
      let bias = 1.2, sig = 0.5, seed = 3;
      const row = H("div", { style: "display:flex;gap:0;align-items:center" }, ui.body);
      const left = H("div", { style: "flex:1 1 50%" }, row), right = H("div", { style: "flex:1 1 50%" }, row);
      const sv = S("svg", { viewBox: "0 0 320 300", role: "img", "aria-label": "target with shots" }, left);
      const hist = chart(right, { w: 320, h: 300, xr: [-3, 3], yr: [0, 1.2], xlabel: "horizontal reading", ylabel: "density", ml: 40, mr: 10 });
      const cx = 160, cy = 150, U = 32;     // pixels per unit; rings every unit
      const gT = S("g", {}, sv), gS = S("g", {}, sv);
      for (let k = 4; k >= 1; k--) S("circle", { cx, cy, r: k * U, fill: k % 2 ? "#1a2230" : "#141b25", stroke: "#2c3a4a" }, gT);
      S("circle", { cx, cy, r: 5, fill: C.blue }, gT);
      S("line", { x1: cx - 4.3 * U, y1: cy, x2: cx + 4.3 * U, y2: cy, stroke: "#2c3a4a", "stroke-dasharray": "3 3" }, gT);
      const bars = S("g", {}, hist.gMain), gauss1 = hist.line(C.red, 2), vT = hist.vline(C.blue, ""), vM = hist.vline(C.yellow, "5 3");
      const lb = hist.label(C.red, 11.5);
      function draw() {
        const r = rng(seed), pts = [];
        const bx = bias * Math.cos(Math.PI / 5), by = bias * Math.sin(Math.PI / 5);
        for (let i = 0; i < 40; i++) pts.push([bx + sig * gauss(r), by + sig * gauss(r)]);
        gS.innerHTML = "";
        let mx = 0, my = 0; pts.forEach((p) => { mx += p[0] / 40; my += p[1] / 40; });
        pts.forEach((p) => S("circle", { cx: cx + p[0] * U, cy: cy - p[1] * U, r: 4, fill: C.red, "fill-opacity": 0.85 }, gS));
        S("circle", { cx: cx + mx * U, cy: cy - my * U, r: Math.max(2, (sig / Math.sqrt(40)) * U), fill: "none", stroke: C.yellow, "stroke-width": 1.6 }, gS);
        const X = cx + mx * U, Y = cy - my * U;
        S("path", { d: `M${X - 6},${Y - 6}L${X + 6},${Y + 6}M${X - 6},${Y + 6}L${X + 6},${Y - 6}`, stroke: C.yellow, "stroke-width": 2.6 }, gS);
        if (Math.hypot(mx, my) > 0.25) {
          S("line", { x1: cx, y1: cy, x2: X, y2: Y, stroke: C.yellow, "stroke-width": 1.4, "stroke-dasharray": "4 3" }, gS);
        }
        // histogram of x
        bars.innerHTML = "";
        const bw = 0.3, cnt = {};
        pts.forEach((p) => { const k = Math.floor(p[0] / bw); cnt[k] = (cnt[k] || 0) + 1; });
        Object.keys(cnt).forEach((k) => {
          const x0 = k * bw, h = cnt[k] / (40 * bw);
          S("rect", { x: hist.X(x0), y: hist.Y(Math.min(1.2, h)), width: hist.X(x0 + bw) - hist.X(x0) - 1, height: hist.Y(0) - hist.Y(Math.min(1.2, h)), fill: C.red, "fill-opacity": 0.35 }, bars);
        });
        const gp = []; for (let i = 0; i <= 120; i++) { const x = -3 + i / 20; gp.push([x, Math.exp(-0.5 * ((x - bx) / sig) ** 2) / (sig * Math.sqrt(2 * Math.PI))]); }
        gauss1.set(gp); vT.set(0); vM.set(mx);
        lb.set(-2.85, 1.12, "σ = " + fmt(sig, 2));
        const rms = Math.sqrt(bias * bias + 2 * sig * sig);
        ui.read.innerHTML = `bias (accuracy) = <b style="color:${C.yellow}">${fmt(bias, 2)}</b> rings · spread per axis (precision) σ = <b style="color:${C.red}">${fmt(sig, 2)}</b> · ` +
          `mean of 40 lands within σ/√40 = ${fmt(sig / Math.sqrt(40), 3)} of the biased point · rms distance from centre = √(bias² + 2σ²) = <b>${fmt(rms, 2)}</b>`;
      }
      const sB = ui.slider("bias", 0, 2.5, 0.05, bias, (v) => { bias = v; draw(); return fmt(v, 2); });
      const sS = ui.slider("spread σ", 0.05, 1.5, 0.05, sig, (v) => { sig = v; draw(); return fmt(v, 2); });
      const pre = (b, s) => { sB.set(b); sS.set(s); };
      ui.button("accurate + precise", () => pre(0, 0.15));
      ui.button("precise, not accurate", () => pre(2, 0.15));
      ui.button("accurate, not precise", () => pre(0, 1.1));
      ui.button("new shots", () => { seed++; draw(); });
      draw();
    },
  });

  // ── a8-averaging: σ/√M, and the price you pay for it ────────────────────────────────────────────────────
  register("a8-averaging", {
    title: "Averaging · M readings shrink random noise to σ_n/√M",
    target: "Derive why the mean of M independent readings has noise σ_n/√M, predict how many samples buy a given resolution, and see the two prices: a slower response and no help against bias.",
    caption: "top: readings (yellow dots) of a <span style='color:" + C.blue + "'>true value</span> that steps from 2 to 3 at sample 100, and the running mean of the last M readings (green). Bottom: histograms of 4000 single readings (red) and 4000 M-sample means (green), each with its Gaussian. Quadrupling M halves the green width; the green line also reacts M samples late to the step.",
    links: [
      { id: "A7", why: "a running mean is a digital low-pass filter: narrower bandwidth, less noise" },
      { id: "A9", why: "the Kalman filter is an average that knows how much to trust each new sample" },
      { id: "B1", why: "the same √M law makes Brownian motion spread as √t" },
      { id: "A5", why: "photon shot noise is why long exposures and pixel binning look smoother" },
    ],
    build(fig, ui) {
      let kM = 3, sig = 0.4, step = 0;
      const N = 200, NH = 4000;
      const r = rng(11), z = new Float64Array(NH * 64);
      for (let i = 0; i < z.length; i++) z[i] = gauss(r);
      const tr = chart(ui.body, { w: 640, h: 220, xr: [0, N], yr: [0.5, 4.5], xlabel: "sample number", ylabel: "reading" });
      const holder = H("div", {}, ui.body);
      const truth = tr.line(C.blue, 2, "6 4"), avg = tr.line(C.green, 3), off = tr.line(C.red, 2, "3 3");
      const dots = S("g", {}, tr.gMain);
      const lab = tr.label(C.green, 12.5), lab2 = tr.label(C.red, 12);
      const lagV = tr.vline(C.dim, "2 3");
      function draw() {
        const M = Math.pow(2, kM), b = step >= 5 ? 0.6 : 0;
        const tv = (i) => (i < 100 ? 2 : 3);
        truth.set([[0, 2], [100, 2], [100, 3], [N, 3]]);
        const y = []; for (let i = 0; i < N; i++) y.push(tv(i) + b + sig * z[i]);
        dots.innerHTML = "";
        y.forEach((v, i) => S("circle", { cx: tr.X(i), cy: tr.Y(Math.max(0.5, Math.min(4.5, v))), r: 2.3, fill: C.yellow, "fill-opacity": 0.8 }, dots));
        const showAvg = step >= 1;
        const ap = []; let s = 0;
        for (let i = 0; i < N; i++) { s += y[i]; if (i >= M) s -= y[i - M]; if (i >= M - 1) ap.push([i, s / M]); }
        avg.set(showAvg ? ap : []);
        lab.set(4, 4.25, showAvg ? "running mean of M = " + M : "");
        off.set(step >= 5 ? [[0, 2 + b], [100, 2 + b], [100, 3 + b], [N, 3 + b]] : []);
        lab2.set(108, 1.0, step >= 5 ? "an offset survives any averaging" : "");
        if (step === 4) lagV.set(100 + M); else lagV.set(-10);
        dots.setAttribute("opacity", step === 4 ? 0.35 : 1);
        // histograms
        holder.innerHTML = "";
        const sm = sig / Math.sqrt(M), top = 1.2 / (Math.sqrt(2 * Math.PI) * (step >= 2 ? sm : sig));
        const hc = chart(holder, { w: 640, h: 180, xr: [-2.4, 2.4], yr: [0, top], xlabel: "reading − true value", ylabel: "density", mt: 10 });
        const bin = (vals, w, col, a) => {
          const cnt = {}; vals.forEach((v) => { const k = Math.floor(v / w); cnt[k] = (cnt[k] || 0) + 1; });
          Object.keys(cnt).forEach((k) => { const h = Math.min(top, cnt[k] / (vals.length * w)); S("rect", { x: hc.X(k * w), y: hc.Y(h), width: Math.max(0.5, hc.X((+k + 1) * w) - hc.X(k * w) - 0.6), height: hc.Y(0) - hc.Y(h), fill: col, "fill-opacity": a }, hc.gMain); });
        };
        const raw = [], mean = [];
        for (let i = 0; i < NH; i++) raw.push(sig * z[i] + b);
        for (let i = 0; i < NH; i++) { let q = 0; for (let j = 0; j < M; j++) q += z[i * M + j]; mean.push((sig * q) / M + b); }
        bin(raw, 0.08, C.red, 0.35);
        const gc = (sd, col, w) => { const l = hc.line(col, w); const p = []; for (let i = 0; i <= 240; i++) { const x = -2.4 + i / 50; p.push([x, Math.exp(-0.5 * ((x - b) / sd) ** 2) / (sd * Math.sqrt(2 * Math.PI))]); } l.set(p); };
        gc(sig, C.red, 2);
        let measured = 0;
        if (step >= 2) {
          bin(mean, Math.max(0.01, Math.min(0.08, sm / 3)), C.green, 0.45); gc(sm, C.green, 2.4);
          let mu = 0; mean.forEach((v) => (mu += v / NH)); mean.forEach((v) => (measured += (v - mu) ** 2 / (NH - 1))); measured = Math.sqrt(measured);
        }
        if (step >= 3) {
          [-1, 1].forEach((sgn) => { hc.vline(C.green, "4 3").set(b + sgn * sm); hc.vline(C.red, "2 3").set(b + sgn * sig); });
          hc.label(C.green, 12, "middle").set(b, top * 0.93, "±σ_n/√M");
        }
        hc.vline(C.blue, "").set(0);
        ui.read.innerHTML = `σ_n = <b style="color:${C.red}">${fmt(sig, 2)}</b> · M = <b>${M}</b> · σ_n/√M = <b style="color:${C.green}">${fmt(sm, 3)}</b>` +
          (step >= 2 ? ` · measured std of the 4000 means = ${fmt(measured, 3)}` : "") +
          ` · at 10 readings/s one mean takes ${fmt(M / 10, 1)} s` + (step >= 5 ? ` · <span style="color:${C.red}">offset 0.6 still there</span>` : "");
      }
      ui.slider("average M", 0, 6, 1, kM, (v) => { kM = v; draw(); return String(Math.pow(2, v)); });
      ui.slider("noise σ_n", 0.1, 0.8, 0.05, sig, (v) => { sig = v; draw(); return fmt(v, 2); });
      ui.steps([
        "One reading is truth plus noise: \\( y_i = s + n_i \\), with \\( n_i \\) Gaussian, mean 0, standard deviation \\( \\sigma_n \\) (red histogram).",
        "Average \\( M \\) readings: \\( \\bar y = \\tfrac{1}{M}\\sum_{i=1}^{M} y_i = s + \\tfrac{1}{M}\\sum n_i \\). The truth \\( s \\) survives untouched (green line).",
        "For independent noise, variances add: \\( \\operatorname{Var}\\big(\\sum n_i\\big) = M\\sigma_n^2 \\). Dividing by \\( M \\) divides the variance by \\( M^2 \\): \\( \\operatorname{Var}(\\bar y) = \\sigma_n^2/M \\).",
        "So \\( \\sigma_{\\bar y} = \\sigma_n/\\sqrt M \\). Four times the samples halves the noise; 100 samples cut it tenfold (dashed lines: ±σ_n and ±σ_n/√M).",
        "The price: the mean only reacts after \\( M \\) new samples (dashed line at sample \\( 100 + M \\)). Averaging is a low-pass filter (A7): bandwidth down, noise down, response slower.",
        "It only fights <i>random</i> noise. A systematic offset (red dashed, +0.6) is in every reading, so it is in the mean too. Only calibration removes it.",
      ], (i) => { step = i; draw(); });
    },
  });

  // ── a8-calibration-3d: magnetometer ellipsoid → sphere (hard and soft iron) ─────────────────────────────
  const mv = (A, v) => [0, 1, 2].map((i) => A[i][0] * v[0] + A[i][1] * v[1] + A[i][2] * v[2]);
  const tr3 = (A) => [0, 1, 2].map((i) => [A[0][i], A[1][i], A[2][i]]);
  function solve(A, b) {           // Gaussian elimination with partial pivoting
    const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
    for (let c = 0; c < n; c++) {
      let p = c; for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = c + 1; r < n; r++) { const f = M[r][c] / M[c][c]; for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k]; }
    }
    const x = new Array(n).fill(0);
    for (let r = n - 1; r >= 0; r--) { let s = M[r][n]; for (let k = r + 1; k < n; k++) s -= M[r][k] * x[k]; x[r] = s / M[r][r]; }
    return x;
  }
  function jacobi(A) {             // eigen-decomposition of a symmetric 3×3: A = V diag(l) Vᵀ
    const a = A.map((r) => r.slice()), V = [[1, 0, 0], [0, 1, 0], [0, 0, 1]];
    for (let sweep = 0; sweep < 30; sweep++) {
      for (const [p, q] of [[0, 1], [0, 2], [1, 2]]) {
        if (Math.abs(a[p][q]) < 1e-14) continue;

    }
    return { l: [a[0][0], a[1][1], a[2][2]], V };
  }

  register("a8-calibration-3d", {
    title: "3D · calibrating a phone compass: an offset, tilted ellipsoid becomes a sphere",
    target: "Explain hard-iron (offset) and soft-iron (scale and tilt) errors of a 3-axis magnetometer, and calibrate it by fitting an ellipsoid, removing its centre, and rescaling its axes to the known field of 50 µT.",
    caption: "every dot is one raw reading of the field (Bx, By, Bz) while the phone is turned in all directions; ideally they would lie on the grey sphere of radius 50 µT. Colour = the length of each reading: <span style='color:#8fb3e6'>blue</span> too short, white about 50 µT, <span style='color:#f0a08f'>red</span> too long. Step through the calibration and watch the cloud move onto the sphere and the colours turn white. The red arrow is the hard-iron offset (a magnetised screw, the speaker magnet); the squashing and tilt is soft iron (steel that bends the field).",
    links: [
      { id: "A4", why: "the Hall and magnetoresistive sensors that produce these three numbers" },
      { id: "B4", why: "an accelerometer is calibrated the same way, on a sphere of radius 1 g" },

    build(fig, ui) {

      const noise = (() => { const r = rng(5); return u0.map(() => [gauss(r), gauss(r), gauss(r)].map((v) => 0.6 * v)); })();
      function makeData() {
        const off = [12 * hard, -8 * hard, 25 * hard], sc = [1 + 0.25 * soft, 1 - 0.15 * soft, 1];
        const th = Math.PI / 6, c = Math.cos(th), s = Math.sin(th), Rz = [[c, -s, 0], [s, c, 0], [0, 0, 1]];
        const A = [0, 1, 2].map((i) => [0, 1, 2].map((j) => Rz[i][0] * sc[0] * Rz[j][0] + Rz[i][1] * sc[1] * Rz[j][1] + Rz[i][2] * sc[2] * Rz[j][2]));

        // least-squares ellipsoid fit: x^T Q x + 2 l^T x = 1  (9 unknowns, linear)
        const AtA = Array.from({ length: 9 }, () => new Array(9).fill(0)), Atb = new Array(9).fill(0);

          `fitted semi-axes ${ax.map((v) => fmt(v, 1)).join(", ")} µT, true ${fit.sc.map((v) => fmt(BE * v, 1)).sort((a, b) => b - a).join(", ")} · ` +
          `uncalibrated, a ${fmt(hb, 1)} µT horizontal offset against a 20 µT horizontal field can swing the heading by up to <b style="color:${C.red}">${hb < 20 ? fmt((Math.asin(hb / 20) * 180) / Math.PI, 0) + "°" : "180°"}</b>`;
      }
