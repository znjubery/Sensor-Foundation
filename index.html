d $c$ the bulk concentration. Everything except $c$ is fixed by the design, so if you always\nread the current at the same moment, **current is proportional to concentration**.\n\n**The glucose strip.** A strip is a tiny electrochemical cell: printed carbon electrodes under a capillary chamber that\nsucks up about half a microlitre of blood ([C4](#C4)). On the\nworking electrode sits the enzyme **glucose oxidase** (GOx). Enzymes are the secret of **selectivity**: GOx has a pocket\nshaped for glucose, so the dozens of other molecules in blood are ignored. GOx oxidises glucose and passes 2 electrons per\nglucose to a **mediator** molecule (for example ferricyanide), which carries them to the electrode. The meter applies its\npotential, waits a few seconds, reads a current of a few microamps and converts it to mg/dL with a calibration factor.\n\n```viz\na6-strip-3d\n```\n\n**The three-electrode cell.** If the same electrode both carried the current and served as the voltage reference, its\npotential would shift as current flowed, and the resistance of the liquid would add an error $IR$. So serious\nelectrochemical sensors use three electrodes: the **working electrode** (WE), where the reaction of interest happens; the\n**reference electrode** (RE), which carries no current and therefore keeps a stable potential; and the **counter\nelectrode** (CE), which supplies the current. A feedback circuit, the **potentiostat**, adjusts the CE so that\n$V_{\\text{WE}}-V_{\\text{RE}}$ stays exactly at the set value, and a transimpedance amplifier\n([A7](#A7)) turns the WE current into a voltage.\n\n**Gas sensors.** An **electrochemical CO sensor** is an amperometric cell with a porous membrane. CO diffuses in and is\noxidised at a platinum WE (CO + H₂O → CO₂ + 2H⁺ + 2e⁻), giving a current proportional to the CO concentration, typically\ntens of nanoamps per ppm. It is selective, needs almost no power and lasts years, which is why it is used in home alarms.\nA **metal-oxide (MOX) sensor** works differently: a film of tin dioxide heated to $200$–$400$ °C has oxygen bound on its\ngrains that traps electrons; reducing gases (CO, methane, alcohol, volatile organics) react with that oxygen, release the\nelectrons and **lower the resistance**, roughly as a power law $R_s=R_0(c/c_0)^{-\\kappa}$ with $\\kappa\\approx0.5$ ($R_0$ is\nthe resistance at a reference concentration $c_0$). MOX sensors are cheap and sensitive but not very selective, drift\nwith humidity and need their heater.\n\n**Biosensors in general.** A biosensor is a transducer (electrode, photodiode, mass sensor) plus a **biological\nrecognition element** that provides selectivity: an enzyme (glucose oxidase, lactate oxidase, urease), an antibody that\nbinds one protein (pregnancy and COVID tests, cardiac markers), or a DNA strand that binds only its complementary\nsequence. The recognition element decides *what* is measured; the transducer decides *how small* an amount can be seen.\n\n**Limit of detection.** Repeat the measurement on a blank (a sample with none of the target) and you still get a\nslightly fluctuating current with standard deviation $\\sigma_{\\text{blank}}$. A real signal must stand clearly above\nthat. The usual rule: the **limit of detection** is the concentration whose signal equals three blank standard deviations,\n$$c_{\\text{LOD}}=\\frac{3\\,\\sigma_{\\text{blank}}}{S},$$\nwhere $S=dI/dc$ is the sensitivity. To quantify (not just detect) people use $10\\sigma_{\\text{blank}}/S$.\n\n```viz\na6-cottrell\n```\n\n## Intuitive examples\n\n1. **The lemon battery.** Standard potentials: Cu²⁺/Cu $+0.34$ V, Zn²⁺/Zn $-0.76$ V, so the ideal cell gives\n   $0.34-(-0.76)=1.10$ V. The free energy released per mole of zinc is $-z\\mathcal FV=-2\\times96485\\times1.10=-212$ kJ.\n2. **The Nernst slope.** $R_gT\\ln10/\\mathcal F$ is $54.20$ mV/decade at $0$ °C, $59.16$ at $25$ °C and $61.54$ at $37$ °C.\n   For a doubly charged ion ($z=2$, calcium) it halves: $29.58$ mV/decade at 25 °C.\n3. **pH.** From pH 7 to pH 4 the glass electrode's voltage rises by $3\\times59.16=177.5$ mV. A $1$ mV reading error is\n   only $0.0169$ pH. But calibrating at 25 °C and measuring at 37 °C, three units away from pH 7, gives a $7.1$ mV error,\n   i.e. $0.12$ pH, unless the meter compensates for temperature.\n4. **Nitrate in soil water.** From $10$ to $100$ mg/L of nitrate the ion-selective electrode ($z=-1$) moves by $-59.2$ mV.\n   A drift of only $5$ mV looks like a factor $1.21$ in concentration, a $21\\%$ error: that is why field probes are\n   recalibrated often.\n5. **A glucose strip.** $n=2$ electrons per glucose, $A=1$ mm², $D=6.7\\times10^{-10}$ m²/s, $c=5$ mM ($=5$ mol/m³ $=90.1$ mg/dL):\n   $I(1\\ \\text{s})=14.09$ µA, $I(4\\ \\text{s})=7.05$ µA (four times longer, half the current), $I(5\\ \\text{s})=6.30$ µA,\n   $I(10\\ \\text{s})=4.46$ µA. The sensitivity at 5 s is $1.26$ µA/mM, the depletion layer is $\\sqrt{\\pi Dt}=103$ µm thick,\n   and $10$ mM gives $12.60$ µA. In the first 5 s the strip collects $63$ µC.\n6. **A CO alarm.** At $70$ nA/ppm: $30$ ppm gives $2.10$ µA, $70$ ppm (a level that should trigger an alarm within an hour or\n   so) $4.90$ µA, $400$ ppm $28.00$ µA. A $100$ kΩ transimpedance amplifier turns $70$ ppm into $0.49$ V.\n7. **A MOX sensor.** With $\\kappa=0.5$, four times more gas halves the resistance ($\\times0.50$), and $100$ times more gas\n   divides it by ten ($\\times0.10$).\n8. **Why three electrodes.** $10$ µA through $1$ kΩ of solution resistance shifts the electrode potential by $10$ mV, enough\n   to change which reactions run. The reference electrode, carrying no current, has no such drop.\n9. **Enzyme saturation.** With a Michaelis constant $K_M=25$ mM (the concentration at which the enzyme runs at half speed),\n   the response $c/(K_M+c)$ falls short of a straight line by $4\\%$ at $1$ mM, $17\\%$ at $5$ mM and $44\\%$ at $20$ mM. Real\n   strips put a diffusion-limiting membrane over the enzyme so that the electrode, not the enzyme, sets the current.\n10. **Limit of detection.** A blank noise of $\\sigma_{\\text{blank}}=0.05$ µA and $S=1.26$ µA/mM give\n    $c_{\\text{LOD}}=0.119$ mM ($2.1$ mg/dL) and a limit of quantification of $0.40$ mM, far below the clinically interesting\n    range of $3$–$20$ mM.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $q=n\\,\\mathcal F\\times\\text{moles}$ | electrons count molecules | $n$ electrons per molecule, $\\mathcal F=96485$ C/mol |\n| $V=V^0+\\dfrac{R_gT}{z\\mathcal F}\\ln a$ | Nernst: equilibrium potential | $a$ activity, $z$ ion charge, $R_g$ gas constant |\n| $\\dfrac{R_gT\\ln10}{z\\mathcal F}=59.16\\ \\text{mV}/z$ at 25 °C | slope per decade | proportional to $T$ |\n| $V=59.16\\ \\text{mV}\\times(7-\\mathrm{pH})$ | ideal glass pH electrode at 25 °C | $\\mathrm{pH}=-\\log_{10}a_{\\mathrm{H^+}}$ |\n| $I(t)=n\\mathcal FAc\\sqrt{D/(\\pi t)}$ | Cottrell: diffusion-limited current after a potential step | $A$ area, $c$ bulk concentration, $D$ diffusion coefficient |\n| $\\delta\\approx\\sqrt{\\pi Dt}$ | depletion-layer thickness | grows like $\\sqrt t$ |\n| $I_{\\text{CO}}=S_{\\text{CO}}\\,c$ | amperometric gas sensor | $S_{\\text{CO}}$ in nA/ppm |\n| $R_s=R_0(c/c_0)^{-\\kappa}$ | metal-oxide gas sensor | $\\kappa\\approx0.3$–$0.8$ |\n| $\\dfrac{c}{K_M+c}$ | enzyme (Michaelis–Menten) saturation | $K_M$ Michaelis constant |\n| $c_{\\text{LOD}}=3\\sigma_{\\text{blank}}/S$ | limit of detection | $S=dI/dc$ sensitivity |\n\n## Applications\n\n| World | Electrochemical sensing | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | nitrate, potassium and pH ion-selective electrodes in soil and in hydroponic nutrient tanks; sap-nitrate test strips; dissolved-oxygen probes in fish ponds | when and how much to fertilise; whether the nutrient solution has drifted; whether fish are short of oxygen |\n| 🧬 Biology & human health | glucose strips and continuous glucose monitors (an enzyme electrode under the skin); blood-gas analysers (pH, CO₂, K⁺, Na⁺); lactate sensors for athletes; antibody-based rapid tests | insulin dose; acid–base and salt balance in intensive care; when muscles switch to anaerobic work; infection or pregnancy |\n| 🌍 Environment | electrochemical NO₂, O₃ and CO sensors in air-quality stations; pH, conductivity and dissolved-oxygen probes in rivers; heavy-metal stripping electrodes | traffic pollution at street level; whether a river can support fish; lead or mercury contamination |\n| 🤖 Robotics & drones | gas-sensing drones over landfills, volcanoes and leaks; robots sampling water quality; electronic noses (MOX arrays) on inspection robots | where methane or CO is escaping; pollution maps; spoiled food or chemical leaks |\n| 🚗 Cars | the lambda (oxygen) sensor in the exhaust, a zirconia Nernst cell; cabin air-quality MOX sensors; NOx sensors after the catalyst | the air-to-fuel ratio, set to burn cleanly; when to recirculate cabin air; whether the catalyst works |\n| 📱 Phones & photography | add-on electrochemical readers that plug into a phone (glucose, breath alcohol); sweat-sensing patches read by phone; MOX air-quality modules in wearables | test results logged on the phone; hydration and electrolytes; indoor air quality |\n| 🏠 Home & household | CO alarms (electrochemical); pool and aquarium pH and chlorine probes; MOX sensors in smart air purifiers and kitchen hoods; breathalysers | the poisonous gas you cannot smell; whether the pool is safe; cooking fumes and volatile organics; alcohol in breath |\n\n## Derivation\n\n**(a) The Nernst equation.**\n1. Moving one mole of ions of charge $z$ through a potential difference $V$ costs electrical work $z\\mathcal FV$.\n2. The chemical free energy of the ions depends on their activity: $\\mu=\\mu^0+R_gT\\ln a$.\n3. Equilibrium (no net transfer) means the two balance: $z\\mathcal FV=\\mu^0+R_gT\\ln a$, up to a constant.\n4. Collect the constants into $V^0$: $V=V^0+\\dfrac{R_gT}{z\\mathcal F}\\ln a$.\n5. Base 10: $\\ln a=\\ln10\\,\\log_{10}a$, so the slope is $\\dfrac{R_gT\\ln10}{z\\mathcal F}=\\dfrac{8.314\\times298.15\\times2.3026}{96485}=0.05916$ V per decade.\n6. The thermal voltage $R_gT/\\mathcal F=25.69$ mV at 25 °C is the natural unit; $\\ln10=2.303$ turns it into $59.16$ mV.\n\n**(b) The Cottrell equation (diffusion to a flat electrode).**\n1. After the potential step the surface concentration is zero; far away it stays $c$.\n2. Diffusion ([C3](#C3)): $\\partial c/\\partial t=D\\,\\partial^2c/\\partial x^2$, with $x$ the distance from the electrode.\n3. The solution is an error-function profile, $c(x,t)=c\\,\\operatorname{erf}\\!\\big(x/(2\\sqrt{Dt})\\big)$.\n4. Flux at the surface: $D\\,\\partial c/\\partial x\\rvert_{x=0}=D\\,c\\cdot\\dfrac{2}{\\sqrt\\pi}\\cdot\\dfrac{1}{2\\sqrt{Dt}}=c\\sqrt{\\dfrac{D}{\\pi t}}$.\n5. That is the same as $D\\,c/\\delta$ with an effective layer $\\delta=\\sqrt{\\pi Dt}$.\n6. Current $=n\\mathcal FA\\times$ flux: $I=n\\mathcal FAc\\sqrt{D/(\\pi t)}$.\n7. Charge collected up to $t$: $Q=\\int_0^tI\\,dt'=2n\\mathcal FAc\\sqrt{Dt/\\pi}$, growing like $\\sqrt t$.\n\n**(c) Limit of detection.**\n1. Calibration line: $I=I_0+S\\,c$ (the blank gives $I_0$ with spread $\\sigma_{\\text{blank}}$).\n2. Demand that a real signal exceed the blank by $3\\sigma_{\\text{blank}}$ (false alarms below about 0.1–1%).\n3. $S\\,c_{\\text{LOD}}=3\\sigma_{\\text{blank}}$, so $c_{\\text{LOD}}=3\\sigma_{\\text{blank}}/S$.\n4. To halve the LOD, double $S$ (bigger electrode, more electrons per molecule) or halve the noise (averaging, shielding, [A8](#A8)).\n\n## Worked check\n\n**A glucose strip reading.** Blood with $c=8$ mM, read at $t=5$ s, with $n=2$, $A=10^{-6}$ m², $D=6.7\\times10^{-10}$ m²/s.\n- $\\sqrt{D/(\\pi t)}=\\sqrt{6.7\\times10^{-10}/(\\pi\\times5)}=6.531\\times10^{-6}$ m/s.\n- $I=2\\times96485\\times10^{-6}\\times8\\times6.531\\times10^{-6}=10.08$ µA.\n- With the calibration $S=1.26$ µA/mM: $c=10.08/1.26=8.00$ mM ✓, i.e. $8\\times18.016=144$ mg/dL.\n\n**A pH reading.** A glass electrode reads $0$ mV at pH 7 and $V=59.16\\ \\text{mV}\\times(7-\\mathrm{pH})$ at 25 °C. It shows $118.3$ mV.\n- $\\mathrm{pH}=7-118.3/59.16=5.00$ (slightly acidic, like a cup of black coffee).\n- The same electrode in a pH 4 buffer at 37 °C reads $3\\times61.54=184.6$ mV; a meter that assumes 25 °C would report pH $3.88$\n  instead of $4.00$. (All numbers from `scripts/checks/A6_check.py`.)\n\n## Whiteboard plan\n\n- **Panel 1 — the lemon.** Zinc nail, copper coin, voltmeter showing $1.1$ V. Write \"Zn → Zn²⁺ + 2e⁻\" and\n  \"Cu²⁺ + 2e⁻ → Cu\". Say: \"Chemistry is electron trading; the wire lets us watch.\"\n- **Panel 2 — two ways to listen.** Split the board: left \"measure $V$, no current\" (potentiometric), right \"hold $V$,\n  measure $I$\" (amperometric). Under each: pH electrode, glucose strip.\n- **Panel 3 — Nernst.** Axes $\\log_{10}a$ and $V$, a straight line, a step triangle of one decade labelled $59$ mV. Write\n  $V=V^0+\\frac{R_gT\\ln10}{z\\mathcal F}\\log_{10}a$ and \"∝ T, ÷ z\".\n- **Panel 4 — depletion.** An electrode at the bottom, dots above it, a dot-free layer of thickness $\\sqrt{\\pi Dt}$ that\n  grows in three snapshots. Then the curve $I\\propto1/\\sqrt t$ and the boxed Cottrell equation.\n- **Panel 5 — the strip.** Top view of three printed electrodes (WE with an enzyme, RE, CE) and the capillary chamber.\n  Draw the potentiostat triangle linking them. Say: \"RE watches, CE works, WE measures.\"\n- **Panel 6 — LOD.** A calibration line rising from a fuzzy blank band of height $\\pm3\\sigma$; mark where the line leaves\n  the band: $c_{\\text{LOD}}=3\\sigma/S$.\n\n## Common mistakes and where the intuition breaks\n\n- **\"59 mV per unit of concentration.\"** It is 59 mV per **factor of ten**. Doubling the concentration changes the voltage\n  by only $59.16\\times\\log_{10}2=17.8$ mV.\n- **Forgetting the sign and the charge.** Anions ($z<0$) give falling lines, divalent ions half the slope.\n- **Drawing current from a potentiometric sensor.** A pH electrode has a resistance of hundreds of megohms; a cheap\n  voltmeter loads it and the reading sags. It needs an amplifier with an enormous input resistance ([A7](#A7)).\n- **Reading an amperometric sensor too early.** The first fraction of a second is dominated by charging the double-layer\n  capacitor, not by the analyte; and every strip must be read at exactly the same time, because $I$ keeps falling.\n- **Concentration vs activity.** In salty solutions such as blood, ions screen each other and the activity is lower than\n  the concentration. Clinical analysers calibrate in solutions of similar ionic strength.\n- **Assuming the enzyme is perfectly selective.** Ascorbic acid (vitamin C), paracetamol and uric acid can be oxidised\n  directly at the electrode and add a false current; a lower working potential, a mediator and blocking membranes fight this.\n- **Where the linear picture breaks:** at high concentration the enzyme saturates (Michaelis–Menten); in a thin chamber the\n  depletion layer reaches the far wall and the $1/\\sqrt t$ law turns into faster, exhaustive decay; and at very low\n  concentration the noise, not the chemistry, sets the limit (the LOD).\n\n## Remember\n\n**\"Hold no current and read $V$: $59$ mV per decade ÷ $z$ (Nernst). Hold $V$ and read $I$: $I=n\\mathcal FAc\\sqrt{D/\\pi t}$ (Cottrell). Selectivity comes from the enzyme or membrane.\"**\n\n## Self-test\n\n1. A potassium electrode ($z=+1$) reads $-20$ mV in a $1$ mM KCl solution at 25 °C. What does it read in $10$ mM, and in $2$ mM?\n   <details><summary>Answer<\/summary>10 mM is one decade more: −20 + 59.2 = +39.2 mV. 2 mM is a factor 2: −20 + 59.16 × log10(2) = −20 + 17.8 = −2.2 mV.<\/details>\n2. A glucose strip gives $6.3$ µA at $5$ s. What will it read at $20$ s, assuming pure Cottrell behaviour?\n   <details><summary>Answer<\/summary>I ∝ 1/√t; 20 s is 4 times longer, so the current halves: about 3.15 µA.<\/details>\n3. A CO sensor has a sensitivity of $70$ nA/ppm and a blank noise of $14$ nA. What is its limit of detection?\n   <details><summary>Answer<\/summary>c_LOD = 3σ/S = 3 × 14 nA / 70 nA/ppm = 0.6 ppm, well below any alarm level.<\/details>\n\n**Next:** [A7 Signal conditioning: amplifiers, filters and ADCs](#A7) — microamps from a strip, millivolts from a pH probe and picocoulombs from a crystal all need amplifying, filtering and turning into numbers.\n"}, {"id": "A7", "short": "Signal conditioning: amplifiers, filters and ADCs", "title": "Signal conditioning: amplifiers, filters and ADCs", "part": "A", "md": "# A7. Signal conditioning: amplifiers, filters and ADCs\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A2 Resistive sensors and the Wheatstone bridge](#A2) · used by [A8 Noise, resolution, calibration and drift](#A8), [A9 Sensor fusion and the Kalman filter](#A9), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5)\n\n## Hook — a hearing aid, and a staircase next to a ramp\n\nA hearing aid has a microphone that produces a few **millivolts** when someone speaks. Inside, three things happen\nbefore the sound reaches the ear again. An **amplifier** makes the millivolts a thousand times bigger. A **filter**\nthrows away what is not speech: the hiss above the voices and the rumble of a bus below them. Then an **analogue-to-digital\nconverter (ADC)** measures the voltage thousands of times a second and turns each measurement into a whole number,\nso a tiny computer can process it.\n\nThe ADC is the strange part. A voltage can be anything, like a smooth **ramp**; a number has to be one of a fixed set of\nvalues, like the steps of a **staircase**. And the ADC only looks every so often, like a film camera taking frames. Each of\nthose two shortcuts creates its own errors: **quantisation** (the gap between ramp and step) and **aliasing** (the wagon\nwheel that seems to spin backwards in a film). This note is about the three blocks every sensor needs between the\nphysics and the number: **amplify, filter, convert**.\n\n## The idea in plain words\n\n**The chain.** In [A1](#A1) a sensor was a chain: stimulus $s$ →\nphysical change → voltage → number. In [A2](#A2) a strain gauge bridge gave\nless than a millivolt. That is far too small to measure directly: a typical microcontroller ADC with a $3.3$ V range and 12\nbits has steps of $0.8$ mV, so the whole signal would fit inside a single step. **Signal conditioning** is everything that\nhappens between the sensor and the ADC to make the signal *big, clean and slow enough* to be measured well.\n\n**The operational amplifier (op-amp).** An op-amp is a chip with two inputs, $+$ and $-$, and one output. It multiplies the\n*difference* between its inputs by a huge open-loop gain $A_{\\text{OL}}$ (often $10^5$–$10^6$): $V_{\\text{out}}=A_{\\text{OL}}(V_+-V_-)$.\nOn its own that is useless (any microvolt drives the output to the supply rail). The trick is **negative feedback**: connect\nthe output back to the $-$ input through resistors. The op-amp then adjusts its output until the two inputs are equal. This\ngives the two **golden rules** for an op-amp with negative feedback:\n\n1. **No current flows into the inputs** (their input resistance is enormous).\n2. **The output does whatever it takes to make $V_+=V_-$** (because $A_{\\text{OL}}$ is so large, the difference is tiny).\n\nWith those two rules you can analyse almost any amplifier in three lines.\n\n**Non-inverting amplifier.** The signal goes into $+$. The output feeds back to $-$ through a divider of $R_f$ (from output to $-$)\nand $R_g$ (from $-$ to ground). Rule 2 says the divider's middle must equal the input, $V_{\\text{in}}=V_{\\text{out}}R_g/(R_f+R_g)$, so\nthe gain is $G=1+R_f/R_g$. It never loads the sensor (rule 1), which is why it is the first stage after a delicate sensor.\n\n**Inverting amplifier.** The signal goes into $-$ through $R_{\\text{in}}$, with $+$ grounded. Rule 2 makes the $-$ input a\n**virtual ground** (0 V without being connected to ground). All of the input current $V_{\\text{in}}/R_{\\text{in}}$ must flow on\nthrough $R_f$ (rule 1), so $V_{\\text{out}}=-V_{\\text{in}}R_f/R_{\\text{in}}$ and $G=-R_f/R_{\\text{in}}$. A variant with only $R_f$ turns a photodiode\ncurrent into a voltage, $V_{\\text{out}}=-IR_f$: the **transimpedance amplifier** of [A5](#A5).\n\n**The instrumentation amplifier (in-amp) and CMRR.** A bridge has *two* output wires, both sitting near $V_{\\text{ex}}/2$. The signal is\ntheir small **difference**; the large voltage they share is the **common-mode** voltage. An in-amp is three op-amps arranged so\nthat it amplifies the difference by a gain set by one resistor $R_G$ (for the classic AD620/INA128 chips, $G=1+49.4\\ \\text{k}\\Omega/R_G$)\nand largely ignores the common mode. How well it ignores it is the **common-mode rejection ratio**,\n$\\mathrm{CMRR}=G_{\\text{diff}}/G_{\\text{cm}}$, usually quoted in dB.\n\n**Why differential beats single-ended: mains hum.** Your body is an antenna. In a room wired for 230 V or 120 V, it picks up\na 50 or 60 Hz voltage of up to about a volt. An ECG wants the heart's 1 mV. Measure one electrode against ground\n(**single-ended**) and the hum is 500 times bigger than the heartbeat. But the hum appears on *both* chest electrodes almost\nequally: it is common mode. An in-amp with CMRR $=100$ dB ($10^5$) turns 0.5 V of common-mode hum into the same output as 5 µV of\nreal difference signal: 0.5% of the ECG. That is the **\"divide to compare\"** thread of [A2](#A2):\nsubtract two wires that share the disturbance, and the disturbance cancels.\n\n**Filters: keep the frequencies you want.** Every real signal is a sum of sines of different frequencies $f$ (or angular frequencies\n$\\omega=2\\pi f$). A filter's job is to pass some and block others. The simplest is a resistor $R$ followed by a capacitor $C$ to ground,\nwith the output taken across $C$: the **RC low-pass**. A capacitor is a bucket of charge. It takes time to fill through the\nresistor, so it cannot follow fast wiggles, but it follows slow changes perfectly. The time it needs is the **time constant**\n$\\tau=RC$: after a step, the output reaches 63.2% of the way in one $\\tau$ and 99.3% in $5\\tau$.\n\nIn frequency terms, the filter's **transfer function** (output over input for a sine) is\n$$H(f)=\\frac{1}{1+j\\,f/f_c},\\qquad \\lvert H\\rvert=\\frac{1}{\\sqrt{1+(f/f_c)^2}},\\qquad f_c=\\frac{1}{2\\pi RC}.$$\nHere $j=\\sqrt{-1}$ keeps track of the phase. Far below the **cutoff frequency** $f_c$, $\\lvert H\\rvert\\approx1$ and the signal passes.\nAt $f_c$, $\\lvert H\\rvert=1/\\sqrt2=0.707$, which is **−3 dB** (half the power). Far above, $\\lvert H\\rvert\\approx f_c/f$: every factor of 10 in frequency\ncosts a factor of 10 in amplitude, a slope of **−20 dB per decade**. The output also **lags**: phase $\\varphi=-\\arctan(f/f_c)$, −45° at\n$f_c$. Swap $R$ and $C$ and you get the **high-pass**, $H=\\dfrac{j f/f_c}{1+j f/f_c}$, which blocks DC and slow drifts and passes fast changes.\nA plot of gain in dB and phase against $\\log f$ is a **Bode plot**, and it is how engineers read every filter, amplifier and sensor.\n\n```viz\na7-bode\n```\n\n**Sampling and Nyquist.** An ADC does not watch the voltage continuously; it takes **samples** at a rate $f_s$ (samples per second).\nThe **Nyquist–Shannon theorem** says a signal can be rebuilt exactly from its samples only if it contains no frequencies at or above\n$f_s/2$, the **Nyquist frequency**. If it does, those frequencies do not disappear; they **fold back** and pretend to be a lower\nfrequency, the **alias**\n$$f_{\\text{alias}}=\\big\\lvert f-f_s\\cdot\\mathrm{round}(f/f_s)\\big\\rvert.$$\nA 60 Hz hum sampled at 100 Hz shows up as a perfectly believable 40 Hz wave, and no software can tell it apart from a real 40 Hz\nsignal afterwards. A phone camera filming at 30 frames per second is a sampler too: a two-blade drone propeller at 5400 rpm\n(90 turns per second, a blade pattern repeating at 180 Hz $=6\\times30$) looks **frozen**, and at 5300 rpm it seems to turn slowly\n**backwards**. The cure is an **anti-aliasing filter**: a low-pass *before* the ADC that removes everything above $f_s/2$, while it is\nstill an analogue voltage.\n\n```viz\na7-aliasing\n```\n\n**The ADC: bits, steps and quantisation noise.** An $N$-bit ADC with reference voltage $V_{\\text{ref}}$ divides the range $0\\ldots V_{\\text{ref}}$ into\n$2^N$ steps of size $\\Delta V=V_{\\text{ref}}/2^N$, the **LSB** (least significant bit). Every reading is rounded to a step, so it is off by an\nerror $e$ somewhere between $-\\Delta V/2$ and $+\\Delta V/2$. For a busy signal that error is equally likely anywhere in that interval\n(a **uniform** distribution), and its rms value is\n$$\\sigma_q=\\frac{\\Delta V}{\\sqrt{12}}.$$\nThis **quantisation noise** is the price of turning a ramp into a staircase. For a sine wave filling the whole range, the ratio of\nsignal rms to quantisation-noise rms gives the famous rule\n$$\\mathrm{SNR}\\approx 6.02\\,N+1.76\\ \\text{dB}:$$\neach extra bit halves the step and buys 6 dB. A 12-bit ADC reaches 74 dB, a 16-bit one 98 dB, a 24-bit one 146 dB (on paper:\nin practice the analogue noise of [A8](#A8) hits first).\n\n```viz\na7-adc-3d\n```\n\n**Gain staging: fill the staircase.** Bits are only useful if the signal uses them. A 0.825 mV bridge signal straight into a\n12-bit, 3.3 V ADC spans about **one** step: the reading jumps between two codes. Put an in-amp with $G=1001$ in front, and the\nsame strain spans about **1025** steps. The rule: amplify *early* (before noise from later stages is added), choose the gain so\nthe largest expected signal nearly fills $V_{\\text{ref}}$ without clipping, filter before sampling, and pick $f_s$ well above twice the\nhighest frequency you care about. The order of the blocks is the order of this note: **amplify → filter → sample → quantise**.\n\n## Intuitive examples\n\n1. **Strain gauge on a bathroom-scale beam (gain staging).** Quarter bridge, $V_{\\text{ex}}=3.3$ V, $\\mathrm{GF}=2$, strain 500 µε:\n   $\\Delta R/R=0.001$ and $V_{\\text{out}}=V_{\\text{ex}}\\Delta R/(4R)=0.825$ mV. A 12-bit, 3.3 V ADC has $\\Delta V=0.806$ mV, so the raw bridge\n   spans only **1.02 LSB**. An in-amp with $R_G=49.4\\ \\Omega$ gives $G=1+49.4\\ \\text{k}\\Omega/49.4\\ \\Omega=1001$ (60 dB) and an output of\n   0.826 V $=$ **1025 LSB**, i.e. 0.49 µε per step. The largest gain before 0.825 mV clips at 3.3 V would be 4000.\n2. **Op-amp gains.** Non-inverting with $R_f=99$ kΩ, $R_g=1$ kΩ: $G=100$ (40 dB). Inverting with $R_f=47$ kΩ, $R_{\\text{in}}=4.7$ kΩ:\n   $G=-10$, and the source sees an input resistance of only 4.7 kΩ (the price of the virtual ground).\n3. **ECG in a wired room (CMRR).** 0.5 V of 50/60 Hz common-mode hum vs a 1 mV heartbeat: single-ended, hum is **500×** the\n   signal. With CMRR 80 dB it becomes 50 µV (5% of the ECG); 100 dB, 5 µV (0.5%); 120 dB, 0.5 µV (0.05%). A simple\n   difference amplifier built with 0.1% resistors only guarantees CMRR $=(1+G)/(4\\times0.001)=500$ (54 dB), which is why medical\n   front ends use laser-trimmed in-amps.\n4. **The RC low-pass in numbers.** $R=10$ kΩ, $C=100$ nF: $\\tau=1$ ms and $f_c=159.15$ Hz. At $f_c$: 0.707, −3.01 dB, −45°.\n   At 1 kHz: 0.157, −16.07 dB, −80.96°. At $10f_c$: −20.04 dB; at $100f_c$: −40.00 dB.\n5. **A leaf thermistor next to a pump motor.** Temperature changes over seconds, so filter hard: $R=100$ kΩ, $C=1$ µF gives\n   $\\tau=0.1$ s, $f_c=1.59$ Hz. The 50 Hz pickup is cut to 0.032 (−29.9 dB) and 60 Hz to 0.027 (−31.5 dB). A high-pass is the\n   opposite tool: 0.5 Hz (318 kΩ with 1 µF) on an ECG removes baseline wander from breathing (0.25 Hz passes only 0.447) while a\n   72 bpm heartbeat (1.2 Hz) keeps 0.923 of its amplitude.\n6. **Aliases you have seen.** 60 Hz hum sampled at 100 Hz → **40 Hz**; sampled at 1000 Hz it stays 60 Hz. 50 Hz hum sampled at\n   exactly 50 Hz → **0 Hz**, a fake constant offset; 60 Hz at 50 Hz → 10 Hz. A two-blade propeller filmed at 30 fps: 5400 rpm\n   looks frozen (alias 0 Hz), 5300 rpm (blade pattern 176.67 Hz) looks like −3.33 Hz, i.e. **1.67 turns per second backwards**.\n7. **ADC steps.** At 3.3 V: 8 bits → 12.9 mV steps, SNR 49.9 dB; 10 bits → 3.22 mV, 62.0 dB; 12 bits → 0.806 mV, noise\n   0.233 mV rms, 74.0 dB; 16 bits → 50.4 µV, 98.1 dB. A 24-bit ADC with 2.5 V reference has 0.149 µV steps (146.2 dB on paper).\n   A simulation that quantises 200 000 random points of a full-scale sine with 12 bits measures 0.234 mV rms error and\n   73.96 dB, matching the formulas.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $V_+=V_-$, no input current | the op-amp golden rules (with negative feedback) | $V_+$, $V_-$: input voltages |\n| $G=1+R_f/R_g$ | non-inverting amplifier | $R_f$ feedback, $R_g$ to ground |\n| $G=-R_f/R_{\\text{in}}$ | inverting amplifier (virtual ground) | $R_{\\text{in}}$ input resistor |\n| $G=1+49.4\\ \\text{k}\\Omega/R_G$ | a classic in-amp (AD620/INA128) | $R_G$ gain resistor |\n| $\\mathrm{CMRR}=G_{\\text{diff}}/G_{\\text{cm}}$, dB $=20\\log_{10}$ | how well common-mode hum is rejected | $G_{\\text{cm}}$: gain for the shared voltage |\n| $\\tau=RC$, $f_c=1/(2\\pi\\tau)$ | time constant and cutoff of an RC filter | $R$, $C$ |\n| $\\lvert H\\rvert=1/\\sqrt{1+(f/f_c)^2}$, $\\varphi=-\\arctan(f/f_c)$ | RC low-pass: −3 dB at $f_c$, −20 dB/decade | $f$ frequency |\n| $\\lvert H\\rvert=(f/f_c)/\\sqrt{1+(f/f_c)^2}$ | RC high-pass | |\n| $\\tau\\dot y+y=v_{\\text{in}}$ | the same low-pass in time: first-order lag | $y$: output voltage |\n| $f_{\\text{alias}}=\\lvert f-f_s\\,\\mathrm{round}(f/f_s)\\rvert$ | where a frequency lands after sampling | $f_s$ sampling rate; keep $f<f_s/2$ |\n| $\\Delta V=V_{\\text{ref}}/2^N$ | ADC step (LSB) | $N$ bits |\n| $\\sigma_q=\\Delta V/\\sqrt{12}$ | quantisation noise (rms) | |\n| $\\mathrm{SNR}\\approx6.02N+1.76$ dB | ideal ADC with a full-scale sine | |\n\n## Applications\n\n| World | Amplify, filter, convert | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | leaf-clip thermistors and sap-flow heaters read through a bridge + in-amp, with a 1 Hz low-pass against pump-motor hum; soil-moisture capacitance converted at a few samples per minute | slow plant signals can be filtered hard; the cutoff is set by how fast the plant changes, not by the electronics |\n| 🧬 Biology & human health | ECG/EEG front ends: in-amp with CMRR > 100 dB, 0.5 Hz high-pass against breathing wander, 40–150 Hz low-pass, 24-bit ADC; hearing-aid microphones at 16–48 kHz sampling | a heartbeat of 1 mV is readable next to 0.5 V of mains hum only because the hum is common mode |\n| 🌍 Environment | gas-sensor electrodes (nA currents) through transimpedance amplifiers; weather-station anemometer pulses counted; rain gauges sampled slowly | very small currents need a large feedback resistor and a heavy low-pass |\n| 🤖 Robotics & drones | IMU chips sample accelerometers at 1–8 kHz with built-in digital low-pass filters; motor vibration at 200–400 Hz must not alias into the 50 Hz control loop | a propeller's vibration aliased into the gyro looks like real rotation and can crash a drone |\n| 🚗 Cars | knock sensors (piezo, 5–15 kHz) band-pass filtered; wheel-speed and crankshaft Hall signals squared up by comparators; airbag accelerometers sampled at several kHz | anti-aliasing and gain decide whether a crash pulse is seen correctly in milliseconds |\n| 📱 Phones & photography | each camera pixel has its own amplifier (ISO is analogue gain before a 10–14-bit ADC); MEMS microphones have built-in sigma-delta ADCs; rolling shutters alias fast propellers and wheels | RAW photos store 12–14 bits so shadows can be brightened without visible steps |\n| 🏠 Home & household | kitchen scales: a load-cell bridge, an in-amp with $G\\approx128$ and a 24-bit ADC sampling 10–80 times per second with built-in 50/60 Hz rejection | the mains-rejection setting on a scale chip is an anti-hum filter matched to your country's grid |\n\n## Derivation\n\n**(a) Non-inverting gain from the golden rules.**\n1. The feedback divider sets $V_-=V_{\\text{out}}\\,\\dfrac{R_g}{R_f+R_g}$ (no current flows into the input, rule 1).\n2. Rule 2: $V_-=V_+=V_{\\text{in}}$.\n3. So $V_{\\text{in}}=V_{\\text{out}}R_g/(R_f+R_g)$, i.e. $G=V_{\\text{out}}/V_{\\text{in}}=1+R_f/R_g$.\n4. With finite open-loop gain: $V_{\\text{out}}=A_{\\text{OL}}(V_{\\text{in}}-\\beta V_{\\text{out}})$ with $\\beta=R_g/(R_f+R_g)$, so $G=\\dfrac{A_{\\text{OL}}}{1+A_{\\text{OL}}\\beta}\\to\\dfrac1\\beta$ as $A_{\\text{OL}}\\to\\infty$.\n\n**(b) Inverting gain.**\n1. $V_+=0$, so rule 2 gives $V_-=0$ (virtual ground).\n2. Current in: $I=V_{\\text{in}}/R_{\\text{in}}$; rule 1 sends all of it through $R_f$.\n3. $V_{\\text{out}}=V_--IR_f=-V_{\\text{in}}R_f/R_{\\text{in}}$.\n\n**(c) Why a differential amplifier rejects common mode.**\n1. Write the two inputs as $V_1=V_{\\text{cm}}+V_d/2$ and $V_2=V_{\\text{cm}}-V_d/2$.\n2. An amplifier's output is $V_{\\text{out}}=G_{\\text{diff}}V_d+G_{\\text{cm}}V_{\\text{cm}}$.\n3. Divide by $G_{\\text{diff}}$: the hum looks like an input difference of $V_{\\text{cm}}/\\mathrm{CMRR}$.\n4. 0.5 V of hum at CMRR $10^5$ looks like 5 µV.\n\n**(d) RC low-pass transfer function.**\n1. Capacitor: $I=C\\,dV/dt$. For $V=\\hat V e^{j\\omega t}$, $dV/dt=j\\omega V$, so $V/I=1/(j\\omega C)=Z_C$.\n2. Voltage divider of $R$ and $Z_C$: $H=Z_C/(R+Z_C)$.\n3. Multiply by $j\\omega C$: $H=1/(1+j\\omega RC)$.\n4. Modulus: $\\lvert 1+jx\\rvert=\\sqrt{1+x^2}$, so $\\lvert H\\rvert=1/\\sqrt{1+(\\omega RC)^2}=1/\\sqrt{1+(f/f_c)^2}$ with $f_c=1/(2\\pi RC)$.\n5. At $f=f_c$: $\\lvert H\\rvert=1/\\sqrt2$, $20\\log_{10}(1/\\sqrt2)=-3.01$ dB.\n6. For $f\\gg f_c$: $\\lvert H\\rvert\\approx f_c/f$; $\\times10$ in $f$ → $-20$ dB.\n7. Phase of $1/(1+jx)$ is $-\\arctan x$: −45° at $f_c$, → −90°.\n8. High-pass ($R$ and $C$ swapped): $H=R/(R+Z_C)=j\\omega RC/(1+j\\omega RC)$.\n\n**(e) The same filter in time.**\n1. Current through $R$: $(v_{\\text{in}}-y)/R$; it all charges $C$: $C\\dot y=(v_{\\text{in}}-y)/R$.\n2. Rearranged: $RC\\,\\dot y+y=v_{\\text{in}}$, i.e. $\\tau\\dot y+y=v_{\\text{in}}$, the first-order lag.\n3. Step input of size 1 from $y=0$: $y=1-e^{-t/\\tau}$; $63.2\\%$ at $t=\\tau$, $99.3\\%$ at $5\\tau$.\n4. Try $y=\\hat y e^{j\\omega t}$: $(1+j\\omega\\tau)\\hat y=\\hat v$, which is part (d) again.\n\n**(f) Aliasing.**\n1. Samples of $\\sin(2\\pi f t)$ at $t=k/f_s$ are $\\sin(2\\pi f k/f_s)$.\n2. Adding $2\\pi m k$ ($m$ any integer) changes nothing: $\\sin(2\\pi (f-mf_s)k/f_s)$ gives the same numbers.\n3. So $f$ and $f-mf_s$ are indistinguishable; the one closest to zero is $f-f_s\\,\\mathrm{round}(f/f_s)$, with $\\lvert\\cdot\\rvert\\le f_s/2$.\n4. Only if every component already satisfies $f<f_s/2$ is the alias the true frequency.\n\n**(g) Quantisation noise and the 6.02 N + 1.76 rule.**\n1. Error $e$ uniform on $[-\\Delta V/2,\\Delta V/2]$, density $1/\\Delta V$.\n2. Variance $\\displaystyle\\int_{-\\Delta V/2}^{\\Delta V/2}\\frac{e^2}{\\Delta V}\\,de=\\frac{\\Delta V^2}{12}$, so $\\sigma_q=\\Delta V/\\sqrt{12}$.\n3. A full-scale sine has amplitude $V_{\\text{ref}}/2$ and rms $V_{\\text{ref}}/(2\\sqrt2)$.\n4. Ratio: $\\dfrac{V_{\\text{ref}}/(2\\sqrt2)}{V_{\\text{ref}}/(2^N\\sqrt{12})}=2^N\\sqrt{12}/(2\\sqrt2)=2^N\\sqrt{3/2}$.\n5. In dB: $20\\log_{10}2^N+20\\log_{10}\\sqrt{1.5}=6.0206\\,N+1.7609$.\n\n## Worked check\n\n**RC filter.** $R=10$ kΩ, $C=100$ nF: $\\tau=RC=10^4\\times10^{-7}=10^{-3}$ s, $f_c=1/(2\\pi\\times10^{-3})=159.15$ Hz. At $f=1$ kHz:\n$f/f_c=6.2832$, $(f/f_c)^2=39.478$, $\\lvert H\\rvert=1/\\sqrt{40.478}=0.1572$, i.e. $20\\log_{10}0.1572=-16.07$ dB, and $\\varphi=-\\arctan6.2832=-80.96°$ ✓.\nSo a 1 kHz whine of 1 V leaves the filter as 0.157 V, lagging by almost a quarter cycle.\n\n**12-bit ADC.** $\\Delta V=3.3/4096=0.8057$ mV; $\\sigma_q=0.8057/\\sqrt{12}=0.2326$ mV. A full-scale sine has rms\n$3.3/(2\\sqrt2)=1.1667$ V, so $\\mathrm{SNR}=20\\log_{10}(1.1667/0.0002326)=74.01$ dB, and the rule gives $6.02\\times12+1.76=74.00$ dB ✓.\n\n**Gain staging.** $0.825$ mV $\\times1001=0.8258$ V; $0.8258/0.0008057=1025$ steps ✓. (All numbers: `scripts/checks/A7_check.py`.)\n\n## Whiteboard plan\n\n- **Panel 1: the chain.** Draw sensor → [amplify] → [filter] → [sample] → [quantise] → number. Under the sensor write \"0.8 mV\",\n  under the ADC \"1 step = 0.8 mV\". Say: \"Without the first box, the whole signal is one step.\"\n- **Panel 2: the op-amp rules.** A triangle with $+$, $-$, output. Write the two golden rules in a box. Draw the non-inverting\n  circuit, mark $V_-=V_{\\text{in}}$, and derive $G=1+R_f/R_g$ in three lines.\n- **Panel 3: hum and CMRR.** Two electrode wires with the same wavy hum drawn on both and a tiny heartbeat on one. Draw a\n  minus sign between them; the hum cancels. Write \"0.5 V / 10⁵ = 5 µV\".\n- **Panel 4: the Bode plot.** Log $f$ axis; flat line at 0 dB, knee at $f_c$ with a dot at −3 dB, straight line falling 20 dB per decade.\n  Below, the phase going from 0 through −45° to −90°. Next to it the RC circuit and $H=1/(1+j\\omega RC)$.\n- **Panel 5: aliasing.** A fast sine with dots every so often, and the slow dashed sine through the dots. Draw a propeller in\n  four frames rotating backwards. Write $f_{\\text{alias}}=\\lvert f-f_s\\,\\mathrm{round}(f/f_s)\\rvert$ and \"filter before you sample\".\n- **Panel 6: the staircase.** A ramp and a staircase on top of it; below, the sawtooth error between $\\pm\\Delta V/2$. Write\n  $\\Delta V/\\sqrt{12}$ and $6.02N+1.76$ dB, and \"one more bit = 6 dB\".\n\n## Common mistakes and where the intuition breaks\n\n- **Amplifying after filtering or after the ADC.** Digital gain multiplies the quantisation noise too; it adds no information.\n  Gain must come *before* the ADC, and the first stage should have the most gain because its noise is the one that gets amplified most.\n- **Thinking aliasing can be fixed in software.** After sampling, a 60 Hz hum at $f_s=100$ Hz *is* a 40 Hz signal. Only an analogue\n  filter before the ADC (or a higher $f_s$) prevents it. A first-order RC is weak (a 10 Hz cutoff still leaves 16% of 60 Hz), so real\n  anti-alias filters are higher order or the ADC oversamples and filters digitally.\n- **Treating −3 dB as \"the end of the passband\".** At $f_c$ the signal has already lost 29% of its amplitude, and the phase lag is 45°.\n  If you need 1% accuracy, stay below about $0.14f_c$.\n- **Forgetting the lag.** A low-pass with $\\tau=0.1$ s delays a fast temperature step by about 0.1 s. In a control loop (a drone,\n  a thermostat) delay can cause oscillation.\n- **\"More bits = more accuracy.\"** Bits set the step size, not the truth. A 24-bit ADC whose analogue front end has 5 µV of noise behaves\n  like a much smaller ADC (its \"effective number of bits\" is lower), and offset or gain errors are untouched: see [A8](#A8).\n- **Quantisation noise is not always noise.** The uniform $\\Delta V/\\sqrt{12}$ model needs a busy signal. A constant input gives a constant\n  error (a bias), and a slow ramp gives a sawtooth; adding a little random **dither** before the ADC makes the error random again so it can be averaged away.\n- **Golden rules have limits.** The op-amp's gain falls at high frequency (gain × bandwidth is fixed, e.g. 1 MHz), its output cannot go\n  beyond the supply rails, and real inputs draw a tiny bias current. The rules are the first approximation, like $y=y_0+Ss$ in A1.\n\n## Remember\n\n**\"Amplify early, filter before you sample, keep everything below f_s/2, and fill the staircase: each bit is 6 dB.\"**\n\n## Self-test\n\n1. A photodiode amplifier needs a gain of 25 with a non-inverting stage and $R_g=1$ kΩ. What is $R_f$? What would the gain be if you mistakenly built the inverting version with the same resistors?\n   <details><summary>Answer<\/summary>G = 1 + Rf/Rg = 25 gives Rf = 24 kΩ. The inverting version gives G = −Rf/Rin = −24 (24 times bigger, and upside down).<\/details>\n2. A drone's gyro is sampled at 500 Hz, and the propellers shake the frame at 470 Hz. At what frequency does the vibration appear in the gyro data, and what should the designer do?\n   <details><summary>Answer<\/summary>The alias is |470 − 500·round(470/500)| = |470 − 500| = 30 Hz, right inside the drone's control bandwidth, so it looks like a real 30 Hz wobble. Add an analogue or on-chip low-pass well below 250 Hz before sampling, sample faster (e.g. 8 kHz, then filter digitally), or mount the IMU on soft dampers.<\/details>\n3. A 10-bit ADC with $V_{\\text{ref}}=5$ V measures a sensor whose largest output is 0.5 V. How many steps does the signal use, what is the step size, and what gain would make it use about 90% of the range?\n   <details><summary>Answer<\/summary>Step = 5/1024 = 4.88 mV. 0.5 V spans about 102 steps (out of 1024). A gain of 9 gives 4.5 V = 90% of the range, about 922 steps, i.e. about 3.2 bits more resolution.<\/details>\n\n**Next:** [A8 Noise, resolution, calibration and drift](#A8) — once the signal is a number, we must ask how much of it we can trust: noise, offsets, gains and drift.\n"}, {"id": "A8", "short": "Noise, resolution, calibration and drift", "title": "Noise, resolution, calibration and drift", "part": "A", "md": "# A8. Noise, resolution, calibration and drift\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A7 Signal conditioning](#A7) · used by [A9 Sensor fusion and the Kalman filter](#A9), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C5 Lab-on-a-chip](#C5)\n\n## Hook — a bathroom scale that reads 0.3 kg with nobody on it\n\nStep off your bathroom scale and it still says **0.3 kg**. Step on, step off, step on again: you get 70.9, then 71.1, then 70.8.\nTwo different things are wrong. The 0.3 kg with nobody on it is the same every time: it is a **systematic error**, an offset, and\nyou can simply subtract it. The jumping between 70.8 and 71.1 is different every time: it is **random error**, noise, and no\nsubtraction will remove it, but taking the average of several readings will shrink it.\n\nEvery sensor in this notebook has both kinds of error. This note answers three questions: **how small a change can we trust**\n(noise and resolution), **how do we make the numbers right** (calibration), and **why do they go wrong again** (drift).\n\n## The idea in plain words\n\n**Error.** The error of one reading is \"measured minus true\", $e=s_{\\text{meas}}-s$, as in [A1](#A1).\nSplit it into two parts: a part that is the same every time (the **bias** or **systematic error**) and a part that changes\nfrom reading to reading with average zero (the **random error** or **noise**).\n\n**Accuracy and precision.** Picture darts on a target. **Precision** is how tightly the darts cluster (small random error).\n**Accuracy** is how close their *centre* is to the bull's-eye (small bias). A sensor can be precise but inaccurate (a tight cluster\nin the wrong place: the scale that always reads 0.3 kg too much), or accurate but imprecise (scattered around the right place). The\ntotal rms error combines both like the sides of a right triangle: $\\sqrt{\\text{bias}^2+\\sigma^2}$. The two need different cures:\n**calibration** removes bias, **averaging** shrinks noise.\n\n```viz\na8-target\n```\n\n**Gaussian noise and rms.** When noise comes from many small independent causes (electrons jiggling, molecules hitting a membrane),\nthe readings follow the bell-shaped **Gaussian** (normal) distribution. It is fixed by two numbers: its mean and its standard\ndeviation. For noise with zero mean the standard deviation equals the **rms** (root mean square) value, and we call it $\\sigma_n$.\nAbout 68% of readings fall within $\\pm\\sigma_n$, 95% within $\\pm2\\sigma_n$ and 99.7% within $\\pm3\\sigma_n$. Peak-to-peak noise on an\noscilloscope is roughly $6\\sigma_n$.\n\n**Where electronic noise comes from.** Three sources appear in almost every sensor.\n- **Johnson (thermal) noise.** Every resistor at temperature $T$ produces a random voltage because its electrons are in thermal motion:\n  $v_n=\\sqrt{4k_BTR\\,\\Delta f}$, where $k_B=1.38\\times10^{-23}$ J/K is Boltzmann's constant, $R$ the resistance and $\\Delta f$ the\n  bandwidth (the range of frequencies you let through, set by the filters of [A7](#A7)).\n  A 1 kΩ resistor at room temperature gives about 4 nV for every √Hz of bandwidth. You cannot build a resistor without it; you can only\n  lower $R$, cool it, or narrow $\\Delta f$.\n- **Shot noise.** Current is made of individual charges arriving at random, like raindrops on a roof. A current $I$ fluctuates by\n  $i_n=\\sqrt{2q_eI\\,\\Delta f}$, with $q_e=1.602\\times10^{-19}$ C the electron charge. Its relative size $i_n/I$ grows as the current gets\n  smaller, which is why dim light gives grainy photos ([A5](#A5)).\n- **1/f (flicker) noise.** Many devices (transistors, carbon resistors, electrodes) also have a noise whose power grows at low\n  frequencies, proportional to $1/f$. Below a **corner frequency** it dominates. Every decade of low frequency adds the same amount of\n  noise, so very slow measurements (a glucose sensor drifting over an hour) can never be made arbitrarily quiet by waiting.\n\n**Averaging: noise falls as $1/\\sqrt M$.** If you take $M$ independent readings and average them, the true value stays, but the\nnoise partly cancels. Variances of independent errors add, so the sum of $M$ noises has variance $M\\sigma_n^2$; dividing by $M$ to get\nthe mean divides the variance by $M^2$. Result: the mean has noise $\\sigma_n/\\sqrt M$. Four times as many readings halve the noise;\n100 readings cut it tenfold. The prices: it takes longer (bandwidth goes down, exactly the $\\Delta f$ in the formulas above), and it does\n**nothing** against bias, because the bias is in every reading.\n\n```viz\na8-averaging\n```\n\n**Resolution, SNR and LOD.** The **resolution** $\\Delta s_{\\min}$ is the smallest change in the stimulus that stands out from the noise.\nTranslate the output noise back into stimulus units with the sensitivity $S$:\n$$\\Delta s_{\\min}=\\frac{\\sigma_n}{S}.$$\nA glucose electrode with $S=2$ nA/mM and 0.3 nA of noise resolves 0.15 mM. The **signal-to-noise ratio** compares a signal to the noise,\n$\\mathrm{SNR}=20\\log_{10}(\\text{signal rms}/\\sigma_n)$ dB. The **limit of detection (LOD)** is the smallest amount you can say is\n*present at all*. The usual rule is that the signal must be at least three noise standard deviations above the blank:\n$\\mathrm{LOD}=3\\sigma_n/S$ (0.45 mM for the glucose electrode). At $3\\sigma_n$, a blank sample fakes a detection only about 0.1% of the time.\n\n**Calibration: fix the offset and the gain.** A linear sensor obeys $y=y_0+S\\,s$ (A1). Calibration means measuring $y_0$ and $S$ for\n*this* device and then inverting: $s=(y-y_0)/S$.\n- **Two-point calibration.** Measure at two known stimuli. At $s=0$ you read the offset $y_0$ directly; at a second known $s_2$ you get\n  $S=(y_2-y_0)/s_2$. The bathroom scale reads 0.3 kg empty and 70.9 kg with a certified 70.0 kg weight, so $y_0=0.3$ kg and\n  $S=1.00857$; a raw 82.0 kg becomes 81.01 kg.\n- **Least squares.** With more points, each with noise, find the line that minimises the sum of squared residuals\n  $\\sum (y_i-y_0-Ss_i)^2$. Setting both derivatives to zero gives the slope $S=\\sum(s_i-\\bar s)(y_i-\\bar y)/\\sum(s_i-\\bar s)^2$ and\n  intercept $y_0=\\bar y-S\\bar s$ (bars are means). The scatter of the residuals tells you the noise, so a good calibration also\n  measures the precision.\n\n**Drift: why calibration does not last.** A sensor's offset and gain change with **temperature**, **time** (ageing, electrode fouling,\nmechanical creep) and **stress** (soldering, packaging). A tyre-pressure sensor whose offset changes by 0.1 kPa per °C and was\ncalibrated at 20 °C is 4 kPa off on a −20 °C morning. Cures: measure temperature too and correct with a table (most modern sensors\ndo this inside the chip), use a reference (a second, unstrained gauge in the bridge of A2), or recalibrate regularly (the \"tare\" button,\nor a phone asking you to wave it in a figure eight).\n\n**The Allan-deviation intuition.** Averaging longer helps... until it does not. For a gyroscope sitting still, average its reading over\na time $T_{\\text{av}}$ and look at how much successive averages differ. That is the **Allan deviation** $\\sigma_A(T_{\\text{av}})$. At short\ntimes white noise dominates and $\\sigma_A$ falls as $1/\\sqrt{T_{\\text{av}}}$ (the $1/\\sqrt M$ law). At long times the sensor's bias\nwanders (drift), and $\\sigma_A$ *rises* again. The bottom of the curve tells you the best averaging time and the best stability the\nsensor can ever give. For a gyro with 0.1 °/s noise per sample at 100 Hz and a slow random-walk drift, the best is to average about 173 s,\nreaching 0.0011 °/s (3.9 °/h). This is why a drone cannot hold its heading on the gyro alone, and needs the fusion of [A9](#A9).\n\n**Calibration in 3D: the compass ellipsoid.** A phone's magnetometer measures a 3D vector $\\mathbf m$. Turned in every direction in a\nuniform field of 50 µT, a perfect sensor's readings lie on a **sphere** of radius 50 µT. A real phone has a magnetised speaker and\nscrews that add a constant vector, the **hard-iron offset** $\\mathbf m_0$ (the 3D version of $y_0$), and steel parts that bend the field,\nthe **soft-iron** distortion: a matrix $A_{\\text{si}}$ that stretches and tilts (the 3D version of $S$). The readings then lie on an\n**offset, tilted ellipsoid**. Calibration fits that ellipsoid and maps it back to the sphere: subtract its centre, rotate to its axes,\nrescale each axis, rotate back. Accelerometers are calibrated the same way on a sphere of radius 1 g, by resting them in many orientations.\n\n```viz\na8-calibration-3d\n```\n\n## Intuitive examples\n\n1. **Johnson noise of a strain-gauge bridge.** A 10 kΩ resistance at 300 K over a 10 kHz bandwidth: $v_n=\\sqrt{4k_BTR\\Delta f}=1.29$ µV rms.\n   A 1 mV bridge signal then has $\\mathrm{SNR}=57.8$ dB. Per √Hz: 1 kΩ gives 4.07 nV, 10 kΩ gives 12.9 nV; a 1 MΩ pH-electrode\n   resistance over 10 Hz already gives 0.41 µV. Cooling the 10 kΩ resistor to 77 K (liquid nitrogen) only halves the noise (0.65 µV).\n2. **Shot noise in a photodiode.** $I=1$ µA over 10 kHz: $i_n=\\sqrt{2q_eI\\Delta f}=56.6$ pA, SNR $=17\\,666$ (84.9 dB). At 1 nA (a\n   thousand times dimmer) $i_n=1.79$ pA and SNR $=559$ (54.9 dB): a thousand times less light costs only $\\sqrt{1000}\\approx31.6$ in SNR.\n3. **1/f noise.** An amplifier with 10 nV/√Hz white noise and a 10 Hz corner, measured from 0.1 to 10 Hz: 74.8 nV rms, against\n   31.5 nV if it were white. Each decade of 1/f adds $(48.0\\ \\text{nV})^2$ of variance, however low you go.\n4. **Kitchen scale averaging.** One reading has $\\sigma_n=0.5$ g. Averaging $M=4$: 0.25 g; $M=16$: 0.125 g (a simulation of 20 000\n   averages measures 0.1256 g); $M=100$: 0.05 g, but at 10 readings per second that takes 10 s.\n5. **Resolution and LOD.** Glucose electrode, $S=2$ nA/mM, $\\sigma_n=0.3$ nA: resolution 0.15 mM, LOD 0.45 mM. A barometer chip with\n   $S=1$ mV/kPa and 0.02 mV noise resolves 20 Pa; air pressure falls by 11.8 Pa per metre near sea level, so that is **1.70 m** of altitude.\n6. **Least-squares calibration of a load cell.** Known masses 0, 250, 500, 750, 1000 g give 8410, 12 530, 16 590, 20 770, 24 800 counts.\n   The fit gives $S=16.408$ counts/g and $y_0=8416.0$ counts; residuals −6, 12, −30, 48, −24 counts, rms 36.3 counts $=2.21$ g. A reading of\n   18 000 counts means 584.1 g.\n7. **Temperature drift and hard iron.** A TPMS sensor with 0.1 kPa/°C offset drift, calibrated at 20 °C, is 4.0 kPa (1.7% of 230 kPa) off at\n   both −20 °C and 60 °C. A 12 µT hard-iron offset against Europe's roughly 20 µT horizontal field can swing a compass heading by up to\n   $\\arcsin(12/20)=36.9°$. For the distortion in the 3D figure (offset (12, −8, 25) µT, axes ×1.25, ×0.85, ×1, tilted 30°), raw lengths\n   range from 19.2 to 80.6 µT instead of 50.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $e=s_{\\text{meas}}-s=\\text{bias}+\\text{noise}$ | systematic plus random error | $e$ error |\n| rms error $=\\sqrt{\\text{bias}^2+\\sigma_n^2}$ | accuracy and precision combined | |\n| $v_n=\\sqrt{4k_BTR\\,\\Delta f}$ | Johnson noise of a resistor | $k_B$, $T$, $R$, $\\Delta f$ bandwidth |\n| $i_n=\\sqrt{2q_eI\\,\\Delta f}$ | shot noise of a current | $q_e$ electron charge, $I$ current |\n| noise power $\\propto 1/f$ below the corner | flicker noise: each decade adds equally | $f$ frequency |\n| $\\sigma_{\\bar y}=\\sigma_n/\\sqrt M$ | averaging $M$ independent readings | $M$ samples |\n| $\\Delta s_{\\min}=\\sigma_n/S$ | resolution: noise floor over sensitivity | $S$ sensitivity |\n| $\\mathrm{SNR}=20\\log_{10}(\\text{signal rms}/\\sigma_n)$ | signal-to-noise ratio in dB | |\n| $\\mathrm{LOD}=3\\sigma_n/S$ | limit of detection | |\n| $S=\\dfrac{\\sum(s_i-\\bar s)(y_i-\\bar y)}{\\sum(s_i-\\bar s)^2}$, $y_0=\\bar y-S\\bar s$ | least-squares calibration line | bars: means |\n| $s=(y-y_0)/S$ | using the calibration | |\n| $\\mathbf m=A_{\\text{si}}\\mathbf B_E+\\mathbf m_0$ | 3D sensor with soft and hard iron | $\\mathbf B_E$ true field, $\\mathbf m_0$ offset |\n\n## Applications\n\n| World | Noise, calibration and drift | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | soil-moisture probes calibrated per soil type (two-point: dry and saturated); leaf thermistors averaged over a minute; nitrate electrodes drift and need daily recalibration | a 0.5 °C bias in leaf temperature looks like plant stress; the cure is calibration, not averaging |\n| 🧬 Biology & human health | glucose strips coded per batch (gain calibration); continuous glucose monitors recalibrated against finger pricks; pulse oximeters average 4–8 heartbeats | the LOD of a diagnostic test is a 3σ statement about the blank, which is why tests are run with controls |\n| 🌍 Environment | low-cost CO₂ and NO₂ sensors drift with temperature and humidity and are co-located with reference stations to fit corrections; particle counters averaged over an hour | cheap sensor networks are useful only after the drift model is calibrated |\n| 🤖 Robotics & drones | gyro bias measured at start-up while the drone sits still; accelerometer six-position calibration (a sphere of radius 1 g); Allan deviation decides the IMU grade | a 0.5 °/s uncorrected gyro bias becomes a 30° heading error in a minute |\n| 🚗 Cars | TPMS and engine pressure sensors carry factory temperature-compensation tables; the steering-angle sensor is zeroed after an alignment | without temperature compensation a cold morning looks like a flat tyre |\n| 📱 Phones & photography | compass hard/soft-iron calibration (the figure-eight wave); camera dark-frame subtraction removes fixed-pattern offset; night mode averages many frames ($1/\\sqrt M$) | averaging 16 frames gives 4× less noise, which is why night photos need a steady hand |\n| 🏠 Home & household | the tare button of a kitchen scale (offset); scales averaging until \"stable\"; smoke detectors self-calibrate their baseline as dust collects | tare removes bias, the \"stable\" icon is averaging, and baseline tracking is drift correction |\n\n## Derivation\n\n**(a) Variance of a mean, $\\sigma_n/\\sqrt M$.**\n1. Readings $y_i=s+n_i$, with $n_i$ independent, mean 0, variance $\\sigma_n^2$.\n2. Mean $\\bar y=s+\\frac1M\\sum_i n_i$, so $\\bar y$ has mean $s$.\n3. Independent variances add: $\\operatorname{Var}(\\sum_i n_i)=M\\sigma_n^2$.\n4. Scaling by $1/M$ scales a variance by $1/M^2$: $\\operatorname{Var}(\\bar y)=\\sigma_n^2/M$.\n5. Standard deviation $\\sigma_n/\\sqrt M$. A bias $b$ added to each reading gives mean $s+b$: unchanged by averaging.\n\n**(b) Least-squares line.**\n1. Minimise $J=\\sum_i(y_i-y_0-Ss_i)^2$ over $y_0$ and $S$.\n2. $\\partial J/\\partial y_0=0$: $\\sum(y_i-y_0-Ss_i)=0$, i.e. $y_0=\\bar y-S\\bar s$.\n3. Substitute: $J=\\sum\\big((y_i-\\bar y)-S(s_i-\\bar s)\\big)^2$.\n4. $\\partial J/\\partial S=0$: $S=\\sum(s_i-\\bar s)(y_i-\\bar y)/\\sum(s_i-\\bar s)^2$.\n5. With two points this reduces to the two-point formula $S=(y_2-y_1)/(s_2-s_1)$.\n\n**(c) Johnson noise from equipartition (sketch).**\n1. A resistor $R$ with a capacitor $C$ across it: thermal equilibrium gives the capacitor energy $\\tfrac12C\\langle v^2\\rangle=\\tfrac12k_BT$.\n2. So $\\langle v^2\\rangle=k_BT/C$, independent of $R$.\n3. The RC filter's noise bandwidth is $\\int_0^\\infty\\lvert H\\rvert^2df=\\frac{\\pi}{2}f_c=\\frac{1}{4RC}$ (A7).\n4. If the resistor's noise density is $e^2$ (V²/Hz), then $\\langle v^2\\rangle=e^2/(4RC)$.\n5. Equate: $e^2/(4RC)=k_BT/C$ ⇒ $e^2=4k_BTR$, so $v_n=\\sqrt{4k_BTR\\Delta f}$.\n\n**(d) Shot noise (sketch).**\n1. In time $t_0$, a current $I$ carries on average $\\bar k=It_0/q_e$ electrons, arriving independently (Poisson), so the count fluctuates by $\\sqrt{\\bar k}$.\n2. Current fluctuation: $q_e\\sqrt{\\bar k}/t_0=\\sqrt{q_eI/t_0}$.\n3. Averaging over $t_0$ is a bandwidth $\\Delta f=1/(2t_0)$: $i_n=\\sqrt{2q_eI\\Delta f}$.\n4. Relative noise $i_n/I=\\sqrt{2q_e\\Delta f/I}$ falls as $1/\\sqrt I$: more light, relatively less noise.\n\n**(e) Resolution and LOD.**\n1. Small-signal output change: $\\Delta y=S\\,\\Delta s$.\n2. It is visible when $\\Delta y\\gtrsim\\sigma_n$, so $\\Delta s_{\\min}=\\sigma_n/S$.\n3. \"Present at all\" with false-alarm probability about 0.1% (one-sided $3\\sigma$): $\\mathrm{LOD}=3\\sigma_n/S$.\n\n**(f) Allan deviation shape.**\n1. White noise $\\sigma_n$ per sample at rate $f_s$: averages over $T_{\\text{av}}$ contain $M=f_sT_{\\text{av}}$ samples, so the white part is $\\sigma_n/\\sqrt{f_sT_{\\text{av}}}$.\n2. A bias that random-walks with strength $K_b$ adds a part that grows: $\\sigma_A^2=\\dfrac{\\sigma_n^2}{f_sT_{\\text{av}}}+\\dfrac{K_b^2T_{\\text{av}}}{3}$.\n3. Minimum where the derivative is zero: $T_{\\text{av}}^*=\\sqrt{3\\sigma_n^2/f_s}/K_b$.\n4. With $\\sigma_n=0.1$ °/s, $f_s=100$ Hz, $K_b=10^{-4}$ °/s/√s: $T_{\\text{av}}^*=173$ s, $\\sigma_A=0.0011$ °/s.\n\n**(g) Ellipsoid to sphere.**\n1. Readings $\\mathbf m=A_{\\text{si}}\\mathbf B_E+\\mathbf m_0$ with $\\lvert\\mathbf B_E\\rvert=50$ µT.\n2. Then $\\mathbf B_E=A_{\\text{si}}^{-1}(\\mathbf m-\\mathbf m_0)$, and $\\lvert\\mathbf B_E\\rvert^2=$ const gives $(\\mathbf m-\\mathbf m_0)^{\\mathsf T}\\mathsf Q'(\\mathbf m-\\mathbf m_0)=1$, an ellipsoid, with $\\mathsf Q'=A_{\\text{si}}^{-\\mathsf T}A_{\\text{si}}^{-1}/50^2$.\n3. Expanded, it is $\\mathbf m^{\\mathsf T}\\mathsf Q\\mathbf m+2\\mathbf d^{\\mathsf T}\\mathbf m=1$: linear in the 9 unknowns, so it is a least-squares fit like (b).\n4. Centre: the gradient $2\\mathsf Q\\mathbf m+2\\mathbf d$ vanishes at $\\mathbf m_0=-\\mathsf Q^{-1}\\mathbf d$.\n5. Diagonalise $\\mathsf Q'=\\mathsf V\\Lambda\\mathsf V^{\\mathsf T}$; then $\\mathbf m_{\\text{cal}}=50\\,\\mathsf V\\Lambda^{1/2}\\mathsf V^{\\mathsf T}(\\mathbf m-\\mathbf m_0)$ has length 50 µT for every reading.\n\n## Worked check\n\n**Johnson noise.** $4k_BT=4\\times1.380649\\times10^{-23}\\times300=1.6568\\times10^{-20}$ J. Times $R\\Delta f=10^4\\times10^4=10^8$:\n$1.6568\\times10^{-12}$ V². Square root: $v_n=1.287$ µV ✓. Averaging $M=100$ independent readings lowers it to 128.7 nV.\n\n**Two-point calibration.** $y_0=0.3$ kg, $S=(70.9-0.3)/70.0=1.00857$. Raw 82.0 kg: $(82.0-0.3)/1.00857=81.01$ kg ✓.\n\n**LOD.** $3\\times0.3$ nA $/\\ 2$ nA/mM $=0.45$ mM ✓. (All numbers: `scripts/checks/A8_check.py`.)\n\n## Whiteboard plan\n\n- **Panel 1: two kinds of error.** Four targets: tight and centred, tight and off, loose and centred, loose and off. Label the axes\n  \"precision\" (spread) and \"accuracy\" (offset). Write \"calibration fixes the offset; averaging fixes the spread\".\n- **Panel 2: the bell curve.** A Gaussian with ±σ, ±2σ, ±3σ marks: 68%, 95%, 99.7%. Write \"rms = σ for zero-mean noise\".\n- **Panel 3: three noises.** A resistor with jittering electrons → $\\sqrt{4k_BTR\\Delta f}$; raindrops on a roof → $\\sqrt{2q_eI\\Delta f}$; a\n  log-log noise plot that rises at low $f$ (1/f) and flattens (white) with the corner marked.\n- **Panel 4: averaging.** A noisy trace, a smooth running mean, and $\\sigma/\\sqrt M$ with \"4× samples → ½ noise\". Show the slow\n  response to a step. Then $\\Delta s_{\\min}=\\sigma_n/S$, $\\mathrm{LOD}=3\\sigma_n/S$.\n- **Panel 5: calibration.** Scatter of known $s$ vs measured $y$, the fitted line, its intercept $y_0$ and slope $S$, and\n  $s=(y-y_0)/S$. Beside it a thermometer and \"drift: $y_0(T)$\".\n- **Panel 6: the 3D compass.** An offset, tilted egg next to a centred ball. Arrows: subtract centre, rotate, scale, rotate back.\n\n## Common mistakes and where the intuition breaks\n\n- **Averaging a bias away.** No number of readings removes an offset that is in every reading. Averaging gives you a very precise wrong answer.\n- **Averaging correlated noise.** The $1/\\sqrt M$ law needs *independent* samples. Samples taken faster than the filter's time constant\n  (A7) are almost copies of each other; 1/f noise and drift are correlated over long times. That is exactly what the Allan deviation shows.\n- **Confusing resolution with accuracy.** A display with 0.01 g digits on a kitchen scale is not 0.01 g accurate; resolution is about noise,\n  accuracy about calibration.\n- **Calibrating outside the conditions of use.** A sensor calibrated at 20 °C carries a temperature-dependent offset elsewhere. Calibrate\n  over the range you need, or model the drift.\n- **Two points when the sensor is not linear.** A two-point line through a curved response is exact at the two points and wrong in the\n  middle. Use more points, check the residuals, and fit a curve if they show a pattern.\n- **Mixing up rms, peak and peak-to-peak.** For Gaussian noise, peak-to-peak on a scope is about $6\\sigma_n$; for a sine, rms = amplitude/√2.\n- **Where the Gaussian picture breaks.** Real sensors also produce rare large spikes (a cosmic ray on a pixel, a dropped bit, a bump on\n  the table). A single outlier can wreck a least-squares fit; robust methods (median, discarding points beyond 3σ) are then better.\n\n## Remember\n\n**\"Bias needs calibration, noise needs averaging, and averaging only buys 1/√M while time and drift keep score.\"**\n\n## Self-test\n\n1. A thermistor bridge has 2 µV rms noise in its bandwidth and a sensitivity of 400 µV/°C. What is its resolution in °C, and how many readings must you average to resolve 0.001 °C?\n   <details><summary>Answer<\/summary>Resolution = 2/400 = 0.005 °C. To reach 0.001 °C you need 5 times less noise, so M = 25 independent readings (as long as drift stays smaller than 0.001 °C over that time).<\/details>\n2. A pH sensor reads 4.12 in a pH 4.00 buffer and 7.18 in a pH 7.00 buffer. Find the offset and the gain, and correct a reading of 5.60.\n   <details><summary>Answer<\/summary>Gain S = (7.18 − 4.12)/(7.00 − 4.00) = 1.02. Offset: y0 = 4.12 − 1.02 × 4.00 = 0.04. Corrected pH = (5.60 − 0.04)/1.02 = 5.45.<\/details>\n3. Your phone compass points 30° wrong near a laptop, but is fine in the park. Hard iron or soft iron, and why does the figure-eight wave not fix it permanently?\n   <details><summary>Answer<\/summary>The laptop's magnets add a field that the phone did not carry when it was calibrated, so it acts like a new external offset. Calibration only removes distortions that move with the phone (its own hard and soft iron); a field from outside that changes from place to place cannot be calibrated away and has to be detected (for example because the measured length is no longer 50 µT) and ignored, using the gyro instead (A9).<\/details>\n\n**Next:** [A9 Sensor fusion and the Kalman filter](#A9) — when every sensor has its own noise and drift, the best answer comes from combining them, each weighted by how much it can be trusted.\n"}, {"id": "A9", "short": "Sensor fusion and the Kalman filter", "title": "Sensor fusion and the Kalman filter", "part": "A", "md": "# A9. Sensor fusion and the Kalman filter\n\n> **Connects:** builds on [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration and drift](#A8) · used by [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C5 Lab-on-a-chip](#C5)\n\n## Hook — two friends' guesses, weighted by how reliable each one is\n\nYou are guessing the height of a tree with two friends. Ana is a surveyor with a laser meter; she says 12 m and is usually\nwithin half a metre. Ben squints and says 15 m; he is usually off by 3 m. Do you take the average, 13.5 m? Of course not:\nyou lean heavily towards Ana. But you do not ignore Ben completely either. The question \"how much to lean\" has an exact\nanswer, and it is the heart of every drone, phone and car that knows where it is.\n\nA drone holding its height has the same problem. Its **barometer** gives altitude directly but jitters by a metre or two. Its\n**accelerometer** is smooth and fast, but to get altitude you must integrate it twice, so its small bias grows into metres of drift\nwithin seconds. Neither alone is good enough. **Sensor fusion** combines them so that each covers the other's weakness, and the\n**Kalman filter** is the recipe that does it, step by step, with the trust in each sensor computed on the fly.\n\n## The idea in plain words\n\n**Two guesses of one quantity.** Suppose two sensors measure the same thing $x$: reading $z_1$ with noise standard deviation $\\sigma_1$,\nand $z_2$ with $\\sigma_2$. Their errors are independent and unbiased (calibrated, as in [A8](#A8)).\nAny blend $\\hat x=w\\,z_1+(1-w)\\,z_2$ with weights adding to 1 is also unbiased. Its variance, because independent variances add\nwith the squares of their weights, is\n$$\\sigma^2(w)=w^2\\sigma_1^2+(1-w)^2\\sigma_2^2.$$\nThis is a parabola in $w$. Its lowest point is at $w=\\sigma_2^2/(\\sigma_1^2+\\sigma_2^2)$: **each sensor is weighted by the other's\nvariance**, which is the same as weighting each by its own $1/\\sigma^2$. The result is\n$$\\hat x=\\frac{z_1/\\sigma_1^2+z_2/\\sigma_2^2}{1/\\sigma_1^2+1/\\sigma_2^2},\\qquad \\frac1{\\sigma^2}=\\frac1{\\sigma_1^2}+\\frac1{\\sigma_2^2}.$$\nThe quantity $1/\\sigma^2$ is called the **precision**, and **precisions add**. So the fused answer is always *better than the better\nsensor*, never worse, even when the second sensor is poor. A barometer saying 102 m (±2 m) and a GPS saying 98 m (±4 m) fuse to\n101.2 m ±1.79 m.\n\nThis is not a trick specific to fusion. It is exactly what weighted **least squares** gives (A8): minimise\n$(x-z_1)^2/\\sigma_1^2+(x-z_2)^2/\\sigma_2^2$, set the derivative to zero, and the same formula appears. And if both readings are\nGaussian bell curves, multiplying them gives another bell curve with exactly this mean and this width.\n\n```viz\na9-two-guesses\n```\n\n**Rewrite it as a correction.** The same answer can be written as \"start from guess 1 and move part of the way to guess 2\":\n$$\\hat x=z_1+K\\,(z_2-z_1),\\qquad K=\\frac{\\sigma_1^2}{\\sigma_1^2+\\sigma_2^2}.$$\nThe **gain** $K$ is a number between 0 and 1. If guess 1 is very uncertain ($\\sigma_1$ large), $K\\to1$ and we jump to the new\nreading. If the new reading is very noisy, $K\\to0$ and we barely move. **$K$ says how much to trust the new measurement.** The\ndifference $z_2-z_1$ is called the **innovation**: the surprise in the new reading.\n\n**The Kalman filter: fusion over time.** Now let the quantity change. A drone's altitude $x$ evolves, and every $\\Delta t$ (here 0.1 s)\nwe have two pieces of information:\n- a **model** that predicts where it should be now from where it was, using the accelerometer: the climb rate $u$ (from integrating\n  the accelerometer) says $x_k\\approx x_{k-1}+u_k\\Delta t$. The model is imperfect: its error per step has variance $\\sigma_w^2$,\n  the **process noise**;\n- a **measurement** $z_k=x_k+v_k$ from the barometer, with noise variance $\\sigma_v^2$.\n\nThe filter keeps an estimate $\\hat x$ and its variance $p$ (how unsure it is), and repeats two steps forever:\n\n1. **Predict.** Move the estimate with the model: $\\hat x^-=\\hat x+u\\,\\Delta t$. Uncertainty grows, because the model adds its own\n   error: $p^-=p+\\sigma_w^2$.\n2. **Update.** Fuse the prediction (variance $p^-$) with the measurement (variance $\\sigma_v^2$) exactly as with the two guesses:\n   $$K=\\frac{p^-}{p^-+\\sigma_v^2},\\qquad \\hat x=\\hat x^-+K\\,(z-\\hat x^-),\\qquad p=(1-K)\\,p^-.$$\n\nThat is the whole 1D Kalman filter: five lines. The prediction is \"guess 1\", the barometer is \"guess 2\", and the gain is recomputed\nevery step from how uncertain the prediction currently is. After a few steps $p$ settles to a steady value where the growth in the\npredict step exactly balances the shrinking in the update step, and $K$ becomes a constant. For $\\sigma_w^2=0.01$ m² and $\\sigma_v^2=4$ m²\nthe steady gain is $K=0.049$: the filter acts like an average of about 20 barometer readings, but one that follows the drone's motion\nthanks to the model. Its error is 0.44 m instead of the barometer's 2 m.\n\n```viz\na9-kalman\n```\n\n**What the two noises mean.** $\\sigma_v$ is how much you distrust the sensor; $\\sigma_w$ is how much you distrust your model. If you\nclaim the model is perfect ($\\sigma_w\\to0$), $K\\to0$ and the filter ignores the barometer and drifts with the accelerometer. If you\nclaim the barometer is perfect ($\\sigma_v\\to0$), $K\\to1$ and the estimate copies every noisy reading. Tuning a Kalman filter means\nchoosing these two honestly, from the noise and drift measured as in A8.\n\n**The complementary filter: the cheap cousin for tilt.** A phone or drone also needs its **tilt angle** $\\theta$. An accelerometer at\nrest measures gravity, so $\\theta_{\\text{acc}}=\\arctan(a_x/a_z)$: correct on average but noisy, and fooled by every shake. A\n**gyroscope** measures the rotation rate $\\Omega$; integrating it, $\\theta\\leftarrow\\theta+\\Omega\\Delta t$, is smooth and fast but drifts\nbecause of the gyro's bias. The **complementary filter** combines them:\n$$\\hat\\theta_k=\\alpha\\,(\\hat\\theta_{k-1}+\\Omega_k\\Delta t)+(1-\\alpha)\\,\\theta_{\\text{acc},k},\\qquad \\alpha=\\frac{\\tau}{\\tau+\\Delta t}.$$\nThis is a **high-pass** filter on the gyro and a **low-pass** filter on the accelerometer with the same time constant $\\tau$ ([A7](#A7)):\nfast changes come from the gyro, the long-term truth from gravity. The two filters add up to exactly 1 at every frequency, so the\ntrue angle passes undistorted, hence \"complementary\". It is a Kalman filter with a fixed gain.\n\n**GPS + IMU and the drone in 3D.** Outdoors, a drone fuses a **GPS** (about 1 fix per second, ±3 m, never drifts) with an **IMU**\n(accelerometers and gyros at hundreds of Hz, smooth, but drifts). Between fixes the filter predicts with the IMU, and its uncertainty\ngrows; at each fix it updates and the uncertainty shrinks. In 3D the uncertainty is no longer a number $p$ but an **ellipsoid**: GPS is\ntypically worse vertically than horizontally, so the ellipsoid is tall. When GPS is lost (under a bridge, in a forest), the filter coasts\non the IMU and the ellipsoid balloons, growing like $t^2$ because a bias in acceleration integrates twice.\n\n```viz\na9-drone-3d\n```\n\n## Intuitive examples\n\n1. **Barometer and GPS altitude.** $z_1=102$ m ($\\sigma_1=2$ m) and $z_2=98$ m ($\\sigma_2=4$ m). Weight on the barometer\n   $16/20=0.80$; fused $\\hat x=101.20$ m; variance $1/(1/4+1/16)=3.20$ m², $\\sigma=1.789$ m. The plain average (100.0 m) would have\n   $\\sigma=2.236$ m, worse than the barometer alone. In Kalman form, $K=4/20=0.20$ and $102+0.2\\times(98-102)=101.20$ m.\n2. **Two equal thermometers.** 10 °C and 12 °C, both $\\sigma=1$ °C: fused 11.0 °C with $\\sigma=0.707$ °C $=1/\\sqrt2$, the $1/\\sqrt M$ law of A8 with $M=2$.\n3. **Three Kalman steps by hand.** Start $\\hat x=100$ m, $p=9$ m²; $\\sigma_w^2=0.01$, $\\sigma_v^2=4$. Reading 104: $p^-=9.010$, $K=0.6925$,\n   $\\hat x=102.770$, $p=2.770$. Reading 101: $p^-=2.780$, $K=0.4100$, $\\hat x=102.044$, $p=1.640$. Reading 103: $p^-=1.650$, $K=0.2921$,\n   $\\hat x=102.323$, $p=1.168$ ($\\sigma=1.08$ m). The gain falls as the filter becomes sure of itself.\n4. **Steady state.** $\\sigma_w^2=0.01$, $\\sigma_v^2=4$: $p^-=0.2051$, $K=0.0488$, $\\sigma=0.442$ m (vs 2 m raw); a simulation of 20 000 steps\n   measures 0.435 m. More process noise, $\\sigma_w^2=0.1$: $K=0.146$, $\\sigma=0.765$ m. A better barometer, $\\sigma_v^2=0.25$: $K=0.181$, $\\sigma=0.213$ m.\n5. **Complementary filter for tilt.** $\\tau=0.5$ s, $\\Delta t=0.01$ s: $\\alpha=0.9804$. A gyro bias of 0.5 °/s alone gives 30° of drift after\n   60 s; in the complementary filter it leaves a constant error of only $b\\tau=0.25°$. Accelerometer tilt with $a_x=0.17$ g, $a_z=0.985$ g:\n   9.8°; but a 0.2 g sideways jolt fools it by 11.3°, which is why the gyro must carry the fast part.\n6. **Why GPS is needed.** An accelerometer bias of 0.05 m/s², integrated twice, gives a position error $\\tfrac12bt^2$: 0.025 m after 1 s,\n   2.5 m after 10 s, **90 m** after 60 s. A barometer with 20 Pa of noise, at 11.8 Pa per metre, is good to 1.70 m, never drifting far.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $\\hat x=\\dfrac{z_1/\\sigma_1^2+z_2/\\sigma_2^2}{1/\\sigma_1^2+1/\\sigma_2^2}$ | inverse-variance (minimum-variance) fusion | $z_1,z_2$ readings, $\\sigma_1,\\sigma_2$ their noise |\n| $1/\\sigma^2=1/\\sigma_1^2+1/\\sigma_2^2$ | precisions add: fused is better than either | |\n| $\\hat x=z_1+K(z_2-z_1)$, $K=\\sigma_1^2/(\\sigma_1^2+\\sigma_2^2)$ | the same, as a correction with gain $K$ | |\n| $\\hat x^-=\\hat x+u\\,\\Delta t$, $p^-=p+\\sigma_w^2$ | Kalman predict | $u$ model input, $\\sigma_w^2$ process noise |\n| $K=p^-/(p^-+\\sigma_v^2)$ | Kalman gain: trust in the new reading | $\\sigma_v^2$ measurement noise |\n| $\\hat x=\\hat x^-+K(z-\\hat x^-)$, $p=(1-K)p^-$ | Kalman update | $z$ measurement |\n| $(p^-)^2-\\sigma_w^2p^--\\sigma_w^2\\sigma_v^2=0$ | steady-state predicted variance | |\n| $\\hat\\theta_k=\\alpha(\\hat\\theta_{k-1}+\\Omega_k\\Delta t)+(1-\\alpha)\\theta_{\\text{acc},k}$ | complementary filter | $\\alpha=\\tau/(\\tau+\\Delta t)$ |\n| $\\theta_{\\text{acc}}=\\arctan(a_x/a_z)$ | tilt from gravity | $a_x,a_z$ accelerometer axes |\n| $e=\\tfrac12 b\\,t^2$ | dead-reckoning drift from an accelerometer bias $b$ | |\n\n## Applications\n\n| World | Sensor fusion | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | tractors and spraying drones fuse RTK-GPS with IMUs to drive rows within 2 cm; soil-moisture maps fuse point probes with satellite and drone imagery, weighted by their uncertainty | weighting by variance is how a few accurate probes correct many cheap, noisy images |\n| 🧬 Biology & human health | smartwatches fuse PPG heart rate with the accelerometer to reject motion artefacts; continuous glucose monitors use a Kalman filter to smooth readings and predict 20 minutes ahead | the filter's prediction step is what lets a glucose alarm warn before the level is low |\n| 🌍 Environment | air-quality networks fuse cheap sensors with a few reference stations; weather forecasting is a giant Kalman-type fusion (data assimilation) of millions of observations with a physics model | a forecast is a predict step; every new weather-balloon reading is an update |\n| 🤖 Robotics & drones | every flight controller fuses gyro + accelerometer (attitude), barometer + accelerometer (altitude), GPS + IMU (position), plus optical flow and LiDAR near the ground | without fusion a drone either jitters (raw barometer) or drifts away (raw IMU) |\n| 🚗 Cars | navigation fuses GPS with wheel-speed sensors and a yaw-rate gyro to keep the position in tunnels; driver assistance fuses radar (good range) and camera (good classification) | in a tunnel the uncertainty ellipse grows until the first GPS fix snaps it back |\n| 📱 Phones & photography | the \"game rotation vector\" fuses gyro, accelerometer and compass; optical image stabilisation uses the gyro at kHz rates; photo stacking fuses frames weighted by sharpness | the compass needle stays steady because the gyro carries the fast motion and the magnetometer the slow truth |\n| 🏠 Home & household | robot vacuums fuse wheel odometry, a gyro and LiDAR or camera features to map rooms; smart thermostats fuse several room sensors and the weather forecast | the robot \"knows\" where it is by fusing a drifting model with occasional landmark sightings |\n\n## Derivation\n\n**(a) Minimum-variance blend.**\n1. $\\hat x=wz_1+(1-w)z_2$ with $z_i=x+n_i$; $\\hat x-x=wn_1+(1-w)n_2$, mean 0 for any $w$.\n2. Independent errors: $\\sigma^2(w)=w^2\\sigma_1^2+(1-w)^2\\sigma_2^2$.\n3. $d\\sigma^2/dw=2w\\sigma_1^2-2(1-w)\\sigma_2^2=0$ ⇒ $w^*=\\sigma_2^2/(\\sigma_1^2+\\sigma_2^2)$.\n4. Second derivative $2(\\sigma_1^2+\\sigma_2^2)>0$: a minimum.\n5. Plug in: $\\sigma^2(w^*)=\\sigma_1^2\\sigma_2^2/(\\sigma_1^2+\\sigma_2^2)$, i.e. $1/\\sigma^2=1/\\sigma_1^2+1/\\sigma_2^2$.\n6. Divide top and bottom by $\\sigma_1^2\\sigma_2^2$: $\\hat x=(z_1/\\sigma_1^2+z_2/\\sigma_2^2)/(1/\\sigma_1^2+1/\\sigma_2^2)$.\n\n**(b) The same from weighted least squares.**\n1. Minimise $J(x)=(x-z_1)^2/\\sigma_1^2+(x-z_2)^2/\\sigma_2^2$.\n2. $dJ/dx=2(x-z_1)/\\sigma_1^2+2(x-z_2)/\\sigma_2^2=0$.\n3. Solve for $x$: the formula of (a). The curvature $d^2J/dx^2=2(1/\\sigma_1^2+1/\\sigma_2^2)=2/\\sigma^2$ is the precision.\n\n**(c) The same from multiplying Gaussians.**\n1. $e^{-(x-z_1)^2/2\\sigma_1^2}\\cdot e^{-(x-z_2)^2/2\\sigma_2^2}=e^{-J(x)/2}$ with $J$ from (b).\n2. $J$ is a parabola in $x$, so the product is a Gaussian centred where $J$ is smallest, with $1/\\sigma^2$ equal to half the curvature of $J$.\n\n**(d) Gain form.**\n1. $\\hat x=w^*z_1+(1-w^*)z_2=z_1+(1-w^*)(z_2-z_1)$.\n2. $1-w^*=\\sigma_1^2/(\\sigma_1^2+\\sigma_2^2)=K$.\n3. $\\sigma^2=\\sigma_1^2\\sigma_2^2/(\\sigma_1^2+\\sigma_2^2)=(1-K)\\sigma_1^2$.\n\n**(e) The 1D Kalman filter.**\n1. Model: $x_k=x_{k-1}+u_k\\Delta t+w_k$, $w_k$ with variance $\\sigma_w^2$; measurement $z_k=x_k+v_k$, variance $\\sigma_v^2$.\n2. Predict: $\\hat x^-=\\hat x_{k-1}+u_k\\Delta t$; its error $(\\hat x_{k-1}-x_{k-1})-w_k$ has variance $p^-=p_{k-1}+\\sigma_w^2$ (independent errors add).\n3. Update: fuse \"guess 1\" $=\\hat x^-$ (variance $p^-$) with \"guess 2\" $=z_k$ (variance $\\sigma_v^2$) using (d): $K=p^-/(p^-+\\sigma_v^2)$.\n4. $\\hat x_k=\\hat x^-+K(z_k-\\hat x^-)$, $p_k=(1-K)p^-$.\n5. Steady state: $p=p^-\\sigma_v^2/(p^-+\\sigma_v^2)$ and $p^-=p+\\sigma_w^2$ ⇒ $(p^-)^2-\\sigma_w^2p^--\\sigma_w^2\\sigma_v^2=0$ ⇒ $p^-=\\tfrac12\\big(\\sigma_w^2+\\sqrt{\\sigma_w^4+4\\sigma_w^2\\sigma_v^2}\\big)$.\n6. In steady state the update is $\\hat x_k=(1-K)\\hat x^-+Kz_k$: a first-order low-pass on the measurements (A7), whose cutoff is set by $\\sigma_w/\\sigma_v$.\n\n**(f) Complementary filter steady error from a gyro bias.**\n1. True tilt 0, accelerometer perfect, gyro reads a bias $b$: $e_k=\\alpha(e_{k-1}+b\\Delta t)$.\n2. Steady state $e=\\alpha(e+b\\Delta t)$ ⇒ $e=\\alpha b\\Delta t/(1-\\alpha)$.\n3. With $\\alpha=\\tau/(\\tau+\\Delta t)$: $\\alpha/(1-\\alpha)=\\tau/\\Delta t$, so $e=b\\tau$: bounded, instead of growing as $bt$.\n\n**(g) Dead reckoning drift.**\n1. Constant acceleration bias $b$: velocity error $bt$.\n2. Integrate again: position error $\\tfrac12bt^2$. Drift grows quadratically, which is why the IMU needs an absolute sensor (GPS, barometer).\n\n## Worked check\n\n**Fusion.** $z_1=102$, $\\sigma_1^2=4$; $z_2=98$, $\\sigma_2^2=16$. Weights $1/4=0.25$ and $1/16=0.0625$; sum 0.3125.\n$\\hat x=(102\\times0.25+98\\times0.0625)/0.3125=(25.5+6.125)/0.3125=101.20$ m ✓; $\\sigma^
