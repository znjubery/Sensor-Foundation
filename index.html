requency. If the chip\nrotates at rate $\\Omega$ about the axis perpendicular to the chip, then, seen from inside the chip, the moving mass feels the\n**Coriolis force**\n$$\\mathbf F=-2m\\,\\boldsymbol\\Omega\\times\\mathbf v,\\qquad \\lvert F\\rvert=2m\\,\\Omega\\,\\dot x,$$\nat right angles to both the rotation axis and the velocity. It pushes the mass sideways along $y$, the **sense mode**.\nBecause $\\dot x$ flips sign every half cycle, the force wiggles at $\\omega_d$ with an amplitude proportional to $\\Omega$.\nThe chip reads that sideways wiggle with capacitor plates and multiplies it by a reference locked to the drive\n(**demodulation**, a lock-in amplifier, A7), which turns the 20 kHz wiggle into a steady number proportional to $\\Omega$,\nwith its sign. No rotation, no wiggle: that is why the mass must keep moving.\n\n**Mode matching.** The sense mode is itself a spring–mass with its own natural frequency $\\omega_s$. If $\\omega_s$ is far\nfrom $\\omega_d$, the Coriolis force only nudges it statically, $y\\approx F/k_s$. If you tune $\\omega_s$ close to\n$\\omega_d$, resonance amplifies the response (B3), up to $Q_f$ times when the two modes are **matched**. More signal, but\nthe same rule as before bites: a resonance with quality factor $Q_f$ needs about $Q_f$ cycles to build up, so the\nbandwidth shrinks to about $f_d/(2Q_f)$. Consumer gyros keep the modes a few hundred hertz to a kilohertz apart;\nnavigation-grade ones match them and use feedback to regain bandwidth.\n\n```viz\nb4-gyro-3d\n```\n\n**The IMU: six (or nine) numbers.** An **inertial measurement unit** packs three accelerometer axes and three gyroscope axes\ninto one package of about $3\\times3\\times1$ mm, often with a three-axis magnetometer (A4) as a compass, the \"9-axis\" IMU.\nAccelerometers give tilt (but are fooled by acceleration); gyros give rate of turn (but drift); the magnetometer gives\nheading (but is fooled by steel and motors). Combining them is sensor fusion (A9).\n\n**Bias, noise density and drift.** Two numbers on every datasheet decide how good an inertial sensor is (A8):\n- the **bias** ($\\Omega_b$ for a gyro, $a_b$ for an accelerometer), the reading with no input (a gyro reading 0.05 °/s while lying still, an accelerometer reading 1 mg on\n  a level table). It changes with temperature and time, so it can only be partly calibrated away;\n- the **noise density**, in µg/√Hz for accelerometers and (°/s)/√Hz for gyros: the rms noise in a 1 Hz bandwidth.\n  The rms noise in a bandwidth $\\Delta f$ is the density times $\\sqrt{\\Delta f}$.\n\nBias hurts most when you **integrate**. A gyro gives the *rate* of turn; the angle is its integral, so a constant bias $\\Omega_b$\nbecomes an angle error $\\Omega_b\\,t$ that grows forever, and white noise with density $N_\\Omega$ adds a random walk of\nsize $N_\\Omega\\sqrt t$ (the **angle random walk**, usually quoted as $60N_\\Omega$ in °/√h). Position from an accelerometer\nis a double integral, so a bias $a_b$ gives a position error $\\tfrac12 a_b\\,t^2$: a disaster within a minute. That is why a phone cannot\ntrack your position from its IMU alone, and why every drone fuses the gyro with something that does not drift.\n\n```viz\nb4-drift\n```\n\n**Why tiny is good, and where it stops (B1).** A smaller proof mass makes a higher $f_0$ for the same spring, so it\nmoves less; but the thermal jiggling of the mass by air molecules (Brownian noise) grows as the mass shrinks:\nthe noise floor is $a_n=\\sqrt{4k_BT\\omega_0/(mQ_f)}$ per √Hz. Shrinking $m$ by 10 raises the floor by $\\sqrt{10}$. That is the\nfundamental limit of a microgram proof mass, and the reason high-end accelerometers use bigger masses and vacuum\npackaging.\n\n## Intuitive examples\n\n1. **The phone accelerometer by numbers.** A proof mass of $m=1$ µg with $f_0=3$ kHz has $\\omega_0=18\\,850$ rad/s and\n   $k=m\\omega_0^2=0.355$ N/m (softer than a hair on a comb). One g moves it $x=9.81/(3.553\\times10^8)=27.6$ nm, about\n   117 silicon atoms side by side. One milli-g moves it 27.6 pm, a fraction of an atom's diameter, which works because the capacitor\n   averages over a huge area.\n2. **The trade-off in one row.** $x$ per g for $f_0=1$, $3$, $10$, $30$ kHz: $248$ nm, $27.6$ nm, $2.48$ nm, $0.28$ nm.\n   Ten times the bandwidth costs a hundred times the signal.\n3. **Tilt.** A phone held with readings $(a_x,a_y,a_z)=(0,\\;0.5,\\;0.866)$ g is rolled by $\\operatorname{atan2}(0.5,0.866)=30.0°$;\n   readings $(-0.259,\\;0,\\;0.966)$ g mean a pitch of $-15.0°$. With 100 µg/√Hz and a 100 Hz bandwidth, the noise is\n   1.0 mg rms, a tilt resolution of 0.057°. A single axis loses accuracy near vertical: the same 1 mg is $0.057°$ at\n   level, $0.081°$ at 45° and $0.330°$ at 80°, because $\\sin\\theta_p$ flattens out. Use all three axes.\n4. **The Brownian floor.** For $m=1$ µg, $f_0=3$ kHz, $Q_f=1$ (air damping) at 25 °C ($k_BT=4.12\\times10^{-21}$ J):\n   $a_n=5.57\\times10^{-4}$ m/s²/√Hz $=57$ µg/√Hz, or 0.57 mg rms over 100 Hz. Real consumer parts quote about\n   100–200 µg/√Hz: they are within a factor of a few of physics.\n5. **Integrating a bias.** A gyro bias of 0.05 °/s gives 0.5° after 10 s, 3.0° after a minute and 30.0° after 10 min. A\n   noise density of 0.01 (°/s)/√Hz adds a random walk of only 0.10° after 100 s (0.6 °/√h). An accelerometer bias of 1 mg\n   integrated twice gives 0.005 m after 1 s, 0.49 m after 10 s and 17.7 m after a minute.\n6. **Airbag.** A car hitting a wall at 50 km/h (13.89 m/s) and stopping in 0.1 s decelerates on average at 139 m/s² $=14.2$ g,\n   with peaks several times higher. In the first 20 ms, while the controller decides, the speed already drops by 2.78 m/s.\n   An airbag accelerometer with $f_0=20$ kHz moves only 31.1 nm at 50 g, so it does not slam into its stops.\n7. **Image stabilisation.** Your hand shakes a phone by about 0.05° at a few hertz. With a 4.3 mm focal length, the image\n   moves $4.3\\text{ mm}\\times0.05°\\times\\pi/180=3.75$ µm, about 3.1 pixels of 1.2 µm: a visibly blurred photo in a 1/15 s\n   exposure. The gyro measures the shake and the lens is shifted back (B5).\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $m\\ddot x+b\\dot x+kx=-ma$ | proof mass in an accelerating frame | $x$ shift relative to frame, $b$ damping |\n| $x=\\dfrac{ma}{k}=\\dfrac{a}{\\omega_0^2}$ (for $f\\ll f_0$) | static deflection: sensitivity $\\propto 1/\\omega_0^2$ | $\\omega_0=\\sqrt{k/m}=2\\pi f_0$ |\n| $C_{1,2}=\\dfrac{\\varepsilon_0A}{g_0\\mp x}$, $\\;C_1-C_2\\approx2C_0\\dfrac{x}{g_0}$ | differential comb readout | $g_0$ rest gap, $A$ finger area, $C_0=\\varepsilon_0A/g_0$ |\n| $V_{\\text{out}}=V_{\\text{ex}}\\dfrac{C_1-C_2}{C_1+C_2}=V_{\\text{ex}}\\dfrac{x}{g_0}$ | capacitive half-bridge, exactly linear | $V_{\\text{ex}}$ drive amplitude |\n| $\\theta_p=\\operatorname{atan2}\\big(a_x,\\sqrt{a_y^2+a_z^2}\\big)$, $\\;\\phi_r=\\operatorname{atan2}(a_y,a_z)$ | tilt from gravity (no acceleration) | $\\theta_p$ pitch, $\\phi_r$ roll |\n| $\\mathbf F=-2m\\,\\boldsymbol\\Omega\\times\\mathbf v$, $\\;\\lvert F\\rvert=2m\\Omega\\dot x$ | Coriolis force on the driven mass | $\\Omega$ rotation rate, $\\dot x=\\omega_dX_d\\cos\\omega_dt$ |\n| $y=\\dfrac{F}{m\\sqrt{(\\omega_s^2-\\omega_d^2)^2+(\\omega_s\\omega_d/Q_f)^2}}$ | sense-mode response | $\\omega_s$ sense, $\\omega_d$ drive frequency |\n| matched: $y=Q_fF/k$, bandwidth $\\approx f_d/(2Q_f)$ | mode matching: signal vs speed | $Q_f$ quality factor |\n| $a_n=\\sqrt{4k_BT\\omega_0/(mQ_f)}$ | Brownian noise floor (per √Hz) | $k_B$, $T$ |\n| $\\theta_{\\text{err}}=\\Omega_b\\,t\\pm N_\\Omega\\sqrt t$; $\\;x_{\\text{err}}=\\tfrac12 a_b\\,t^2$ | integrated bias and noise | $\\Omega_b$, $a_b$ biases; $N_\\Omega$ gyro noise density |\n\n## Applications\n\n| World | Inertial sensing | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | tilt and sway loggers strapped to tree trunks and crop stems; IMUs on tractors, sprayer booms and grazing-cow collars | how wind loads trees (wind-throw risk), lodging of cereals, auto-steering to 2 cm, animal activity and rumination |\n| 🧬 Biology & human health | step counters, fall detectors, tremor monitors (Parkinson tremor at 4–6 Hz), sleep trackers, gait labs | daily activity, falls in the elderly, how a treatment changes a tremor, posture and gait asymmetry |\n| 🌍 Environment | low-cost MEMS seismometers, bridge and building health monitors, wave buoys, avalanche beacons | earthquake early warning from dense networks, ageing of structures, wave height and period |\n| 🤖 Robotics & drones | the IMU in every flight controller, gyro-stabilised gimbals, legged-robot balance, pedestrian dead reckoning | attitude at 1–8 kHz for the control loop; drift-free once fused with GPS, barometer and camera (A9) |\n| 🚗 Cars | airbag crash sensors (±50 to ±200 g), stability-control yaw-rate gyros, rollover detection, tunnel navigation | when to fire an airbag within ~20 ms; whether the car is skidding; position where GPS is lost |\n| 📱 Phones & photography | screen rotation, step counting, gyro-based optical and electronic image stabilisation, AR and games | which way is up; how much the hand shook during the exposure, so the lens or crop can undo it |\n| 🏠 Home & household | washing-machine imbalance detection, laptop free-fall detection that parks the disk head, game controllers, smart-lock knock sensing | stop the spin before the drum walks; save the disk in the 0.3 s of a fall |\n\n## Derivation\n\n**(a) The accelerometer as a spring–mass in a moving frame.**\n1. Let the frame be at position $u(t)$ and the mass at $u+x$. Newton on the mass: $m(\\ddot u+\\ddot x)=-kx-b\\dot x$.\n2. Call the frame's acceleration $a=\\ddot u$: $m\\ddot x+b\\dot x+kx=-ma$. The frame's acceleration acts like a force $-ma$.\n3. For slow inputs (frequency $\\ll f_0$) the mass is in equilibrium: $\\ddot x,\\dot x\\approx0$, so $x=-ma/k$.\n4. With $k=m\\omega_0^2$: $\\lvert x\\rvert=a/\\omega_0^2$. The mass is gone from the result; only $\\omega_0$ remains.\n5. For a sinusoidal input at $\\omega$, $\\lvert x\\rvert=\\dfrac{a/\\omega_0^2}{\\sqrt{(1-\\omega^2/\\omega_0^2)^2+(\\omega/(Q_f\\omega_0))^2}}$: flat below $\\omega_0$, falling as $1/\\omega^2$ above. That is the bandwidth.\n\n**(b) Differential capacitors.**\n1. $C_1=\\dfrac{\\varepsilon_0A}{g_0-x}$, $C_2=\\dfrac{\\varepsilon_0A}{g_0+x}$.\n2. $C_1-C_2=\\varepsilon_0A\\dfrac{(g_0+x)-(g_0-x)}{g_0^2-x^2}=\\dfrac{2\\varepsilon_0A\\,x}{g_0^2-x^2}\\approx2C_0\\dfrac{x}{g_0}$ for $x\\ll g_0$.\n3. $C_1+C_2=\\dfrac{2\\varepsilon_0A\\,g_0}{g_0^2-x^2}$.\n4. Ratio: $\\dfrac{C_1-C_2}{C_1+C_2}=\\dfrac{x}{g_0}$ exactly: the $1/(g_0^2-x^2)$ nonlinearity cancels.\n5. The middle electrode between $+V_{\\text{ex}}$ (via $C_1$) and $-V_{\\text{ex}}$ (via $C_2$) settles where the charges balance: $V_{\\text{out}}=V_{\\text{ex}}\\dfrac{C_1-C_2}{C_1+C_2}=V_{\\text{ex}}\\dfrac{x}{g_0}$.\n\n**(c) Tilt from gravity.**\n1. At rest the accelerometer reads the \"up\" vector of length $g_{\\text{grav}}$, written in the chip's axes.\n2. Roll by $\\phi_r$ about $x$, then pitch by $\\theta_p$ about $y$: the up vector in chip axes is $g_{\\text{grav}}(\\sin\\theta_p,\\;\\cos\\theta_p\\sin\\phi_r,\\;\\cos\\theta_p\\cos\\phi_r)$.\n3. $a_y/a_z=\\tan\\phi_r$, so $\\phi_r=\\operatorname{atan2}(a_y,a_z)$.\n4. $a_y^2+a_z^2=g_{\\text{grav}}^2\\cos^2\\theta_p$, so $\\tan\\theta_p=a_x/\\sqrt{a_y^2+a_z^2}$.\n5. Sensitivity of one axis: $da_x/d\\theta_p=g_{\\text{grav}}\\cos\\theta_p$, which goes to zero at 90°: a 1 mg error costs $1\\text{ mrad}/\\cos\\theta_p$.\n\n**(d) Coriolis force on a vibrating mass.**\n1. In a frame rotating at $\\boldsymbol\\Omega$, Newton's law gains the term $-2m\\,\\boldsymbol\\Omega\\times\\mathbf v$ (plus a centrifugal term $\\propto\\Omega^2$, negligible here).\n2. Drive: $x=X_d\\sin\\omega_dt$, so $\\mathbf v=\\omega_dX_d\\cos(\\omega_dt)\\,\\hat{\\mathbf x}$.\n3. With $\\boldsymbol\\Omega=\\Omega\\hat{\\mathbf z}$: $\\hat{\\mathbf z}\\times\\hat{\\mathbf x}=\\hat{\\mathbf y}$, so $\\mathbf F=-2m\\Omega\\omega_dX_d\\cos(\\omega_dt)\\,\\hat{\\mathbf y}$.\n4. The sense mode obeys $m\\ddot y+b_s\\dot y+k_sy=F_y$, a driven oscillator at $\\omega_d$ (B3).\n5. Its amplitude is $y=F/\\big(m\\sqrt{(\\omega_s^2-\\omega_d^2)^2+(\\omega_s\\omega_d/Q_f)^2}\\big)$; at $\\omega_s=\\omega_d$ this is $Q_fF/(m\\omega_d^2)=Q_fF/k$.\n6. Multiply $y(t)$ by a reference in phase with $F$ and average: the result is $\\propto\\Omega$, sign included.\n\n**(e) Integrating errors.**\n1. Gyro: $\\theta_{\\text{meas}}(t)=\\int_0^t(\\Omega+\\Omega_b+n_\\Omega)\\,dt'$, so the error is $\\Omega_b\\,t+\\int_0^tn_\\Omega\\,dt'$ ($n_\\Omega$ = rate noise).\n2. Sample the rate every $\\Delta t$: each sample has noise variance $N_\\Omega^2/\\Delta t$ (density squared times bandwidth $1/\\Delta t$). The angle adds $t/\\Delta t$ such samples, each multiplied by $\\Delta t$; variances add (A8): $\\frac{t}{\\Delta t}\\cdot\\frac{N_\\Omega^2}{\\Delta t}\\cdot\\Delta t^2=N_\\Omega^2t$, so the spread is $N_\\Omega\\sqrt t$.\n3. Accelerometer to position: $x_{\\text{err}}=\\int\\!\\!\\int a_b\\,dt\\,dt=\\tfrac12 a_b\\,t^2$.\n\n## Worked check\n\n**The accelerometer** ($m=1$ µg, $f_0=3$ kHz, 20 fingers per side, overlap 100 µm × 20 µm, $g_0=2$ µm, $V_{\\text{ex}}=1$ V):\n- $\\omega_0=2\\pi\\cdot3000=18\\,850$ rad/s, $\\omega_0^2=3.553\\times10^8$ s⁻², $k=10^{-9}\\cdot3.553\\times10^8=0.355$ N/m.\n- $x=9.81/3.553\\times10^8=2.761\\times10^{-8}$ m $=27.6$ nm per g; $x/g_0=0.0138$.\n- $A=20\\times100\\,\\mu\\text{m}\\times20\\,\\mu\\text{m}=4.0\\times10^{-8}$ m², $C_0=8.854\\times10^{-12}\\cdot4\\times10^{-8}/2\\times10^{-6}=177$ fF.\n- $C_1=179.56$ fF, $C_2=174.67$ fF, $C_1-C_2=4.89$ fF per g (linear estimate $2C_0x/g_0=4.89$ fF ✓). One milli-g: 4.9 aF.\n- $V_{\\text{out}}=1\\text{ V}\\times0.0138=13.8$ mV per g, the same from $(C_1-C_2)/(C_1+C_2)$ ✓.\n\n**The gyroscope** ($m=1$ µg, $f_d=20$ kHz, $X_d=10$ µm, $\\Omega=100$ °/s):\n- $v_{\\max}=2\\pi\\cdot20\\,000\\cdot10^{-5}=1.257$ m/s; $\\Omega=1.7453$ rad/s.\n- $F=2\\cdot10^{-9}\\cdot1.7453\\cdot1.257=4.39$ nN, 0.447 times the mass's own weight (9.81 nN).\n- Sense mode at 21 kHz: $k_s=17.4$ N/m, static $F/k_s=0.252$ nm; with the drive at 20 kHz, $y=F/(m\\lvert\\omega_s^2-\\omega_d^2\\rvert)=2.71$ nm (×10.76). Per 1 °/s: 27.1 pm.\n- Matched with $Q_f=1000$: $y=278$ nm, but bandwidth $20\\,000/2000=10$ Hz.\n\nAll numbers come from `scripts/checks/B4_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — ball in a box.** Draw a box, a ball on two springs, an arrow \"box accelerates →\" and the ball shifted ←.\n  Write $kx=ma$ ⇒ $x=a/\\omega_0^2$. Say: \"The only design number is $\\omega_0$.\"\n- **Panel 2 — the trade-off.** A log–log sketch: $x$ per g falls as $1/f_0^2$, bandwidth rises as $f_0$. Mark \"phone, 3 kHz,\n  28 nm\" and \"airbag, 20 kHz, 0.62 nm/g\". Say: \"Ten times faster costs a hundred times the signal.\"\n- **Panel 3 — the comb.** One moving finger between two fixed ones, gaps $g_0-x$ and $g_0+x$. Write $C_1,C_2$, then\n  $V_{\\text{out}}=V_{\\text{ex}}x/g_0$. Circle \"fF per g, aF per mg\".\n- **Panel 4 — tilt.** A tilted phone, the up-vector of 1 g split into $a_x$, $a_y$, $a_z$; write the two atan2 formulas.\n  Add a car braking: \"this fools it\".\n- **Panel 5 — the merry-go-round.** Top view: a mass shuttling left–right on a turning disc, sideways arrows\n  alternating. Write $\\mathbf F=-2m\\boldsymbol\\Omega\\times\\mathbf v$; \"4.4 nN at 100 °/s\".\n- **Panel 6 — drift.** Angle error vs time: a straight line $\\Omega_b\\,t$ with a fuzzy $\\pm N_\\Omega\\sqrt t$ band, and a flat jittery\n  accelerometer trace. Say: \"the gyro is good now, the accelerometer is good on average: fuse them (A9).\"\n\n## Common mistakes and where the intuition breaks\n\n- **\"An accelerometer at rest reads zero.\"** It reads 1 g upward. Free fall reads zero: that is how laptops detect a drop.\n- **Using tilt formulas while accelerating.** atan2 of the readings is only the tilt when the device is not accelerating.\n  A car braking at 0.3 g looks like a 16.7° pitch.\n- **Forgetting $x$ is tiny.** At 27.6 nm per g, a 1 mg resolution means 28 pm; packaging stress, temperature and\n  electrostatic forces from the readout itself are all larger than that, and must be cancelled by symmetry (differential\n  design) and calibration (A8).\n- **\"Higher $Q_f$ is always better.\"** In an accelerometer a high $Q_f$ means ringing after every bump, so they are\n  deliberately air-damped near $Q_f\\approx0.5$–1. In a gyro, high $Q_f$ gives signal but costs bandwidth.\n- **Mixing up rate and angle.** A gyro measures $\\Omega$ (°/s), not the angle. The angle needs integration, and integration\n  turns any bias into a ramp.\n- **The Coriolis sign.** It is $-2m\\boldsymbol\\Omega\\times\\mathbf v$ (equivalently $2m\\,\\mathbf v\\times\\boldsymbol\\Omega$);\n  getting it wrong flips the reported direction of turn. The magnitude $2m\\Omega\\dot x$ is what sizes the chip.\n- **Where the intuition breaks:** the \"ball in a box\" picture assumes the input is slow. Near $f_0$ the mass resonates\n  and the reading is wrong by up to $Q_f$ times; above $f_0$ it hardly moves at all. Vibration near $f_0$ (a drone's\n  propellers, a car engine) can be rectified into a false DC reading, which is why sensors sit on rubber mounts and why\n  datasheets list \"vibration rectification error\".\n\n## Remember\n\n**\"$x=a/\\omega_0^2$ and $V_{\\text{out}}=V_{\\text{ex}}x/g_0$; gravity is part of the reading; a gyro reads $2m\\Omega\\dot x$ and integration turns bias into drift.\"**\n\n## Self-test\n\n1. An accelerometer is redesigned from $f_0=2$ kHz to $f_0=6$ kHz with the same gap and capacitors. By what factor does its output per g change, and why might the designer accept that?\n   <details><summary>Answer<\/summary>x = a/ω0², so tripling f0 divides the deflection and the output by 9. The designer gains three times the bandwidth (it can follow faster events such as crashes or vibration) and a stiffer, more robust structure that is less likely to stick to its stops after a shock.<\/details>\n2. A phone lying flat reads (a_x, a_y, a_z) = (0, 0, 1) g. It is then held so that it reads (0.5, 0, 0.866) g. What is its pitch, and what would a single x-axis accelerometer with 1 mg error say about the uncertainty?\n   <details><summary>Answer<\/summary>Pitch = atan2(0.5, 0.866) = 30°. One axis alone: sin θ = 0.5 with a 0.001 error gives an angle error of 0.001/cos 30° = 1.15 mrad ≈ 0.066°.<\/details>\n3. A drone gyro has a bias of 0.02 °/s and a noise density of 0.005 (°/s)/√Hz. What is the yaw error after 5 minutes of gyro-only integration, and which term dominates?\n   <details><summary>Answer<\/summary>Bias: 0.02 × 300 = 6°. Noise: 0.005 × √300 ≈ 0.087°. The bias dominates by far, which is why gyros are calibrated at start-up (bias measured while still) and fused with a magnetometer or GPS for heading.<\/details>\n\n**Next:** [B5 MEMS microphones, pressure sensors and actuators](#B5) — the same springs and capacitors, now as a membrane that feels pressure and sound, and run backwards as actuators that move mirrors, lenses and ink.\n"}, {"id": "B5", "short": "MEMS microphones, pressure sensors and actuators", "title": "MEMS microphones, pressure sensors and actuators", "part": "B", "md": "# B5. MEMS microphones, pressure sensors and actuators\n\n> **Connects:** builds on [B3 Micromechanics](#B3) (stiffness, resonance), [A2 Resistive sensors and the Wheatstone bridge](#A2), [A3 Capacitive sensors](#A3), [A4 Piezoelectric, piezoresistive and magnetic sensors](#A4), [B4 MEMS inertial sensors](#B4) · used by [C2 Pressure-driven flow and hydraulic circuits](#C2), [C5 Lab-on-a-chip and integrated systems](#C5), [A9 Sensor fusion and the Kalman filter](#A9)\n\n## Hook — a drum skin\n\nPress the middle of a drum with one finger. The skin dips most in the centre, not at all at the rim, and if you look\nclosely the skin is bent most sharply right next to the rim, where it is clamped. Tap it, and the skin vibrates and\npushes air: that is sound. Shout at it, and the skin trembles in reply: that is a microphone.\n\nNow shrink the drum to a millimetre across and make the skin out of silicon twenty times thinner than a hair. If the\nair pressure on one side changes, the skin bows by a fraction of a micrometre. Put tiny resistors at the rim where it\nbends hardest and you have the **pressure sensor** in a car tyre, a blood-pressure catheter, a weather station and the\nbarometer in your phone, which can tell which floor of a building you are on. Put a perforated plate just above a much\nthinner skin and you have the **MEMS microphone**: a phone has three or four of them.\n\nAnd run the same machines **backwards**: apply a voltage instead of reading one, and the skin or plate moves. That is\nan **actuator**: the micromirrors in a projector, the nozzles of an inkjet printer, the motor that steadies a phone's\ncamera lens.\n\n## The idea in plain words\n\n**A clamped diaphragm under pressure.** A thin circular plate of radius $r_d$ and thickness $t$, clamped all around its\nedge, feels a pressure difference $p$ (pressure on one side minus the other). It bends into a smooth bowl. How stiff it\nis depends on its **bending stiffness**\n$$D_p=\\frac{Et^3}{12(1-\\nu_P^2)},$$\nthe plate version of a beam's $EI_A$ from B3 ($E$ is Young's modulus, $\\nu_P$ Poisson's ratio). The centre moves by\n$$x_0=\\frac{p\\,r_d^4}{64\\,D_p},\\qquad x(r)=x_0\\Big(1-\\frac{r^2}{r_d^2}\\Big)^2,$$\nwhere $r$ is the distance from the centre. Two powers dominate: the deflection grows as the **fourth power** of the radius\nand falls as the **cube** of the thickness. A drum twice as wide is sixteen times softer; a skin twice as thick is eight\ntimes stiffer. That is how one fabrication process (B2) makes a stiff 100 kPa barometer and a floppy microphone membrane:\nby choosing $r_d$ and $t$.\n\n**Where the stress is.** The surface of the plate is stretched or squeezed as it bends. The largest stress is at the\nclamped edge, where the plate turns from flat (in the frame) to curving down:\n$$\\sigma_{\\text{edge}}=\\frac{3p\\,r_d^2}{4t^2},\\qquad \\sigma_{\\text{centre}}=\\frac{3(1+\\nu_P)\\,p\\,r_d^2}{8t^2}\\;(\\text{opposite sign}).$$\nIn between there is a ring with no radial stress at all, at $r=r_d\\sqrt{(1+\\nu_P)/(3+\\nu_P)}\\approx0.62\\,r_d$. Stress grows\nas $(r_d/t)^2$, which is also what limits a design: make the plate too thin for its pressure and it cracks at the rim.\n\n**Piezoresistive pressure sensor: a bridge at the edge.** Silicon has a huge **piezoresistive** effect (A4): stretching it\nchanges its resistivity, not just its shape, giving gauge factors near 100 instead of 2 for metal. Four resistors are\ndoped into the diaphragm at the edge, where the stress is highest. In p-type silicon the relative change is about\n$\\Delta R/R\\approx\\tfrac{\\pi_{44}}{2}(\\sigma_\\parallel-\\sigma_\\perp)$, where $\\sigma_\\parallel$ is the stress along the\ncurrent, $\\sigma_\\perp$ the stress across it, and $\\pi_{44}\\approx1.38\\times10^{-9}$ Pa⁻¹ the piezoresistive coefficient.\nAt the edge the stress across the radius is $\\nu_P$ times the radial one, so a resistor laid **along** the radius changes\nby $+\\tfrac{\\pi_{44}}{2}(1-\\nu_P)\\sigma_{\\text{edge}}$ and one laid **across** it by the same amount with a minus sign. Wire\nthe two \"+\" and the two \"−\" resistors into opposite arms of a Wheatstone bridge (A2) and you get the maximum output,\n$V_{\\text{out}}=V_{\\text{ex}}\\,\\Delta R/R$, while equal changes in all four (temperature!) cancel.\n\n```viz\nb5-membrane-3d\n```\n\n**Capacitive pressure sensors.** Alternatively, put a fixed electrode under the diaphragm across a gap $g_0$: the plate\nand electrode form a capacitor, and pressure narrows the gap (A3). Capacitive sensors use almost no power and drift less\nwith temperature than piezoresistors, which is why the barometers in phones and watches are often capacitive. The price\nis a non-linear response ($C\\propto1/(g_0-x)$) and a need for careful electronics, because the changes are femtofarads.\n\n**The barometer: altitude from pressure.** Air near sea level weighs about $\\rho=1.225$ kg/m³, so going up one metre\nremoves a column of air of weight $\\rho g_{\\text{grav}}\\approx12$ Pa per square metre (here $g_{\\text{grav}}=9.81$ m/s²):\n$$\\frac{dp}{dz}=-\\rho\\,g_{\\text{grav}}\\approx-12\\ \\text{Pa per metre}.$$\nOne floor of a building (3 m) is 36 Pa out of 101 325 Pa, about 0.04 %. A good MEMS barometer resolves about 1 Pa,\nroughly 8 cm of height, which is how a phone tells emergency services which floor you are on and how a drone holds its\naltitude. The weather changes the pressure by hundreds of pascals per day, so absolute altitude needs a reference; height\n*changes* over minutes are reliable. In A9 the barometer is fused with the accelerometer of B4.\n\n**The MEMS microphone.** A microphone is a pressure sensor for very small, fast pressure changes. Sound is a pressure\nwiggle on top of the atmosphere, measured in **dB SPL** (sound pressure level):\n$$L=20\\log_{10}\\frac{p_{\\text{rms}}}{20\\ \\mu\\text{Pa}},$$\nwhere 20 µPa is the quietest sound a young ear hears. So 94 dB SPL is exactly 1 Pa rms (loud speech at arm's length),\n60 dB SPL a conversation (20 mPa), 120 dB SPL a jet at close range (20 Pa). A MEMS microphone uses a very thin membrane\n(about 1 µm of polysilicon) with a stiff **perforated backplate** a few micrometres above it; the holes let the air\nbetween them escape so it doesn't act as a stiff cushion. The two form a capacitor charged by a bias voltage $V_b$\nthrough a huge resistor, so the charge stays constant while the sound wiggles the gap. With constant charge $q$,\n$V=q/C=q\\,g/(\\varepsilon_0A)$: the voltage follows the gap linearly, $\\Delta V=V_b\\,\\Delta g/g_0$. A small amplifier chip\n(ASIC) in the same package boosts and digitises it.\n\nMicrophone datasheets quote three numbers:\n- **sensitivity**, the output for 1 Pa (94 dB SPL), in dBV/Pa: $-38$ dBV/Pa means $10^{-38/20}=12.6$ mV per pascal;\n- **SNR**, the signal at 94 dB SPL compared with the microphone's own noise, typically 60–70 dB; the noise floor in dB SPL is\n  $94-\\mathrm{SNR}$, the quietest sound it can hear;\n- **AOP** (acoustic overload point), around 120–130 dB SPL, where the output distorts.\n\n```viz\nb5-microphone-3d\n```\n\n**Actuators: the same structures driven by voltage.** Put a voltage $V$ across a capacitor with a movable plate and the\nplates attract with\n$$F_e=\\frac{\\varepsilon_0AV^2}{2(g_0-x)^2},$$\nwhich is the slope of the stored energy $\\tfrac12CV^2$ (A3). The spring pulls back with $kx$. Here is the catch: the\nelectrostatic force grows faster than the spring force as the gap closes. Up to one third of the gap the spring wins\nand the plate finds a stable rest; beyond $x=g_0/3$ no balance is possible, and the plate **snaps shut**. This is\n**pull-in**, at the voltage\n$$V_{\\text{pi}}=\\sqrt{\\frac{8kg_0^3}{27\\,\\varepsilon_0A}}.$$\nEvery capacitive MEMS device must respect it: a sensor's readout voltage must stay far below $V_{\\text{pi}}$ (B4), and a\nmicrophone's bias is set at a safe fraction of it.\n\n```viz\nb5-pull-in\n```\n\n**The actuator toolbox.**\n- **Comb drives**: interleaved fingers that slide past each other instead of closing a gap. The force\n  $F=N\\varepsilon_0tV^2/g$ (for $N$ moving fingers of thickness $t$ at gap $g$) does not depend on position, so there is\n  no pull-in along the motion and the travel can be tens of micrometres. They drive the gyroscopes of B4.\n- **Thermal bimorphs**: two layers with different thermal expansion, like a bimetal strip in an old thermostat. Heat them\n  with a current and the strip curls. Slow (milliseconds) but strong and with large motion.\n- **Piezoelectric actuators** (A4): a thin PZT film changes length with voltage. Piezo inkjet heads squeeze a tiny ink\n  chamber with them to shoot a drop; they also drive ultrasonic transducers and some autofocus lenses.\n- **Thermal inkjet**: a thin-film heater flashes the ink to vapour in a microsecond; the growing bubble pushes out a drop\n  of a few picolitres. Cheap enough to throw away with the cartridge.\n- **DLP micromirrors**: millions of aluminium mirrors, each about 5 µm wide, on torsion hinges above electrodes. Each\n  tips electrostatically to $+12°$ or $-12°$ and lands on a stop: pull-in used on purpose, as a clean digital switch.\n  Flipping thousands of times per frame makes grey levels.\n- **Optical image stabilisation (OIS)**: a gyroscope (B4) measures the hand's shake and an actuator (a voice-coil motor,\n  or in some phones a MEMS stage) shifts the lens or the image sensor by $f_L\\,\\theta$ to cancel it, with $f_L$ the focal\n  length and $\\theta$ the shake angle.\n\n## Intuitive examples\n\n1. **A barometer diaphragm.** Silicon ($E=160$ GPa, $\\nu_P=0.27$), $r_d=500$ µm, $t=20$ µm, under 100 kPa: $D_p=1.151\\times10^{-4}$\n   N·m, $x_0=0.85$ µm (only 4.2 % of $t$, so the linear theory holds), edge stress 46.9 MPa, centre 29.8 MPa. The force on\n   the disc is 78.5 mN, the weight of 8.0 g.\n2. **One metre of altitude.** $dp/dz=1.225\\times9.81=12.02$ Pa/m, so one floor (3 m) is 36 Pa. With the diaphragm above,\n   12 Pa moves the centre by 0.10 nm and changes the bridge by 9.3 µV: a job for the amplifiers and averaging of A7 and\n   A8. In the standard atmosphere, $p(100\\text{ m})=100\\,129$ Pa (11.96 Pa/m) and $p(1000\\text{ m})=89\\,875$ Pa (only\n   11.45 Pa/m: the rule of 12 Pa/m holds near sea level).\n3. **A tyre on a hot day (TPMS).** 230 kPa gauge (2.3 bar, 33 psi) is 331.3 kPa absolute. Driving warms the air from 20 °C\n   to 60 °C at fixed volume: $p\\propto T$, so 376.5 kPa absolute, 275 kPa gauge, +45 kPa. A TPMS chip therefore measures\n   temperature too, or the car would warn about a tyre that is fine.\n4. **Blood pressure.** 120 mmHg $=16.00$ kPa and 80 mmHg $=10.67$ kPa (1 mmHg $=133.3$ Pa). A catheter-tip sensor with\n   $r_d=100$ µm and $t=2$ µm deflects 217 nm at 120 mmHg with 30 MPa at its edge: small enough to fit inside a blood vessel.\n5. **Sound levels.** 30 dB SPL (a quiet bedroom) is 0.632 mPa; 60 dB SPL is 0.02 Pa; 94 dB SPL is 1 Pa; 120 dB SPL is\n   20 Pa. A $-38$ dBV/Pa microphone gives 12.6 mV at 1 Pa and 0.252 mV at 60 dB SPL; with SNR 65 dB its noise is\n   7.08 µV, equivalent to a 29 dB SPL sound.\n6. **Actuators by numbers.** A plate with $k=1$ N/m, $g_0=2$ µm and $A=100$ µm × 100 µm pulls in at 5.17 V. A comb drive with\n   100 fingers, $t=20$ µm, $g=2$ µm at 30 V pushes with 7.97 µN, moving 8.0 µm on the same 1 N/m spring. An aluminium-on-\n   silicon bimorph ($\\Delta\\alpha=20.4$ ppm/K, total 2 µm thick, 200 µm long) heated by 100 K curls to a radius of 0.65 mm\n   and its tip rises 30.6 µm. A 4 pL inkjet drop is 19.7 µm across. A 0.1° hand shake with a 4.3 mm lens needs a 7.5 µm\n   correction, 6.2 pixels of 1.22 µm.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $D_p=\\dfrac{Et^3}{12(1-\\nu_P^2)}$ | bending stiffness of a plate | $E$, $\\nu_P$, thickness $t$ |\n| $x_0=\\dfrac{p\\,r_d^4}{64D_p}$, $\\;x(r)=x_0(1-r^2/r_d^2)^2$ | clamped circular plate, uniform pressure, $x_0\\ll t$ | $r_d$ radius, $p$ pressure difference |\n| $\\sigma_{\\text{edge}}=\\dfrac{3p\\,r_d^2}{4t^2}$ | largest (radial) surface stress, at the rim | grows as $(r_d/t)^2$ |\n| $\\Delta R/R=\\pm\\tfrac{\\pi_{44}}{2}(1-\\nu_P)\\sigma_{\\text{edge}}$, $\\;V_{\\text{out}}=V_{\\text{ex}}\\Delta R/R$ | piezoresistors at the rim, full bridge | $\\pi_{44}$ piezoresistive coefficient |\n| $dp/dz=-\\rho g_{\\text{grav}}\\approx-12$ Pa/m | barometric altitude near sea level | $\\rho$ air density |\n| $L=20\\log_{10}(p_{\\text{rms}}/20\\,\\mu\\text{Pa})$ | sound pressure level in dB SPL | 94 dB SPL = 1 Pa |\n| $\\Delta V=V_b\\,\\Delta g/g_0$ | constant-charge capacitive microphone | $V_b$ bias, $g_0$ gap |\n| $F_e=\\dfrac{\\varepsilon_0AV^2}{2(g_0-x)^2}$ | parallel-plate electrostatic force | $A$ plate area |\n| $x_{\\text{pi}}=g_0/3$, $\\;V_{\\text{pi}}=\\sqrt{\\dfrac{8kg_0^3}{27\\varepsilon_0A}}$ | pull-in point and voltage | $k$ spring constant |\n| $F=\\dfrac{N\\varepsilon_0tV^2}{g}$ | comb drive, independent of travel | $N$ moving fingers |\n| $\\kappa=\\dfrac{3\\Delta\\alpha\\,\\Delta T}{2h}$ | bimorph curvature (equal layers) | $\\Delta\\alpha$ expansion mismatch, $h$ total thickness |\n\n## Applications\n\n| World | Diaphragms, microphones and actuators | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | leaf-clip and stem pressure probes, soil tensiometers with MEMS pressure chips, spray-nozzle pressure on sprayers, microphones listening for insects and cavitation clicks in stressed xylem | how hard roots must pull to get water (water stress), even spraying, pests heard before they are seen |\n| 🧬 Biology & human health | blood-pressure catheter tips, intracranial and intraocular pressure implants, hearing aids (2–3 MEMS mics for direction), inhalers and ventilators measuring airflow pressure, insulin micropumps | pressure inside the body with a sensor smaller than a grain of rice; speech pulled out of noise |\n| 🌍 Environment | weather-station barometers, river and well level loggers (water pressure: 9.8 kPa per metre of depth), acoustic monitoring of birds, bats and traffic noise | storms from falling pressure, flood levels, biodiversity and noise maps from sound |\n| 🤖 Robotics & drones | barometric altitude hold, airspeed (pitot) sensors, microphone arrays for sound localisation, MEMS-mirror LiDAR scanners, suction-cup grippers with pressure feedback | altitude to ~10 cm, whether a grip has sealed, where a voice comes from |\n| 🚗 Cars | TPMS in every wheel, manifold-air and brake-pressure sensors, MEMS-mirror LiDAR and head-up displays, cabin microphones for hands-free calls | a slow puncture before it is dangerous, engine air for the fuel calculation, the road ahead in 3D |\n| 📱 Phones & photography | 3–4 MEMS microphones (calls, noise cancellation, voice assistant), the barometer, OIS actuators shifting the lens or sensor, MEMS autofocus | which floor you are on, your voice separated from the wind, sharp photos from a shaking hand |\n| 🏠 Home & household | inkjet printers (thermal and piezo), DLP projectors, smart speakers with 6–8 microphones, washing-machine water-level sensors, gas-meter and HVAC pressure sensors | where each pixel of ink and light goes; how much water is in the drum; whether the filter is clogged |\n\n## Derivation\n\n**(a) Clamped circular plate under uniform pressure.**\n1. For an axisymmetric plate, bending balance gives $D_p\\,\\nabla^4x=p$, with $\\nabla^4$ the biharmonic operator in polar form (the plate version of $EI_Ax''''=q$ for a beam, B3).\n2. Integrating once using the shear force on a circle of radius $r$ (which carries the load $p\\pi r^2$): $D_p\\dfrac{d}{dr}\\Big[\\dfrac1r\\dfrac{d}{dr}\\Big(r\\dfrac{dx}{dr}\\Big)\\Big]=\\dfrac{pr}{2}$.\n3. Integrate three more times; keep the solution finite at $r=0$; impose clamping $x(r_d)=0$ and $dx/dr(r_d)=0$.\n4. Result: $x(r)=\\dfrac{p}{64D_p}(r_d^2-r^2)^2=x_0(1-r^2/r_d^2)^2$, with $x_0=\\dfrac{p\\,r_d^4}{64D_p}$.\n5. Check: at the rim the value and the slope are zero; the curvature is largest there.\n\n**(b) Surface stress.**\n1. Radial surface stress $\\sigma_r=\\dfrac{6M_r}{t^2}$ with the bending moment $M_r=-D_p\\Big(\\dfrac{d^2x}{dr^2}+\\dfrac{\\nu_P}{r}\\dfrac{dx}{dr}\\Big)$.\n2. Insert $x(r)$: $M_r=\\dfrac{p}{16}\\big[(1+\\nu_P)r_d^2-(3+\\nu_P)r^2\\big]$.\n3. Rim ($r=r_d$): $M_r=-\\dfrac{pr_d^2}{8}$, so $\\lvert\\sigma_{\\text{edge}}\\rvert=\\dfrac{3pr_d^2}{4t^2}$.\n4. Centre ($r=0$): $M_r=\\dfrac{(1+\\nu_P)pr_d^2}{16}$, so $\\sigma_{\\text{centre}}=\\dfrac{3(1+\\nu_P)pr_d^2}{8t^2}$, opposite sign.\n5. Zero radial stress where $(1+\\nu_P)r_d^2=(3+\\nu_P)r^2$: $r=0.62\\,r_d$ for $\\nu_P=0.27$.\n\n**(c) The bridge.**\n1. At the clamped rim the tangential stress is $\\nu_P$ times the radial one (the rim cannot stretch around its circumference).\n2. Radial resistor: $\\Delta R/R=\\tfrac{\\pi_{44}}{2}(\\sigma_r-\\sigma_\\theta)=\\tfrac{\\pi_{44}}{2}(1-\\nu_P)\\sigma_{\\text{edge}}$. Tangential resistor: the negative of that.\n3. Full bridge with $R(1+\\delta)$ and $R(1-\\delta)$ in opposite arms: $V_{\\text{out}}=V_{\\text{ex}}\\Big[\\dfrac{1+\\delta}{2}-\\dfrac{1-\\delta}{2}\\Big]=V_{\\text{ex}}\\,\\delta$ (A2).\n\n**(d) Pull-in.**\n1. Net force on the plate: $F(x)=kx-\\dfrac{\\varepsilon_0AV^2}{2(g_0-x)^2}$; equilibrium where $F=0$.\n2. Stable if pushing closer creates a net restoring force: $\\dfrac{dF}{dx}>0$, i.e. $k>\\dfrac{\\varepsilon_0AV^2}{(g_0-x)^3}=\\dfrac{2F_e}{g_0-x}$.\n3. The last stable point has both $kx=F_e$ and $k=\\dfrac{2F_e}{g_0-x}$. Divide: $x=\\dfrac{g_0-x}{2}$, so $x=g_0/3$.\n4. Substitute: $k\\dfrac{g_0}{3}=\\dfrac{\\varepsilon_0AV^2}{2(2g_0/3)^2}=\\dfrac{9\\varepsilon_0AV^2}{8g_0^2}$, so $V_{\\text{pi}}^2=\\dfrac{8kg_0^3}{27\\varepsilon_0A}$.\n\n**(e) Constant-charge microphone.**\n1. The bias resistor is so large ($\\sim$GΩ) that charge cannot flow in or out during one sound cycle: $q=C_0V_b$ is fixed.\n2. $V=q/C=\\dfrac{q\\,g}{\\varepsilon_0A}$ is linear in the gap $g$.\n3. So $\\Delta V=V_b\\dfrac{\\Delta g}{g_0}$, with $\\Delta g$ the average membrane motion (one third of $x_0$ for the bowl shape $(1-r^2/r_d^2)^2$).\n\n## Worked check\n\n**Pressure sensor** ($E=160$ GPa, $\\nu_P=0.27$, $r_d=500$ µm, $t=20$ µm, $p=100$ kPa, $\\pi_{44}/2=69\\times10^{-11}$ Pa⁻¹, $V_{\\text{ex}}=3.3$ V):\n- $D_p=160\\times10^9\\cdot(20\\times10^{-6})^3/(12\\cdot0.9271)=1.151\\times10^{-4}$ N·m.\n- $x_0=10^5\\cdot(5\\times10^{-4})^4/(64\\cdot1.151\\times10^{-4})=8.49\\times10^{-7}$ m $=0.85$ µm; $x_0/t=0.042$ ✓ small.\n- $\\sigma_{\\text{edge}}=3\\cdot10^5\\cdot2.5\\times10^{-7}/(4\\cdot4\\times10^{-10})=46.9$ MPa.\n- $\\Delta R/R=69\\times10^{-11}\\cdot0.73\\cdot46.9\\times10^6=2.36$ %; $V_{\\text{out}}=3.3\\times0.0236=77.9$ mV, i.e. 0.78 mV/kPa.\n\n**Microphone** ($r_d=300$ µm, $t=1$ µm, $E=160$ GPa, $\\nu_P=0.22$, $g_0=3$ µm, $V_b=10$ V):\n- $D_p=1.401\\times10^{-8}$ N·m; at 1 Pa $x_0=9.03$ nm, mean motion $x_0/3=3.01$ nm.\n- $C_0=\\varepsilon_0\\pi r_d^2/g_0=0.83$ pF; $\\Delta C=0.84$ fF per Pa.\n- $\\Delta V=10\\text{ V}\\times3.01\\text{ nm}/3\\ \\mu\\text{m}=10.0$ mV/Pa $=-40.0$ dBV/Pa; the ASIC adds 2.0 dB to reach the $-38$ dBV/Pa datasheet value.\n- Piston estimate of pull-in: $k_{\\text{eff}}=p\\pi r_d^2/(x_0/3)=94$ N/m, $V_{\\text{pi}}=17.3$ V, so the 10 V bias is at 0.58 $V_{\\text{pi}}$ ✓.\n\n**Pull-in** ($k=1$ N/m, $g_0=2$ µm, $A=10^{-8}$ m²): $V_{\\text{pi}}=\\sqrt{8\\cdot1\\cdot8\\times10^{-18}/(27\\cdot8.854\\times10^{-12}\\cdot10^{-8})}=5.17$ V.\nAt $x=g_0/3=0.667$ µm: $kx=667$ nN and $F_e=667$ nN, and $dF_e/dx=1.000$ N/m $=k$ ✓ (the curves touch). Below pull-in,\n3 V gives a stable rest at 112 nm (0.056 $g_0$) and 5 V at 477 nm (0.239 $g_0$).\n\nAll numbers come from `scripts/checks/B5_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — the drum.** A side view of a clamped plate sagging under arrows $p$. Write $x_0=pr_d^4/(64D_p)$ and\n  $D_p\\propto t^3$. Say: \"Fourth power of size, cube of thickness.\"\n- **Panel 2 — where it hurts.** The same plate, coloured: red at the rims, blue in the middle, a white ring at 0.62 $r_d$.\n  Write $\\sigma_{\\text{edge}}=3pr_d^2/4t^2$. Draw four little resistors at the rim: two radial (+), two tangential (−).\n- **Panel 3 — the bridge.** A diamond of four resistors, $+$ and $-$ in opposite arms, $V_{\\text{out}}=V_{\\text{ex}}\\Delta R/R$.\n  Number: 77.9 mV at 100 kPa; 9.3 µV per metre of altitude.\n- **Panel 4 — the microphone.** Membrane, perforated backplate, constant charge. Write\n  94 dB SPL = 1 Pa, $-38$ dBV/Pa = 12.6 mV/Pa, noise floor = 94 − SNR.\n- **Panel 5 — pull-in.** Force vs gap: a straight line $kx$ and a steep curve $F_e$; three voltages; the tangent case at\n  $g_0/3$. Write $V_{\\text{pi}}=\\sqrt{8kg_0^3/27\\varepsilon_0A}$.\n- **Panel 6 — the actuator zoo.** Comb drive, bimorph, piezo and thermal inkjet, DLP mirror, OIS: one sketch each, with\n  \"what moves it\" and \"how far\".\n\n## Common mistakes and where the intuition breaks\n\n- **Gauge vs absolute pressure.** A tyre gauge reads pressure above the atmosphere; a barometer reads absolute pressure\n  (vacuum on the other side of the diaphragm). The gas law $p\\propto T$ works only with absolute pressure.\n- **Big deflections.** $x_0=pr_d^4/64D_p$ assumes $x_0\\ll t$. Once $x_0$ is comparable to $t$ the plate must also stretch like\n  a balloon, which stiffens it; the response becomes non-linear and the formula overestimates the deflection.\n- **Built-in stress.** Thin films are rarely stress-free. Microphone membranes are often tension-dominated (more like a drum\n  skin than a plate), and a little compressive stress can make a membrane buckle. Real designs are calibrated, not\n  computed.\n- **Resistors in the wrong place.** In the middle of the diaphragm the stress is smaller and has the opposite sign; at\n  0.62 $r_d$ it is zero. Put the bridge at the rim.\n- **dB confusion.** dB SPL compares pressures with 20 µPa; dBV compares voltages with 1 V. Both use $20\\log_{10}$ because they\n  are amplitudes. +6 dB is twice the pressure; +20 dB is ten times.\n- **\"More voltage, more motion.\"** For a gap-closing actuator only up to $g_0/3$; past that it snaps. And after a snap, the\n  plate often stays stuck at a much lower voltage (hysteresis), or forever (stiction).\n- **Where the intuition breaks:** a microphone is not a slow pressure sensor. Above its membrane's resonance it stops\n  following the sound, and the air in the gap and the holes adds damping and stiffness. The frequency response of a\n  microphone is set as much by its air paths (C2's hydraulic circuits) as by its silicon.\n\n## Remember\n\n**\"Plates bend as $r_d^4/t^3$ and are stressed most at the rim; put the bridge there. 94 dB SPL is 1 Pa. A gap-closing actuator snaps at $g_0/3$.\"**\n\n## Self-test\n\n1. A pressure-sensor diaphragm is redesigned with half the thickness and the same radius. What happens to the centre deflection and to the edge stress at the same pressure?\n   <details><summary>Answer<\/summary>D_p falls by 2³ = 8, so the deflection grows 8 times. The edge stress 3 p r_d²/(4 t²) grows by 2² = 4 times. The sensor is more sensitive but breaks at a quarter of the old pressure, and the deflection may no longer be small compared with t.<\/details>\n2. A phone barometer reads 101 300 Pa on the ground floor and 101 192 Pa a little later. Roughly how many floors up are you, and why is \"a little later\" important?\n   <details><summary>Answer<\/summary>The drop is 108 Pa; at about 12 Pa per metre that is 9 m, roughly 3 floors of 3 m. \"A little later\" matters because the weather also changes the pressure by hundreds of pascals over hours, so only quick changes can be read as height.<\/details>\n3. A parallel-plate actuator pulls in at 20 V. You halve the gap and keep everything else the same. What is the new pull-in voltage, and how far can the plate now move stably?\n   <details><summary>Answer<\/summary>V_pi grows as g0^(3/2), so it falls by 2^1.5 ≈ 2.83: about 7.1 V. The stable travel is still one third of the gap, which is now half as large, so half as much motion.<\/details>\n\n**Next:** [C1 Fluids at the microscale](#C1) — the air in a microphone gap and the ink in a nozzle are fluids at the microscale; Part C shows why they behave like honey.\n"}, {"id": "C1", "short": "Fluids at the microscale: Reynolds number and laminar flow", "title": "Fluids at the microscale: Reynolds number and laminar flow", "part": "C", "md": "# C1. Fluids at the microscale: Reynolds number and laminar flow\n\n> **Connects:** builds on [B1 Scaling laws](#B1) · used by [C2 Pressure-driven flow](#C2), [C3 Diffusion and mixing](#C3), [C4 Surface tension and droplets](#C4), [C5 Lab-on-a-chip](#C5)\n\n## Hook — stirring honey vs. stirring water\n\nStir a cup of tea and pull the spoon out. The tea keeps swirling for several seconds: it has **momentum**, and it coasts.\nNow stir a jar of honey and stop. The honey stops *at once*. Pull the spoon backwards along the path it came and a\nstreak of honey goes back almost to where it started. Nothing coasts, nothing swirls, and nothing mixes by itself.\n\nA drop of water flowing through a channel thinner than a hair behaves like the honey, not like the tea. Water hasn't\nchanged; the **size** has. To a bacterium, water feels thicker than honey feels to you. This one fact explains why\ntwo streams that meet inside a microfluidic chip flow side by side for centimetres without mixing, why a sperm cell\ncan't swim like a fish, and why the sap in a plant's veins moves like a slow, orderly conveyor belt. One dimensionless\nnumber, the **Reynolds number**, tells you which world you are in.\n\n## The idea in plain words\n\n**Viscosity is the fluid's internal friction.** Picture a deck of playing cards on a table. Push the top card and the\ncards below follow, each a little less than the one above. A flowing fluid is like that: thin layers slide over each\nother, and each layer drags its neighbours along. The **dynamic viscosity** $\\mu$ measures how hard that drag is. If\nyou slide one layer at speed $U$ past another a distance $h$ away, the friction force per unit area (the **shear\nstress**) is $\\mu U/h$. Water has $\\mu\\approx1$ mPa·s $=10^{-3}$ Pa·s; honey has about $10$ Pa·s, ten thousand times\nmore; air has $1.8\\times10^{-5}$ Pa·s. Dividing by the density $\\rho$ gives the **kinematic viscosity** $\\nu=\\mu/\\rho$,\nwhich says how fast a velocity difference *smooths itself out*: $10^{-6}$ m²/s for water, $1.5\\times10^{-5}$ m²/s for\nair.\n\n**The no-slip condition.** Fluid touching a solid wall moves with the wall. If the wall is still, the fluid right at it\nis still too, and speed builds up away from the wall. This is why dust stays on a fan blade and why a velocity profile\nin a channel is curved: zero at the walls, fastest in the middle. (At the scale of a few nanometres, or for gases at\nvery low pressure, slip can appear; for liquids in chips, no-slip holds.)\n\n**Navier–Stokes, in words.** Every flowing liquid obeys Newton's second law, written per unit volume:\n$$\\underbrace{\\rho\\Big(\\frac{\\partial\\mathbf u}{\\partial t}+(\\mathbf u\\cdot\\nabla)\\mathbf u\\Big)}_{\\text{mass × acceleration (inertia)}}=\\underbrace{-\\nabla p}_{\\text{pressure push}}+\\underbrace{\\mu\\nabla^2\\mathbf u}_{\\text{viscous friction}}.$$\nHere $\\mathbf u$ is the velocity field (an arrow at every point) and $p$ the pressure. The left side is \"mass times\nacceleration\" for a small parcel of fluid. The term $(\\mathbf u\\cdot\\nabla)\\mathbf u$ is the tricky one: it says a parcel\nspeeds up or turns simply because it is *carried* into a region where the flow is different. That term is **nonlinear**\n(velocity times velocity), and all the richness of turbulence, eddies and vortices hides in it. On the right, pressure\npushes from high to low, and viscosity tries to make every parcel move like its neighbours ($\\nabla^2\\mathbf u$ is large\nwhere the velocity is \"bent\"). Add $\\nabla\\cdot\\mathbf u=0$ (liquid can't be squeezed) and you have the full law.\n\n**The Reynolds number compares inertia with friction.** For a flow of speed $U$ past or through something of size\n$L$, the inertial term is about $\\rho U^2/L$ and the viscous term about $\\mu U/L^2$. Their ratio is\n$$\\mathrm{Re}=\\frac{\\rho U^2/L}{\\mu U/L^2}=\\frac{\\rho UL}{\\mu}=\\frac{UL}{\\nu}.$$\nWhen $\\mathrm{Re}\\gg1$, inertia rules: fluid coasts, swirls and forms eddies. When $\\mathrm{Re}\\ll1$, friction rules:\nthe fluid stops the moment you stop pushing. Because $\\mathrm{Re}$ contains the product $UL$, and small things are\nalso slow, $\\mathrm{Re}$ falls roughly as the square of the size (B1). Shrink a pipe 1000 times and run it 1000 times\nslower, and $\\mathrm{Re}$ falls a million times.\n\n```viz\nc1-reynolds-ladder\n```\n\n**Laminar and turbulent.** In a straight pipe, flow is **laminar** (in smooth layers, \"lamina\" = sheet) up to\n$\\mathrm{Re}\\approx2300$, using the pipe diameter for $L$. Above that, small disturbances are amplified, puffs of chaos\nappear, and above about 4000 the flow is fully **turbulent**: velocity fluctuates wildly and randomly, and anything\nin it is mixed in seconds. A garden hose at full blast is turbulent; a microchannel is never anywhere close. To reach\n$\\mathrm{Re}=2300$ in a 100 µm channel, water would have to race through at tens of metres per second, which would\nneed a pressure the chip can't survive.\n\n**Stokes flow and time reversibility.** When $\\mathrm{Re}\\ll1$, you may drop the whole left side of Navier–Stokes:\n$$0=-\\nabla p+\\mu\\nabla^2\\mathbf u\\qquad(\\text{Stokes, or creeping, flow}).$$\nThis equation has no time in it, and it is **linear**. Two remarkable things follow. First, the flow at each instant\nis set entirely by the boundaries at that instant: no memory, no coasting. Second, if you reverse the push, every\nvelocity reverses exactly. Run a pump forwards for 3 s, then backwards for 3 s, and every fluid parcel returns to where\nit started. G. I. Taylor famously filmed a drop of dye in glycerol being smeared into a thin sheet by a rotating\ncylinder, then \"un-mixed\" back into a drop by turning the cylinder back.\n\n**The scallop theorem.** Edward Purcell's 1976 lecture *Life at low Reynolds number* drew the consequence for\nswimming. A scallop opens its shell slowly and closes it fast; at high $\\mathrm{Re}$ the fast jet pushes it forward. At\nlow $\\mathrm{Re}$ the speed doesn't matter, only the sequence of shapes. A motion that simply goes back and forth\n(**reciprocal**: open–close–open) retraces itself and the swimmer ends where it began. So microorganisms use motions\nthat are *not* time-symmetric: the rotating corkscrew flagellum of *E. coli*, the travelling wave on a sperm's tail,\nthe beating of cilia with a stiff power stroke and a floppy return stroke. Purcell's number: if a bacterium stops\nswimming, it coasts about a tenth of an ångström, less than the width of an atom, in less than a microsecond.\n\n**Two streams that don't mix.** Feed a dyed stream and a clear stream into a Y-shaped junction. At low $\\mathrm{Re}$\nthey flow side by side down the channel, their interface sharp and straight, because nothing stirs them: no eddies,\nno swirls. The only thing that blurs the interface is **diffusion** of molecules across it, which is slow (C3). Chip\ndesigners use this to put a sample next to a reagent, to sort particles, or to bathe one half of a cell in a drug and\nthe other half in plain medium.\n\n```viz\nc1-channel-3d\n```\n\n**The entrance length.** Fluid entering a channel from a big reservoir starts with a nearly flat velocity profile. The\nno-slip walls slow the fluid next to them, and that \"slowness\" spreads inward until the full curved profile (the\nparabola of C2) is established. The distance this takes is the **entrance length**, which we write $L_e$ (a local\nsymbol). For laminar flow, a good fit across all $\\mathrm{Re}$ is\n$$\\frac{L_e}{D_h}\\approx\\frac{0.6}{1+0.035\\,\\mathrm{Re}}+0.056\\,\\mathrm{Re},$$\nwhere $D_h$ is the hydraulic diameter of the channel (the diameter for a round pipe; $2wh/(w+h)$ for a rectangle of\nwidth $w$ and height $h$). At high $\\mathrm{Re}$ this is the textbook $L_e\\approx0.06\\,\\mathrm{Re}\\,D_h$; at low\n$\\mathrm{Re}$ it settles to about $0.6\\,D_h$. So in a chip the profile is fully developed within one channel width of\nthe inlet, and the simple formulas of C2 hold almost everywhere.\n\n**What Re does *not* say.** $\\mathrm{Re}$ compares inertia with viscosity only. Whether two streams mix is a\ndifferent question (flow speed against diffusion: the Péclet number of C3). Whether droplets form is yet another\n(viscosity against surface tension: the capillary number of C4). Microfluidics is the art of knowing which ratio rules.\n\n## Intuitive examples\n\n1. **A microchannel.** Water ($\\rho=1000$ kg/m³, $\\mu=10^{-3}$ Pa·s) at $U=1$ mm/s in a channel $L=100$ µm wide:\n   $\\mathrm{Re}=1000\\times10^{-3}\\times10^{-4}/10^{-3}=0.1$. Speed it up to 1 cm/s and $\\mathrm{Re}=1.0$; still laminar,\n   still nearly Stokes flow.\n2. **Blood in a capillary.** A red cell squeezes through an 8 µm capillary at about 1 mm/s; with blood\n   ($\\rho=1060$ kg/m³, $\\mu\\approx3.5$ mPa·s), $\\mathrm{Re}=2.4\\times10^{-3}$. In the aorta (2.5 cm, 0.2 m/s mean)\n   $\\mathrm{Re}\\approx1500$: laminar on average, but close enough to the transition that the peak of each heartbeat can\n   produce brief disturbed flow.\n3. **Purcell's ladder.** *E. coli*: 1 µm, 30 µm/s, $\\mathrm{Re}=3\\times10^{-5}$. A human sperm (50 µm, 50 µm/s):\n   $\\mathrm{Re}=2.5\\times10^{-3}$. A small fish (5 cm, 10 cm/s): $5\\times10^{3}$. A human swimmer (2 m, 1 m/s):\n   $2\\times10^{6}$. Between the bacterium and the swimmer, eleven powers of ten.\n4. **Spoons.** A spoon (2 cm) stirred at 5 cm/s: in tea $\\mathrm{Re}=1000$ (it swirls), in honey ($\\mu=10$ Pa·s,\n   $\\rho=1400$ kg/m³) $\\mathrm{Re}=0.14$, the same world as a microchannel. Honey is a hands-on microfluidics lab.\n5. **Machines in air.** Air has $\\nu=1.5\\times10^{-5}$ m²/s. A drone's propeller blade (2 cm chord, 50 m/s):\n   $\\mathrm{Re}=6.7\\times10^{4}$. A car (4.5 m, 30 m/s): $9\\times10^{6}$. An airliner at cruise (40 m, 250 m/s, thin\n   cold air): $2.7\\times10^{8}$.\n6. **A garden hose.** 16 mm hose: at 1 m/s, $\\mathrm{Re}=16\\,000$, turbulent (the jet is rough). Turn it down to\n   0.1 m/s and $\\mathrm{Re}=1600$: the stream from the nozzle turns glassy and smooth. Its entrance length is then\n   $\\approx90$ diameters, 1.4 m, while in a 100 µm channel at $\\mathrm{Re}=0.1$ it is 60 µm.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| shear stress $=\\mu\\,\\dfrac{du}{dy}$ | friction between sliding layers | $\\mu$ dynamic viscosity (Pa·s), $u$ speed, $y$ distance across the flow |\n| $\\nu=\\mu/\\rho$ | how fast velocity differences diffuse away | water $10^{-6}$ m²/s, air $1.5\\times10^{-5}$ m²/s |\n| $\\rho\\big(\\partial_t\\mathbf u+(\\mathbf u\\cdot\\nabla)\\mathbf u\\big)=-\\nabla p+\\mu\\nabla^2\\mathbf u$, $\\ \\nabla\\cdot\\mathbf u=0$ | Navier–Stokes: Newton's law per volume, incompressible | $\\mathbf u$ velocity field, $p$ pressure, $\\rho$ density |\n| $\\mathrm{Re}=\\dfrac{\\rho UL}{\\mu}=\\dfrac{UL}{\\nu}$ | inertia ÷ viscous friction | $U$ speed scale, $L$ size scale (for a channel, $D_h$) |\n| $0=-\\nabla p+\\mu\\nabla^2\\mathbf u$ | Stokes flow, valid for $\\mathrm{Re}\\ll1$: linear, no time, reversible | |\n| $\\mathrm{Re}_{\\text{pipe}}\\lessapprox2300$ | laminar pipe flow; turbulent above ~4000 | $L$ = pipe diameter |\n| $D_h=\\dfrac{4\\times\\text{area}}{\\text{perimeter}}=\\dfrac{2wh}{w+h}$ | hydraulic diameter of a rectangular channel | $w$ width, $h$ height |\n| $\\dfrac{L_e}{D_h}\\approx\\dfrac{0.6}{1+0.035\\,\\mathrm{Re}}+0.056\\,\\mathrm{Re}$ | entrance length for the profile to develop | $L_e$ local symbol |\n| $t_{\\text{coast}}=\\dfrac{2\\rho r^2}{9\\mu}$ | how long a sphere of radius $r$ keeps moving after the push stops | from mass ÷ Stokes drag $6\\pi\\mu r$ |\n\n## Applications\n\n| World | Reynolds number and laminar flow | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | sap in xylem vessels (20–100 µm, ~1 mm/s): $\\mathrm{Re}\\sim0.01$–$0.1$; nutrient films in hydroponics; sap-flow chips on stems | sap moves in smooth layers, so its flow follows the simple laws of C2 and a heat-pulse sap-flow sensor can be modelled exactly |\n| 🧬 Biology & human health | bacteria and sperm swim at $\\mathrm{Re}\\ll1$; capillaries $\\sim10^{-3}$; aorta $\\sim1500$; lab-on-a-chip blood tests | microswimmers need non-reciprocal strokes; turbulence near heart valves is a warning sign; chips keep blood samples in tidy layers |\n| 🌍 Environment | water-quality chips co-flow a sample beside a reagent; particle counters guide air in a laminar sheath | the sample and reagent only meet by diffusion at a controlled interface, so the colour change is reproducible |\n| 🤖 Robotics & drones | propeller blades at $\\mathrm{Re}\\sim10^4$–$10^5$; micro-robots for drug delivery at $\\mathrm{Re}\\ll1$ | small drone propellers are less efficient (viscous losses grow as Re falls); micro-robots must corkscrew like bacteria |\n| 🚗 Cars | car body $\\mathrm{Re}\\sim10^7$ (turbulent wake, drag); fuel injectors and the λ-sensor's gas channels are small and laminar | streamlining fights turbulence; a sensor's tiny gas path behaves predictably |\n| 📱 Phones & photography | air in a MEMS microphone's vent and behind the membrane: tiny $\\mathrm{Re}$, squeeze-film flow | that air acts as a damper, not a wind; it shapes the microphone's frequency response (B5) |\n| 🏠 Home & household | tap water: turbulent at full flow, glassy at a trickle; honey, syrup, shampoo; smoke rising smoothly then breaking up | the smooth column of smoke above a candle turns turbulent once its Re grows; honey is your kitchen's microchannel |\n\n## Derivation\n\n**(a) Shear stress and viscosity.**\n1. Two plates a distance $h$ apart, the top one sliding at $U$, liquid in between.\n2. No-slip: the liquid at the bottom is still, at the top moves at $U$; in steady flow the speed rises linearly, $u(y)=Uy/h$.\n3. The force per area needed to keep the plate moving is measured to be proportional to the velocity gradient: shear stress $=\\mu\\,du/dy=\\mu U/h$.\n4. That proportionality constant is the dynamic viscosity $\\mu$ (units Pa·s).\n\n**(b) Newton's law for a fluid parcel (Navier–Stokes in words).**\n1. Take a small cube of fluid, volume $dV$, mass $\\rho\\,dV$.\n2. Its acceleration, following the parcel, is $\\dfrac{D\\mathbf u}{Dt}=\\partial_t\\mathbf u+(\\mathbf u\\cdot\\nabla)\\mathbf u$ (change in time at a point plus change because it moves to a new point).\n3. Net pressure force: pressure is higher on one face than the opposite face, giving $-\\nabla p\\,dV$.\n4. Net viscous force: the shear stress on opposite faces differs by its gradient, giving $\\mu\\nabla^2\\mathbf u\\,dV$.\n5. Newton: $\\rho\\,D\\mathbf u/Dt=-\\nabla p+\\mu\\nabla^2\\mathbf u$. Mass conservation for a liquid: $\\nabla\\cdot\\mathbf u=0$.\n\n**(c) Re from scaling each term.**\n1. Velocities are of size $U$; they change over distances of size $L$.\n2. Each spatial derivative contributes a factor $1/L$: $(\\mathbf u\\cdot\\nabla)\\mathbf u\\sim U\\cdot U/L$.\n3. Two derivatives: $\\nabla^2\\mathbf u\\sim U/L^2$.\n4. Ratio of inertial to viscous: $\\dfrac{\\rho U^2/L}{\\mu U/L^2}=\\dfrac{\\rho UL}{\\mu}\\equiv\\mathrm{Re}$.\n5. Rescale: $\\mathbf u=U\\tilde{\\mathbf u}$, $\\mathbf x=L\\tilde{\\mathbf x}$, $p=(\\mu U/L)\\tilde p$ and divide by $\\mu U/L^2$: $\\mathrm{Re}\\,\\dfrac{D\\tilde{\\mathbf u}}{D\\tilde t}=-\\tilde\\nabla\\tilde p+\\tilde\\nabla^2\\tilde{\\mathbf u}$.\n6. So $\\mathrm{Re}$ is the only parameter left. As $\\mathrm{Re}\\to0$ the left side vanishes: the Stokes equation.\n\n**(d) Time reversibility of Stokes flow.**\n1. Stokes: $\\mu\\nabla^2\\mathbf u=\\nabla p$, with $\\mathbf u$ given on the walls.\n2. If $(\\mathbf u,p)$ solves it, then $(-\\mathbf u,-p)$ solves it too (linear equation, flip both sides).\n3. So reversing the boundary motion or the pressure exactly reverses every velocity.\n4. A parcel's path is $\\mathbf x(t)=\\mathbf x_0+\\int\\mathbf u\\,dt$; running the push backwards for the same time cancels the integral: the parcel returns to $\\mathbf x_0$.\n5. Inertia would break this: a parcel that has speeded up keeps going (the $D\\mathbf u/Dt$ term remembers the past).\n\n**(e) Coasting time of a small sphere.**\n1. A sphere of radius $r$ moving at $U$ in Stokes flow feels drag $F=6\\pi\\mu rU$ (Stokes' law).\n2. Its mass is $m=\\tfrac43\\pi r^3\\rho$. Newton: $m\\,dU/dt=-6\\pi\\mu r\\,U$.\n3. So $U$ decays as $e^{-t/t_{\\text{coast}}}$ with $t_{\\text{coast}}=\\dfrac{m}{6\\pi\\mu r}=\\dfrac{2\\rho r^2}{9\\mu}$.\n4. Coasting distance $=U\\,t_{\\text{coast}}$. For $r=1$ µm, $U=30$ µm/s: $t_{\\text{coast}}=0.22$ µs and the distance is $6.7\\times10^{-12}$ m $=0.067$ Å.\n\n**(f) Entrance length.**\n1. Near the inlet the wall slows a thin layer; momentum diffuses inward with diffusivity $\\nu$.\n2. To reach the centre, a distance $\\sim D_h/2$, takes a time $t\\sim D_h^2/\\nu$, during which the fluid travels $L_e\\sim U t=U D_h^2/\\nu=\\mathrm{Re}\\,D_h$. The measured constant is $0.056$.\n3. At low $\\mathrm{Re}$, viscosity acts upstream as well, so the profile can't develop in less than about half a diameter: hence the $0.6/(1+0.035\\,\\mathrm{Re})$ term.\n\n## Worked check\n\nA PDMS channel $w=100$ µm wide and $h=50$ µm high carries water at a mean speed of $U=5$ mm/s.\n\n- Hydraulic diameter: $D_h=2wh/(w+h)=2(100)(50)/150=66.7$ µm.\n- Reynolds number: $\\mathrm{Re}=\\rho UD_h/\\mu=1000\\times0.005\\times66.7\\times10^{-6}/10^{-3}=0.333$.\n- As two forces per volume: inertia $\\rho U^2/D_h=1000\\times(0.005)^2/66.7\\times10^{-6}=375$ N/m³; viscous\n  $\\mu U/D_h^2=10^{-3}\\times0.005/(66.7\\times10^{-6})^2=1125$ N/m³. Ratio $375/1125=0.333$ ✓, the same number.\n- Entrance length: $L_e/D_h=0.6/(1+0.035\\times0.333)+0.056\\times0.333=0.612$, so $L_e\\approx41$ µm. The\n  profile is fully developed within half a channel width.\n- To make this channel turbulent you would need $U=2300\\,\\mu/(\\rho D_h)=34.5$ m/s, about 6900 times faster.\n  (The check script `scripts/checks/C1_check.py` reproduces every number in this note.)\n\n## Whiteboard plan\n\n- **Panel 1 — honey vs. tea.** Two cups, one spoon each. Tea: curly arrows that keep going after the spoon stops.\n  Honey: a streak that stops and can be pulled back. Write \"inertia\" over the tea and \"friction\" over the honey.\n- **Panel 2 — viscosity.** A deck of cards sheared sideways; then two plates with a straight velocity profile and\n  \"stress $=\\mu\\,du/dy$\". Values: water $10^{-3}$, honey $10$, air $1.8\\times10^{-5}$ Pa·s.\n- **Panel 3 — Navier–Stokes, labelled.** Write the equation with three braces: \"mass × acceleration\", \"pressure push\",\n  \"friction\". Circle $(\\mathbf u\\cdot\\nabla)\\mathbf u$ and say \"nonlinear: the source of turbulence\".\n- **Panel 4 — Re.** Under each brace write its size, $\\rho U^2/L$ and $\\mu U/L^2$; divide; box\n  $\\mathrm{Re}=\\rho UL/\\mu$. Draw the log ladder: bacterium $10^{-5}$, chip $0.1$, aorta $10^3$, swimmer $10^6$,\n  plane $10^8$, with lines at 1 and 2300.\n- **Panel 5 — the chip.** A Y-junction with a yellow and a blue stream side by side, a parabolic arrow profile, and\n  a short bracket \"entrance length ≈ 0.6 $D_h$\". Next to it a turbulent pipe with scribbles.\n- **Panel 6 — the scallop.** A scallop opening and closing with arrows \"→ then ←, net 0\", and a corkscrew flagellum\n  with \"non-reciprocal: net motion\". Write \"Stokes: no time, linear ⇒ reversible\".\n\n## Common mistakes and where the intuition breaks\n\n- **Using the wrong length.** $L$ must be the size over which the velocity changes: the channel's smallest\n  dimension or its hydraulic diameter, not its length. A 5 cm-long, 50 µm-high channel has $L\\approx D_h$, not 5 cm.\n- **Thinking low Re means \"slow\".** A microchannel flow can be fast (cm/s) and still have $\\mathrm{Re}<1$; a\n  glacier is slow and its Re is tiny for a different reason (enormous viscosity). Re is a *ratio*.\n- **Treating 2300 as universal.** It is for long straight pipes with ordinary disturbances. Very smooth pipes have\n  stayed laminar to $10^5$; flow around obstacles, in curved channels or over a wing becomes unsteady at quite\n  different values. In a curved microchannel at $\\mathrm{Re}\\sim10$–$100$, inertia already produces secondary\n  \"Dean\" vortices, which **inertial microfluidics** uses to sort cells.\n- **\"Laminar means mixed slowly, so it must mix eventually.\"** Without diffusion, laminar streams never mix; with\n  diffusion they mix over a length $\\sim\\mathrm{Pe}\\,w$ that can be centimetres (C3). Turbulence mixes by stretching;\n  laminar flow only shears.\n- **Forgetting no-slip at the walls.** The mean speed is not the speed of every parcel. Particles near the walls lag,\n  which is why a dye plug smears out along the channel (Taylor dispersion, C3).\n- **Applying Stokes reversibility with inertia, elasticity or diffusion present.** Taylor's demo works because dye\n  diffuses very slowly in glycerol. Wait too long and diffusion, which is *not* reversible, blurs the drop for good.\n  Polymer solutions (saliva, mucus) are elastic and also break the scallop theorem.\n\n## Remember\n\n**\"Re = ρUL/μ = inertia ÷ friction. In a chip Re ≪ 1: the flow is laminar, instantaneous and reversible, and two streams never mix except by diffusion.\"**\n\n## Self-test\n\n1. A blood-plasma microchannel is 50 µm wide; plasma has $\\mu=1.2$ mPa·s, $\\rho=1025$ kg/m³, and flows at 2 mm/s. Find Re. Is it laminar?\n   <details><summary>Answer<\/summary>Re = 1025 × 0.002 × 50e-6 / 1.2e-3 ≈ 0.085. Far below 1 (and far below 2300): laminar, practically Stokes flow.<\/details>\n2. Why can't a microscopic robot swim by flapping a single rigid fin back and forth, however fast?\n   <details><summary>Answer<\/summary>At Re much less than 1 the flow has no inertia and is time-reversible, so only the sequence of shapes matters, not the speed. Flapping one hinge back and forth is a reciprocal motion: the return stroke undoes the forward stroke exactly (scallop theorem). It needs a non-reciprocal motion, such as a rotating corkscrew or a travelling wave.<\/details>\n3. A chip channel is copied 10× larger in every dimension, and the liquid is pushed 10× faster. By how much does Re change, and is the copy still laminar if the original had Re = 0.1?\n   <details><summary>Answer<\/summary>Re is proportional to U times L, so it grows 10 × 10 = 100 times, to Re = 10. Still laminar (far below 2300), but inertia is no longer negligible: the flow is no longer reversible Stokes flow, and in curved channels secondary (Dean) vortices start to appear.<\/details>\n\n**Next:** [C2 Pressure-driven flow and hydraulic circuits](#C2) — now that we know chip flow is laminar, we can solve it exactly: a parabola, a law $Q\\propto r_0^4$, and Ohm's law for water.\n"}, {"id": "C2", "short": "Pressure-driven flow and hydraulic circuits", "title": "Pressure-driven flow and hydraulic circuits", "part": "C", "md": "# C2. Pressure-driven flow and hydraulic circuits\n\n> **Connects:** builds on [C1 Fluids at the microscale](#C1), [A2 Resistive sensors and the Wheatstone bridge](#A2) (Ohm's law, series and parallel), [A7 Signal conditioning](#A7) (RC time constant) · used by [C3 Diffusion and mixing](#C3), [C5 Lab-on-a-chip](#C5)\n\n## Hook — a garden hose, and Ohm's law for water\n\nSqueeze the end of a garden hose and the water shoots further, but less of it comes out. Use a long, thin hose and the\ntrickle at the end is feeble however far you open the tap. Everyone feels the rule: **a narrow, long pipe resists\nflow, and you need pressure to push through it.**\n\nIn a microfluidic chip that rule becomes exact. Because the flow is laminar (C1), the flow rate through a channel is\n*proportional* to the pressure across it, just as current through a resistor is proportional to voltage. A chip with\na dozen channels is literally a resistor network, and you can design it with the same series and parallel rules you\nuse for a Wheatstone bridge (A2). The same law tells a tree how hard it must pull to lift water 30 m up its trunk, and\nit hides a surprise: halve the radius of a tube and the flow drops not 2 or 4 times, but **16 times**.\n\n## The idea in plain words\n\n**Pressure pushes, viscosity resists.** To make a liquid flow along a channel of length $L$, you keep the pressure at\nthe inlet higher than at the outlet by $\\Delta p$. The liquid accelerates until the friction of its layers rubbing\nagainst each other and against the still walls (no-slip, C1) exactly balances the push. In a microchannel this takes\nmicroseconds, so the flow is always in this balanced, **steady** state. What comes out is a **volumetric flow rate**\n$Q$, in m³/s; chip people prefer µL/min (1 µL/min $=1.67\\times10^{-11}$ m³/s).\n\n**The parabola.** In a round tube of radius $r_0$ (the symbol $r_0$ is local to this note; $r$ measures the distance\nfrom the axis), the speed is zero at the wall and largest on the axis. A force balance on a cylinder of fluid (derived\nbelow and in the 3D figure) gives the **Hagen–Poiseuille profile**\n$$u(r)=\\frac{\\Delta p}{4\\mu L}\\,(r_0^2-r^2),$$\na paraboloid like an upside-down bowl. Its peak is $u_{\\max}=\\Delta p\\,r_0^2/(4\\mu L)$, and its average over the\ncross-section is exactly half of that: fast fluid in the middle, crawling fluid at the edge.\n\n**The fourth-power law.** The flow rate is the volume under that bowl:\n$$Q=\\frac{\\pi r_0^4}{8\\mu L}\\,\\Delta p.$$\nThe $r_0^4$ has two halves: the bowl gets taller as $r_0^2$ (more room for the speed to build up away from the walls),\nand the area it covers grows as $r_0^2$ too. Halve the radius and $Q$ falls $2^4=16$ times. This is why a slightly\nnarrowed artery matters so much, why the thinnest part of a chip dominates its flow, and why blood vessels widen\n(vasodilation) to boost flow with tiny changes in diameter.\n\n```viz\nc2-poiseuille-3d\n```\n\n**Rectangular channels.** Chips are moulded or etched, so their channels have a rectangular cross-section of width\n$w$ and height $h$ (take $h\\le w$). The exact profile is a Fourier series (it is in the widget), but for design one\nformula is enough:\n$$R_{\\text{hyd}}\\approx\\frac{12\\mu L}{w\\,h^3\\,(1-0.63\\,h/w)}.$$\nFor a very flat channel ($h\\ll w$) the profile across the height is a parabola, and the $h^3$ comes from the same\nlogic as $r_0^4$: one power of $h$ from the area, two from the height of the parabola. The bracket corrects for the\nside walls. It is within 0.2 % of the exact series for $h/w\\le0.5$, and 14 % high for a square channel. The lesson:\n**the height is critical.** A 10 % error in the mould depth changes the flow by about 30 %.\n\n**Ohm's law for fluids.** Since $Q\\propto\\Delta p$, define the **hydraulic resistance** $R_{\\text{hyd}}$ by\n$$\\Delta p=Q\\,R_{\\text{hyd}}\\qquad\\Longleftrightarrow\\qquad V=I\\,R.$$\nFor a tube $R_{\\text{hyd}}=8\\mu L/(\\pi r_0^4)$; for a rectangle, the formula above. Units: Pa·s/m³. The analogy is\nexact, not loose: pressure ↔ voltage, flow rate ↔ current, channel ↔ resistor. Volume is conserved at every\njunction (Kirchhoff's current law), and pressure drops add around any loop (Kirchhoff's voltage law). So:\n\n- **Series** channels add: $R_{\\text{tot}}=R_1+R_2+\\dots$ (the same $Q$ passes through each, and the drops add).\n- **Parallel** channels combine as $1/R_{\\text{tot}}=1/R_1+1/R_2+\\dots$ (the same $\\Delta p$ across each, and the flows add).\n- A **pressure divider**: the pressure at a junction between $R_1$ and $R_2$ in series is $p_{\\text{in}}R_2/(R_1+R_2)$.\n\n```viz\nc2-circuit\n```\n\n**Pumps are sources.** A **pressure controller** (a regulated gas pressure on top of a liquid reservoir) fixes\n$\\Delta p$: it is a voltage source, and the flow it gives depends on the chip's resistance. A **syringe pump**\n(a motor pushing a plunger at constant speed) fixes $Q$: it is a current source, and the pressure rises to whatever\nthe chip needs, which can crack a chip if a channel clogs. Pressure controllers respond in milliseconds; syringe pumps\nare precise in the long run but slow to settle, because of the next effect.\n\n**Compliance is capacitance.** PDMS, the soft silicone most chips are made from, bulges when the pressure rises;\ntubing stretches; an air bubble compresses. Each stores extra volume $dV$ when the pressure rises by $dp$. That ratio\nis the **hydraulic compliance** $C_{\\text{hyd}}=dV/dp$ (local symbol), the twin of a capacitor's $C=dq/dV$. A\ncompliance feeding a resistance gives a first-order lag with time constant\n$$\\tau=R_{\\text{hyd}}\\,C_{\\text{hyd}},$$\nexactly the RC filter of A7. Start a syringe pump and the flow through the chip rises as $1-e^{-t/\\tau}$. An air bubble\nof volume $V$ at pressure $p$ has $C_{\\text{hyd}}=V/p$ (from $pV=$ const), which is huge: a 10 µL bubble at\natmospheric pressure adds $10^{-13}$ m³/Pa, ten times more than typical tubing (about 1 µL per bar, $10^{-14}$ m³/Pa). Experimenters learn to hunt bubbles.\n\n```viz\nc2-compliance\n```\n\n**Wall shear stress.** The fluid drags on the wall with a stress $\\tau_w=\\mu\\,|du/dr|$ at the wall. For a tube,\n$\\tau_w=4\\mu Q/(\\pi r_0^3)=4\\mu\\bar u/r_0$, where $\\bar u$ is the mean speed; for a flat channel, $\\tau_w=6\\mu Q/(wh^2)$.\nCells care about this number. The endothelial cells that line blood vessels align with the flow, change their genes\nand keep the vessel healthy when $\\tau_w$ is around 1–2 Pa; regions of low or oscillating shear (artery branches) are\nwhere plaques form. An **organ-on-a-chip** that grows blood-vessel cells must therefore set its flow to give the right\n$\\tau_w$, not just \"some flow\".\n\n**Xylem: a tree's microchannels.** Water rises in plants through **xylem** vessels, dead hollow cells joined into\ntubes 20–100 µm wide: microchannels, with $\\mathrm{Re}\\sim0.01$–$0.1$. Nothing pushes from below. Evaporation from the\nleaves pulls, putting the water under **tension** (negative pressure), and water's cohesion keeps the column from\nbreaking (the cohesion–tension theory). Poiseuille tells the tree how hard to pull: friction in the vessels plus the\nweight of the column. Plants also branch their vessels in a nearly optimal way. **Murray's law** says a network that\nminimises the work of pumping plus the cost of building and filling the vessels has $Q\\propto r_0^3$ in every\nbranch, so at each fork $r_{\\text{parent}}^3=\\sum r_{\\text{daughter}}^3$. As a bonus, $\\tau_w\\propto Q/r_0^3$ is then\nthe same everywhere. Blood vessels follow Murray's law surprisingly well; xylem follows a modified version.\n\n## Intuitive examples\n\n1. **A round capillary.** Radius $r_0=50$ µm, length 1 cm, water, $\\Delta p=1$ kPa (1 % of an atmosphere):\n   $R_{\\text{hyd}}=8\\mu L/(\\pi r_0^4)=4.07\\times10^{12}$ Pa·s/m³, so $Q=2.45\\times10^{-10}$ m³/s $=14.7$ µL/min. Peak\n   speed 62.5 mm/s, mean 31.25 mm/s (exactly half), $\\mathrm{Re}=3.1$: laminar. Halve the radius: 16× less flow.\n2. **A typical chip channel.** $w=100$ µm, $h=50$ µm, $L=1$ cm: $R_{\\text{hyd}}=1.40\\times10^{13}$ Pa·s/m³ (the\n   exact series gives $1.399\\times10^{13}$, 0.15 % different). To push 10 µL/min you need 2.34 kPa; the mean speed is\n   33.3 mm/s. Make it 25 µm high instead and $R_{\\text{hyd}}$ rises 6.5×.\n3. **A network.** Inlet channel $R_1$ (1 cm), then two 2 cm branches in parallel, then $R_4$ (1 cm), all\n   100 × 50 µm. Each 2 cm branch has $2.80\\times10^{13}$; the pair in parallel has $1.40\\times10^{13}$, the same as one\n   1 cm channel. Total $4.20\\times10^{13}$ Pa·s/m³. At 5 kPa: $Q=7.14$ µL/min, 3.57 µL/min in each branch, and the\n   junctions sit at 3.33 kPa and 1.67 kPa.\n4. **Bubbles slow pumps.** That network plus 1 µL/bar of tubing compliance ($10^{-14}$ m³/Pa) has $\\tau=0.42$ s. Add a\n   10 µL bubble and $\\tau=4.62$ s: the flow needs 21 s to get within 1 % of the set value.\n5. **Shear for cells.** In a 1 mm wide, 100 µm high organ-chip channel, a wall shear of 1 Pa needs\n   $Q=\\tau_w wh^2/(6\\mu)=100$ µL/min. In a capillary ($r_0=4$ µm, 0.5 mm/s, blood 3.5 mPa·s), $\\tau_w=1.75$ Pa; in the\n   aorta (12.5 mm radius, 0.2 m/s mean), Poiseuille gives only about 0.22 Pa.\n6. **A 30 m tree.** Xylem vessels $r_0=20$ µm carrying sap at 1 mm/s (3.6 m/h): the pressure gradient is\n   $8\\mu\\bar u/r_0^2=0.020$ MPa/m. Over 30 m: 0.60 MPa of friction plus $\\rho g_{\\text{grav}}H=0.29$ MPa to lift the\n   column, about 0.89 MPa of tension, close to the −1 to −2 MPa measured in leaves of tall trees.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $u(r)=\\dfrac{\\Delta p}{4\\mu L}(r_0^2-r^2)$ | parabolic (Poiseuille) profile in a tube | $r_0$ tube radius, $r$ distance from the axis, $L$ length |\n| $Q=\\dfrac{\\pi r_0^4\\,\\Delta p}{8\\mu L}$, $\\ \\bar u=\\tfrac12u_{\\max}$ | Hagen–Poiseuille flow rate; mean = half the peak | $Q$ in m³/s, $\\bar u=Q/(\\pi r_0^2)$ |\n| $\\Delta p=Q\\,R_{\\text{hyd}}$ | Ohm's law for fluids | $R_{\\text{hyd}}$ in Pa·s/m³ |\n| $R_{\\text{hyd}}=\\dfrac{8\\mu L}{\\pi r_0^4}$ | round tube | |\n| $R_{\\text{hyd}}\\approx\\dfrac{12\\mu L}{wh^3(1-0.63h/w)}$ | rectangular channel, $h\\le w$ | $w$ width, $h$ height |\n| $R_{\\text{s}}=R_1+R_2$, $\\ \\dfrac1{R_{\\text{p}}}=\\dfrac1{R_1}+\\dfrac1{R_2}$ | series and parallel channels | |\n| $C_{\\text{hyd}}=dV/dp$, $\\ \\tau=R_{\\text{hyd}}C_{\\text{hyd}}$ | compliance and the RC settling time | bubble: $C_{\\text{hyd}}=V/p$ |\n| $\\tau_w=\\dfrac{4\\mu Q}{\\pi r_0^3}$ (tube), $\\ \\tau_w=\\dfrac{6\\mu Q}{wh^2}$ (flat channel) | wall shear stress | $\\tau_w$ in Pa |\n| $r_{\\text{parent}}^3=\\sum r_{\\text{daughter}}^3$ | Murray's law for branching vessels | two equal daughters: $r=0.794\\,r_{\\text{parent}}$ |\n\n## Applications\n\n| World | Pressure-driven flow and hydraulic circuits | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | xylem vessels as parallel microchannels; drip-irrigation emitters (long narrow labyrinths as resistors); sap-flow chips | how much tension a leaf must pull (≈0.9 MPa for 30 m); why one embolised (air-filled) vessel cuts flow; why emitters deliver the same flow along a long pipe |\n| 🧬 Biology & human health | blood vessels ($Q\\propto r_0^4$); organ-on-chip shear; IV drips and catheters; dialysis membranes | a 20 % narrowing cuts flow by 59 %; endothelial cells need $\\tau_w\\approx1$–2 Pa; a thinner catheter needs much more pressure |\n| 🌍 Environment | water-quality chips pumped by gravity or a small pressure; soil water moving through pores | a field chip can run on a fixed head of water if its total $R_{\\text{hyd}}$ is known; soil permeability is Poiseuille through many pores |\n| 🤖 Robotics & drones | soft robots driven by hydraulic or pneumatic channels; microfluidic \"logic\"; fuel lines on drones | actuator speed is set by $\\tau=R_{\\text{hyd}}C_{\\text{hyd}}$ of the channel and the soft chamber |\n| 🚗 Cars | fuel injectors, brake lines, oil passages; the λ-sensor's diffusion barrier | brake fluid must be bubble-free (bubbles are compliance: a spongy pedal); injector flow is calibrated by $\\Delta p$ |\n| 📱 Phones & photography | the tiny vent channel behind a MEMS microphone or barometer membrane; inkjet nozzles | vent resistance × back-volume compliance is an RC that sets the microphone's low-frequency cutoff (B5) |\n| 🏠 Home & household | taps, shower heads, coffee machines (water through a coffee puck), washing-machine level sensors (air in a tube) | finer coffee grounds = smaller pores = much higher $R_{\\text{hyd}}$; a water-level sensor reads the pressure trapped in a compliant air column |\n\n## Derivation\n\n**(a) Force balance on a fluid cylinder (round tube).**\n1. Steady, laminar flow along the axis of a tube of radius $r_0$ and length $L$, pressure drop $\\Delta p$.\n2. Cut out a coaxial cylinder of fluid of radius $r$. The pressure difference pushes on its ends: $F_{\\text{push}}=\\Delta p\\,\\pi r^2$.\n3. The slower fluid outside rubs on its side with shear stress $-\\mu\\,du/dr$ over area $2\\pi rL$: $F_{\\text{drag}}=-\\mu\\,\\dfrac{du}{dr}\\,2\\pi rL$.\n4. No acceleration (steady, and the profile doesn't change along the tube), so t
