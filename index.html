<style>
/* Layout: a field notebook — fixed contents rail on the left, one reading column; the whiteboard section is a chalkboard. */
:root {
  --paper: #f5f6f1;
  --sheet: #fcfcf9;
  --ink: #1c2420;
  --muted: #5a665f;
  --line: #d9dfd6;
  --accent: #2c6a52;
  --part-a: #3a4fb0;
  --part-b: #a76a0c;
  --part-c: #2f7d4f;
  --hook-bg: #eef3ea;
  --key-bg: #f1f3fb;
  --warn-bg: #fbf3e6;
  --warn-line: #d9a441;
  --board: #22332b;
  --board-edge: #5b4630;
  --chalk: #e8eee4;
  --chalk-dim: #b9c7bc;
  --chalk-yellow: #f3df8a;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-chalk: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131915; --sheet: #182019; --ink: #e3e8e2; --muted: #9aa79f; --line: #2c3730;
    --accent: #6cc39d; --part-a: #93a3f2; --part-b: #e2ad55; --part-c: #73c793;
    --hook-bg: #1d2a22; --key-bg: #1d2133; --warn-bg: #2b2416; --warn-line: #b88a33;
    --board: #1b2a22; --board-edge: #6b5338; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131915; --sheet: #182019; --ink: #e3e8e2; --muted: #9aa79f; --line: #2c3730;
  --accent: #6cc39d; --part-a: #93a3f2; --part-b: #e2ad55; --part-c: #73c793;
  --hook-bg: #1d2a22; --key-bg: #1d2133; --warn-bg: #2b2416; --warn-line: #b88a33;
  --board: #1b2a22; --board-edge: #6b5338; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.62; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
  padding-block: 28px; padding-inline: 20px; font-family: var(--font-display); font-size: 14px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.2; }
.brand small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.rail nav { display: grid; gap: 18px; margin-top: 24px; }
.rail h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.rail a { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 6px;
  color: var(--ink); text-decoration: none; line-height: 1.3; }
.rail a:hover { background: var(--hook-bg); }
.rail a[aria-current="page"] { background: var(--hook-bg); font-weight: 600; }
.rail .id { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--pc, var(--muted)); }
.rail .tick { color: var(--accent); font-size: 12px; }
.mobile-nav { display: none; }

main { min-width: 0; padding-block: 40px 80px; padding-inline: 32px; }
.sheet { max-width: 46rem; margin: 0 auto; }
.crumb { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--pc, var(--muted)); font-weight: 600; }
.sheet h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1.15; letter-spacing: -0.02em; margin: 6px 0 14px; text-wrap: balance; }
.sheet h1 .num { color: var(--pc, var(--accent)); margin-right: 0.35em; }
.sheet h2 { font-family: var(--font-display); font-weight: 650; font-size: 1.32rem; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 22px 0 8px; }
.sheet p, .sheet li { max-width: 68ch; }
.sheet blockquote { margin: 0 0 22px; padding: 10px 14px; border-left: 3px solid var(--pc, var(--accent)); background: var(--sheet);
  font-family: var(--font-display); font-size: 14px; line-height: 1.5; color: var(--muted); }
.sheet blockquote p { margin: 0; }
.sheet code { font-family: var(--font-mono); font-size: 0.86em; background: var(--hook-bg); padding: 0.08em 0.3em; border-radius: 4px; }
.sheet pre { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; }
.sheet pre code { background: none; padding: 0; }
.tablewrap { overflow-x: auto; margin: 14px 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.sheet table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
.sheet th { text-align: left; font-family: var(--font-display); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sheet th, .sheet td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sheet tr:last-child td { border-bottom: 0; }
.sheet hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
mjx-container { font-size: 104%; }

section.sec { margin: 0 0 30px; }
section.sec-hook { background: var(--hook-bg); border-radius: 12px; padding: 18px 22px 6px; }
section.sec-hook h2::before, section.sec-key h2::before, section.sec-warn h2::before, section.sec-test h2::before, section.sec-deriv h2::before, section.sec-check h2::before {
  display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
section.sec-hook h2::before { content: "Real-world hook"; }
section.sec-key { background: var(--key-bg); border-radius: 12px; padding: 18px 22px 8px; }
section.sec-key h2::before { content: "Remember these"; }
section.sec-deriv { border-top: 2px dashed var(--line); padding-top: 20px; }
section.sec-deriv h2::before { content: "Elaboration"; }
section.sec-check h2::before { content: "By hand"; }
section.sec-warn { background: var(--warn-bg); border-left: 4px solid var(--warn-line); border-radius: 0 12px 12px 0; padding: 16px 20px 6px; }
section.sec-warn h2::before { content: "Careful"; }
section.sec-test h2::before { content: "Check yourself"; }
section.sec-remember { font-family: var(--font-display); font-size: 1.08rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 12px 2px; }
section.sec-remember h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }

/* The chalkboard: same look in both themes, framed like a classroom board */
section.sec-board { background: var(--board); color: var(--chalk); border: 10px solid var(--board-edge); border-radius: 6px;
  padding: 20px 24px 10px; box-shadow: inset 0 0 60px rgba(0,0,0,0.35); }
section.sec-board h2 { font-family: var(--font-chalk); font-size: 2rem; font-weight: 600; color: var(--chalk-yellow); letter-spacing: 0; }
section.sec-board strong, section.sec-board b { color: var(--chalk-yellow); }
section.sec-board em { color: var(--chalk); }
section.sec-board a { color: var(--chalk-yellow); }
section.sec-board li::marker { color: var(--chalk-dim); }
section.sec-board code { background: rgba(255,255,255,0.08); color: var(--chalk); }
section.sec-board mjx-container { color: var(--chalk); }
section.sec-board .tablewrap { background: transparent; border-color: rgba(255,255,255,0.18); }
section.sec-board th, section.sec-board td { border-color: rgba(255,255,255,0.14); color: var(--chalk); }

details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: 6px 0 10px; background: var(--sheet); }
summary { cursor: pointer; font-family: var(--font-display); font-size: 13.5px; font-weight: 600; color: var(--accent); }
details[open] summary { margin-bottom: 6px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; font-family: var(--font-display); }
.pager a { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-decoration: none; color: var(--ink); background: var(--sheet); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.pager .next { text-align: right; grid-column: 2; }
.known { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 14px; color: var(--muted); margin: 0 0 22px; }
.known input { width: 18px; height: 18px; accent-color: var(--accent); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-nav { display: flex; gap: 10px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; font-family: var(--font-display); }
  .mobile-nav b { font-size: 14px; white-space: nowrap; }
  .mobile-nav select { min-width: 0; flex: 1; font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
  main { padding-block: 24px 60px; padding-inline: 16px; }
  .sheet h1 { font-size: 1.6rem; }
  section.sec-hook, section.sec-key, section.sec-warn { padding-inline: 16px; }
  section.sec-board { padding-inline: 14px; border-width: 6px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.25s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }

<script>
/* ── core.js ── */
/* viz — 3Blue1Brown-style interactive visuals (2D SVG + a tiny 3D engine) for the Sensor Foundations reader.
 *
 * A note asks for a visual with a fenced block:   ```viz
 *                                                  a2-bridge
 *                                                  ```
 * The reader calls VIZ.mount(sheet, ctx) after rendering a page; every `code.language-viz` block becomes a live
 * widget. Register widgets with
 *   VIZ.register(id, { title, target, caption, links, build(fig, ui, ctx) })
 *     target  — the teaching target: "After this you can …" (one sentence)
 *     links   — ["B3", { id: "C2", why: "same law, for water" }] → the "Connected to" strip
 *     ui      — { body, ctl, read, button(), slider(), steps(list, onStep) }  (steps = the math-detail stepper)
 * 3D:  const sc = VIZ.scene3d(ui.body, { draw(g, t) { g.line(...); g.poly(...); … } });  drag = orbit, wheel = zoom.
 * One colour per physical object across ALL notes (notation.md → "Colours in the visuals"): see ROLE below.
 * One file per note in scripts/viz/ (core.js first); scripts/build.py concatenates them into index.html.
 * No libraries. Respects prefers-reduced-motion.
 */
(function () {
  "use strict";

  // ── palette (3b1b-like) and the colour of each physical object ──────────────────────────────────────────
  const C = {
    bg: "#0e1116", grid: "#1f4e66", gridFaint: "#15303f", axis: "#c9d1d9", text: "#e8ecef", dim: "#8b96a0",
    blue: "#58C4DD", yellow: "#F4D35E", green: "#83C167", red: "#FC6255", teal: "#5CD0B3",
    gold: "#F0AC5F", purple: "#B98AE0", white: "#FFFFFF", water: "#5B8CFF", silicon: "#7d8796",
  };
  const ROLE = {
    s: C.blue,          // the stimulus / measurand: what the world does (strain, light, pressure, glucose…)
    y: C.yellow,        // the sensor's output signal (volts, counts, frequency)
    fit: C.green,       // the ideal / model / calibration line / filtered estimate
    noise: C.red,       // noise, error, drift: "measured minus true"
    elec: C.teal,       // electrical: voltage, charge, electric field, current
    heat: C.gold,       // thermal and light: temperature, photons
    mech: C.purple,     // mechanical: force, displacement, mass, spring
    fluid: C.water,     // fluid: flow, velocity, concentration
    solid: C.silicon,   // silicon, glass, PDMS: the device body
  };
  const NS = "http://www.w3.org/2000/svg";
  const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── tiny DOM helpers ───────────────────────────────────────────────────────────────────────────────────
  function S(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function H(tag, attrs, parent, html) {
    const e = document.createElement(tag);
    for (const k in attrs || {}) e.setAttribute(k, attrs[k]);
    if (html !== undefined) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
  }
  function fmt(x, d) {
    if (d === undefined) d = 2;
    if (Math.abs(x) < 1e-9) x = 0;
    let s = x.toFixed(d);
    if (s.indexOf(".") >= 0) s = s.replace(/0+$/, "").replace(/\.$/, "");
    return s === "-0" ? "0" : s;
  }
  const deg = (rad) => (rad * 180) / Math.PI;
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1];
  const len = (p) => Math.hypot(p[0], p[1]);
  const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));
  const lerp = (a, b, t) => a + (b - a) * t;
  function tween(ms, step, done) {
    if (reduceMotion) { step(1); if (done) done(); return; }
    const t0 = performance.now();
    function frame(now) {
      const t = Math.min(1, (now - t0) / ms);
      step(ease(t));
      if (t < 1) requestAnimationFrame(frame); else if (done) done();
    }
    requestAnimationFrame(frame);
  }

  // ── styles (injected once) ─────────────────────────────────────────────────────────────────────────────
  const CSS = `
figure.viz { margin: 18px 0 24px; border-radius: 12px; overflow: hidden; background: ${C.bg}; color: ${C.text};
  font-family: var(--font-display, system-ui, sans-serif); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
figure.viz .viz-title { padding: 10px 14px 0; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: ${C.dim}; font-weight: 600; }
figure.viz svg:not(mjx-container svg) { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
figure.viz .viz-ctl { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 14px 4px; font-size: 13.5px; }
figure.viz button { font: inherit; font-size: 13px; color: ${C.text}; background: #1d2530; border: 1px solid #34404d; border-radius: 999px;
  padding: 5px 12px; cursor: pointer; }
figure.viz button:hover { border-color: ${C.blue}; }
figure.viz label { display: inline-flex; gap: 8px; align-items: center; color: ${C.dim}; }
figure.viz input[type=range] { accent-color: ${C.blue}; width: 130px; }
figure.viz .viz-read { padding: 6px 14px 10px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 13.5px; line-height: 1.55; color: ${C.text}; }
figure.viz .viz-read b { font-weight: 600; }
figure.viz figcaption { padding: 8px 14px 12px; border-top: 1px solid #222b35; font-size: 13.5px; line-height: 1.5; color: ${C.dim}; }
figure.viz figcaption strong { color: ${C.text}; font-weight: 600; }
figure.viz figcaption a { color: ${C.yellow}; text-decoration: none; font-weight: 600; }
figure.viz figcaption a:hover { text-decoration: underline; }
figure.viz .viz-target { margin: 8px 14px 0; padding: 7px 10px; border-radius: 8px; background: #17241d; border: 1px solid #2c4a3a;
  font-size: 13.5px; line-height: 1.45; color: ${C.text}; }
figure.viz .viz-target span { color: ${C.green}; font-weight: 600; margin-right: 4px; }
figure.viz canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
figure.viz canvas:active { cursor: grabbing; }
figure.viz .viz-hint { padding: 2px 14px 0; font-size: 12px; color: ${C.dim}; }
figure.viz .viz-steps { margin: 4px 14px 10px; border: 1px solid #2a3440; border-radius: 10px; background: #121820; }
figure.viz .viz-steps-head { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid #222b35; font-size: 12px; }
figure.viz .viz-steps-lab { flex: 1; text-transform: uppercase; letter-spacing: .08em; color: ${C.dim}; font-weight: 600; }
figure.viz .viz-steps-head button { padding: 2px 10px; }
figure.viz .viz-steps-count { font-family: var(--font-mono, monospace); color: ${C.dim}; min-width: 3.5em; text-align: center; }
figure.viz .viz-steps-body { padding: 8px 12px; font-size: 14px; line-height: 1.55; }
figure.viz .viz-step { padding: 3px 0 3px 10px; border-left: 3px solid transparent; color: ${C.dim}; display: none; }
figure.viz .viz-step.done { display: block; opacity: .75; }
figure.viz .viz-step.on { display: block; color: ${C.text}; border-left-color: ${C.yellow}; }
figure.viz figcaption .why { color: ${C.dim}; font-weight: 400; }
figure.viz .viz-missing { padding: 14px; color: ${C.red}; font-size: 13px; }
.viz-fits { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; margin: -6px 0 18px; font-family: var(--font-display, sans-serif); font-size: 13px; color: var(--muted, #667); }
.viz-fits a { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line, #ccd); text-decoration: none; color: var(--ink, #222); }
.viz-fits a:hover { border-color: var(--accent, #2c6a52); }
.viz-fits .lbl { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; font-weight: 600; }
`;
  function injectCSS() {
    if (document.getElementById("viz-css")) return;
    H("style", { id: "viz-css" }, document.head, CSS);
  }

  // ── a coordinate plane on an SVG (math y points up, equal scale on both axes) ───────────────────────────
  function plane(fig, opt) {
    const o = Object.assign({ w: 640, xr: [-1, 6], yr: [-1, 5], grid: true, axes: true }, opt || {});
    const s = o.w / (o.xr[1] - o.xr[0]);
    const h = Math.round(s * (o.yr[1] - o.yr[0]));
    const svg = S("svg", { viewBox: `0 0 ${o.w} ${h}`, role: "img", "aria-label": o.label || "interactive diagram" }, fig);
    S("defs", {}, svg);
    const X = (x) => (x - o.xr[0]) * s;
    const Y = (y) => (o.yr[1] - y) * s;
    const gGrid = S("g", {}, svg), gMain = S("g", {}, svg), gTop = S("g", {}, svg);
    if (o.grid) {
      for (let x = Math.ceil(o.xr[0]); x <= o.xr[1]; x++)
        S("line", { x1: X(x), y1: 0, x2: X(x), y2: h, stroke: x === 0 ? "none" : C.grid, "stroke-width": 1, opacity: 0.55 }, gGrid);
      for (let y = Math.ceil(o.yr[0]); y <= o.yr[1]; y++)
        S("line", { x1: 0, y1: Y(y), x2: o.w, y2: Y(y), stroke: y === 0 ? "none" : C.grid, "stroke-width": 1, opacity: 0.55 }, gGrid);
    }
    if (o.axes) {
      S("line", { x1: 0, y1: Y(0), x2: o.w, y2: Y(0), stroke: C.axis, "stroke-width": 1.4, opacity: 0.8 }, gGrid);
      S("line", { x1: X(0), y1: 0, x2: X(0), y2: h, stroke: C.axis, "stroke-width": 1.4, opacity: 0.8 }, gGrid);
    }
    const P = { svg, s, h, w: o.w, X, Y, o, gGrid, gMain, gTop };

    P.toMath = function (clientX, clientY) {

<script>

/* A1 — what a sensor is: widgets for docs/A1-what-a-sensor-is-transduction-and-the-measurement-chain.md */
(function () {
  "use strict";

  // ═════════════════ a1-chain-3d: the kitchen scale as a measurement chain ═════════════════
  register("a1-chain-3d", {
    title: "3D · the measurement chain of a kitchen scale: mass → strain → ΔR/R → mV → V → counts",
    target: "After this you can follow a stimulus through every stage of a sensor and get the total sensitivity by multiplying the stage gains.",

      { id: "A7", why: "the amplifier and ADC of stages 3–4" },

      { id: "B3", why: "how much the bar bends: beam mechanics" },

    build(fig, ui) {

            if (!reduceMotion && m > 0.001) {
              const f = (t * 0.7 + i * 0.27) % 1;
              g.sphere([a + (b2 - a) * f, 0, ZC], 0.075, i === 3 ? C.yellow : C.teal);
            }
          });
          // ── three rows under each stage: name, gain, what comes out ──
          const rows = [
            [X.scale, "load cell", "200 µε/kg · GF 2", "ΔR/R = " + fmt(v.dRR * 1e6, 0) + " ppm", 1, C.blue],
            [X.bridge, "full bridge", "× V_ex = 5 V", fmt(v.vb * 1e3, 2) + " mV", 3, C.teal],
            [X.amp, "amplifier", "× G = 128", fmt(v.va * 1e3, 0) + " mV", 4, C.teal],
            [X.adc, "16-bit ADC", "÷ 31.25 µV", fmt(v.n, 0) + " counts", 5, C.yellow],
            [X.disp, "display", "(y − y0)/S", fmt(v.mg, 1) + " g", 6, C.yellow],
          ];
          rows.forEach(([x, n1, n2, n3, k, col]) => {
            const on = step === k || (k === 1 && step === 2);
            g.text([x, 0, -0.4], n1, on ? C.yellow : C.text, 13);
            g.text([x, 0, -0.72], n2, on ? C.yellow : C.dim, 11.5);
            g.text([x, 0, -1.04], "→ " + n3, hl(k) || (k === 1 && hl(2)) ? col : mix(col, C.bg, 0.5), 12.5);
          });
          if (hl(1)) g.text([-5.45, -0.4, 1.35], "ε = " + fmt(v.eps * 1e6, 0) + " µε", C.blue, 12);
        },
      });

      ui.slider("mass m", 0, 5, 0.05, m, (val) => { m = val; upd(); return fmt(m, 2) + " kg"; });
      function upd() {
        const v = vals();
        ui.read.innerHTML =
          `<span style="color:${C.blue}">m = ${fmt(m * 1000, 0)} g</span> → ε = ${fmt(v.eps * 1e6, 0)} µε → ΔR/R = ${fmt(v.dRR * 1e6, 0)} ppm → ` +
          `<span style="color:${C.teal}">V_out = ${fmt(v.vb * 1e3, 3)} mV → ${fmt(v.va * 1e3, 1)} mV</span> → ` +
          `<span style="color:${C.yellow}">${fmt(v.n, 0)} counts (+ offset 1200 = ${fmt(v.y, 0)})</span><br>` +
          `S = 200e-6 × 2 × 5 × 128 × 32000 = <b>8192 counts/kg</b> · one count = 0.122 g`;
        sc.render();
      }
      ui.steps([
        "The stimulus is the mass on the pan: \\( s=m \\). The flour is blue because it is what the world does.",
        "Stage 1, mechanics: the bar is designed so that \\( \\varepsilon = 200\\,\\mu\\varepsilon/\\text{kg}\\times m \\). The blue tint on the bar is the surface strain, largest at the root.",
        "Stage 1b, the foil gauge: \\( \\Delta R/R=\\mathrm{GF}\\,\\varepsilon \\) with \\( \\mathrm{GF}=2 \\), so 400 ppm per kg (A2).",
        "Stage 2, the full bridge: \\( V_{\\text{out}}=V_{\\text{ex}}\\,\\Delta R/R \\) with \\( V_{\\text{ex}}=5 \\) V, so 2 mV per kg.",
        "Stage 3, the amplifier: \\( \\times G=128 \\), so 0.256 V per kg (A7).",
        "Stage 4, the ADC: one step is \\( \\Delta V=V_{\\text{ref}}/2^N=2.048/65536=31.25\\,\\mu \\)V, i.e. 32 000 counts per volt.",
        "Multiply along the chain: \\( S=\\prod_i S_i=2\\times10^{-4}\\cdot2\\cdot5\\cdot128\\cdot32000=8192 \\) counts/kg. The display inverts the line: \\( m=(y-y_0)/S \\).",
      ], (i) => { step = i; sc.render(); });
      upd();
    },
  });

  // ═════════════════ a1-transfer-curve: saturation, tangent, linearisation, hysteresis ═════════════════
  register("a1-transfer-curve", {
    title: "Transfer curve · linearise around an operating point: Δy ≈ S Δs",
    target: "After this you can read offset, sensitivity, range, saturation and hysteresis off a transfer curve, and say when Δy ≈ S Δs is good enough.",
    caption: "a pressure sensor whose output bends over toward saturation. Yellow is the true curve y = f(s), green is the tangent at the operating point (its slope is the local sensitivity S), and red is the error of the straight-line guess. Move the operating point toward 100 kPa: the tangent flattens and the same Δs barely moves y. Turn on hysteresis to see the up and down branches.",
    links: [
      { id: "A2", why: "the bridge output is linear only for small ΔR/R" },
      { id: "A3", why: "C = ε0εrA/g is a curved transfer function in the gap" },
      { id: "A8", why: "calibration fits this curve" },
      { id: "B4", why: "an accelerometer is linearised the same way" },
    ],
    build(fig, ui) {
      const Y0 = 0.5, VS = 4, S0 = 0.08;              // V, V, V/kPa
      const f = (s) => Y0 + VS * Math.tanh((S0 * s) / VS);
      const fp = (s) => S0 * (1 - Math.tanh((S0 * s) / VS) ** 2);
      let sop = 25, ds = 15, hyst = false, stage = 5;
      const ch = chart(ui.body, { xr: [0, 100], yr: [0, 5], xlabel: "stimulus s (kPa)", ylabel: "output y (V)", h: 320 });
      const hArea = ch.area(C.red, 0.18), hUp = ch.line(C.red, 1.4, "4 3"), hDn = ch.line(C.red, 1.4, "4 3");
      const ideal = ch.line(C.green, 1.2, "2 5");
      const curve = ch.line(C.yellow, 3);
      const tan = ch.line(C.green, 2.4);
      const gx = ch.line(C.dim, 1, "3 4"), gy = ch.line(C.dim, 1, "3 4");
      const triS = ch.line(C.blue, 2.6), triY = ch.line(C.green, 2.6), err = ch.line(C.red, 3.5);
      const dOp = ch.dot(C.yellow, 5.5), dTrue = ch.dot(C.yellow, 4.5), dLin = ch.dot(C.green, 4.5);
      const lS = ch.label(C.green, 13), lD = ch.label(C.blue, 12.5, "middle"), lE = ch.label(C.red, 12.5), lOff = ch.label(C.dim, 12), lSat = ch.label(C.dim, 12, "end");
      function draw() {
        const pts = [], up = [], dn = [];
        for (let s = 0; s <= 100.01; s += 1) {
          pts.push([s, f(s)]);
          const h = 0.12 * Math.sin((Math.PI * s) / 100);
          up.push([s, f(s) - h]); dn.push([s, f(s) + h]);
        }
        curve.set(pts);
        ideal.set([[0, Y0], [56, Y0 + S0 * 56]]);
        if (hyst) { hArea.set(up, dn); hUp.set(up); hDn.set(dn); } else { hArea.set([], []); hUp.set([]); hDn.set([]); }
        lOff.set(1.5, Y0 + 0.18, "offset y0 = 0.5 V");
        lSat.set(99, Y0 + VS + 0.18 > 4.9 ? 4.75 : Y0 + VS + 0.18, "saturates at 4.5 V");
        const yop = f(sop), S = fp(sop), s1 = Math.min(100, sop + ds), dy = f(s1) - yop, dyl = S * (s1 - sop);
        const show = (k, on) => (stage >= k ? on() : null);
        [dOp, dTrue, dLin].forEach((d) => d.set(NaN, NaN));
        [gx, gy, tan, triS, triY, err].forEach((l) => l.set([]));
        [lS, lD, lE].forEach((l) => l.set(-10, -10, ""));
        show(1, () => { dOp.set(sop, yop); gx.set([[sop, 0], [sop, yop]]); gy.set([[0, yop], [sop, yop]]); });
        show(2, () => { tan.set([[sop - 30, yop - 30 * S], [sop + 40, yop + 40 * S]]); lS.set(Math.max(2, sop - 22), yop + 0.55, "S = " + fmt(S * 1000, 1) + " mV/kPa"); });
        show(3, () => { triS.set([[sop, yop], [s1, yop]]); triY.set([[s1, yop], [s1, yop + dyl]]); dLin.set(s1, yop + dyl); lD.set((sop + s1) / 2, yop - 0.22, "Δs = " + fmt(s1 - sop, 0)); });
        show(4, () => { dTrue.set(s1, f(s1)); err.set([[s1, f(s1)], [s1, yop + dyl]]); lE.set(Math.min(s1 + 1.5, 80), (f(s1) + yop + dyl) / 2 - 0.25, "error " + fmt((dy - dyl) * 1000, 0) + " mV"); });
        const lin = 100 * (1 - Math.tanh((S0 * sop) / VS) / ((S0 * sop) / VS || 1e-9));
        ui.read.innerHTML =
          `operating point <span style="color:${C.blue}">s = ${fmt(sop, 0)} kPa</span>, <span style="color:${C.yellow}">y = ${fmt(yop, 3)} V</span> · ` +
          `<span style="color:${C.green}">S = ${fmt(S * 1000, 1)} mV/kPa</span> (${fmt((100 * S) / S0, 0)}% of the slope at zero)<br>` +
          `step Δs = ${fmt(s1 - sop, 0)} kPa: true Δy = ${fmt(dy * 1000, 0)} mV, linear S·Δs = ${fmt(dyl * 1000, 0)} mV, ` +
          `<span style="color:${C.red}">error ${fmt((100 * (dy - dyl)) / (dy || 1e-9), 1)}%</span> · curve sits ${fmt(Math.max(0, lin), 1)}% below the ideal line here` +
          (hyst ? `<br><span style="color:${C.red}">hysteresis: up and down branches differ by up to 0.24 V (≈ ${fmt(0.24 / S0, 0)} kPa near zero)</span>` : "");
      }
      ui.slider("operating point", 0, 95, 1, sop, (v) => { sop = v; draw(); return fmt(v, 0) + " kPa"; });
      const dsl = ui.slider("step Δs", 2, 40, 1, ds, (v) => { ds = v; draw(); return fmt(v, 0) + " kPa"; });
      const opSl = ui.ctl.querySelector("input");
      const hb = ui.button("hysteresis: off", () => { hyst = !hyst; hb.textContent = "hysteresis: " + (hyst ? "on" : "off"); draw(); });
      ui.steps([
        "The transfer function \\( y=f(s) \\): offset \\( y_0 \\) at \\( s=0 \\), nearly straight at first, then saturating.",
        "Choose an operating point \\( s_{\\text{op}} \\); the sensor sits at \\( y_{\\text{op}}=f(s_{\\text{op}}) \\).",
        "Its slope is the local sensitivity \\( S=f'(s_{\\text{op}}) \\): the green tangent.",
        "A small step: \\( \\Delta y\\approx S\\,\\Delta s \\) (blue run, green rise).",
        "The true curve misses the tangent by \\( \\approx\\tfrac12 f''(s_{\\text{op}})\\,\\Delta s^2 \\) (red). Halve \\( \\Delta s \\) and the error drops fourfold.",
        "Near saturation \\( S\\to0 \\): the operating point has jumped to 80 kPa and the same step barely moves \\( y \\). Range ends where \\( S \\) collapses.",
      ], (i) => {
        stage = i;
        if (i === 5 && sop < 80) { sop = 80; opSl.value = 80; opSl.dispatchEvent(new Event("input")); }
        draw();
      });
      dsl.refresh();
    },
  });

  // ═════════════════ a1-step-response: the first-order lag of a thermometer ═════════════════
  register("a1-step-response", {
    title: "Step response · a thermometer is a first-order lag: τ ẏ + y = K s",
    target: "After this you can predict what a lagging sensor reads at any moment after a step, and how long to wait for a given accuracy.",
    caption: "at t = 0 the probe goes from 22 °C air into a 37 °C mouth (blue step). The reading (yellow) creeps up; the green tangent at t = 0 reaches the final value exactly at t = τ. Drag the read-out time: the red bar is the error you would report if you read the thermometer then.",
    links: [
      { id: "A2", why: "a thermistor bead has its own thermal τ and self-heating" },
      { id: "A7", why: "the RC low-pass filter obeys the same equation" },
      { id: "A6", why: "electrodes also settle exponentially" },
      { id: "C3", why: "diffusion to a sensor surface sets τ in biosensors" },
    ],
    build(fig, ui) {
      let tau = 10, tr = 10;
      const T0 = 22, TF = 37;
      const ch = chart(ui.body, { xr: [-5, 60], yr: [20, 40], xlabel: "time t (s)", ylabel: "temperature (°C)", h: 300 });
      const stim = ch.line(C.blue, 2.5), resp = ch.line(C.yellow, 3), tan = ch.line(C.green, 1.8, "6 4");
      const marks = [1, 3, 5].map(() => ch.vline(C.dim, "2 4")), mlabs = [1, 3, 5].map(() => ch.label(C.dim, 11.5, "middle"));
      const rv = ch.vline(C.text, "4 3"), e = ch.line(C.red, 4), d = ch.dot(C.yellow, 5.5), le = ch.label(C.red, 13);
      const y = (t) => (t < 0 ? T0 : TF + (T0 - TF) * Math.exp(-t / tau));
      function draw() {
        stim.set([[-5, T0], [0, T0], [0, TF], [60, TF]]);
        const pts = []; for (let t = -5; t <= 60; t += 0.25) pts.push([t, y(t)]); resp.set(pts);
        tan.set([[0, T0], [tau, TF]]);
        [1, 3, 5].forEach((k, i) => { marks[i].set(k * tau); mlabs[i].set(k * tau, 21, (k === 1 ? "" : k) + "τ"); });
        rv.set(tr); d.set(tr, y(tr)); e.set([[tr, y(tr)], [tr, TF]]);
        le.set(Math.min(tr + 1, 48), TF - 1.3, "e = " + fmt(y(tr) - TF, 2) + " °C");
        const t01 = tau * Math.log((TF - T0) / 0.1);
        ui.read.innerHTML =
          `τ = ${fmt(tau, 1)} s · read at t = ${fmt(tr, 1)} s → <span style="color:${C.yellow}">${fmt(y(tr), 2)} °C</span>, ` +
          `<span style="color:${C.red}">e = ${fmt(y(tr) - TF, 2)} °C</span> (${fmt(100 * (1 - Math.exp(-tr / tau)), 1)}% of the jump)<br>` +
          `initial slope ${fmt((TF - T0) / tau, 2)} °C/s · within 0.1 °C after τ·ln(150) = ${fmt(t01, 1)} s`;
      }
      ui.slider("time constant τ", 2, 20, 0.5, tau, (v) => { tau = v; draw(); return fmt(v, 1) + " s"; });
      ui.slider("read at t", 0, 60, 0.5, tr, (v) => { tr = v; draw(); return fmt(v, 1) + " s"; });
    },
  });
})();

</script>
<script>
/* ── A2.js ── */
/* A2 — resistive sensors and the Wheatstone bridge: widgets for docs/A2-resistive-sensors-and-the-wheatstone-bridge.md */
(function () {
  "use strict";
  const { register, C, scene3d, chart, fmt, mix, ramp, S, H } = VIZ;

  // ═════════════════ a2-strain-gauge-3d: a bending beam with a foil gauge ═════════════════
  register("a2-strain-gauge-3d", {
    title: "3D · a foil strain gauge on a bending steel beam: ΔR/R = GF · ε",
    target: "After this you can compute the strain under a gauge on a loaded beam and the resulting ΔR, and explain where the gauge factor of ≈ 2 comes from.",
    caption: "a steel beam (20 mm wide, 2 mm thick, drawn 2.5× thicker; bending exaggerated) is clamped on the left and pushed down at the tip (purple). The surface colour is the strain magnitude (dark = none, yellow = most): largest at the root, zero at the tip. The teal serpentine on top is the gauge; the dim one underneath is squeezed by the same amount, which a half bridge uses. Slide the gauge toward the tip and watch ΔR fall.",
    links: [
      { id: "A1", why: "this is stage 1 of the kitchen-scale chain" },
      { id: "B3", why: "the beam formula σ = 6Fx/(wt²) is derived there" },
      { id: "A4", why: "silicon piezoresistors have GF ≈ 100 instead of 2" },
      { id: "B5", why: "pressure-sensor membranes carry the same gauges" },
    ],
    build(fig, ui) {
      const E = 200e9, W = 0.02, T = 0.002, LB = 0.12, R0 = 120, GF = 2, NU = 0.3;
      const U = 0.02;                         // 1 scene unit = 20 mm
      let F = 10, xg = 0.020, step = 3;        // load (N), gauge centre from the root (m)
      const L = LB / U, hw = W / U / 2, th = 0.25;
      const strain = (xr) => (6 * F * Math.max(0, LB - xr)) / (W * T * T * E);   // xr = distance from root (m)
      const defl = (u) => { const I = (W * T ** 3) / 12, d = (F * LB ** 3) / (3 * E * I); return -(d * 18 / U) * u * u * (3 - u) / 2; };
      const sc = scene3d(ui.body, {
        w: 640, h: 290, scale: 76, yaw: 0.5, pitch: 0.5, center: [2.55, 0, -0.15],
        draw(g) {
          const n = 22, xray = step === 5 ? 0.35 : 1;
          const zt = (xr) => defl(xr / L);                       // xr in scene units here
          const col = (xs) => ramp(Math.min(1, strain(xs * U) / 9.4e-4));
          // clamp
          g.box([-0.6, -hw - 0.3, -0.8], [0, hw + 0.3, 0.45], C.silicon);
          for (let i = 0; i < n; i++) {
            const xa = (L * i) / n, xb = (L * (i + 1)) / n, za = zt(xa), zb = zt(xb), cm = col((xa + xb) / 2);
            g.poly([[xa, -hw, za + th / 2], [xb, -hw, zb + th / 2], [xb, hw, zb + th / 2], [xa, hw, za + th / 2]], cm, { bias: -0.01, alpha: xray });
            g.poly([[xa, -hw, za - th / 2], [xb, -hw, zb - th / 2], [xb, hw, zb - th / 2], [xa, hw, za - th / 2]], cm, { alpha: xray });
            g.poly([[xa, -hw, za - th / 2], [xb, -hw, zb - th / 2], [xb, -hw, zb + th / 2], [xa, -hw, za + th / 2]], mix(C.silicon, cm, 0.35), { alpha: xray });
            g.poly([[xa, hw, za - th / 2], [xb, hw, zb - th / 2], [xb, hw, zb + th / 2], [xa, hw, za + th / 2]], mix(C.silicon, cm, 0.35), { alpha: xray });
          }
          g.poly([[L, -hw, zt(L) - th / 2], [L, hw, zt(L) - th / 2], [L, hw, zt(L) + th / 2], [L, -hw, zt(L) + th / 2]], C.silicon);
          // gauges (top and bottom): serpentine of 8 strands along x
          const gc = xg / U, gl = 0.8, gw = 0.7, strands = 10, sScale = step === 1 ? 1 + 0.12 * Math.sign(F) : 1, nScale = step === 2 ? 0.75 : 1;
          function gauge(sign, colr, wdt) {
            const pts = [];
            for (let k = 0; k < strands; k++) {
              const yy = (-gw / 2 + (gw * k) / (strands - 1)) * nScale;
              const xa = gc - (gl / 2) * sScale, xb = gc + (gl / 2) * sScale;
              const a = [xa, yy, zt(xa) + sign * (th / 2 + 0.015)], b = [xb, yy, zt(xb) + sign * (th / 2 + 0.015)];
              if (k % 2 === 0) pts.push(a, b); else pts.push(b, a);
            }
            g.polyline(pts, colr, wdt);
            // backing film
            const xa = gc - gl / 2 - 0.12, xb = gc + gl / 2 + 0.12, yo = gw / 2 + 0.12;
            g.poly([[xa, -yo, zt(xa) + sign * (th / 2 + 0.008)], [xb, -yo, zt(xb) + sign * (th / 2 + 0.008)], [xb, yo, zt(xb) + sign * (th / 2 + 0.008)], [xa, yo, zt(xa) + sign * (th / 2 + 0.008)]],
              "#3a2f1a", { alpha: 0.75, bias: 0.01 });
          }
          gauge(1, C.teal, 2.4);
          gauge(-1, step === 5 ? C.teal : mix(C.teal, C.bg, 0.55), step === 5 ? 2.4 : 1.5);
          // load
          g.arrow([L - 0.15, 0, zt(L) + 1.5], [L - 0.15, 0, zt(L) + th / 2 + 0.05], C.purple, 3.5);
          g.text([L - 0.15, 0, zt(L) + 1.72], "F = " + fmt(F, 1) + " N", C.purple, 14);
          const zg = zt(gc) + th / 2;
          if (step === 1) {
            g.arrow([gc + 0.2, 0, zg + 0.35], [gc + 0.75, 0, zg + 0.35], C.blue, 2.6);
            g.arrow([gc - 0.2, 0, zg + 0.35], [gc - 0.75, 0, zg + 0.35], C.blue, 2.6);
            g.text([gc, 0, zg + 0.62], "L → L(1+ε)", C.blue, 13);
          }
          if (step === 2) {
            g.arrow([gc, -hw - 0.6, zg + 0.05], [gc, -gw / 2 - 0.05, zg + 0.05], C.blue, 2.6);
            g.arrow([gc, hw + 0.6, zg + 0.05], [gc, gw / 2 + 0.05, zg + 0.05], C.blue, 2.6);
            g.text([gc, -hw - 0.9, zg + 0.1], "w, t → (1−ν ε)", C.blue, 13);
          }
          if (step === 3 || step === 0) g.text([gc, 0, zg + 0.75], "ΔR = " + fmt(R0 * GF * strain(xg) * 1000, 1) + " mΩ", C.yellow, 14);
          if (step === 4) {
            const zl = Math.max(zg, zt(L) + th / 2) + 1.05;
            g.line([gc, 0, zl], [L - 0.15, 0, zl], C.purple, 1.6, [5, 4]);
            g.line([gc, 0, zg], [gc, 0, zl + 0.1], C.purple, 1, [3, 3]);
            g.text([(gc + L) / 2, 0, zl + 0.25], "x = " + fmt((LB - xg) * 1000, 0) + " mm", C.purple, 13);
            g.text([gc, 0, zg + 0.5], "ε = " + fmt(strain(xg) * 1e6, 0) + " µε", C.blue, 14);
          }
          if (step === 5) g.text([gc + 1.6, 0, zt(gc) - th / 2 - 0.35], "bottom: −" + fmt(strain(xg) * 1e6, 0) + " µε", C.teal, 13);
          g.text([-0.3, 0, 0.75], "clamp", C.dim, 12);
        },
      });
      function upd() {
        const e = strain(xg), dRR = GF * e;
        ui.read.innerHTML =
          `gauge ${fmt(xg * 1000, 0)} mm from the clamp, x = ${fmt((LB - xg) * 1000, 0)} mm from the load · ` +
          `<span style="color:${C.blue}">σ = ${fmt((E * e) / 1e6, 1)} MPa, ε = ${fmt(e * 1e6, 0)} µε</span><br>` +
          `ΔR/R = GF·ε = ${fmt(dRR * 1e6, 0)} ppm · <span style="color:${C.teal}">ΔR = ${fmt(R0 * dRR * 1000, 1)} mΩ on 120 Ω</span> · ` +
          `<span style="color:${C.yellow}">5 V bridge: quarter ${fmt(1.25 * dRR * 1000, 3)} mV · half ${fmt(2.5 * dRR * 1000, 3)} mV · full ${fmt(5 * dRR * 1000, 3)} mV</span>`;
        sc.render();
      }
      ui.slider("load F", 0, 20, 0.5, F, (v) => { F = v; upd(); return fmt(v, 1) + " N"; });
      ui.slider("gauge position", 10, 100, 2, xg * 1000, (v) => { xg = v / 1000; upd(); return fmt(v, 0) + " mm"; });
      ui.steps([
        "A conductor's resistance: \\( R=\\rho L/A \\). The foil folds a 24.5 mm track into 8–12 strands so that \\( R=120\\,\\Omega \\).",
        "Stretch: every strand gets longer, \\( L\\to L(1+\\varepsilon) \\), so \\( R \\) rises by \\( \\varepsilon \\) (arrows exaggerated).",
        "…and thinner: width and thickness shrink by \\( (1-\\nu_P\\varepsilon) \\), so \\( A\\to A(1-2\\nu_P\\varepsilon) \\) and \\( R \\) rises by another \\( 2\\nu_P\\varepsilon \\).",
        "Add the resistivity change: \\( \\Delta R/R=(1+2\\nu_P)\\varepsilon+\\Delta\\rho/\\rho=\\mathrm{GF}\\,\\varepsilon \\), with \\( 1+2(0.3)=1.6 \\) from shape and \\( \\mathrm{GF}\\approx2 \\) in total.",
        "Where does \\( \\varepsilon \\) come from? Moment \\( M=Fx \\), surface stress \\( \\sigma=6Fx/(wt^2) \\), strain \\( \\varepsilon=\\sigma/E \\): 375 µε for 10 N at \\( x=100 \\) mm.",
        "The beam turns see-through: the bottom surface is squeezed by exactly \\( -\\varepsilon \\). A second gauge there gives \\( -\\Delta R \\): put both in one divider for a half bridge (next figure).",
      ], (i) => {
        step = i;
        sc.render();
      });
      upd();
    },
  });

  // ═════════════════ a2-bridge: live Wheatstone bridge, quarter / half / full ═════════════════
  register("a2-bridge", {
    title: "Live circuit · the Wheatstone bridge: two dividers, one difference",
    target: "After this you can derive V_out of a bridge from two voltage dividers, and explain why half and full bridges give more signal, perfect linearity and temperature cancellation.",
    caption: "four resistors between +V_ex (top) and ground (bottom). Each side is a voltage divider; the meter in the middle reads the difference V_out = V_A − V_B (yellow). Active gauges are blue with ↑ (stretched, +ΔR) or ↓ (squeezed, −ΔR). The small chart shows V_out against ΔR/R: yellow is exact, dashed green is the small-signal line. Push ΔR/R to ±30% (a thermistor, not a strain gauge) in quarter mode to see the curve bend; switch on temperature drift to see what cancels.",
    links: [
      { id: "A1", why: "linearising V_out ≈ (V_ex/4)·ΔR/R is a first-order Taylor step" },
      { id: "A3", why: "the differential capacitor is the same divide-to-compare idea" },
      { id: "A7", why: "an instrumentation amplifier reads the bridge's millivolts" },
      { id: "C2", why: "the same divider rules hold for pressure in fluid channels" },
    ],
    build(fig, ui) {
      let mode = 1, x = 0.00075, vex = 5, theta = 0, step = -1;      // mode: 1 quarter, 2 half, 4 full
      const wrap = H("div", { style: "display:flex;gap:6px;align-items:center" }, ui.body);
      const left = H("div", { style: "flex:1.45;min-width:0" }, wrap), right = H("div", { style: "flex:1;min-width:0" }, wrap);
      const Wd = 470, Hd = 330;
      const svg = S("svg", { viewBox: `0 0 ${Wd} ${Hd}`, role: "img", "aria-label": "Wheatstone bridge circuit" }, left);
      const P = { T: [265, 40], A: [160, 165], B: [370, 165], G: [265, 290] };
      const gWire = S("g", {}, svg), gHi = S("g", {}, svg), gRes = S("g", {}, svg), gTxt = S("g", {}, svg);
      const txt = (x0, y0, s, col, size, anc) => { const e = S("text", { x: x0, y: y0, fill: col || C.text, "font-size": size || 13, "text-anchor": anc || "middle", "dominant-baseline": "middle", "font-family": "var(--font-mono, ui-monospace, monospace)", "paint-order": "stroke", stroke: C.bg, "stroke-width": 4 }, gTxt); e.textContent = s; return e; };
      // supply wires: +V_ex from a battery on the far left
      S("path", { d: `M${P.T[0]},${P.T[1]} L${P.T[0]},18 L28,18 L28,140`, fill: "none", stroke: C.teal, "stroke-width": 2 }, gWire);
      S("path", { d: `M28,190 L28,312 L${P.G[0]},312 L${P.G[0]},${P.G[1]}`, fill: "none", stroke: C.teal, "stroke-width": 2 }, gWire);
      S("line", { x1: 14, y1: 150, x2: 42, y2: 150, stroke: C.teal, "stroke-width": 3 }, gWire);
      S("line", { x1: 20, y1: 162, x2: 36, y2: 162, stroke: C.teal, "stroke-width": 3 }, gWire);
      S("line", { x1: 14, y1: 174, x2: 42, y2: 174, stroke: C.teal, "stroke-width": 3 }, gWire);
      S("line", { x1: 20, y1: 186, x2: 36, y2: 186, stroke: C.teal, "stroke-width": 3 }, gWire);
      const tVex = txt(58, 163, "", C.teal, 12.5, "start");
      // meter between A and B
      S("path", { d: `M${P.A[0]},${P.A[1]} L233,${P.A[1]}`, stroke: C.yellow, "stroke-width": 1.6, fill: "none" }, gWire);
      S("path", { d: `M297,${P.B[1]} L${P.B[0]},${P.B[1]}`, stroke: C.yellow, "stroke-width": 1.6, fill: "none" }, gWire);
      const meter = S("circle", { cx: 265, cy: 165, r: 32, fill: "#1a1f14", stroke: C.yellow, "stroke-width": 2 }, gWire);
      txt(265, 152, "V_out", C.dim, 11);
      const tOut = txt(265, 172, "", C.yellow, 13.5);
      // resistors on the four edges
      const edges = [["R1", P.T, P.A], ["R2", P.A, P.G], ["R3", P.T, P.B], ["R4", P.B, P.G]];
      const resEls = edges.map(([name, a, b]) => {
        const path = S("path", { fill: "none", "stroke-width": 2.6, "stroke-linejoin": "round" }, gRes);
        const dx = b[0] - a[0], dy = b[1] - a[1], Lr = Math.hypot(dx, dy), ux = dx / Lr, uy = dy / Lr, nx = -uy, ny = ux;
        let d = `M${a[0]},${a[1]}`;
        for (let k = 0; k <= 12; k++) {
          const f = 0.25 + (0.5 * k) / 12, off = k === 0 || k === 12 ? 0 : (k % 2 ? 9 : -9);
          d += ` L${a[0] + dx * f + nx * off},${a[1] + dy * f + ny * off}`;
        }
        d += ` L${b[0]},${b[1]}`;
        path.setAttribute("d", d);
        const side = name === "R1" || name === "R2" ? -1 : 1;
        const lx = (a[0] + b[0]) / 2 + side * 52, ly = (a[1] + b[1]) / 2 + (name === "R1" || name === "R3" ? -10 : 10);
        return { path, lab: txt(lx, ly, "", C.text, 12.5), arr: txt(lx, ly + 16, "", C.blue, 12.5) };
      });
      const nodeA = txt(P.A[0] - 8, P.A[1] - 14, "", C.text, 12.5, "end"), nodeB = txt(P.B[0] + 8, P.B[1] - 14, "", C.text, 12.5, "start");
      [P.T, P.A, P.B, P.G].forEach((p) => S("circle", { cx: p[0], cy: p[1], r: 4.5, fill: C.teal }, gTxt));
      txt(P.T[0] + 26, P.T[1] - 4, "+V_ex", C.teal, 12);
      txt(P.G[0] + 22, P.G[1] + 10, "0 V", C.teal, 12);
      const hiL = S("path", { d: `M${P.T[0]},${P.T[1]} L${P.A[0]},${P.A[1]} L${P.G[0]},${P.G[1]}`, fill: "none", stroke: C.yellow, "stroke-width": 12, opacity: 0, "stroke-linejoin": "round" }, gHi);
      const hiR = S("path", { d: `M${P.T[0]},${P.T[1]} L${P.B[0]},${P.B[1]} L${P.G[0]},${P.G[1]}`, fill: "none", stroke: C.yellow, "stroke-width": 12, opacity: 0, "stroke-linejoin": "round" }, gHi);
      // the mini chart: V_out vs ΔR/R
      let ch, lnApprox, lnExact, dNow, chMode = 0;
      function makeChart() {
        right.innerHTML = "";
        const yl = (mode * 300) / 4 * 1.15;
        ch = chart(right, { w: 300, h: 330, xr: [-30, 30], yr: [-yl, yl], xlabel: "ΔR/R (%)", ylabel: "V_out / V_ex (mV/V)", ml: 50, mb: 38 });
        lnApprox = ch.line(C.green, 1.6, "5 4"); lnExact = ch.line(C.yellow, 2.6); dNow = ch.dot(C.yellow, 5); chMode = mode;
      }
      const resist = () => {
        const a = theta, R = [1 + a, 1 + a, 1, 1];          // R1..R4 relative, drift θ only on active arms (set below)
        R[0] = 1; R[1] = 1; R[2] = 1; R[3] = 1;
        if (mode >= 1) R[1] = 1 + x + theta;
        if (mode >= 2) R[0] = 1 - x + theta;
        if (mode >= 4) { R[2] = 1 + x + theta; R[3] = 1 - x + theta; }
        return R;
      };
      const vout = (xx, th) => {
        const R = [1, 1 + xx + th, 1, 1];
        if (mode >= 2) R[0] = 1 - xx + th;
        if (mode >= 4) { R[2] = 1 + xx + th; R[3] = 1 - xx + th; }
        return R[1] / (R[0] + R[1]) - R[3] / (R[2] + R[3]);
      };
      function draw() {
        const R = resist(), active = [mode >= 2, true, mode >= 4, mode >= 4], sign = [-1, 1, 1, -1];
        resEls.forEach((r, i) => {
          r.path.setAttribute("stroke", active[i] ? C.blue : C.teal);
          r.lab.textContent = `R${i + 1} = ${fmt(120 * R[i], 3)} Ω`;
          r.arr.textContent = active[i] ? (sign[i] > 0 ? "↑ +ΔR" : "↓ −ΔR") : "";
        });
        const VA = (vex * R[1]) / (R[0] + R[1]), VB = (vex * R[3]) / (R[2] + R[3]), vo = VA - VB;
        nodeA.textContent = "V_A " + VA.toFixed(4);
        nodeB.textContent = "V_B " + VB.toFixed(4);
        tVex.textContent = "V_ex = " + fmt(vex, 1) + " V";
        tOut.textContent = (Math.abs(vo) < 0.1 ? fmt(vo * 1000, 3) + " mV" : fmt(vo, 3) + " V");
        hiL.setAttribute("opacity", step === 0 ? 0.22 : 0);
        hiR.setAttribute("opacity", step === 1 ? 0.22 : 0);
        meter.setAttribute("stroke-width", step === 2 ? 4 : 2);
        const approx = (mode * x) / 4, ex = vout(x, theta);
        const ptsA = [], ptsE = [];
        if (chMode !== mode) makeChart();
        for (let p = -30; p <= 30.001; p += 0.5) { ptsA.push([p, (mode * p) * 2.5]); ptsE.push([p, 1000 * vout(p / 100, theta)]); }
        lnApprox.set(ptsA); lnExact.set(ptsE); dNow.set(x * 100, 1000 * ex);
        const name = { 1: "quarter", 2: "half", 4: "full" }[mode];
        ui.read.innerHTML =
          `<b>${name} bridge</b> · ΔR/R = ${fmt(x * 1e6, 0)} ppm (${fmt(x * 100, 3)}%)` + (theta ? ` · <span style="color:${C.red}">drift θ = +${fmt(theta * 1e6, 0)} ppm in every active arm</span>` : "") + `<br>` +
          `V_A − V_B = <span style="color:${C.yellow}">${fmt(ex * vex * 1000, 4)} mV exact</span> · small-signal ${mode === 1 ? "V_ex·x/4" : mode === 2 ? "V_ex·x/2" : "V_ex·x"} = ` +
          `<span style="color:${C.green}">${fmt(approx * vex * 1000, 4)} mV</span> · nonlinearity ${fmt(x ? (100 * (approx - ex)) / approx : 0, 3)}%`;
      }
      const bar = H("span", {}, ui.ctl);
      const mb = [[1, "quarter"], [2, "half"], [4, "full"]].map(([m, lab]) => {
        const b = H("button", { type: "button" }, bar, lab);
        b.style.marginRight = "4px";
        b.addEventListener("click", () => { mode = m; mark(); draw(); });
        return [m, b];
      });
      const mark = () => mb.forEach(([m, b]) => (b.style.borderColor = m === mode ? C.yellow : ""));
      const xs = ui.slider("ΔR/R", -30, 30, 0.025, x * 100, (v) => { x = v / 100; draw(); return fmt(v, 3) + " %"; });
      ui.slider("V_ex", 1, 10, 0.5, vex, (v) => { vex = v; draw(); return fmt(v, 1) + " V"; });
      const tb = ui.button("temperature drift: off", () => { theta = theta ? 0 : 100e-6; tb.textContent = "temperature drift: " + (theta ? "on" : "off"); draw(); });
      const setMode = (m) => { mode = m; mark(); };
      ui.steps([
        "Left divider: the same current flows through \\( R_1 \\) and \\( R_2 \\), so \\( V_A=V_{\\text{ex}}\\,\\dfrac{R_2}{R_1+R_2} \\).",
        "Right divider: \\( V_B=V_{\\text{ex}}\\,\\dfrac{R_4}{R_3+R_4} \\).",
        "The meter reads the difference \\( V_{\\text{out}}=V_A-V_B \\). It is zero when \\( R_1/R_2=R_3/R_4 \\), for any \\( V_{\\text{ex}} \\): a perfect null to compare against.",
        "Quarter bridge, \\( R_2=R(1+x) \\): \\( V_{\\text{out}}=V_{\\text{ex}}\\Big(\\dfrac{1+x}{2+x}-\\dfrac12\\Big)=V_{\\text{ex}}\\dfrac{x}{2(2+x)}\\approx\\dfrac{V_{\\text{ex}}}{4}x \\).",
        "Half bridge, \\( R_1=R(1-x) \\), \\( R_2=R(1+x) \\): \\( V_A=V_{\\text{ex}}(1+x)/2 \\), so \\( V_{\\text{out}}=\\dfrac{V_{\\text{ex}}}{2}x \\) exactly: twice the signal and a straight line.",
        "Full bridge, also \\( R_3=R(1+x) \\), \\( R_4=R(1-x) \\): \\( V_{\\text{out}}=V_{\\text{ex}}\\,x \\) exactly, four times the quarter bridge.",
        "Temperature: add the same \\( \\theta \\) to every active arm. Full: \\( V_{\\text{out}}=V_{\\text{ex}}\\,x/(1+\\theta) \\), no offset. Switch to quarter to see the drift appear as a fake signal.",
      ], (i) => {
        step = i;
        if (i === 3) setMode(1);
        if (i === 4) setMode(2);
        if (i === 5) setMode(4);
        if (i === 6) { setMode(4); theta = 100e-6; tb.textContent = "temperature drift: on"; }
        if (i < 6 && theta) { theta = 0; tb.textContent = "temperature drift: off"; }
        if (i >= 3 && Math.abs(x) > 0.02) { xs.set(0.075); }
        draw();
      });
      mark();
      draw();
    },
  });

  // ═════════════════ a2-rt-curves: platinum RTD vs NTC thermistor, and self-heating ═════════════════
  register("a2-rt-curves", {
    title: "R(T) · platinum RTD vs NTC thermistor, and the cost of reading them",
    target: "After this you can compare the sensitivity of an RTD and a thermistor at any temperature, and estimate the self-heating error of the measuring current.",
    caption: "resistance relative to its 25 °C value, on a log scale. The platinum Pt100 (gold, dashed) is an almost flat straight line: +0.385 Ω per K. The 10 kΩ NTC (gold, solid) falls by a factor of ~10 over 80 K; β sets how steep. The green tangent is the local coefficient (1/R)dR/dT. Raise the divider voltage: the thermistor heats itself (red) by P/δ.",
    links: [
      { id: "A1", why: "the bead's thermal lag is the first-order τ" },
      { id: "A7", why: "the divider voltage then goes to an ADC" },
      { id: "A8", why: "self-heating is a bias; calibration can only partly remove it" },
    ],
    build(fig, ui) {
      let beta = 3950, Top = 25, vex = 3.3;
      const T0 = 298.15, DELTA = 2e-3;
      const ntc = (Tc) => Math.exp(beta * (1 / (Tc + 273.15) - 1 / T0));
      const pt = (Tc) => (1 + 0.00385 * Tc) / (1 + 0.00385 * 25);
      const ch = chart(ui.body, { xr: [-20, 100], yr: [0.1, 10], logy: true, xlabel: "temperature T (°C)", ylabel: "R / R(25 °C)", h: 300 });
      const lPt = ch.line(C.gold, 2.4, "7 4"), lN = ch.line(C.gold, 3), tan = ch.line(C.green, 2), dN = ch.dot(C.gold, 5.5), dS = ch.dot(C.red, 5), vl = ch.vline(C.dim);
      const labN = ch.label(C.gold, 12.5), labP = ch.label(C.gold, 12.5);
      function draw() {
        const a = [], b = [];
        for (let T = -20; T <= 100.01; T += 1) { a.push([T, pt(T)]); b.push([T, ntc(T)]); }
        lPt.set(a); lN.set(b);
        labN.set(-17, Math.min(9, ntc(-17)) * 0.8, "NTC 10 kΩ, β = " + beta);
        labP.set(62, 1.6, "Pt100");
        const Rn = 10e3 * ntc(Top), alphaN = -beta / (Top + 273.15) ** 2;
        const t1 = Top - 15, t2 = Top + 15;
        tan.set([[t1, ntc(Top) * Math.exp(alphaN * (t1 - Top))], [t2, ntc(Top) * Math.exp(alphaN * (t2 - Top))]]);
        dN.set(Top, ntc(Top)); vl.set(Top);
        const I = vex / (Rn + 10e3), P = I * I * Rn, dT = P / DELTA;
        dS.set(Top + dT * 10, ntc(Top + dT));
        const sens = (vex * 10e3 * Rn) / (Rn + 10e3) ** 2 * Math.abs(alphaN);
        ui.read.innerHTML =
          `T = ${fmt(Top, 0)} °C · <span style="color:${C.gold}">NTC ${fmt(Rn, 0)} Ω, (1/R)dR/dT = ${fmt(alphaN * 100, 2)} %/K</span> · ` +
          `<span style="color:${C.gold}">Pt100 ${fmt(100 * (1 + 0.00385 * Top), 2)} Ω, +${fmt((100 * 0.00385) / (1 + 0.00385 * Top), 3)} %/K</span> → NTC is ${fmt(Math.abs(alphaN) / (0.00385 / (1 + 0.00385 * Top)), 1)}× steeper<br>` +
          `10 kΩ divider at ${fmt(vex, 1)} V: <span style="color:${C.yellow}">${fmt(sens * 1000, 1)} mV/K</span> · bead current ${fmt(I * 1000, 3)} mA, P = ${fmt(P * 1000, 3)} mW → ` +
          `<span style="color:${C.red}">self-heating ${fmt(dT * 1000, 0)} mK</span> (δ = 2 mW/K; red dot shows it ×10)`;
      }
      ui.slider("β", 3000, 4500, 50, beta, (v) => { beta = v; draw(); return v + " K"; });
      ui.slider("temperature", -10, 90, 1, Top, (v) => { Top = v; draw(); return v + " °C"; });
      ui.slider("divider V_ex", 0.5, 5, 0.1, vex, (v) => { vex = v; draw(); return fmt(v, 1) + " V"; });
    },
  });
})();

</script>
<script>
/* ── A3.js ── */
/* A3 — capacitive sensors: widgets for docs/A3-capacitive-sensors.md */
(function () {
  "use strict";
  const { register, C, scene3d, chart, fmt, mix, ramp } = VIZ;
  const E0 = 8.854e-12;

  // ═════════════════ a3-plates-3d: gap, area, dielectric, differential, fringe ═════════════════
  register("a3-plates-3d", {
    title: "3D · the parallel-plate capacitor: C = ε0 εr A / g, and the differential sandwich",
    target: "After this you can say how C changes when you move, slide or fill a capacitor, why gap sensing is nonlinear, and why (C1 − C2)/(C1 + C2) = x/g0 is exactly linear.",
    caption: "two 1 mm × 1 mm plates (grey); the gap is drawn hugely magnified. Teal lines are the field from + to −; the curved ones at the edges are the fringe field. Slide the top plate sideways to change the overlap area, fill the gap with a dielectric (blue), or switch to the differential sandwich and move the middle plate: one gap shrinks, the other grows, and the ratio stays a straight line.",
    links: [
      { id: "A2", why: "the differential capacitor is the Wheatstone bridge's divide-to-compare idea" },
      { id: "B4", why: "every MEMS accelerometer is this sandwich on a spring" },
      { id: "B5", why: "a microphone membrane is a moving plate" },
      { id: "A1", why: "C ≈ C0(1 + x/g0) is linearising around x = 0" },
    ],
    build(fig, ui) {
      let g0 = 2, ov = 1, er = 1, x = 0.2, diff = false, step = -1;   // g0 in µm, ov overlap fraction, x in µm
      const SIDE = 3, ZS = 0.42, PT = 0.07;                           // drawn plate side, z-units per µm, plate thickness
      const cap = (gum, area) => (E0 * er * area * 1e-6) / (gum * 1e-6) * 1e12;   // pF, area in mm²
      const sc = scene3d(ui.body, {
        w: 640, h: 330, scale: 66, yaw: -0.62, pitch: 0.38, center: [0.2, 0, 0.34],
        draw(g) {
          const h = SIDE / 2, shift = (1 - ov) * SIDE;
          const plate = (z, dx, col, lab, op) => {
            g.box([-h + dx, -h, z - PT], [h + dx, h, z], col, op);
            if (lab) g.text([h + dx + 0.3, h, z], lab, C.text, 15, "start");
          };
          const fieldBright = step === 1 ? 1 : 0.75;
          const drawGap = (zb, zt, sign, fr) => {
            // dielectric fill
            if (er > 1.01) {
              const a = Math.min(0.55, 0.12 + 0.1 * Math.log(er));
              g.box([-h + shift, -h, zb + 0.005], [h, h, zt - 0.005], C.blue, { alpha: a, shade: false });
            }
            // straight field lines in the overlap
            const n = 5;
            for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
              const xx = -h + shift + ((i + 0.5) * (SIDE - shift)) / n, yy = -h + ((j + 0.5) * SIDE) / n;
              const a = [xx, yy, sign > 0 ? zt - PT * 0 : zb], b = [xx, yy, sign > 0 ? zb : zt];
              g.line(a, b, mix(C.teal, C.bg, 1 - fieldBright), step === 1 ? 2 : 1.4);
            }
            // fringe arcs at the four edges (bulge grows with the gap)
            const bul = (zt - zb) * 0.55 + 0.06, fc = step === 6 ? C.teal : mix(C.teal, C.bg, 0.55), fw = step === 6 ? 2.2 : 1.2;
            for (let k = 0; k < 3; k++) {
              const t = -h + ((k + 0.5) * SIDE) / 3;
              const arc = (p0, out) => { const pts = []; for (let s = 0; s <= 10; s++) { const u = s / 10, z = zb + (zt - zb) * u, o = Math.sin(Math.PI * u) * bul * fr; pts.push([p0[0] + out[0] * o, p0[1] + out[1] * o, z]); } g.polyline(pts, fc, fw); };
              arc([h, t], [1, 0]); arc([-h + shift, t], [-1, 0]);
              arc([(shift + SIDE) / 2 - h + ((k - 1) * (SIDE - shift)) / 3.2, -h], [0, -1]);
              arc([(shift + SIDE) / 2 - h + ((k - 1) * (SIDE - shift)) / 3.2, h], [0, 1]);
            }
          };
          if (!diff) {
            const gd = g0 * ZS;
            plate(0, 0, C.silicon, "−q");
            plate(gd + PT, shift, mix(C.silicon, C.white, 0.15), "+q", { alpha: 0.7, bias: 50 });
            drawGap(0, gd, 1, 1);
            if (step === 1) g.text([-h - 0.4, 0, gd / 2], "𝓔 = q/(ε0 εr A)", C.teal, 13, "end");
            if (step === 6) {
              const d = g0 * 1e-3, a = Math.sqrt(ov), f = 1 + (d / (Math.PI * a)) * (1 + Math.log((2 * Math.PI * a) / d));
              g.text([-h - 0.75, 0, gd / 2], "fringe: +" + fmt((f * f - 1) * 100, 2) + " % at g = " + fmt(g0, 2) + " µm", C.teal, 13, "end");
            }
            if (step === 2 || step === 3) {
              g.arrow([-h - 0.35, -h, gd / 2], [-h - 0.35, -h, gd], C.purple, 2.2);
              g.arrow([-h - 0.35, -h, gd / 2], [-h - 0.35, -h, 0], C.purple, 2.2);
              g.text([-h - 0.6, -h, gd / 2], "g = " + fmt(g0, 2) + " µm", C.purple, 13, "end");
            }
            if (step === 3 || step === 4) g.text([0, h + 0.3, gd + 0.85], "C = " + fmt(cap(g0, ov), 3) + " pF", C.yellow, 15);
            if (step === 4) {
              const xx = Math.min(0.9 * g0, Math.abs(x)), c1 = cap(g0 - xx, ov), c0 = cap(g0, ov);
              g.text([0, h + 0.3, gd + 0.5], "move " + fmt(xx, 2) + " µm: C/C0 = " + fmt(c1 / c0, 4) + " (linear guess " + fmt(1 + xx / g0, 3) + ")", C.dim, 12);
            }
          } else {
            const gA = (g0 - x) * ZS, gB = (g0 + x) * ZS;              // top gap (C1) shrinks when x > 0
            const zMid = gB + PT, zTop = zMid + gA + PT;
            plate(0, 0, C.silicon, "");
            plate(zMid, 0, C.purple, "", { alpha: 0.75, bias: 40 });
            plate(zTop, 0, C.silicon, "", { alpha: 0.7, bias: 50 });
            const keepShift = ov; ov = 1; drawGap(zMid, zTop - PT, 1, 1); drawGap(0, zMid - PT, -1, 1); ov = keepShift;
            g.text([-h - 0.6, -h, zMid + gA / 2], "C1 = " + fmt(cap(g0 - x, 1), 3) + " pF", C.yellow, 13, "end");
            g.text([-h - 0.6, -h, gB / 2], "C2 = " + fmt(cap(g0 + x, 1), 3) + " pF", C.yellow, 13, "end");
            g.arrow([h + 0.6, 0, zMid - 0.05], [h + 0.6, 0, zMid - 0.05 + Math.sign(x || 1) * 0.45], C.purple, 2.6);
            g.text([h + 0.8, 0, zMid + 0.15], "moves x", C.purple, 13, "start");
          }
        },
      });
      function upd() {
        let html;
        if (!diff) {
          const c = cap(g0, ov);
          html = `<span style="color:${C.purple}">g = ${fmt(g0, 2)} µm</span> · overlap A = ${fmt(ov, 2)} mm² · <span style="color:${C.blue}">εr = ${fmt(er, 1)}</span> → ` +
            `<span style="color:${C.yellow}">C = ε0εrA/g = ${fmt(c, 3)} pF</span> · slope C/g = ${fmt(c / g0, 3)} pF/µm`;
        } else {
          const c1 = cap(g0 - x, 1), c2 = cap(g0 + x, 1);
          html = `differential, g0 = ${fmt(g0, 2)} µm, <span style="color:${C.purple}">x = ${fmt(x, 2)} µm</span> (${fmt(x / g0, 3)} g0) · ` +
            `<span style="color:${C.yellow}">C1 = ${fmt(c1, 3)} pF, C2 = ${fmt(c2, 3)} pF</span><br>` +
            `(C1 − C2)/(C1 + C2) = <b>${fmt((c1 - c2) / (c1 + c2), 4)}</b> = x/g0 = ${fmt(x / g0, 4)} · one-sided C1/C0 = ${fmt(c1 / cap(g0, 1), 4)} (linear guess ${fmt(1 + x / g0, 3)})`;
        }
        ui.read.innerHTML = html;
        sc.render();
      }
      ui.slider("gap g", 0.6, 4, 0.05, g0, (v) => { g0 = v; if (Math.abs(x) > 0.8 * g0) x = Math.sign(x) * 0.8 * g0; upd(); return fmt(v, 2) + " µm"; });
      const ovS = ui.slider("overlap", 0.2, 1, 0.05, ov, (v) => { ov = v; upd(); return fmt(v * 100, 0) + " %"; });
      const erS = ui.slider("εr", 1, 80, 0.5, er, (v) => { er = v; upd(); return fmt(v, 1); });
      const xS = ui.slider("middle plate x", -1.2, 1.2, 0.02, x, (v) => { x = Math.max(-0.8 * g0, Math.min(0.8 * g0, v)); upd(); return fmt(x, 2) + " µm"; });
      const db = ui.button("differential: off", () => { diff = !diff; db.textContent = "differential: " + (diff ? "on" : "off"); upd(); });
      const setDiff = (d) => { diff = d; db.textContent = "differential: " + (d ? "on" : "off"); };
      ui.steps([
        "Put \\( +q \\) on the top plate and \\( -q \\) on the bottom one. Charge per area: \\( q/A \\).",
        "Gauss's law: between large plates the field is uniform, \\( \\mathcal E=\\dfrac{q}{\\varepsilon_0\\varepsilon_rA} \\) (the straight teal lines).",
        "The voltage is field times distance: \\( V=\\mathcal E\\,g=\\dfrac{q\\,g}{\\varepsilon_0\\varepsilon_rA} \\).",
        "So \\( C=\\dfrac{q}{V}=\\dfrac{\\varepsilon_0\\varepsilon_rA}{g} \\): 4.427 pF for 1 mm² at 2 µm in air. Three knobs: gap, overlap, \\( \\varepsilon_r \\).",
        "Move a plate by \\( x \\): \\( C=\\dfrac{C_0}{1-x/g_0}=C_0(1+u+u^2+\\dots) \\), \\( u=x/g_0 \\). The \\( u^2 \\) term is the nonlinearity.",
        "The differential sandwich: \\( C_{1,2}=\\dfrac{C_0}{1\\mp u} \\), so \\( \\dfrac{C_1-C_2}{C_1+C_2}=u=\\dfrac{x}{g_0} \\) exactly. \\( C_0 \\), \\( \\varepsilon_r \\) and temperature cancel.",
        "Fringe fields (bright arcs) add capacitance at the edges: about +1% for a 2 µm gap under a 1 mm plate, but +144% when the gap is half the plate size.",
      ], (i) => {
        step = i;
        if (i <= 4 && diff) setDiff(false);
        if (i === 5) setDiff(true);
        if (i === 6 && diff) setDiff(false);
        if (i <= 3) { if (ov !== 1) ovS.set(1); if (er !== 1) erS.set(1); }
        upd();
      });
      xS.refresh();
    },
  });

  // ═════════════════ a3-touch-grid-3d: a mutual-capacitance touchscreen ═════════════════
  register("a3-touch-grid-3d", {
    title: "3D · a touchscreen: a finger steals mutual capacitance from a grid of electrodes",
    target: "After this you can explain how a phone finds a finger to sub-millimetre precision with 5 mm electrodes, and why mutual capacitance handles two fingers where self-capacitance sees ghosts.",
    caption: "rows (teal, transmitters) and columns (light teal, receivers) under the cover glass, 5 mm apart. Below them is the controller's heatmap: one bar per crossing, height = how much mutual capacitance the finger (blue) removed. The yellow ring is the centroid estimate; the dashed line drops from the true fingertip. Lift the finger to see the signal fade; switch to self-capacitance with two fingers to see the ghosts (red).",
    links: [
      { id: "A1", why: "position is the stimulus, a ΔC map is the output" },
      { id: "A8", why: "noise on each node sets how finely the centroid can be trusted" },
      { id: "A5", why: "a camera is also a grid of sensors read as an image" },
      { id: "A9", why: "tracking a moving finger between frames is a filtering problem" },
    ],
    build(fig, ui) {
      const NC = 6, NR = 8, P = 1;                       // columns along x, rows along y, pitch (1 unit = 5 mm)
      let fx = 2.3, fy = 3.6, fh = 0, two = false, self = false;
      const f2 = [4.0, 1.3];
      const blob = (px, py, qx, qy, hmm) => 0.15 * Math.exp(-((px - qx) ** 2 + (py - qy) ** 2) / (2 * 0.62 ** 2)) / (1 + (hmm / 1.5) ** 2);
      const fingers = () => (two ? [[fx, fy], f2] : [[fx, fy]]);
      const dC = (i, j) => fingers().reduce((s, f) => s + blob(i, j, f[0], f[1], fh), 0);
      const rowSig = (j) => fingers().reduce((s, f) => s + 0.6 * Math.exp(-((j - f[1]) ** 2) / (2 * 0.8 ** 2)) / (1 + (fh / 1.5) ** 2), 0);
      const colSig = (i) => fingers().reduce((s, f) => s + 0.6 * Math.exp(-((i - f[0]) ** 2) / (2 * 0.8 ** 2)) / (1 + (fh / 1.5) ** 2), 0);
      function centroid(cx, cy) {
        let best = [0, 0, -1];
        for (let i = 0; i < NC; i++) for (let j = 0; j < NR; j++) {
          if (Math.hypot(i - cx, j - cy) > 1.6) continue;
          const v = dC(i, j); if (v > best[2]) best = [i, j, v];
        }
        let sx = 0, sy = 0, sw = 0;
        for (let i = best[0] - 1; i <= best[0] + 1; i++) for (let j = best[1] - 1; j <= best[1] + 1; j++) {
          if (i < 0 || j < 0 || i >= NC || j >= NR) continue;
          const v = dC(i, j); sx += v * i; sy += v * j; sw += v;
        }
        return sw > 1e-6 ? [sx / sw, sy / sw, best[2]] : [cx, cy, 0];
      }
      const ZB = -1.9, HB = 9;                          // heatmap base and bar height per pF
      const sc = scene3d(ui.body, {
        w: 640, h: 400, scale: 40, yaw: -0.55, pitch: 0.62, center: [2.5, 3.5, -0.6],
        draw(g) {
          const x0 = -0.5, x1 = NC - 0.5, y0 = -0.5, y1 = NR - 0.5;
          // heatmap tiles and bars
          for (let i = 0; i < NC; i++) for (let j = 0; j < NR; j++) {
            const v = self ? 0 : dC(i, j), t = Math.min(1, v / 0.15);
            g.poly([[i - 0.45, j - 0.45, ZB], [i + 0.45, j - 0.45, ZB], [i + 0.45, j + 0.45, ZB], [i - 0.45, j + 0.45, ZB]], ramp(t * 0.85), { shade: false });
            if (v > 0.004) g.box([i - 0.28, j - 0.28, ZB], [i + 0.28, j + 0.28, ZB + v * HB], ramp(0.25 + t * 0.75));
          }
          // self-capacitance profiles at the edges
          if (self) {
            for (let j = 0; j < NR; j++) { const v = rowSig(j); if (v > 0.01) g.box([x0 - 1.0, j - 0.25, ZB], [x0 - 0.5, j + 0.25, ZB + v * 1.3], C.teal); }
            for (let i = 0; i < NC; i++) { const v = colSig(i); if (v > 0.01) g.box([i - 0.25, y1 + 0.5, ZB], [i + 0.25, y1 + 1.0, ZB + v * 1.3], mix(C.teal, C.white, 0.4)); }
            g.text([x0 - 0.75, y0 - 0.9, ZB], "row strips", C.teal, 12);
            g.text([x1 + 0.9, y1 + 0.75, ZB], "column strips", C.teal, 12);
          }
          g.grid(ZB - 0.001, [x0, x1], [y0, y1], 1, C.gridFaint);
          // electrodes: rows at z=0 (Tx) along x, columns at z=0.12 (Rx) along y
          for (let j = 0; j < NR; j++) g.line([x0, j, 0], [x1, j, 0], C.teal, 3);
          for (let i = 0; i < NC; i++) g.line([i, y0, 0.12], [i, y1, 0.12], mix(C.teal, C.white, 0.45), 3);
          // cover glass
          g.box([x0 - 0.2, y0 - 0.2, 0.2], [x1 + 0.2, y1 + 0.2, 0.42], "#cfe3ea", { alpha: 0.12, shade: false, stroke: "#9fb7c2", strokeAlpha: 0.35 });
          // fingers
          fingers().forEach((f, k) => {
            const zt = 0.42 + fh * 0.5 + 0.55;
            g.sphere([f[0], f[1], zt], 0.5, k === 0 ? C.blue : mix(C.blue, C.white, 0.2));
            g.cylinder([f[0], f[1], zt], [f[0] + 1.0, f[1] + 1.4, zt + 2.6], 0.5, mix(C.blue, C.bg, 0.25), 12, { alpha: 0.6 });
            g.line([f[0], f[1], zt - 0.6], [f[0], f[1], ZB], mix(C.blue, C.bg, 0.3), 1.2, [4, 4]);
          });
          // estimates
          if (!self) {
            fingers().forEach((f) => {
              const c = centroid(f[0], f[1]);
              if (c[2] > 0.003) {
                const ring = []; for (let a = 0; a <= 24; a++) ring.push([c[0] + 0.35 * Math.cos((a * Math.PI) / 12), c[1] + 0.35 * Math.sin((a * Math.PI) / 12), 0.44]);
                g.polyline(ring, C.yellow, 2.4);
              }
            });
          } else if (two) {
            // self-capacitance: every touched row × touched column is a candidate; two are ghosts
            const cand = [[fx, fy], f2, [fx, f2[1]], [f2[0], fy]];
            cand.forEach((c, k) => {
              const ring = []; for (let a = 0; a <= 24; a++) ring.push([c[0] + 0.4 * Math.cos((a * Math.PI) / 12), c[1] + 0.4 * Math.sin((a * Math.PI) / 12), 0.44]);
              g.polyline(ring, k < 2 ? C.yellow : C.red, 2.4);
              if (k >= 2) g.text([c[0], c[1], 0.9], "ghost?", C.red, 12);
            });
          }
        },
      });
      function upd() {
        const c = centroid(fx, fy), err = Math.hypot(c[0] - fx, c[1] - fy) * 5;
        const peak = dC(Math.round(Math.max(0, Math.min(NC - 1, fx))), Math.round(Math.max(0, Math.min(NR - 1, fy))));
        ui.read.innerHTML = self
          ? `<b>self-capacitance</b>: ${NR} row + ${NC} column measurements (vs ${NR * NC} crossings) · each strip only says "touched somewhere along me"` +
            (two ? `<br><span style="color:${C.red}">two fingers → 2 rows × 2 columns = 4 candidate points, 2 of them ghosts</span>` : "")
          : `finger at (${fmt(fx * 5, 1)}, ${fmt(fy * 5, 1)}) mm, ${fmt(fh, 1)} mm above the glass · nearest node ΔC = <span style="color:${C.yellow}">${fmt(peak * 1000, 0)} fF</span> of ~1 pF<br>` +
            `3×3 centroid → (${fmt(c[0] * 5, 2)}, ${fmt(c[1] * 5, 2)}) mm · <span style="color:${C.red}">error ${fmt(err, 2)} mm</span> with a 5 mm electrode pitch` + (two ? " · two separate blobs: no ghosts" : "");
        sc.render();
      }
      ui.slider("finger x", 0, NC - 1, 0.05, fx, (v) => { fx = v; upd(); return fmt(v * 5, 1) + " mm"; });
      ui.slider("finger y", 0, NR - 1, 0.05, fy, (v) => { fy = v; upd(); return fmt(v * 5, 1) + " mm"; });
      ui.slider("height", 0, 6, 0.1, fh, (v) => { fh = v; upd(); return fmt(v, 1) + " mm"; });
      const mb = ui.button("mode: mutual", () => { self = !self; mb.textContent = "mode: " + (self ? "self" : "mutual"); upd(); });
      const tb = ui.button("fingers: 1", () => { two = !two; tb.textContent = "fingers: " + (two ? 2 : 1); upd(); });
      upd();
    },
  });

  // ═════════════════ a3-rc-timing: soil moisture read by RC charging time ═════════════════
  register("a3-rc-timing", {
    title: "Readout · a soil probe read by timing: t½ = RC ln 2",
    target: "After this you can turn a soil water content into a permittivity, a capacitance and a charging time that a microcontroller can count.",
    caption: "the probe charges through 1 MΩ from 3.3 V. Wetter soil means a larger εr (Topp equation), a larger C and a slower curve (yellow); the dashed green curve is dry soil for comparison. The microcontroller only has to time when the curve crosses half the supply.",
    links: [
      { id: "A1", why: "the charging curve is the first-order lag with τ = RC" },
      { id: "A7", why: "an RC filter is the same circuit used on purpose" },
      { id: "A8", why: "each soil type needs its own calibration" },
      { id: "C4", why: "water held in soil pores by capillarity is what the probe sees" },
    ],
    build(fig, ui) {
      let th = 0.3;
      const R = 1e6, VS = 3.3, CH = 2, EB = 4.4;
      const topp = (q) => 3.03 + 9.3 * q + 146 * q * q - 76.7 * q * q * q;
      const capOf = (q) => CH * (topp(q) + EB);                      // pF
      const ch = chart(ui.body, { xr: [0, 150], yr: [0, 3.5], xlabel: "time t (µs)", ylabel: "probe voltage (V)", h: 290 });
      const half = ch.hline(C.dim), dry = ch.line(C.green, 1.8, "6 4"), cur = ch.line(C.yellow, 3), vl = ch.vline(C.yellow), vd = ch.vline(C.green, "2 4");
      const lab = ch.label(C.yellow, 12.5), labD = ch.label(C.green, 12), labH = ch.label(C.dim, 11.5);
      function draw() {
        const Cn = capOf(th), Cd = capOf(0.05), tau = R * Cn * 1e-6, tauD = R * Cd * 1e-6;   // µs
        const curve = (tt) => { const p = []; for (let t = 0; t <= 150; t += 1) p.push([t, VS * (1 - Math.exp(-t / tt))]); return p; };
        cur.set(curve(tau)); dry.set(curve(tauD)); half.set(VS / 2);
        vl.set(tau * Math.LN2); vd.set(tauD * Math.LN2);
        lab.set(Math.min(tau * Math.LN2 + 3, 105), 1.1, "t½ = " + fmt(tau * Math.LN2, 1) + " µs");
        labD.set(tauD * Math.LN2 + 2, 0.45, "dry " + fmt(tauD * Math.LN2, 1) + " µs");
        labH.set(120, VS / 2 + 0.14, "V_ex / 2");
        ui.read.innerHTML =
          `<span style="color:${C.blue}">water content θ = ${fmt(th, 2)}</span> → εr(soil) = 3.03 + 9.3θ + 146θ² − 76.7θ³ = ${fmt(topp(th), 2)} → ` +
          `<span style="color:${C.teal}">C = 2 pF × (${fmt(topp(th), 2)} + 4.4) = ${fmt(Cn, 1)} pF</span><br>` +
          `τ = RC = ${fmt(tau, 1)} µs → <span style="color:${C.yellow}">t½ = RC ln 2 = ${fmt(tau * Math.LN2, 1)} µs</span> (dry soil θ = 0.05: ${fmt(tauD * Math.LN2, 1)} µs) · at a 16 MHz timer: ${fmt(tau * Math.LN2 * 16, 0)} ticks`;
      }
      ui.slider("water content θ", 0, 0.45, 0.01, th, (v) => { th = v; draw(); return fmt(v, 2); });
    },
  });
})();
