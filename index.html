2=1/0.3125=3.20$ m², $\\sigma=1.79$ m ✓.\nA brute-force search over $w=0,0.001,\\dots,1$ finds the minimum variance at $w=0.800$ ✓.\n\n**One Kalman step.** $\\hat x=100$, $p=9$, $\\sigma_w^2=0.01$, $\\sigma_v^2=4$, $z=104$: $p^-=9.01$; $K=9.01/13.01=0.6925$;\n$\\hat x=100+0.6925\\times4=102.770$; $p=(1-0.6925)\\times9.01=2.770$ ✓.\n\n**Complementary filter.** $\\alpha=0.5/0.51=0.9804$; steady error $0.9804\\times0.5\\times0.01/(1-0.9804)=0.2500°$ $=b\\tau$ ✓.\n(All numbers: `scripts/checks/A9_check.py`.)\n\n## Whiteboard plan\n\n- **Panel 1: two friends.** Two bell curves on an altitude axis, a narrow one at 102 and a wide one at 98. Draw the narrower,\n  taller fused bell at 101.2, closer to the narrow one. Write \"precisions add: $1/\\sigma^2=1/\\sigma_1^2+1/\\sigma_2^2$\".\n- **Panel 2: the parabola.** Plot $\\sigma^2(w)=w^2\\sigma_1^2+(1-w)^2\\sigma_2^2$ for $w$ from 0 to 1, mark its bottom at 0.8. Derive $w^*$ in two lines.\n- **Panel 3: the gain.** A number line from $z_1$ to $z_2$ with an arrow covering the fraction $K$. Write \"$K$ = how much I trust the new reading\".\n- **Panel 4: predict–update loop.** A circle with two boxes: \"predict: $\\hat x^-=\\hat x+u\\Delta t$, $p^-=p+\\sigma_w^2$\" and \"update: $K$, $\\hat x$, $p$\".\n  Beside it a sawtooth of $p$ over time: up a little at each predict, down at each update, settling to a steady band.\n- **Panel 5: tilt.** A tilted phone, gravity arrow, gyro arrow. Write the complementary filter and \"gyro: high-pass, accelerometer: low-pass\".\n- **Panel 6: the drone.** A flight path with GPS dots and a 3D ellipse around the estimate, growing in a tunnel and snapping back. Write $\\tfrac12bt^2$.\n\n## Common mistakes and where the intuition breaks\n\n- **Averaging instead of weighting.** A plain average of a good and a bad sensor can be worse than the good sensor alone (2.24 m vs 2 m\n  in example 1). Always weight by $1/\\sigma^2$.\n- **Fusing biased sensors.** The derivation assumes zero-mean errors. A biased sensor pulls the fused answer by its weight times its bias,\n  and the filter's $p$ will claim a confidence it does not have. Calibrate first (A8), or add the bias to the state so the filter estimates it.\n- **Fusing correlated errors.** Two readings from the same sensor, or two sensors sharing the same wind gust, are not independent; treating\n  them as independent overcounts the information and makes the filter overconfident.\n- **Setting $\\sigma_w$ to zero \"because the model is good\".** Then $K\\to0$, the filter stops listening and drifts with the model. Every model has some error; an honest $\\sigma_w$ keeps the filter alive.\n- **Confusing $p$ with the actual error.** $p$ is what the filter *believes*; it is right only if $\\sigma_v$, $\\sigma_w$ and the model are right. Checking that the innovations $z-\\hat x^-$ really have variance $p^-+\\sigma_v^2$ is the standard test.\n- **Where 1D intuition breaks.** With position *and* velocity, or three axes, $p$ becomes a covariance matrix and $K$ a matrix: a GPS position\n  fix also corrects the velocity, because the two errors are correlated. Real motion is often nonlinear (rotations), which needs the\n  extended or unscented Kalman filter, but the predict–update logic and the meaning of $K$ stay the same.\n\n## Remember\n\n**\"Weight every guess by 1/σ²; the Kalman filter predicts with the model, then moves a fraction K = p⁻/(p⁻ + σ_v²) towards the measurement.\"**\n\n## Self-test\n\n1. A phone's GPS says you are at 50 m along a street (±8 m), and a Wi-Fi fix says 62 m (±4 m). What is the fused position and its uncertainty?\n   <details><summary>Answer<\/summary>Weights 1/64 and 1/16, i.e. 1:4. Fused = (50·1 + 62·4)/5 = 59.6 m. Variance 1/(1/64 + 1/16) = 12.8 m², so σ ≈ 3.58 m, better than either.<\/details>\n2. In a Kalman filter the prediction has p⁻ = 1 m² and the barometer has σ_v² = 3 m². The prediction is 20.0 m and the reading is 22.0 m. Find K, the new estimate and p.\n   <details><summary>Answer<\/summary>K = 1/(1 + 3) = 0.25. Estimate = 20.0 + 0.25·(22.0 − 20.0) = 20.5 m. p = (1 − 0.25)·1 = 0.75 m².<\/details>\n3. A complementary filter runs at 200 Hz with τ = 1 s, and the gyro has a 0.2 °/s bias. What is α, and how large is the steady tilt error? What happens to that error if you make τ ten times longer, and what do you lose?\n   <details><summary>Answer<\/summary>Δt = 0.005 s, so α = 1/1.005 ≈ 0.995. The steady error is bτ = 0.2 °/s × 1 s = 0.2°. With τ = 10 s it grows to 2°, but the accelerometer's shake noise is filtered more strongly. Long τ trusts the gyro (and its bias) more; short τ trusts the noisy accelerometer more.<\/details>\n\n**Next:** [B1 Scaling laws: why small is different](#B1) — the accelerometers, gyros and barometers we have been fusing are tiny silicon machines, and at that size physics behaves differently.\n"}, {"id": "B1", "short": "Scaling laws: why small is different", "title": "Scaling laws: why small is different", "part": "B", "md": "# B1. Scaling laws: why small is different\n\n> **Connects:** builds on [A3 Capacitive sensors](#A3) (the electrostatic force between plates), [A8 Noise, resolution, calibration and drift](#A8) (thermal noise and $1/\\sqrt M$) · used by [B2 Microfabrication](#B2), [B3 Micromechanics](#B3), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C1 Fluids at the microscale](#C1), [C3 Diffusion, mixing and the Péclet number](#C3), [C4 Surface tension, capillarity, droplets and electrokinetics](#C4)\n\n## Hook — an ant, an elephant and a glass of iced tea\n\nAn ant carries a leaf many times its own weight and walks away after falling off a table. An elephant cannot jump at\nall, and a fall of a few metres would break its legs. A water strider stands on a pond as if the water were a\ntrampoline; you would sink straight through. Crushed ice cools your iced tea in seconds, while one big ice cube takes\nminutes.\n\nNone of this is because ants are made of better stuff. Ant muscle is ordinary muscle and ice is ice. **The difference\nis size.** When you shrink an object, its surface shrinks more slowly than its volume. Forces that act on surfaces\n(muscle strength, surface tension, electrostatic pull) shrink more slowly than forces that act on volume (weight,\ninertia). Shrink anything far enough and the \"small\" forces of everyday life take over.\n\nThat is the entire reason MEMS (micro-electro-mechanical systems) work. A phone accelerometer has a proof mass a\nfraction of a millimetre wide, held on springs thinner than a hair and moved by electrostatic forces that would be useless\nin a washing machine. This note teaches the one habit that makes the micro-world predictable: **before using any formula,\nask how the effect scales with size.**\n\n## The idea in plain words\n\n**Shrink everything by the same factor.** Let $\\ell$ be a typical length of an object: the side of a cube, the length\nof a beam, the body length of an insect. \"Shrinking by 10\" means every length becomes $\\ell/10$ while the shape and\nthe material stay the same. Then every *length* is divided by 10, every *area* by $10^2=100$ and every *volume* by\n$10^3=1000$. We write this as $A\\propto\\ell^2$ and $V\\propto\\ell^3$, where $\\propto$ means \"is proportional to\".\nMost of what follows is this one fact applied again and again.\n\n**Surface beats volume when things are small.** A cube of side $\\ell$ has six faces, so its surface area is $A=6\\ell^2$\nand its volume is $V=\\ell^3$. Their ratio is\n$$\\frac{A}{V}=\\frac{6}{\\ell}.$$\nA 2 cm ice cube has $A/V=300$ per metre. Cut it into 1000 pieces of 2 mm and the volume is unchanged, but the total\nsurface grows tenfold, so $A/V=3000$ per metre and the tea cools ten times faster. A 1 µm cube has $A/V=6\\times10^{6}$ per\nmetre. At that size an object is \"almost all surface\". Heat flows in and out in an instant, molecules stick to the\nwalls, and forces that act on surfaces outweigh forces that act on bulk.\n\n```viz\nb1-cubes-3d\n```\n\n**How forces scale: the four exponents.** Here are the forces you meet in sensors, each written as a size law:\n\n- **Weight and inertia**, $F=mg_{\\text{grav}}$ and $F=m\\ddot x$. The mass is $m=\\rho V\\propto\\ell^3$, where $\\rho$ is the density\n  and $g_{\\text{grav}}=9.81$ m/s² is gravity. So weight $\\propto\\ell^3$. Shrink by 10 and the weight drops 1000 times.\n- **Electrostatic force** between two charged plates at a fixed electric field strength $\\mathcal E$ is\n  $F=\\tfrac12\\varepsilon_0\\mathcal E^2A$, where $\\varepsilon_0=8.854\\times10^{-12}$ F/m is the permittivity of free\n  space and $A$ is the plate area. So $F\\propto\\ell^2$. It is the same pull that you met as a capacitance in\n  [A3](#A3).\n- **Surface tension** pulls along a line. A water surface pulls on anything touching it with $\\gamma$ newtons per metre\n  of contact line ($\\gamma=0.072$ N/m for water). So $F=\\gamma\\times(\\text{contact length})\\propto\\ell$.\n- **Viscous drag** on a small sphere of radius $r$ moving at speed $U$ through a liquid of viscosity $\\mu$ is\n  Stokes' law, $F=6\\pi\\mu rU$. At a fixed speed this is $\\propto\\ell$, the same slope as surface tension.\n- **Magnetic force** from a coil. If the wire carries a fixed current density $J$ (amperes per square metre of\n  copper, limited by heating), the current is $J\\ell^2$ and the field it makes at a distance $\\sim\\ell$ is about\n  $B\\approx\\mu_0J\\ell$, with $\\mu_0=4\\pi\\times10^{-7}$ H/m. The magnetic pressure $B^2/(2\\mu_0)$ times an area\n  $\\ell^2$ gives $F\\approx\\tfrac12\\mu_0J^2\\ell^4$. Shrink by 10 and the magnetic force drops **ten thousand** times.\n\nWilliam Trimmer packed this into one \"bracket\" (a column of exponents) that MEMS designers memorise:\n$$F\\propto\\begin{bmatrix}\\ell^1\\\\ \\ell^2\\\\ \\ell^3\\\\ \\ell^4\\end{bmatrix}\\ \\begin{matrix}\\text{surface tension, viscous drag}\\\\ \\text{electrostatics}\\\\ \\text{gravity, inertia}\\\\ \\text{magnetics}\\end{matrix}$$\nRead it from bottom to top: the lower the exponent, the better the force survives shrinking. Dividing by the mass\n($\\propto\\ell^3$) gives the acceleration each force can produce: $a\\propto[\\ell^{-2},\\ell^{-1},\\ell^{0},\\ell^{1}]$.\nSo a 100 µm silicon block feels an electrostatic acceleration 100 times larger than a 1 cm block under the same field. Small\nthings are *quick*.\n\n```viz\nb1-forces-chart\n```\n\n**Why insects walk on water.** Weight $\\rho g_{\\text{grav}}\\ell^3$ and surface tension $\\gamma\\ell$ are equal when\n$\\ell=\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}$. For water this length is 2.7 mm, called the **capillary length**. A\nwater strider's legs touch the surface along a couple of centimetres, so surface tension can hold about 30 times its\nweight. A 70 kg person would need about 4.8 km of contact line. Below a few millimetres, gravity is a minor detail. Above\na few centimetres, surface tension is.\n\n**Why MEMS uses electrostatics while big motors use magnets.** Big motors win with $\\ell^4$: a 10 cm copper coil\neasily makes about 1 T, a magnetic pressure of about 400 kPa. In air at large gaps the electric field cannot exceed about\n$3\\times10^6$ V/m (beyond that the air sparks), so the electrostatic pressure is only 40 Pa: 10 000 times weaker.\nShrink to MEMS size and the picture flips. The magnetic force collapses as $\\ell^4$, while thin gaps of 1–2 µm can hold\nfields near $10^8$ V/m without sparking, which gives an electrostatic pressure of 44 kPa. Electrostatic drives are also simple to make\n(two layers of silicon and a voltage, with no coils and no magnets), and the same plates double as a capacitive sensor.\nThat is why accelerometers, gyroscopes, mirrors and microphones in your phone are electrostatic.\n\n**Springs get stiffer relative to mass, so small things ring at high pitch.** A spring's stiffness $k$ (newtons per\nmetre) for a beam scales as $k\\propto E\\ell$, where $E$ is Young's modulus (how stiff the material is). The mass scales\nas $m\\propto\\rho\\ell^3$. The natural angular frequency $\\omega_0=\\sqrt{k/m}$ therefore scales as\n$$\\omega_0\\propto\\frac1\\ell\\sqrt{\\frac{E}{\\rho}}.$$\nShrink a diving board 1000 times and it vibrates 1000 times faster. A 1 m silicon plank 1 cm thick would sway at\n14 Hz. The same shape at 1 mm long rings at 14 kHz, and at 100 µm at 138 kHz. Ringing fast means a MEMS sensor can\nfollow fast changes, and it shrugs off the slow shaking of a car. [B3](#B3)\ndoes the exact beam formula.\n\n**Time scales: heat and molecules travel in time $\\propto\\ell^2$.** Heat spreads by diffusion: in a time $\\tau$ it reaches\na distance of about $\\sqrt{D_{\\text{th}}\\tau}$, where $D_{\\text{th}}$ is the material's thermal diffusivity\n($9\\times10^{-5}$ m²/s for silicon). Turned around, the time to heat or cool something of size $\\ell$ is\n$\\tau\\approx\\ell^2/D_{\\text{th}}$. Half the size means a quarter of the time. A 100 µm silicon heater reaches its temperature in about\n0.1 ms, which is why a MEMS gas sensor can pulse its heater on and off many times a second. Molecules in a liquid\nspread the same way: the time to diffuse a distance $\\ell$ is about $\\ell^2/(2D)$, where $D$ is the diffusion\ncoefficient. Glucose crosses 10 µm in 75 ms but needs 20 hours to cross 1 cm. That single fact is why microfluidic chips\n([C3](#C3)) can mix and react in seconds what a test tube does in hours.\n\n```viz\nb1-clocks\n```\n\n**The price of small: thermal noise.** Every object at temperature $T$ is jiggled by the random kicks of molecules, with\nenergy $k_BT\\approx4.1\\times10^{-21}$ J per degree of freedom ($k_B$ is Boltzmann's constant). For a 1 kg mass that is\nnothing. For a proof mass of one microgram it is the noise floor. The random force on a damped mass has a spectral density\n$\\sqrt{4k_BTb}$ (newtons per $\\sqrt{\\text{Hz}}$, $b$ = damping), and dividing by the mass gives an acceleration noise\n$$a_n=\\sqrt{\\frac{4k_BT\\,\\omega_0}{m\\,Q_f}},$$\nwith $Q_f$ the quality factor ([B3](#B3)). Shrinking by 10 makes the mass 1000\ntimes lighter and the noise $\\sqrt{1000}\\approx32$ times bigger. This is the same random noise as the Johnson noise of a\nresistor in [A8](#A8), now shaking a mass instead of electrons. It sets a lower\nlimit on how small an accelerometer can usefully be.\n\n## Intuitive examples\n\n1. **Ice cubes vs crushed ice.** A 2 cm cube has $A/V=6/\\ell=300$ m⁻¹. Cut into 1000 cubes of 2 mm, the total area\n   goes from 24 cm² to 240 cm² (×10) and $A/V=3000$ m⁻¹. A 1 µm cube: $6\\times10^6$ m⁻¹.\n2. **Ant vs human vs elephant.** Strength $\\propto$ muscle cross-section $\\propto\\ell^2$; weight $\\propto\\ell^3$, so\n   strength-to-weight $\\propto1/\\ell$. A 5 mm ant is 350 times smaller than a 1.75 m person, so the simple law predicts 350 times\n   more strength per weight (real ants manage tens of times their weight; joints and posture matter too). An elephant\n   (3 m) gets only 0.58 of a human's strength per weight, so it cannot jump.\n3. **Water strider.** Mass 10 mg, weight 0.098 mN. With about 2 cm of leg on the water and surface tension pulling on both\n   sides, the maximum support is $2\\gamma L=2.88$ mN, a margin of about ×29. The capillary length of water is\n   $\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}=2.71$ mm. A 70 kg human would need 4769 m (4.8 km) of contact line.\n4. **The same shape rings 1000 times faster.** A silicon cantilever with length $L$ and thickness $t=L/100$ has\n   $f_0=0.16154\\,(t/L^2)\\sqrt{E/\\rho}$ with $\\sqrt{E/\\rho}=8517$ m/s. At $L=1$ m it is 13.76 Hz, at 1 mm 13.76 kHz,\n   and at 100 µm 137.6 kHz.\n5. **Heating time.** Silicon's $D_{\\text{th}}=149/(2330\\times705)=9.07\\times10^{-5}$ m²/s. A 100 µm heater needs\n   $\\ell^2/D_{\\text{th}}=0.11$ ms. A 1 cm block needs 1.1 s, 10 000 times longer for 100 times the size.\n6. **Diffusion time** for glucose ($D=6.7\\times10^{-10}$ m²/s): 10 µm in 0.075 s, 1 mm in 746 s (12.4 min), 1 cm in\n   74 600 s (20.7 h).\n7. **Thermal noise of a proof mass** ($f_0=5$ kHz, $Q_f=1$, 25 °C, $k_BT=4.116\\times10^{-21}$ J): $m=1$ µg gives\n   $a_n=7.19\\times10^{-4}$ m/s²/√Hz, about 73 millionths of $g_{\\text{grav}}$ per √Hz. That is a typical phone accelerometer.\n   A 1 ng mass (the same design 10× smaller in size) gives $0.0227$ m/s²/√Hz, 31.6 times worse; a 1 g mass gives $7.19\\times10^{-7}$.\n8. **Electric vs magnetic pressure.** $\\tfrac12\\varepsilon_0\\mathcal E^2=39.84$ Pa at $3\\times10^6$ V/m (air\n   breakdown at mm gaps) and $4.427\\times10^4$ Pa at $10^8$ V/m (a µm gap). $B^2/(2\\mu_0)=3.979\\times10^5$ Pa at 1 T. A\n   coil with $J=10^7$ A/m² makes $B\\approx\\mu_0J\\ell=1.26$ T at 10 cm, 0.126 T at 1 cm and only $1.26\\times10^{-4}$ T at\n   10 µm.\n9. **Fog floats.** A 10 µm water droplet falling in air (Stokes drag vs weight) settles at only 3.03 mm/s. Its\n   weight ($\\ell^3$) is tiny next to the drag ($\\ell$).\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $A\\propto\\ell^2,\\ V\\propto\\ell^3,\\ A/V=6/\\ell$ (cube) | surface wins as things shrink | $\\ell$ size, $A$ area, $V$ volume |\n| $F_{\\text{grav}}=\\rho g_{\\text{grav}}\\ell^3$ | weight and inertia $\\propto\\ell^3$ | $\\rho$ density, $g_{\\text{grav}}$ gravity |\n| $F_{\\text{es}}=\\tfrac12\\varepsilon_0\\mathcal E^2\\ell^2$ | electrostatic pull at fixed field $\\propto\\ell^2$ | $\\varepsilon_0$ permittivity, $\\mathcal E$ field |\n| $F_{\\text{st}}=\\gamma\\ell$, $F_{\\text{visc}}=6\\pi\\mu\\ell U$ | surface tension, Stokes drag $\\propto\\ell$ | $\\gamma$ surface tension, $\\mu$ viscosity, $U$ speed |\n| $F_{\\text{mag}}\\approx\\tfrac12\\mu_0J^2\\ell^4$ | coil force at fixed current density $\\propto\\ell^4$ | $\\mu_0$ permeability, $J$ current density |\n| $F\\propto[\\ell^1,\\ell^2,\\ell^3,\\ell^4]$, $a\\propto[\\ell^{-2},\\ell^{-1},\\ell^0,\\ell^1]$ | Trimmer's bracket: force and acceleration | $a$ acceleration |\n| $\\ell_c=\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}$ | below $\\ell_c$ surface tension beats weight (2.7 mm for water) | $\\ell_c$ capillary length |\n| $\\omega_0=\\sqrt{k/m}\\propto\\dfrac1\\ell\\sqrt{E/\\rho}$ | small things ring at high frequency | $k$ stiffness, $E$ Young's modulus |\n| $\\tau_{\\text{th}}\\approx\\ell^2/D_{\\text{th}}$, $t_{\\text{diff}}\\approx\\ell^2/(2D)$ | heat and molecules travel in time $\\propto\\ell^2$ | $D_{\\text{th}}$ thermal diffusivity, $D$ diffusion coefficient |\n| $a_n=\\sqrt{4k_BT\\omega_0/(mQ_f)}\\propto\\ell^{-3/2}$ | thermal noise grows as the mass shrinks (at fixed $\\omega_0$) | $k_B$ Boltzmann, $T$ temperature, $Q_f$ quality factor |\n\n## Applications\n\n| World | Scaling with size $\\ell$ | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | water rises in xylem vessels tens of µm wide by capillarity, where surface tension ($\\ell$) beats weight ($\\ell^3$); a leaf (thin, large $A/V$) reaches air temperature within seconds | why a leaf-clip thermometer must be tiny and light, and why sap-flow chips use µm channels ([C2](#C2), [C4](#C4)) |\n| 🧬 Biology & human health | cells are 10 µm: oxygen and glucose diffuse across them in milliseconds; a 1 mm blob would starve without blood vessels | why organs need capillaries and why organ-on-chip channels are 100 µm, not 1 cm ([C5](#C5)) |\n| 🌍 Environment | fog droplets (10 µm) settle at 3 mm/s and stay airborne; MEMS hot-plate gas sensors heat 100 µm membranes in about 0.1 ms using milliwatts | particulate counters must handle floating particles; a battery-powered NO₂ sensor can pulse its heater |\n| 🤖 Robotics & drones | a drone IMU's proof mass is µg-sized, so it ignores motor vibration below its kHz resonance but pays a thermal-noise floor | choose the IMU by its noise density in µg/√Hz ([B4](#B4), [A9](#A9)) |\n| 🚗 Cars | the airbag accelerometer is electrostatically self-tested at every start (electrostatics beats magnetics at 100 µm); big motors and seat actuators stay magnetic | the force law follows the size: comb drives inside the chip, coils outside |\n| 📱 Phones & photography | MEMS microphones, gyroscopes and autofocus mirrors are electrostatic; camera OIS lenses (mm-sized, heavier) still use voice-coil magnets | the crossover between electrostatic and magnetic actuation lies in the mm range |\n| 🏠 Home & household | crushed ice cools faster (10× the surface); a tiny thermistor bead reads the room in seconds, a big metal probe in minutes | fast sensors are small sensors ([A2](#A2)) |\n\n## Derivation\n\n**(a) Area and volume of a shrunken shape.**\n1. Scale every length by a factor $\\lambda_s$: $x\\to\\lambda_s x$, for all three coordinates.\n2. An area element $dA=dx\\,dy$ becomes $\\lambda_s^2\\,dA$, so every area scales as $\\lambda_s^2$.\n3. A volume element $dV=dx\\,dy\\,dz$ becomes $\\lambda_s^3\\,dV$, so every volume (and mass, at fixed $\\rho$) scales as $\\lambda_s^3$.\n4. Therefore $A/V\\propto\\lambda_s^{-1}$; for a cube $A/V=6\\ell^2/\\ell^3=6/\\ell$.\n5. Cutting a cube into $n^3$ pieces: total area $n^3\\cdot6(\\ell/n)^2=6\\ell^2n$, which is $n$ times the original.\n\n**(b) The force exponents.**\n1. Gravity: $F=\\rho V g_{\\text{grav}}=\\rho g_{\\text{grav}}\\ell^3$, exponent 3. Inertia $m\\ddot x$ at a fixed acceleration: also 3.\n2. Electrostatic: energy density in the field $u=\\tfrac12\\varepsilon_0\\mathcal E^2$ (J/m³ = N/m², a pressure). Force = pressure × area $\\propto\\ell^2$.\n3. At fixed *voltage* instead: $\\mathcal E=V/g$ with gap $g\\propto\\ell$, so $F=\\varepsilon_0AV^2/(2g^2)\\propto\\ell^0$. Shrinking helps even more.\n4. Surface tension: force = $\\gamma$ × contact length $\\propto\\ell$. Stokes drag $6\\pi\\mu rU$ at fixed $U$: $\\propto\\ell$.\n5. Magnetic: current $I=J\\ell^2$; field at distance $\\ell$ from a wire $B=\\mu_0I/(2\\pi\\ell)\\propto\\mu_0J\\ell$.\n6. Magnetic pressure $B^2/(2\\mu_0)\\propto\\mu_0J^2\\ell^2$; times area $\\ell^2$: $F\\propto\\ell^4$.\n\n**(c) Acceleration and travel time (Trimmer).**\n1. $a=F/m$ with $m\\propto\\ell^3$: $a\\propto[\\ell^{-2},\\ell^{-1},\\ell^0,\\ell^1]$.\n2. Time to move a distance $x\\propto\\ell$ from rest: $x=\\tfrac12at^2$ ⇒ $t=\\sqrt{2x/a}\\propto\\sqrt{\\ell/a}$.\n3. So $t\\propto[\\ell^{1.5},\\ell^{1},\\ell^{0.5},\\ell^{0}]$: every actuator gets faster when small, electrostatic ones in proportion to $\\ell$.\n\n**(d) Crossover lengths.**\n1. Weight = surface tension: $\\rho g_{\\text{grav}}\\ell^3=\\gamma\\ell$ ⇒ $\\ell_c=\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}$.\n2. Electrostatic = magnetic: $\\tfrac12\\varepsilon_0\\mathcal E^2\\ell^2=\\tfrac12\\mu_0J^2\\ell^4$ ⇒ $\\ell=\\dfrac{\\mathcal E}{J}\\sqrt{\\varepsilon_0/\\mu_0}$.\n3. With $\\mathcal E=3\\times10^6$ V/m and $J=10^7$ A/m², this gives 0.80 mm; with $10^8$ V/m it gives 26.5 mm.\n\n**(e) Resonance.**\n1. A beam's stiffness: $k=Ewt^3/(4L^3)$ ([B3](#B3)); with all lengths $\\propto\\ell$: $k\\propto E\\ell^4/\\ell^3=E\\ell$.\n2. Mass $m=\\rho Lwt\\propto\\rho\\ell^3$.\n3. $\\omega_0=\\sqrt{k/m}\\propto\\sqrt{E\\ell/(\\rho\\ell^3)}=\\dfrac1\\ell\\sqrt{E/\\rho}$.\n\n**(f) Diffusion times.**\n1. Heat diffusion: $\\partial T/\\partial t=D_{\\text{th}}\\nabla^2T$. With $t\\sim\\tau$ and $\\nabla^2\\sim1/\\ell^2$, balancing gives $1/\\tau\\sim D_{\\text{th}}/\\ell^2$.\n2. So $\\tau_{\\text{th}}\\sim\\ell^2/D_{\\text{th}}$; molecules in 1D spread as $\\sqrt{2Dt}$, so $t_{\\text{diff}}=\\ell^2/(2D)$ ([C3](#C3)).\n\n**(g) Thermal noise.**\n1. Damping $b=m\\omega_0/Q_f$ (from $Q_f=\\sqrt{km}/b$ and $k=m\\omega_0^2$).\n2. Thermal force noise density $\\sqrt{4k_BTb}$ (the mechanical twin of Johnson noise $\\sqrt{4k_BTR}$, [A8](#A8)).\n3. Divide by $m$: $a_n=\\sqrt{4k_BTb}/m=\\sqrt{4k_BT\\omega_0/(mQ_f)}$.\n4. With $m\\propto\\ell^3$ and $\\omega_0\\propto1/\\ell$: $a_n\\propto\\sqrt{\\ell^{-1}/\\ell^3}=\\ell^{-2}$ for a fully shrunk device, or $\\ell^{-3/2}$ if $\\omega_0$ is held fixed.\n\n## Worked check\n\nTake a 1 cm silicon cube ($\\rho=2330$ kg/m³) and shrink it 100 times to 100 µm.\n\n- $A/V$: $6/0.01=600$ m⁻¹ → $6/10^{-4}=6\\times10^4$ m⁻¹ (×100).\n- Weight $\\rho g_{\\text{grav}}\\ell^3$: $2.286\\times10^{-2}$ N → $2.286\\times10^{-8}$ N (×10⁻⁶).\n- Surface tension $\\gamma\\ell$: $7.2\\times10^{-4}$ N → $7.2\\times10^{-6}$ N (×10⁻²). The ratio surface/weight goes from 0.0315 to 315.\n- Electrostatic at $3\\times10^6$ V/m, $39.84\\,\\ell^2$: $3.98\\times10^{-3}$ N → $3.98\\times10^{-7}$ N.\n- Magnetic at $J=10^7$ A/m², $6.283\\times10^7\\,\\ell^4$: 0.628 N → $6.28\\times10^{-9}$ N. The ratio electrostatic/magnetic goes\n  from 0.0063 (magnets win 160 times) to 63.4 (electrostatics wins 63 times).\n- Acceleration from the electrostatic force: $1.71$ m/s² → 171 m/s² (×100, the $\\ell^{-1}$ entry), while gravity stays 9.81 m/s².\n- Heating time $\\ell^2/D_{\\text{th}}$: 1.1 s → 0.11 ms (×10⁻⁴).\n\nAll numbers come from `scripts/checks/B1_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1: the cube.** Draw a cube of side $\\ell$, then the same cube cut into 27 pieces. Write $A=6\\ell^2$, $V=\\ell^3$,\n  $A/V=6/\\ell$, and \"cut n per side → area ×n\". Say: \"Same ice, ten times the surface, ten times faster melting.\"\n- **Panel 2: the bracket.** Write Trimmer's column $[\\ell^1,\\ell^2,\\ell^3,\\ell^4]$ with the four force names next to it.\n  Arrow: \"shrink ⇒ the top rows win.\"\n- **Panel 3: log-log plot.** Axes $\\log\\ell$ and $\\log F$; four straight lines with slopes 1, 2, 3, 4. Circle the crossing of\n  slope 1 and slope 3 at a few mm and label it \"water strider zone\". Circle the crossing of slopes 2 and 4: \"below here MEMS goes electrostatic\".\n- **Panel 4: a ringing ruler.** Draw a long ruler and a tiny one. Write $\\omega_0=\\sqrt{k/m}$, $k\\propto\\ell$, $m\\propto\\ell^3$\n  ⇒ $\\omega_0\\propto1/\\ell$. Say: \"1000× smaller, 1000× higher pitch.\"\n- **Panel 5: clocks.** Write $\\tau\\propto\\ell^2$ for heat and molecules: 10 µm → 75 ms, 1 cm → 20 h for glucose.\n- **Panel 6: the price.** A tiny mass being kicked by molecules: $a_n=\\sqrt{4k_BT\\omega_0/(mQ_f)}$. Say: \"Small is fast and strong,\n  but noisy.\"\n\n## Common mistakes and where the intuition breaks\n\n- **Scaling laws are ratios, not values.** \"$F\\propto\\ell^2$\" says what happens when you shrink a *given* design. It does\n  not say an electrostatic force is large; the prefactor (field, material) still matters. Always compare two forces at the\n  same $\\ell$.\n- **Assuming everything shrinks together.** Real devices do not scale uniformly. Gaps can shrink faster than plates,\n  voltages are often held fixed, and films have a fixed thickness set by the process. Re-derive the exponent for the\n  quantity that is actually held constant (fixed field gives $\\ell^2$; fixed voltage gives $\\ell^0$).\n- **The magnetic $\\ell^4$ assumes fixed current density.** Small wires cool better, so microcoils can carry 10–100 times\n  more current density, which softens $\\ell^4$ toward $\\ell^3$ or $\\ell^2$. Magnetics is not impossible in MEMS (phone\n  compasses, some mirrors), just usually not worth it.\n- **Fields do not stay fixed either.** Air sparks at about 3 V/µm for mm gaps, but much higher fields survive in µm gaps (the Paschen\n  curve), which is one more gift of smallness to electrostatics.\n- **Continuum physics has a floor.** Below about 10 nm, surfaces become atomic, gases stop behaving like fluids (the mean free\n  path of air is 68 nm) and quantum effects appear. The laws here hold from about 1 µm up to metres.\n- **Small is noisy.** Thermal noise, Brownian motion and sticking (stiction, [B2](#B2))\n  all grow in importance as you shrink. Scaling explains what MEMS can do, and also what it cannot.\n\n## Remember\n\n**\"Shrink by 10: lengths ÷10, areas ÷100, volumes ÷1000. Surface forces win, things get fast, and noise grows.\"**\n\n## Self-test\n\n1. A MEMS mirror is shrunk by a factor of 2 in every direction while the electric field in its gap is kept fixed. By what\n   factor does the electrostatic force change, and the angular acceleration it can produce?\n   <details><summary>Answer<\/summary>Force ∝ ℓ², so it falls to 1/4. Mass ∝ ℓ³ falls to 1/8, so linear acceleration a = F/m doubles (∝ 1/ℓ). The moment of inertia ∝ ℓ⁵ falls to 1/32 and the torque ∝ ℓ³ falls to 1/8, so the angular acceleration grows 4×. Smaller mirrors scan faster.<\/details>\n2. Why can a mosquito land on water, but a sparrow cannot?\n   <details><summary>Answer<\/summary>Weight scales as ℓ³ and surface tension support as ℓ. They balance near the capillary length of water, about 2.7 mm. A mosquito (a few mm, a few mg) is near or below it, so surface tension can hold it. A sparrow (about 15 cm, 25 g) is far above it: its weight is thousands of times larger than what surface tension along its feet can supply.<\/details>\n3. A 1 mm gas-sensor heater reaches temperature in 11 ms. How fast would a 100 µm version be, and why does that save battery?\n   <details><summary>Answer<\/summary>Thermal time ∝ ℓ², so 10× smaller is 100× faster: about 0.11 ms. The heater can be pulsed on only briefly for each reading, and the heat capacity (∝ ℓ³) is 1000× smaller, so each pulse costs far less energy.<\/details>\n\n**Next:** [B2 Microfabrication: lithography, etching, deposition](#B2): now that we know small machines are worth building, here is how to build them out of a silicon wafer.\n"}, {"id": "B2", "short": "Microfabrication: lithography, etching, deposition", "title": "Microfabrication: lithography, etching, deposition", "part": "B", "md": "# B2. Microfabrication: lithography, etching, deposition\n\n> **Connects:** builds on [B1 Scaling laws](#B1) (why tiny structures are worth building, and why surface forces cause stiction) · used by [B3 Micromechanics](#B3), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C2 Pressure-driven flow](#C2), [C5 Lab-on-a-chip](#C5)\n\n## Hook — a stencil, a spray can and a layered cake\n\nTo paint a sharp logo on a T-shirt you cut a stencil, lay it on the cloth, spray, and peel it off. Paint lands only where\nthe stencil is open. To build a layered cake you stack sponge, cream, sponge, and if you want a hollow inside, you bake\naround something that you later melt away.\n\n**Microfabrication is exactly that, done hundreds of times smaller than a hair and thousands of devices at once.** Light\nshining through a glass \"stencil\" (a photomask) hardens or softens a thin film of light-sensitive lacquer (photoresist).\nChemicals or plasmas then eat away the material wherever the lacquer is gone. New layers are grown or sprayed on, and a\nlayer that was only there to hold up the next one (the *sacrificial layer*) is dissolved at the end. What remains is a\nsilicon beam floating 2 µm above the chip, free to move. Every accelerometer, gyroscope, microphone and pressure sensor\nin a phone or car is made this way, on wafers that each carry thousands of identical chips.\n\n## The idea in plain words\n\n**The wafer: a perfect crystal.** Everything starts with a disc of single-crystal silicon, 100–300 mm across and about\n0.5–0.8 mm thick, polished like a mirror. Silicon atoms sit on a cubic lattice, and planes through that lattice have\nnames written as three numbers in brackets. The wafer surface is usually a **(100)** plane, the face of the cube. The\n**(111)** planes, through three corners of the cube, are the most tightly packed. They meet the surface at an angle of\n$\\arccos(1/\\sqrt3)=54.74°$. Remember this angle: some chemicals almost refuse to etch (111) planes, and that turns the crystal\nitself into a ruler.\n\n**Adding material: oxidation and deposition.** Three ways to put a thin film (a \"thin film\" is 10 nm to a few µm) on the\nwafer:\n- **Thermal oxidation.** Heat silicon to 900–1200 °C in oxygen or steam and it grows silicon dioxide (glass), $\\text{SiO}_2$.\n  The oxide eats into the wafer: growing 1 µm of oxide consumes 0.44 µm of silicon. Growth slows down as the oxide gets\n  thicker, because oxygen must diffuse through what is already there (the Deal–Grove law,\n  $t_{\\text{ox}}^2+A_{\\text{DG}}\\,t_{\\text{ox}}=B_{\\text{DG}}\\,t$, with $t_{\\text{ox}}$ the oxide thickness, $t$ the time and $A_{\\text{DG}},B_{\\text{DG}}$\n  constants of the furnace). Oxide is the perfect insulator and the perfect sacrificial layer.\n- **Chemical vapour deposition (CVD).** Gases react on the hot wafer and leave a solid film. LPCVD (low pressure, about 600 °C)\n  makes polycrystalline silicon (\"poly\"), the structural material of most MEMS, at about 10 nm/min. PECVD uses a plasma to do\n  it at 300 °C. CVD coats every surface, including side walls: it is *conformal*.\n- **Physical vapour deposition (PVD).** Metals are evaporated or **sputtered**: argon ions knock atoms off a metal target and\n  they fly in straight lines to the wafer. Sputtering is how aluminium wires, gold electrodes and the piezoelectric films\n  of [B5](#B5) are made.\n\n**Patterning: photolithography.** A film everywhere is useless; you need it *in the shape* of a beam, a comb or an\nelectrode. The recipe:\n1. **Spin-coat** a photoresist: a drop on the wafer spun at a few thousand rpm spreads into an even film 1–5 µm thick.\n   Faster spinning gives a thinner film, with thickness $\\propto1/\\sqrt{\\text{rpm}}$.\n2. **Expose** through a **photomask**, a glass plate with a chrome pattern, using ultraviolet light (365 nm \"i-line\").\n3. **Develop**: in a *positive* resist the exposed parts dissolve; in a *negative* resist (like SU-8) they stay.\n4. Now the resist is a stencil on the wafer. **Etch** the film below wherever it is uncovered, or deposit metal on top and\n   dissolve the resist (lift-off).\n5. **Strip** the resist and start the next layer. A MEMS process uses 3–10 masks, which must be aligned to each other to\n   about 1 µm.\n\nHow small can you print? Light bends around the edges of the mask (diffraction), so lines cannot be much smaller than\nthe wavelength. For a projection lens the smallest half-pitch is\n$$R=k_1\\frac{\\lambda}{\\mathrm{NA}},$$\nwhere $\\lambda$ is the wavelength, $\\mathrm{NA}$ the numerical aperture of the lens (how wide a cone of light it collects,\nat most about 1.35 with water immersion) and $k_1\\approx0.3$–0.8 a \"process skill\" factor. MEMS rarely needs better than\n1 µm and is often printed by a simple *proximity* aligner, where the mask hovers at a gap $g$ above the resist and\n$W_{\\min}\\approx\\sqrt{\\lambda g}$, which is about 2 µm for a 10 µm gap. Chips for computers push the same formula to the limit with\n193 nm and 13.5 nm (EUV) light.\n\n```viz\nb2-process-3d\n```\n\n**Removing material: etching.** Etching is how the stencil's shape is carved into the layer below. Two things matter:\nhow *selective* the etch is (it should eat the film, not the mask) and whether it is *isotropic* (equal speed in all\ndirections) or *anisotropic* (directional).\n- **Wet isotropic etching** (for example HF for oxide, or HNA acid for silicon) eats sideways as fast as downward. A trench\n  of depth $d$ undercuts the mask by $d$ on each side and has rounded walls.\n- **Wet anisotropic etching** of silicon in hot potassium hydroxide (KOH, about 80 °C) attacks (100) planes 100–400 times\n  faster than (111) planes. The etch stops on the slow (111) planes, so a square mask opening becomes an upside-down\n  pyramid with walls sloping at 54.74°. Each wall drops $\\tan54.74°=\\sqrt2$ µm for every µm it moves inward, so a long\n  opening of width $W$ becomes a V-groove whose two walls meet, and the etch stops by itself, at depth\n  $$d=\\frac{W}{2}\\tan54.74°=\\frac{W}{\\sqrt2}\\approx0.707\\,W.$$\n  Turned around: a wall that has gone down by $d$ has moved inward by only $d/\\sqrt2$.\n  Etch from the back through the wafer and stop a few µm short (timed, or on a boron-doped layer) and you get a thin\n  **membrane**: the heart of a pressure sensor ([B5](#B5)).\n- **Dry etching** uses a plasma. **Deep reactive-ion etching (DRIE)**, the *Bosch process*, alternates two short steps\n  every few seconds: an SF₆ plasma etches silicon downward, then a C₄F₈ plasma coats everything with a thin\n  Teflon-like film. Ions bombard the floor and clear the film there, but the side walls stay protected. The result\n  is vertical walls of any shape with aspect ratios (depth/width) of 20:1 or more, with tiny ripples (\"scallops\") on\n  the walls. DRIE is what makes the combs of accelerometers and gyroscopes.\n\n```viz\nb2-etch-profile\n```\n\n**Two ways to make a machine.** In **bulk micromachining** you carve into the wafer itself: KOH membranes, DRIE\nthrough-wafer structures, V-grooves. The structures are thick (tens to hundreds of µm), so they are heavy, stiff and\nquiet. In **surface micromachining** you build on top of the wafer: deposit a *sacrificial* oxide, open anchor holes,\ndeposit structural polysilicon, pattern it, then dissolve the oxide in hydrofluoric acid (HF). This **release** step\nleaves beams and plates hanging 1–2 µm above the substrate, attached only at the anchors. The 3D figure above walks\nthrough exactly this sequence to make a cantilever, the part that [B3](#B3)\nanalyses.\n\n**Stiction: the curse of release.** After the HF, the wafer is rinsed in water and dried. As the last water evaporates\nfrom the 2 µm gap, the meniscus pulls the beam down with the Laplace pressure $\\Delta p=2\\gamma\\cos\\theta/g$ ($\\gamma$ =\nsurface tension, $\\theta$ = contact angle, $g$ = gap). That is 72 kPa for a 2 µm gap, enough to slam a soft beam onto the\nsubstrate, where it sticks for good. This is B1's scaling in action: surface forces ($\\propto\\ell$ or $\\ell^2$) beat spring forces in the micro-world.\nFabs avoid it with **critical-point drying** (CO₂ goes from liquid to gas without a meniscus), HF vapour release, dimples\nunder the plates and anti-stick coatings.\n\n**Soft lithography: microfluidics in rubber.** Microfluidic chips ([C2](#C2),\n[C5](#C5)) are usually not etched at all. A **master** is made\nonce by lithography in a thick negative resist (SU-8, 20–100 µm tall ridges in the shape of the channels). Liquid\n**PDMS** (polydimethylsiloxane, a silicone rubber) mixed 10:1 with a curing agent is poured on, baked at about 65 °C for 2 h\nand peeled off: a perfect negative with the channels as grooves. Punch inlet holes, treat with an oxygen plasma and press\nonto glass: the surfaces bond permanently and seal the channels. PDMS is transparent, gas-permeable (cells can\nbreathe) and cheap, which is why biology labs make their own chips in an afternoon.\n\n**Yield and cost: why MEMS is cheap.** A processed wafer costs maybe €1000–€3000, whether it holds 10 chips or\n10 000. The number of square dies of area $A_{\\text{die}}$ on a wafer of diameter $d_w$ is about\n$$N_{\\text{die}}\\approx\\frac{\\pi(d_w/2)^2}{A_{\\text{die}}}-\\frac{\\pi d_w}{\\sqrt{2A_{\\text{die}}}},$$\nwhere the second term removes the partial dies cut off at the round edge. Random defects (dust, scratches) at a density\n$n_d$ per cm² kill a die if one lands on it; with Poisson statistics the fraction of good dies is $Y=e^{-n_dA_{\\text{die}}}$.\nThe cost of one good die is the wafer cost divided by $N_{\\text{die}}Y$. Small dies win twice, since there are more of them\nand each is less likely to catch a defect. This is how a phone accelerometer can cost less than 50 cents.\n\n```viz\nb2-wafer-yield\n```\n\n## Intuitive examples\n\n1. **The magic angle.** The angle between (100) and (111) planes is $\\arccos(1/\\sqrt3)=54.74°$, and\n   $\\tan54.74°=1.4142=\\sqrt2$ exactly. A KOH V-groove from a 10 µm opening is $10/\\sqrt2=7.07$ µm deep, and from a 100 µm opening 70.71 µm deep.\n2. **A pressure-sensor membrane.** To leave a 1000 µm square, 20 µm thick membrane in a 525 µm wafer, KOH must etch\n   505 µm. Each wall moves inward by $d/\\sqrt2$, so the back-side mask opening must be $1000+\\sqrt2\\cdot505=1714.2$ µm\n   wide. At about 1 µm/min this takes 505 min, about 8.4 h.\n3. **Lithography resolution** $R=k_1\\lambda/\\mathrm{NA}$: i-line projection ($k_1=0.6$, 365 nm, NA 0.5) gives 438 nm; ArF\n   immersion ($k_1=0.3$, 193 nm, NA 1.35) 42.9 nm; EUV ($k_1=0.4$, 13.5 nm, NA 0.33) 16.4 nm. A MEMS proximity aligner at\n   a 10 µm gap gives $\\sqrt{\\lambda g}=1.91$ µm, and at 40 µm 3.82 µm.\n4. **Oxide growth** (wet, 1100 °C, $A_{\\text{DG}}=0.11$ µm, $B_{\\text{DG}}=0.51$ µm²/h): 0.5 µm takes 0.60 h, 1 µm takes\n   2.18 h and 2 µm takes 8.27 h, four times longer for twice the thickness, as diffusion through the oxide predicts. The 1 µm oxide\n   consumes 0.44 µm of silicon.\n5. **Spin coating.** A resist that gives 1.4 µm at 4000 rpm gives 2.80 µm at 1000 rpm, 1.98 µm at 2000 rpm and 1.14 µm\n   at 6000 rpm. LPCVD poly at 10 nm/min needs 200 min for a 2 µm structural layer.\n6. **Isotropic vs DRIE.** A 4 µm opening etched 10 µm deep isotropically ends up 24 µm wide at the top. DRIE cuts a 2 µm\n   wide, 40 µm deep trench (aspect ratio 20) in 80 cycles of 0.5 µm; at 8 s per cycle that is 640 s, about 10.7 min.\n7. **Stiction.** Water drying in a 2 µm gap: $\\Delta p=2\\gamma/g=72$ kPa, a force of 720 µN on a 100 µm × 100 µm plate.\n   A 1 N/m spring pulled down 2 µm resists with only 2 µN, so the capillary force wins 360 times.\n8. **Cost per die** (200 mm wafer, €2000, $n_d=0.5$ cm⁻²): 2 mm × 2 mm dies give $N_{\\text{die}}=7631$, $Y=0.9802$,\n   €0.267 per good die. 10 mm × 10 mm dies give 269 dies with $Y=0.6065$: €12.26 each, 46 times more for 25 times the area.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $\\theta_{111}=\\arccos(1/\\sqrt3)=54.74°$, $\\tan\\theta_{111}=\\sqrt2$ | angle of KOH side walls on a (100) wafer | (100), (111) crystal planes |\n| $d=\\tfrac W2\\tan54.74°=W/\\sqrt2\\approx0.707\\,W$ | self-limiting depth of a KOH V-groove | $W$ mask opening, $d$ depth |\n| $W_{\\text{back}}=W_{\\text{mem}}+\\sqrt2\\,d$ | back-side opening for a membrane of width $W_{\\text{mem}}$ | $d$ etch depth |\n| $R=k_1\\lambda/\\mathrm{NA}$; $W_{\\min}\\approx\\sqrt{\\lambda g}$ | smallest printable feature (projection; proximity) | $\\lambda$ wavelength, NA numerical aperture, $g$ mask gap |\n| $t_{\\text{ox}}^2+A_{\\text{DG}}t_{\\text{ox}}=B_{\\text{DG}}t$ | Deal–Grove oxidation: thick oxide grows as $\\sqrt t$ | $t_{\\text{ox}}$ oxide thickness, $t$ time |\n| $t_{\\text{resist}}\\propto1/\\sqrt{\\text{rpm}}$ | spin-coated film thickness | rpm spin speed |\n| $\\Delta p=2\\gamma\\cos\\theta/g$ | capillary pressure that causes stiction | $\\gamma$ surface tension, $\\theta$ contact angle |\n| $N_{\\text{die}}\\approx\\dfrac{\\pi d_w^2}{4A_{\\text{die}}}-\\dfrac{\\pi d_w}{\\sqrt{2A_{\\text{die}}}}$, $Y=e^{-n_dA_{\\text{die}}}$ | dies per wafer and Poisson yield | $d_w$ wafer diameter, $n_d$ defect density |\n| cost per good die $=\\dfrac{\\text{wafer cost}}{N_{\\text{die}}Y}$ | why small chips are cheap | |\n\n## Applications\n\n| World | Microfabrication | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | a sap-flow chip is a sputtered platinum heater on a KOH-etched membrane; soil-moisture probes use lithographed interdigitated electrodes | the thin membrane (small heat capacity, B1) makes the heater respond in ms and sip power |\n| 🧬 Biology & human health | glucose strips are screen-printed or sputtered electrodes; organ-on-chip devices are PDMS cast from an SU-8 master | a biology lab can make its own channels from one master, many times over ([C5](#C5)) |\n| 🌍 Environment | metal-oxide gas sensors sit on 1–2 µm suspended membranes released by KOH or DRIE; water-quality chips are glass or PDMS microfluidics | a suspended membrane lets a 300 °C hot plate run on a few mW |\n| 🤖 Robotics & drones | IMU gyroscopes are DRIE-etched silicon combs 20–60 µm thick with µm gaps, sealed in vacuum at wafer level | vertical DRIE walls give large capacitance and mass in a small die ([B4](#B4)) |\n| 🚗 Cars | tyre-pressure sensors use KOH membranes with diffused piezoresistors; airbag accelerometers are surface-micromachined polysilicon | the 54.74° geometry sets the die size of every piezoresistive pressure sensor ([A4](#A4)) |\n| 📱 Phones & photography | MEMS microphones have a 1 µm polysilicon membrane released over a back-plate; the CMOS image sensor is made with the same lithography | billions of identical dies per year at cents each: small die, high yield ([B5](#B5), [A5](#A5)) |\n| 🏠 Home & household | smoke and CO detectors, thermostat humidity sensors (polymer film between lithographed electrodes), inkjet printheads (DRIE nozzles) | the same batch process makes devices that cost less than their packaging |\n\n## Derivation\n\n**(a) The 54.74° angle.**\n1. The (100) plane has normal $\\mathbf n_1=(1,0,0)$; a (111) plane has normal $\\mathbf n_2=(1,1,1)/\\sqrt3$.\n2. The angle between planes is the angle between normals: $\\cos\\theta=\\mathbf n_1\\cdot\\mathbf n_2=1/\\sqrt3$.\n3. $\\theta=\\arccos(0.5774)=54.74°$; then $\\sin\\theta=\\sqrt{2/3}$ and $\\tan\\theta=\\sqrt{2/3}/\\sqrt{1/3}=\\sqrt2$.\n\n**(b) V-groove depth and membrane opening.**\n1. The (111) wall makes the angle $\\theta=54.74°$ with the wafer surface; it starts at the mask edge (KOH barely undercuts).\n2. Going a horizontal distance (run) $r$ inward from the edge, the wall drops by $r\\tan\\theta=\\sqrt2\\,r$.\n3. The two walls of a groove of opening $W$ meet in the middle, at a run of $W/2$: $d=\\tfrac W2\\tan\\theta=W/\\sqrt2$.\n4. There the (100) floor has vanished, only slow (111) planes are exposed, and the etch practically stops: the groove is self-limiting.\n5. Turned around, a wall that has reached depth $d$ has moved inward by $d/\\tan\\theta=d/\\sqrt2$ on each side.\n6. So a membrane (or flat floor) of width $W_{\\text{mem}}$ at depth $d$ needs a mask opening $W_{\\text{back}}=W_{\\text{mem}}+2d/\\sqrt2=W_{\\text{mem}}+\\sqrt2\\,d$.\n\n**(c) Isotropic undercut.** The etch front moves at the same speed in every direction, so from each mask edge it is a\nquarter circle of radius $d$: the top width becomes $W+2d$.\n\n**(d) Lithography limit.**\n1. A grating of period $p$ diffracts light at angles $\\sin\\vartheta=\\lambda/p$.\n2. The lens must capture at least the first diffracted order to form an image: $\\lambda/p\\le\\mathrm{NA}$.\n3. So $p_{\\min}=\\lambda/\\mathrm{NA}$ and the half-pitch $R=p/2=0.5\\,\\lambda/\\mathrm{NA}$; process tricks push the factor $k_1$\n   down to about 0.25–0.3.\n\n**(e) Deal–Grove.**\n1. Oxygen flux through an oxide of thickness $t_{\\text{ox}}$ is $\\propto1/(t_{\\text{ox}}+\\text{const})$ (Fick's law plus surface reaction).\n2. The growth speed $dt_{\\text{ox}}/dt\\propto$ flux: $(2t_{\\text{ox}}+A_{\\text{DG}})\\,dt_{\\text{ox}}=B_{\\text{DG}}\\,dt$.\n3. Integrate from 0: $t_{\\text{ox}}^2+A_{\\text{DG}}t_{\\text{ox}}=B_{\\text{DG}}t$. For thick oxides $t_{\\text{ox}}\\approx\\sqrt{B_{\\text{DG}}t}$.\n\n**(f) Yield and cost.**\n1. Defects land at random, on average $n_dA_{\\text{die}}$ per die (Poisson).\n2. The probability of zero defects is $Y=e^{-n_dA_{\\text{die}}}$.\n3. Good dies $=N_{\\text{die}}Y$; cost per good die $=$ wafer cost $/(N_{\\text{die}}Y)$, which grows faster than the area.\n\n## Worked check\n\n**A KOH V-groove for an optical fibre.** A (100) wafer gets a 60 µm wide mask opening.\n- Depth: $d=\\tfrac{60}{2}\\tan54.74°=30\\times1.4142=42.43$ µm.\n- Check the run: $d/\\tan54.74°=42.43/1.4142=30.00$ µm $=W/2$ ✓ (the two walls meet in the middle).\n- Length of each sloping wall: $(W/2)/\\cos54.74°=30/0.5774=51.96$ µm.\n- At 1 µm/min the groove self-limits after about 42.4 min, so over-etching does no harm.\n- If instead you want a flat-bottomed trench 60 µm wide at a depth of 20 µm, the mask opening must be $60+\\sqrt2\\cdot20=88.28$ µm.\n- A common slip is to divide by $\\tan54.74°$ instead of multiplying; it would give 21.21 µm, half the true depth.\n\n**Cost of one good die** (200 mm wafer, €2000, $n_d=0.5$ cm⁻², 2 mm × 2 mm): $\\pi\\,100^2/4=7853.98$ minus\n$\\pi\\,200/\\sqrt8=222.14$ gives 7631 dies; $Y=e^{-0.5\\times0.04}=0.9802$; $2000/(7631\\times0.9802)=0.267$, so €0.267 per good die.\n\nAll numbers come from `scripts/checks/B2_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1: the stencil.** Draw a wafer cross-section, a resist layer and a mask above with UV arrows. Write\n  \"spin → expose → develop → etch → strip\". Say: \"Spray paint through a stencil, thousands of chips at once.\"\n- **Panel 2: the layer cake.** Stack: Si, oxide (sacrificial), poly (structural), resist. Then the same stack after\n  patterning and the HF release: a beam hanging over an empty gap with one anchor. Label \"surface micromachining\".\n- **Panel 3: three etch profiles.** Side by side: a rounded isotropic bowl with undercut $d$; a KOH V with 54.74° marked\n  and $d=W/\\sqrt2$; a DRIE trench with straight walls and scallops. Write the cube and its (111) plane in a corner.\n- **Panel 4: resolution.** Write $R=k_1\\lambda/\\mathrm{NA}$ and a 3-row table: 365 nm → 438 nm, 193 nm immersion → 43 nm,\n  EUV → 16 nm. Say: \"MEMS needs 1 µm; your laptop's chip needs 20 nm.\"\n- **Panel 5: stiction.** A beam above the substrate with a drop of water in the gap and the arrow $\\Delta p=2\\gamma/g=72$ kPa.\n  Say: \"B1 again: surface forces win at the micro-scale.\"\n- **Panel 6: the wafer map.** A circle full of squares with a few red dots (defects). Write $Y=e^{-n_dA_{\\text{die}}}$ and\n  \"cost per good die = wafer cost / (N·Y)\".\n\n## Common mistakes and where the intuition breaks\n\n- **Dividing instead of multiplying by tan 54.74°.** The (111) wall is steep: it drops $\\sqrt2$ for each unit it moves\n  sideways. A V-groove is deeper ($0.707\\,W$) than it is half-wide. Draw the triangle before using a formula.\n- **Thinking KOH makes any shape.** KOH follows the crystal: a round or diagonal opening still ends in a pit bounded by\n  (111) planes, and convex corners get eaten away (fabs add \"corner compensation\" shapes). For arbitrary shapes, use DRIE.\n- **Positive vs negative resist.** In positive resist the light *removes* resist; the mask's chrome is what remains. In\n  negative resist (SU-8) the light *keeps* it. Mixing them up inverts the whole device.\n- **\"Resolution is just the wavelength.\"** Real limits also include resist thickness, depth of focus, alignment between masks\n  (often the real limit in MEMS, about 0.5–1 µm) and the etch, which can widen or undercut the printed line.\n- **Ignoring stress.** Deposited films are rarely stress-free. Compressive poly buckles fixed-fixed beams; stress gradients\n  curl released cantilevers. Annealing and folded springs ([B3](#B3)) are the\n  remedies.\n- **Forgetting the release.** Surface-micromachined parts stick if dried naively. Stiction and particles cause most yield loss in MEMS.\n- **Where the picture breaks:** \"a thin film is a perfect box\" is a cartoon. Real films have rounded steps, grains, residual\n  stress and a thickness that varies by a few percent across the wafer, and that variation is what calibration\n  ([A8](#A8)) later has to remove.\n\n## Remember\n\n**\"Deposit, pattern with light, etch, repeat; release last. Crystal planes give 54.74°, plasmas give vertical walls, and small dies are cheap.\"**\n\n## Self-test\n\n1. A square KOH mask opening of 200 µm × 200 µm is etched on a (100) wafer until it stops. What shape results, and how deep is it?\n   <details><summary>Answer<\/summary>An inverted square pyramid bounded by four (111) planes, each sloping at 54.74°. The walls meet at the centre after a run of 100 µm, so the depth is 100 × tan 54.74° = 100 × 1.414 ≈ 141 µm.<\/details>\n2. Why do surface-micromachined beams stick to the substrate after release, and name two cures.\n   <details><summary>Answer<\/summary>As the rinse water dries in the 1–2 µm gap, its meniscus pulls with a Laplace pressure 2γ cos θ / g of order 70 kPa, far more than a soft spring can resist; once in contact, surface forces keep the beam stuck. Cures: critical-point drying with CO₂ (no meniscus), HF-vapour release, dimples that reduce the contact area, hydrophobic anti-stiction coatings.<\/details>\n3. A die of 1 cm² on a wafer with 0.5 defects per cm² has what yield? What if the die is shrunk to 0.25 cm²?\n   <details><summary>Answer<\/summary>Y = e^(−0.5×1) = 0.61 for 1 cm²; e^(−0.5×0.25) = 0.88 for 0.25 cm². The smaller die also fits about 4× more per wafer, so the cost per good die falls by more than 5×.<\/details>\n\n**Next:** [B3 Micromechanics: beams, springs and resonators](#B3): we can now build a released silicon beam; next we calculate how stiff it is and at what frequency it rings.\n"}, {"id": "B3", "short": "Micromechanics: beams, springs and resonators", "title": "Micromechanics: beams, springs and resonators", "part": "B", "md": "# B3. Micromechanics: beams, springs and resonators\n\n> **Connects:** builds on [B1 Scaling laws](#B1) (why small things are stiff and ring fast), [B2 Microfabrication](#B2) (how the beam is made), [A2 Resistive sensors and the Wheatstone bridge](#A2) (strain), [A8 Noise, resolution, calibration and drift](#A8) (thermal noise) · used by [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [A9 Sensor fusion and the Kalman filter](#A9)\n\n## Hook — a diving board and a singing wine glass\n\nWalk to the end of a diving board and it bends. A light child bends it a little, a heavy adult more, in proportion:\ntwice the weight, twice the bend. A thicker board barely moves at all. Step off and the board does not just return; it\nswings up and down a few times before it settles, always at the same rhythm.\n\nRun a wet finger around the rim of a wine glass and it sings one clear note. Tap it and it rings for seconds at that same\npitch. A good crystal glass rings longer than a cheap one, and if a singer hits exactly that pitch loudly enough, the glass\ncan shatter.\n\n**A silicon beam inside a MEMS chip does both, a million times smaller.** It bends in proportion to the force, which is\na **spring**. It has a mass and rings at its own natural frequency, which is a **resonator**. How long it keeps ringing is its\nquality factor. With three formulas (the beam stiffness, the natural frequency and the resonance curve) you can design\nthe springs of an accelerometer, the membrane of a microphone and the cantilever of an atomic-force microscope that feels\nsingle atoms.\n\n## The idea in plain words\n\n**Stress, strain and Young's modulus.** Pull on a bar and it gets slightly longer. The **strain** $\\varepsilon$ is the\nrelative change in length, $\\Delta L/L$; it has no units and is tiny (a strain of $10^{-4}$, written 100 µε, means\n0.01%). The **stress** $\\sigma$ is the force per unit area that causes it, in pascals (N/m²). For small strains they are\nproportional, $\\sigma=E\\varepsilon$ (Hooke's law), and the constant $E$ is **Young's modulus**: how stiff the material is.\nRubber is about 0.01 GPa, PDMS 0.001–0.003 GPa, aluminium 70 GPa, steel 200 GPa. Single-crystal silicon is 130–169 GPa, depending on the direction:\n**169 GPa along a ⟨110⟩ direction**, the usual beam direction on a (100) wafer, and 130 GPa along ⟨100⟩. Silicon is as stiff\nas steel, a third as heavy, perfectly elastic (no creep, no fatigue at normal stress) and it breaks only at about 1 GPa.\nThat combination is why silicon springs can bend billions of times without changing.\n\n**Bending a cantilever.** A **cantilever** is a beam clamped at one end and free at the other, like a diving board. Let it\nhave length $L$, width $w$ and thickness $t$ (in the bending direction), and push down on its tip with a force $F$. The\nbeam bends, with the top surface stretched and the bottom squeezed. The stiffness against bending depends on the\n**second moment of area** $I_A=wt^3/12$, which measures how far the material sits from the middle of the beam. Material far from the middle resists bending the most, which is why it enters as $t^3$. The tip deflection\nand the spring constant $k=F/x$ are\n$$x=\\frac{FL^3}{3EI_A},\\qquad k=\\frac{3EI_A}{L^3}=\\frac{Ewt^3}{4L^3}.$$\nRead the exponents. Doubling the width doubles $k$, since two beams side by side are twice as stiff. Doubling the thickness\nmakes it **8 times** stiffer. Doubling the length makes it **8 times** softer. The strain is largest at the clamped root, on the\nsurface: $\\varepsilon=\\sigma/E$ with $\\sigma=6FL/(wt^2)$. That is where a piezoresistor\n([A2](#A2), [A4](#A4))\nshould sit to read the bending.\n\n```viz\nb3-cantilever-3d\n```\n\n**Other springs from the same beam.** Clamp both ends and push in the middle: a **fixed-fixed** (bridge) beam is\n$192EI_A/L^3$, 64 times stiffer than the cantilever. Clamp one end and let the other slide without rotating: a\n**guided** beam is $12EI_A/L^3$. MEMS designers combine these like resistors. Springs in **series** add their *compliances*\n($1/k$); springs in **parallel** add their stiffnesses. A **folded spring** puts two guided beams in series and four such folds\nin parallel around a proof mass: $k=4\\times\\tfrac12\\times12EI_A/L^3=24EI_A/L^3$. Folding gives a long, soft spring in a small area.\nMore important, the fold lets the beams expand freely, so residual stress from fabrication\n([B2](#B2)) and temperature changes do not change the stiffness,\nas they would for a fixed-fixed beam.\n\n**The mass–spring–damper.** Any spring carrying a mass, with some friction, obeys Newton's second law:\n$$m\\ddot x+b\\dot x+kx=F(t).$$\nHere $x$ is the displacement, $\\dot x$ the velocity, $\\ddot x$ the acceleration, $m$ the mass, $k$ the spring constant,\n$b$ the **damping** coefficient (friction proportional to speed; in MEMS mostly from the air squeezed in the gaps) and $F(t)$\nthe applied force. Three numbers describe it:\n- the **natural frequency** $\\omega_0=\\sqrt{k/m}$ (in rad/s; $f_0=\\omega_0/2\\pi$ in Hz), the pitch it rings at;\n- the **quality factor** $Q_f=\\sqrt{km}/b$, roughly the number of swings it rings before the amplitude falls to $e^{-\\pi}\\approx4\\%$;\n- the **static deflection** $x=F/k$ for a slow, steady force.\n\nA beam is not a point mass, but its first bending mode acts like one with an **effective mass** $m_{\\text{eff}}\\approx0.243$\nof the beam mass (for a cantilever loaded at the tip), so $f_0=\\tfrac1{2\\pi}\\sqrt{k/m_{\\text{eff}}}$. The exact first-mode\nresult for a cantilever is $f_0=\\dfrac{1.875^2}{2\\pi}\\dfrac{t}{L^2}\\sqrt{\\dfrac{E}{12\\rho}}=0.1615\\,\\dfrac{t}{L^2}\\sqrt{\\dfrac E\\rho}$,\nwhere $\\rho$ is the density. Thickness raises the pitch, and length lowers it quadratically.\n\n**Frequency response: the resonance peak.** Shake the mass with a force $F_0\\cos\\omega t$. After the start-up dies away,\nit moves at the same frequency with amplitude $X$ and a lag $\\varphi$:\n$$X(\\omega)=\\frac{F_0/k}{\\sqrt{(1-r^2)^2+(r/Q_f)^2}},\\qquad \\tan\\varphi=\\frac{r/Q_f}{1-r^2},\\qquad r=\\frac{\\omega}{\\omega_0}.$$\nThere are three regimes. **Below resonance** ($r\\ll1$) the spring dominates: $X\\approx F_0/k$, in phase. This is how an\naccelerometer works ([B4](#B4)). **At resonance** ($r=1$) the spring\nand the mass cancel and only damping limits the motion: $X=Q_f\\,F_0/k$, lagging by 90°. **Above resonance** the mass\ndominates: $X\\approx F_0/(m\\omega^2)$, falling as $1/\\omega^2$ and in anti-phase (180°). The peak's width at $1/\\sqrt2$ of its\nheight is $\\Delta f=f_0/Q_f$. A high $Q_f$ means a tall, narrow peak and a long ring-down, with time constant\n$2Q_f/\\omega_0$.\n\n```viz\nb3-resonance\n```\n\n**Thermomechanical (Brownian) noise.** The same air molecules that cause the damping $b$ also kick the beam at random.\nThis is not a coincidence: the fluctuation–dissipation theorem says that every damper is also a noise source. The random\nforce has a flat spectral density\n$$F_n=\\sqrt{4k_BT\\,b}\\quad[\\text{N}/\\sqrt{\\text{Hz}}],$$\nexactly like the Johnson noise $\\sqrt{4k_BTR}$ of a resistor in [A8](#A8). Its\ntotal effect obeys equipartition: $\\tfrac12k\\langle x^2\\rangle=\\tfrac12k_BT$, so the rms thermal motion is\n$x_{\\text{rms}}=\\sqrt{k_BT/k}$. A soft AFM cantilever ($k=0.1$ N/m) jiggles by 0.20 nm rms at room temperature, about one\natom's size. This sets the floor for every MEMS sensor (B1's \"price of small\"). To lower it, make $b$ small (high $Q_f$,\nvacuum packaging) or the mass large.\n\n**Mass sensing by frequency shift.** Add a tiny mass $\\Delta m$ to a resonator and its pitch drops. Since\n$f_0\\propto m^{-1/2}$, a small relative change obeys\n$$\\frac{\\Delta f}{f_0}=-\\frac{\\Delta m}{2m}.$$\nFrequency is the easiest quantity in physics to measure precisely (counting cycles against a quartz clock), so this turns a\nresonator into an extraordinarily sensitive balance. A **quartz crystal microbalance (QCM)** oscillates at 5 MHz in a\nthickness-shear mode and detects nanograms per cm² of film ($\\Delta f/f_0=-\\Delta m/m_q$, the Sauerbrey equation, where $m_q$\nis the quartz mass per area). An AFM cantilever with a virus stuck to its tip shifts by hertz. Nanomechanical resonators\nweigh single proteins. High $Q_f$ helps again, because a narrow peak makes a small shift easy to see.\n\n**The electrical analogy.** A series RLC circuit obeys $L_{\\text{ind}}\\ddot q+R\\dot q+q/C=V(t)$: the same equation, with\n$m\\leftrightarrow L_{\\text{ind}}$, $b\\leftrightarrow R$, $k\\leftrightarrow1/C$, $F\\leftrightarrow V$, $x\\leftrightarrow q$ and\n$\\dot x\\leftrightarrow I$. So $\\omega_0=1/\\sqrt{L_{\\text{ind}}C}$ and $Q_f=\\tfrac1R\\sqrt{L_{\\text{ind}}/C}$. Engineers draw MEMS\nresonators as RLC circuits (\"motional\" parameters) and simulate the mechanics and the electronics together.\n\n## Intuitive examples\n\n1. **A reference cantilever**, silicon, $L=200$ µm, $w=20$ µm, $t=2$ µm, $E=169$ GPa, $\\rho=2330$ kg/m³:\n   $k=Ewt^3/(4L^3)=0.8450$ N/m and $f_0=68.79$ kHz. Its mass is $1.864\\times10^{-11}$ kg (19 ng) and $m_{\\text{eff}}=4.523\\times10^{-12}$ kg (0.2427 of it).\n2. **Push on it** with $F=1$ µN (the weight of 0.1 mg): the tip moves 1.183 µm, the root stress is 15.0 MPa and the\n   surface strain 88.8 µε. A piezoresistor with gauge factor 100 would change by about 0.9%.\n3. **The $t^3$ effect.** Make it 4 µm thick: $k=6.760$ N/m (×8) and $f_0=137.6$ kHz (×2). Make it 400 µm long instead:\n   $k=0.1056$ N/m (÷8) and $f_0=17.20$ kHz (÷4).\n4. **AFM cantilevers.** Contact mode: 450 × 50 × 2 µm gives $k=0.185$ N/m and $f_0=14$ kHz (soft, so it does not scratch\n   the sample). Tapping mode: 125 × 30 × 4 µm gives $k=41.5$ N/m and $f_0=352$ kHz (stiff and fast).\n5. **One beam, four springs** (the same 200 × 20 × 2 µm beam): cantilever $3EI_A/L^3=0.845$ N/m, guided 3.380 N/m, folded\n   (4 folds) 6.760 N/m, fixed-fixed loaded in the middle 54.08 N/m.\n6. **Ringing.** With $Q_f=100$ in air, the reference cantilever's peak is $68.79/100=688$ Hz wide and it rings down with\n   $\\tau=2Q_f/\\omega_0=0.463$ ms. The 32 768 Hz quartz tuning fork in a watch has $Q_f\\approx10^5$: a 0.328 Hz wide peak and\n   $\\tau=0.97$ s. At $Q_f=10$, driving at half the resonance gives $X=1.3304\\,F_0/k$ (phase 3.8°); at twice the resonance,\n   $0.3326\\,F_0/k$ (phase 176.2°).\n7. **Brownian motion.** Reference cantilever with $Q_f=100$: $b=\\sqrt{km_{\\text{eff}}}/Q_f=1.955\\times10^{-8}$ N·s/m, force noise\n   $\\sqrt{4k_BTb}=17.9$ fN/√Hz, $x_{\\text{rms}}=\\sqrt{k_BT/k}=0.070$ nm. At the peak the motion density is\n   $Q_f F_n/k=2.12$ pm/√Hz.\n8. **Weighing.** Add 1 pg to the reference cantilever ($m_{\\text{eff}}=4523$ pg): $\\Delta f/f_0=-1.11\\times10^{-4}$, so\n   $\\Delta f=-7.60$ Hz. A 5 MHz QCM (quartz 334 µm thick, 88.44 mg/cm²) shifts by $-5.65$ Hz for 100 ng/cm², a sensitivity\n   of 56.5 Hz·cm²/µg.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $\\sigma=E\\varepsilon$ | Hooke's law | $\\sigma$ stress, $\\varepsilon$ strain, $E$ Young's modulus (Si ⟨110⟩ 169 GPa) |\n| $I_A=wt^3/12$ | second moment of area of a rectangle | $w$ width, $t$ thickness in the bending direction |\n| $k=\\dfrac{3EI_A}{L^3}=\\dfrac{Ewt^3}{4L^3}$ | cantilever tip stiffness | $L$ length |\n| $\\sigma_{\\max}=\\dfrac{6FL}{wt^2}$ | surface stress at the root | $F$ tip force |\n| $k_{\\text{guided}}=\\dfrac{12EI_A}{L^3}$, $k_{\\text{folded}}=\\dfrac{24EI_A}{L^3}$, $k_{\\text{ff}}=\\dfrac{192EI_A}{L^3}$ | other springs; series adds $1/k$, parallel adds $k$ | ff = fixed-fixed, centre load |\n| $m\\ddot x+b\\dot x+kx=F$ | mass–spring–damper | $m$ mass, $b$ damping |\n| $\\omega_0=\\sqrt{k/m}$, $Q_f=\\sqrt{km}/b$ | natural frequency, quality factor | $f_0=\\omega_0/2\\pi$ |\n| $f_0=0.1615\\,\\dfrac{t}{L^2}\\sqrt{\\dfrac E\\rho}$ | first mode of a cantilever | $\\rho$ density |\n| $X=\\dfrac{F_0/k}{\\sqrt{(1-r^2)^2+(r/Q_f)^2}}$, $\\tan\\varphi=\\dfrac{r/Q_f}{1-r^2}$ | driven amplitude and phase lag | $r=\\omega/\\omega_0$ |\n| $X(\\omega_0)=Q_fF_0/k$, $\\Delta f=f_0/Q_f$ | resonant gain and bandwidth | |\n| $F_n=\\sqrt{4k_BTb}$, $x_{\\text{rms}}=\\sqrt{k_BT/k}$ | thermomechanical noise | $k_B$ Boltzmann, $T$ temperature |\n| $\\Delta f/f_0=-\\Delta m/(2m)$ | mass sensing | $\\Delta m$ added mass |\n| $m,b,k,F\\leftrightarrow L_{\\text{ind}},R,1/C,V$ | the RLC analogy | |\n\n## Applications\n\n| World | Beams, springs and resonators | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | QCM and cantilever gas sensors coated with a polymer sniff ethylene (the ripening hormone) and plant volatiles; a mass uptake of ng lowers $f_0$ | storage rooms can catch over-ripening fruit early; $\\Delta f/f_0=-\\Delta m/2m$ is the transfer function |\n| 🧬 Biology & human health | AFM cantilevers ($k\\approx0.1$ N/m) image cells and measure their stiffness; resonant cantilevers with antibodies weigh bound viruses; hearing-aid microphones are tiny membranes | $x_{\\text{rms}}=\\sqrt{k_BT/k}$ (0.2 nm) sets the force floor of single-molecule experiments |\n| 🌍 Environment | resonant particulate (PM2.5) sensors weigh the dust that lands on a microbalance; QCMs monitor film deposition and humidity | a QCM's 56.5 Hz·cm²/µg makes nanograms visible |\n| 🤖 Robotics & drones | the folded springs of IMU accelerometers and gyroscopes; gyroscopes are driven at resonance with high $Q_f$ in vacuum | stiffness sets the sensitivity $x=ma/k$; $Q_f$ sets the gyro's gain and its noise ([B4](#B4)) |\n| 🚗 Cars | airbag accelerometers use soft folded springs with near-critical damping ($Q_f\\approx0.5$–1), so they do not ring after a bump | a resonance peak would turn road vibration into false crash signals; damping keeps the response flat |\n| 📱 Phones & photography | MEMS timing resonators replace quartz; microphone membranes and OIS actuators are springs; FBAR filters are acoustic resonators that pick out the radio bands | resonance frequency and $Q_f$ decide the clock accuracy and the filter sharpness |\n| 🏠 Home & household | the quartz tuning fork (32 768 Hz, $Q_f\\approx10^5$) in every clock; the cantilever load cell in a kitchen scale ([A1](#A1)) | the same $k=Ewt^3/4L^3$ at the cm scale and the same $Q_f$ at the µm scale |\n\n## Derivation\n\n**(a) Beam bending (Euler–Bernoulli).**\n1. A tip force $F$ makes a bending moment $M(x)=F(L-x)$ at distance $x$ from the clamp.\n2. Bending curves the beam: curvature $=M/(EI_A)$, so $\\dfrac{d^2z}{dx^2}=\\dfrac{F(L-x)}{EI_A}$, with $z$ the deflection.\n3. Integrate twice with $z(0)=z'(0)=0$ (clamped): $z(x)=\\dfrac{F}{6EI_A}(3Lx^2-x^3)$.\n4. At the tip: $z(L)=\\dfrac{FL^3}{3EI_A}$, so $k=\\dfrac{3EI_A}{L^3}$; with $I_A=wt^3/12$, $k=\\dfrac{Ewt^3}{4L^3}$.\n5. Stress at the surface ($t/2$ from the middle): $\\sigma=\\dfrac{M\\,t/2}{I_A}=\\dfrac{6F(L-x)}{wt^2}$, largest at the root.\n\n**(b) Springs in series and parallel.**\n1. Parallel: the same $x$, forces add: $k=k_1+k_2$.\n2. Series: the same $F$, displacements add: $1/k=1/k_1+1/k_2$.\n3. Folded flexure: two guided beams in series ($12EI_A/L^3\\div2$), four folds in parallel: $4\\times6EI_A/L^3=24EI_A/L^3$.\n\n**(c) Free vibration.**\n1. With $F=0$ and $b=0$: $m\\ddot x=-kx$. Try $x=X\\cos\\omega t$: $-m\\omega^2X=-kX$ ⇒ $\\omega_0=\\sqrt{k/m}$.\n2. With damping, try $x=e^{st}$: $ms^2+bs+k=0$ ⇒ $s=-\\dfrac{b}{2m}\\pm i\\,\\omega_0\\sqrt{1-\\tfrac{1}{4Q_f^2}}$.\n3. The amplitude decays as $e^{-bt/2m}=e^{-\\omega_0t/(2Q_f)}$: time constant $\\tau=2Q_f/\\omega_0$.\n\n**(d) Forced response.**\n1. Drive $F=F_0e^{i\\omega t}$ (real part understood); try $x=\\hat Xe^{i\\omega t}$, so $\\dot x=i\\omega x$ and $\\ddot x=-\\omega^2x$.\n2. Substitute: $(k-m\\omega^2+i\\,b\\omega)\\hat X=F_0$.\n3. Divide by $k$, using $m/k=1/\\omega_0^2$ and $b\\omega/k=r/Q_f$: $\\hat X=\\dfrac{F_0/k}{1-r^2+i\\,r/Q_f}$.\n4. Magnitude: $X=\\dfrac{F_0/k}{\\sqrt{(1-r^2)^2+(r/Q_f)^2}}$; phase lag: $\\tan\\varphi=\\dfrac{r/Q_f}{1-r^2}$.\n5. At $r=1$: $X=Q_fF_0/k$, $\\varphi=90°$. The half-power points satisfy $\\lvert1-r^2\\rvert\\approx r/Q_f$ ⇒ $\\Delta r\\approx1/Q_f$, so $\\Delta f=f_0/Q_f$.\n\n**(e) Thermal noise.**\n1. Equipartition: each quadratic energy term holds $\\tfrac12k_BT$ on average, so $\\tfrac12k\\langle x^2\\rangle=\\tfrac12k_BT$.\n2. Fluctuation–dissipation: the damper $b$ comes with a white random force of density $4k_BTb$ (N²/Hz).\n3. Check: integrating $\\lvert X(\\omega)/F\\rvert^2\\cdot4k_BTb$ over all frequencies gives exactly $k_BT/k$.\n\n**(f) Mass sensing.**\n1. $f_0=\\tfrac1{2\\pi}\\sqrt{k/m}$, so $\\ln f_0=\\text{const}-\\tfrac12\\ln m$.\n2. Differentiate: $\\dfrac{df_0}{f_0}=-\\dfrac12\\dfrac{dm}{m}$, so $\\dfrac{\\Delta f}{f_0}\\approx-\\dfrac{\\Delta m}{2m}$ for small $\\Delta m$.\n\n## Worked check\n\nA cantilever with $L=300$ µm, $w=10$ µm, $t=3$ µm in ⟨110⟩ silicon:\n- $I_A=wt^3/12=10\\times27/12\\times10^{-24}=2.25\\times10^{-23}$ m⁴.\n- $k=3EI_A/L^3=3\\times169\\times10^9\\times2.25\\times10^{-23}/(2.7\\times10^{-11})=0.4225$ N/m.\n- $f_0=0.16154\\times(3\\times10^{-6})/(9\\times10^{-8})\\times8517=45.86$ kHz; $m=\\rho Lwt=2.097\\times10^{-11}$ kg; $m_{\\text{eff}}=k/\\omega_0^2=5.089\\times10^{-12}$ kg.\n- A 0.2 µN tip force bends it by $0.2\\times10^{-6}/0.4225=0.473$ µm, with root stress $6FL/(wt^2)=4.00$ MPa (23.7 µε).\n- Driven at resonance with $F_0=1$ nN and $Q_f=50$: $X=Q_fF_0/k=118.34$ nm; bandwidth $f_0/Q_f=917$ Hz.\n- Add 10 pg: $\\Delta f=-f_0\\,\\Delta m/(2m_{\\text{eff}})=-45.1$ Hz.\n- RLC twin: $L_{\\text{ind}}=1$ mH, $C=1$ µF, $R=10$ Ω gives $f_0=5033$ Hz and $Q_f=3.16$.\n\nAll numbers come from `scripts/checks/B3_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1: the diving board.** Draw a clamped beam, a tip force $F$, the bent shape. Write $k=Ewt^3/(4L^3)$ and circle the\n  $t^3$ and $L^3$. Say: \"Twice as thick, eight times as stiff.\"\n- **Panel 2: where it hurts.** Under the beam draw the moment $M=F(L-x)$ as a triangle, largest at the clamp; write\n  $\\sigma=6FL/(wt^2)$ and draw a piezoresistor at the root.\n- **Panel 3: springs as resistors.** Cantilever, guided beam, fixed-fixed beam, folded spring, with $3,12,24,192\\times EI_A/L^3$.\n  Series adds $1/k$; parallel adds $k$.\n- **Panel 4: the box.** Mass, spring, dashpot; write $m\\ddot x+b\\dot x+kx=F$, $\\omega_0=\\sqrt{k/m}$, $Q_f=\\sqrt{km}/b$.\n- **Panel 5: the peak.** Log-log amplitude vs frequency: flat at $F_0/k$, peak $Q_fF_0/k$, slope $-2$ after. Under it the phase\n  going 0° → 90° → 180°. Mark \"accelerometers live here (left)\" and \"resonant sensors live here (peak)\".\n- **Panel 6: the scale and the noise.** $\\Delta f/f_0=-\\Delta m/2m$ with a virus on a cantilever; next to it $x_{\\text{rms}}=\\sqrt{k_BT/k}$ and\n  the RLC twin.\n\n## Common mistakes and where the intuition breaks\n\n- **Mixing up $w$ and $t$.** $t$ is the dimension *in the bending direction*, and it is cubed. For an in-plane MEMS spring that\n  bends sideways, the cubed dimension is the narrow, lithographically drawn width, not the film thickness.\n- **Using the full mass for $f_0$.** A cantilever's tip moves, but its root does not; only about 24% of the mass \"counts\".\n  For a proof mass on light springs, the proof mass dominates and $m$ is fine.\n- **Forgetting that silicon is anisotropic.** $E$ is 169 GPa along ⟨110⟩ but 130 GPa along ⟨100⟩, a 30% error in $k$ if you\n  pick the wrong one.\n- **Assuming linear forever.** The formulas hold for deflections small compared with the thickness. A fixed-fixed beam\n  stretches when it bends a lot and stiffens (Duffing behaviour); residual stress shifts $f_0$; electrostatic forces soften\n  the spring ([B4](#B4)).\n- **\"High $Q_f$ is always good.\"** A gyroscope or a mass balance wants high $Q_f$; an accelerometer does not, because a sharp peak\n  rings and amplifies vibration. Accelerometers are designed near $Q_f\\approx0.7$ for a flat response.\n- **Ignoring thermal noise.** The floor $\\sqrt{4k_BTb}$ is fundamental; better electronics cannot remove it. Only less damping,\n  more mass or a lower temperature can.\n\n## Remember\n\n**\"$k=Ewt^3/4L^3$, $\\omega_0=\\sqrt{k/m}$, peak $=Q_f\\times$ static; below the peak it is a spring, at the peak a resonator, and mass shifts the pitch by $-\\Delta m/2m$.\"**\n\n## Self-test\n\n1. You need a cantilever 4 times stiffer without changing its length or width. How much thicker must it be, and what happens to $f_0$?\n   <details><summary>Answer<\/summary>k ∝ t³, so t must grow by 4^(1/3) ≈ 1.59. The cantilever frequency is f0 ∝ t / L², so it also rises by 1.59×.<\/details>\n2. A resonator at 100 kHz has Q_f = 10 000. How wide is its resonance peak, and how long does it ring after the drive stops?\n   <details><summary>Answer<\/summary>Bandwidth Δf = f0/Q_f = 10 Hz. Ring-down time constant τ = 2Q_f/ω0 = 20 000 / (2π × 100 000) ≈ 32 ms.<\/details>\n3. A 1 MHz resonator with an effective mass of 1 ng shifts by −5 Hz when a sample lands on it. What mass landed?\n   <details><summary>Answer<\/summary>Δm = −2m Δf/f0 = 2 × 1 ng × 5/10⁶ = 10⁻⁵ ng = 10 fg (femtograms).<\/details>\n\n**Next:** [B4 MEMS inertial sensors: accelerometers and gyroscopes](#B4): put a proof mass on these springs, read its motion with capacitors, and you have the sensor that tells a phone which way is up.\n"}, {"id": "B4", "short": "MEMS inertial sensors: accelerometers and gyroscopes", "title": "MEMS inertial sensors: accelerometers and gyroscopes", "part": "B", "md": "# B4. MEMS inertial sensors: accelerometers and gyroscopes\n\n> **Connects:** builds on [B3 Micromechanics](#B3) (spring–mass, $\\omega_0$, $Q_f$), [A3 Capacitive sensors](#A3) (differential capacitors), [A8 Noise, resolution, calibration and drift](#A8), [B1 Scaling laws](#B1) · used by [B5 MEMS microphones, pressure sensors and actuators](#B5), [A9 Sensor fusion and the Kalman filter](#A9), [C5 Lab-on-a-chip and integrated systems](#C5)\n\n## Hook — a ball on a spring in a box, and a merry-go-round\n\nHang a ball from a spring inside a closed cardboard box. Jerk the box upward and the ball sinks toward the floor of the\nbox; brake a lift and it floats up; tip the box over and the ball sags toward whichever wall is now \"down\". You never\nsee the outside world, yet by watching *where the ball sits inside the box* you know how the box is accelerating and\nwhich way it is tilted. That is an accelerometer.\n\nNow stand on a spinning merry-go-round and roll a ball straight toward a friend on the other side. To you, the ball\ncurves away sideways, although nobody pushed it. That sideways \"push\" is the **Coriolis effect**, and its size is\nproportional to how fast the merry-go-round turns. Keep a mass *moving* inside a chip, watch for a sideways push, and you\nhave a gyroscope.\n\nYour phone contains both, each smaller than a grain of sand. They rotate the screen when you turn it, count your steps,\nfire a car's airbag in 20 ms, and keep a drone level in the wind.\n\n## The idea in plain words\n\n**A proof mass on springs.** Etch a block of silicon, the **proof mass** $m$, and hang it from thin folded beams, the\n**springs** with stiffness $k$, inside a fixed silicon frame (B2 makes this, B3 tells you its stiffness). When the frame\naccelerates with acceleration $a$, the mass only gets dragged along by the springs, so the springs must stretch until\nthey supply the force $F=ma$. At rest in the moving frame, Hooke's law balances Newton's law:\n$$kx=ma\\quad\\Longrightarrow\\quad x=\\frac{m}{k}\\,a=\\frac{a}{\\omega_0^2},\\qquad \\omega_0=\\sqrt{k/m}.$$\nHere $x$ is how far the mass shifts relative to the frame (along the **sense axis**), and $\\omega_0=2\\pi f_0$ is the\nnatural angular frequency of the spring–mass. The mass moves *opposite* to the frame's acceleration: it lags behind.\n\n**The great trade-off: sensitivity against bandwidth.** The formula $x=a/\\omega_0^2$ contains only one design number,\n$\\omega_0$. A soft spring (low $f_0$) gives a big, easy-to-read shift, but the sensor can only follow motions slower\nthan about $f_0$, because above resonance the mass cannot keep up. A stiff spring (high $f_0$) follows fast crashes\nand vibrations, but moves so little that reading it is hard. Halving $f_0$ gives four times the signal and half the\nbandwidth. Every accelerometer is a choice on this line: a phone's screen-rotation sensor sits at a few kHz, an airbag\nsensor at tens of kHz.\n\n**Reading nanometres with a differential comb.** The mass carries rows of **fingers**. Each moving finger sits between two\nfixed fingers, one on each side, with rest gap $g_0$ and facing area $A$. That makes two capacitors (A3):\n$$C_1=\\frac{\\varepsilon_0A}{g_0-x},\\qquad C_2=\\frac{\\varepsilon_0A}{g_0+x}.$$\nWhen the mass shifts, one gap closes and the other opens. The difference\n$C_1-C_2\\approx 2C_0\\,x/g_0$ (with $C_0=\\varepsilon_0A/g_0$) is twice the single change, and anything that changes both\ncapacitors equally (temperature, humidity, the absolute value of $C_0$) cancels. This is the \"divide to compare\" thread of\nthe notebook: a Wheatstone bridge (A2), now made of capacitors. Drive the two outer electrodes with $+V_{\\text{ex}}$ and\n$-V_{\\text{ex}}$ and read the middle one: the output is exactly\n$$V_{\\text{out}}=V_{\\text{ex}}\\frac{C_1-C_2}{C_1+C_2}=V_{\\text{ex}}\\frac{x}{g_0},$$\nlinear in $x$ even for big shifts. The whole chain is: acceleration → force → displacement → capacitance → voltage, and\nthe sensitivity is the product of the four gains (the first convention in notation.md).\n\n```viz\nb4-accelerometer-3d\n```\n\n**What an accelerometer really reads: gravity included.** The spring cannot tell the difference between \"the frame is\nbeing pushed up at 1 g\" and \"the frame sits still on a table while gravity pulls the mass down\". Einstein made a whole\ntheory of this. So an accelerometer at rest reads 1 g *upward*, and the reading along each axis is the component of that\nvector. If the phone is pitched by an angle $\\theta_p$ (nose up) and rolled by $\\phi_r$ (right side up), the three axes read\n$$(a_x,a_y,a_z)=g_{\\text{grav}}\\,(\\sin\\theta_p,\\;\\cos\\theta_p\\sin\\phi_r,\\;\\cos\\theta_p\\cos\\phi_r),$$\nwhere $g_{\\text{grav}}=9.81$ m/s² (bare $g$ is a gap in this notebook). Invert it:\n$$\\theta_p=\\operatorname{atan2}\\!\\big(a_x,\\sqrt{a_y^2+a_z^2}\\big),\\qquad \\phi_r=\\operatorname{atan2}(a_y,a_z).$$\nThat is how a phone rotates its screen, how a spirit-level app works and how a drone knows which way is down. The catch:\nthe formula assumes the phone is not accelerating. A drone that swerves, or a car that brakes, fools it, which is why\naccelerometers are paired with gyroscopes. (Sign conventions for pitch and roll vary between companies; the idea does not.)\n\n**A gyroscope that does not spin.** Old gyroscopes were spinning wheels; MEMS ones are **vibrating masses**. A comb drive\nshakes the mass back and forth along $x$ at its resonance (the **drive mode**), so it always has a velocity\n$\\dot x=\\omega_dX_d\\cos\\omega_dt$, where $X_d$ is the drive amplitude and $\\omega_d$ the drive f
