issipation constant (W/K) |\n\n## Applications\n\n| World | Resistive sensing and bridges | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | NTC leaf-clip thermistors; heat-pulse sap-flow probes with pairs of thermistors in a bridge; stem dendrometers with strain gauges | leaf temperature, water flow in the stem, daily stem shrinking from thirst |\n| 🧬 Biology & human health | thermistor fever thermometers; strain-gauge blood-pressure transducers in hospitals; stretchable resistive patches for breathing | body temperature to 0.1 K, arterial pressure waveform, breathing rate |\n| 🌍 Environment | Pt100 weather-station thermometers; strain-gauge rain and snow weighing gauges; hot-wire anemometers | air temperature, precipitation by weight, wind speed |\n| 🤖 Robotics & drones | six-axis force/torque sensors in robot wrists (full bridges on a metal cross); resistive tactile skins | contact forces for assembly and safe human–robot touch |\n| 🚗 Cars | NTC coolant and intake-air sensors; piezoresistive manifold-pressure bridges; seat-occupancy mats | engine fuelling, airbag decisions |\n| 📱 Phones & photography | battery NTC (charging stops if too hot); force-sensitive resistors in styluses | safe charging; pressure-sensitive drawing |\n| 🏠 Home & household | kitchen and bathroom scales (full-bridge load cells); thermostats and oven probes; LDR night lights | grams of flour, room temperature, lights on at dusk |\n\n## Derivation\n\n**(a) Gauge factor from $R=\\rho L/A$.**\n1. Take logarithms: $\\ln R=\\ln\\rho+\\ln L-\\ln A$.\n2. Differentiate: $\\dfrac{dR}{R}=\\dfrac{d\\rho}{\\rho}+\\dfrac{dL}{L}-\\dfrac{dA}{A}$.\n3. Length: $dL/L=\\varepsilon$. Width and thickness each shrink by $\\nu_P\\varepsilon$, so $dA/A=-2\\nu_P\\varepsilon$.\n4. Hence $\\dfrac{dR}{R}=(1+2\\nu_P)\\varepsilon+\\dfrac{d\\rho}{\\rho}$, and dividing by $\\varepsilon$ gives $\\mathrm{GF}=1+2\\nu_P+\\dfrac{d\\rho/\\rho}{\\varepsilon}$.\n\n**(b) The divider and its best fixed resistor.**\n1. Series current $I=V_{\\text{ex}}/(R_s+R_f)$, so the sensor voltage is $V=IR_s=V_{\\text{ex}}R_s/(R_s+R_f)$.\n2. Sensitivity: $\\dfrac{dV}{dR_s}=V_{\\text{ex}}\\dfrac{R_f}{(R_s+R_f)^2}$.\n3. Maximise over $R_f$: the derivative of $R_f/(R_s+R_f)^2$ is zero when $(R_s+R_f)-2R_f=0$, i.e. $R_f=R_s$.\n4. Then $dV/dR_s=V_{\\text{ex}}/(4R_s)$, and $dV/dT=\\tfrac{V_{\\text{ex}}}{4}\\cdot\\tfrac{1}{R}\\tfrac{dR}{dT}$.\n\n**(c) The bridge.**\n1. Left divider (top $R_1$, bottom $R_2$): $V_A=V_{\\text{ex}}R_2/(R_1+R_2)$. Right divider: $V_B=V_{\\text{ex}}R_4/(R_3+R_4)$.\n2. $V_{\\text{out}}=V_A-V_B$. Balanced when $R_2/(R_1+R_2)=R_4/(R_3+R_4)$ ⇔ $R_1R_4=R_2R_3$ ⇔ $R_1/R_2=R_3/R_4$.\n3. Quarter: $R_2=R(1+x)$, others $R$, with $x=\\Delta R/R$: $V_{\\text{out}}=V_{\\text{ex}}\\Big(\\dfrac{1+x}{2+x}-\\dfrac12\\Big)=V_{\\text{ex}}\\dfrac{x}{2(2+x)}$.\n4. For small $x$: $V_{\\text{out}}\\approx V_{\\text{ex}}x/4$, with relative error $\\approx x/2$ (A1: linearise).\n5. Half: $R_1=R(1-x)$, $R_2=R(1+x)$: $V_A=V_{\\text{ex}}(1+x)/2$, so $V_{\\text{out}}=V_{\\text{ex}}x/2$ exactly.\n6. Full: also $R_3=R(1+x)$, $R_4=R(1-x)$: $V_B=V_{\\text{ex}}(1-x)/2$, so $V_{\\text{out}}=V_{\\text{ex}}x$ exactly.\n\n**(d) Temperature cancels in a half bridge.**\n1. Add the same thermal change $\\theta$ to both active arms: $R_1=R(1-x+\\theta)$, $R_2=R(1+x+\\theta)$.\n2. $V_A=V_{\\text{ex}}\\dfrac{1+x+\\theta}{2+2\\theta}$, so $V_{\\text{out}}=\\dfrac{V_{\\text{ex}}}{2}\\dfrac{x}{1+\\theta}$.\n3. $\\theta$ only rescales the signal by $1/(1+\\theta)$ (100 ppm here): no offset, no apparent strain.\n\n**(e) Beam strain (from B3).**\n1. Bending moment at distance $x$ from the load: $M=Fx$.\n2. Surface stress of a rectangle: $\\sigma=M(t/2)/I_A$ with $I_A=wt^3/12$, so $\\sigma=6Fx/(wt^2)$.\n3. Hooke: $\\varepsilon=\\sigma/E$. The top surface is stretched and the bottom is compressed by the same amount, which is what a half bridge needs.\n\n## Worked check\n\n**The bending steel beam**, $F=10$ N, $x=100$ mm, $w=20$ mm, $t=2$ mm, $E=200$ GPa, $\\mathrm{GF}=2$, $R=120$ Ω, $V_{\\text{ex}}=5$ V.\n- $\\sigma=6(10)(0.1)/(0.02\\cdot0.002^2)=6/(8\\times10^{-8})=75.0$ MPa; $\\varepsilon=75\\times10^6/200\\times10^9=375$ µε.\n- $\\Delta R/R=2\\times375$ µε $=750$ ppm; $\\Delta R=0.090$ Ω.\n- Quarter bridge, approximate: $5/4\\times7.5\\times10^{-4}=0.9375$ mV. Exact: $5\\times0.09/(2\\times240.09)=0.9371$ mV. The\n  difference is 0.0375% $=x/2$ ✓.\n- Half bridge: $5/2\\times7.5\\times10^{-4}=1.8750$ mV; full bridge: $3.7500$ mV ✓.\n\n**The thermistor at 37 °C:** $10\\,000\\,e^{3950(1/310.15-1/298.15)}=10\\,000\\,e^{-0.5126}=5989$ Ω ✓. All numbers come from\n`scripts/checks/A2_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — the rubber band.** Draw a short fat wire and a long thin one with $R=\\rho L/A$ above both. Arrows: $L$ up, $A$\n  down, $\\rho$ up a little. Write $\\mathrm{GF}=1+2\\nu_P+\\dots\\approx2$.\n- **Panel 2 — the gauge on a beam.** A clamped beam, a hand pressing on the tip, a serpentine near the root. Colour the\n  top red/stretched and the bottom blue/squeezed. Write 375 µε → 0.09 Ω.\n- **Panel 3 — the divider's problem.** A divider at 2.5 V with a 0.94 mV wiggle on top (the same 0.09 Ω at 5 V). Say: \"a whisper in a stadium.\"\n- **Panel 4 — the bridge.** A diamond with $R_1$–$R_4$, $V_{\\text{ex}}$ at the top, ground at the bottom, and a voltmeter across\n  the middle. Write the balance condition $R_1/R_2=R_3/R_4$ and $V_{\\text{out}}\\approx\\frac{V_{\\text{ex}}}{4}\\frac{\\Delta R}{R}$.\n- **Panel 5 — quarter, half, full.** Three small diamonds with 1, 2 and 4 active arms (arrows ↑↓). Under them: ×1, ×2, ×4 and\n  \"linear!\" under half and full.\n- **Panel 6 — thermometers.** Two curves of $R(T)$: a gentle straight platinum line and a steep falling NTC exponential. A\n  small flame under the bead labelled $I^2R$.\n\n## Common mistakes and where the intuition breaks\n\n- **Forgetting that the change is tiny.** $\\Delta R/R$ is in ppm. Measuring $R$ directly with a multimeter to 0.1 Ω cannot\n  see a 0.09 Ω change on top of drift. Bridges and ratios are the answer.\n- **Putting the second gauge in the wrong arm.** In a half bridge the stretched and compressed gauges must be in the *same*\n  divider (adjacent arms). Put them in opposite arms and the signals cancel while the temperature drift adds.\n- **Using the quarter-bridge formula for large changes.** For a thermistor, $\\Delta R/R$ can be 50%. Then $V_{\\text{ex}}x/4$\n  is badly wrong; use the exact divider formula.\n- **Mixing up °C and K in the $\\beta$ formula.** $1/T$ must be in kelvin: 25 °C is 298.15 K.\n- **More excitation is not free.** Doubling $V_{\\text{ex}}$ doubles the signal, but quadruples the self-heating ($P\\propto V^2$).\n- **Lead wires are resistors too.** Two 2 m leads of thin (0.14 mm²) copper add about 0.48 Ω to a Pt100, a 1.2 K error. Three- and four-wire\n  connections exist to remove it.\n- **Where the picture breaks:** the gauge reports the strain *under it*, averaged over its length. Near a hole or a weld the\n  strain changes over millimetres, and the reading depends on exactly where the gauge sits. Silicon piezoresistors (A4)\n  have a large $\\mathrm{GF}$ but also a large temperature coefficient, so bridges there are not optional.\n\n## Remember\n\n**\"$\\Delta R/R=\\mathrm{GF}\\,\\varepsilon$ is ppm-small: compare two dividers, and let the bridge cancel what both arms share.\"**\n\n## Self-test\n\n1. A full-bridge load cell has $\\Delta R/R=500$ ppm at full load and $V_{\\text{ex}}=10$ V. What is the output? What would a single gauge in a quarter bridge give?\n   <details><summary>Answer<\/summary>Full bridge: 10 V × 500e-6 = 5.0 mV. Quarter bridge: 10/4 × 500e-6 = 1.25 mV, four times less (and slightly nonlinear).<\/details>\n2. A Pt100 reads 109.62 Ω. What is the temperature?\n   <details><summary>Answer<\/summary>ΔT = (109.62/100 − 1)/0.00385 = 0.0962/0.00385 = 25.0 °C.<\/details>\n3. A 10 kΩ NTC thermistor ($\\beta=3950$ K) reads 5000 Ω. Roughly how warm is it? Why can't you use $R=R_0(1+\\alpha\\Delta T)$ here?\n   <details><summary>Answer<\/summary>1/T = 1/298.15 + ln(0.5)/3950, so T ≈ 314.6 K ≈ 41.5 °C. The NTC is exponential and its coefficient changes with temperature, so a single straight-line α only works for small steps around one operating point.<\/details>\n\n**Next:** [A3 Capacitive sensors](#A3) — instead of squeezing electrons through a narrower wire, change the space between two plates; the same \"divide to compare\" trick returns as the differential capacitor.\n"}, {"id": "A3", "short": "Capacitive sensors", "title": "Capacitive sensors", "part": "A", "md": "# A3. Capacitive sensors\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A2 Resistive sensors and the Wheatstone bridge](#A2) · used by [A7 Signal conditioning](#A7), [B3 Micromechanics](#B3), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C5 Lab-on-a-chip](#C5)\n\n## Hook — two hands almost clapping\n\nHold your hands flat, palms facing, a few centimetres apart, and bring them slowly together. Nothing touches, yet if your\npalms were metal plates with a battery between them, something would grow steadily as they approach: the amount of charge\nthey can hold. Halve the gap and they hold twice as much. Make the hands bigger and they hold more. Slip a sheet of wet\npaper between them and they hold much more, because water is very good at \"helping\" an electric field.\n\nThat stored-charge-per-volt is the **capacitance**, and each of those three moves is a sensor. Change the **gap** and you\nhave the accelerometer and microphone in your phone (B4, B5). Change the **overlap area** and you have a rotary knob or a\nMEMS comb drive. Change the **material in between** and you have a humidity sensor, a soil-moisture probe or a fuel gauge.\nYour phone's touchscreen uses yet another version: your finger, a salty bag of water connected to the ground, steals\nfield lines from a grid of invisible electrodes under the glass.\n\n## The idea in plain words\n\n**Capacitance.** Two conductors separated by an insulator form a **capacitor**. Put a voltage $V$ across them and a charge\n$+q$ collects on one and $-q$ on the other. The ratio is the **capacitance**,\n$$C=\\frac{q}{V},$$\nmeasured in farads (F). Sensor capacitances are tiny: picofarads (1 pF $=10^{-12}$ F) and femtofarads (1 fF $=10^{-15}$ F).\nUnlike a resistor, an ideal capacitor does not consume power. It stores energy and gives it back, so capacitive sensors can\nrun on very little current, and they do not heat themselves (compare A2).\n\n**The parallel-plate capacitor.** Two plates of area $A$ a gap $g$ apart, with a material of **relative permittivity**\n$\\varepsilon_r$ in between, have\n$$C=\\frac{\\varepsilon_0\\varepsilon_rA}{g},$$\nwhere $\\varepsilon_0=8.854\\times10^{-12}$ F/m is the permittivity of empty space. The relative permittivity says how\nstrongly a material's molecules line up to weaken the field and \"make room\" for more charge: air ≈ 1, plastics 2–4, glass\n≈ 7, dry soil ≈ 4, and water ≈ 80, because water molecules are strong little dipoles. A 1 mm × 1 mm plate pair 2 µm apart\nin air has $C=4.427$ pF.\n\n**Three knobs, three kinds of sensor.** The formula has three things the world can change:\n- **Gap** $g$: a plate moves, as in accelerometers, microphones and pressure membranes. $C\\propto1/g$ is *nonlinear*.\n- **Area** $A$: plates slide past each other, as in comb fingers, rotary encoders and fluid level. $C\\propto A$ is *linear*.\n- **Dielectric** $\\varepsilon_r$: the material changes, as in humidity films, soil moisture and ice detection. $C\\propto\\varepsilon_r$ is linear.\n\nPlay with all three in the 3D capacitor below. Field lines are teal (electrical), the dielectric is blue (it is the\nstimulus there), and the plates are grey.\n\n```viz\na3-plates-3d\n```\n\n**The gap is nonlinear, and the differential capacitor fixes it.** If a plate moves by $x$ toward the other, the gap becomes\n$g_0-x$ and\n$$C(x)=\\frac{\\varepsilon_0\\varepsilon_rA}{g_0-x}=\\frac{C_0}{1-x/g_0},$$\nwith $C_0$ the rest capacitance. For small $x$ this is $C\\approx C_0(1+x/g_0)$, a sensitivity of $C_0/g_0$ (A1:\nlinearise). For bigger moves the curve bends up steeply: at $x=0.1\\,g_0$ the true value is $1.111\\,C_0$, not $1.10\\,C_0$,\nand at $x=0.5\\,g_0$ it is $2\\,C_0$, not $1.5\\,C_0$. The cure is the same \"divide to compare\" trick as the Wheatstone bridge\n(A2). Put a **movable middle plate** between two fixed plates. When it moves by $x$, one gap shrinks to $g_0-x$ and the other\ngrows to $g_0+x$, so $C_1$ rises and $C_2$ falls. Then\n$$\\frac{C_1-C_2}{C_1+C_2}=\\frac{x}{g_0}\\qquad\\text{exactly.}$$\nThe ratio is perfectly linear in $x$, and anything that changes both capacitors the same way (temperature, humidity in\nthe gap, the supply voltage) cancels. Almost every MEMS accelerometer and gyroscope (B4) is a differential capacitor.\n\n**Fringe fields.** The formula assumes the field stays neatly between the plates. In reality some field lines bulge out\naround the edges, the **fringe field**, and add capacitance. When the gap is tiny compared with the plate (2 µm vs 1 mm)\nthe extra is only about 1%. When the gap is comparable to the plate size, as for a touchscreen electrode under 0.5 mm of\nglass or a soil probe, fringing *is* the sensor. These sensors are often **coplanar**: two electrodes side by side on one\nboard, whose arching fringe field reaches out into whatever lies in front of them (soil, a finger, a liquid).\n\n**Soil moisture and humidity: sensing the dielectric.** A capacitive soil probe is a pair of coplanar electrodes, coated so\nthat no current flows. Its fringe field passes half through the board and half through the soil, so its capacitance is\nroughly $C\\approx C_{\\text{half}}(\\varepsilon_{r,\\text{soil}}+\\varepsilon_{r,\\text{board}})$, where $C_{\\text{half}}$ (local\nto this note) is the vacuum capacitance of one half-space. Water's $\\varepsilon_r\\approx80$ dominates the mixture. An\nempirical rule called the **Topp equation**,\n$$\\varepsilon_{r,\\text{soil}}\\approx3.03+9.3\\,\\theta+146\\,\\theta^2-76.7\\,\\theta^3,$$\nlinks it to the **volumetric water content** $\\theta$ (m³ of water per m³ of soil, local to this note). A **capacitive humidity\nsensor** uses a thin polymer film as the dielectric. Water vapour soaks in and raises $\\varepsilon_r$, so $C$ climbs by a\nfraction of a picofarad per %RH.\n\n**Touchscreens: self and mutual capacitance.** Under the glass of a phone are two layers of transparent indium-tin-oxide\n(ITO) strips, rows and columns about 5 mm apart.\n- **Self-capacitance** measures each strip against ground. A finger near a strip adds a path to ground through your body,\n  so the strip's capacitance *rises*. It is sensitive and simple, but with two fingers you only know which two rows and which\n  two columns are touched, which gives four candidate points, two of them \"ghosts\".\n- **Mutual capacitance** drives one row (the transmitter) and measures the charge arriving on each column (the receiver),\n  node by node. A finger near a crossing *steals* some of the field lines and sends them to ground, so the **mutual\n  capacitance drops**, typically by 10–20%. Every crossing is measured separately, so ten fingers give ten clean blobs. Phones\n  use mutual capacitance.\n\nThe controller sees a small heatmap of $\\Delta C$ and computes the **centroid** (the $\\Delta C$-weighted average position) of\neach blob. That is why it can locate your finger to well under a millimetre with 5 mm electrodes. Move the finger over the\ngrid below.\n\n```viz\na3-touch-grid-3d\n```\n\n**Reading out picofarads.** Two common circuits:\n- **Charge amplifier.** Apply a voltage step $V_{\\text{ex}}$ to the sensor. The charge $q=CV_{\\text{ex}}$ that flows is\n  collected on a feedback capacitor $C_f$ around an op-amp, giving $V_{\\text{out}}=-V_{\\text{ex}}C/C_f$. With a differential\n  sensor driven by opposite steps, only the difference arrives: $V_{\\text{out}}=V_{\\text{ex}}(C_1-C_2)/C_f$. This is how MEMS\n  accelerometers read attofarad changes (A7).\n- **RC timing.** Charge the sensor through a resistor $R$ and time how long it takes to cross a threshold. The voltage rises\n  as $V(t)=V_{\\text{ex}}(1-e^{-t/RC})$ (A1's first-order lag), so the time to reach half the supply is $RC\\ln2$. Doubling $C$\n  doubles the time. Microcontroller touch buttons and cheap soil sensors work this way, or use an oscillator whose frequency\n  is proportional to $1/(RC)$.\n\n```viz\na3-rc-timing\n```\n\n## Intuitive examples\n\n1. **A MEMS-size capacitor.** Plates of 1 mm × 1 mm, 2 µm apart, in air: $C_0=4.427$ pF. Close the gap to 1 µm and it\n   doubles to 8.854 pF. The slope at rest is $C_0/g_0=2.213$ pF/µm $=2.21$ fF per nanometre.\n2. **Gap nonlinearity and the differential cure.** Move the middle plate by $0.1g_0=0.2$ µm. Then $C_1=4.919$ pF and $C_2=4.025$ pF.\n   One-sided, $C_1/C_0=1.1111$ instead of the linear 1.10, so the change is 11.1% larger than the linear prediction. But\n   $(C_1-C_2)/(C_1+C_2)=0.1000=x/g_0$ exactly. At $x=0.3g_0$: $C_1=1.4286\\,C_0$ (linear guess 1.30), and the ratio is still\n   exactly 0.3000.\n3. **A humidity sensor.** A polymer sensor reads 180.0 pF at 55% RH and rises by 0.34 pF per %RH: 171.5 pF at 30% RH and\n   188.5 pF at 80% RH. The whole range is a 17.0 pF swing, 9.4% of the base value.\n4. **Soil moisture.** With $C_{\\text{half}}=2$ pF and an FR4 board ($\\varepsilon_r=4.4$): dry soil ($\\theta=0.05$,\n   $\\varepsilon_r=3.85$) gives 16.5 pF. Moist soil ($\\theta=0.30$, $\\varepsilon_r=16.89$) gives 42.6 pF, and wet soil\n   ($\\theta=0.40$, $\\varepsilon_r=25.20$) gives 59.2 pF. Charged through 1 MΩ, the time to half supply goes from 11.4 µs to\n   29.5 µs to 41.0 µs. A microcontroller timer counts that easily.\n5. **A fingertip on glass.** A 25 mm² finger pad through 0.5 mm of cover glass ($\\varepsilon_r=7$) forms about 3.10 pF with the\n   electrode below. A mutual node of about 1.0 pF loses 0.15 pF (15%) under a finger. A 70 × 150 mm screen with 5 mm pitch\n   has 14 × 30 = 420 nodes but only 44 self-capacitance channels. Scanning at 120 Hz means 50 400 node readings per second.\n6. **Sub-pitch position.** Three neighbouring columns at 0, 5 and 10 mm show $\\Delta C=0.05$, 0.20 and 0.15 pF. The centroid\n   is $(0\\cdot0.05+5\\cdot0.20+10\\cdot0.15)/0.40=6.25$ mm. The finger is a bit right of the middle electrode, located far more\n   finely than the 5 mm pitch.\n7. **Fringing matters when the gap is large.** For a 1 mm square plate, Palmer's edge-correction formula gives +1.2% extra\n   capacitance at $g=2$ µm, +35.4% at 100 µm and +144.0% at 500 µm. At that last size the \"parallel-plate\" formula\n   underestimates the capacitance by more than a factor of two.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $C=q/V$ | capacitance: charge stored per volt | $q$ charge, $V$ voltage |\n| $C=\\varepsilon_0\\varepsilon_rA/g$ | parallel plates | $\\varepsilon_0=8.854$ pF/m, $\\varepsilon_r$ relative permittivity, $A$ area, $g$ gap |\n| $C(x)=\\dfrac{C_0}{1-x/g_0}\\approx C_0\\Big(1+\\dfrac{x}{g_0}\\Big)$ | gap sensing: nonlinear, slope $C_0/g_0$ | $x$ displacement toward the plate |\n| $\\dfrac{C_1-C_2}{C_1+C_2}=\\dfrac{x}{g_0}$ | differential capacitor: exactly linear | $C_{1,2}=\\varepsilon_0\\varepsilon_rA/(g_0\\mp x)$ |\n| $C\\propto A$, $C\\propto\\varepsilon_r$ | area and dielectric sensing: linear | |\n| $\\varepsilon_{r}\\approx3.03+9.3\\theta+146\\theta^2-76.7\\theta^3$ | Topp equation for soil | $\\theta$ volumetric water content |\n| $V_{\\text{out}}=-V_{\\text{ex}}\\,C/C_f$; differential $V_{\\text{ex}}(C_1-C_2)/C_f$ | charge amplifier | $C_f$ feedback capacitor |\n| $t_{1/2}=RC\\ln2$ | RC timing to half the supply | $R$ charging resistor |\n| $x_c=\\dfrac{\\sum_i x_i\\,\\Delta C_i}{\\sum_i\\Delta C_i}$ | touch centroid | $x_i$ electrode positions |\n\n## Applications\n\n| World | Capacitive sensing | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | capacitive soil-moisture probes at several depths; leaf-wetness sensors (a film whose $\\varepsilon_r$ jumps when dew forms) | when and how much to irrigate; fungal-disease risk after long leaf wetness |\n| 🧬 Biology & human health | capacitive ECG electrodes through clothing; breathing belts; cell counters in chips that see a cell change $\\varepsilon_r$ between electrodes (C5) | heart and breathing without skin contact; cell number and size |\n| 🌍 Environment | capacitive humidity films in every weather station and air-quality monitor; ice detectors on wind turbines | dew point, fog risk, de-icing |\n| 🤖 Robotics & drones | capacitive tactile skins that feel a hand before contact; MEMS accelerometers and gyroscopes (differential) in IMUs (B4) | safe human–robot interaction; attitude and stabilisation |\n| 🚗 Cars | airbag accelerometers; rain sensors behind the windscreen; capacitive door handles and seat-occupancy sensing | crash detection in milliseconds; automatic wipers; keyless entry |\n| 📱 Phones & photography | mutual-capacitance touchscreen; MEMS microphones (B5); accelerometers for screen rotation and image stabilisation | where your fingers are, 120 times a second; sound; steady photos |\n| 🏠 Home & household | touch buttons on induction hobs; washing-machine water level; fill-level sensors in coffee machines; smart-thermostat humidity | buttons with no moving parts; how full a tank is |\n\n## Derivation\n\n**(a) The parallel-plate formula.**\n1. Charge $q$ spread over area $A$ gives a surface charge density $q/A$.\n2. Gauss's law between large plates: field $\\mathcal E=\\dfrac{q}{\\varepsilon_0\\varepsilon_rA}$, uniform across the gap.\n3. Voltage is field × distance: $V=\\mathcal E g=\\dfrac{qg}{\\varepsilon_0\\varepsilon_rA}$.\n4. $C=q/V=\\dfrac{\\varepsilon_0\\varepsilon_rA}{g}$.\n\n**(b) Gap sensing is nonlinear.**\n1. $C(x)=\\dfrac{\\varepsilon_0\\varepsilon_rA}{g_0-x}=\\dfrac{C_0}{1-u}$ with $u=x/g_0$.\n2. Geometric series: $\\dfrac{1}{1-u}=1+u+u^2+\\dots$, so $C\\approx C_0(1+u+u^2)$.\n3. The linear term gives sensitivity $C_0/g_0$; the $u^2$ term is the nonlinearity (11.1% vs 10% at $u=0.1$).\n\n**(c) The differential capacitor is exactly linear.**\n1. $C_1=\\dfrac{C_0}{1-u}$, $C_2=\\dfrac{C_0}{1+u}$.\n2. $C_1-C_2=C_0\\dfrac{(1+u)-(1-u)}{1-u^2}=\\dfrac{2C_0u}{1-u^2}$.\n3. $C_1+C_2=C_0\\dfrac{(1+u)+(1-u)}{1-u^2}=\\dfrac{2C_0}{1-u^2}$.\n4. Divide: $\\dfrac{C_1-C_2}{C_1+C_2}=u=\\dfrac{x}{g_0}$. The $1-u^2$ and $C_0$ (which carries $\\varepsilon_r$, $A$ and temperature) cancel.\n\n**(d) Charge amplifier.**\n1. A voltage step $V_{\\text{ex}}$ on the sensor pushes charge $q=CV_{\\text{ex}}$ toward the op-amp input.\n2. The op-amp holds its input at 0 V, so all of that charge must go onto $C_f$.\n3. $V_{\\text{out}}=-q/C_f=-V_{\\text{ex}}C/C_f$. With opposite steps on $C_1$ and $C_2$: $q=V_{\\text{ex}}(C_1-C_2)$.\n\n**(e) RC timing.**\n1. Charging through $R$: $RC\\,\\dot V+V=V_{\\text{ex}}$ (A1's first-order lag with $\\tau=RC$).\n2. Solution from 0: $V=V_{\\text{ex}}(1-e^{-t/RC})$.\n3. Set $V=V_{\\text{ex}}/2$: $e^{-t/RC}=1/2$ ⇒ $t_{1/2}=RC\\ln2$, proportional to $C$.\n\n**(f) Centroid interpolation.**\n1. Treat each node's $\\Delta C_i$ as a weight at its position $x_i$.\n2. The weighted mean $x_c=\\sum x_i\\Delta C_i/\\sum\\Delta C_i$ is the centre of the blob.\n3. It is unbiased when the blob is symmetric and spans at least three electrodes, which is why electrode pitch (5 mm) is chosen close to a finger's width.\n\n## Worked check\n\n**Differential capacitor**, $A=1$ mm², $g_0=2$ µm, air, middle plate moved by $x=0.2$ µm ($u=0.1$).\n- $C_0=8.854\\times10^{-12}\\times10^{-6}/(2\\times10^{-6})=4.427$ pF.\n- $C_1=4.427/0.9=4.919$ pF, $C_2=4.427/1.1=4.025$ pF.\n- $(C_1-C_2)/(C_1+C_2)=0.894/8.944=0.1000=x/g_0$ ✓.\n- One-sided: $C_1/C_0=1.1111$ vs the linear guess 1.10 ✓.\n\n**Charge-amplifier readout** of a 10 nm move: $C_1-C_2=44.3$ fF; with $V_{\\text{ex}}=3.3$ V and $C_f=1$ pF,\n$V_{\\text{out}}=3.3\\times0.0443=146$ mV ✓.\n\n**Soil** at $\\theta=0.30$: $\\varepsilon_r=3.03+2.79+13.14-2.07=16.89$; $C=2(16.89+4.4)=42.6$ pF; $t_{1/2}=10^6\\times42.6\\times10^{-12}\\times0.693=29.5$ µs ✓.\nAll numbers come from `scripts/checks/A3_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — two plates.** Draw plates with $+q$ and $-q$, straight field lines between them and curved ones at the edges.\n  Write $C=\\varepsilon_0\\varepsilon_rA/g$ with three arrows: \"move it, slide it, fill it\".\n- **Panel 2 — $1/g$ is curved.** Plot $C$ against $x$: a hyperbola rising steeply toward $x=g_0$, and its tangent at 0. Mark\n  11.1% vs 10%.\n- **Panel 3 — the differential sandwich.** Three plates, the middle one shifted right. Write $C_1\\uparrow$, $C_2\\downarrow$ and\n  box $\\frac{C_1-C_2}{C_1+C_2}=\\frac{x}{g_0}$. Say: \"the Wheatstone bridge again.\"\n- **Panel 4 — soil.** A probe in the ground with arching fringe lines into the soil, droplets of water ($\\varepsilon_r=80$) among\n  grains ($\\varepsilon_r\\approx4$). Write the Topp curve as a rising sketch.\n- **Panel 5 — the touch grid.** Rows and columns, a finger blob, a 3 × 3 table of $\\Delta C$ numbers, and the centroid\n  arithmetic. Side note: self-capacitance with two fingers → four candidates, two ghosts.\n- **Panel 6 — readout.** An op-amp with $C_f$ in feedback ($V_{\\text{out}}=-V_{\\text{ex}}C/C_f$) next to an RC charging curve with\n  the half-supply time $RC\\ln2$ marked.\n\n## Common mistakes and where the intuition breaks\n\n- **Treating gap sensing as linear.** $C\\propto1/g$; the linear formula is only good for $x\\ll g_0$. Use differential\n  sensing or the exact formula.\n- **Forgetting parasitic capacitance.** The wires and pads around a 4 pF sensor can easily add 10–20 pF that changes\n  with temperature and with your hand. Guard electrodes and differential designs exist because of this.\n- **Assuming a finger always increases $C$.** It does in self-capacitance and *decreases* it in mutual capacitance. A water\n  drop on a phone screen confuses self-capacitance more than mutual, and gloves (an insulator) defeat both.\n- **Ignoring fringing for wide gaps.** At $g\\approx a/2$ the real capacitance is more than twice the formula.\n- **Soil probes measure soil, not water.** Salt, temperature and how tightly the soil is packed against the probe also change\n  the reading. Calibrate for each soil type (A8).\n- **Plates attract.** The voltage that reads a capacitor also pulls the plates together with force $\\varepsilon_0AV^2/(2g^2)$:\n  12.1 µN at 3.3 V across 2 µm. For a soft MEMS spring that is not small, and above a critical voltage the plate snaps\n  shut (\"pull-in\", B3, B5).\n- **Where the picture breaks:** at high frequency or with lossy, salty materials, the capacitor also leaks current, and\n  $\\varepsilon_r$ itself depends on frequency. Water's 80 drops at gigahertz frequencies. Good soil and biology sensors\n  measure at a chosen frequency, or measure the full complex impedance.\n\n## Remember\n\n**\"$C=\\varepsilon_0\\varepsilon_rA/g$: move it, slide it or fill it. Gap is nonlinear, so sense it differentially, $\\frac{C_1-C_2}{C_1+C_2}=\\frac{x}{g_0}$.\"**\n\n## Self-test\n\n1. A 4.427 pF air-gap capacitor: what is $C$ if you halve the gap? If you double the area? If you fill it with a polymer of $\\varepsilon_r=3$?\n   <details><summary>Answer<\/summary>Halving the gap: 8.85 pF. Doubling the area: 8.85 pF. Filling with εr = 3: 13.28 pF. All three knobs enter the formula as a simple factor.<\/details>\n2. A differential sensor ($g_0=2$ µm) reads $C_1=4.660$ pF and $C_2=4.216$ pF. How far has the middle plate moved?\n   <details><summary>Answer<\/summary>(C1 − C2)/(C1 + C2) = 0.444/8.876 = 0.050, so x = 0.050 × 2 µm = 100 nm toward plate 1.<\/details>\n3. Columns at 10, 15 and 20 mm report ΔC = 0.10, 0.30 and 0.10 pF. Where is the finger? With two fingers, why does a self-capacitance screen get confused?\n   <details><summary>Answer<\/summary>Centroid = (10·0.10 + 15·0.30 + 20·0.10)/0.50 = 15.0 mm. Self-capacitance only says which rows and which columns are touched; two rows × two columns give four crossing points, and two of them are ghosts. Mutual capacitance measures each crossing separately.<\/details>\n\n**Next:** [A4 Piezoelectric, piezoresistive and magnetic sensors](#A4) — materials that make their own charge when squeezed, resistors with a gauge factor of 100, and the Hall effect that lets a car count wheel turns.\n"}, {"id": "A4", "short": "Piezoelectric, piezoresistive and magnetic sensors", "title": "Piezoelectric, piezoresistive and magnetic sensors", "part": "A", "md": "# A4. Piezoelectric, piezoresistive and magnetic sensors\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A2 Resistive sensors and the Wheatstone bridge](#A2), [A3 Capacitive sensors](#A3) · used by [A7 Signal conditioning](#A7), [A9 Sensor fusion](#A9), [B4 MEMS inertial sensors](#B4), [B5 MEMS microphones, pressure sensors and actuators](#B5)\n\n## Hook — the click of a gas-grill igniter\n\nPress the button on a gas grill or a kitchen lighter. A spring-loaded hammer snaps onto a little ceramic cylinder, and a\nblue spark jumps a few millimetres. There is **no battery**. The spark is made by the ceramic itself: squeeze certain\ncrystals and electric charge appears on their faces. The same click happens, millions of times smaller, inside a car's\nknock sensor, a guitar pickup and the ultrasound probe a doctor presses on your belly.\n\nNow take out your phone and open the compass app. The phone finds north from the Earth's magnetic field, which is about\na hundred times weaker than the field at the surface of a fridge magnet. Your car's ABS brakes count the teeth of a steel wheel spinning past a\nmagnet more than 700 times a second at motorway speed. **This note is about three ways a solid can feel a push or a\nfield directly:** it makes a charge (piezoelectric), it changes its resistance (piezoresistive), or it bends moving\ncharges sideways (Hall effect and magnetoresistance).\n\n## The idea in plain words\n\n**Piezoelectricity: squeezing makes charge.** In most solids the positive ions and the negative ions are arranged so\nsymmetrically that squeezing just moves everything closer together and nothing electrical happens. In some crystals\n(quartz, the ceramic PZT, the plastic PVDF) the unit cell has **no centre of symmetry**. When you squeeze it, the\npositive charges move a little differently from the negative ones, so the centre of positive charge no longer sits on\nthe centre of negative charge. Each cell becomes a tiny **electric dipole**. Billions of dipoles all point the same way;\ninside the crystal their charges cancel, but on the two faces a layer of charge is left over: $+q$ on one face, $-q$ on\nthe other. The rule is beautifully simple:\n$$q=d_{33}\\,F .$$\nHere $F$ is the force (newtons), $q$ the charge (coulombs) and $d_{33}$ the **piezoelectric charge coefficient**,\nwritten in picocoulombs per newton (pC/N). The two subscripts say \"charge collected on the faces perpendicular to\ndirection 3, for a force along direction 3\". Quartz has about $2.3$ pC/N, the polymer PVDF about $33$ pC/N, and PZT\nceramic (lead zirconate titanate, a man-made ceramic that is \"poled\" in a strong field during manufacture) about\n$400$ pC/N. Notice what is missing: the area $A$. A bigger crystal spreads the same force over more cells, each cell\nmakes less dipole, and the total charge comes out the same.\n\n```viz\na4-piezo-3d\n```\n\n**From charge to voltage: the crystal is a capacitor.** The two metal electrodes on the faces, with the crystal as the\ninsulator between them, form a parallel-plate capacitor from [A3](#A3), $C=\\varepsilon_0\\varepsilon_rA/t$,\nwhere $t$ is the crystal thickness and $\\varepsilon_r$ its relative permittivity. Charge on a capacitor means a voltage\n$V=q/C$:\n$$V=\\frac{d_{33}\\,F\\,t}{\\varepsilon_0\\varepsilon_r A}.$$\nA thin, wide crystal has a big $C$ and a small voltage; a long, thin rod like the lighter element has a tiny $C$ and a\nhuge voltage. That is the whole design of an igniter: kilovolts from a thumb press.\n\n**Why a piezo sensor cannot weigh you.** Charge sitting on the electrodes slowly leaks away through the crystal, the\ncable and the amplifier input, all of which act like a resistor $R$ in parallel with $C$. That is a first-order system\nwith time constant $\\tau=RC$ (the same lag that appears in [A7](#A7)).\nPress and hold, and the voltage decays as $V_0e^{-t/\\tau}$; release, and the opposite voltage appears. The sensor\nreports **changes** in force, not the force itself. In the language of filters it is a **high-pass filter** with corner\nfrequency $f_c=1/(2\\pi RC)$: vibrations, knocks, sound and heartbeats above $f_c$ pass; a constant load below $f_c$ is\nlost. Engineers read piezo sensors with a **charge amplifier**: an op-amp whose feedback capacitor $C_f$ swallows the\ncharge and outputs $V_{\\text{out}}=-q/C_f$, independent of the cable length. A big feedback resistor $R_f$ across $C_f$\nsets how slowly the output forgets, $\\tau=R_fC_f$.\n\n**Piezoresistivity: squeezing changes resistance.** In [A2](#A2) a metal\nstrain gauge changes resistance mostly because it gets longer and thinner, so its **gauge factor**\n$\\mathrm{GF}=(\\Delta R/R)/\\varepsilon$ is about $2$ ($\\varepsilon$ is the strain, the relative change of length). In\n**doped silicon** something much stronger happens: the strain changes the energy bands of the crystal, which changes how\neasily the charge carriers move (their mobility) and how many sit in each band. The resistivity itself changes, and the\ngauge factor reaches about $100$, **fifty times more** than metal. That is why every MEMS pressure sensor in a tyre, a\nblood-pressure cuff or a phone barometer ([B5](#B5)) has four\nsilicon piezoresistors diffused into a thin silicon membrane, wired as a Wheatstone bridge. Unlike a piezoelectric, a\npiezoresistor measures a **steady** strain perfectly well: a resistance does not leak. The price is that silicon's\nresistance also depends strongly on temperature, which the bridge and calibration must cancel.\n\n**The Hall effect: a magnetic field pushes moving charge sideways.** Send a current $I$ along a thin plate and put it in a\nmagnetic field $B$ (in tesla, T) pointing through the plate. Each moving carrier feels the magnetic (Lorentz) force,\nwhich acts at right angles to both its velocity and the field. The carriers drift towards one edge. Charge piles up there\n(and the opposite charge on the other edge) until the electric field of the piled-up charge pushes back exactly as hard\nas the magnetic field pushes. In that balance the two edges sit at a steady voltage, the **Hall voltage**\n$$V_H=\\frac{I\\,B}{n\\,q_e\\,t}.$$\nHere $n$ is the number of mobile carriers per cubic metre, $q_e=1.602\\times10^{-19}$ C is the elementary charge, and\n$t$ the plate thickness. **Few carriers make a big voltage**: with fewer carriers each one must drift faster to carry\nthe same current, and a faster carrier feels a bigger magnetic force. Copper has $n\\approx8.5\\times10^{28}$ m$^{-3}$\nand gives almost nothing; lightly doped silicon has about $10^{22}$ m$^{-3}$, roughly ten million times fewer, and gives\nmillivolts. So every Hall sensor is a small, thin semiconductor plate, usually made in the same CMOS process as its amplifier.\n\n```viz\na4-hall-3d\n```\n\n**What Hall sensors measure in practice.** A Hall plate gives a voltage proportional to $B$, so anything that changes a\nmagnetic field can be measured: a magnet on a door (laptop lid, fridge), a steel gear tooth passing a magnet\n(wheel speed, crankshaft position), or the field around a wire carrying current (current sensors in electric cars and\nchargers, which measure hundreds of amps without touching the wire). The sign of $V_H$ tells you the direction of\n$B$, and the sign of the carriers: this is how physicists first proved that some materials conduct with positive \"holes\".\n\n**Magnetoresistance and the compass.** The Earth's magnetic field is only about $50$ µT ($50\\times10^{-6}$ T). It points\nnorth but also dips into the ground: in Europe or North America the **inclination** (dip angle) is about $60$–$70°$, so\nonly the horizontal part, about $20$ µT, is useful for finding north. A plain Hall plate gives microvolts for that, too\nlittle to trust. Phone compasses therefore use either Hall plates with tiny magnetic flux concentrators or\n**magnetoresistive** films: in a thin film of permalloy (nickel–iron) the resistance depends on the angle between the\ncurrent and the film's magnetisation (anisotropic magnetoresistance, AMR, $\\Delta R/R$ of about $2$–$3\\%$), and a weak\nfield tilts that magnetisation. Stacked magnetic layers give even larger effects (giant and tunnel magnetoresistance,\nGMR and TMR, the same physics as hard-disk read heads). Three such sensors along $x$, $y$, $z$ give the field vector,\nand the heading follows from the two horizontal components.\n\n```viz\na4-compass-3d\n```\n\n**One family, three physical routes.** All three effects are **linear around an operating point** (the thread from\n[A1](#A1)): $q\\approx d_{33}F$, $\\Delta R/R\\approx\\mathrm{GF}\\,\\varepsilon$,\n$V_H\\approx (I/nq_et)\\,B$. What differs is what they cannot do: piezoelectrics forget steady forces, piezoresistors\ndrift with temperature, and magnetic sensors see every stray magnet nearby.\n\n## Intuitive examples\n\n1. **The lighter spark.** A PZT cylinder 2.5 mm across ($A=4.91$ mm²) and 5 mm long, $d_{33}=400$ pC/N,\n   $\\varepsilon_r=1700$, hit with $F=500$ N: $q=d_{33}F=200$ nC; $C=\\varepsilon_0\\varepsilon_rA/t=14.8$ pF;\n   $V=q/C=13.5$ kV. Enough to jump a few-millimetre gap in air.\n2. **A quartz force sensor and its memory.** Quartz, $d_{33}=2.3$ pC/N, under $10$ N gives $q=23$ pC. A charge amplifier\n   with $C_f=100$ pF outputs $0.23$ V. With $R_f=1$ GΩ, $\\tau=R_fC_f=0.10$ s and $f_c=1.59$ Hz: after one $\\tau$ only\n   $36.8\\%$ of a held step remains, after $0.5$ s only $0.67\\%$. For the same $10$ N, PVDF gives $330$ pC ($14\\times$ quartz)\n   and PZT $4000$ pC ($174\\times$). Quartz wins anyway in laboratories: it is extremely stable and barely leaks.\n3. **Silicon vs metal under the same strain.** At $\\varepsilon=100$ microstrain ($10^{-4}$), a metal gauge ($\\mathrm{GF}=2$)\n   changes by $\\Delta R/R=0.020\\%$, a silicon piezoresistor ($\\mathrm{GF}=100$) by $1.000\\%$. In a quarter bridge at $3.3$ V\n   that is $0.165$ mV versus $8.25$ mV.\n4. **A silicon Hall plate near a magnet.** $n=10^{22}$ m⁻³, $t=10$ µm, $I=1$ mA, $B=50$ mT: $V_H=3.12$ mV, a sensitivity\n   of $62.4$ mV/T. The same plate in the Earth's $50$ µT gives only $3.12$ µV. A copper strip ($n=8.5\\times10^{28}$ m⁻³,\n   $t=0.1$ mm) carrying $1$ A in $1$ T gives just $0.73$ µV.\n5. **ABS wheel speed.** A tone wheel with $48$ teeth on a wheel of radius $0.30$ m at $100$ km/h: $14.74$ revolutions per\n   second, so the Hall sensor sees $707$ pulses per second. At walking pace ($5$ km/h) it is still $35.4$ Hz, which is\n   why ABS can work down to a crawl, unlike older coil pickups whose voltage vanishes at low speed.\n6. **Current sensing without touching the wire.** $10$ A through a ring-shaped iron core with a $1.5$ mm air gap puts\n   $B=\\mu_0I/\\text{gap}=8.38$ mT in the gap ($\\mu_0=4\\pi\\times10^{-7}$ T·m/A is the magnetic constant), and the silicon Hall\n   plate there reads $0.523$ mV. Without the core, $5$ mm from the bare wire, the field is only $\\mu_0I/(2\\pi r)=0.40$ mT.\n7. **The compass.** With a total field of $50$ µT and a dip of $66°$, the horizontal part is $20.3$ µT and the vertical\n   part $45.7$ µT. An AMR bridge with sensitivity $3.2$ mV/V per gauss ($1$ gauss $=100$ µT) on a $5$ V supply gives\n   $3.20$ mV for $20$ µT; the Hall plate above gives $1.25$ µV, about $2563$ times less. If the phone reads\n   $B_x=14.1$ µT and $B_y=-14.1$ µT, its heading is $45.0°$ (north-east). A $2$ µT stray offset from a magnetic case\n   turns the heading by $5.7°$ when you face north.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $q=d_{33}\\,F$ | direct piezoelectric effect: charge from force | $d_{33}$ in pC/N (quartz 2.3, PVDF 33, PZT ≈ 400) |\n| $V=\\dfrac{q}{C}=\\dfrac{d_{33}F\\,t}{\\varepsilon_0\\varepsilon_rA}$ | open-circuit voltage of the crystal | $t$ thickness, $A$ electrode area |\n| $V_{\\text{out}}=-q/C_f$, $\\tau=R_fC_f$, $f_c=\\dfrac{1}{2\\pi R_fC_f}$ | charge amplifier and its high-pass corner | $C_f$, $R_f$ feedback capacitor and resistor |\n| $V(t)=V_0\\,e^{-t/\\tau}$ | a held force leaks away | $\\tau=RC$ |\n| $\\Delta R/R=\\mathrm{GF}\\cdot\\varepsilon$, $\\mathrm{GF}\\approx\\pi_lE$ | piezoresistive strain gauge | silicon GF ≈ 100, metal ≈ 2; $\\pi_l$ piezoresistive coefficient |\n| $F=q_e\\,v_d\\,B$ | magnetic force on a moving carrier | $v_d$ drift speed, $B$ field in T |\n| $V_H=\\dfrac{I\\,B}{n\\,q_e\\,t}$ | Hall voltage | $n$ carriers per m³, $t$ plate thickness |\n| $\\psi=\\operatorname{atan2}(-B_y,\\,B_x)$ | compass heading from the horizontal field | $B_x$ forward, $B_y$ right, phone held flat |\n\n## Applications\n\n| World | Piezo, piezoresistive and magnetic sensing | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | PVDF film rain and hail sensors on weather masts; piezoresistive dendrometers on stems; Hall flow meters on irrigation lines; Hall wheel sensors on tractor implements | rain and hail intensity from impact pulses; the stem shrinks a few µm when the plant is thirsty; litres of water delivered; seed-drill speed |\n| 🧬 Biology & human health | ultrasound probes (PZT sends and receives); PVDF pulse and breathing belts; piezoresistive catheter blood-pressure tips; magnetic sensing of nanoparticle labels in diagnostics | images of organs; heartbeats and breaths; arterial pressure each beat; how many labelled molecules are bound |\n| 🌍 Environment | piezoelectric geophones and hydrophones; quartz crystal microbalances weighing deposited dust; Hall anemometer rotors; magnetometers mapping rocks and ocean floors | earthquakes, whales, ship noise; particle mass; wind speed; buried geology |\n| 🤖 Robotics & drones | piezoresistive tactile skins and force/torque sensors; Hall encoders on motor shafts; 3-axis magnetometer in the drone IMU; Hall current sensors on motor drivers | grip force; joint angle and speed; heading for navigation; motor torque |\n| 🚗 Cars | piezo knock sensors on the engine block; Hall wheel-speed (ABS) and crankshaft sensors; piezoresistive MAP and tyre-pressure sensors; Hall battery current sensors | when to retard ignition; slip of each wheel; manifold and tyre pressure; state of charge |\n| 📱 Phones & photography | the compass (Hall or AMR/TMR); a Hall sensor that detects a magnetic cover; piezoresistive barometer for altitude; piezo actuators in some autofocus and haptics | which way the phone points; flip-cover open or closed; which floor you are on; focus and vibration |\n| 🏠 Home & household | gas-grill and lighter igniters; piezo buzzers in smoke alarms; Hall sensors in washing-machine drums and door-closed switches; piezoresistive load cells in scales | a spark with no battery; a loud alarm from a few mW; drum speed and lid state; your weight |\n\n## Derivation\n\n**(a) Charge from force (piezoelectric).**\n1. Stress on the crystal: $\\sigma=F/A$.\n2. Each cell's dipole grows in proportion to the stress, so the dipole per volume (the polarisation) is $P=d_{33}\\,\\sigma$.\n3. A uniform polarisation leaves a surface charge density equal to $P$ on each face.\n4. Total charge: $q=P\\,A=d_{33}\\,(F/A)\\,A=d_{33}F$; the area cancels.\n5. The electrodes form a capacitor $C=\\varepsilon_0\\varepsilon_rA/t$, so $V=q/C=d_{33}F\\,t/(\\varepsilon_0\\varepsilon_rA)$.\n\n**(b) Why the force leaks away.**\n1. Model the sensor plus amplifier as $C$ in parallel with $R$, holding charge $Q$.\n2. The leakage current is $V/R=Q/(RC)$ and it drains the charge: $\\dot Q=-Q/(RC)$.\n3. Solution: $Q(t)=Q_0e^{-t/\\tau}$ with $\\tau=RC$.\n4. For a sinusoidal force at angular frequency $\\omega$ the output follows $\\lvert V\\rvert\\propto\\omega\\tau/\\sqrt{1+(\\omega\\tau)^2}$: about $1$ when $\\omega\\tau\\gg1$, small when $\\omega\\tau\\ll1$.\n5. The corner sits at $\\omega\\tau=1$, i.e. $f_c=1/(2\\pi RC)$: a first-order high-pass filter.\n\n**(c) Gauge factor of silicon.**\n1. Resistance $R=\\rho L/(wt)$, so $\\Delta R/R=\\Delta\\rho/\\rho+\\Delta L/L-\\Delta w/w-\\Delta t/t$.\n2. Geometry: $\\Delta L/L=\\varepsilon$, $\\Delta w/w=\\Delta t/t=-\\nu_P\\varepsilon$, so the shape part is $(1+2\\nu_P)\\varepsilon\\approx1.6\\,\\varepsilon$ for $\\nu_P=0.3$. This is all a metal has.\n3. In silicon the resistivity changes with stress: $\\Delta\\rho/\\rho=\\pi_l\\,\\sigma=\\pi_lE\\,\\varepsilon$.\n4. For p-type silicon along a ⟨110⟩ direction, $\\pi_l\\approx69\\times10^{-11}$ Pa⁻¹ and $E\\approx169$ GPa, so $\\mathrm{GF}\\approx\\pi_lE\\approx117$.\n5. The resistivity term beats the geometry term by about $70$ times: in silicon the shape barely matters.\n\n**(d) The Hall voltage.**\n1. Current through a cross-section $w\\times t$: $I=n\\,q_e\\,v_d\\,w\\,t$, so $v_d=I/(n\\,q_e\\,w\\,t)$.\n2. Magnetic force on one carrier: $F=q_e\\,v_d\\,B$, sideways.\n3. Charge builds on the edges until the electric force balances it: $q_e\\mathcal E_H=q_ev_dB$, so $\\mathcal E_H=v_dB$.\n4. Voltage across the width: $V_H=\\mathcal E_H\\,w=v_d\\,B\\,w$.\n5. Substitute $v_d$: $V_H=\\dfrac{I}{n\\,q_e\\,w\\,t}\\,B\\,w=\\dfrac{IB}{n\\,q_e\\,t}$; the width cancels.\n\n**(e) Heading from a magnetometer.**\n1. Let the phone lie flat with heading $\\psi$ (clockwise from north); $B_h$ is the horizontal field.\n2. The forward sensor reads $B_x=B_h\\cos\\psi$; the right-hand sensor reads $B_y=-B_h\\sin\\psi$.\n3. Divide: $\\tan\\psi=-B_y/B_x$; use $\\operatorname{atan2}$ so the quadrant comes out right. $B_h$ cancels, so the field's strength does not matter.\n4. If the phone is tilted, the big vertical part of the field leaks into $B_x$ and $B_y$; the accelerometer measures the tilt so it can be removed ([B4](#B4)).\n\n## Worked check\n\n**A PVDF pulse sensor.** A PVDF film strap on the wrist ($d_{33}=33$ pC/N, film capacitance $C=1$ nF) feels a $2$ N push\nwith every heartbeat.\n- Charge: $q=33\\times10^{-12}\\times2=66$ pC. Voltage: $V=q/C=66\\times10^{-12}/10^{-9}=66$ mV. Easy to measure.\n- A cheap $10$ MΩ amplifier input: $\\tau=RC=10^7\\times10^{-9}=10$ ms, $f_c=1/(2\\pi\\times0.01)=15.9$ Hz. A held press decays\n  to $e^{-3}=5.0\\%$ in $30$ ms, and the $1.2$ Hz heartbeat lies **below** $f_c$: the pulse is largely filtered away.\n- To put $f_c$ at $0.1$ Hz: $R=1/(2\\pi f_cC)=1/(2\\pi\\times0.1\\times10^{-9})=1.59$ GΩ, so $\\tau=1.59$ s. Now the pulse passes.\n\n**A Hall plate.** $I=2$ mA, $B=0.1$ T, $n=5\\times10^{21}$ m⁻³, $t=5$ µm.\n- $n\\,q_e\\,t=5\\times10^{21}\\times1.602\\times10^{-19}\\times5\\times10^{-6}=4.005\\times10^{-3}$ C/m².\n- $V_H=IB/(nq_et)=(2\\times10^{-3}\\times0.1)/(4.005\\times10^{-3})=49.9$ mV ✓ (all numbers from `scripts/checks/A4_check.py`).\n\n## Whiteboard plan\n\n- **Panel 1 — the lighter.** Draw a hammer hitting a cylinder with a spark at the end. Write $q=d_{33}F$ and\n  \"no battery\". Say: \"Squeeze the right crystal and charge comes out.\"\n- **Panel 2 — the unit cell.** A square of four $-$ corners with a $+$ in the middle; next to it a squashed square with the\n  $+$ shifted up and a little dipole arrow. Then a whole slab with $+++$ on top and $---$ underneath. Write\n  $P=d_{33}F/A$, $q=PA=d_{33}F$, and circle \"A cancels\".\n- **Panel 3 — leak and high-pass.** Sketch a force step (purple) and below it a voltage spike that decays, then a\n  negative spike at release (yellow). Write $\\tau=RC$ and $f_c=1/(2\\pi RC)$. Say: \"Piezo hears changes, not weights.\"\n- **Panel 4 — silicon vs metal.** Two bars: $\\mathrm{GF}=2$ and $\\mathrm{GF}=100$. Write $\\Delta R/R=\\mathrm{GF}\\,\\varepsilon$\n  and \"$0.165$ mV vs $8.25$ mV at $100\\,\\mu\\varepsilon$\".\n- **Panel 5 — the Hall plate.** A rectangle with current arrows, $\\otimes$ for $B$ into the board, an electron path\n  bending to the bottom edge, $---$ at the bottom and $+++$ at the top. Write the balance $q_e\\mathcal E_H=q_ev_dB$ and box\n  $V_H=IB/(nq_et)$. Say: \"fewer carriers means faster carriers, so a bigger push.\"\n- **Panel 6 — compass.** A circle with N, E, S, W, a phone rotated by $\\psi$, and the two readings $B_x$, $B_y$. Write\n  $\\psi=\\operatorname{atan2}(-B_y,B_x)$ and \"only the horizontal 20 µT counts\".\n\n## Common mistakes and where the intuition breaks\n\n- **\"A piezo sensor can measure my weight.\"** Not for long. Any static force decays with $\\tau=RC$. Use a piezoresistive\n  or capacitive load cell for steady loads; use piezo for vibration, impact and sound.\n- **Thinking a bigger crystal gives more charge.** For a force along the poling axis, $q=d_{33}F$ does not depend on the\n  area. A bigger area only adds capacitance and lowers the voltage.\n- **Forgetting temperature with silicon.** A silicon piezoresistor's resistance changes by roughly $0.1$–$0.3\\%$ per kelvin,\n  comparable to a large strain signal. That is why they are used in full bridges where all four arms warm up together\n  ([A2](#A2)).\n- **\"Metals make good Hall sensors because they conduct well.\"** The opposite: $V_H\\propto1/n$, and metals have far too\n  many carriers.\n- **Mixing up $B$ and the Earth's field direction.** The field points north *and down*. Holding the phone tilted lets\n  the large vertical part leak into the heading; without tilt compensation a $10°$ tilt can cause a much larger heading error.\n- **Ignoring nearby iron.** Steel, magnets and current-carrying wires add offsets (\"hard iron\") and distort the field\n  (\"soft iron\"). This is why compass apps ask you to wave the phone in a figure-eight: they are calibrating\n  ([A8](#A8)).\n- **Where linearity breaks:** a piezo ceramic depolarises if heated above its Curie temperature (about $200$–$350$ °C for PZT);\n  a Hall plate saturates its amplifier; AMR films flip their magnetisation in strong fields, so they carry a \"set/reset\"\n  coil to restore them.\n\n## Remember\n\n**\"Squeeze a crystal: $q=d_{33}F$, but it leaks with $\\tau=RC$. Strain silicon: $\\mathrm{GF}\\approx100$. Push moving charges with $B$: $V_H=IB/(nq_et)$.\"**\n\n## Self-test\n\n1. A PZT disc ($d_{33}=400$ pC/N) is part of a car knock sensor. How much charge does a $0.5$ N vibration peak produce, and why does it not matter that the sensor cannot measure the engine's steady weight?\n   <details><summary>Answer<\/summary>q = 400 pC/N × 0.5 N = 200 pC. Knock is a vibration at several kHz, far above the high-pass corner f_c = 1/(2πRC), so it passes; the steady weight of the engine is a DC force that leaks away and is not wanted anyway.<\/details>\n2. You halve the thickness of a Hall plate and double the current. What happens to $V_H$?\n   <details><summary>Answer<\/summary>V_H = IB/(n q_e t). Doubling I doubles it and halving t doubles it again: V_H becomes 4 times larger (as long as the plate does not overheat).<\/details>\n3. A phone lying flat reads $B_x=0$ µT and $B_y=-20$ µT. Which way is it pointing?\n   <details><summary>Answer<\/summary>ψ = atan2(−B_y, B_x) = atan2(20, 0) = 90°: the phone points east. (Check: B_y = −B_h sin ψ = −20 µT for ψ = 90°.)<\/details>\n\n**Next:** [A5 Optical sensors: photodiodes, image sensors and LiDAR](#A5) — instead of pushing charges with force or fields, light knocks electrons loose one photon at a time.\n"}, {"id": "A5", "short": "Optical sensors: photodiodes, image sensors and LiDAR", "title": "Optical sensors: photodiodes, image sensors and LiDAR", "part": "A", "md": "# A5. Optical sensors: photodiodes, image sensors and LiDAR\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A3 Capacitive sensors](#A3) · used by [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration and drift](#A8), [A9 Sensor fusion](#A9), [C5 Lab-on-a-chip](#C5)\n\n## Hook — rain filling buckets on a grid\n\nPut a few dozen buckets on a lawn in a neat grid and leave them out during a shower. Afterwards, the water level in each\nbucket tells you how hard it rained at that spot. Buckets under a tree have less; buckets in the open have more. Leave\nthem out longer and every level rises. Leave them out much too long and the buckets overflow, and then you can no longer\ntell a heavy shower from a light one. And if you only leave them out for a few seconds, each bucket catches a handful of\ndrops and the levels look random, even where the rain was perfectly even.\n\n**That is a camera sensor.** Each pixel is a bucket, the raindrops are photons, and the water is electrons. Everything\nimportant about a photo (exposure, graininess in the dark, blown-out skies) is in that picture. The same\nlight-into-electrons trick also measures your blood oxygen through your fingertip, and when we time how long a flash of light takes\nto come back, it measures distance: the LiDAR on a self-driving car or the depth sensor on a phone.\n\n## The idea in plain words\n\n**Light comes in packets.** Light of wavelength $\\lambda$ arrives as photons, each carrying a fixed energy\n$$E_{\\text{ph}}=\\frac{h_{\\text P}\\,c_0}{\\lambda},$$\nwhere $h_{\\text P}=6.626\\times10^{-34}$ J·s is Planck's constant and $c_0=2.998\\times10^8$ m/s the speed of light. Shorter\nwavelength means more energy: blue light at $450$ nm carries $2.76$ eV per photon, red at $650$ nm $1.91$ eV ($1$ eV\n$=1.602\\times10^{-19}$ J, the energy an electron gains across one volt). A handy form is\n$E_{\\text{ph}}\\,[\\text{eV}]=1239.8/\\lambda\\,[\\text{nm}]$.\n\n**A photodiode turns photons into electrons.** In a semiconductor such as silicon, electrons are bound unless they get\nat least the **band-gap energy** $E_g$ ($1.12$ eV for silicon). A photon with more energy than that can free one electron\n(and leave a \"hole\" behind). A photon with less energy passes straight through. So silicon is blind beyond\n$\\lambda=h_{\\text P}c_0/E_g\\approx1107$ nm: it sees visible light and the near infrared, but not the $1550$ nm used by\nsome LiDARs, which need germanium or InGaAs detectors. A **photodiode** is a p–n junction with a built-in electric field\nthat sweeps each freed electron and hole apart before they can recombine, so they flow as a current.\n\n**Responsivity: amps per watt.** Not every photon frees an electron that reaches the contacts; the fraction that does is\nthe **quantum efficiency** $\\eta$ (between 0 and 1). An optical power $P_{\\text{opt}}$ delivers $P_{\\text{opt}}/E_{\\text{ph}}$ photons\nper second, and each successful photon adds one elementary charge $q_e$ to the current. So the photocurrent is\n$I=\\mathcal R\\,P_{\\text{opt}}$ with the **responsivity**\n$$\\mathcal R=\\frac{\\eta\\,q_e\\,\\lambda}{h_{\\text P}c_0}\\ \\ \\text{(in A/W)}.$$\nNotice the $\\lambda$: at longer wavelengths each photon carries less energy, so one watt contains more photons and gives\nmore current, right up to the band-gap cutoff, where $\\eta$ collapses. Silicon peaks around $0.6$ A/W near $900$ nm. The\ncurrent is beautifully linear in light power over many decades, which is why photodiodes are the standard light meter.\n\n**An image sensor is millions of photodiodes with buckets.** In a CMOS image sensor each pixel's photodiode is reset to\na voltage and then, during the **exposure time** $t_{\\exp}$, the freed electrons collect on its tiny capacitance (the\n**well**). At the end, a transistor in the pixel reads the voltage, and an ADC in each column turns it into a number\n([A7](#A7)). If photons arrive at a rate $\\Phi$ on the pixel, the well\ncollects on average\n$$N_e=\\eta\\,\\Phi\\,t_{\\exp}$$\nelectrons. Twice the exposure, twice the electrons, twice the brightness. The well capacitance is about a femtofarad, so\nby $q=CV$ from [A3](#A3) a few thousand electrons swing the voltage by about a volt. The largest\nnumber of electrons the well can hold is the **full-well capacity** (a few thousand for a phone pixel, tens of\nthousands for a big camera pixel). Above that the pixel **saturates**: the sky turns pure white.\n\n```viz\na5-pixel-array-3d\n```\n\n**Why dim photos are grainy: shot noise.** Photons arrive at random times, like raindrops, so even under perfectly even\nlight the count in a pixel fluctuates from frame to frame and from pixel to pixel. The counts follow **Poisson\nstatistics**, whose standard deviation is the square root of the mean: $\\sigma_{N_e}=\\sqrt{N_e}$. This is not a flaw of the\nelectronics; it is the graininess of light itself. The signal-to-noise ratio is therefore\n$$\\mathrm{SNR}=\\frac{N_e}{\\sqrt{N_e}}=\\sqrt{N_e}.$$\n$100$ electrons give $\\mathrm{SNR}=10$ (each pixel is uncertain by 10%); $10\\,000$ electrons give $\\mathrm{SNR}=100$. The\nonly cure is **more photons**: a bigger pixel, a wider lens aperture, a longer exposure, or averaging several frames\n(night mode, which uses the $1/\\sqrt M$ rule of [A8](#A8)). The electronics\nadd a little **read noise** on top (about $1$–$3$ electrons in a modern sensor), which matters only in the deepest shadows.\n\n**Dynamic range.** The brightest thing a pixel can record is a full well; the dimmest is about the read noise. Their\nratio is the **dynamic range**, quoted in dB ($20\\log_{10}$) or in photographic \"stops\" (factors of 2, $\\log_2$). HDR modes\nstretch it by combining short and long exposures.\n\n**Colour from a mosaic of filters.** A photodiode counts photons but cannot tell their colour. So each pixel gets a tiny\ncoloured filter on top, in the **Bayer pattern**: in every 2×2 block, two green, one red, one blue (green twice because\nour eyes are most sensitive to green, and green carries most of the detail). The camera then estimates the two missing\ncolours at every pixel from its neighbours (**demosaicing**). The price: a filter throws away about two thirds of the light.\n\n**Measuring distance with light: time of flight.** Fire a short laser pulse at $t=0$; it bounces off an object and a\nfast photodiode next to the laser catches the echo after a time $t$. The light went there and back, so\n$$d=\\frac{c_0\\,t}{2}.$$\nLight is fast: it covers $30$ cm per nanosecond, so a target $100$ m away answers after $667$ ns. Because the clock\nticks in steps $\\Delta t$, distance comes in steps $\\Delta d=c_0\\Delta t/2$: $1$ ns of timing resolution means $15$ cm.\nCar LiDARs use single-photon avalanche diodes (SPADs) and time-to-digital converters with tens of picoseconds of\nresolution.\n\n**Phase time of flight.** Phone depth cameras, robot vacuums and gesture sensors often use a cheaper trick: modulate\nthe light's brightness as a sine wave at frequency $f_{\\text{mod}}$ and measure the **phase shift** $\\phi$ of the returning\nwave. The round trip $2d$ corresponds to a delay $\\phi/(2\\pi f_{\\text{mod}})$, so $d=c_0\\phi/(4\\pi f_{\\text{mod}})$. Every\npixel of a special image sensor measures its own phase, giving a whole depth image at once. The catch: a phase repeats\nevery $2\\pi$, so distances beyond $c_0/(2f_{\\text{mod}})$ wrap around (the **ambiguity range**).\n\n**LiDAR and point clouds.** A scanning LiDAR fires pulses in many directions: a spinning head with a stack of lasers at\ndifferent elevation angles $\\theta_e$, sweeping the azimuth $\\varphi$. Each echo gives a distance $d$, and the direction\nplus distance give a point $(x,y,z)=d\\,(\\cos\\theta_e\\sin\\varphi,\\ \\cos\\theta_e\\cos\\varphi,\\ \\sin\\theta_e)$. Millions of\npoints per second form a **point cloud**: a 3D sketch of the street made of dots. The car's software finds the ground,\nthe kerbs, pedestrians and cars in those dots, and fuses them with cameras and radar ([A9](#A9)).\n\n```viz\na5-tof-3d\n```\n\n**Light through the body: pulse oximetry and PPG.** Shine red and infrared light into a fingertip or wrist and measure what\ncomes back with a photodiode. Tissue, bone and venous blood absorb a steady amount (the **DC** level). With every\nheartbeat the arteries swell, a little more blood sits in the light path, and the detected light dips by about $1$–$2\\%$\n(the **AC** part). The rhythm of the dips is the **photoplethysmogram** (PPG); the spacing of the peaks gives the heart\nrate. Oxygen-rich haemoglobin absorbs little red and more infrared; oxygen-poor haemoglobin absorbs a lot of red. So the\n**ratio of ratios** $R=(\\mathrm{AC}/\\mathrm{DC})_{\\text{red}}/(\\mathrm{AC}/\\mathrm{DC})_{\\text{IR}}$ tracks the oxygen\nsaturation. Dividing AC by DC cancels skin colour, finger thickness and LED brightness, the \"ratios beat absolutes\" rule.\nThe final step is an **empirical calibration line**, often close to $\\mathrm{SpO_2}\\approx110-25R$ (in %), measured on\nvolunteers against blood samples.\n\n```viz\na5-ppg\n```\n\n## Intuitive examples\n\n1. **Photon energies.** $450$ nm: $2.76$ eV; $550$ nm: $2.25$ eV ($3.612\\times10^{-19}$ J); $850$ nm: $1.46$ eV;\n   $1550$ nm: $0.80$ eV. Silicon's $1.12$ eV gap gives a cutoff of $1239.8/1.12=1107$ nm. Germanium ($0.66$ eV) reaches\n   $1879$ nm and InGaAs ($0.75$ eV) $1653$ nm, which is why $1550$ nm LiDARs need them.\n2. **A photodiode in a smartwatch.** At $850$ nm with $\\eta=0.8$, $\\mathcal R=0.548$ A/W (a perfect detector, $\\eta=1$, would\n   give $0.686$ A/W). $P_{\\text{opt}}=10$ µW returning from the skin gives $I=5.48$ µA, carried by $4.28\\times10^{13}$ photons\n   per second.\n3. **A phone pixel indoors.** A $1.4$ µm pixel, $0.1$ W/m² of green light ($550$ nm) at the sensor, $t_{\\exp}=10$ ms:\n   $5427$ photons arrive, $\\eta=0.6$ turns them into $N_e=3256$ electrons, shot noise $\\sqrt{N_e}=57$, so $\\mathrm{SNR}=57$\n   ($35.1$ dB). Cut the light 100-fold (a dim room) and the SNR drops tenfold, to about $5.7$: visible grain.\n4. **The shot-noise ladder.** $N_e=10$: SNR $3.2$ (relative noise $31.6\\%$); $100$: SNR $10$ ($10\\%$); $1000$: $31.6$\n   ($3.2\\%$); $10\\,000$: $100$ ($1\\%$). Every 100× more light buys only 10× better SNR.\n5. **Full well and dynamic range.** Full well $6000$ e⁻: the best possible SNR is $\\sqrt{6000}=77.5$ ($37.8$ dB). With\n   $2$ e⁻ read noise, the dynamic range is $6000/2=3000$, i.e. $69.5$ dB or $11.6$ stops. At $10$ electrons the read noise\n   already pulls the SNR from $3.2$ to $10/\\sqrt{10+4}=2.67$. The well capacitance: $6000$ electrons over $1$ V is $0.96$ fF.\n6. **A 12-megapixel Bayer sensor** has $6$ million green, $3$ million red and $3$ million blue pixels.\n7. **LiDAR timing.** $1$ m away: echo after $6.67$ ns; $100$ m: $667.13$ ns; $200$ m: $1334.26$ ns. Timing steps of $1$ ns,\n   $100$ ps and $66.7$ ps give distance steps of $14.99$ cm, $1.50$ cm and $1.00$ cm.\n8. **Phase ToF in a phone.** With $f_{\\text{mod}}=20$ MHz the ambiguity range is $c_0/(2f_{\\text{mod}})=7.49$ m; a phase of\n   $90°$ means $d=1.874$ m; $1°$ of phase noise is $2.08$ cm of depth noise.\n9. **A 64-channel spinning LiDAR** with $2048$ azimuth steps at $10$ revolutions per second makes\n   $64\\times2048\\times10=1.31$ million points per second. The azimuth step is $0.176°$, so at $50$ m neighbouring points\n   are $15.3$ cm apart: a child's arm might fall between two of them.\n10. **Pulse oximetry.** AC/DC of $1.0\\%$ in red and $2.0\\%$ in infrared gives $R=0.50$ and $\\mathrm{SpO_2}\\approx97.5\\%$\n    (healthy). $R=0.7$ gives $92.5\\%$; $R=1.0$ gives $85\\%$ (dangerously low). Peaks $0.8$ s apart mean $75$ beats per minute.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $E_{\\text{ph}}=h_{\\text P}c_0/\\lambda$ | photon energy; in eV $=1239.8/\\lambda$[nm] | $h_{\\text P}$ Planck, $c_0$ speed of light |\n| $\\lambda_{\\text{cut}}=h_{\\text P}c_0/E_g$ | longest wavelength a detector sees | $E_g$ band gap (Si 1.12 eV → 1107 nm) |\n| $I=\\mathcal R\\,P_{\\text{opt}}$, $\\mathcal R=\\eta q_e\\lambda/(h_{\\text P}c_0)$ | photocurrent and responsivity | $\\eta$ quantum efficiency, $q_e$ elementary charge |\n| $N_e=\\eta\\,\\Phi\\,t_{\\exp}$ | electrons collected in one pixel | $\\Phi$ photon rate on the pixel, $t_{\\exp}$ exposure |\n| $\\sigma_{N_e}=\\sqrt{N_e}$, $\\mathrm{SNR}=\\sqrt{N_e}$ | shot noise (Poisson) | with read noise $\\sigma_r$: $\\mathrm{SNR}=N_e/\\sqrt{N_e+\\sigma_r^2}$ |\n| $\\mathrm{DR}=N_{\\text{full}}/\\sigma_r$ | dynamic range; dB $=20\\log_{10}$, stops $=\\log_2$ | $N_{\\text{full}}$ full-well capacity |\n| $d=c_0\\,t/2$, $\\Delta d=c_0\\,\\Delta t/2$ | pulsed time of flight and its resolution | $t$ round-trip time |\n| $d=\\dfrac{c_0\\,\\phi}{4\\pi f_{\\text{mod}}}$, $d_{\\max}=\\dfrac{c_0}{2f_{\\text{mod}}}$ | phase time of flight and its ambiguity range | $\\phi$ phase shift, $f_{\\text{mod}}$ modulation |\n| $R=\\dfrac{(\\mathrm{AC}/\\mathrm{DC})_{\\text{red}}}{(\\mathrm{AC}/\\mathrm{DC})_{\\text{IR}}}$, $\\mathrm{SpO_2}\\approx110-25R$ | pulse oximetry (empirical calibration) | AC pulse part, DC steady part |\n\n## Applications\n\n| World | Photodiodes, image sensors and LiDAR | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | drone multispectral cameras (red and near-infrared bands → NDVI); chlorophyll-fluorescence photodiodes; LiDAR scans of orchards and forests | which part of a field is stressed; how well photosynthesis runs; canopy height, volume and biomass |\n| 🧬 Biology & human health | PPG in smartwatches; finger-clip pulse oximeters; fluorescence detectors in PCR machines and lab-on-a-chip; endoscope cameras | heart rate and its variability; blood oxygen; how much DNA or a marker is present; images inside the body |\n| 🌍 Environment | optical particle counters (PM2.5); turbidity sensors in rivers; NDIR CO₂ sensors (infrared absorption); atmospheric LiDAR | fine dust in the air; murky water after a storm; CO₂ in ppm; clouds and aerosol layers |\n| 🤖 Robotics & drones | LiDAR for mapping; optical-flow cameras under drones; ToF proximity sensors in robot fingers; line-following photodiodes | a 3D map to avoid obstacles; drift over the ground; distance to an object before grasping; the path |\n| 🚗 Cars | roof and bumper LiDAR; camera-based lane keeping; rain sensors on the windscreen (infrared reflection); automatic headlights | distances to every object; lane position; when to start the wipers; when to switch on lights |\n| 📱 Phones & photography | the CMOS camera (millions of buckets); ToF and dot-projector depth sensors for face unlock and portrait blur; ambient-light and proximity sensors | the photo, its exposure and grain; depth for focus and security; screen brightness; screen off at your ear |\n| 🏠 Home & household | optical smoke detectors (scattered light); IR remote-control receivers; robot-vacuum LiDAR; solar-garden lights that switch at dusk | smoke particles in the chamber; which button you pressed; the floor plan; whether it is dark |\n\n## Derivation\n\n**(a) Responsivity.**\n1. Photon energy: $E_{\\text{ph}}=h_{\\text P}c_0/\\lambda$.\n2. Photons per second in a beam of power $P_{\\text{opt}}$: $\\Phi=P_{\\text{opt}}/E_{\\text{ph}}=P_{\\text{opt}}\\lambda/(h_{\\text P}c_0)$.\n3. Electrons per second that reach the contacts: $\\eta\\,\\Phi$.\n4. Current: $I=q_e\\,\\eta\\,\\Phi=\\dfrac{\\eta\\,q_e\\,\\lambda}{h_{\\text P}c_0}\\,P_{\\text{opt}}=\\mathcal R\\,P_{\\text{opt}}$.\n5. Numerically $\\mathcal R=\\eta\\,\\lambda[\\text{nm}]/1239.8$ A/W, because $h_{\\text P}c_0/q_e=1239.8$ V·nm.\n\n**(b) Shot noise.**\n1. Split the exposure into many tiny time slices; in each, an electron is generated with a small probability $p$, independently.\n2. The count is a sum of $n$ independent yes/no events: mean $np=N_e$, variance $np(1-p)\\approx np=N_e$ (as $p\\to0$; this is the Poisson limit).\n3. Standard deviation $\\sigma_{N_e}=\\sqrt{N_e}$.\n4. $\\mathrm{SNR}=N_e/\\sigma_{N_e}=\\sqrt{N_e}$. Doubling the light improves SNR only by $\\sqrt2\\approx1.41$.\n5. Independent noises add in variance: with read noise $\\sigma_r$, total variance $N_e+\\sigma_r^2$, so $\\mathrm{SNR}=N_e/\\sqrt{N_e+\\sigma_r^2}$.\n\n**(c) Pulsed time of flight.**\n1. Out and back the light travels $2d$ at speed $c_0$: $c_0t=2d$, so $d=c_0t/2$.\n2. A timing error $\\delta t$ gives a distance error $\\delta d=c_0\\,\\delta t/2$; the same holds for the clock's step.\n3. Pulses must not overlap: the next pulse leaves after the farthest echo, so the pulse rate is at most $c_0/(2d_{\\max})$.\n\n**(d) Phase time of flight.**\n1. The light brightness is modulated as $\\cos(2\\pi f_{\\text{mod}}t)$.\n2. The echo is delayed by $2d/c_0$, which is a phase lag $\\phi=2\\pi f_{\\text{mod}}\\cdot2d/c_0$.\n3. Solve: $d=c_0\\phi/(4\\pi f_{\\text{mod}})$.\n4. $\\phi$ is only known modulo $2\\pi$, so distances repeat every $c_0/(2f_{\\text{mod}})$. Two modulation frequencies resolve the ambiguity.\n\n**(e) Why the ratio of ratios works (Beer–Lambert).**\n1. Light through tissue: $I=I_0\\,e^{-\\mu_{\\text a}\\ell_p}$, with absorption coefficient $\\mu_{\\text a}$ and path length $\\ell_p$.\n2. A heartbeat adds a small extra path $\\Delta\\ell_p$ of arterial blood: $I\\to I\\,e^{-\\mu_{\\text{art}}\\Delta\\ell_p}\\approx I(1-\\mu_{\\text{art}}\\Delta\\ell_p)$.\n3. So $\\mathrm{AC}/\\mathrm{DC}\\approx\\mu_{\\text{art}}\\Delta\\ell_p$: the unknown $I_0$ (LED, skin) has cancelled.\n4. The ratio for red and infrared: $R=\\mu_{\\text{art,red}}/\\mu_{\\text{art,IR}}$; the unknown $\\Delta\\ell_p$ cancels too.\n5. $R$ depends only on the blood's mix of oxy- and deoxy-haemoglobin, i.e. on $\\mathrm{SpO_2}$. Light scattering makes the exact relation messy, hence the empirical calibration line.\n\n## Worked check\n\n**A LiDAR echo.** An echo returns after $t=250.2$ ns. Distance: $d=c_0t/2=2.998\\times10^8\\times250.2\\times10^{-9}/2=37.50$ m.\n\n**How strong is that echo?** The $940$ nm detector has $\\eta=0.5$:\n- $\\mathcal R=\\eta\\lambda/1239.8=0.5\\times940/1239.8=0.379$ A/W.\n- A returning power of $2$ nW gives $I=0.379\\times2\\times10^{-9}=0.758$ nA.\n- In a $5$ ns pulse window that is $47$ photons, of which $\\eta=0.5$ makes about $24$ electrons, so the shot-noise SNR of one\n  echo is $\\sqrt{24}\\approx4.9$. That is why LiDARs use avalanche or single-photon detectors that multiply each electron,\n  and fire many pulses per point. (All numbers from `scripts/checks/A5_check.py`.)\n\n## Whiteboard plan\n\n- **Panel 1 — photons.** Draw a wavy arrow labelled $\\lambda$ and a little packet labelled $E_{\\text{ph}}=h_{\\text P}c_0/\\lambda$.\n  Beside it, a ladder with a gap of $1.12$ eV: a blue photon lifts an electron across, an infrared $1550$ nm photon does\n  not. Write \"Si sees up to $1.1$ µm\".\n- **Panel 2 — the photodiode.** A p–n junction, photons coming in, electron and hole swept apart, an ammeter. Box\n  $I=\\mathcal R P_{\\text{opt}}$ and $\\mathcal R=\\eta q_e\\lambda/(h_{\\text P}c_0)$.\n- **Panel 3 — buckets.** A 4×4 grid of buckets with rain; levels uneven. Write $N_e=\\eta\\Phi t_{\\exp}$, $\\sigma=\\sqrt{N_e}$,\n  $\\mathrm{SNR}=\\sqrt{N_e}$. Draw one overflowing bucket: \"full well → white sky\".\n- **Panel 4 — Bayer.** A 2×2 block G R / B G. Say: \"each pixel guesses two of its three colours.\"\n- **Panel 5 — time of flight.** A car, a person, an arrow out and back. Write $d=c_0t/2$, \"$30$ cm per ns\", \"$1$ ns → $15$ cm\".\n  Then a spinning head with three rays and the dots they leave: the point cloud.\n- **Panel 6 — fingertip.** A finger between an LED pair and a photodiode, a wavy PPG trace with AC on top of a big DC.\n  Write $R=(\\mathrm{AC}/\\mathrm{DC})_{\\text{red}}/(\\mathrm{AC}/\\mathrm{DC})_{\\text{IR}}$ and \"ratios cancel the skin\".\n\n## Common mistakes and where the intuition breaks\n\n- **\"More energy per photon means more current.\"** Per watt it is the other way round: a watt of infrared contains more\n  photons than a watt of blue, so $\\mathcal R$ grows with $\\lambda$, until the band gap cuts it off.\n- **Forgetting the factor 2 in $d=c_0t/2$.** The pulse travels there *and back*.\n- **Thinking noise is a fixed number of electrons.** Shot noise grows with the signal ($\\sqrt{N_e}$); only the read noise is\n  fixed. Bright parts of a photo have *more* noise in electrons but *less* relative noise.\n- **\"Raising ISO makes the sensor more sensitive.\"** ISO is mostly gain after the photodiode: it brightens the picture but\n  cannot add photons, so it amplifies the grain together with the image.\n- **Saturation is not \"very bright\".** A saturated pixel has lost the information; no software can recover the sky. Expose\n  for the highlights, or use HDR.\n- **Pulse oximeters and skin.** The ratio-of-ratios cancels most effects, but not all: calibration lines measured mostly\n  on light-skinned volunteers have been shown to overestimate SpO₂ in people with darker skin, and nail polish, cold fingers\n  and movement all disturb the reading. Calibration ([A8](#A8)) is part of the sensor.\n- **Where the picture breaks:** with only a few photons per pixel (night vision, single-photon LiDAR), you count\n  individual photons and must think in probabilities, not in smooth currents. With fog, rain or a black car, LiDAR echoes\n  become weak or split, and point clouds get holes.\n\n## Remember\n\n**\"One photon frees at most one electron: $I=\\mathcal RP_{\\text{opt}}$, a pixel counts $N_e$ with noise $\\sqrt{N_e}$, and distance is $d=c_0t/2$.\"**\n\n## Self-test\n\n1. A photodiode with $\\eta=0.7$ is lit by $1$ mW at $650$ nm. What is the current?\n   <details><summary>Answer<\/summary>R = 0.7 × 650/1239.8 = 0.367 A/W, so I = 0.367 A/W × 1 mW = 0.367 mA.<\/details>\n2. A night photo has 25 electrons per pixel in the shadows. How many frames must the phone average to reach an SNR of 15?\n   <details><summary>Answer<\/summary>One frame: SNR = √25 = 5. Averaging M frames gives SNR 5√M, so √M = 3 and M = 9 frames (it is the same as collecting 225 electrons in one long exposure).<\/details>\n3. A LiDAR must tell apart two objects 3 cm apart in depth. What timing resolution does it need?\n   <details><summary>Answer<\/summary>Δd = c Δt / 2, so Δt = 2Δd/c = 2 × 0.03 / 3×10⁸ = 0.2 ns = 200 ps.<\/details>\n\n**Next:** [A6 Electrochemical sensors and biosensors](#A6) — instead of photons freeing electrons, molecules trade electrons with an electrode, and chemistry becomes a current.\n"}, {"id": "A6", "short": "Electrochemical sensors and biosensors", "title": "Electrochemical sensors and biosensors", "part": "A", "md": "# A6. Electrochemical sensors and biosensors\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A3 Capacitive sensors](#A3) · used by [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration and drift](#A8), [C3 Diffusion, mixing and the Péclet number](#C3), [C5 Lab-on-a-chip](#C5)\n\n## Hook — a battery made from a lemon\n\nPush a galvanised (zinc-coated) nail and a copper coin into a lemon and connect them to a voltmeter: about one volt. No\nmoving parts, no light, nothing visible happens, yet the lemon is a battery. Zinc atoms give up electrons more eagerly\nthan copper does, and the juice lets ions move between the two metals to close the circuit. **The voltage tells you\nwhich chemicals are there and how much of them.**\n\nEvery electrochemical sensor is a small, carefully designed version of that lemon. A pH probe in a swimming pool, the\nglucose meter a person with diabetes uses five times a day, the carbon-monoxide alarm on a bedroom ceiling and a nitrate\nprobe in a farmer's soil all measure chemistry by measuring either a **voltage** (how hard the electrons want to move) or\na **current** (how many electrons per second the chemistry delivers).\n\n## The idea in plain words\n\n**Redox: chemistry is electron trading.** In a reduction–oxidation (redox) reaction one species gives up electrons\n(it is **oxidised**) and another takes them (it is **reduced**). Zinc metal → zinc ions + 2 electrons is an oxidation;\ncopper ions + 2 electrons → copper metal is a reduction. Normally the trade happens when molecules bump into each other.\nAt an **electrode**, a piece of metal or carbon dipped in a solution, the electrons go through the electrode and the wire\ninstead, so we can measure them. One mole of electrons carries a charge of $\\mathcal F=96\\,485$ C, the **Faraday\nconstant**, so counting coulombs counts molecules.\n\n**The electrode–electrolyte interface.** Where metal meets a salty liquid, charge separates: excess electrons (or a lack\nof them) on the metal surface, a layer of oppositely charged ions in the liquid just a nanometre away. This **double\nlayer** is a capacitor with a gap of molecular size, so it is huge per area (about $10$–$40$ µF per cm²,\nsee [A3](#A3)). Changing the electrode's voltage first has to charge this capacitor, which is why\nevery amperometric measurement starts with a short charging spike. The voltage across the double layer decides which\nreactions run and how fast.\n\n**Potentiometric sensors: measure the voltage, draw no current.** If an electrode can exchange electrons (or a membrane\ncan let through ions) with one particular species, a voltage builds up until the electrical push exactly balances the\nchemical urge, and then nothing more flows. That equilibrium voltage depends on the logarithm of the ion's activity $a$\n(its \"effective concentration\"; in dilute solutions roughly its concentration in mol/L), as stated by the **Nernst\nequation**:\n$$V=V^0+\\frac{R_gT}{z\\mathcal F}\\ln a=V^0+\\frac{R_gT\\ln10}{z\\mathcal F}\\log_{10}a .$$\nHere $V^0$ is a constant for the electrode, $R_g=8.314$ J/(mol·K) the gas constant, $T$ the absolute temperature and $z$ the\nion's charge ($+1$ for H⁺ or K⁺, $+2$ for Ca²⁺, $-1$ for nitrate NO₃⁻). The slope is about **59 mV per factor of ten**\nat 25 °C for $z=1$. The sensor is linear in $\\log a$, not in $a$, which is ideal for quantities that span many decades.\n\n```viz\na6-nernst\n```\n\n**The pH electrode.** A thin bulb of special glass lets its surface exchange H⁺ ions with the solution. Inside the bulb\nis a buffer of fixed pH and an internal wire; outside, a **reference electrode** (silver coated with silver chloride in\na KCl solution) provides a stable, known potential to measure against. Because $\\mathrm{pH}=-\\log_{10}a_{\\mathrm{H^+}}$,\nthe voltage falls by $59.16$ mV for every pH unit at 25 °C; a typical glass electrode is built to read $0$ mV at pH 7.\n**Ion-selective electrodes** replace the glass by a plastic membrane containing a molecule (an ionophore or ion\nexchanger) that binds only one ion: nitrate for soil and water, potassium and sodium for blood and sweat, calcium for\nmilk. Their weak points are temperature (the slope is proportional to $T$), drift of $V^0$ (they must be calibrated in\nknown buffers, [A8](#A8)) and interfering ions that the membrane also lets through a little.\n\n**Amperometric sensors: hold the voltage, measure the current.** Now force the reaction to run. Hold the electrode at a\npotential where the target molecule is oxidised (or reduced) the instant it arrives. The current then tells you how many\nmolecules arrive per second. Each molecule delivers $n$ electrons, so\n$$I=n\\,\\mathcal F\\times(\\text{moles arriving per second}).$$\nBecause the electrode consumes everything that touches it, the molecules nearby are used up and a **depletion layer**\nforms. New molecules must **diffuse** across it ([C3](#C3)), and its thickness\ngrows like $\\sqrt{\\pi Dt}$, where $D$ is the diffusion coefficient. The flux through a layer is about\n$D\\,c/\\delta$, so the current falls as $1/\\sqrt t$: the **Cottrell equation**\n$$I(t)=n\\,\\mathcal F\\,A\\,c\\,\\sqrt{\\frac{D}{\\pi t}},$$\nwith $A$ the electrode area an
