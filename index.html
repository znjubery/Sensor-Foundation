he forces balance: $\\Delta p\\,\\pi r^2=-\\mu\\,\\dfrac{du}{dr}\\,2\\pi rL$.\n5. Solve for the slope: $\\dfrac{du}{dr}=-\\dfrac{\\Delta p\\,r}{2\\mu L}$.\n6. Integrate from the wall, where no-slip gives $u(r_0)=0$: $u(r)=\\dfrac{\\Delta p}{4\\mu L}(r_0^2-r^2)$.\n\n**(b) Flow rate, mean speed, resistance.**\n1. Split the cross-section into thin rings of radius $r$, width $dr$, area $2\\pi r\\,dr$; the volume per second through a ring is $u(r)\\,2\\pi r\\,dr$.\n2. $Q=\\displaystyle\\int_0^{r_0}\\frac{\\Delta p}{4\\mu L}(r_0^2-r^2)\\,2\\pi r\\,dr=\\frac{\\pi\\Delta p}{2\\mu L}\\Big[\\frac{r_0^2r^2}{2}-\\frac{r^4}{4}\\Big]_0^{r_0}=\\frac{\\pi r_0^4\\Delta p}{8\\mu L}$.\n3. Mean speed: $\\bar u=Q/(\\pi r_0^2)=\\Delta p\\,r_0^2/(8\\mu L)=\\tfrac12u_{\\max}$.\n4. Resistance: $R_{\\text{hyd}}=\\Delta p/Q=8\\mu L/(\\pi r_0^4)$.\n\n**(c) Flat channel, $h\\ll w$.**\n1. Same balance on a slab of thickness $2y$ centred in a channel of height $h$ (per unit width): $\\Delta p\\cdot2y=-2\\mu L\\,du/dy$.\n2. Integrate with $u=0$ at $y=\\pm h/2$: $u(y)=\\dfrac{\\Delta p}{2\\mu L}\\Big(\\dfrac{h^2}{4}-y^2\\Big)$.\n3. Integrate over height and width: $Q=\\dfrac{wh^3\\Delta p}{12\\mu L}$, so $R_{\\text{hyd}}=\\dfrac{12\\mu L}{wh^3}$.\n4. Side walls slow the fluid near them; the exact Fourier solution gives the factor $1-\\dfrac{192h}{\\pi^5w}\\sum_{n\\text{ odd}}\\dfrac{\\tanh(n\\pi w/2h)}{n^5}\\approx1-0.63\\,h/w$.\n\n**(d) Wall shear stress.**\n1. Tube: $\\tau_w=\\mu\\,|du/dr|$ at $r=r_0$ $=\\Delta p\\,r_0/(2L)$.\n2. Replace $\\Delta p$ using $Q$: $\\tau_w=\\dfrac{4\\mu Q}{\\pi r_0^3}=\\dfrac{4\\mu\\bar u}{r_0}$.\n3. Flat channel: $\\tau_w=\\mu\\,|du/dy|$ at $y=h/2$ $=\\Delta p\\,h/(2L)=\\dfrac{6\\mu Q}{wh^2}$.\n\n**(e) Circuits and compliance.**\n1. Conservation of volume at a junction: $\\sum Q_{\\text{in}}=\\sum Q_{\\text{out}}$ (Kirchhoff's current law).\n2. Series: same $Q$, so $\\Delta p=Q(R_1+R_2)$. Parallel: same $\\Delta p$, so $Q=\\Delta p(1/R_1+1/R_2)$.\n3. A compliant chamber at pressure $p$ stores $V(p)$; its inflow is $dV/dt=C_{\\text{hyd}}\\,dp/dt$, like $I=C\\,dV/dt$.\n4. A syringe pump delivers $Q_0$ into the chamber, which empties through $R_{\\text{hyd}}$: $C_{\\text{hyd}}\\dot p=Q_0-p/R_{\\text{hyd}}$.\n5. This is the first-order lag $\\tau\\dot p+p=Q_0R_{\\text{hyd}}$ with $\\tau=R_{\\text{hyd}}C_{\\text{hyd}}$, so $Q_{\\text{out}}=p/R_{\\text{hyd}}=Q_0(1-e^{-t/\\tau})$.\n\n**(f) Murray's law (the intuition).**\n1. Pumping power through a vessel: $\\Delta p\\,Q=R_{\\text{hyd}}Q^2\\propto Q^2L/r_0^4$.\n2. Cost of keeping the vessel (its volume of blood or sap): $\\propto r_0^2L$.\n3. Minimise the sum over $r_0$: $-4aQ^2/r_0^5+2b\\,r_0=0\\Rightarrow Q\\propto r_0^3$.\n4. Volume conservation at a fork, $Q_{\\text{p}}=\\sum Q_{\\text{d}}$, then gives $r_{\\text{p}}^3=\\sum r_{\\text{d}}^3$, and $\\tau_w\\propto Q/r_0^3$ is the same in every branch.\n\n## Worked check\n\nTwo identical channels (100 µm × 50 µm × 1 cm) in parallel, followed by one more of the same channel in series, are\nfed by a syringe pump at 20 µL/min of water.\n\n- One channel: $R=\\dfrac{12(10^{-3})(10^{-2})}{(10^{-4})(5\\times10^{-5})^3(1-0.63\\times0.5)}=\\dfrac{1.2\\times10^{-4}}{8.5625\\times10^{-18}}=1.40\\times10^{13}$ Pa·s/m³.\n- Parallel pair: $R/2=7.01\\times10^{12}$; total $R+R/2=2.10\\times10^{13}$ Pa·s/m³.\n- $Q=20$ µL/min $=3.33\\times10^{-10}$ m³/s, so the pump must reach $\\Delta p=QR_{\\text{tot}}=7007$ Pa ≈ 7.0 kPa.\n- The junction between the pair and the last channel sits at $Q\\cdot R=2336$ Pa (only the last channel lies below it),\n  and each parallel branch carries 10 µL/min (equal resistances share equally) ✓.\n- Electrical twin: 7.0 V across a 0.35 MΩ resistor network carries 20 µA (with 1 kPa ↔ 1 V, 1 µL/min ↔ 1 µA).\n  All numbers come from `scripts/checks/C2_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — the hose.** A thick short hose and a thin long one with the same tap. Write \"$Q$ grows with $\\Delta p$,\n  shrinks with $L$, and very fast with radius\".\n- **Panel 2 — the fluid cylinder.** A tube in side view, an inner cylinder of radius $r$, arrows \"$\\Delta p\\,\\pi r^2$\"\n  on its end and \"drag $\\times 2\\pi rL$\" on its side. Five lines of algebra down to the parabola; draw the profile\n  as arrows, zero at the walls.\n- **Panel 3 — rings.** The cross-section as a target of rings; write $Q=\\int u\\,2\\pi r\\,dr=\\pi r_0^4\\Delta p/(8\\mu L)$.\n  Circle the 4 and write \"halve $r_0$ → ÷16\". Beside it: rectangle, $12\\mu L/(wh^3)$, \"height cubed\".\n- **Panel 4 — Ohm's law for water.** Two columns: $V=IR$ | $\\Delta p=QR_{\\text{hyd}}$; battery | pressure controller;\n  current source | syringe pump; capacitor | soft PDMS / bubble. Draw the chip network and its circuit twin.\n- **Panel 5 — RC.** A syringe, a bubble, a channel; under it the curve $1-e^{-t/\\tau}$ with $\\tau=RC$ marked.\n- **Panel 6 — the tree.** A 30 m tree with xylem tubes; \"friction 0.6 MPa + lift 0.29 MPa ≈ 0.9 MPa of tension\"; a\n  forking vessel with \"$r_{\\text p}^3=r_1^3+r_2^3$\".\n\n## Common mistakes and where the intuition breaks\n\n- **Forgetting the fourth (or third) power.** Doubling a channel's height doesn't double the flow, it multiplies it\n  by about 8. Fabrication tolerances on $h$ matter far more than on $w$ or $L$.\n- **Using the mean speed as the speed of everything.** The centre moves at twice the mean (tube) or 1.5 times the mean\n  (flat channel); particles near walls barely move. Residence times differ, which spreads out a sample (C3).\n- **Using $12\\mu L/(wh^3)$ for a square channel.** Without the $(1-0.63h/w)$ bracket a square channel's resistance is\n  underestimated by a factor of 2.4. And always put the *smaller* dimension as $h$.\n- **Ignoring tubing and connectors.** Thin tubing is a resistor too: 30 cm of 250 µm inside-diameter tubing has\n  $3.1\\times10^{12}$ Pa·s/m³, a fifth of one chip channel. Measure or include it.\n- **Thinking a syringe pump gives a steady flow instantly.** Compliance (soft PDMS, tubing, bubbles) creates a lag of\n  seconds to minutes, and stepper motors add pulsation. Pressure controllers are faster but depend on $R_{\\text{hyd}}$,\n  which changes if a channel clogs or a cell gets stuck.\n- **Where the analogy breaks.** Hydraulic resistance is linear only while $\\mathrm{Re}$ stays small; at higher Re\n  (big pipes, turbulent hoses) $\\Delta p$ grows faster than $Q$. Soft channels also widen under pressure, so\n  $R_{\\text{hyd}}$ drops as $\\Delta p$ rises (a \"nonlinear resistor\"). And blood is not a simple fluid: red cells make\n  it shear-thinning and they gather in the centre of small vessels.\n- **Negative pressure in xylem is not a vacuum pump.** A suction pump can lift water only about 10 m (one atmosphere).\n  Trees reach 100 m because the water is under true tension, held together by cohesion; that state is metastable and\n  can break (embolism), which is what an ultrasonic \"cavitation\" sensor on a stem listens for.\n\n## Remember\n\n**\"Δp = Q·R_hyd: a tube's R_hyd = 8μL/(πr₀⁴), a channel's ≈ 12μL/(wh³). Series add, parallel add as 1/R, and τ = R_hyd·C_hyd.\"**\n\n## Self-test\n\n1. A channel network has a total hydraulic resistance of $5\\times10^{13}$ Pa·s/m³. What pressure gives 6 µL/min, and what flow do you get from 2 kPa?\n   <details><summary>Answer<\/summary>6 µL/min = 1.0e-10 m³/s, so Δp = 1.0e-10 × 5e13 = 5000 Pa = 5 kPa. From 2 kPa: Q = 2000 / 5e13 = 4e-11 m³/s = 2.4 µL/min.<\/details>\n2. An artery narrows so its radius is 80 % of normal. If the pressure across it stays the same, what fraction of the flow remains? What if the body wants to keep the flow constant?\n   <details><summary>Answer<\/summary>Q scales as radius to the fourth: 0.8^4 = 0.41, so 41 % of the flow remains (a 59 % drop). To keep the flow, the pressure drop across that segment would have to rise by 1/0.41 ≈ 2.4 times.<\/details>\n3. A 1 mm-wide, 100 µm-high organ-chip channel gives 0.5 Pa wall shear at 50 µL/min. You want 2 Pa. Name two ways to get it.\n   <details><summary>Answer<\/summary>Shear in a flat channel is 6μQ/(w h²). Either raise the flow 4×, to 200 µL/min, or halve the height to 50 µm (shear rises 4× at the same flow, but the pressure needed rises about 8×). Using a more viscous medium also works.<\/details>\n\n**Next:** [C3 Diffusion, mixing and the Péclet number](#C3) — the flow now carries molecules down the channel; how long until they spread across it and mix?\n"}, {"id": "C3", "short": "Diffusion, mixing and the Péclet number", "title": "Diffusion, mixing and the Péclet number", "part": "C", "md": "# C3. Diffusion, mixing and the Péclet number\n\n> **Connects:** builds on [C1 Fluids at the microscale](#C1), [C2 Pressure-driven flow](#C2), [A8 Noise, resolution, calibration and drift](#A8) (sums of random kicks), [B1 Scaling laws](#B1) · used by [C4 Surface tension, droplets and electrokinetics](#C4), [C5 Lab-on-a-chip](#C5)\n\n## Hook — a tea bag in still water\n\nLower a tea bag into a glass of cold water and don't stir. A brown cloud creeps out, but an hour later the top of the\nglass is still pale. Leave it overnight and the colour is finally even. Stir with a spoon and the same job takes two\nseconds.\n\nThe creeping cloud is **diffusion**: every tea molecule is jostled by water molecules and wanders off on a random walk.\nIt is hopeless over centimetres and very fast over micrometres, because the time it takes grows with the *square* of\nthe distance. That single square explains why a microfluidic chip can't rely on stirring (it has no turbulence, C1),\nwhy it doesn't need to if its channels are thin enough, why glucose reaches a test-strip electrode in seconds, and how\na chip can separate small molecules from big cells without any filter at all.\n\n## The idea in plain words\n\n**A random walk.** A dissolved molecule is hit by water molecules about $10^{13}$ times a second, from random\ndirections. Model this as a walk: every short time $\\tau_s$ it takes a step of length $\\delta$, left or right with\nequal chance, forgetting its past ($\\tau_s$ and $\\delta$ are local symbols). After $N$ steps its position is the sum of\n$N$ random $\\pm\\delta$. On average it goes nowhere: $\\langle x\\rangle=0$ (the angle brackets mean \"average over many\nmolecules\"). But its *spread* grows: the mean square displacement is\n$$\\langle x^2\\rangle=N\\delta^2=2Dt,\\qquad D=\\frac{\\delta^2}{2\\tau_s},$$\nwhere $t=N\\tau_s$ is the elapsed time and $D$ is the **diffusion coefficient** (m²/s). The typical distance travelled,\n$\\sqrt{\\langle x^2\\rangle}=\\sqrt{2Dt}$, grows as the **square root of time**: to go twice as far takes four times as\nlong. In 2D, $\\langle r^2\\rangle=4Dt$; in 3D, $6Dt$. This is the same mathematics as noise adding up in A8: independent\nkicks add in squares, so their sum grows as $\\sqrt N$.\n\n```viz\nc3-random-walk\n```\n\n**Where $D$ comes from: Stokes–Einstein.** A molecule or particle of radius $r$ is driven by thermal energy $k_BT$\n($4.1\\times10^{-21}$ J at 25 °C) and held back by viscous drag $6\\pi\\mu r$ (Stokes' law, C1). Einstein showed in 1905\nthat\n$$D=\\frac{k_BT}{6\\pi\\mu r}.$$\nSmall and hot means fast; big and viscous means slow. In water at 25 °C ($\\mu=0.89$ mPa·s): glucose\n($r\\approx0.38$ nm) has $D=6.5\\times10^{-10}$ m²/s; the blood protein albumin (3.5 nm) $7.0\\times10^{-11}$; an\nantibody (5.5 nm) $4.5\\times10^{-11}$; a bacterium (1 µm) $2.5\\times10^{-13}$; a human cell (5 µm) $4.9\\times10^{-14}$.\nSo small molecules sit near $10^{-9}$, proteins near $10^{-10}$–$10^{-11}$, cells near $10^{-13}$ m²/s.\n\n**Fick's laws.** Follow many molecules at once and describe them by a concentration $c(\\mathbf x,t)$ (mol/m³). More\nmolecules jump from crowded places to empty ones than the reverse, so there is a net **flux** down the gradient:\n$$J=-D\\,\\frac{\\partial c}{\\partial x}\\qquad\\text{(Fick's first law)}.$$\nConservation (what flows out of a slice is lost from it) turns this into\n$$\\frac{\\partial c}{\\partial t}=D\\,\\nabla^2c\\qquad\\text{(Fick's second law)}.$$\nThis is exactly the **heat equation**: heat diffusing through a thermistor (A2) and a glucose cloud spreading through\na channel are the same mathematics, with temperature replaced by concentration. Its basic solution, a puff released at\na point, is a Gaussian $c\\propto e^{-x^2/4Dt}/\\sqrt{4\\pi Dt}$ whose width grows as $\\sqrt{2Dt}$.\n\n**The Péclet number: carried or spread?** In a channel, molecules are *carried* along by the flow at speed $U$ and\n*spread* across it by diffusion. Across a channel of width $w$, diffusion needs a time $t_D\\sim w^2/D$. In that time\nthe flow carries them a distance $Ut_D=Uw^2/D$. The ratio of these effects is the **Péclet number**\n$$\\mathrm{Pe}=\\frac{Uw}{D}=\\frac{\\text{transport by flow}}{\\text{transport by diffusion}},$$\nand the **mixing length** is about $L_{\\text{mix}}\\sim\\mathrm{Pe}\\cdot w$: Pe channel widths. It is built just\nlike the Reynolds number (C1), with $D$ in place of $\\nu$. But in water $D$ is about 1000 times smaller than\n$\\nu=10^{-6}$ m²/s, so a chip with $\\mathrm{Re}=0.1$ typically has $\\mathrm{Pe}=100$: flow wins over diffusion even\nwhen viscosity wins over inertia.\n\n**Two streams in a T-junction.** A sample (concentration 1) and a buffer (0) meet and flow side by side (C1). The\nsharp step between them blurs as the molecules diffuse: after flowing a distance $x$ (time $x/U$) the blurred zone is\nabout $\\sqrt{4Dx/U}$ wide. Once it has reached the walls, the step erodes towards a flat $c=\\tfrac12$. The exact\nsolution (a sum of sine waves, derived below) says the stripes have faded to 10 % of their initial contrast at\n$x\\approx0.23\\,\\mathrm{Pe}\\,w$. For glucose in a 100 µm channel at 1 mm/s, that is about 3.6 mm; for a protein,\nseveral centimetres. Most chips are a few centimetres long, so **proteins don't mix by themselves**.\n\n```viz\nc3-mixing-3d\n```\n\n**Mixers fold the fluid.** Since a chip can't make turbulence, it must make the diffusion distance smaller. A\n**serpentine** channel with sharp bends adds some secondary flow; the famous **staggered herringbone mixer** (Stroock\nand co-workers, 2002) has chevron-shaped grooves on the floor that make the fluid corkscrew. Each cycle of grooves\nstretches and folds the two streams, so the stripes of sample and buffer get thinner: roughly halved each cycle. This\nis **chaotic advection**: laminar flow that still stretches material exponentially. After $n$ cycles the stripes are\n$\\delta_n\\approx w/2^n$ thick (local symbol), and diffusion across $\\delta_n$ takes only $\\delta_n^2/D$, which\ncollapses quickly. The number of cycles needed grows only as $\\log_2$ of Pe: about $\\tfrac12\\log_2(\\mathrm{Pe}\\,w/\\lambda_{\\text{hb}})$\nfor a cycle length $\\lambda_{\\text{hb}}$. A protein that needed 20 cm in a straight channel mixes in about 1 mm.\n\n**The H-filter: separating by diffusion.** Run blood (or a dirty water sample) beside a clean buffer stream for a few\nseconds, then split the channel again into two outlets, like an \"H\". Small molecules diffuse across into the buffer in\nthe time available; big particles, cells and bacteria barely move. The buffer outlet now carries the small molecules,\ncleaned of cells, with no membrane to clog. Separation without a filter.\n\n**Taylor dispersion.** In pressure-driven flow the centre moves twice as fast as the mean (C2) and the walls not at\nall, so a short plug of sample is smeared into a long streak. Diffusion across the channel partly rescues it: molecules\nkeep sampling fast and slow lanes, so the plug spreads like a diffusion with an **effective** coefficient\n$D_{\\text{eff}}=D\\,(1+\\mathrm{Pe}_r^2/48)$ in a tube of radius $r_0$, with $\\mathrm{Pe}_r=\\bar u r_0/D$. This can be\nhundreds to thousands of times larger than $D$, which blurs pulses in chromatography and in chip-based assays.\n\n**Diffusion to a sensor surface.** A biosensor (A6) consumes the molecules that reach it: a glucose electrode oxidises\nglucose, an antibody spot captures a protein. Next to the surface, a **depletion layer** forms, about $\\sqrt{\\pi Dt}$\nthick, and grows with time; the flux to the surface falls as $J=c_0\\sqrt{D/(\\pi t)}$ (the Cottrell law, A6). In still\nliquid, the signal therefore drifts down as $1/\\sqrt t$. Flow over the sensor stops the layer from growing (Pe again),\nwhich gives a steady, larger signal. Diffusion, not chemistry, often sets how fast a sensor responds.\n\n## Intuitive examples\n\n1. **Diffusion is fast, then slow.** Glucose ($D=6.5\\times10^{-10}$ m²/s) diffuses 1 µm in 0.8 ms, 10 µm in 77 ms,\n   100 µm in 7.7 s, 1 mm in 13 min (774 s) and 1 cm in 21.5 h, from $t=x^2/(2D)$. The tea in the glass (1 cm,\n   $D\\approx10^{-9}$ m²/s) needs about 14 h.\n2. **Big molecules are slow.** Albumin ($7.0\\times10^{-11}$ m²/s) needs 71 s for 100 µm and 2 h for 1 mm. A bacterium\n   ($2.5\\times10^{-13}$ m²/s) diffuses only 2.2 µm in 10 s, far less than its own swimming in one second.\n3. **Pe in a chip.** $w=100$ µm, $U=1$ mm/s. A small molecule ($D=10^{-9}$): $\\mathrm{Pe}=100$, crossing time\n   $w^2/D=10$ s, mixing length $\\sim\\mathrm{Pe}\\,w=1$ cm (exact 90 % point: 2.3 mm). A protein ($5\\times10^{-11}$):\n   $\\mathrm{Pe}=2000$, crossing time 200 s, $\\mathrm{Pe}\\,w=20$ cm (90 % point: 4.7 cm).\n4. **Herringbone.** The protein case with grooves of cycle length $\\lambda_{\\text{hb}}=200$ µm: diffusion can finish\n   stripes of $\\sqrt{D\\lambda_{\\text{hb}}/U}=3.2$ µm in one cycle, so it needs $\\log_2(100/3.16)=5.0$ halvings: 5 cycles,\n   1.0 mm, 200 times shorter than 20 cm. For Pe from $10^2$ to $10^5$ the cycles needed only grow from 2.8 to 7.8.\n5. **H-filter.** In 10 s beside a buffer, glucose spreads $\\sqrt{2Dt}=114$ µm (across the channel), albumin 37 µm,\n   bacteria 2.2 µm: the far outlet gets small molecules and almost no cells.\n6. **Taylor smear.** In a tube of radius 50 µm at 1 mm/s, glucose has $\\mathrm{Pe}_r=77$ and a plug spreads as if\n   $D_{\\text{eff}}=126\\,D$; albumin, $\\mathrm{Pe}_r=713$, spreads as if $D_{\\text{eff}}\\approx10^4D$.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $\\langle x^2\\rangle=2Dt$ (1D), $4Dt$ (2D), $6Dt$ (3D) | mean square displacement of a random walk | $D$ diffusion coefficient (m²/s), $t$ time |\n| $D=\\dfrac{\\delta^2}{2\\tau_s}$ | from step length and step time | $\\delta$, $\\tau_s$ local |\n| $D=\\dfrac{k_BT}{6\\pi\\mu r}$ | Stokes–Einstein | $r$ particle radius, $\\mu$ viscosity, $k_BT$ thermal energy |\n| $J=-D\\,\\dfrac{\\partial c}{\\partial x}$ | Fick's first law: flux down the gradient | $c$ concentration, $J$ in mol/(m²·s) |\n| $\\dfrac{\\partial c}{\\partial t}=D\\,\\nabla^2c$ | Fick's second law (heat equation) | |\n| $c(x,t)=\\dfrac{1}{\\sqrt{4\\pi Dt}}\\,e^{-x^2/4Dt}$ | spreading puff (per unit amount) | width $\\sqrt{2Dt}$ |\n| $\\mathrm{Pe}=\\dfrac{Uw}{D}$, $\\ t_D\\sim\\dfrac{w^2}{D}$, $\\ L_{\\text{mix}}\\sim\\mathrm{Pe}\\,w$ | flow vs. diffusion; mixing time and length | $U$ mean speed, $w$ channel width |\n| $L_{90}=\\dfrac{\\ln10}{\\pi^2}\\,\\mathrm{Pe}\\,w\\approx0.23\\,\\mathrm{Pe}\\,w$ | 90 % mixed, two streams, plug flow | exact series below |\n| $n\\approx\\log_2\\dfrac{w}{\\sqrt{D\\lambda_{\\text{hb}}/U}}=\\tfrac12\\log_2\\dfrac{\\mathrm{Pe}\\,w}{\\lambda_{\\text{hb}}}$ | cycles of a folding mixer | $\\lambda_{\\text{hb}}$ cycle length (local) |\n| $D_{\\text{eff}}=D\\Big(1+\\dfrac{\\mathrm{Pe}_r^2}{48}\\Big)$ | Taylor dispersion in a tube | $\\mathrm{Pe}_r=\\bar ur_0/D$ |\n| $J=c_0\\sqrt{\\dfrac{D}{\\pi t}}$, depletion $\\sqrt{\\pi Dt}$ | flux to a consuming sensor in still liquid | $c_0$ bulk concentration |\n\n## Applications\n\n| World | Diffusion, mixing and Péclet | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | CO₂ diffusing into leaves through stomata; nutrients diffusing to roots; nitrate electrodes in soil water | a leaf's last 100 µm to the chloroplasts is pure diffusion; a soil nitrate sensor responds in seconds to minutes because ions must diffuse through its membrane |\n| 🧬 Biology & human health | oxygen from capillaries to cells (no cell is more than ~100 µm from one); glucose strips; H-filters for blood plasma | tissue beyond ~200 µm starves (diffusion time ∝ distance²); a test strip waits a few seconds for glucose to diffuse to the electrode |\n| 🌍 Environment | water-quality chips mixing a sample with a colour reagent; pollutant plumes in still air or groundwater | a mixer turns a centimetre-long reaction zone into a millimetre; still-air diffusion is slow, so wind (Pe ≫ 1) carries pollution far |\n| 🤖 Robotics & drones | gas sensors on drones sampling plumes; \"electronic noses\" with a diffusion barrier | the sensor's response time is set by diffusion through its membrane, $t\\sim L^2/D$; moving air (high Pe) speeds it up |\n| 🚗 Cars | the λ (oxygen) sensor's diffusion barrier; fuel–air mixing; catalytic converter channels | a limiting-current λ-sensor *uses* a diffusion barrier so its current is proportional to oxygen concentration |\n| 📱 Phones & photography | humidity and gas sensors behind a tiny vent; Brownian motion of particles seen in phone-microscope videos | the vent's diffusion time sets how quickly the phone's humidity reading follows a change; tracking particles gives $D$ and so their size |\n| 🏠 Home & household | tea, coffee, sugar in a cup; CO detectors and smoke detectors; air fresheners | stir to replace slow diffusion by fast advection; a CO detector's electrochemical cell has a diffusion-limited, linear response |\n\n## Derivation\n\n**(a) Random walk to $\\langle x^2\\rangle=2Dt$.**\n1. Steps $s_i=\\pm\\delta$, independent, equally likely: $\\langle s_i\\rangle=0$, $\\langle s_i^2\\rangle=\\delta^2$, $\\langle s_is_j\\rangle=0$ for $i\\ne j$.\n2. Position after $N$ steps: $x_N=\\sum_{i=1}^N s_i$, so $\\langle x_N\\rangle=0$.\n3. Square and average: $\\langle x_N^2\\rangle=\\sum_i\\langle s_i^2\\rangle+\\sum_{i\\ne j}\\langle s_is_j\\rangle=N\\delta^2$.\n4. With $N=t/\\tau_s$: $\\langle x^2\\rangle=(\\delta^2/\\tau_s)\\,t\\equiv2Dt$, defining $D=\\delta^2/(2\\tau_s)$.\n5. In 3D each axis walks independently: $\\langle r^2\\rangle=\\langle x^2\\rangle+\\langle y^2\\rangle+\\langle z^2\\rangle=6Dt$.\n\n**(b) Fick's laws from the walk.**\n1. Between two neighbouring slices at $x$ and $x+\\delta$, half the molecules in each jump towards the other every $\\tau_s$.\n2. Net number crossing per area per time: $J=\\dfrac{\\delta}{2\\tau_s}\\big(c(x)-c(x+\\delta)\\big)\\approx-\\dfrac{\\delta^2}{2\\tau_s}\\dfrac{\\partial c}{\\partial x}=-D\\dfrac{\\partial c}{\\partial x}$.\n3. Conservation in a slice of thickness $dx$: $\\dfrac{\\partial c}{\\partial t}dx=J(x)-J(x+dx)$, so $\\dfrac{\\partial c}{\\partial t}=-\\dfrac{\\partial J}{\\partial x}=D\\dfrac{\\partial^2c}{\\partial x^2}$.\n4. Check the Gaussian: $c=(4\\pi Dt)^{-1/2}e^{-x^2/4Dt}$ satisfies it, and its variance is $\\int x^2c\\,dx=2Dt$, matching (a).\n\n**(c) Stokes–Einstein (sketch).**\n1. A particle pulled by a force $F$ through a liquid drifts at $v=F/(6\\pi\\mu r)$: its mobility is $1/(6\\pi\\mu r)$.\n2. In a force field, molecules pile up with the Boltzmann distribution $c\\propto e^{-\\text{energy}/k_BT}$; then the drift flux $c\\,F/(6\\pi\\mu r)$ and the diffusion flux $-D\\,dc/dx=D\\,cF/(k_BT)$ must cancel.\n3. That requires $D=k_BT/(6\\pi\\mu r)$.\n\n**(d) Two streams in a channel (plug flow).**\n1. Steady state, flow $U$ along $x$, walls at $y=\\pm w/2$ with no flux, and diffusion along $x$ negligible ($\\mathrm{Pe}\\gg1$): $U\\,\\partial c/\\partial x=D\\,\\partial^2c/\\partial y^2$.\n2. This is the 1D heat equation with \"time\" $x/U$. Initial step: $c=1$ for $y>0$, $0$ for $y<0$.\n3. Expand in modes that satisfy the walls: $c=\\tfrac12+\\dfrac{2}{\\pi}\\displaystyle\\sum_{m\\text{ odd}}\\frac{1}{m}\\sin\\frac{m\\pi y}{w}\\,e^{-m^2\\pi^2x/(\\mathrm{Pe}\\,w)}$.\n4. The slowest mode ($m=1$) decays by 10× when $\\pi^2x/(\\mathrm{Pe}\\,w)=\\ln10$: $L_{90}=(\\ln10/\\pi^2)\\,\\mathrm{Pe}\\,w\\approx0.23\\,\\mathrm{Pe}\\,w$.\n\n**(e) Why folding wins.**\n1. After $n$ folds the stripes are $\\delta_n=w/2^n$ thick; across a stripe, diffusion takes $\\delta_n^2/D$.\n2. Mixing finishes when that is shorter than the time of one cycle, $\\lambda_{\\text{hb}}/U$: $w/2^n\\le\\sqrt{D\\lambda_{\\text{hb}}/U}$.\n3. So $n=\\log_2\\big(w\\sqrt{U/(D\\lambda_{\\text{hb}})}\\big)=\\tfrac12\\log_2(\\mathrm{Pe}\\,w/\\lambda_{\\text{hb}})$, and $L_{\\text{mix}}\\approx n\\lambda_{\\text{hb}}\\propto\\ln\\mathrm{Pe}$ instead of $\\propto\\mathrm{Pe}$.\n\n**(f) Diffusion to a consuming surface.**\n1. Surface at $x=0$ keeps $c=0$; bulk $c_0$ at $t=0$.\n2. Solution of Fick's second law: $c=c_0\\,\\mathrm{erf}\\big(x/\\sqrt{4Dt}\\big)$.\n3. Flux into the surface: $J=D\\,\\partial c/\\partial x\\big|_0=c_0\\sqrt{D/(\\pi t)}$, falling as $1/\\sqrt t$.\n4. Equivalent depletion thickness $c_0/(\\partial c/\\partial x)_0=\\sqrt{\\pi Dt}$.\n\n## Worked check\n\nGlucose in a channel $w=200$ µm wide, mean speed $U=0.5$ mm/s, water at 25 °C.\n\n- Stokes–Einstein: $D=\\dfrac{4.116\\times10^{-21}}{6\\pi(0.89\\times10^{-3})(0.38\\times10^{-9})}=6.46\\times10^{-10}$ m²/s.\n- Péclet: $\\mathrm{Pe}=Uw/D=(5\\times10^{-4})(2\\times10^{-4})/(6.46\\times10^{-10})=155$.\n- Crossing time $w^2/D=(2\\times10^{-4})^2/6.46\\times10^{-10}=62$ s; scaling estimate $L_{\\text{mix}}\\sim\\mathrm{Pe}\\,w=31$ mm.\n- Exact 90 % point: $0.233\\times155\\times0.2$ mm $=7.2$ mm. The estimate gets the scale right; the exact\n  factor $\\ln10/\\pi^2$ makes it about four times shorter.\n- In one second a glucose molecule wanders $\\sqrt{2Dt}=35.9$ µm across the channel, so the 100 µm to the far wall\n  takes several seconds, consistent with the numbers above. (All from `scripts/checks/C3_check.py`, which also checks\n  $\\langle x^2\\rangle=2Dt$ with 20 000 simulated walkers: 398 vs. 400.)\n\n## Whiteboard plan\n\n- **Panel 1 — the drunk walk.** A number line, a dot hopping ±1 with a coin. Write $x_N=s_1+\\dots+s_N$,\n  $\\langle x\\rangle=0$, $\\langle x^2\\rangle=N\\delta^2$. Say: \"cross terms cancel; squares add\".\n- **Panel 2 — √t.** A widening Gaussian at $t$, $4t$, $9t$ with widths 1, 2, 3. Box $\\langle x^2\\rangle=2Dt$ and\n  \"twice as far = four times as long\". Table: 1 µm → ms, 100 µm → s, 1 cm → day.\n- **Panel 3 — Stokes–Einstein.** A small fast molecule and a big slow sphere; $D=k_BT/(6\\pi\\mu r)$ with glucose,\n  protein and cell values in a column.\n- **Panel 4 — Fick.** Two slices with more dots on the left; arrow $J=-D\\,\\partial c/\\partial x$; conservation gives\n  $\\partial c/\\partial t=D\\nabla^2c$, \"the heat equation\".\n- **Panel 5 — the T-junction.** Yellow and blue streams side by side, a blur growing like $\\sqrt x$, a flat ½ far\n  downstream. Write $\\mathrm{Pe}=Uw/D$ and $L_{\\text{mix}}\\sim\\mathrm{Pe}\\,w$; put numbers: glucose 1 cm, protein 20 cm.\n- **Panel 6 — folding.** A rectangle cut and stacked (baker's map): 2, 4, 8, 16 stripes; \"stripe width halves per\n  cycle, mixing length ∝ log Pe\". Beside it an H-filter with small dots crossing and big cells staying.\n\n## Common mistakes and where the intuition breaks\n\n- **Thinking distance grows linearly with time.** Diffusion is $\\sqrt t$, not $t$. Extrapolating \"10 µm in 0.1 s\"\n  to \"1 cm in 100 s\" is wrong by a factor of 1000: it takes a day.\n- **Mixing up the 1D, 2D and 3D formulas.** $2Dt$ is per axis. The distance from the start in 3D is\n  $\\sqrt{6Dt}$. Measure particle tracks in a 2D microscope image and use $4Dt$.\n- **Confusing Re and Pe.** Low Re (no turbulence) doesn't mean fast mixing: in a chip Re ≈ 0.1 but Pe ≈ 100–10 000.\n  They differ by $\\nu/D$ (the Schmidt number), about 1500 for glucose in water.\n- **Using Stokes–Einstein for things that aren't spheres in a simple liquid.** Long DNA, elongated proteins and\n  molecules in crowded cells diffuse more slowly than the formula says; ions are affected by their electric charge.\n- **Assuming plug flow everywhere.** Near the top and bottom walls of a real channel the fluid is slow, so the\n  interface spreads faster there (a \"butterfly\" shape across the height), and along the channel Taylor dispersion\n  smears pulses. The simple $0.23\\,\\mathrm{Pe}\\,w$ is a good first estimate, not the last word.\n- **Where the random walk breaks.** At times shorter than about $t_{\\text{coast}}$ (C1), a particle still \"remembers\"\n  its velocity and moves ballistically; and in very crowded or porous media diffusion becomes anomalous\n  ($\\langle x^2\\rangle\\propto t^\\alpha$ with $\\alpha<1$).\n\n## Remember\n\n**\"Diffusion spreads as √(2Dt), with D = k_BT/(6πμr); flow carries, diffusion spreads, and Pe = Uw/D says who wins: mixing length ~ Pe·w, unless you fold.\"**\n\n## Self-test\n\n1. How long does albumin ($D=7.0\\times10^{-11}$ m²/s) take to diffuse across a 50 µm channel (use $t=x^2/2D$)?\n   <details><summary>Answer<\/summary>t = (50e-6)² / (2 × 7.0e-11) = 2.5e-9 / 1.4e-10 ≈ 18 s.<\/details>\n2. You double the flow speed in a straight T-junction mixer. What happens to Pe and to the mixing length? And in a herringbone mixer?\n   <details><summary>Answer<\/summary>Pe doubles, so the straight-channel mixing length (proportional to Pe × w) doubles. In the herringbone mixer the number of cycles grows only as half of log2(Pe), so doubling Pe adds only about half a cycle: the mixing length barely changes.<\/details>\n3. A tracked bead in water at 25 °C shows ⟨x²⟩ growing by 2 µm² every second. What is D, and how big is the bead?\n   <details><summary>Answer<\/summary>The slope is 2D = 2 µm²/s, so D = 1 µm²/s = 1e-12 m²/s. Stokes–Einstein: r = k_BT/(6πμD) = 4.116e-21 / (6π × 0.89e-3 × 1e-12) ≈ 0.25 µm, so a bead of about 0.5 µm diameter.<\/details>\n\n**Next:** [C4 Surface tension, capillarity, droplets and electrokinetics](#C4) — now the walls and interfaces take over: capillary forces pump paper tests and pinch off droplets, and electric fields move liquids without any pressure at all.\n"}, {"id": "C4", "short": "Surface tension, capillarity, droplets and electrokinetics", "title": "Surface tension, capillarity, droplets and electrokinetics", "part": "C", "md": "# C4. Surface tension, capillarity, droplets and electrokinetics\n\n> **Connects:** builds on [B1 Scaling laws](#B1), [A3 Capacitive sensors](#A3), [C1 Fluids at the microscale](#C1), [C2 Pressure-driven flow](#C2), [C3 Diffusion, mixing and the Péclet number](#C3) · used by [C5 Lab-on-a-chip, organ-on-chip and integrated sensing systems](#C5)\n\n## Hook — a paper towel soaking up a spill\n\nKnock over a glass of juice and lay a paper towel on the puddle. Nobody pumps anything, yet the liquid climbs **up** into\nthe towel, against gravity, in a few seconds. Water climbs inside a tomato stem the same way, through tubes far thinner than\na hair. A home pregnancy test or a COVID test strip uses the same trick: you put a drop on one end, and a coloured line\nappears 2 cm away a few minutes later. There is no battery, no pump and no valve.\n\nTurn the picture around. Rain on a lotus or cabbage leaf does not spread. It beads up into silver balls that roll off and\ntake the dust with them. Rain on a freshly waxed car does the same. Some phone cameras focus with a **lens made of a water\ndrop**: a voltage changes the drop's shape, and nothing moves mechanically.\n\nAll of these come from one fact: **a liquid surface stores energy, and in a small world the surface wins.** This note turns\nthat into numbers, and adds a second small-world power: pushing liquid with **electric fields** (electrokinetics).\n\n## The idea in plain words\n\n**Surface tension is energy per area.** A molecule inside the liquid is pulled equally on all sides; one at the surface has\nneighbours on one side only and sits at higher energy. So making surface costs energy, and the cost per square metre is the\n**surface tension** $\\gamma$ (J/m² = N/m). Water against air: $\\gamma\\approx72$ mN/m; ethanol 22, soapy water 25–30, mercury\n485 mN/m. Read the same number as a **force per length**: a surface pulls along any line drawn on it with 72 mN per metre.\nThat is why a needle can float.\n\n**Why it matters only when things are small (B1).** Surface forces scale with a length ($\\gamma\\ell$), weight with a volume\n($\\rho g_{\\text{grav}}\\ell^3$). Their ratio is the **Bond number** $\\mathrm{Bo}=\\rho g_{\\text{grav}}\\ell^2/\\gamma$. It equals 1\nat the **capillary length** $\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}=2.71$ mm for water. A 1 cm puddle has $\\mathrm{Bo}=13.6$\n(gravity flattens it); a 100 µm channel has $\\mathrm{Bo}=0.00136$ (surface tension rules, so chips work in any orientation).\n\n**A curved surface squeezes: Laplace pressure.** A drop is like a balloon whose skin is under tension, so the inside is at\nhigher pressure by\n$$\\Delta p=\\frac{2\\gamma}{r}\\qquad\\text{(sphere of radius } r\\text{)}.$$\nThat is 144 Pa for a 1 mm drop and 144 kPa (1.4 atmospheres) for a 1 µm droplet. With two different radii of curvature,\n$\\Delta p=\\gamma(1/R_1+1/R_2)$; a soap bubble has two surfaces, so $\\Delta p=4\\gamma/r$.\n\n**Wetting and the contact angle.** Where the liquid surface meets a wall it makes an angle $\\theta$, measured through the\nliquid. Three tensions pull on the contact line: solid–vapour $\\gamma_{\\text{sv}}$, solid–liquid $\\gamma_{\\text{sl}}$ and the\nliquid surface $\\gamma$. Balancing them along the wall gives **Young's equation**\n$$\\gamma\\cos\\theta=\\gamma_{\\text{sv}}-\\gamma_{\\text{sl}}.$$\nIf the solid \"likes\" water, $\\cos\\theta>0$ and $\\theta<90^\\circ$: **hydrophilic**, like clean glass ($0$–$20^\\circ$), paper\nor xylem walls. Otherwise $\\theta>90^\\circ$: **hydrophobic**, like PDMS, the silicone rubber most research chips are moulded\nfrom (B2, $\\theta\\approx110^\\circ$). The **lotus leaf** is waxy *and* covered in micro-bumps, so a drop touches solid over only\nabout 10% of its footprint and rests on air elsewhere. The Cassie–Baxter rule $\\cos\\theta^*=f(\\cos\\theta+1)-1$ with solid\nfraction $f=0.1$ gives $\\theta^*=159^\\circ$: **superhydrophobic**, and drops roll off at the slightest tilt.\n\n**Capillary rise: the meniscus pulls the column up.** In a glass tube of inner radius $r$, the surface pulls along the wall\nall around the rim; the vertical part is $2\\pi r\\,\\gamma\\cos\\theta$. The column rises until its weight\n$\\rho g_{\\text{grav}}\\pi r^2h$ balances that pull, which is **Jurin's law**\n$$h=\\frac{2\\gamma\\cos\\theta}{\\rho\\,g_{\\text{grav}}\\,r}.$$\nHalve the radius and the column climbs twice as high: 29.4 mm in a 0.5 mm tube, 147 mm in a 0.1 mm tube, 0.73 m in a 20 µm\nxylem vessel. On a hydrophobic wall $\\cos\\theta<0$ and the \"rise\" is negative: a 0.5 mm PDMS tube pushes the level **down**\n10 mm. In pressure language, the meniscus makes a suction $2\\gamma\\cos\\theta/r$ that holds up $\\rho g_{\\text{grav}}h$.\n\n```viz\nc4-capillary-3d\n```\n\n**Trees are not capillary tubes, but capillarity still saves them.** To lift water 100 m by rise alone, the tube would need\n$r=0.147$ µm. Instead the leaf **pulls**: water evaporates from menisci in cell-wall pores about 5 nm across, which can hold a\nsuction of $2\\gamma/r=28.8$ MPa, far more than the 0.98 MPa needed to hang a 100 m column (the cohesion–tension theory). The\nsap-flow sensors of the story (A2) measure how fast that stretched column moves.\n\n**Wicking in paper: Washburn's law.** In a paper strip the pull is the Laplace suction $2\\gamma\\cos\\theta/r$ of pores of\neffective radius $r$. The resistance grows with the wetted length $L$, because the liquid already inside must be dragged\nalong (Poiseuille, C2). Constant pull, growing resistance, so the front slows down:\n$$L^2=\\frac{\\gamma\\,r\\cos\\theta}{2\\mu}\\,t.$$\nFor $r=0.5$ µm, $\\gamma r\\cos\\theta/(2\\mu)=1.8\\times10^{-5}$ m²/s: 1 cm in 5.6 s, 4 cm in 88.9 s (4× as far takes 16× as\nlong). A lateral-flow test runs on this clock: the sample wicks past gold-labelled antibodies, a test line, a control line and\ninto an absorbent pad, with no pump.\n\n**Viscosity against surface tension: the capillary number** $\\mathrm{Ca}=\\mu U/\\gamma$ compares the viscous stress that\nstretches a moving interface with the tension that keeps it round. Water at 1 mm/s has $\\mathrm{Ca}=1.4\\times10^{-5}$\n(stiff, round interfaces); oil with surfactant at a few mm/s has $\\mathrm{Ca}\\sim10^{-3}$–$10^{-2}$, the range for droplets.\n\n**Droplets on demand: the T-junction.** Oil (the *continuous* phase, flow $Q_{\\text{c}}$) runs along a main channel of width\n$w$; water (the *dispersed* phase, $Q_{\\text{d}}$) enters from a side channel. The water tip grows until it nearly blocks\nthe channel, then the oil behind it squeezes the neck until a droplet pinches off. In the **squeezing regime**\n($\\mathrm{Ca}\\lesssim0.01$) the length depends only on the flow ratio:\n$$\\frac{L_{\\text{drop}}}{w}\\approx1+\\alpha\\,\\frac{Q_{\\text{d}}}{Q_{\\text{c}}},\\qquad\\alpha\\approx1.$$\nViscosity and $\\gamma$ drop out! At higher $\\mathrm{Ca}$ (dripping) shear tears droplets off earlier and they shrink. In\n**digital PCR**, a sample is split into about 20,000 such droplets, each holding zero or a few DNA copies. After amplification\n(C5) each is simply bright or dark, and Poisson statistics turns the bright fraction into an absolute count.\n\n```viz\nc4-droplets-3d\n```\n\n**Electrowetting: turning the contact angle with a voltage (A3).** Put a drop on an insulating film (thickness\n$t_{\\text{d}}$, permittivity $\\varepsilon_0\\varepsilon_r$) over an electrode and apply $V$. Drop and electrode form a\ncapacitor (A3) whose energy per area, $\\varepsilon_0\\varepsilon_rV^2/(2t_{\\text{d}})$, lowers the solid–liquid tension. That\ngives the **Young–Lippmann** equation\n$$\\cos\\theta(V)=\\cos\\theta_0+\\frac{\\varepsilon_0\\varepsilon_rV^2}{2\\gamma\\,t_{\\text{d}}}.$$\nWith a 1 µm film of $\\varepsilon_r=3$ and $\\theta_0=120^\\circ$: 30 V gives $109.5^\\circ$, 60 V gives $80.6^\\circ$. A **liquid\nlens** changes the curvature of a water/oil interface this way, refocusing in milliseconds with no motor. **Digital\nmicrofluidics** switches a grid of electrodes so drops are pulled from pad to pad, merged, split and mixed.\n\n**Electrokinetics: walls are charged, and that charge can pump.** Glass in water is negatively charged (surface silanol\ngroups give up protons). Positive ions crowd near the wall in a thin cloud, the **electric double layer**, whose thickness is\nthe **Debye length**:\n$$\\lambda_D=\\sqrt{\\frac{\\varepsilon_0\\varepsilon_rk_BT}{2N_Aq_e^2c}}\\;\\approx\\;\\frac{0.304\\ \\text{nm}}{\\sqrt{c\\ [\\text{mol/L}]}}\\quad\\text{(1:1 salt, 25 °C)},$$\nwith $N_A$ Avogadro's number, $q_e$ the elementary charge and $c$ the salt concentration. Salt shrinks the layer: 0.79 nm in\nsaline or blood (150 mM), 9.6 nm in 1 mM buffer, about 300 nm in deionised water that has absorbed a little CO₂ (≈1 µM\nions), about 960 nm in ideally pure water (10⁻⁷ M). The potential where the liquid starts to slide is the **zeta potential**\n$\\zeta$, typically −20 to −80 mV for glass.\n\n**Electro-osmotic flow: the skin drags the whole liquid.** A field $\\mathcal E$ along the channel pushes the positive cloud,\nand the cloud drags the liquid by viscosity. Outside the layer there is no net charge and no force, so everything slides at\none speed:\n$$u_{\\text{eo}}=-\\frac{\\varepsilon_0\\varepsilon_r\\zeta\\,\\mathcal E}{\\mu}.$$\nFor $\\zeta=-50$ mV and 100 V/cm, $u_{\\text{eo}}=0.35$ mm/s toward the negative electrode. The point is the **shape**.\nPressure flow (C2) is a parabola, so a dye band is stretched into an arrowhead and smeared (Taylor dispersion, C3).\nElectro-osmotic flow is a **plug**, flat except within a few $\\lambda_D$ of the wall, so a band stays sharp. And\n$u_{\\text{eo}}$ does not depend on channel size, while pressure flow needs huge pressures in narrow channels\n($R_{\\text{hyd}}\\propto1/h^4$ for a tube, C2).\n\n```viz\nc4-eof\n```\n\n**Electrophoresis and dielectrophoresis: moving the molecules, not the liquid.** A charged particle drifts at\n$u=\\mu_{\\text{ep}}\\mathcal E$ ($\\mu_{\\text{ep}}$ = electrophoretic mobility). DNA has a fixed charge per length, so in free\nsolution all lengths move alike; a **gel** is a molecular sieve that slows long strands more, so DNA spreads into bands by\nsize. **Capillary electrophoresis** runs in a 50 µm capillary at tens of kV, because the thin tube sheds Joule heat (B1).\nElectro-osmosis carries everything to the detector, and each species' own mobility sets its arrival time. An *uncharged*\ncell in a **non-uniform** field is polarised and pulled toward or away from strong field (**dielectrophoresis**, force\n$\\propto r^3\\,\\nabla\\lvert\\mathcal E\\rvert^2$), which sorts live from dead cells on electrode arrays.\n\n## Intuitive examples\n\n1. **The Laplace pressure of small drops.** Water with $\\gamma=72$ mN/m gives $2\\gamma/r=144$ Pa for $r=1$ mm,\n   14.4 kPa for $r=10$ µm and 144 kPa for $r=1$ µm. A 1 cm soap bubble ($\\gamma=25$ mN/m, two surfaces) needs only\n   $4\\gamma/r=10$ Pa. Small things are stiff.\n2. **Capillary rise in glass, PDMS and xylem.** In glass ($\\theta=0$), $h=29.4$ mm for $r=0.5$ mm and 146.8 mm for\n   $r=0.1$ mm. In a 20 µm xylem vessel, $h=0.734$ m. In PDMS ($\\theta=110^\\circ$), $r=0.5$ mm gives $h=-10.0$ mm, a\n   depression. The widget's tubes ($r=0.4$, 0.8, 1.6 mm) give 36.7, 18.3 and 9.2 mm for water. Mercury in a 0.4 mm glass tube\n   gives −14.0 mm, and ethanol gives 14.2 mm.\n3. **A lateral-flow test.** Effective pore radius 0.5 µm and water: $L^2=(1.8\\times10^{-5}\\ \\text{m}^2/\\text{s})\\,t$. The\n   front reaches 1 cm in 5.6 s and 4 cm in 88.9 s, where it is slowing to 0.225 mm/s. Whole blood ($\\mu\\approx3.5$ mPa·s) needs\n   311 s for the same 4 cm. That is why such tests ask you to wait about 5–15 minutes.\n4. **Making droplets for digital PCR.** Main channel 100 µm × 50 µm, oil at $Q_{\\text{c}}=2$ µL/min (mean speed 6.67 mm/s,\n   $\\mu=5$ mPa·s, $\\gamma=5$ mN/m with surfactant, so $\\mathrm{Ca}=6.7\\times10^{-3}$: squeezing), and water at\n   $Q_{\\text{d}}=1$ µL/min. Then $L_{\\text{drop}}=150$ µm and $V=whL_{\\text{drop}}=0.75$ nL, about the volume of a 113 µm\n   sphere. The droplets come out at $f=Q_{\\text{d}}/V=22.2$ Hz, spaced 450 µm apart. If 6,000 of 20,000 droplets light up\n   ($p=0.30$), the mean number of copies per droplet is $\\bar n=-\\ln(1-p)=0.357$, so the sample holds 476 copies/µL. Counting\n   only the bright droplets would say 400/µL, because some droplets contain two or more copies.\n5. **Electrowetting a lens.** 1 µm insulator with $\\varepsilon_r=3$, $\\theta_0=120^\\circ$: $\\cos\\theta$ goes from −0.500 at 0 V\n   to −0.334 at 30 V ($109.5^\\circ$) and +0.164 at 60 V ($80.6^\\circ$). The angle goes from beading to wetting with no moving\n   parts.\n6. **Debye length and electro-osmosis.** $\\lambda_D=0.79$ nm (150 mM), 9.62 nm (1 mM), 304 nm (1 µM). With $\\zeta=-50$ mV at\n   100 V/cm, $u_{\\text{eo}}=0.348$ mm/s (mobility $3.48\\times10^{-8}$ m²/(V·s)). In a 50 cm capillary at 25 kV, anions with\n   $\\mu_{\\text{ep}}=-2.0$ and $-2.2\\times10^{-8}$ m²/(V·s) travel at 0.738 and 0.638 mm/s and arrive at 678 s and 784 s.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $\\Delta p=\\dfrac{2\\gamma}{r}$; in general $\\gamma\\left(\\dfrac1{R_1}+\\dfrac1{R_2}\\right)$ | Laplace pressure: curved surfaces squeeze | $\\gamma$ surface tension (water 72 mN/m), $r$ radius |\n| $\\gamma\\cos\\theta=\\gamma_{\\text{sv}}-\\gamma_{\\text{sl}}$ | Young: the contact angle is a tug of war at the contact line | $\\theta$ contact angle; $\\theta<90^\\circ$ hydrophilic |\n| $h=\\dfrac{2\\gamma\\cos\\theta}{\\rho g_{\\text{grav}}r}$ | Jurin: capillary rise (negative on hydrophobic walls) | $\\rho$ density, $g_{\\text{grav}}$ gravity |\n| $L^2=\\dfrac{\\gamma r\\cos\\theta}{2\\mu}\\,t$ | Washburn: wicking slows as $\\sqrt t$ | $\\mu$ viscosity, $r$ pore radius, $L$ wetted length |\n| $\\mathrm{Bo}=\\dfrac{\\rho g_{\\text{grav}}\\ell^2}{\\gamma}$, $\\mathrm{Ca}=\\dfrac{\\mu U}{\\gamma}$ | gravity vs surface tension; viscous drag vs surface tension | $\\ell$ size, $U$ speed |\n| $\\dfrac{L_{\\text{drop}}}{w}\\approx1+\\alpha\\dfrac{Q_{\\text{d}}}{Q_{\\text{c}}}$ | T-junction droplet length (squeezing, $\\mathrm{Ca}\\lesssim0.01$) | $w$ channel width, $\\alpha\\approx1$ |\n| $\\cos\\theta(V)=\\cos\\theta_0+\\dfrac{\\varepsilon_0\\varepsilon_rV^2}{2\\gamma t_{\\text{d}}}$ | electrowetting (Young–Lippmann) | $t_{\\text{d}}$ insulator thickness |\n| $\\lambda_D=\\sqrt{\\dfrac{\\varepsilon_0\\varepsilon_rk_BT}{2N_Aq_e^2c}}\\approx\\dfrac{0.304\\text{ nm}}{\\sqrt{c\\,[\\text{M}]}}$ | Debye length: thickness of the ion cloud | $c$ salt concentration |\n| $u_{\\text{eo}}=-\\dfrac{\\varepsilon_0\\varepsilon_r\\zeta\\mathcal E}{\\mu}$ | electro-osmotic plug flow | $\\zeta$ zeta potential, $\\mathcal E$ field |\n| $u=\\mu_{\\text{ep}}\\mathcal E$ | electrophoretic drift of a charged particle | $\\mu_{\\text{ep}}$ mobility |\n\n## Applications\n\n| World | Surface tension and electrokinetics | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | xylem capillarity plus 5 nm cell-wall menisci holding transpiration tension; waxy, bumpy leaves; soil pores holding water by Laplace suction | why a stem stays full and a tall tree can drink; why dew beads on cabbage |\n| 🧬 Biology & human health | lateral-flow pregnancy and COVID tests (Washburn); digital PCR droplets; DNA gels; lung surfactant lowering $\\gamma$ in tiny alveoli | test timing; absolute DNA counts; why premature babies need surfactant |\n| 🌍 Environment | paper water tests (nitrate, E. coli); droplet PCR for viruses in wastewater; capillary electrophoresis of river ions | cheap tests with no pump; separating nitrate from chloride by mobility |\n| 🤖 Robotics & drones | superhydrophobic coatings on drone cameras; capillary grippers for millimetre parts; digital-microfluidic droplet \"robots\" | lenses that shed rain; gentle grip with no clamp |\n| 🚗 Cars | hydrophobic windscreen coatings ($\\theta>100^\\circ$); fuel-injector sprays; hydrophobic vent membranes on headlamps | drops blow off at speed; fine droplets burn cleanly |\n| 📱 Phones & photography | electrowetting liquid-lens autofocus; oleophobic screen coatings; hydrophobic speaker meshes holding water back by Laplace pressure | focus in milliseconds with no motor; how a phone survives a splash |\n| 🏠 Home & household | paper towels and sponges (Washburn); candle wicks; non-stick pans ($\\theta\\approx110^\\circ$); detergent lowering $\\gamma$ to about 30 mN/m | why the towel is fast at first, then slow; why soap gets into fabric |\n\n## Derivation\n\n**(a) Surface tension as energy and as force.**\n1. Making area $dA$ costs energy $dW=\\gamma\\,dA$, so $\\gamma$ is in J/m².\n2. Stretch a soap film of width $w$ by $dx$: two surfaces gain $dA=2w\\,dx$.\n3. Work $F\\,dx=\\gamma\\,2w\\,dx$, so $F=2\\gamma w$: $\\gamma$ is also a force per length (N/m).\n\n**(b) Laplace pressure of a sphere.**\n1. Grow the drop from $r$ to $r+dr$: the pressure difference does work $\\Delta p\\,dV=\\Delta p\\,4\\pi r^2dr$.\n2. The surface energy rises by $\\gamma\\,dA=\\gamma\\,8\\pi r\\,dr$.\n3. At equilibrium they are equal: $\\Delta p\\,4\\pi r^2=8\\pi\\gamma r$, so $\\Delta p=2\\gamma/r$.\n\n**(c) Young's equation.** Along the wall at the contact line, $\\gamma_{\\text{sv}}$ pulls outward and $\\gamma_{\\text{sl}}+\\gamma\\cos\\theta$ pulls inward; balance gives $\\gamma\\cos\\theta=\\gamma_{\\text{sv}}-\\gamma_{\\text{sl}}$.\n\n**(d) Jurin's law (capillary rise).**\n1. Upward pull around the rim: $F_\\gamma=2\\pi r\\,\\gamma\\cos\\theta$.\n2. Weight of the raised column: $W=\\rho g_{\\text{grav}}\\,\\pi r^2h$ (ignoring the small meniscus volume).\n3. Set them equal: $h=2\\gamma\\cos\\theta/(\\rho g_{\\text{grav}}r)$.\n4. Pressure version: under a meniscus of radius $r/\\cos\\theta$, $p=p_{\\text{atm}}-2\\gamma\\cos\\theta/r$, and hydrostatics adds back $\\rho g_{\\text{grav}}h$ at the bath level. Same result.\n\n**(e) Washburn's law.**\n1. Mean speed in a pore of radius $r$ (Poiseuille, C2): $dL/dt=r^2\\Delta p/(8\\mu L)$.\n2. The driving pressure is the Laplace suction $\\Delta p=2\\gamma\\cos\\theta/r$.\n3. So $L\\,dL/dt=\\gamma r\\cos\\theta/(4\\mu)$.\n4. Integrate from $L=0$ at $t=0$: $L^2/2=\\gamma r\\cos\\theta\\,t/(4\\mu)$, so $L^2=\\gamma r\\cos\\theta\\,t/(2\\mu)$.\n\n**(f) T-junction, squeezing regime.**\n1. The water tip grows until it fills the channel width $w$: length about $w$.\n2. Oil can then only leak past through the corners, so it squeezes the neck at a speed set by $Q_{\\text{c}}$; pinching takes a time $t_{\\text{p}}\\approx\\alpha\\,w\\cdot wh/Q_{\\text{c}}$.\n3. Meanwhile water keeps flowing in, adding length $Q_{\\text{d}}t_{\\text{p}}/(wh)=\\alpha wQ_{\\text{d}}/Q_{\\text{c}}$.\n4. Total: $L_{\\text{drop}}=w(1+\\alpha Q_{\\text{d}}/Q_{\\text{c}})$. Frequency $f=Q_{\\text{d}}/V$ with $V\\approx whL_{\\text{drop}}$.\n\n**(g) Electrowetting.**\n1. The insulator is a capacitor with $C/A=\\varepsilon_0\\varepsilon_r/t_{\\text{d}}$ (A3).\n2. At fixed voltage, charging it lowers the free energy per wetted area by $\\tfrac12(C/A)V^2$, so $\\gamma_{\\text{sl}}\\to\\gamma_{\\text{sl}}-\\varepsilon_0\\varepsilon_rV^2/(2t_{\\text{d}})$.\n3. Put this into Young: $\\cos\\theta(V)=\\cos\\theta_0+\\varepsilon_0\\varepsilon_rV^2/(2\\gamma t_{\\text{d}})$.\n\n**(h) Debye length.**\n1. Poisson: $\\varepsilon_0\\varepsilon_r\\,\\phi''=-\\rho_q$, where $\\phi(y)$ is the potential at distance $y$ from the wall and $\\rho_q$ the charge density.\n2. Boltzmann: ions of charge $\\pm q_e$ have densities $N_Ac\\,e^{\\mp q_e\\phi/k_BT}$, so $\\rho_q=-2N_Acq_e\\sinh(q_e\\phi/k_BT)$.\n3. Linearise for small $\\phi$ (Taylor): $\\rho_q\\approx-2N_Acq_e^2\\phi/k_BT$.\n4. Then $\\phi''=\\phi/\\lambda_D^2$ with $\\lambda_D^2=\\varepsilon_0\\varepsilon_rk_BT/(2N_Aq_e^2c)$, so $\\phi=\\zeta\\,e^{-y/\\lambda_D}$.\n\n**(i) Electro-osmotic velocity.**\n1. Stokes flow with an electric body force (no pressure gradient): $\\mu u''+\\rho_q\\mathcal E=0$.\n2. Replace $\\rho_q$ using Poisson: $\\mu u''=\\varepsilon_0\\varepsilon_r\\mathcal E\\,\\phi''$.\n3. Integrate twice with $u(0)=0$, $\\phi(0)=\\zeta$, and $u',\\phi'\\to0$ far away: $u(y)=\\dfrac{\\varepsilon_0\\varepsilon_r\\mathcal E}{\\mu}\\big(\\phi(y)-\\zeta\\big)$.\n4. Outside the layer $\\phi\\to0$: $u_{\\text{eo}}=-\\varepsilon_0\\varepsilon_r\\zeta\\mathcal E/\\mu$, the same everywhere, which is a plug.\n\n## Worked check\n\n**Force balance in a 0.5 mm glass tube** ($\\gamma=0.072$ N/m, $\\theta=0$, $\\rho=1000$ kg/m³):\n- Jurin: $h=2(0.072)/(1000\\cdot9.81\\cdot0.0005)=0.02936$ m $=29.36$ mm.\n- Pull: $F_\\gamma=2\\pi(0.0005)(0.072)=2.262\\times10^{-4}$ N $=226.2$ µN.\n- Weight: $\\rho g_{\\text{grav}}\\pi r^2h=1000\\cdot9.81\\cdot\\pi(0.0005)^2(0.02936)=226.2$ µN ✓. That is a 23.1 mg column of water.\n- Pressure view: $2\\gamma/r=288$ Pa of suction under the meniscus, and $\\rho g_{\\text{grav}}h=288$ Pa ✓.\n\n**Washburn clock:** with $k=\\gamma r\\cos\\theta/(2\\mu)=0.072\\cdot0.5\\times10^{-6}/(2\\times10^{-3})=1.8\\times10^{-5}$ m²/s,\n4 cm takes $0.04^2/k=88.9$ s and 2 cm takes 22.2 s, which is 4× shorter for half the distance ✓.\n\n**Electro-osmosis:** $\\varepsilon_0\\varepsilon_r=8.854\\times10^{-12}\\cdot78.5=6.95\\times10^{-10}$ F/m;\n$u_{\\text{eo}}=6.95\\times10^{-10}\\cdot0.050\\cdot10^4/10^{-3}=3.48\\times10^{-4}$ m/s $=0.348$ mm/s ✓ (all checked by\n`scripts/checks/C4_check.py`).\n\n## Whiteboard plan\n\n- **Panel 1: the surface molecule.** Draw a beaker with one molecule deep inside (arrows in all directions) and one at the\n  surface (arrows only down and sideways). Write \"$\\gamma$ = energy per area = force per length; water 72 mN/m\". Then draw\n  $\\mathrm{Bo}=\\rho g\\ell^2/\\gamma$ and mark 2.7 mm: \"below this, surface wins\".\n- **Panel 2: Laplace.** A drop with arrows pushing in; write $2\\gamma/r$ and the table 1 mm → 144 Pa, 1 µm → 144 kPa.\n- **Panel 3: contact angle.** Three drops on a line: glass (flat), PDMS (bead, $110^\\circ$), lotus (ball on bumps,\n  $159^\\circ$). Draw the Young tug-of-war arrows at one contact line.\n- **Panel 4: three tubes.** Thin, medium and thick tubes in a tray with columns at $h$, $h/2$ and $h/4$, purple arrows up at\n  the rim, and a weight arrow down. Box $h=2\\gamma\\cos\\theta/(\\rho g r)$. Then a PDMS tube with the level below. Say: \"the\n  sign of $\\cos\\theta$ decides up or down.\"\n- **Panel 5: the paper strip and the droplet maker.** A strip with the front at $\\sqrt t$ marks (1 cm, 2 cm and 4 cm at 5.6,\n  22 and 89 s), then a T-junction with plugs of length $w(1+Q_{\\text{d}}/Q_{\\text{c}})$.\n- **Panel 6: the charged wall.** Minus signs on the wall, a cloud of plus signs of thickness $\\lambda_D$, then a flat\n  velocity profile (EOF) next to a parabola (pressure). Write $u_{\\text{eo}}=-\\varepsilon_0\\varepsilon_r\\zeta\\mathcal E/\\mu$\n  and \"plug = sharp bands\".\n\n## Common mistakes and where the intuition breaks\n\n- **Radius vs diameter.** Jurin and Laplace use the *radius*. Putting in the diameter halves the answer.\n- **Forgetting the sign of $\\cos\\theta$.** Above $90^\\circ$ the meniscus bulges up and the liquid is pushed *down*. PDMS\n  channels do not fill by themselves unless they are plasma-treated to make them hydrophilic, and that treatment fades over\n  hours (B2).\n- **\"Wicking speed is constant.\"** It is not: $L\\propto\\sqrt t$, so a strip twice as long takes four times as long.\n- **Contact angles are not single numbers.** Real surfaces show **hysteresis** (advancing angle > receding angle), and a\n  contact line can stay **pinned** on a scratch. That is why drops cling to a tilted window, and why hydrophobic \"stop\n  valves\" in chips work (C5).\n- **The Debye layer is \"just a few ions\".** In saline it is under 1 nm thick, so a charge-sensing biosensor (a FET, A6) is\n  blind beyond a nanometre: a target bound on a 10 nm antibody is **screened**.\n- **Electro-osmosis has limits.** It needs $\\lambda_D\\ll$ channel size, a stable $\\zeta$ (which changes with pH and with\n  proteins sticking to the wall), and modest fields, because Joule heating warms the liquid. Uneven $\\zeta$ along a channel\n  brings back pressure gradients and curves the plug.\n- **The squeezing law is for $\\mathrm{Ca}\\lesssim0.01$.** At higher $\\mathrm{Ca}$ or in very viscous oil the droplet is torn off\n  earlier and is smaller than $1+Q_{\\text{d}}/Q_{\\text{c}}$ predicts.\n\n## Remember\n\n**\"Surface energy scales like $\\ell^2$ and weight like $\\ell^3$: below 2.7 mm, $2\\gamma/r$ and $\\cos\\theta$ run the show, and a\ncharged wall turns a voltage into a flat plug of flow.\"**\n\n## Self-test\n\n1. A paper test takes 60 s to wick 3 cm. How long to wick 6 cm, and what happens if the sample is three times as viscous?\n   <details><summary>Answer<\/summary>L squared is proportional to t, so double the distance takes 4 times as long: 240 s. Washburn has mu in the denominator, so a 3x viscous sample is 3x slower: 180 s for 3 cm.<\/details>\n2. Water in a hydrophilic glass tube of radius 0.2 mm rises how high? What if the tube is PDMS with a contact angle of 110 degrees?\n   <details><summary>Answer<\/summary>h = 2(0.072)/(1000 x 9.81 x 0.0002) = 73.4 mm in glass. In PDMS cos(110) = -0.342, so h = -25.1 mm: the level inside sits 25 mm below the outside.<\/details>\n3. A biosensor works in blood (150 mM salt). Why can it barely sense the charge of a protein bound 10 nm above its surface, and how would diluting the sample 100x help?\n   <details><summary>Answer<\/summary>The Debye length at 150 mM is about 0.8 nm, so charges further away are screened by the ion cloud. Diluting 100x gives 1.5 mM and a Debye length of 0.304/sqrt(0.0015) = 7.9 nm, so the charge becomes partly visible again, at the price of 100x fewer target molecules.<\/details>\n\n**Next:** [C5 Lab-on-a-chip, organ-on-chip and integrated sensing systems](#C5) — with pumps made of paper, valves made of contact angles and droplets made by a T-junction, we can finally build a whole lab on a stamp-sized chip.\n"}, {"id": "C5", "short": "Lab-on-a-chip, organ-on-chip and integrated sensing systems", "title": "Lab-on-a-chip, organ-on-chip and integrated sensing systems", "part": "C", "md": "# C5. Lab-on-a-chip, organ-on-chip and integrated sensing systems\n\n> **Connects:** builds on [A1 What a sensor is](#A1), [A3 Capacitive sensors](#A3), [A5 Optical sensors](#A5), [A6 Electrochemical sensors](#A6), [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration](#A8), [B1 Scaling laws](#B1), [B2 Microfabrication](#B2), [B3 Micromechanics](#B3), [C1 Reynolds number](#C1), [C2 Pressure-driven flow](#C2), [C3 Diffusion and mixing](#C3), [C4 Surface tension and electrokinetics](#C4) · used by: this is the capstone; every chain in the notebook ends here\n\n## Hook — a whole kitchen shrunk onto a postage stamp\n\nMaking soup, you sieve the vegetables, measure a cup of water, stir, simmer, taste, and decide whether it needs salt. A\nclinical lab does the same with blood: spin out the cells, pipette 10 µL, mix in a reagent, incubate, read a colour or a\ncurrent, decide. That takes a building, trained staff and a day.\n\nA **lab-on-a-chip** puts the whole kitchen on a piece of plastic the size of a stamp. The grower in our story pricks her\nfinger, and a strip tells her glucose in 5 seconds. A field kit checks the river by her farm for *E. coli* and nitrate. A\nchip with living lung cells \"breathes\" on a lab bench so a drug can be tested without a patient. Every note of this notebook\nappears in that one chip: the plumbing of Part C, the fabrication of Part B, and the transducer, amplifier, ADC and noise of\nPart A. This note walks one sample through the whole chain and asks at each stage how long it takes, what the gain is, and\nwhat noise it adds.\n\n## The idea in plain words\n\n**A lab-on-a-chip is the measurement chain of A1 with plumbing in front.** In A1 a sensor turned a stimulus $s$ into an\noutput $y$ through a chain of stages, each with a gain. Here the stimulus is a **concentration** $c$ in a liquid: glucose in\nblood, nitrate in river water, a virus's RNA in a nose swab. Before any transducer can feel it, the molecules must be\nbrought to the right place, in the right amount, mixed with the right reagent, and given time to react. So a chip has seven\nstages:\n\n1. **Sample in and sample prep:** capillary filling (C4), filtering or separating plasma from blood cells.\n2. **Metering:** cutting out an exact volume with a chamber and capillary valves (C4, C2).\n3. **Mixing** the sample with a reagent: hard at low Reynolds number (C1), so chips fold the streams (C3).\n4. **Reaction or incubation:** binding, an enzyme reaction, or PCR thermal cycling (B1).\n5. **Detection:** electrochemical (A6), optical (A5), impedance or capacitive (A3), or a mass-sensitive resonator (B3).\n6. **Signal conditioning:** transimpedance amplifier, filter and ADC (A7).\n7. **Noise, limit of detection and decision** (A8): is the number above the threshold, and can we trust it?\n\n```viz\nc5-chip-3d\n```\n\n**Stage 1: the volume problem comes first.** A chip handles microlitres. If bacteria are rare, there may simply be none in\nthe drop. The number of cells in a volume $V$ is random (Poisson) with mean $\\bar n=cV$, and the chance of catching none is\n$e^{-cV}$. To be 95% sure of catching at least one you need $cV\\ge3$. A 10 µL sample of river water at 100 CFU/mL\n(colony-forming units) holds on average one bacterium, so it misses 37% of the time. Drinking water must have zero\n*E. coli* in 100 mL, so a test must start with 300 mL and **concentrate** it, for example by filtering it through a membrane\nand washing the cells off into a few microlitres. No electronics can fix a sample that holds no target. For blood, the prep\nstep is separating plasma from red cells, because the cells scatter light and change the viscosity. Chips do it with a\nfilter membrane, by letting the cells settle, or with flow tricks (C1).\n\n**Stage 2: metering with no moving parts.** A chamber of known size fills by capillarity (C4) until the liquid reaches a\nhydrophobic patch, where the meniscus is pinned. That **capillary stop valve** holds until the driving pressure exceeds its\nLaplace burst pressure, $\\Delta p_{\\text{burst}}=2\\gamma\\lvert\\cos\\theta\\rvert(1/w+1/h)$. That is 1.48 kPa for a\n100 µm × 50 µm channel with $\\theta=110^\\circ$. The pump pressure itself comes from Ohm's law for fluids (C2),\n$\\Delta p=R_{\\text{hyd}}Q$: pushing 1 µL/min through a 5 cm serpentine of that size takes about 1.17 kPa. Spinning the\nchip like a CD raises the pressure step by step and opens valves in sequence; such \"lab-on-a-CD\" analysers are sold for blood\ntests.\n\n**Stage 3: mixing.** At low Reynolds number two streams flow side by side and mix only by diffusion (C1, C3). The time\nto diffuse across a width $w$ is $t\\approx w^2/(2D)$. For a protein ($D=4\\times10^{-11}$ m²/s) across 100 µm that is 125 s.\nThe **Péclet number** $\\mathrm{Pe}=Uw/D=2500$ says the flow carries it 2500 times faster than it diffuses, so the protein\nwould leave the chip before it mixed. A **serpentine** or **herringbone mixer** folds the streams into thin layers\n(striations). At 10 µm thickness the mixing time falls to 1.25 s, because it scales as thickness squared.\n\n**Stage 4: is the reaction limited by chemistry or by delivery?** Capture antibodies on a sensor surface bind targets at a\nrate $k_{\\text{on}}b_mc_s$, where $k_{\\text{on}}$ is the binding rate constant, $b_m$ the density of capture sites and $c_s$\nthe concentration right at the surface. Diffusion resupplies the surface at a rate $D(c-c_s)/\\delta$ across a depletion\nlayer of thickness $\\delta$. Their ratio is a **Damköhler number**\n$$\\mathrm{Da}=\\frac{k_{\\text{on}}b_m\\delta}{D}.$$\nIf $\\mathrm{Da}\\gg1$ the surface eats molecules faster than diffusion brings them. The assay is **transport-limited**, and\nstirring, flow or a thinner $\\delta$ helps. If $\\mathrm{Da}\\ll1$ it is **reaction-limited**, and only better chemistry helps.\nFor a typical antibody surface ($k_{\\text{on}}=10^6$ /(M·s), $10^4$ sites per µm², $\\delta=10$ µm), $\\mathrm{Da}=4.15$:\ntransport-limited. In still liquid a perfectly absorbing sensor of area $A$ collects\n$$N(t)=2cA\\sqrt{\\frac{Dt}{\\pi}}$$\nmolecules. At **1 fM** (0.6 molecules per nL!), a 100 µm × 100 µm sensor catches about **one molecule in 10 minutes**. At\n1 pM it catches about a thousand. For ultra-low concentrations the limit is set by physics (how many molecules can reach\nthe sensor), not by the electronics. That is why sensitive chips flow the sample past the sensor, capture targets on beads,\nor amplify the target itself.\n\n**PCR on a chip: small means fast (B1).** PCR copies DNA by cycling between about 95 °C (separate the strands), 55 °C\n(primers bind) and 72 °C (copy). Each perfect cycle doubles the target, so 30 cycles give $2^{30}=1.07\\times10^9$ copies. The\ntime is set by how fast heat diffuses through the sample, $\\tau\\approx L^2/\\alpha_{\\text{th}}$, where\n$\\alpha_{\\text{th}}=1.43\\times10^{-7}$ m²/s is the thermal diffusivity of water. The equation is the same as C3's diffusion,\nwith heat in place of molecules. A 50 µL tube ($L\\approx2$ mm) needs about 28 s to follow a temperature step. A 100 µm chip\nchamber needs 0.07 s. A metal block ramps at about 3 °C/s, so 30 cycles spend 13.3 min just changing temperature. A chip at\n30 °C/s needs 1.3 min. Split the reaction into droplets (C4) and you have digital PCR.\n\n**Stage 5: detection, the transducer.** Every Part A idea appears here.\n- **Electrochemical (A6):** an enzyme turns glucose into electrons at an electrode. After a potential step the current\n  follows the **Cottrell** law, $I=n\\mathcal FAc\\sqrt{D/(\\pi t)}$, with $n$ electrons per molecule and $\\mathcal F$ the\n  Faraday constant. Its $\\sqrt{D/(\\pi t)}$ is the same diffusion flux as the molecule-collection formula above. A 1 mm²\n  electrode at 5 mM glucose gives 6.30 µA after 5 s.\n- **Optical (A5):** fluorescence or colour (absorbance). Beer–Lambert absorbance is proportional to path length, and a 50 µm\n  channel has 200× less path than a 1 cm cuvette. Chips therefore prefer fluorescence, or a phone camera reading a\n  lateral-flow line.\n- **Impedance and capacitance (A3):** cells and bound layers change the resistance or capacitance between electrodes. The\n  simplest case is the Coulter counter below. Remember the Debye screening of C4: in saline only charges within about 1 nm of\n  the surface are seen.\n- **Mass (B3):** a resonator's frequency drops when mass lands on it, $\\Delta f/f_0\\approx-\\Delta m/(2m)$, so a quartz\n  crystal or a MEMS cantilever weighs a bound layer of virus or protein.\n\n**Counting cells one by one: the Coulter counter.** Push diluted blood through a small aperture (diameter $D_{\\text{ap}}$,\nlength $L$) filled with salt water of resistivity $\\rho_e$. The aperture has resistance $R=4\\rho_eL/(\\pi D_{\\text{ap}}^2)$.\nA cell is an insulator, so while it passes it displaces conducting liquid and the resistance jumps by\n$$\\Delta R\\approx\\frac{4\\rho_e d^3}{\\pi D_{\\text{ap}}^4}\\qquad(d\\ll D_{\\text{ap}}).$$\nThis is $\\Delta R/R\\approx1.5\\,V_{\\text{cell}}/V_{\\text{ap}}$: the pulse height measures the cell's **volume**. Each pulse is one\ncell, so counting pulses counts cells. For a 50 µm aperture a red cell (90 fL) gives a 23.5 Ω bump on 20.5 kΩ. A white cell\ngives a 5.8× taller pulse, and a platelet a 9× shorter one. A complete blood count is a histogram of these pulses.\nOptical flow cytometers do the same with laser scatter and fluorescence (A5).\n\n```viz\nc5-coulter\n```\n\n**Stages 6–7: from current to a trustworthy number.** The transducer's current is tiny, so a transimpedance amplifier\nturns it into a voltage $V=IR_f$, a filter limits the bandwidth, and an ADC turns it into counts (A7). Each stage multiplies\nthe signal by a gain, so the overall **sensitivity** is the product\n$$S=\\frac{\\text{counts}}{\\text{mM}}=\\underbrace{\\frac{\\text{molecules/s}}{\\text{mM}}}_{\\text{chemistry + transport}}\\times\\underbrace{nq_e}_{\\text{charge}}\\times\\underbrace{R_f}_{\\text{TIA}}\\times\\underbrace{\\frac{2^N}{V_{\\text{ref}}}}_{\\text{ADC}}.$$\nEach stage also adds noise. Refer every noise source back to the input, by dividing by the gain in front of it, and add the\nvariances: $\\sigma_{\\text{tot}}^2=\\sum\\sigma_i^2$. The **limit of detection** is the concentration whose signal stands three\nstandard deviations above the blank (A8):\n$$\\mathrm{LOD}=\\frac{3\\,\\sigma_{\\text{tot}}}{S}.$$\nIn a glucose strip the blank's chemistry (strip-to-strip background current, about 20 nA) dominates. The resistor's Johnson\nnoise (1.4 pA) is negligible, and a 12-bit ADC adds 2.8 nA. A cheap 8-bit ADC would add 45 nA and become the weakest link.\nThe **decision** compares the result with a threshold: below 3.9 mM is hypoglycaemia, above 50 mg/L (0.806 mM) nitrate the\nEU says the water is unfit to drink, and any *E. coli* in 100 mL fails. The LOD must sit well below the threshold, or the\ndecision is a coin toss.\n\n```viz\nc5-signal-budget\n```\n\n**Organ-on-chip: the sample is alive.** In a **lung-on-chip**, a thin porous PDMS membrane separates two channels. Lung\ncells grow on top, exposed to air, and blood-vessel cells grow below, fed by flowing medium. Side chambers under vacuum\nstretch the membrane about 10% at 0.2 Hz, like breathing. The cells feel the flow as **wall shear stress**\n$\\tau_w=6\\mu Q/(wh^2)$ (C2). Blood-vessel cells like about 1 Pa, which in a 1 mm × 100 µm channel needs 100 µL/min. Gut,\nliver, kidney and blood-brain-barrier chips follow the same idea. They test drugs on human tissue that moves and flows like\nthe real thing, which a flat dish cannot do. Sensors are built in: electrodes measure the barrier's electrical resistance\n(TEER), and oxygen and pH spots glow (A5).\n\n**Plant-on-chip and root-on-chip.** Seedlings of *Arabidopsis* (a small model plant) grow their roots into PDMS channels\nunder a microscope. The chip changes nutrients, salt or hormones around a single root in seconds, using laminar streams (C1)\nto treat one side only, while fluorescent sensors in the cells report sugar or calcium. In the field, a sap chip near the\ngrower's tomato stem can read nitrate or potassium with ion-selective electrodes (A6, about 59 mV per decade).\n\n**Wearable sweat patches.** A skin patch has a soft microfluidic serpentine. Sweat glands push sweat in (at about\n1 µL/(cm²·min) during exercise), and a 2 cm² inlet fills a 20 µL channel in about 10 min. Paper or colour spots read\nchloride, lactate or glucose, and a phone camera or an NFC chip reads the result. Sweat glucose is about 100× more dilute\nthan blood glucose, so the LOD budget is tight.\n\n**Cost and manufacturing (B2).** Research chips are **PDMS** moulded on a lithographic master: cheap, clear and\ngas-permeable (good for cells), but they absorb oily drug molecules and recover their hydrophobicity (C4). Products are\n**injection-moulded** plastic (cents per chip), **paper** with wax-printed walls (wicking is the pump), or **glass and\nsilicon** where electrodes, heaters or optics are needed. Glucose strips, with screen-printed carbon electrodes, are made by\nthe billion. Cost pushes every function toward \"passive\": capillary pumps, stop valves, dried reagents.\n\n## Intuitive examples\n\n1. **River water and the volume limit.** At 100 CFU/mL, a 10 µL sample holds $\\bar n=1.00$ cell on average:\n   $P(\\ge1)=1-e^{-1}=0.632$. 95% detection needs $\\bar n=3.00$, so 30 µL at that level. The drinking-water limit\n   (1 per 100 mL) needs 300 mL, concentrated before the chip.\n2. **Diffusion clocks.** Across a 50 µm channel, glucose ($D=6.7\\times10^{-10}$ m²/s) needs 1.87 s, an antibody\n   ($4\\times10^{-11}$) 31.25 s. A protein needs 125 s to mix across 100 µm, but only 1.25 s across 10 µm striations from a\n   herringbone mixer; $\\mathrm{Pe}=2500$ at 1 mm/s.\n3. **The transport limit.** $\\mathrm{Da}=4.15$ for the antibody surface. A 100 µm × 100 µm sensor in still liquid collects in\n   10 minutes 1.05 molecules at 1 fM, $1.05\\times10^3$ at 1 pM and $1.05\\times10^6$ at 1 nM.\n4. **A glucose strip, end to end.** Cottrell at 5 mM ($n=2$, $A=1$ mm², $t=5$ s): $I=6.30$ µA ($1.260$ µA/mM), which is\n   $1.97\\times10^{13}$ glucose molecules oxidised per second. $R_f=82$ kΩ gives 0.517 V and a 12-bit, 3.3 V ADC reads 641\n   counts (128.3 counts/mM). The full scale of 30 mM is 37.8 µA → 3.10 V, which fits; $R_f$ must stay below 87 kΩ. Noise:\n   20 nA blank, 1.42 pA Johnson, 2.84 nA quantisation, so $\\sigma_{\\text{tot}}=20.20$ nA and $\\mathrm{LOD}=0.048$ mM\n   (0.87 mg/dL). With an 8-bit ADC the quantisation is 45.4 nA and the LOD rises to 0.118 mM.\n5. **PCR heat.** $\\tau=L^2/\\alpha_{\\text{th}}$: 28 s for a 2 mm tube, 0.0699 s for a 100 µm chamber. 30 cycles of 80 °C of\n   ramping: 800 s (13.3 min) at 3 °C/s vs 80 s (1.3 min) at 30 °C/s. 30 doublings: $1.074\\times10^9$ copies.\n6. **Coulter counting.** In PBS ($\\rho_e=0.67$ Ω·m), a 50 µm × 60 µm aperture has $R=20.47$ kΩ. A red cell (90 fL,\n   $d=5.56$ µm) gives $\\Delta R=23.46$ Ω (0.115%), which is 2.35 mV at 0.1 mA. A white cell (10 µm) gives 136.6 Ω and a\n   platelet 2.61 Ω. Blood diluted 1:10,000 at 1 µL/s gives 500 cells/s; the aperture holds 0.059 cells on average, so 5.7% of\n   pulses risk a coincidence.\n7. **Plumbing numbers.** The organ-chip needs $Q=100$ µL/min for $\\tau_w=1$ Pa. The serpentine needs 1168 Pa at 1 µL/min.\n   A hydrophobic stop valve bursts at 1478 Pa. The sweat patch fills in 10 min, and the nitrate limit is 0.806 mM.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $P(\\text{none})=e^{-cV}$; need $cV\\ge3$ | sampling: rare targets may not be in the drop | $c$ concentration, $V$ sample volume |\n| $t\\approx w^2/(2D)$, $\\mathrm{Pe}=Uw/D$ | diffusion and mixing time; flow vs diffusion (C3) | $D$ diffusion coefficient |\n| $\\mathrm{Da}=k_{\\text{on}}b_m\\delta/D$ | reaction vs delivery: $\\gg1$ transport-limited | $b_m$ site density, $\\delta$ depletion layer |\n| $N=2cA\\sqrt{Dt/\\pi}$ | molecules collected by a sensor in still liquid | $A$ sensor area |\n| $I=n\\mathcal FAc\\sqrt{D/(\\pi t)}$ | Cottrell current of an electrochemical cell (A6) | $n$ electrons, $\\mathcal F$ Faraday constant |\n| $\\tau\\approx L^2/\\alpha_{\\text{th}}$ | thermal time of a sample: PCR speed (B1) | $\\alpha_{\\text{th}}$ thermal diffusivity |\n| $\\Delta R\\approx4\\rho_ed^3/(\\pi D_{\\text{ap}}^4)$ | Coulter pulse ∝ cell volume | $\\rho_e$ resistivity, $d$ cell diameter |\n| $\\tau_w=6\\mu Q/(wh^2)$ | shear on cells in an organ-chip (C2) | $w$, $h$ channel width and height |\n| $S=\\prod_i g_i$, $\\ \\mathrm{LOD}=3\\sigma_{\\text{tot}}/S$ | chain sensitivity and limit of detection (A1, A8) | $g_i$ stage gains, $\\sigma_{\\text{tot}}^2=\\sum\\sigma_i^2$ |\n\n## Applications\n\n| World | Lab-on-a-chip and integrated sensing | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | sap and soil nitrate/potassium chips (ion-selective electrodes); root-on-chip; field LAMP/PCR cartridges for crop pathogens | when to fertilise; how roots react to salt; whether a blight has arrived before leaves show it |\n| 🧬 Biology & human health | glucose strips; Coulter and flow-cytometry blood counts; 15–45 min PCR cartridges; lung-, gut- and liver-on-chip; sweat patches | a number at the bedside instead of a day later; drug tests on human tissue |\n| 🌍 Environment | *E. coli*, nitrate and heavy-metal chips for rivers and wells; droplet PCR of wastewater | safe or unsafe water, with the sampling volume set by Poisson statistics |\n| 🤖 Robotics & drones | drones that dip samplers into lakes and carry chip analysers; lab robots feeding organ-chips | maps of water quality; round-the-clock experiments |\n| 🚗 Cars | breath-alcohol interlocks (fuel-cell electrochemistry, A6); urea-quality sensors for diesel exhaust fluid; cabin particle counters that count pulses like a Coulter counter | safe driving; clean exhaust; air-quality alerts |\n| 📱 Phones & photography | phone cameras reading lateral-flow lines (A5); smartphone microscopes; NFC-read sweat patches | turning a faint line into a calibrated number and a record |\n| 🏠 Home & household | pregnancy and COVID tests; pool, aquarium and water-hardness strips; smart toilets doing urinalysis | a decision at home, with no lab |\n\n## Derivation\n\n**(a) Sampling (Poisson).**\n1. Targets are scattered at random, so the count in volume $V$ is Poisson with mean $\\bar n=cV$: $P(k)=\\bar n^ke^{-\\bar n}/k!$.\n2. $P(0)=e^{-cV}$. For $P(\\ge1)\\ge0.95$: $e^{-cV}\\le0.05$, so $cV\\ge\\ln20=3.0$.\n\n**(b) Damköhler number.**\n1. At steady state the binding flux equals the diffusive supply: $k_{\\text{on}}b_mc_s=D(c-c_s)/\\delta$.\n2. Solve: $c_s=c/(1+\\mathrm{Da})$ with $\\mathrm{Da}=k_{\\text{on}}b_m\\delta/D$.\n3. $\\mathrm{Da}\\gg1$ ⇒ $c_s\\ll c$: the surface is starved (transport-limited). $\\mathrm{Da}\\ll1$ ⇒ $c_s\\approx c$ (reaction-limited).\n\n**(c) Molecules collected (and Cottrell).**\n1. A perfectly absorbing plane in still liquid: the concentration profile is $c\\,\\mathrm{erf}\\big(y/(2\\sqrt{Dt})\\big)$ (C3).\n2. Flux at the wall: $j=D\\,\\partial c/\\partial y\\vert_0=c\\sqrt{D/(\\pi t)}$.\n3. Integrate over time and area: $N=A\\int_0^tj\\,dt'=2cA\\sqrt{Dt/\\pi}$.\n4. Multiply the molar flux by $n\\mathcal F$ for electrons: $I=n\\mathcal FAc\\sqrt{D/(\\pi t)}$, which is Cottrell's law.\n\n**(d) Chain gain and LOD.**\n1. Stage $i$ maps its input to its output with gain $g_i$, so $y=(\\prod g_i)\\,c=S\\,c$ (A1).\n2. A noise $\\sigma_i$ added after stage $i$ looks, at the input, like $\\sigma_i/(g_1\\cdots g_i)$.\n3. Independent noises add in variance: $\\sigma_{\\text{tot}}^2=\\sum\\sigma_i^2$ (all referred to one point).\n4. Detection requires the signal to stand 3σ above the blank: $S\\cdot\\mathrm{LOD}=3\\sigma_{\\text{tot}}$.\n\n**(e) Coulter pulse.**\n1. Aperture resistance: $R=\\rho_eL/A_{\\text{ap}}=4\\rho_eL/(\\pi D_{\\text{ap}}^2)$.\n2. A small insulating sphere in a uniform field adds the resistance of 3/2 of its own volume of liquid: $\\Delta R/R\\approx\\tfrac32V_{\\text{cell}}/V_{\\text{ap}}$.\n3. With $V_{\\text{cell}}=\\pi d^3/6$ and $V_{\\text{ap}}=\\pi D_{\\text{ap}}^2L/4$: $\\Delta R/R=d^3/(D_{\\text{ap}}^2L)$, so $\\Delta R=4\\rho_ed^3/(\\pi D_{\\text{ap}}^4)$.\n\n**(f) Thermal time of PCR and shear in an organ-chip.**\n1. Heat diffuses like molecules, with $\\alpha_{\\text{th}}$ in place of $D$: $\\tau\\sim L^2/\\alpha_{\\text{th}}$, which shrinks as $\\ell^2$ (B1).\n2. Between plates (C2) $u=6\\bar u\\,(y/h)(1-y/h)$, so $\\tau_w=\\mu\\,du/dy\\vert_0=6\\mu\\bar u/h=6\\mu Q/(wh^2)$.\n\n## Worked check\n\n**Multiply the stage gains of the glucose strip** (5 mM, $n=2$, $A=1$ mm², $D=6.7\\times10^{-10}$ m²/s, $t=5$ s):\n- Chemistry + transport: $\\sqrt{D/(\\pi t)}=6.531\\times10^{-6}$ m/s, so the flux is $3.933\\times10^{12}$ molecules/s per mM.\n- × charge $nq_e=3.204\\times10^{-19}$ C → $1.2603$ µA/mM.\n- × $R_f=82$ kΩ → $0.1033$ V/mM.\n- × ADC $2^{12}/3.3\\ \\text{V}=1241.2$ counts/V → $S=128.3$ counts/mM, so 5 mM reads 641 counts ✓.\n- Noise at the current: $\\sqrt{(20)^2+(0.00142)^2+(2.84)^2}=20.20$ nA, so $\\mathrm{LOD}=3(20.20)/1260.3=0.0481$ mM, about\n  6.2 counts ✓.\n- Cross-check by Cottrell directly: $2\\cdot96485\\cdot10^{-6}\\cdot5\\cdot6.531\\times10^{-6}=6.30$ µA ✓ (all numbers from\n  `scripts/checks/C5_check.py`).\n\n## Whiteboard plan\n\n- **Panel 1: the kitchen and the chip.** Draw the soup steps above the seven chip stages and connect them with arrows: sieve\n  → filter, cup → metering chamber, spoon → serpentine, pot → incubation chamber (heater under it), tasting → electrodes,\n  \"more salt?\" → decision. Under each stage write the note number.\n- **Panel 2: is the target even in the drop?** A drop with 0, 1 or 3 dots. Write $P(\\text{none})=e^{-cV}$ and \"$cV\\ge3$\".\n- **Panel 3: delivery.** A sensor on a wall with a depletion layer $\\delta$; write $\\mathrm{Da}=k_{\\text{on}}b_m\\delta/D$ and\n  \"1 fM → 1 molecule per 10 min\".\n- **Panel 4: the chain.** Five boxes: c → molecules/s → I → V → counts, with the gains on the arrows and a red noise squiggle\n  entering each box. Box $S=\\prod g_i$ and $\\mathrm{LOD}=3\\sigma/S$.\n- **Panel 5: Coulter.** An aperture with a cell in it, a pulse train below, and a histogram with three humps (platelets, red\n  cells, white cells).\n- **Panel 6: the living chip.** Lung-on-chip cross-section: air above, membrane with cells, medium below, vacuum chambers at\n  the sides; write $\\tau_w=6\\mu Q/(wh^2)$ and \"10% stretch at 0.2 Hz\".\n\n## Common mistakes and where the intuition breaks\n\n- **\"Smaller is always faster.\"** Diffusion over short distances is fast, but at low concentration a small sensor catches\n  very few molecules. Small volumes also hold few targets. Shrinking helps reaction speed, but it hurts sampling and\n  delivery.\n- **Confusing sensitivity with LOD.** A huge gain amplifies the noise too. The LOD is set by the noise referred to the\n  input, usually the chemistry of the blank, not by the amplifier.\n- **Clipping.** More $R_f$ looks like more signal until the output hits $V_{\\text{ref}}$. Size the gain for the top of the\n  range (here $R_f\\le87$ kΩ for 30 mM)
