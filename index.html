    ],
    build(fig, ui) {
      let stage = 0;
      // channel centreline (x, y) and its arc length
      const PTS = [[-4.4, 2.2], [-0.8, 2.2], [-0.8, 0.9], [-0.4, 0.9], [-0.4, 2.4], [0, 2.4], [0, 0.9], [0.4, 0.9], [0.4, 2.4], [0.8, 2.4], [0.8, -0.6], [4.5, -0.6]];
      const cum = [0];
      for (let i = 1; i < PTS.length; i++) cum.push(cum[i - 1] + Math.hypot(PTS[i][0] - PTS[i - 1][0], PTS[i][1] - PTS[i - 1][1]));
      const Ltot = cum[cum.length - 1];
      const at = (s) => {
        s = Math.max(0, Math.min(Ltot, s));
        let i = 1; while (i < cum.length - 1 && cum[i] < s) i++;
        const t = (s - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
        return [PTS[i - 1][0] + (PTS[i][0] - PTS[i - 1][0]) * t, PTS[i - 1][1] + (PTS[i][1] - PTS[i - 1][1]) * t];
      };
      const sOf = (p) => {   // arc length of a point that lies on the path
        for (let i = 1; i < PTS.length; i++) {
          const a = PTS[i - 1], b = PTS[i], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
          const t = ((p[0] - a[0]) * (b[0] - a[0]) + (p[1] - a[1]) * (b[1] - a[1])) / (L * L);
          const q = [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
          if (t >= -1e-6 && t <= 1 + 1e-6 && Math.hypot(q[0] - p[0], q[1] - p[1]) < 1e-6) return cum[i - 1] + t * L;
        }
        return 0;
      };
      const SB = [[-4.4, 2.2], [-2.75, 2.2], [-1.3, 2.2], [0.8, 0.0], [2.6, -0.6], [4.5, -0.6]].map(sOf);
      const ST = [
        { name: "the whole chain", box: null },
        { name: "① sample in + prep", sh: "1 prep", box: [[-4.85, 1.7], [-2.75, 2.7]], lab: [-3.8, 2.95] },
        { name: "② metering", sh: "2 meter", box: [[-2.75, 1.7], [-1.3, 3.2]], lab: [-2.0, 3.45] },
        { name: "③ mixing", sh: "3 mix", box: [[-1.45, 0.25], [1.0, 2.65]], lab: [-0.2, 2.9] },
        { name: "④ reaction / PCR", sh: "4 react", box: [[0.6, -1.3], [2.65, 0.1]], lab: [1.6, 0.35] },
        { name: "⑤ detection", sh: "5 detect", box: [[2.65, -2.85], [4.85, -0.15]], lab: [3.75, 0.1] },
        { name: "⑥ conditioning", sh: "6 amplify", box: [[0.85, -3.0], [2.65, -1.85]], lab: [1.75, -3.3] },
        { name: "⑦ decision", sh: "7 decide", box: [[-1.75, -3.0], [0.15, -1.85]], lab: [-0.8, -3.3] },
      ];
      const CH = 0.22, ZC = 0.09;                      // channel width and depth (display)
      const fluid = C.water, glass = mix(C.silicon, "#ffffff", 0.08);
      const chan = (g, a, b, wdt, col, alpha) => {
        const x0 = Math.min(a[0], b[0]) - (a[1] === b[1] ? 0 : wdt / 2), x1 = Math.max(a[0], b[0]) + (a[1] === b[1] ? 0 : wdt / 2);
        const y0 = Math.min(a[1], b[1]) - (a[0] === b[0] ? 0 : wdt / 2), y1 = Math.max(a[1], b[1]) + (a[0] === b[0] ? 0 : wdt / 2);
        g.box([x0, y0, 0.001], [x1, y1, ZC], col, { alpha: alpha === undefined ? 0.8 : alpha, bias: 40 });
      };
      const well = (g, p, r, col, label) => {
        g.cylinder([p[0], p[1], 0], [p[0], p[1], 0.32], r, mix(C.silicon, "#ffffff", 0.35), 16, { alpha: 0.55, open: true, bias: 45 });
        g.poly(Array.from({ length: 16 }, (_, i) => [p[0] + r * 0.95 * Math.cos((i * Math.PI) / 8), p[1] + r * 0.95 * Math.sin((i * Math.PI) / 8), 0.12]), col, { alpha: 0.9, bias: 44, shade: false });
        if (label) g.text([p[0], p[1] - r - 0.28, 0.35], label, C.dim, 11);
      };
      const dotBox = (g, p, r, col) => g.box([p[0] - r, p[1] - r, p[2] - r], [p[0] + r, p[1] + r, p[2] + r], col, { bias: 58 });
      const sc = scene3d(ui.body, {
        w: 640, h: 430, scale: 55, yaw: -0.22, pitch: 0.92, dist: 40, center: [0, -0.1, 0], animate: !VIZ.reduceMotion,
        draw(g, t) {
          // slab
          g.box([-5.2, -3.6, -0.4], [5.2, 3.6, 0], glass, { alpha: 1, bias: -100 });   // always painted first
          g.grid(0.002, [-5, 5], [-3.4, 3.4], 1, mix(C.silicon, C.bg, 0.25));
          // channels
          for (let i = 1; i < PTS.length; i++) chan(g, PTS[i - 1], PTS[i], CH, fluid);
          chan(g, [-1.2, 0.75], [-1.2, 2.2], CH, mix(fluid, "#ffffff", 0.35));       // reagent channel
          chan(g, [-2.1, 2.55], [-2.1, 2.95], 0.16, fluid, 0.6);                     // overflow
          // ① filter region with pillars
          g.box([-3.9, 1.85, 0.001], [-2.9, 2.55, ZC], fluid, { alpha: 0.55, bias: 41 });
          for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) g.cylinder([-3.75 + i * 0.25, 1.98 + j * 0.22, 0], [-3.75 + i * 0.25, 1.98 + j * 0.22, ZC + 0.04], 0.05, C.silicon, 8, { bias: 46 });
          // ② metering chamber + hydrophobic stop valve
          g.box([-2.55, 1.85, 0.001], [-1.65, 2.55, ZC], fluid, { alpha: 0.7, bias: 41 });
          g.box([-1.5, 2.2 - CH / 2 - 0.03, ZC], [-1.38, 2.2 + CH / 2 + 0.03, ZC + 0.03], C.red, { alpha: 0.9, bias: 48 });
          // ④ incubation chamber + heater
          g.box([1.25, -1.15, 0.001], [2.55, -0.05, ZC], fluid, { alpha: 0.65, bias: 41 });
          // thin-film heater (drawn on top of the chamber so it stays visible; really it sits underneath)
          const hw = stage === 4 ? 0.035 : 0.022, hc = stage === 4 ? C.gold : mix(C.gold, C.bg, 0.3);
          for (let k = 0; k <= 6; k++) {
            const x = 1.33 + k * 0.2;
            g.box([x - hw, -1.08, ZC + 0.004], [x + hw, -0.12, ZC + 0.016], hc, { bias: 49, shade: false });
            if (k < 6) { const yb = k % 2 ? -0.12 : -1.08; g.box([x, yb - hw, ZC + 0.004], [x + 0.2, yb + hw, ZC + 0.016], hc, { bias: 49, shade: false }); }
          }

          [[3.1, "W"], [3.45, "R"], [3.8, "C"]].forEach(([x, nm], k) => {
            g.box([x - 0.07, -2.45, 0.001], [x + 0.07, -0.42, ZC * 0.55], C.teal, { bias: 47 });
            g.box([x - 0.16, -2.85, 0.001], [x + 0.16, -2.45, 0.03], C.teal, { bias: 47 });

          });

          for (let k = 0; k < 6; k++) { g.line([1.05 + k * 0.25, -1.95, 0.05], [1.05 + k * 0.25, -1.8, 0.0], C.silicon, 1.5); g.line([1.05 + k * 0.25, -2.85, 0.05], [1.05 + k * 0.25, -3.0, 0.0], C.silicon, 1.5); }
          g.text([1.67, -2.4, 0.4], "TIA + ADC", C.teal, 11.5);
          // ⑦ display
          g.box([-1.65, -2.85, 0.001], [0.05, -1.95, 0.12], "#0b1a14", { bias: 47 });
          g.polyline([[0.95, -2.4, 0.05], [0.05, -2.4, 0.05]], mix(C.teal, C.bg, 0.25), 1.6);
          const done = stage === 7 || stage === 0;
          g.text([-0.8, -2.4, 0.3], done ? "5.0 mM  normal" : "– – –", done ? C.yellow : C.dim, 12.5);
          dotBox(g, [-1.45, -2.1, 0.2], 0.07, stage === 7 || stage === 0 ? C.green : C.silicon);
          // wells
          well(g, PTS[0], 0.32, C.blue, "sample");
          well(g, [-1.2, 0.55], 0.25, mix(fluid, "#ffffff", 0.35), "reagent");
          well(g, [-2.1, 3.1], 0.18, fluid, "");
          well(g, [4.6, -0.6], 0.25, mix(fluid, C.bg, 0.4), "waste");
          // stage labels and highlight
          ST.forEach((st, k) => {
            if (!st.box) return;
            const on = stage === k;
            if (on) {
              const [[x0, y0], [x1, y1]] = st.box, z = 0.36;
              g.polyline([[x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z], [x0, y0, z]], C.yellow, 2.2);
              g.poly([[x0, y0, 0.006], [x1, y0, 0.006], [x1, y1, 0.006], [x0, y1, 0.006]], C.yellow, { alpha: 0.1, shade: false, bias: 39 });

          });
          // the sample plug
          const vis = (s) => { const p = at(s); return [p[0], p[1], ZC + 0.06]; };
          if (stage <= 5) {
            const a = stage === 0 ? 0 : SB[stage - 1], b = stage === 0 ? Ltot : SB[stage];
            const sp = stage === 0 ? 1.6 : 0.8, len = b - a;
            const s = VIZ.reduceMotion ? a + 0.6 * len : a + ((t * sp) % (len + 0.4));
            for (let k = 0; k < 6; k++) { const sk = s - k * 0.07; if (sk >= a - 0.01 && sk <= b + 0.01) dotBox(g, vis(sk), 0.125, k ? C.blue : mix(C.blue, "#ffffff", 0.4)); }
            if (stage === 3) {                      // reagent joins the stream in the mixer
              const sr = s - 0.25;

          } else {
            // electrical stages: teal pulses on the traces, then the yellow result to the display
            const ph = VIZ.reduceMotion ? 0.5 : (t * 0.6) % 1;
            if (stage === 6) [3.1, 3.45, 3.8].forEach((x, k) => {
              const path = [[x, -2.85], [x, -3.05 - 0.08 * k], [2.5, -3.05 - 0.08 * k], [2.4, -2.2 - 0.08 * k]];
              const segL = [0]; for (let i = 1; i < path.length; i++) segL.push(segL[i - 1] + Math.hypot(path[i][0] - path[i - 1][0], path[i][1] - path[i - 1][1]));
              const s = ph * segL[3]; let i = 1; while (i < 3 && segL[i] < s) i++;

              dotBox(g, [path[i - 1][0] + (path[i][0] - path[i - 1][0]) * u, path[i - 1][1] + (path[i][1] - path[i - 1][1]) * u, 0.08], 0.07, C.teal);
            });

          }
        },
      });
      const INFO = [
        `<b>Seven stages, one chain:</b> c → molecules at the sensor → current → volts → counts → decision. Overall sensitivity \\(S=\\prod g_i\\) = 128 counts/mM for the glucose strip (${link("A1")}; the signal-budget figure below multiplies them out).`,
        `<b>① prep</b> · fills by capillarity, no pump (${link("C4")}); pillars hold back blood cells (${link("C1")}). Sampling: P(no target) = e<sup>−cV</sup> → 10 µL at 100 CFU/mL misses 37%; 95% needs cV ≥ 3.`,
        `<b>② metering</b> · chamber volume V = w h L sets the dose; the red hydrophobic stop valve holds until Δp > 2γ|cosθ|(1/w+1/h) = <b>1.48 kPa</b> (${link("C4")}); driving the 5 cm serpentine at 1 µL/min takes Δp = R<sub>hyd</sub>Q = <b>1.17 kPa</b> (${link("C2")}).`,
        `<b>③ mixing</b> · laminar streams only diffuse (${link("C1")}): t = w²/2D = <b>125 s</b> for a protein across 100 µm, Pe = 2500; folding into 10 µm layers gives <b>1.25 s</b> (${link("C3")}).`,
        `<b>④ reaction</b> · Da = k<sub>on</sub>b<sub>m</sub>δ/D = <b>4.15</b>: transport-limited; at 1 fM a 100 µm sensor catches ≈ 1 molecule in 10 min. The gold heater cycles PCR: τ ≈ L²/α = 0.07 s here vs 28 s in a tube (${link("B1")}).`,
        `<b>⑤ detection</b> · W/R/C electrodes: Cottrell I = nFAc√(D/πt) = <b>6.30 µA</b> at 5 mM (${link("A6")}); alternatives: fluorescence (${link("A5")}), impedance/Coulter (${link("A3")}), resonator Δf/f = −Δm/2m (${link("B3")}).`,
        `<b>⑥ conditioning</b> · TIA V = IR<sub>f</sub> = 0.517 V at 82 kΩ, 12-bit ADC → <b>641 counts</b> (${link("A7")}); quantisation adds 2.84 nA of noise.`,
        `<b>⑦ decision</b> · σ<sub>tot</sub> = 20.2 nA (blank chemistry dominates) → LOD = 3σ/S = <b>0.048 mM</b> (${link("A8")}); 5.0 mM is well above the 3.9 mM hypoglycaemia threshold: "normal".`,
      ];
      ui.steps([
        "The chip is the measurement chain of A1 with plumbing in front: \\( c \\xrightarrow{\\text{fluidics}} N \\xrightarrow{\\text{transducer}} I \\xrightarrow{R_f} V \\xrightarrow{\\text{ADC}} \\text{counts} \\). Press ▶ to walk the plug through it.",
        "① Sample in: capillary filling with no pump (C4); pillars filter cells. Is the target even there? \\( P(\\text{none})=e^{-cV} \\Rightarrow cV\\ge3 \\) for 95%.",
        "② Metering: the chamber fixes \\( V=whL \\); the stop valve bursts at \\( \\Delta p=2\\gamma\\lvert\\cos\\theta\\rvert(1/w+1/h) \\) (C4) while the pump supplies \\( \\Delta p=R_{\\text{hyd}}Q \\) (C2).",
        "③ Mixing: \\( t\\approx w^2/(2D) \\) and \\( \\mathrm{Pe}=Uw/D\\gg1 \\), so the serpentine folds the streams to shrink w (C1, C3).",
        "④ Reaction: \\( \\mathrm{Da}=k_{\\text{on}}b_m\\delta/D \\); if \\( \\mathrm{Da}>1 \\) delivery limits, \\( N=2cA\\sqrt{Dt/\\pi} \\). PCR heating: \\( \\tau\\approx L^2/\\alpha_{\\text{th}} \\) (B1).",
        "⑤ Detection: \\( I=n\\mathcal FAc\\sqrt{D/(\\pi t)} \\) (A6) — the same diffusion flux as step ④, times charge.",
        "⑥ Conditioning: \\( V=IR_f \\), counts \\( =V\\,2^N/V_{\\text{ref}} \\) (A7). Size \\( R_f \\) so the top of the range does not clip.",
        "⑦ Decision: refer all noise to the input, \\( \\sigma_{\\text{tot}}^2=\\sum\\sigma_i^2 \\); \\( \\mathrm{LOD}=3\\sigma_{\\text{tot}}/S \\) (A8); compare with the threshold.",
      ], (i) => { stage = i; ui.read.innerHTML = INFO[i]; VIZ.typeset(ui.read); sc.render(); });
    },
  });

  // ───────────────────────────────── c5-signal-budget ─────────────────────────────────
  register("c5-signal-budget", {
    title: "The signal budget · S = g₁·g₂·g₃·g₄ and LOD = 3σ_tot / S for a glucose strip",
    target: "After this you can multiply the stage gains of a sensing chain, refer each noise source to the input, find the weakest link, and compute the limit of detection.",
    caption: "boxes are the stages of the strip: concentration (blue) → molecules oxidised per second (fluid) → current and voltage (teal) → ADC counts (yellow). Red arrows inject noise: the blank's chemistry, the feedback resistor's Johnson noise and the ADC's quantisation. Bottom: the calibration line (green) with its ±3σ band and the ADC ceiling. Raise R_f and watch it clip; drop to 8 bits and watch the ADC become the weakest link.",
    links: [
      { id: "A1", why: "sensitivity is the product of the stage gains" },
      { id: "A6", why: "the Cottrell current is the first gain" },
      { id: "A7", why: "TIA gain R_f and ADC step V_ref/2^N" },
      { id: "A8", why: "noise adds in variance; LOD = 3σ/S" },
    ],
    build(fig, ui) {
      let c = 5, Rf = 82e3, Nb = 12, sBlank = 20e-9, step = 4;
      const n = 2, A = 1e-6, D = 6.7e-10, t = 5, Vref = 3.3, df = 10;
      const model = () => {
        const kc = Math.sqrt(D / (Math.PI * t));
        const g1 = (1 * A * kc * NA) / 1;               // molecules/s per mM (1 mM = 1 mol/m³)
        const g2 = n * QE, g3 = Rf, g4 = Math.pow(2, Nb) / Vref;
        const SI = g1 * g2;                               // A per mM
        const sJ = Math.sqrt((4 * KT * df) / Rf), sQ = Vref / Math.pow(2, Nb) / Math.sqrt(12) / Rf;
        const sTot = Math.sqrt(sBlank * sBlank + sJ * sJ + sQ * sQ);
        const I = SI * c, V = I * Rf, cntRaw = V * g4, full = Math.pow(2, Nb) - 1;
        return { g1, g2, g3, g4, SI, S: g1 * g2 * g3 * g4, sJ, sQ, sTot, I, V, cnt: Math.min(full, cntRaw), clip: cntRaw > full, full, LOD: (3 * sTot) / SI, cmax: Vref / (SI * Rf) };
      };
      const W = 640, Hh = 236;
      const svg = S("svg", { viewBox: `0 0 ${W} ${Hh}`, role: "img", "aria-label": "signal chain with gains and noise" }, ui.body);
      const BX = [12, 140, 268, 396, 524], BW = 104, BY = 46, BHt = 74;
      const cols = [C.blue, C.water, C.teal, C.teal, C.yellow];
      const heads = ["concentration c", "molecules / s", "current I", "voltage V", "ADC counts"];
      const boxes = BX.map((x, i) => {
        const g = S("g", {}, svg);
        S("rect", { x, y: BY, width: BW, height: BHt, rx: 9, fill: "#151b23", stroke: cols[i], "stroke-width": 2 }, g);
        const h = S("text", { x: x + BW / 2, y: BY + 18, fill: C.dim, "font-size": 11.5, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, g); h.textContent = heads[i];
        const v = S("text", { x: x + BW / 2, y: BY + 44, fill: cols[i], "font-size": 15, "font-weight": 600, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, g);
        const v2 = S("text", { x: x + BW / 2, y: BY + 63, fill: C.dim, "font-size": 10.5, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, g);
        return { g, v, v2 };
      });
      const arrs = [0, 1, 2, 3].map((i) => {
        const x0 = BX[i] + BW + 2, x1 = BX[i + 1] - 3, y = BY + BHt / 2, g = S("g", {}, svg);
        const l = S("line", { x1: x0, y1: y, x2: x1 - 6, y2: y, stroke: C.dim, "stroke-width": 2.5 }, g);
        const hd = S("polygon", { points: `${x1},${y} ${x1 - 8},${y - 5} ${x1 - 8},${y + 5}`, fill: C.dim }, g);
        const lab = S("text", { x: (x0 + x1) / 2, y: BY - 12, fill: C.text, "font-size": 11, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, svg);
        const lab2 = S("text", { x: (x0 + x1) / 2, y: BY - 26, fill: C.dim, "font-size": 10.5, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, svg);
        return { l, hd, lab, lab2 };
      });
      const noiseAt = [2, 3, 4], noiseName = ["blank chemistry", "Johnson of R_f", "quantisation"];
      const nz = noiseAt.map((bi, k) => {
        const x = BX[bi] + BW / 2, y0 = BY + BHt + 34, y1 = BY + BHt + 4;
        S("line", { x1: x, y1: y0, x2: x, y2: y1 + 7, stroke: C.red, "stroke-width": 2.2 }, svg);
        S("polygon", { points: `${x},${y1} ${x - 5},${y1 + 8} ${x + 5},${y1 + 8}`, fill: C.red }, svg);
        const t1 = S("text", { x, y: y0 + 14, fill: C.red, "font-size": 11, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, svg); t1.textContent = noiseName[k];
        const t2 = S("text", { x, y: y0 + 28, fill: C.red, "font-size": 11, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, svg);
        return t2;
      });
      const prodTxt = S("text", { x: W / 2, y: 226, fill: C.green, "font-size": 13, "text-anchor": "middle", "font-family": "var(--font-mono, monospace)" }, svg);
      // calibration chart
      const ch = chart(ui.body, { w: 640, h: 230, xr: [0, 30], yr: [0, 4], xlabel: "glucose c (mM)", ylabel: "TIA output V (V)", mb: 38 });
      const band = ch.area(C.red, 0.4), line = ch.line(C.green, 2.5), ceil = ch.hline(C.red, "6 4"), dot = ch.dot(C.yellow, 6), lodL = ch.vline(C.yellow, "3 3");
      const thr = ch.vline(C.dim, "2 5"), thrL = ch.label(C.dim, 11, "start"), ceilL = ch.label(C.red, 11, "end"), lodLab = ch.label(C.yellow, 11, "start");
      thr.set(3.9); thrL.set(4.1, 3.8, "3.9 mM: hypoglycaemia threshold");
      function draw() {
        const m = model();
        // boxes
        boxes[0].v.textContent = fmt(c, 1) + " mM"; boxes[0].v2.textContent = "= " + fmt(c, 1) + " mol/m³";
        boxes[1].v.textContent = sci(m.g1 * c, 2) + "/s"; boxes[1].v2.textContent = "oxidised glucose";
        boxes[2].v.textContent = fmt(m.I * 1e6, 2) + " µA"; boxes[2].v2.textContent = "Cottrell, t = 5 s";
        boxes[3].v.textContent = fmt(Math.min(m.V, Vref), 3) + " V"; boxes[3].v2.textContent = m.V > Vref ? "CLIPPED at V_ref" : "V = I R_f";
        boxes[3].v.setAttribute("fill", m.V > Vref ? C.red : C.teal);
        boxes[4].v.textContent = fmt(m.cnt, 0); boxes[4].v2.textContent = Nb + "-bit, " + Vref + " V ref";
        const gl = [["× A√(D/πt)·N_A", sci(m.g1, 2) + " /s per mM"], ["× n q_e", sci(m.g2, 2) + " C"], ["× R_f", fmt(Rf / 1e3, 0) + " kΩ"], ["× 2^N / V_ref", fmt(m.g4, 1) + " /V"]];
        arrs.forEach((a, i) => {
          a.lab.textContent = gl[i][1]; a.lab2.textContent = gl[i][0];
          const hot = step === i, live = step >= i;
          a.l.setAttribute("stroke", hot ? C.yellow : live ? C.text : C.dim); a.hd.setAttribute("fill", hot ? C.yellow : live ? C.text : C.dim);
          a.lab.setAttribute("fill", hot ? C.yellow : live ? C.text : C.dim);
        });
        boxes.forEach((b, i) => b.g.setAttribute("opacity", step >= 4 || i <= step + 1 ? 1 : 0.3));
        nz[0].textContent = fmt(sBlank * 1e9, 1) + " nA"; nz[1].textContent = fmt(m.sJ * 1e12, 2) + " pA"; nz[2].textContent = fmt(m.sQ * 1e9, 2) + " nA";
        const partial = [m.g1, m.g1 * m.g2 * 1e6, m.g1 * m.g2 * m.g3, m.S];
        const units = [" molecules/s per mM", " µA/mM", " V/mM", " counts/mM"];
        prodTxt.textContent = step < 4 ? `running product after stage ${step + 1}: ${step === 0 ? sci(partial[0], 3) : fmt(partial[step], step === 3 ? 1 : 4)}${units[step]}` : `S = ${fmt(m.S, 1)} counts/mM · σ_tot = ${fmt(m.sTot * 1e9, 2)} nA → LOD = 3σ/S = ${fmt(m.LOD, 4)} mM`;
        // chart
        const xs = []; for (let k = 0; k <= 60; k++) xs.push((30 * k) / 60);
        const vv = (x) => Math.min(Vref, m.SI * Rf * x), sV = 20 * 3 * m.sTot * Rf;   // ±3σ band, drawn 20× wider so it is visible
        line.set(xs.map((x) => [x, vv(x)]));
        band.set(xs.map((x) => [x, Math.max(0, vv(x) - sV)]), xs.map((x) => [x, Math.min(Vref, vv(x) + sV)]));
        ceil.set(Vref); ceilL.set(29.5, Vref + 0.17, "ADC full scale = V_ref = 3.3 V (" + m.full + " counts)");
        dot.set(c, Math.min(m.V, Vref));
        lodL.set(Math.max(0.05, m.LOD)); lodLab.set(Math.max(0.05, m.LOD) + 0.3, 2.9, "LOD " + fmt(m.LOD, 3) + " mM (red band = ±3σ, drawn 20× wider)");
        const worst = [[sBlank, "blank chemistry"], [m.sJ, "Johnson noise"], [m.sQ, "ADC quantisation"]].sort((a, b) => b[0] - a[0])[0][1];
        ui.read.innerHTML =
          `S = ${sci(m.g1, 3)} × ${sci(m.g2, 3)} × ${fmt(Rf / 1e3, 0)}k × ${fmt(m.g4, 1)} = <b style="color:${C.yellow}">${fmt(m.S, 1)} counts/mM</b> (${fmt(m.SI * 1e6, 3)} µA/mM)<br>` +
          `noise at the current: √(${fmt(sBlank * 1e9, 1)}² + ${fmt(m.sJ * 1e9, 4)}² + ${fmt(m.sQ * 1e9, 2)}²) = <b style="color:${C.red}">${fmt(m.sTot * 1e9, 2)} nA</b> · weakest link: <b>${worst}</b><br>` +
          `LOD = 3σ/S = <b>${fmt(m.LOD, 4)} mM</b> (${fmt(m.LOD * 18.016, 2)} mg/dL) · readable up to <b style="color:${m.cmax < 30 ? C.red : C.green}">${fmt(Math.min(m.cmax, 999), 1)} mM</b> before clipping`;
      }
      ui.slider("glucose c", 0, 30, 0.5, c, (v) => { c = v; draw(); return fmt(v, 1) + " mM"; });
      ui.slider("R_f", 20, 400, 2, 82, (v) => { Rf = v * 1e3; draw(); return v + " kΩ"; });
      ui.slider("ADC bits N", 8, 16, 1, Nb, (v) => { Nb = v; draw(); return String(v); });
      ui.slider("blank noise", 2, 60, 1, 20, (v) => { sBlank = v * 1e-9; draw(); return v + " nA"; });
      ui.steps([
        "Chemistry + transport: the electrode oxidises \\( A\\sqrt{D/(\\pi t)}\\,N_A \\) molecules/s per mM, \\( 3.93\\times10^{12} \\) (A6, C3).",
        "Each glucose gives \\( n=2 \\) electrons: \\( \\times\\,nq_e \\) → \\( 1.26 \\) µA/mM.",
        "Transimpedance amplifier: \\( \\times R_f \\) → \\( 0.103 \\) V/mM at 82 kΩ (A7). Too big an \\( R_f \\) clips the top of the range.",
        "ADC: \\( \\times 2^N/V_{\\text{ref}} = 1241 \\) counts/V → \\( S=128.3 \\) counts/mM.",
        "Noise referred to the current adds in variance: \\( \\sigma_{\\text{tot}}=\\sqrt{\\sigma_{\\text{blank}}^2+\\sigma_J^2+\\sigma_Q^2}=20.2 \\) nA, so \\( \\mathrm{LOD}=3\\sigma_{\\text{tot}}/S_I=0.048 \\) mM (A8).",
      ], (i) => { step = i; draw(); });
    },
  });

  // ───────────────────────────────── c5-coulter ─────────────────────────────────
  register("c5-coulter", {
    title: "Coulter counter · each cell is a resistance pulse ΔR ≈ 4ρ_e d³ / (π D_ap⁴)",
    target: "After this you can explain how a blood counter both counts cells and sizes them from one resistance signal, and why too many cells at once (coincidence) corrupts the count.",
    caption: "cells (blue) are pulled through a small aperture between two electrodes (teal) carrying a constant current. Each one displaces conducting saline, so the voltage jumps by IΔR for as long as it is inside: one pulse per cell, height ∝ volume. The histogram converts pulse heights back to volumes: platelets (≈ 10 fL), red cells (≈ 90 fL), white cells (≈ 500 fL). White cells are shown 70× more common than in real blood so you can see them. Raise the cell rate and pulses start to overlap: two small cells look like one big one.",
    links: [
      { id: "A2", why: "a change of resistance read as a voltage, like a strain gauge" },
      { id: "A8", why: "counting N cells has a ±1/√N Poisson error; pulses ride on noise" },
      { id: "C2", why: "the aperture is a hydraulic resistor that sets the flow" },
      { id: "A5", why: "optical flow cytometers count the same way with laser light" },
    ],
    build(fig, ui) {
      let Dap = 50, rate = 2, I0 = 0.1e-3;           // µm, cells per (display) second, A
      const rhoE = 0.67, Lap = 60e-6;
      const TYPES = [{ nm: "platelet", v: 10, p: 0.22 }, { nm: "red cell", v: 90, p: 0.68 }, { nm: "white cell", v: 524, p: 0.10 }];
      const rnd = rng(11);
      const W = 640, H2 = 220, XA0 = 290, XA1 = 350, YC = 112;
      const svg = S("svg", { viewBox: `0 0 ${W} ${H2}`, role: "img", "aria-label": "cells passing an aperture" }, ui.body);
      S("rect", { x: 20, y: 22, width: 600, height: 180, rx: 10, fill: C.water, "fill-opacity": 0.09, stroke: C.silicon }, svg);
      const wallTop = S("rect", { x: XA0, y: 22, width: XA1 - XA0, height: 0, fill: C.silicon }, svg);
      const wallBot = S("rect", { x: XA0, y: 0, width: XA1 - XA0, height: 0, fill: C.silicon }, svg);
      S("rect", { x: 40, y: 50, width: 10, height: 124, fill: C.teal }, svg);
      S("rect", { x: 590, y: 50, width: 10, height: 124, fill: C.teal }, svg);
      const lab = (x, y, s, col, anc) => { const t = S("text", { x, y, fill: col, "font-size": 12, "text-anchor": anc || "middle", "font-family": "var(--font-mono, monospace)" }, svg); t.textContent = s; return t; };
      lab(45, 16, "electrode", C.teal); lab(595, 16, "electrode", C.teal);
      const apLab = lab(320, 214, "", C.dim);
      lab(160, 40, "flow →", C.dim); lab(470, 196, "constant current I = 0.1 mA", C.teal);
      const gCells = S("g", {}, svg);
      // trace and histogram
      const box = H("div", { style: "display:flex;gap:0;flex-wrap:wrap" }, ui.body);
      const hi = chart(box, { w: 240, h: 200, xr: [3, 2000], yr: [0, 1], logx: true, xlabel: "cell volume (fL)", ylabel: "", mb: 36, ml: 18, mr: 10 });
      hi.svg.style.width = "37.5%";
      let tr, trace, thrLine;
      function makeTrace(top) {   // rebuilt when the aperture changes, so the axis ticks stay true
        if (tr) tr.svg.remove();
        tr = chart(box, { w: 400, h: 200, xr: [-4, 0], yr: [0, top], xlabel: "time (s, slow motion)", ylabel: "ΔV = I·ΔR (mV)", mb: 36, ml: 46 });
        box.insertBefore(tr.svg, hi.svg); tr.svg.style.width = "62.5%";
        trace = tr.line(C.yellow, 1.8); thrLine = tr.hline(C.red, "4 4");
      }
      const NB = 28, bins = new Array(NB).fill(0), bars = [];
      for (let k = 0; k < NB; k++) bars.push(S("rect", { fill: C.yellow, "fill-opacity": 0.8 }, hi.gMain));
      [[10, "PLT"], [90, "RBC"], [524, "WBC"]].forEach(([v, s]) => { const l = hi.label(C.dim, 10.5, "middle"); l.set(v, 0.93, s); });
      let cells = [], buf = [], tNext = 0, peak = 0, inPulse = false, counted = 0, coinc = 0, tAll = 0;
      const phys = () => {
        const D = Dap * 1e-6, R = (4 * rhoE * Lap) / (Math.PI * D * D);
        const dR = (v) => { const d = Math.cbrt((6 * v * 1e-18) / Math.PI); return (4 * rhoE * d * d * d) / (Math.PI * Math.pow(D, 4)); };
        return { D, R, dR, Vap: (Math.PI / 4) * D * D * Lap };
      };
      let P = phys();
      const thr = () => Math.max(0.15, 0.5 * P.dR(10) * I0 * 1e3);   // mV: half a platelet pulse, but never below 5σ of the 0.03 mV noise
      function reset() { bins.fill(0); counted = 0; coinc = 0; }
      function geometry() {
        const half = Math.max(8, Math.min(70, Dap * 0.8));
        wallTop.setAttribute("height", YC - half - 22);
        wallBot.setAttribute("y", YC + half); wallBot.setAttribute("height", 202 - YC - half);
        apLab.textContent = `aperture D = ${Dap} µm, L = 60 µm`;
        return half;
      }
      let half = geometry();
      const topOf = () => { const v = P.dR(524) * I0 * 1e3 * 1.3; const m = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / m) * m; };
      makeTrace(topOf());
      const spawn = () => {
        let r = rnd(), k = 0; while (k < 2 && r > TYPES[k].p) { r -= TYPES[k].p; k++; }
        const v = TYPES[k].v * Math.exp(0.18 * gauss(rnd));
        const y = YC + (rnd() - 0.5) * Math.min(2 * half - 12, 120) * 0.8;
        cells.push({ x: 30, y, v, k, y0: y });
      };
      function step(dt) {
        tAll += dt;
        tNext -= dt;
        while (tNext <= 0) { spawn(); tNext += -Math.log(1 - rnd() + 1e-9) / rate; }
        // speed: faster in the aperture (continuity)
        let sig = 0;
        cells.forEach((c) => {
          const inAp = c.x > XA0 - 20 && c.x < XA1 + 20;
          const v = inAp ? 520 : 110;
          c.x += v * dt;
          // funnel toward the axis near the aperture
          const target = YC + (c.y0 - YC) * Math.min(1, Math.abs(c.x - (XA0 + XA1) / 2) / 160);
          c.y += (target - c.y) * Math.min(1, dt * 8);
          if (c.x > XA0 && c.x < XA1) { const u = (c.x - XA0) / (XA1 - XA0); sig += P.dR(c.v) * I0 * 1e3 * Math.pow(Math.sin(Math.PI * u), 0.6); }
        });
        cells = cells.filter((c) => c.x < 610);
        const nIn = cells.filter((c) => c.x > XA0 && c.x < XA1).length;
        sig += 0.03 * gauss(rnd);
        // pulse detection → histogram (volume from the peak height)
        if (sig > thr()) { inPulse = true; peak = Math.max(peak, sig); }
        else if (inPulse) {
          inPulse = false;
          const dRm = peak / (I0 * 1e3), d3 = (dRm * Math.PI * Math.pow(P.D, 4)) / (4 * rhoE), vol = ((Math.PI / 6) * d3) * 1e18;
          const b = Math.floor(((Math.log10(vol) - Math.log10(3)) / (Math.log10(2000) - Math.log10(3))) * NB);
          if (b >= 0 && b < NB) bins[b]++;
          counted++; peak = 0;
        }
        if (nIn > 1 && !step.lastCo) { coinc++; step.lastCo = true; } else if (nIn <= 1) step.lastCo = false;
        buf.push([tAll, sig]);
        while (buf.length && buf[0][0] < tAll - 4) buf.shift();
      }
      function render() {
        gCells.innerHTML = "";
        cells.forEach((c) => {
          const rpx = 1.6 * Math.cbrt(c.v);
          const inAp = c.x > XA0 && c.x < XA1;
          S("circle", { cx: c.x, cy: c.y, r: rpx, fill: C.blue, "fill-opacity": inAp ? 1 : 0.75, stroke: inAp ? C.yellow : "none", "stroke-width": 2 }, gCells);
        });
        const top = tr.o.yr[1];
        trace.set(buf.map(([tt, s]) => [tt - tAll, Math.min(top, s)]));
        thrLine.set(thr());
        const mx = Math.max(1, ...bins);
        bars.forEach((b, k) => {
          const v0 = Math.pow(10, Math.log10(3) + (k / NB) * (Math.log10(2000) - Math.log10(3))), v1 = Math.pow(10, Math.log10(3) + ((k + 1) / NB) * (Math.log10(2000) - Math.log10(3)));
          const x0 = hi.X(v0), x1 = hi.X(v1), y = hi.Y((0.85 * bins[k]) / mx);
          b.setAttribute("x", x0 + 0.5); b.setAttribute("width", Math.max(0, x1 - x0 - 1)); b.setAttribute("y", y); b.setAttribute("height", Math.max(0, hi.Y(0) - y));
        });
      }
      function readout() {
        const rbc = P.dR(90), lam = (5e6 / 1e4) * P.Vap * 1e9;
        ui.read.innerHTML =
          `aperture R = 4ρ<sub>e</sub>L/(πD²) = <b>${fmt(P.R / 1e3, 2)} kΩ</b> · red cell ΔR = <b style="color:${C.yellow}">${fmt(rbc, 2)} Ω</b> (${fmt((rbc / P.R) * 100, 3)}%) → ΔV = ${fmt(rbc * I0 * 1e3, 2)} mV at 0.1 mA<br>` +
          `white cell ${fmt(P.dR(524), 1)} Ω · platelet ${fmt(P.dR(10), 2)} Ω · blood at 1:10,000 → mean cells in aperture ${fmt(lam, 3)}, P(coincidence) = ${fmt((1 - Math.exp(-lam)) * 100, 1)}%<br>` +
          `pulses counted ${counted} · coincidences seen ${coinc}`;
      }
      ui.slider("aperture D_ap", 30, 100, 5, Dap, (v) => { Dap = v; P = phys(); half = geometry(); makeTrace(topOf()); reset(); readout(); return v + " µm"; });
      ui.slider("cell rate (display)", 1, 20, 1, rate, (v) => { rate = v; reset(); readout(); return v + " /s"; });
      ui.button("clear histogram", () => { reset(); readout(); });
      // pre-roll so the histogram is not empty at first sight
      for (let k = 0; k < 3000; k++) step(1 / 60);
      render(); readout();
      if (!VIZ.reduceMotion) {
        let acc = 0;
        loop(svg, (tt, dt) => { step(dt); render(); acc += dt; if (acc > 0.5) { acc = 0; readout(); } });
      }
    },
  });
})();

</script>
<script>
const DATA = {"pages": [{"id": "home", "short": "Start here", "title": "The storyline", "part": "", "md": "# Sensor foundations: the storyline and the index\n\nOne idea per note. Symbols come from [notation](#notation) only. Read the notes in order; each one says what it builds on and\nwhat uses it, and every interactive figure links to the figures in other notes that reuse the same idea.\n\n## The one story that connects everything\n\n**A tomato plant, a person, a drone, a car, a phone and a house: one day of measuring the world.** At dawn a greenhouse\ntomato plant is thirsty. A leaf clip measures its temperature, and a sap-flow chip measures how fast water is moving. The\ngrower wakes up and her smartwatch reports heart rate and steps. She pricks a finger for a glucose test strip and drives\nto the field. Her car's airbag accelerometer, tyre-pressure sensors and parking radar watch the road. A drone flies over\nthe crop, holding steady with a MEMS gyroscope and photographing every leaf. Back home, the phone camera, the thermostat,\nthe smoke detector and the voice assistant's microphones are all at work. In the lab, a microfluidic chip the size of a\nstamp checks a water sample for bacteria.\n\n**Every one of those devices does the same four things.** It lets the world change something physical (a resistance, a\ncapacitance, a moving mass, a flowing liquid). It turns that change into a voltage, cleans the voltage up, and turns it\ninto a number a computer can trust. The 19 notes follow that chain:\n\n- **Part A, Electronic sensors & signals:** how a change in the world becomes a clean, calibrated number.\n- **Part B, MEMS:** how to build tiny moving machines out of silicon, and why tiny is different.\n- **Part C, Microfluidics:** how liquids behave in channels thinner than a hair, and how to build a lab on a chip.\n\n```viz\nstory-map\n```\n\n| # | Note | The question it answers in the story | Everyday hook |\n|---|---|---|---|\n| A1 | [What a sensor is: transduction and the measurement chain](#A1) | How does a smartwatch turn a heartbeat into a number? | a kitchen scale |\n| A2 | [Resistive sensors and the Wheatstone bridge](#A2) | How does a bathroom scale, a leaf thermometer or a car's strain gauge feel a 0.1% change? | a rubber band that gets thinner as you stretch it |\n| A3 | [Capacitive sensors](#A3) | How does a phone screen know where your finger is? How does a soil sensor feel water? | two hands almost clapping |\n| A4 | [Piezoelectric, piezoresistive and magnetic sensors](#A4) | How does a lighter spark, a phone compass find north, or a car know wheel speed? | a gas-grill igniter click |\n| A5 | [Optical sensors: photodiodes, image sensors and LiDAR](#A5) | How does a camera pixel count light? How does a car or drone measure distance with light? | rain filling buckets on a grid |\n| A6 | [Electrochemical sensors and biosensors](#A6) | How does a glucose strip, a pH probe or a CO detector work? | a battery made from a lemon |\n| A7 | [Signal conditioning: amplifiers, filters and ADCs](#A7) | How do microvolts become clean numbers in a microcontroller? | a hearing aid; a staircase vs. a ramp |\n| A8 | [Noise, resolution, calibration and drift](#A8) | How small a change can we trust? Why do sensors need calibrating? | a bathroom scale that reads 0.3 kg with nobody on it |\n| A9 | [Sensor fusion and the Kalman filter](#A9) | How does a drone combine a jittery accelerometer with a slow barometer? | two friends' guesses, weighted by how reliable each one is |\n| B1 | [Scaling laws: why small is different](#B1) | Why can an ant lift 50× its weight, and why does that make MEMS possible? | an ant vs. an elephant; ice cubes vs. crushed ice |\n| B2 | [Microfabrication: lithography, etching, deposition](#B2) | How do you build a moving machine 100× thinner than a hair? | stencil spray-painting; a layered cake |\n| B3 | [Micromechanics: beams, springs and resonators](#B3) | How stiff is a silicon beam, and why does it ring like a bell? | a diving board; a wine glass singing |\n| B4 | [MEMS inertial sensors: accelerometers and gyroscopes](#B4) | How does a phone know which way is up, or a drone know it is turning? | a ball on a spring in a box; a spinning merry-go-round |\n| B5 | [MEMS microphones, pressure sensors and actuators](#B5) | How do phone microphones, tyre-pressure sensors and inkjet heads work? | a drum skin |\n| C1 | [Fluids at the microscale: Reynolds number and laminar flow](#C1) | Why don't two streams in a chip mix? Why does honey feel like the microworld? | stirring honey vs. water |\n| C2 | [Pressure-driven flow and hydraulic circuits](#C2) | How much pressure pushes a sample through a chip? How does water rise in a plant? | a garden hose; Ohm's law for water |\n| C3 | [Diffusion, mixing and the Péclet number](#C3) | How long until two streams mix? How fast does glucose reach a sensor? | a tea bag in still water |\n| C4 | [Surface tension, capillarity, droplets and electrokinetics](#C4) | How do paper tests wick fluid with no pump? How do chips make droplets and move fluid with voltage? | a paper towel soaking up a spill |\n| C5 | [Lab-on-a-chip, organ-on-chip and integrated sensing systems](#C5) | How do all the pieces combine into one chip that tests water, blood or sap? | a whole kitchen shrunk onto a postage stamp |\n\n## Threads: the same idea, met again and again\n\n| Thread | Where it appears |\n|---|---|\n| **Linearise around an operating point**, $\\Delta y\\approx S\\,\\Delta s$ | A1 → A2, A3, A4, A6 → B4, B5 |\n| **Divide to compare:** bridges, differential pairs, ratios | A2 → A3 (differential capacitors) → B4, B5 |\n| **Mass–spring–damper** $m\\ddot x+b\\dot x+kx=F$ | B3 → B4, B5 → A9 (as a motion model) |\n| **First-order lag** $\\tau\\dot y+y=Ks$ ($RC$, thermal, diffusion) | A7 → A2 (thermistors), A6 (electrodes), C3 |\n| **Ohm's-law analogies**: $V=IR$ ↔ $\\Delta p=QR_{\\text{hyd}}$ | A2, A7 → C2 → C5 |\n| **Noise averages down as $1/\\sqrt M$**, and Brownian motion spreads as $\\sqrt{t}$ | A8 → A9, B1, C3 |\n| **Scaling with size $\\ell$** | B1 → B3, B4, C1, C3, C4 |\n\n## Where it is used: the seven worlds\n\nEvery note ends its applications table with the same seven rows, so you can follow one world across the whole notebook.\n\n| World | Sensors you will meet |\n|---|---|\n| 🌱 Plants & agriculture | leaf temperature, sap flow, soil moisture (capacitive), chlorophyll fluorescence, nitrate electrodes, drone multispectral cameras |\n| 🧬 Biology & human health | ECG/PPG wearables, glucose strips, pulse oximeters, lab-on-a-chip diagnostics, organ-on-chip, hearing aids |\n| 🌍 Environment | gas sensors (CO₂, NO₂, O₃), water-quality chips, rain gauges, particulate counters, weather stations |\n| 🤖 Robotics & drones | IMUs, force/torque sensors, tactile skins, LiDAR, optical flow, barometric altitude |\n| 🚗 Cars | airbag accelerometers, tyre-pressure (TPMS), wheel-speed Hall sensors, radar/LiDAR, oxygen (λ) sensors |\n| 📱 Phones & photography | touchscreen, CMOS camera, autofocus, optical image stabilisation, MEMS microphones, compass, barometer |\n| 🏠 Home & household | thermostats, smoke and CO detectors, kitchen scales, motion (PIR) sensors, washing-machine level sensors |\n\n## The shape of every note\n1. **Connects:** what it builds on and what uses it (links).\n2. **Hook:** a real-world scene a 10th grader knows that works the same way as the physics.\n3. **The idea in plain words:** complete rather than compact, with no unexplained symbol.\n4. **Interactive figures:** each has a 🎯 *teaching target*, a 3D model you can rotate or a live plot, a **math, step by step** panel that walks through the derivation while the picture follows along, and **Connected to** links to the figures in other notes that reuse the idea.\n5. **Intuitive examples:** 3–5 small ones with real numbers.\n6. **The key equations:** the results to remember, with every symbol defined.\n7. **Applications:** the seven worlds above.\n8. **Derivation:** numbered steps, one line each.\n9. **Worked check:** a tiny example by hand, with the numbers verified by a script in `scripts/checks/`.\n10. **Whiteboard plan:** what to draw, panel by panel, and what to say.\n11. **Common mistakes:** and where the intuition breaks.\n12. **Remember:** one line. **Self-test:** 3 questions with hidden answers.\n"}, {"id": "notation", "short": "Notation", "title": "Notation", "part": "", "md": "# Notation — one set of symbols for every note\n\nEvery note uses these symbols and nothing else. If a note needs a new symbol, add it here first.\nMath is LaTeX between `$…$`. Units are SI unless a note says otherwise; micro-scale numbers are written with prefixes\n(µm, nL, pF, mV, ppm). **Rule of thumb for clashes:** the *bare* letter has one meaning; every other meaning carries a subscript.\n\n## The measurement chain (Part A)\n| Thing | Symbol | Example / rule |\n|---|---|---|\n| Stimulus / measurand (what the world does) | $s$ | strain, light power, pressure, glucose concentration |\n| Sensor output | $y$ | volts, counts, hertz; ideal linear sensor $y=y_0+S\\,s$ |\n| Offset (output at zero stimulus) | $y_0$ | |\n| Sensitivity | $S=dy/ds$ | units \"output per stimulus\", e.g. mV/kPa |\n| Full-scale range, resolution | $s_{\\text{FS}}$, $\\Delta s_{\\min}$ | resolution = smallest change you can see above noise |\n| Error (\"measured minus true\") | $e=s_{\\text{meas}}-s$ | always measured minus true, like a residual |\n| Voltage, current, resistance, power | $V$, $I$, $R$, $P$ | supply/excitation voltage $V_{\\text{ex}}$, bridge output $V_{\\text{out}}$ |\n| Capacitance, charge | $C$, $q$ | $q=CV$ |\n| Inductance | $L_{\\text{ind}}$ | bare $L$ is a length |\n| Gauge factor | $\\mathrm{GF}$ | $\\Delta R/R=\\mathrm{GF}\\cdot\\varepsilon$ |\n| Temperature coefficient of resistance | $\\alpha$ | $R=R_0(1+\\alpha\\,\\Delta T)$ |\n| Thermistor constant | $\\beta$ | $R=R_0\\,e^{\\beta(1/T-1/T_0)}$ |\n| Time constant, cutoff frequency | $\\tau=RC$, $f_c=1/(2\\pi\\tau)$ | |\n| Frequency, angular frequency | $f$, $\\omega=2\\pi f$ | |\n| Gain (amplifier) | $G$ | in dB: $20\\log_{10}G$ |\n| ADC bits, reference voltage, step size (LSB) | $N$, $V_{\\text{ref}}$, $\\Delta V=V_{\\text{ref}}/2^N$ | |\n| Sampling frequency | $f_s$ | Nyquist: signal content must stay below $f_s/2$ |\n| Noise (rms), standard deviation | $\\sigma_n$; general std $\\sigma_{(\\cdot)}$ with subscript | bare $\\sigma$ = mechanical stress |\n| Bandwidth | $\\Delta f$ | Johnson noise $v_n=\\sqrt{4k_BTR\\Delta f}$ |\n| Number of averaged samples | $M$ | noise falls as $1/\\sqrt M$ |\n| Signal-to-noise ratio | $\\mathrm{SNR}$ | in dB: $20\\log_{10}(\\text{signal rms}/\\text{noise rms})$ |\n| Photodiode responsivity, quantum efficiency | $\\mathcal{R}$, $\\eta$ | $I=\\mathcal{R}P_{\\text{opt}}$; bare $R$ is resistance |\n| Optical power, wavelength | $P_{\\text{opt}}$, $\\lambda$ | photon energy $h_{\\text P}c_0/\\lambda$ |\n| Electrode potential | $V$ (with subscript: $V_{\\text{cell}}$, $E^0$ written $V^0$) | Nernst slope $\\frac{R_gT}{z\\mathcal F}\\ln 10\\approx 59$ mV/decade at 25 °C |\n| Kalman filter (1D) | estimate $\\hat x$, its variance $p$, gain $K$, measurement $z$ | process noise variance $\\sigma_w^2$, measurement noise variance $\\sigma_v^2$ |\n\n## Mechanics and MEMS (Part B)\n| Thing | Symbol | Rule |\n|---|---|---|\n| Length, width, thickness of a structure | $L$, $w$, $t$ | in fluids $w$, $h$ (height) and $L$ describe the channel |\n| Displacement | $x$ (along the sensing axis) | velocity $\\dot x$, acceleration $\\ddot x$ |\n| Force, mass, spring constant, damping | $F$, $m$, $k$, $b$ | $m\\ddot x+b\\dot x+kx=F$ |\n| Natural frequency | $\\omega_0=\\sqrt{k/m}$, $f_0=\\omega_0/2\\pi$ | |\n| Quality factor, damping ratio | $Q_f$, $\\zeta_d$ | $Q_f=\\sqrt{km}/b=1/(2\\zeta_d)$ |\n| External acceleration, rotation rate | $a$, $\\Omega$ | static deflection $x=ma/k=a/\\omega_0^2$; Coriolis $F=2m\\,\\Omega\\,\\dot x$ |\n| Stress, strain | $\\sigma$, $\\varepsilon$ | $\\sigma=E\\varepsilon$ |\n| Young's modulus, Poisson's ratio | $E$, $\\nu_P$ | |\n| Second moment of area | $I_A$ | rectangle $I_A=wt^3/12$; bare $I$ is current |\n| Density | $\\rho$ | |\n| Permittivity | $\\varepsilon_0$, $\\varepsilon_r$ (always subscripted) | bare $\\varepsilon$ = strain. Plate capacitor $C=\\varepsilon_0\\varepsilon_rA/g$ |\n| Gap, plate area | $g$, $A$ | $g_0$ = rest gap |\n| Electric field | $\\mathcal E$ | bare $E$ = Young's modulus |\n| Size scale (for scaling laws) | $\\ell$ | \"everything shrinks by 10\" ⇒ $\\ell\\to\\ell/10$ |\n| Boltzmann constant, temperature | $k_B$, $T$ | $k_BT\\approx4.1\\times10^{-21}$ J at 25 °C |\n\n## Fluids and microfluidics (Part C)\n| Thing | Symbol | Rule |\n|---|---|---|\n| Velocity field, speed scale | $\\mathbf u$, $U$ | $u$ = velocity along the channel |\n| Pressure, pressure drop | $p$, $\\Delta p$ | |\n| Volumetric flow rate | $Q$ | quality factor is $Q_f$ |\n| Dynamic viscosity, kinematic viscosity | $\\mu$, $\\nu=\\mu/\\rho$ | water ≈ $1$ mPa·s, $\\nu\\approx10^{-6}$ m²/s |\n| Hydraulic resistance | $R_{\\text{hyd}}$ | $\\Delta p=R_{\\text{hyd}}Q$ (Ohm's law for fluids) |\n| Channel width, height, length; hydraulic diameter | $w$, $h$, $L$, $D_h$ | |\n| Wall shear stress | $\\tau_w$ | bare $\\tau$ = time constant |\n| Diffusion coefficient | $D$ | diffusion length $\\sqrt{2Dt}$ (1D) |\n| Concentration | $c$ | |\n| Surface tension, contact angle | $\\gamma$, $\\theta$ | Laplace pressure $\\Delta p=2\\gamma/r$ for a sphere |\n| Zeta potential, Debye length | $\\zeta$, $\\lambda_D$ | electro-osmotic speed $u_{\\text{eo}}=-\\varepsilon_0\\varepsilon_r\\zeta\\mathcal E/\\mu$ |\n| Dimensionless numbers | $\\mathrm{Re}=\\rho UL/\\mu$, $\\mathrm{Pe}=UL/D$, $\\mathrm{Ca}=\\mu U/\\gamma$, $\\mathrm{Bo}=\\rho g_{\\text{grav}}L^2/\\gamma$ | upright roman letters; gravity is $g_{\\text{grav}}$ (bare $g$ = gap) |\n\n## Conventions to say out loud (students trip on these)\n1. **Every sensor is a chain:** stimulus $s$ → physical change (ΔR, ΔC, Δx, ΔI) → voltage → number. Each arrow has a gain; the sensitivity $S$ is their product.\n2. **Small-signal thinking:** most sensors are linearised around an operating point, $\\Delta y\\approx S\\,\\Delta s$ (a first-order Taylor step).\n3. **Ratios beat absolutes:** relative changes ($\\Delta R/R$, $\\Delta C/C$, ppm) travel across devices; absolute numbers don't.\n4. **Analogies are exact here:** voltage ↔ pressure, current ↔ flow, resistor ↔ channel, capacitor ↔ compliant chamber, mass–spring ↔ LC circuit.\n5. **Scaling first:** before any formula, ask how the effect scales with size $\\ell$ (B1). It explains why MEMS and microfluidics work at all.\n\n## Colours in the visuals (same object, same colour, in every note's interactive figure — `scripts/viz/core.js`)\n| Colour | Object | Examples |\n|---|---|---|\n| blue | the stimulus / measurand — what the world does | strain, light, acceleration, glucose |\n| yellow | the sensor's output signal | $V_{\\text{out}}$, ADC counts, frequency shift |\n| green | the ideal model, calibration line, filtered estimate | $y=y_0+Ss$, Kalman $\\hat x$ |\n| red | noise, error, drift | $e$, $\\sigma_n$ |\n| teal | electrical quantities | voltage, charge, field lines, current |\n| gold | heat and light | temperature, photons |\n| purple | mechanical quantities | force, proof mass, spring, displacement |\n| bright blue (\"water\") | fluid | flow, velocity profile, concentration |\n| grey | the device body | silicon, glass, PDMS |\n"}, {"id": "A1", "short": "What a sensor is: transduction and the measurement chain", "title": "What a sensor is: transduction and the measurement chain", "part": "A", "md": "# A1. What a sensor is: transduction and the measurement chain\n\n> **Connects:** builds on school physics only (this is the first note) · used by [A2 Resistive sensors and the Wheatstone bridge](#A2), [A3 Capacitive sensors](#A3), [A4 Piezoelectric, piezoresistive and magnetic sensors](#A4), [A5 Optical sensors](#A5), [A6 Electrochemical sensors and biosensors](#A6), [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration and drift](#A8)\n\n## Hook — a kitchen scale and a heartbeat\n\nPut a bag of flour on a kitchen scale and the display says **250 g**. Nothing inside the scale \"knows\" what a gram is.\nWhat actually happens is a chain of small events. The flour pushes on a metal bar. The bar bends by a few micrometres.\nThin metal foil glued to the bar stretches, and its electrical resistance rises by about one part in ten thousand. A\nlittle circuit turns that change into half a millivolt. An amplifier makes it 128 times bigger. A chip turns the\nvoltage into the integer 2048. A line of code finally turns 2048 into \"250 g\".\n\nA smartwatch does the same thing with your pulse. A green LED shines into your wrist. Each heartbeat pushes a little\nmore blood into the capillaries, the blood absorbs a little more green light, and the photodiode under the glass\ncollects about 1% less light. That 1% wobble becomes a current, then a voltage, then a stream of numbers. Software\ncounts the wobbles and shows \"75 bpm\".\n\n**Every sensor in this notebook is such a chain.** If you can draw the chain and put a number on each arrow, you\nunderstand the sensor, whether it is a glucose strip, a drone gyroscope or a phone camera.\n\n## The idea in plain words\n\n**The stimulus and the output.** The thing the world does, the thing we want to know, is the **stimulus** or\n**measurand**, written $s$. It could be a mass, a temperature, a light power, a pressure or a glucose concentration.\nWhat comes out of the sensor is the **output** $y$. It is usually a voltage, a number of ADC counts or a frequency. A\n**transducer** is anything that turns one kind of physical quantity into another, and a **sensor** is a transducer whose\njob is to report on the world. In the pictures of this notebook the stimulus is always **blue** and the output is\nalways **yellow**.\n\n**The measurement chain.** Almost every electronic sensor has four links:\n\n1. **Stimulus → physical change.** The world changes something inside the device: a resistance $R$ (A2), a capacitance\n   $C$ (A3), a displacement $x$ of a tiny mass (B4), a charge (A4), a photocurrent (A5) or an electrode potential (A6).\n2. **Physical change → voltage.** A circuit such as a bridge, a divider or a charge amplifier turns that change into a\n   voltage $V$.\n3. **Voltage → clean, big voltage.** An amplifier with gain $G$ and filters make it large and quiet (A7).\n4. **Voltage → number.** An analogue-to-digital converter (ADC) with $N$ bits and reference $V_{\\text{ref}}$ cuts the\n   voltage into steps of $\\Delta V=V_{\\text{ref}}/2^N$ and reports how many steps fit. Software then turns counts back into\n   grams, degrees or beats per minute.\n\nEach arrow has its own **gain**: how much the output of that stage changes per unit change of its input. The overall\n**sensitivity** of the sensor is simply **the product of the stage gains**. Drag the mass in the 3D scale below and\nwatch the signal move stage by stage. The stepper multiplies the gains one at a time.\n\n```viz\na1-chain-3d\n```\n\n**The transfer function.** If you plot output against stimulus you get the sensor's **transfer function** $y=f(s)$, its\n\"personality\". The ideal sensor is a straight line,\n$$y=y_0+S\\,s,$$\nwhere the **offset** $y_0$ is the output with no stimulus at all (the scale's reading with an empty pan) and the\n**sensitivity** $S=dy/ds$ is the slope (counts per kilogram, millivolts per kilopascal). Real transfer functions bend.\nThey flatten when the amplifier or the material **saturates**, they may have a dead zone near zero, and they may give a\nslightly different reading on the way up than on the way down.\n\n**Range.** The **full-scale range** $s_{\\text{FS}}$ is the span of stimulus the sensor is built for, for example 0–5 kg for a\nkitchen scale. Above it the output saturates or the device breaks. Many specifications are quoted as a percentage of full\nscale (%FS).\n\n**Linearity.** Near any working point a smooth curve looks like its tangent line. This is the most-used idea in the whole\nnotebook: **linearise around an operating point**,\n$$\\Delta y\\approx S\\,\\Delta s,\\qquad S=f'(s_{\\text{op}}),$$\na first-order Taylor step. The size of the error depends on how far you step: it grows like $\\Delta s^2$. The\n**linearity error** of a sensor is the largest gap between its real curve and the straight line used to interpret it,\nusually quoted in %FS. Move the operating point in the figure below and watch the tangent (green) and the error (red).\n\n```viz\na1-transfer-curve\n```\n\n**Hysteresis.** Some materials remember where they came from. A polymer humidity sensor might read 51% RH when the air\nis getting wetter and 53% RH at the same true humidity when the air is getting drier. The transfer function becomes a thin\nloop instead of a line. The width of the loop is the **hysteresis**, here 2% RH. Toggle it in the figure above.\n\n**Resolution, accuracy and precision are three different things.**\n- **Resolution** $\\Delta s_{\\min}$ is the smallest change in $s$ that you can see in the output. It is limited by the\n  display step, by the ADC step $\\Delta V$ and, most of all, by **noise** (A8). One ADC count does not help if the\n  reading jumps by 3 counts on its own.\n- **Accuracy** is how close the reading is to the truth on average. The **error** is always \"measured minus true\",\n  $e=s_{\\text{meas}}-s$. A constant error is a **bias**, and calibration (A8) removes it.\n- **Precision** (repeatability) is how close repeated readings are to *each other*, measured by their standard\n  deviation. A sensor can be precise but inaccurate (tight cluster, wrong place) or accurate but imprecise (right on\n  average, but scattered).\n\n**Active and passive sensors.** Some sensors make their own electrical signal from the energy of the stimulus. A\nthermocouple makes a voltage from a temperature difference, a photodiode makes a current from light (A5), and a piezo\ndisc makes a charge when squeezed (A4). These are called **self-generating** or **active** sensors. Others only *change*\na property, such as a resistance or a capacitance, and you must push a current or voltage through them to read that\nproperty: strain gauges, thermistors (A2) and capacitive sensors (A3). These are **modulating** or **passive**\nsensors, and their output is proportional to the **excitation** $V_{\\text{ex}}$ you supply. Be careful: some books\nswap the words \"active\" and \"passive\" (an \"active pixel\" in A5 means \"has its own amplifier\"). The physics is what\nmatters: *does the stimulus supply the energy, or does my circuit?*\n\n**Response time: the first-order lag.** No sensor answers instantly. A thermometer has to warm up, and a humidity film\nhas to soak up water. Very often the reading $y$ creeps toward its final value $K s$ at a speed proportional to how far it\nstill has to go:\n$$\\tau\\,\\dot y+y=K\\,s,$$\nwhere $\\tau$ is the **time constant** and $K$ is the static gain. After a sudden step in $s$ the solution is\n$$y(t)=y_{\\text{final}}+(y_{\\text{start}}-y_{\\text{final}})\\,e^{-t/\\tau}.$$\nAfter $\\tau$ the sensor has covered 63.2% of the jump, after $3\\tau$ 95.0%, and after $5\\tau$ 99.3%. The same equation\ndescribes an $RC$ filter (A7), a thermistor bead warming up (A2), an electrode soaking in a solution (A6) and a molecule\ndiffusing to a surface (C3). Try reading the thermometer too early below.\n\n```viz\na1-step-response\n```\n\n## Intuitive examples\n\n1. **Kitchen scale, stage by stage.** The load-cell bar is made so that 5 kg gives 1000 µε (microstrain), so 200 µε/kg.\n   Foil gauges with $\\mathrm{GF}=2$ turn this into $\\Delta R/R=400$ ppm per kg. A full bridge excited with $V_{\\text{ex}}=5$ V\n   gives 2.000 mV/kg (the datasheet calls this \"2 mV/V rated output\"). An amplifier with $G=128$ makes it 0.2560 V/kg.\n   A 16-bit ADC with $V_{\\text{ref}}=2.048$ V has steps of $\\Delta V=31.25$ µV, i.e. 32 000 counts per volt. Product:\n   $S=8192$ counts/kg. Full scale (5 kg) is 1.280 V, or 40 960 counts, and one count is 0.1221 g. But if the reading wobbles\n   by 3 counts rms, the smallest change you can trust is about 0.37 g, not 0.12 g.\n2. **Smartwatch PPG.** The photodiode delivers a steady 1 µA of green light current. Each heartbeat reduces it by about\n   1% (the \"perfusion index\"), so the pulse is a 10 nA wobble. A transimpedance amplifier with a 100 kΩ resistor turns\n   this into 0.100 V of steady signal and a 1.00 mV pulse on top. If the pulse peaks arrive every 0.8 s, the watch shows\n   75 beats per minute. The hard part is not the gain: it is separating the 1% heartbeat from the steady 99% and from arm\n   motion.\n3. **A fever thermometer is a first-order lag.** A probe with $\\tau=10$ s at 22 °C goes under the tongue at 37 °C. It\n   starts climbing at $15/\\tau=1.50$ °C/s, reads 31.48 °C after 10 s, 36.25 °C after 30 s and 36.90 °C after 50 s. It is\n   within 0.1 °C of the truth only after $\\tau\\ln(15/0.1)=50.1$ s. That is why a \"fast\" thermometer beeps and then\n   *predicts* the final value from the shape of the curve.\n4. **Accurate, precise, resolved.** A bathroom scale with 0.1 kg resolution weighs a 70.0 kg calibration mass five times:\n   70.4, 70.6, 70.5, 70.5, 70.6 kg. Mean 70.52 kg, so the error is $e=+0.52$ kg (poor accuracy). The sample standard\n   deviation is 0.084 kg (good precision). One calibration offset fixes the accuracy; nothing but better hardware or\n   averaging fixes precision.\n5. **Saturation eats sensitivity.** Many sensor front-ends follow $y=V_{\\text{sat}}\\tanh(S_0s/V_{\\text{sat}})$: a straight line of\n   slope $S_0$ that bends over toward $\\pm V_{\\text{sat}}$. At $S_0s/V_{\\text{sat}}=0.1$ the curve is only 0.3% below the\n   straight line. At 0.5 it is 7.6% below and the local slope has dropped to 0.786 $S_0$. At 2 it is 51.8% below and the local\n   slope is 0.071 $S_0$: a big change in $s$ hardly moves $y$.\n6. **Hysteresis in a humidity sensor.** At a true 52% RH, a polymer sensor reads 51% when the air is getting wetter and 53%\n   when it is getting drier. The loop width is 2% RH, which is 2% of its 0–100% full scale.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $y=f(s)$ | transfer function: the whole personality of the sensor | $s$ stimulus, $y$ output |\n| $y=y_0+S\\,s$ | ideal linear sensor | $y_0$ offset, $S$ sensitivity |\n| $S=\\dfrac{dy}{ds}=\\prod_i S_i$ | sensitivity is the slope; for a chain it is the product of the stage gains | $S_i$ gain of stage $i$ |\n| $\\Delta y\\approx S\\,\\Delta s$, error $\\approx\\tfrac12 f''\\,\\Delta s^2$ | linearise around an operating point | $\\Delta s$ small step |\n| $s_{\\text{meas}}=\\dfrac{y-y_0}{S}$ | reading the sensor: invert the calibration line | |\n| $e=s_{\\text{meas}}-s$ | error: measured minus true; its mean is the bias | |\n| $\\Delta V=V_{\\text{ref}}/2^N$ | ADC step size (one LSB) | $N$ bits, $V_{\\text{ref}}$ reference |\n| $\\Delta s_{\\min}\\approx \\sigma_n/S$ | resolution is set by noise, not by display digits | $\\sigma_n$ rms noise in output units |\n| $\\tau\\dot y+y=Ks$ ⇒ $y=y_f+(y_0'-y_f)e^{-t/\\tau}$ | first-order response; 63.2% after $\\tau$, 99.3% after $5\\tau$ | $\\tau$ time constant, $y_0'$ start value |\n\n## Applications\n\n| World | The measurement chain | What it tells you |\n|---|---|---|\n| 🌱 Plants & agriculture | leaf-clip thermistor: leaf temperature → $\\Delta R$ → divider voltage → ADC; its $\\tau$ of a few seconds must be shorter than a passing cloud | whether stomata are closed (a warm leaf is a thirsty leaf) |\n| 🧬 Biology & human health | PPG watch: blood volume → 1% less light → photocurrent → transimpedance volts → counts | heart rate and, with two colours, blood oxygen (A5) |\n| 🌍 Environment | weather-station humidity film: water uptake → $\\Delta C$ → frequency → counts; hysteresis of 1–2% RH matters | dew point, fog and frost warnings |\n| 🤖 Robotics & drones | force sensor in a gripper fingertip: force → strain → bridge → counts at 1 kHz | grip hard enough not to drop an egg, soft enough not to crush it |\n| 🚗 Cars | tyre-pressure sensor: pressure → membrane bending → $\\Delta R$ or $\\Delta C$ → ADC → radio | a warning before a slow leak becomes a blow-out |\n| 📱 Phones & photography | camera pixel: photons → electrons → voltage → 10–12-bit number; saturation = blown-out highlights | exposure; the \"transfer curve\" of a pixel is its photon transfer curve (A5) |\n| 🏠 Home & household | kitchen scale chain from Example 1 with tare (offset) and calibration (slope) | 250 g of flour, to 0.4 g |\n\n## Derivation\n\n**(a) Sensitivity of a chain is a product (chain rule).**\n1. Stage outputs: $u_1=f_1(s)$, $u_2=f_2(u_1)$, …, $y=f_n(u_{n-1})$.\n2. Chain rule: $\\dfrac{dy}{ds}=\\dfrac{dy}{du_{n-1}}\\cdots\\dfrac{du_2}{du_1}\\dfrac{du_1}{ds}$.\n3. Each factor is a stage gain $S_i$, so $S=\\prod_i S_i$, and the units cancel in a chain too: kg → strain → ΔR/R → V → V → counts.\n4. In decibels, gains multiply ⇒ dB add (A7).\n\n**(b) Linearisation around an operating point.**\n1. Taylor: $f(s_{\\text{op}}+\\Delta s)=f(s_{\\text{op}})+f'(s_{\\text{op}})\\Delta s+\\tfrac12 f''(s_{\\text{op}})\\Delta s^2+\\dots$\n2. Call $y_{\\text{op}}=f(s_{\\text{op}})$ and $S=f'(s_{\\text{op}})$: $\\Delta y=y-y_{\\text{op}}\\approx S\\,\\Delta s$.\n3. The first neglected term is $\\tfrac12 f''\\Delta s^2$: halve the step and the relative error halves.\n4. For $f=\\tanh$ at $u_{\\text{op}}=0.5$, $\\Delta u=0.1$: exact $\\Delta y=0.07493$, linear $0.07864$; the 5.0% gap is the curvature.\n\n**(c) Reading the sensor (inverse of the calibration line).**\n1. Calibration line: $y=y_0+S\\,s$.\n2. Solve for the stimulus: $s_{\\text{meas}}=(y-y_0)/S$.\n3. An error $\\delta y$ in the output becomes an error $\\delta y/S$ in the stimulus: high sensitivity shrinks the effect of output noise.\n\n**(d) The first-order lag.**\n1. Rule: the speed of approach is proportional to the remaining distance, $\\dot y=(Ks-y)/\\tau$.\n2. Put $z=y-Ks$ (for constant $s$): $\\dot z=-z/\\tau$.\n3. Separate and integrate: $z(t)=z(0)e^{-t/\\tau}$.\n4. Back to $y$: $y(t)=Ks+(y(0)-Ks)e^{-t/\\tau}$.\n5. Time to get within $\\delta$ of the end: $\\lvert z(0)\\rvert e^{-t/\\tau}=\\delta$ ⇒ $t=\\tau\\ln(\\lvert z(0)\\rvert/\\delta)$.\n6. Initial slope: $\\dot y(0)=(Ks-y(0))/\\tau$, the tangent at $t=0$ hits the final value exactly at $t=\\tau$.\n\n**(e) Precision from repeated readings.**\n1. Mean $\\bar s=\\frac1M\\sum s_i$; bias $=\\bar s-s$.\n2. Sample standard deviation $\\sqrt{\\frac{1}{M-1}\\sum (s_i-\\bar s)^2}$: the spread, independent of the bias.\n3. Averaging $M$ readings shrinks random scatter by $1/\\sqrt M$ (A8), but never shrinks the bias.\n\n## Worked check\n\n**The kitchen scale weighs 250 g of flour.** Offset with an empty pan: $y_0=1200$ counts.\n- Strain: $200\\times10^{-6}\\,\\text{/kg}\\times0.250$ kg $=50$ µε.\n- Resistance: $\\Delta R/R=\\mathrm{GF}\\cdot\\varepsilon=2\\times50$ µε $=100$ ppm.\n- Full bridge: $V_{\\text{out}}=V_{\\text{ex}}\\,\\Delta R/R=5\\times10^{-4}\\times5$ V $=0.500$ mV.\n- Amplifier: $128\\times0.500$ mV $=64.0$ mV.\n- ADC: $64.0$ mV $/\\,31.25$ µV $=2048$ counts above the offset, so $y=1200+2048=3248$ counts.\n- Reading back: $s_{\\text{meas}}=(3248-1200)/8192=0.2500$ kg $=250.0$ g ✓. The total sensitivity is\n  $2\\times10^{-4}\\cdot2\\cdot5\\cdot128\\cdot32000=8192$ counts/kg ✓.\n\n**The thermometer:** $\\tau=10$ s, from 22 °C to 37 °C. At $t=10$ s: $37-15e^{-1}=37-15(0.3679)=31.48$ °C ✓. Within 0.1 °C:\n$t=10\\ln150=50.1$ s ✓. All numbers come from `scripts/checks/A1_check.py`.\n\n## Whiteboard plan\n\n- **Panel 1 — the chain.** Draw five boxes in a row: *world → physical change → voltage → bigger voltage → number*. Under the\n  arrows write the kitchen-scale gains: 200 µε/kg, ×2, ×5 V, ×128, ×32 000/V. Say: \"Multiply along the arrows: 8192 counts per kilogram.\"\n- **Panel 2 — the transfer curve.** Axes $s$ and $y$. An S-shaped curve that flattens at the top. Mark $y_0$ on the $y$-axis,\n  draw the tangent at an operating point and label its slope $S$. Say: \"Near this point the curve *is* its tangent.\"\n- **Panel 3 — linearise.** Zoom on the tangent: a small triangle with sides $\\Delta s$ and $S\\Delta s$, and the red gap between\n  tangent and curve labelled $\\tfrac12f''\\Delta s^2$.\n- **Panel 4 — three targets.** Draw three dartboards: a tight cluster off-centre (precise, not accurate), a loose cloud around the\n  centre (accurate, not precise), and a tight cluster in the centre. Next to them a ruler with coarse ticks for \"resolution\".\n- **Panel 5 — the lag.** A step in $s$ (blue) and the exponential creep of $y$ (yellow). Mark $\\tau$ where the tangent at $t=0$ meets\n  the final value and write 63%, 95%, 99.3% at $\\tau,3\\tau,5\\tau$.\n- **Panel 6 — active vs passive.** A photodiode with an arrow \"light pays\" and a strain gauge with a battery \"my circuit pays\".\n\n## Common mistakes and where the intuition breaks\n\n- **Confusing resolution with accuracy.** A display with 0.001 °C digits can be 2 °C wrong. More digits only show more\n  noise unless the chain behind them is calibrated.\n- **Thinking one ADC count is the resolution.** If the noise is 3 counts rms, the real resolution is a few counts. See A8.\n- **Using the datasheet sensitivity outside the operating point.** $S$ is a *local* slope. Near saturation it can be ten\n  times smaller, and the linear formula then badly overestimates $\\Delta y$.\n- **Forgetting the offset.** Reading $s=y/S$ instead of $(y-y_0)/S$ is the \"scale shows 0.3 kg with nobody on it\" mistake.\n- **Reading a lagging sensor too early.** After one time constant you have only 63% of the change. Wait $5\\tau$, or model the lag.\n- **Ratiometric thinking for passive sensors.** A passive sensor's output scales with $V_{\\text{ex}}$. If the supply drifts by\n  1%, so does the reading, unless the ADC uses the same supply as its reference (A2, A7).\n- **Where the simple chain breaks:** stages are not always independent. The sensor can load the circuit (a thermistor heated by\n  its own measuring current, A2), the measurement can change the measurand (a hot-wire probe cooling the air it measures), and\n  the noise added at an *early* stage gets multiplied by every later gain. That is why the first amplifier matters most (A7).\n\n## Remember\n\n**\"Stimulus → physical change → voltage → number: multiply the gains, linearise around the operating point, and never confuse resolution, accuracy and precision.\"**\n\n## Self-test\n\n1. A pressure sensor gives 2 mV/kPa at the bridge, an amplifier multiplies by 100, and a 12-bit ADC uses $V_{\\text{ref}}=3.3$ V.\n   What is the sensitivity in counts per kPa, and how many kPa is one count?\n   <details><summary>Answer<\/summary>Amplified: 0.2 V/kPa. One LSB = 3.3/4096 = 0.806 mV, so 1/0.000806 = 1241 counts per volt. S = 0.2 × 1241 ≈ 248 counts/kPa, and one count ≈ 0.004 kPa = 4 Pa (if noise allows).<\/details>\n2. A humidity sensor has τ = 8 s. The humidity jumps from 40% to 60% RH. What does it read after 8 s and after 24 s?\n   <details><summary>Answer<\/summary>After τ: 40 + 20 × 0.632 = 52.6% RH. After 3τ: 40 + 20 × 0.950 = 59.0% RH.<\/details>\n3. Ten readings of a 100.0 g reference mass have a mean of 100.0 g but scatter by ±2 g. Is the scale accurate, precise, both or neither? What helps?\n   <details><summary>Answer<\/summary>Accurate (no bias) but not precise (large scatter). Averaging many readings, or lowering the noise in the electronics, helps; recalibration does not.<\/details>\n\n**Next:** [A2 Resistive sensors and the Wheatstone bridge](#A2) — the first link of the kitchen-scale chain, a 100 ppm change in resistance, and the bridge that turns it into half a millivolt.\n"}, {"id": "A2", "short": "Resistive sensors and the Wheatstone bridge", "title": "Resistive sensors and the Wheatstone bridge", "part": "A", "md": "# A2. Resistive sensors and the Wheatstone bridge\n\n> **Connects:** builds on [A1 What a sensor is](#A1) · used by [A3 Capacitive sensors](#A3), [A4 Piezoelectric, piezoresistive and magnetic sensors](#A4), [A7 Signal conditioning](#A7), [A8 Noise, resolution, calibration and drift](#A8), [B5 MEMS microphones, pressure sensors and actuators](#B5), [C2 Pressure-driven flow and hydraulic circuits](#C2)\n\n## Hook — a rubber band that gets thinner as you stretch it\n\nStretch a rubber band and watch it. It gets longer, and it also gets **thinner**. If the rubber band were a wire carrying\ncurrent, both changes would make it harder for electrons to get through: a longer path and a narrower road. Its resistance\nwould go up.\n\nGlue a very thin metal wire to a steel bar. Bend the bar a tiny bit, too little to see, and the wire stretches by\n0.04%. Its resistance rises by 0.08%, from 120 Ω to 120.09 Ω. That is the whole trick behind bathroom scales, kitchen\nscales, crane load meters, bridge monitors and the force sensors in robot wrists. The same idea works with heat instead\nof force: the resistance of platinum rises as it warms, and a thermistor's resistance falls steeply. The same idea also\nworks with light, because a photoresistor's resistance drops in the sun.\n\n**The problem is size.** A 0.08% change on top of 120 Ω is like hearing someone whisper in a stadium. The **Wheatstone\nbridge** solves it by *comparing* instead of measuring. Two identical voltage dividers sit side by side, and you look\nonly at the *difference* between them. When nothing happens the difference is exactly zero, and a tiny change stands\nout against that zero.\n\n## The idea in plain words\n\n**Resistance depends on material and shape.** A conductor of length $L$, cross-section area $A$ and **resistivity**\n$\\rho$ (a material property in Ω·m: copper $1.68\\times10^{-8}$, constantan $4.9\\times10^{-7}$) has\n$$R=\\rho\\,\\frac{L}{A}.$$\nLonger means more resistance, and fatter means less. A sensor can change $R$ in three ways: by changing $L$, by changing\n$A$, or by changing $\\rho$ itself (with temperature, light or stress).\n\n**Strain gauges: stretch changes $L$, $A$ and $\\rho$.** **Strain** $\\varepsilon=\\Delta L/L$ is the fractional stretch, and it\nis usually tiny: 1000 µε (microstrain) means 0.1%. When a wire stretches by $\\varepsilon$, its length grows by\n$(1+\\varepsilon)$. Its width and thickness each shrink by $(1-\\nu_P\\varepsilon)$, where **Poisson's ratio** $\\nu_P\\approx0.3$ for\nmetals says how much a material narrows when pulled. The area shrinks by about $(1-2\\nu_P\\varepsilon)$. Together,\n$$\\frac{\\Delta R}{R}=(1+2\\nu_P)\\,\\varepsilon+\\frac{\\Delta\\rho}{\\rho}=\\mathrm{GF}\\cdot\\varepsilon .$$\nThe number $\\mathrm{GF}$ is the **gauge factor**. Geometry alone gives $1+2\\nu_P=1.6$. In metal foils the resistivity also\nrises a little when stretched (the **piezoresistive** effect), which brings constantan to $\\mathrm{GF}\\approx2$. In doped\nsilicon the piezoresistive part is huge and $\\mathrm{GF}$ reaches 100 or more (A4, B5).\n\nA real foil gauge is a **serpentine**: a thin metal track that runs back and forth a dozen times on a plastic film. This\npacks a long $L$ (high $R$, typically 120 Ω or 350 Ω) into a few millimetres. It also makes the gauge sensitive *along*\nthe strands and almost blind *across* them. Glue it where the strain is largest, at the surface near the clamped root of a\nbending beam. Load the beam below and watch the strain colour and the resistance.\n\n```viz\na2-strain-gauge-3d\n```\n\n**Temperature changes $\\rho$: RTDs and thermistors.** In a metal, warmer atoms vibrate more and scatter electrons more, so\n$\\rho$ rises nearly linearly with temperature. A **resistance temperature detector (RTD)** made of platinum follows\n$$R=R_0(1+\\alpha\\,\\Delta T),$$\nwhere $\\alpha=0.00385$ /K for standard platinum and $R_0=100$ Ω at 0 °C (a \"Pt100\"). It is accurate, stable and linear, but its\nchange is small: 0.385 Ω per kelvin. A **thermistor** is a ceramic semiconductor bead. Heat frees more charge carriers, so an\n**NTC** (negative temperature coefficient) thermistor's resistance falls steeply:\n$$R=R_0\\,e^{\\beta(1/T-1/T_0)},$$\nwith $T$ in kelvin, $R_0$ the resistance at $T_0=298.15$ K (25 °C) and $\\beta$ typically 3000–4500 K. Its local coefficient\n$\\frac{1}{R}\\frac{dR}{dT}=-\\beta/T^2$ is about −4.4%/K, more than ten times the platinum value. The price is that it is\nstrongly nonlinear. Compare the two in the R–T figure further down.\n\n**Light changes $\\rho$: photoresistors.** In a cadmium-sulphide **photoresistor** (LDR), photons free electrons, so the\nresistance drops with illuminance, roughly as a power law $R\\propto E_v^{-\\gamma}$ with $\\gamma\\approx0.7$ ($E_v$ in lux is\nlocal to this note). LDRs are cheap and slow (tens of milliseconds) and are used in night lights and street lamps. Fast and\nprecise light sensing uses photodiodes (A5).\n\n**From resistance to voltage: the divider.** A passive sensor needs an **excitation** (A1). The simplest circuit puts the sensor\n$R_s$ in series with a fixed resistor $R_f$ across a supply $V_{\\text{ex}}$. The voltage across the sensor is\n$$V=V_{\\text{ex}}\\frac{R_s}{R_s+R_f}.$$\nThis is a **voltage divider**. Its sensitivity $dV/dR_s=V_{\\text{ex}}R_f/(R_s+R_f)^2$ is largest when $R_f=R_s$, where it equals\n$V_{\\text{ex}}/(4R_s)$. The divider has one big flaw: at rest it already outputs $V_{\\text{ex}}/2$, and the signal is a tiny\nwiggle on top of that large constant voltage.\n\n**The Wheatstone bridge: two dividers, one difference.** Build a second, identical divider next to the first and measure\nthe voltage *between* their midpoints:\n$$V_{\\text{out}}=V_{\\text{ex}}\\left(\\frac{R_2}{R_1+R_2}-\\frac{R_4}{R_3+R_4}\\right).$$\nIf $R_1/R_2=R_3/R_4$ the bridge is **balanced** and $V_{\\text{out}}=0$ exactly, whatever $V_{\\text{ex}}$ is. Now let one arm\nchange by $\\Delta R$. For small changes,\n$$V_{\\text{out}}\\approx\\frac{V_{\\text{ex}}}{4}\\,\\frac{\\Delta R}{R}\\qquad\\text{(quarter bridge).}$$\nYou can get more by putting more gauges to work. In a **half bridge**, two gauges sit in the same divider, one stretched\n(top of the beam, $+\\Delta R$) and one compressed (bottom, $-\\Delta R$). This doubles the output and makes it exactly\nlinear: $V_{\\text{out}}=\\frac{V_{\\text{ex}}}{2}\\frac{\\Delta R}{R}$. In a **full bridge**, all four arms are active, giving\n$V_{\\text{out}}=V_{\\text{ex}}\\frac{\\Delta R}{R}$, four times the quarter bridge, again exactly linear. Kitchen and bathroom\nscales use full bridges (A1). Build each one in the live circuit below, and step through the derivation.\n\n```viz\na2-bridge\n```\n\n**Why the bridge also fixes temperature.** A strain gauge is also a (bad) thermometer. When the bar warms up, the gauge's\nresistance and the bar's length both change, and the gauge reports an **apparent strain** even though nothing is loaded.\nIn a half or full bridge, every gauge sees the same temperature, so the drift appears equally in both arms of each divider\nand cancels in the difference. The load, by contrast, stretches one gauge and squeezes the other, so it adds. **Divide to\ncompare** is a thread through the whole notebook: differential capacitors (A3), differential accelerometers (B4) and\ntwo-colour pulse oximetry (A5) all use it.\n\n**Self-heating: the measurement disturbs the measurand.** The current that reads a thermistor also heats it, with power\n$P=I^2R$. The bead warms above its surroundings by $P/\\delta$, where $\\delta$ is the **dissipation constant** (in mW/K,\nlocal to this note; about 1–3 mW/K for a small bead in still air). Use a small excitation, pulse it briefly, or put the bead\nwhere it is well cooled.\n\n```viz\na2-rt-curves\n```\n\n## Intuitive examples\n\n1. **Why foil gauges use constantan.** A track 5 µm thick and 20 µm wide ($A=1.0\\times10^{-10}$ m²) needs 24.49 mm of\n   constantan to reach 120 Ω, so 12 strands of 2.04 mm fit on a stamp-sized film. The same track in copper would be only\n   4.11 Ω, and copper's resistance also changes by 0.39% per kelvin. Constantan was chosen for a temperature coefficient\n   close to zero.\n2. **Geometry gives 1.6, the metal gives the rest.** Stretch a wire by 1000 µε with $\\nu_P=0.30$: the length grows by\n   1.001 and the area shrinks to 0.999400 of its value, so $R$ grows by 1.001601, i.e. $\\Delta R/R=1.6\\times10^{-3}$ from\n   shape alone. Constantan's measured $\\mathrm{GF}\\approx2.05$, so about 0.45 comes from the resistivity change.\n3. **A bending steel ruler.** A steel beam ($E=200$ GPa) 20 mm wide and 2 mm thick, loaded with 10 N at 100 mm from the\n   gauge, has surface stress $\\sigma=6Fx/(wt^2)=75.0$ MPa and strain $\\varepsilon=\\sigma/E=375$ µε. A 120 Ω gauge with\n   $\\mathrm{GF}=2$ changes by 750 ppm, i.e. 0.090 Ω. At $V_{\\text{ex}}=5$ V a quarter bridge gives 0.9371 mV, a half bridge\n   1.8750 mV and a full bridge 3.7500 mV.\n4. **Platinum vs thermistor.** A Pt100 reads 100.000 Ω at 0 °C, 114.245 Ω at 37 °C and 138.500 Ω at 100 °C (0.385 Ω/K;\n   with 1 mA that is 0.385 mV/K). A 10 kΩ NTC with $\\beta=3950$ K reads 33 621 Ω at 0 °C, 10 000 Ω at 25 °C and 5989 Ω at\n   37 °C. Its local coefficient at 25 °C is −4.44%/K, 11.5 times larger than platinum's 0.385%/K.\n5. **A leaf thermometer.** Put that NTC in a 10k/10k divider at 3.3 V on a leaf clip. Near 25 °C the output moves\n   36.7 mV/K, so a 0.1 K warming of the leaf gives 3.67 mV. A 12-bit ADC (0.806 mV per count) resolves 22 mK per count.\n6. **A night light.** An LDR of 10 kΩ at 10 lux ($\\gamma=0.7$) drops to 1995 Ω at 100 lux and 398 Ω at 1000 lux. As the\n   lower arm of a divider with 10 kΩ on top at 3.3 V, it outputs 1.650 V, 0.549 V and 0.126 V. The light switches on below\n   a threshold voltage.\n7. **Self-heating.** In that 10k/10k divider at 3.3 V the thermistor carries 0.165 mA and dissipates 0.272 mW. At\n   $\\delta=2$ mW/K it runs 0.136 K warm, which is more than the 0.1 K you wanted to see on the leaf! At 1.0 V excitation\n   the heating is 25.0 µW and the error only 12.5 mK.\n8. **Temperature compensation.** Suppose a gauge has a thermal output of 20 ppm/K. A 5 K warm-up then gives 100 ppm, an\n   apparent strain of 50 µε, which is 13% of the 375 µε signal. In a quarter bridge the reading jumps from 0.9371 to\n   1.0620 mV. In a half bridge where both gauges warm equally, it goes from 1.8750 to 1.8748 mV: the drift has cancelled.\n\n## The key equations\n\n| Equation | Meaning | Symbols |\n|---|---|---|\n| $R=\\rho L/A$ | resistance from material and shape | $\\rho$ resistivity, $L$ length, $A$ area |\n| $\\dfrac{\\Delta R}{R}=(1+2\\nu_P)\\varepsilon+\\dfrac{\\Delta\\rho}{\\rho}=\\mathrm{GF}\\,\\varepsilon$ | strain gauge: geometry + piezoresistance | $\\varepsilon$ strain, $\\nu_P$ Poisson, $\\mathrm{GF}$ gauge factor |\n| $\\sigma=\\dfrac{6Fx}{wt^2}$, $\\varepsilon=\\sigma/E$ | surface strain of a rectangular beam, load $F$ at distance $x$ | $w$ width, $t$ thickness, $E$ Young's modulus |\n| $R=R_0(1+\\alpha\\,\\Delta T)$ | RTD (platinum, $\\alpha=0.00385$/K) | $R_0$ at 0 °C |\n| $R=R_0e^{\\beta(1/T-1/T_0)}$, $\\tfrac1R\\tfrac{dR}{dT}=-\\beta/T^2$ | NTC thermistor | $T$ in kelvin, $\\beta$ in K |\n| $V=V_{\\text{ex}}\\dfrac{R_s}{R_s+R_f}$; best $R_f=R_s$ | voltage divider | $R_s$ sensor, $R_f$ fixed |\n| $V_{\\text{out}}=V_{\\text{ex}}\\Big(\\dfrac{R_2}{R_1+R_2}-\\dfrac{R_4}{R_3+R_4}\\Big)$ | Wheatstone bridge; zero when $R_1/R_2=R_3/R_4$ | |\n| $V_{\\text{out}}\\approx\\tfrac{V_{\\text{ex}}}{4}\\tfrac{\\Delta R}{R}$, $\\tfrac{V_{\\text{ex}}}{2}\\tfrac{\\Delta R}{R}$, $V_{\\text{ex}}\\tfrac{\\Delta R}{R}$ | quarter, half, full bridge | |\n| $\\Delta T_{\\text{self}}=I^2R/\\delta$ | self-heating error | $\\delta$ d
