.\n- **Averaging fixes everything.** Averaging $M$ readings shrinks random electronic noise by $1/\\sqrt M$ (A8), but not\n  strip-to-strip differences, which must be calibrated with batch codes and controls.\n- **Matrix effects.** Real samples are not buffer. Red-cell fraction changes the diffusion in a glucose strip, proteins foul\n  electrodes, high salt screens charge sensors (C4), and PDMS soaks up drug molecules in organ-chips.\n- **Bubbles.** One trapped bubble blocks a channel (Laplace pressure, C4) or insulates an electrode.\n- **Poisson counts have Poisson noise.** Counting $N$ events (cells, droplets) has a relative error of about $1/\\sqrt N$, so\n  10,000 counted cells give about ±1%.\n\n## Remember\n\n**\"A chip is the A1 chain with plumbing in front: each stage has a time, a gain and a noise, and the weakest stage, often\ngetting molecules to the sensor, sets the limit of detection.\"**\n\n## Self-test\n\n1. A chip analyses 5 µL of water. What is the lowest bacterial concentration it can detect with 95% confidence, whatever its electronics?\n   <details><summary>Answer<\/summary>It needs c V of at least 3, so c = 3 / 5 µL = 0.6 per µL = 600 per mL. Anything rarer must be concentrated first (for example by filtering a large volume).<\/details>\n2. In the glucose strip, someone raises the feedback resistor to 1 MΩ \"for more signal\". What happens at 5 mM?\n   <details><summary>Answer<\/summary>V = 6.30 µA x 1 MΩ = 6.30 V, above the 3.3 V reference, so the amplifier and ADC clip. The highest readable concentration becomes 3.3 / (1.26 µA/mM x 1 MΩ) = 2.62 mM, below the normal range. The LOD does not improve, because the blank noise dominates.<\/details>\n3. A Coulter aperture is narrowed from 50 µm to 25 µm (same length). How do the red-cell pulse and the aperture resistance change?\n   <details><summary>Answer<\/summary>The pulse scales as 1/D^4, so it is 16 times larger (about 375 Ω). The resistance scales as 1/D^2, so it is 4 times larger (about 81.9 kΩ). The relative pulse grows 4 times, but the aperture clogs more easily and needs more pressure.<\/details>\n\n**Next:** [Back to the storyline](#home): you have now followed every arrow of the map. Pick any device in the story (a leaf clip, a drone gyroscope, a test strip) and trace its chain from stimulus to trusted number.\n"}], "parts": {"A": "Electronic sensors & signals", "B": "MEMS: micro-electro-mechanical systems", "C": "Microfluidics & lab-on-a-chip"}, "graph": {"nodes": [{"id": "A1", "title": "What a sensor is: transduction and the measurement chain", "part": "A"}, {"id": "A2", "title": "Resistive sensors and the Wheatstone bridge", "part": "A"}, {"id": "A3", "title": "Capacitive sensors", "part": "A"}, {"id": "A4", "title": "Piezoelectric, piezoresistive and magnetic sensors", "part": "A"}, {"id": "A5", "title": "Optical sensors: photodiodes, image sensors and LiDAR", "part": "A"}, {"id": "A6", "title": "Electrochemical sensors and biosensors", "part": "A"}, {"id": "A7", "title": "Signal conditioning: amplifiers, filters and ADCs", "part": "A"}, {"id": "A8", "title": "Noise, resolution, calibration and drift", "part": "A"}, {"id": "A9", "title": "Sensor fusion and the Kalman filter", "part": "A"}, {"id": "B1", "title": "Scaling laws: why small is different", "part": "B"}, {"id": "B2", "title": "Microfabrication: lithography, etching, deposition", "part": "B"}, {"id": "B3", "title": "Micromechanics: beams, springs and resonators", "part": "B"}, {"id": "B4", "title": "MEMS inertial sensors: accelerometers and gyroscopes", "part": "B"}, {"id": "B5", "title": "MEMS microphones, pressure sensors and actuators", "part": "B"}, {"id": "C1", "title": "Fluids at the microscale: Reynolds number and laminar flow", "part": "C"}, {"id": "C2", "title": "Pressure-driven flow and hydraulic circuits", "part": "C"}, {"id": "C3", "title": "Diffusion, mixing and the Péclet number", "part": "C"}, {"id": "C4", "title": "Surface tension, capillarity, droplets and electrokinetics", "part": "C"}, {"id": "C5", "title": "Lab-on-a-chip, organ-on-chip and integrated sensing systems", "part": "C"}], "edges": [["A1", "A2"], ["A1", "A3"], ["A2", "A3"], ["A1", "A4"], ["A2", "A4"], ["A3", "A4"], ["A1", "A5"], ["A3", "A5"], ["A1", "A6"], ["A3", "A6"], ["A1", "A7"], ["A2", "A7"], ["A1", "A8"], ["A7", "A8"], ["A7", "A9"], ["A8", "A9"], ["A3", "B1"], ["A8", "B1"], ["B1", "B2"], ["B1", "B3"], ["B2", "B3"], ["A2", "B3"], ["A8", "B3"], ["B3", "B4"], ["A3", "B4"], ["A8", "B4"], ["B1", "B4"], ["B3", "B5"], ["A2", "B5"], ["A3", "B5"], ["A4", "B5"], ["B4", "B5"], ["B1", "C1"], ["C1", "C2"], ["A2", "C2"], ["A7", "C2"], ["C1", "C3"], ["C2", "C3"], ["A8", "C3"], ["B1", "C3"], ["B1", "C4"], ["A3", "C4"], ["C1", "C4"], ["C2", "C4"], ["C3", "C4"], ["A1", "C5"], ["A3", "C5"], ["A5", "C5"], ["A6", "C5"], ["A7", "C5"], ["A8", "C5"], ["B1", "C5"], ["B2", "C5"], ["B3", "C5"], ["C1", "C5"], ["C2", "C5"], ["C3", "C5"], ["C4", "C5"]]}};
const pages = DATA.pages;
const byId = Object.fromEntries(pages.map(p => [p.id, p]));
const partColor = { A: "var(--part-a)", B: "var(--part-b)", C: "var(--part-c)" };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let known = store.get("sf-known") || {};

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// Pull math and code out before Markdown sees them, then put math back for MathJax.
function renderMarkdown(md) {
  const code = [], math = [];
  md = md.replace(/```[\s\S]*?```/g, m => `CODEBLK${code.push(m) - 1}X`);
  md = md.replace(/\\\$/g, "DOLLARSIGNX");
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => `MATHDISP${math.push({ t, d: true }) - 1}X`);
  md = md.replace(/\$((?:[^$\\\n]|\\.|\n(?!\s*\n))+?)\$/g, (m, t) => `MATHINL${math.push({ t, d: false }) - 1}X`);
  md = md.replace(/CODEBLK(\d+)X/g, (m, i) => code[+i]);
  let html = marked.parse(md, { gfm: true });
  html = html.replace(/MATH(DISP|INL)(\d+)X/g, (m, k, i) => {
    const t = esc(math[+i].t);
    return math[+i].d ? `<span class="disp">\\[${t}\\]</span>` : `\\(${t}\\)`;
  });
  return html.replace(/DOLLARSIGNX/g, "$");
}

const SECTION_KINDS = [
  ["hook", "sec-hook"], ["the key equations", "sec-key"], ["derivation", "sec-deriv"], ["worked check", "sec-check"],
  ["whiteboard", "sec-board"], ["common mistakes", "sec-warn"], ["self-test", "sec-test"], ["remember", "sec-remember"]
];

function sectionize(root) {
  const kids = [...root.childNodes];
  let current = null;
  for (const node of kids) {
    if (node.nodeName === "H2") {
      const text = node.textContent.toLowerCase();
      const kind = (SECTION_KINDS.find(([k]) => text.startsWith(k)) || [, ""])[1];
      current = document.createElement("section");
      current.className = "sec " + kind;
      root.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  }
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "tablewrap";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
}

function typesetSheet() {
  if (window.__mjReady && MathJax.typesetPromise) {
    const el = document.getElementById("sheet");
    MathJax.typesetClear([el]);
    MathJax.typesetPromise([el]).catch(err => console.warn(err));
  }
}

function buildNav() {
  const toc = document.getElementById("toc");
  const jump = document.getElementById("jump");
  const groups = [["", "Overview"], ...Object.entries(DATA.parts)];
  toc.innerHTML = groups.map(([part, label]) => {
    const items = pages.filter(p => p.part === part).map(p =>
      `<li><a href="#${p.id}" data-id="${p.id}" style="--pc:${partColor[p.part] || "var(--muted)"}">` +
      `<span class="id">${p.part ? p.id : "·"}</span><span>${esc(p.short)}</span><span class="tick">${known[p.id] ? "✓" : ""}</span></a></li>`).join("");
    return `<div><h3>${part ? "Part " + part + " · " : ""}${esc(label)}</h3><ol>${items}</ol></div>`;
  }).join("");
  jump.innerHTML = groups.map(([part, label]) =>
    `<optgroup label="${part ? "Part " + part + " — " : ""}${esc(label)}">` +
    pages.filter(p => p.part === part).map(p => `<option value="${p.id}">${p.part ? p.id + " " : ""}${esc(p.short)}</option>`).join("") +
    `</optgroup>`).join("");
  jump.addEventListener("change", () => { location.hash = jump.value; });
}

function show(id) {
  const page = byId[id] || byId.home;
  const sheet = document.getElementById("sheet");
  const pc = partColor[page.part] || "var(--accent)";
  sheet.style.setProperty("--pc", pc);
  let md = page.md;
  let head = "";
  if (page.part) {
    md = md.replace(/^#\s.*\n/, "");
    head = `<div class="crumb">Part ${page.part} · ${esc(DATA.parts[page.part])}</div>` +
      `<h1><span class="num">${page.id}</span>${esc(page.short)}</h1>` +
      `<label class="known"><input type="checkbox" id="known-${page.id}" ${known[page.id] ? "checked" : ""}> I can explain this without notes</label>`;
  }
  sheet.innerHTML = head + `<div class="body">${renderMarkdown(md)}</div>`;
  sectionize(sheet.querySelector(".body"));
  if (window.VIZ) { VIZ.fits(sheet, { page, graph: DATA.graph }); VIZ.mount(sheet, { page, graph: DATA.graph }); }
  const i = pages.indexOf(page), prev = pages[i - 1], next = pages[i + 1];
  sheet.insertAdjacentHTML("beforeend", `<nav class="pager">` +
    (prev ? `<a href="#${prev.id}"><small>Previous</small>${prev.part ? prev.id + " " : ""}${esc(prev.short)}</a>` : "") +
    (next ? `<a class="next" href="#${next.id}"><small>Next</small>${next.part ? next.id + " " : ""}${esc(next.short)}</a>` : "") + `</nav>`);
  const box = document.getElementById("known-" + page.id);
  if (box) box.addEventListener("change", () => { known[page.id] = box.checked; store.set("sf-known", known); buildNav(); markCurrent(page.id); });
  markCurrent(page.id);
  document.title = page.part ? `${page.id} ${page.short} · Sensor Foundations Notebook` : "Sensor Foundations Notebook";
  store.set("sf-last", page.id);
  window.scrollTo(0, 0);
  typesetSheet();
}

function markCurrent(id) {
  document.querySelectorAll(".rail a").forEach(a => { if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const jump = document.getElementById("jump"); if (jump) jump.value = id;
}

buildNav();
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || store.get("sf-last") || "home");
</script>
