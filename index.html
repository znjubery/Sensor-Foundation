        const from = stageB; stageA = from; stageB = k;

        readout();

      ui.slider("soft iron", 0, 1.5, 0.1, soft, (v) => { soft = v; makeData(); sc3.render(); readout(); return "×" + fmt(v, 1); });
      const map = [0, 0, 1, 2, 3, 4];
      ui.steps([
        "Raw readings: \\( \\mathbf m = A_{\\text{si}}\\,\\mathbf B_E + \\mathbf m_0 \\). The true field \\( \\mathbf B_E \\) (length 50 µT) lies on a sphere; the soft-iron matrix \\( A_{\\text{si}} \\) squashes and tilts it, the hard-iron offset \\( \\mathbf m_0 \\) shifts it. The lengths swing from about 19 to 81 µT.",
        "Fit a quadric \\( \\mathbf m^{\\mathsf T}\\mathsf Q\\,\\mathbf m + 2\\,\\mathbf d^{\\mathsf T}\\mathbf m = 1 \\) to all points by least squares. It is <i>linear</i> in its 9 unknowns (6 in the symmetric \\( \\mathsf Q \\), 3 in \\( \\mathbf d \\)), just like fitting a line. Its centre is \\( \\mathbf m_0 = -\\mathsf Q^{-1}\\mathbf d \\) (red arrow).",

  register("a9-kalman", {

    links: [

    build(fig, ui) {

        let bias = 0.15;
        for (let i = 0; i <= N; i++) {
          const t = i * dt; T.push(htrue(t));
          Z.push(T[i] + sv * zn[i]);
          bias += 0.005 * bn[i];
          U.push((htrue(t + 0.05) - htrue(t - 0.05)) / 0.1 + bias + 0.3 * un[i]);
        }
        let xh = Z[0], p = sv * sv, dr = Z[0];
        XM.push(xh); PM.push(p); KK.push(1); XH.push(xh); P.push(p); DR.push(dr);
        for (let i = 1; i <= N; i++) {
          const xm = xh + U[i - 1] * dt, pm = p + sw * sw, K = pm / (pm + sv * sv);
          xh = xm + K * (Z[i] - xm); p = (1 - K) * pm; dr += U[i - 1] * dt;
          XM.push(xm); PM.push(pm); KK.push(K); XH.push(xh); P.push(p); DR.push(dr);
        }
        F = { T, Z, U, DR, XM, PM, KK, XH, P };
      }
      const main = chart(ui.body, { w: 640, h: 240, xr: [0, N * dt], yr: [-8, 30], xlabel: "time (s)", ylabel: "altitude (m)" });
      const band = main.area(C.green, 0.22), lT = main.line(C.blue, 2, "6 4"), lDR = main.line(C.red, 2, "4 3"), lX = main.line(C.green, 2.6);
      const gZ = S("g", {}, main.gMain), vNow = main.vline(C.white, "2 3");
      const holder = H("div", {}, ui.body);
      function draw() {
        const t = (i) => i * dt;
        lT.set(F.T.map((v, i) => [t(i), v]));
        lDR.set(F.DR.slice(0, k + 1).map((v, i) => [t(i), v]));
        const upto = ph ? k : k - 1;
        lX.set(F.XH.slice(0, upto + 1).map((v, i) => [t(i), v]));
        band.set(F.XH.slice(0, upto + 1).map((v, i) => [t(i), v - Math.sqrt(F.P[i])]), F.XH.slice(0, upto + 1).map((v, i) => [t(i), v + Math.sqrt(F.P[i])]));
        gZ.innerHTML = "";
        for (let i = 0; i <= (ph ? k : k - 1); i++) S("circle", { cx: main.X(t(i)), cy: main.Y(F.Z[i]), r: 1.8, fill: C.yellow, "fill-opacity": 0.75 }, gZ);
        vNow.set(t(k));
        // zoom on the last 2 s
        holder.innerHTML = "";
        const t0 = t(k) - 2, t1 = t(k) + 0.75, yc = F.T[k], hr = 2.6 * sv + 1.2;
        const zc = chart(holder, { w: 640, h: 190, xr: [t0, t1], yr: [yc - hr, yc + hr], xlabel: "time (s), zoom", ylabel: "altitude (m)", mt: 10 });
        const bar = (x, y, s, col, w) => { zc.line(col, w || 2).set([[x, y - s], [x, y + s]]); };
        zc.line(C.blue, 2, "6 4").set(F.T.map((v, i) => [t(i), v]).filter(([x]) => x >= t0 - 0.2 && x <= t1 + 0.2));
        for (let i = Math.max(0, k - 21); i < k; i++) { zc.dot(C.yellow, 3).set(t(i), F.Z[i]); zc.dot(C.green, 3.5).set(t(i), F.XH[i]); }
        zc.line(C.green, 2).set(F.XH.slice(Math.max(0, k - 21), k).map((v, j) => [t(Math.max(0, k - 21) + j), v]));
        const xprev = F.XH[k - 1], xm = F.XM[k], pm = F.PM[k], K = F.KK[k];

        zc.line(C.purple, 2.2, "5 3").set([[t(k - 1), xprev], [t(k), xm]]);

  // ── a9-drone-3d: GPS + IMU fusion in 3D with an uncertainty ellipsoid ──────────────────────────────────
  register("a9-drone-3d", {
    title: "3D · a drone fuses 1 Hz GPS with a 20 Hz IMU: the 2σ uncertainty ellipsoid breathes",
    target: "See how a Kalman filter blends a slow, noisy but drift-free sensor (GPS) with a fast but drifting one (accelerometer): the uncertainty grows between fixes, shrinks at each fix, and balloons during a GPS outage.",
    caption: "<span style='color:" + C.blue + "'>blue</span>: the true flight path over a field; <span style='color:" + C.red + "'>red</span>: the last GPS fixes (σ horizontal, 1.5σ vertical); <span style='color:" + C.green + "'>green</span>: the fused trail and the 2σ ellipsoid around the current estimate. The ellipsoid is taller than wide because GPS is worse vertically. Press <b>GPS outage</b> (t = 15–27 s, e.g. under a bridge or trees): the filter coasts on the accelerometer and its ellipsoid grows like t², then snaps back at the first fix.",
    links: [
      { id: "B4", why: "the MEMS accelerometer and gyro inside the IMU" },
      { id: "A8", why: "accelerometer bias is the drift that GPS keeps correcting" },
      { id: "B3", why: "the predict step is Newton's law, the same model as a mass–spring" },

    build(fig, ui) {
      let sg = 3, outage = false, paused = false, tView = 22;
      const dt = 0.05, T = 40, NS = Math.round((2 * T) / dt), om = (2 * Math.PI) / T;

      const vel = (t) => [22 * om * Math.cos(om * t), 28 * om * Math.cos(2 * om * t), 4 * om * Math.cos(om * t + 1)];

      for (let i = 0; i <= 2 * T + 1; i++) gn.push([gauss(r), gauss(r), gauss(r)]);
      const bias = [0.06, -0.05, 0.04], sa = 0.3;

        const X = [], Sd = [], G = [], DR = [];
        const st = [0, 1, 2].map((a) => ({ x: pos(0)[a], v: vel(0)[a], p00: 4, p01: 0, p11: 1 }));
        const dr = [0, 1, 2].map((a) => ({ x: pos(0)[a], v: vel(0)[a] }));

            s.p00 += 2 * dt * s.p01 + dt * dt * s.p11 + q * dt ** 4 / 4; s.p01 += dt * s.p11 + q * dt ** 3 / 2; s.p11 += q * dt * dt;
            dr[a].x += dr[a].v * dt + 0.5 * u * dt * dt; dr[a].v += u * dt;

          if (i % 20 === 0 && gpsOn) {
            const k = i / 20, tp = pos(t), fix = [0, 1, 2].map((a) => tp[a] + (a === 2 ? 1.5 * sg : sg) * gn[k][a]);
            G.push({ i, p: fix });
            for (let a = 0; a < 3; a++) {
              const s = st[a], R = (a === 2 ? 1.5 * sg : sg) ** 2, Sx = s.p00 + R, K0 = s.p00 / Sx, K1 = s.p01 / Sx, y = fix[a] - s.x;
              s.x += K0 * y; s.v += K1 * y; const p00 = s.p00, p01 = s.p01; s.p00 = (1 - K0) * p00; s.p01 = (1 - K0) * p01; s.p11 -= K1 * p01;

      const field = mix(C.green, C.bg, 0.72);
      const sc = scene3d(ui.body, {
        w: 640, h: 430, scale: 11, yaw: -0.55, pitch: 0.45, center: [0, 0, 9], dist: 140, animate: !VIZ.reduceMotion,
        draw(g, tt) {

          g.grid(0, [-28, 28], [-20, 20], 4, field);
          // true path
          const tp = []; for (let k = 0; k <= 100; k++) tp.push(pos((T * k) / 100));
          g.polyline(tp, mix(C.blue, C.bg, 0.35), 1.6);
          // GPS fixes from the last 12 s
          sim.G.filter((f) => f.i <= i && f.i > i - 12 / dt).forEach((f) => { const age = (i - f.i) * dt / 12; g.sphere(f.p, 0.42, mix(C.red, C.bg, 0.65 * age)); });
          // fused trail (8 s)
          const tr = []; for (let k = Math.max(0, i - 160); k <= i; k += 2) tr.push(sim.X[k]); g.polyline(tr, C.green, 2.4);
          // drone at the true position
          const p = pos(t), v = vel(t), hd = Math.atan2(v[1], v[0]);
          const rot = (dx, dy) => [p[0] + dx * Math.cos(hd) - dy * Math.sin(hd), p[1] + dx * Math.sin(hd) + dy * Math.cos(hd)];
          g.line([p[0], p[1], 0.02], [p[0], p[1], p[2] - 0.5], C.dim, 1, [3, 4]);
          const sh = []; for (let k = 0; k < 12; k++) { const a = (2 * Math.PI * k) / 12; sh.push([p[0] + 1.6 * Math.cos(a), p[1] + 1.6 * Math.sin(a), 0.03]); } g.poly(sh, "#05070a", { alpha: 0.6, shade: false });
          g.box([p[0] - 0.7, p[1] - 0.7, p[2] - 0.25], [p[0] + 0.7, p[1] + 0.7, p[2] + 0.25], C.purple);
          [[1, 1], [1, -1], [-1, 1], [-1, -1]].forEach(([a, b]) => {
            const [rx, ry] = rot(1.6 * a, 1.6 * b); g.line([p[0], p[1], p[2]], [rx, ry, p[2] + 0.2], C.silicon, 3);
            const disc = []; for (let k = 0; k < 10; k++) { const an2 = (2 * Math.PI * k) / 10; disc.push([rx + 0.9 * Math.cos(an2), ry + 0.9 * Math.sin(an2), p[2] + 0.3]); }
            g.poly(disc, C.purple, { alpha: 0.35, shade: false, stroke: C.purple });
          });

            [0, 2 * Math.PI, 16], [0, Math.PI, 9], () => C.green, { alpha: 0.2, stroke: C.green, strokeAlpha: 0.35, strokeWidth: 0.6 });
          const tm = t % T, off = outage && tm >= 15 && tm < 27;
          g.text([e[0], e[1], e[2] + 2 * sd[2] + 1.6], off ? "GPS lost: coasting on the IMU" : "2σ ellipsoid", off ? C.red : C.green, 12.5);
          if (Math.floor(tt * 4) % 2 === 0 || paused || VIZ.reduceMotion) readout(t, i);
        },
      });
      function readout(t, i) {
        const e = sim.X[i], sd = sim.Sd[i], p = pos(t), err = Math.hypot(e[0] - p[0], e[1] - p[1], e[2] - p[2]);
        const tm = t % T, off = outage && tm >= 15 && tm < 27;
        const de = sim.DR[i], dErr = Math.hypot(de[0] - p[0], de[1] - p[1], de[2] - p[2]);
        ui.read.innerHTML = `t = ${fmt(tm, 1)} s · GPS ${off ? `<b style="color:${C.red}">lost</b>` : `σ = ${fmt(sg, 1)} m (vertical ${fmt(1.5 * sg, 1)} m)`} · ` +
          `fused σ: x ${fmt(sd[0], 2)}, y ${fmt(sd[1], 2)}, z ${fmt(sd[2], 2)} m · <b style="color:${C.green}">fused error ${fmt(err, 2)} m</b> · IMU alone (since launch) ${fmt(dErr, 0)} m off`;
      }
      ui.slider("GPS σ", 1, 6, 0.5, sg, (v) => { sg = v; run(); if (!sc.o.animate) sc.render(); return fmt(v, 1) + " m"; });
      const bO = ui.button("GPS outage: off", () => { outage = !outage; bO.textContent = "GPS outage: " + (outage ? "on" : "off"); run(); sc.render(); });
      if (VIZ.reduceMotion) ui.slider("time", 0, T - 0.05, 0.05, tView, (v) => { tView = v; sc.render(); return fmt(v, 1) + " s"; });
      else { const bP = ui.button("pause", () => { paused = !paused; bP.textContent = paused ? "play" : "pause"; }); }
      readout(tView, idxAt(tView));
    },
  });
})();

(function () {

  // ═════════════════ b1-cubes-3d: cut a cube, watch surface win ═════════════════
  register("b1-cubes-3d", {
    title: "3D · cut a cube into n³ pieces: the surface grows ×n, the weight of each piece falls ×n³",
    target: "After this you can explain with A/V = 6/ℓ why crushed ice, cells and MEMS parts are “all surface”, and predict when surface tension beats weight.",
    caption: "the grey faces are the original outside of the cube; the <span style='color:" + C.gold + "'>gold</span> faces are the new surface created by cutting. The piece pulled out on the right feels its weight (<span style='color:" + ROLE.mech + "'>purple</span>, ∝ ℓ³) and the pull of a water surface (<span style='color:" + ROLE.fluid + "'>blue</span>, ∝ ℓ); the arrows show each force's share of the tug-of-war. Slide the size down to 100 µm and the surface force takes over completely.",
    links: [
      { id: "C4", why: "surface tension and the capillary length, used to pump liquid without a pump" },

        draw(g) {

          const pull = step >= 3;
          for (let i = 0; i < cut; i++) for (let j = 0; j < cut; j++) for (let k = 0; k < cut; k++) {
            if (pull && i === cut - 1 && j === 0 && k === cut - 1 && cut > 1) continue;  // this one is pulled out
            const x0 = off(i), y0 = off(j), z0 = off(k) + SZ / 2;
            const x1 = x0 + s, y1 = y0 + s, z1 = z0 + s;
            const newCol = step >= 2 ? C.gold : C.silicon;
            const fc = (outer) => (outer ? C.silicon : newCol);
            const op = { stroke: C.bg, strokeAlpha: 0.7, strokeWidth: 0.7 };
            g.poly([[x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0]], fc(k === 0), op);
            g.poly([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], fc(k === cut - 1), op);
            g.poly([[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1]], fc(j === 0), op);

            g.poly([[x0, y0, z0], [x0, y1, z0], [x0, y1, z1], [x0, y0, z1]], fc(i === 0), op);
            g.poly([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], fc(i === cut - 1), op);
          }
          if (step === 0 && n > 1) {   // where the cuts will go
            const s0 = SZ / n, h = SZ / 2;
            for (let q = 1; q < n; q++) {
              const c = -h + q * s0;
              g.polyline([[c, -h - 0.01, 0], [c, -h - 0.01, SZ], [c, h, SZ + 0.01]], C.gold, 1.4, [5, 4]);
              g.polyline([[-h, -h - 0.01, c + h], [h + 0.01, -h - 0.01, c + h], [h + 0.01, h, c + h]], C.gold, 1.4, [5, 4]);
              g.polyline([[h + 0.01, c, 0], [h + 0.01, c, SZ], [-h, c, SZ + 0.01]], C.gold, 1.4, [5, 4]);
            }
          }
          g.text([0, -SZ / 2 - 0.5, -0.25], "side ℓ = " + lenStr(Math.pow(10, lg)), C.text, 13);
          if (pull) {
            // the pulled-out piece, drawn at true relative size, with the tug-of-war arrows
            const sp = SZ / n, cx = 3.6, cz = 2.0;
            const a = [cx - sp / 2, -sp / 2, cz - sp / 2], b = [cx + sp / 2, sp / 2, cz + sp / 2];
            g.box(a, b, n > 1 ? C.gold : C.silicon, { stroke: C.bg, strokeAlpha: 0.7, strokeWidth: 0.7 });
            const lp = Math.pow(10, lg) / n, Fg = RHO * G * lp ** 3, Fs = GAMMA * lp;
            const tot = 2.2, Lw = (tot * Fg) / (Fg + Fs), Ls = (tot * Fs) / (Fg + Fs);
            g.arrow([cx, 0, cz - sp / 2], [cx, 0, cz - sp / 2 - Math.max(0.05, Lw)], ROLE.mech, 4);
            g.arrow([cx, 0, cz + sp / 2], [cx, 0, cz + sp / 2 + Math.max(0.05, Ls)], ROLE.fluid, 4);
            g.text([cx + 0.15, 0, cz - sp / 2 - Math.max(0.05, Lw) - 0.25], "weight " + Math.round((100 * Fg) / (Fg + Fs)) + "%", ROLE.mech, 13);
            g.text([cx + 0.15, 0, cz + sp / 2 + Math.max(0.05, Ls) + 0.25], "surface " + Math.round((100 * Fs) / (Fg + Fs)) + "%", ROLE.fluid, 13);
            g.text([cx, 0, cz - sp / 2 - Math.max(0.05, Lw) - 0.6], "one piece, ℓ/n = " + lenStr(lp), C.text, 12);
          }
        },
      });
      sc.canvas.getContext("2d").lineJoin = "round";   // no miter spikes on outlined labels
      const read = () => {
        const l = Math.pow(10, lg), lp = l / n, Fg = RHO * G * lp ** 3, Fs = GAMMA * lp;
        ui.read.innerHTML =
          `pieces <b>${n ** 3}</b> of side <b>${lenStr(lp)}</b> · total area 6ℓ²n = <b style="color:${C.gold}">${n}×</b> the original · ` +
          `A/V = 6n/ℓ = <b>${sci((6 * n) / l)} m⁻¹</b><br>one silicon piece: weight ρg(ℓ/n)³ = <b style="color:${ROLE.mech}">${sci(Fg)} N</b> · ` +
          `water pull γ(ℓ/n) = <b style="color:${ROLE.fluid}">${sci(Fs)} N</b> · surface/weight = <b>${sci(Fs / Fg)}</b>` +
          ` (equal at ℓ/n = ${fmt(Math.sqrt(GAMMA / (RHO * G)) * 1e3, 2)} mm)`;
      };
      ui.slider("cuts per side n", 1, 5, 1, n, (v) => { n = v; read(); sc.render(); return String(v); });
      ui.slider("cube side ℓ", -5, -1, 0.1, lg, (v) => { lg = v; read(); sc.render(); return lenStr(Math.pow(10, v)); });
      ui.steps([
        "One cube of side \\(\\ell\\): area \\(A=6\\ell^2\\), volume \\(V=\\ell^3\\), so \\(A/V=6/\\ell\\). The dashed gold lines show where we will cut.",
        "Cut each side into \\(n\\) parts: \\(n^3\\) pieces, each of side \\(\\ell/n\\). The volume (and total mass) is unchanged.",
        "Total area \\(=n^3\\cdot6(\\ell/n)^2=6\\ell^2\\,n\\): every cut adds new surface (gold). \\(A/V=6n/\\ell\\) grows as the pieces shrink.",
        "Pull out one piece. Its weight is \\(\\rho g_{\\text{grav}}(\\ell/n)^3\\), down by \\(n^3\\); a water surface pulls with \\(\\gamma\\,(\\ell/n)\\), down only by \\(n\\).",
        "Ratio \\(\\dfrac{\\gamma\\ell_p}{\\rho g_{\\text{grav}}\\ell_p^3}=\\dfrac{\\gamma}{\\rho g_{\\text{grav}}\\ell_p^2}\\): equal at \\(\\ell_p=\\sqrt{\\gamma/(\\rho g_{\\text{grav}})}\\approx1.8\\) mm for silicon. Smaller pieces belong to surface tension.",
      ], (i) => { step = i; read(); sc.render(); });
    },
  });

  // ═════════════════ b1-forces-chart: the four exponents on a log-log plot ═════════════════
  register("b1-forces-chart", {
    title: "Forces vs size · on log–log axes a power law ℓⁿ is a straight line of slope n",
    target: "After this you can derive the exponents of Trimmer's bracket [ℓ¹ ℓ² ℓ³ ℓ⁴] and find the size where one force overtakes another.",
    caption: "each line is one force acting on a silicon cube of side ℓ (surface tension of water, Stokes drag at 1 mm/s in water, electrostatic pull at field 𝓔, weight, and the force of a coil at current density J). Step through the math: each step derives one exponent and lights up its line with a slope triangle (×10 in size → ×10ⁿ in force). The dots mark the crossover sizes; move the 𝓔 and J sliders to see the electrostatic/magnetic crossover slide between 0.1 mm and a few cm.",
    links: [
      { id: "A3", why: "the electrostatic force ½ε₀𝓔²A is the pull between capacitor plates" },
      { id: "B4", why: "comb drives and electrostatic self-test of accelerometers live on the ℓ² line" },
      { id: "C1", why: "inertia (ℓ³) vs viscous drag (ℓ) is the Reynolds number" },
      { id: "C4", why: "the surface-tension line explains capillary pumping and droplets" },
    ],
    build(fig, ui) {
      let lE = Math.log10(3e6), lJ = 7, lx = -4, step = 0;
      const ch = chart(ui.body, { w: 640, h: 330, xr: [1e-6, 1], yr: [-18, 8], logx: true, xlabel: "size ℓ (m)", ylabel: "log₁₀ F (N)", ml: 50, mr: 18 });
      const F = [
        { key: "st", name: "surface tension γℓ", n: 1, col: ROLE.fluid, c: () => GAMMA },
        { key: "visc", name: "Stokes drag 6πμℓU", n: 1, col: ROLE.fluid, dash: "6 4", c: () => 6 * Math.PI * 1e-3 * 1e-3 },
        { key: "es", name: "electrostatic ½ε₀𝓔²ℓ²", n: 2, col: ROLE.elec, c: () => 0.5 * EPS0 * Math.pow(10, 2 * lE) },
        { key: "g", name: "weight ρgℓ³", n: 3, col: ROLE.mech, c: () => RHO * G },
        { key: "mag", name: "magnetic ½μ₀J²ℓ⁴", n: 4, col: C.gold, c: () => 0.5 * MU0 * Math.pow(10, 2 * lJ) },
      ];
      const hot = [[], ["g"], ["es"], ["st", "visc"], ["mag"], ["st", "visc", "es", "g", "mag"]];
      F.forEach((f) => { f.ln = ch.line(f.col, 2, f.dash); f.lab = ch.label(f.col, 12, "end"); });
      const tri = ch.line(C.white, 1.5, "3 3"), triLab = ch.label(C.white, 12, "start");
      const vx = ch.vline(C.dim);
      const xdots = [0, 1, 2].map(() => ({ d: ch.dot(C.yellow, 5), l: ch.label(C.yellow, 11.5, "start") }));
      const val = (f, l) => Math.log10(f.c() * Math.pow(l, f.n));
      function draw() {
        const H = hot[step];
        F.forEach((f) => {
          const on = H.indexOf(f.key) >= 0, pts = [];
          for (let e = -6; e <= 0.001; e += 0.1) { const l = Math.pow(10, e); pts.push([l, val(f, l)]); }
          f.ln.set(pts);
          f.ln.el.setAttribute("stroke-width", on ? 4 : 1.8);
          f.ln.el.setAttribute("opacity", step === 0 || on ? 1 : 0.3);
          // label near the right edge, or where the line leaves the box
          let lx2 = 0.5;
          while (lx2 > 1e-6 && val(f, lx2) > 7.2) lx2 /= 1.25;
          f.lab.set(lx2, Math.min(7.2, val(f, lx2)) + (f.key === "visc" ? -0.9 : 0.8), f.name);
          f.lab.el.setAttribute("opacity", step === 0 || on ? 1 : 0.35);
        });
        // slope triangle on the first highlighted line
        if (step >= 1 && step <= 4) {
          const f = F.find((q) => q.key === H[0]), l0 = 2e-6, y0 = val(f, l0);
          tri.set([[l0, y0], [2e-5, y0], [2e-5, y0 + f.n]]);
          triLab.set(2.4e-5, y0 + f.n / 2, "×10 in ℓ → ×10" + SUP[f.n] + " in F");
        } else { tri.set([]); triLab.set(1, 100, ""); }
        // crossovers
        const pairs = [["g", "st", "weight = surface"], ["g", "es", "weight = electrostatic"], ["es", "mag", "electrostatic = magnetic"]];
        pairs.forEach(([a, b, name], i) => {
          const fa = F.find((q) => q.key === a), fb = F.find((q) => q.key === b);
          const l = Math.pow(fb.c() / fa.c(), 1 / (fa.n - fb.n));
          const show = step === 5 && l > 1e-6 && l < 1;
          xdots[i].d.set(show ? l : NaN, val(fa, l));
          xdots[i].l.set(l * 1.35, val(fa, l) - 0.9 - i * 0.2, show ? lenStr(l) : "");
          xdots[i].cross = l;
        });
        const l = Math.pow(10, lx);
        vx.set(l);
        const rows = F.map((f) => `<span style="color:${f.col}">${f.name.split(" ")[0]} ${sci(f.c() * Math.pow(l, f.n))} N</span>`).join(" · ");
        ui.read.innerHTML = `at ℓ = <b>${lenStr(l)}</b>: ${rows}<br>crossovers: weight = surface at <b>${lenStr(xdots[0].cross)}</b> · ` +
          `electrostatic = magnetic at <b>${lenStr(xdots[2].cross)}</b> (𝓔 = ${sci(Math.pow(10, lE))} V/m, J = ${sci(Math.pow(10, lJ))} A/m²)`;
      }
      ui.slider("field 𝓔", 6, 8.5, "any", lE, (v) => { lE = v; draw(); return sci(Math.pow(10, v)) + " V/m"; });
      ui.slider("current density J", 6, 9, "any", lJ, (v) => { lJ = v; draw(); return sci(Math.pow(10, v)) + " A/m²"; });
      ui.slider("size ℓ", -6, 0, 0.05, lx, (v) => { lx = v; draw(); return lenStr(Math.pow(10, v)); });
      ui.steps([
        "Shrink every length by 10: areas fall ×100, volumes ×1000. On log–log axes a law \\(F=c\\,\\ell^n\\) is a straight line, \\(\\log F=\\log c+n\\log\\ell\\), with slope \\(n\\).",
        "Weight and inertia: \\(F=m g_{\\text{grav}}=\\rho\\ell^3 g_{\\text{grav}}\\) ⇒ slope 3. Shrink ×10 and the weight drops ×1000.",
        "Electrostatics at a fixed field: pressure \\(\\tfrac12\\varepsilon_0\\mathcal E^2\\) times area \\(\\ell^2\\) ⇒ slope 2.",
        "Surface tension: \\(\\gamma\\) times a contact length ⇒ slope 1. Stokes drag \\(6\\pi\\mu\\ell U\\) at fixed speed: also slope 1.",
        "Magnetics: current \\(J\\ell^2\\) makes \\(B\\approx\\mu_0J\\ell\\); pressure \\(B^2/2\\mu_0\\) times \\(\\ell^2\\) ⇒ \\(F\\approx\\tfrac12\\mu_0J^2\\ell^4\\), slope 4.",
        "Trimmer's bracket \\(F\\propto[\\ell^1,\\ell^2,\\ell^3,\\ell^4]\\); per unit mass \\(a\\propto[\\ell^{-2},\\ell^{-1},\\ell^0,\\ell^1]\\). Where two lines cross, the lower exponent wins for all smaller sizes.",
      ], (i) => { step = i; draw(); });
    },
  });

  // ═════════════════ b1-clocks: time scales vs size ═════════════════
  register("b1-clocks", {
    title: "Clocks of the small world · resonance ∝ ℓ, falling ∝ √ℓ, heat and molecules ∝ ℓ²",
    target: "After this you can estimate how fast something of size ℓ rings, falls, heats up and gets reached by diffusing molecules, and why microdevices are fast.",
    caption: "the <span style='color:" + ROLE.mech + "'>purple</span> line is the period of a silicon cantilever with length ℓ and thickness ℓ/100; the dashed grey line is the time to fall its own size; <span style='color:" + ROLE.heat + "'>gold</span> is the time to heat silicon through ℓ; <span style='color:" + ROLE.fluid + "'>blue</span> is the time for glucose to diffuse ℓ in water. The ℓ² lines are steeper, so they win (get shortest) at small sizes. Move the slider from a human down to a cell.",
    links: [
      { id: "B3", why: "the exact cantilever frequency f₀ = 0.162 (t/L²)√(E/ρ)" },
      { id: "C3", why: "diffusion time ℓ²/2D is why microfluidic mixing takes seconds" },
      { id: "B5", why: "small heaters (inkjet, gas sensors) switch in microseconds" },
      { id: "A7", why: "a thermal time constant is a first-order lag τ" },
    ],
    build(fig, ui) {
      let lx = -4;
      const ch = chart(ui.body, { w: 640, h: 320, xr: [1e-6, 1], yr: [-9, 6], logx: true, xlabel: "size ℓ (m)", ylabel: "log₁₀ time (s)", ml: 50, mr: 18 });
      const T = [
        { name: "resonance period", col: ROLE.mech, f: (l) => (100 * l) / (CF * VSI) },
        { name: "fall own size", col: C.dim, dash: "6 4", f: (l) => Math.sqrt((2 * l) / G) },
        { name: "heat through (Si)", col: ROLE.heat, f: (l) => (l * l) / DTH },
        { name: "glucose diffuses", col: ROLE.fluid, f: (l) => (l * l) / (2 * DGLU) },
      ];
      [[1, "1 s"], [Math.log10(3600), "1 h"], [Math.log10(86400), "1 day"], [-3, "1 ms"], [-6, "1 µs"]].forEach(([y, s]) => {
        ch.hline(C.grid, "2 5").set(y); ch.label(C.dim, 11, "start").set(1.4e-6, y + 0.35, s);
      });
      [[10e-6, "cell"], [300e-6, "MEMS mass"], [5e-3, "ant"], [0.15, "phone"]].forEach(([l, s]) => {
        ch.label(C.dim, 11, "middle").set(l, 5.4, "▾ " + s);
      });
      T.forEach((q) => {
        const pts = [];
        for (let e = -6; e <= 0.001; e += 0.1) { const l = Math.pow(10, e); pts.push([l, Math.log10(q.f(l))]); }
        q.ln = ch.line(q.col, 2.6, q.dash); q.ln.set(pts);
        q.dot = ch.dot(q.col, 5);
      });
      ch.label(ROLE.fluid, 12, "start").set(2e-4, 3.3, "∝ ℓ²");
      ch.label(ROLE.mech, 12, "start").set(0.05, -1.3, "∝ ℓ");
      ch.label(C.dim, 12, "start").set(0.05, 0.3, "∝ √ℓ");
      const vx = ch.vline(C.yellow);
      function draw() {
        const l = Math.pow(10, lx);
        vx.set(l);
        T.forEach((q) => q.dot.set(l, Math.log10(q.f(l))));
        ui.read.innerHTML = `ℓ = <b>${lenStr(l)}</b> · ` + T.map((q) => `<span style="color:${q.col === C.dim ? C.text : q.col}">${q.name}: <b>${timeStr(q.f(l))}</b></span>`).join(" · ") +
          `<br>shrink ×10 → period ×1/10, fall ×1/3.2, heating and diffusion ×1/100`;
      }
      ui.slider("size ℓ", -6, 0, 0.05, lx, (v) => { lx = v; draw(); return lenStr(Math.pow(10, v)); });
      draw();
    },
  });
})();

</script>
<script>
/* ── B2.js ── */
/* B2 — microfabrication: widgets for docs/B2-microfabrication-lithography-etching-deposition.md */
(function () {
  "use strict";
  const { register, C, ROLE, scene3d, plane, S, H, fmt, mix, rng, reduceMotion } = VIZ;
  // core.js sizes every <svg> in a figure to 100% width; keep MathJax's own SVGs (stepper math) at their natural size
  if (!document.getElementById("viz-mjx-fix")) {
    const st = document.createElement("style");
    st.id = "viz-mjx-fix";
    st.textContent = "figure.viz mjx-container svg { display: inline; width: auto; height: auto; }";
    document.head.appendChild(st);
  }

  const OXIDE = "#cfe3ef", RESIST = "#e58fb4", CHROME = "#9aa3ad";
  const POLY = mix(C.silicon, ROLE.mech, 0.45);
  const SQ2 = Math.SQRT2, ANG = (Math.acos(1 / Math.sqrt(3)) * 180) / Math.PI;

  // ═════════════════ b2-process-3d: surface micromachining of a cantilever, layer by layer ═════════════════
  register("b2-process-3d", {
    title: "3D · surface micromachining: build a free-standing polysilicon cantilever in ten steps",
    target: "After this you can name every step that turns a bare wafer into a released MEMS beam, and say what each layer is for.",
    caption: "thicknesses are drawn about 10× too large next to the lengths, so you can see the layers: grey = silicon wafer, pale blue = sacrificial oxide, purple-grey = structural polysilicon, pink = photoresist, gold = UV light. Step through the process; at the end the oxide is dissolved in HF and the beam hangs 2 µm above the wafer, held only by its anchor (and it vibrates, as B3 will compute). Drag to look under the beam.",
    links: [
      { id: "B3", why: "the released beam is the cantilever whose stiffness k = Ewt³/4L³ we compute next" },
      { id: "B4", why: "accelerometer proof masses and springs are made by this same sequence" },
      { id: "B1", why: "stiction during release is surface tension winning at small ℓ" },
      { id: "A3", why: "the 2 µm gap under the beam is a capacitor gap g₀" },
    ],
    build(fig, ui) {
      let step = 0;
      const X0 = -3, X1 = 3, Y0 = -1.6, Y1 = 1.6;
      const zS = -0.9, zO = 0.4, zP = 0.78, zR = 1.05;          // tops of substrate, oxide, poly, resist
      const bx = [-2.3, 2.1], by = [-0.55, 0.55], ax = [-2.3, -1.55];  // beam and anchor footprints
      const sc = scene3d(ui.body, {
        w: 640, h: 400, scale: 64, yaw: -0.5, pitch: 0.5, center: [0, 0, 0.75], animate: !reduceMotion,
        draw(g, t) {
          const ed = { stroke: C.bg, strokeAlpha: 0.5, strokeWidth: 0.8, bias: -6 };
          g.box([X0, Y0, zS], [X1, Y1, 0], C.silicon, ed);
          g.text([-1.2, Y0, -0.5], "silicon wafer", C.text, 12);
          // oxide
          if (step >= 1 && step <= 8) {
            const oc = OXIDE, op = { stroke: C.bg, strokeAlpha: 0.35, strokeWidth: 0.8, bias: -3 };
            if (step === 1) g.box([X0, Y0, 0], [X1, Y1, zO], oc, op);
            else {
              g.box([X0, Y0, 0], [ax[0], Y1, zO], oc, op);
              g.box([ax[1], Y0, 0], [X1, Y1, zO], oc, op);
              g.box([ax[0], Y0, 0], [ax[1], by[0], zO], oc, op);
              g.box([ax[0], by[1], 0], [ax[1], Y1, zO], oc, op);
            }
            g.text([1.4, Y0, zO / 2], "SiO₂ (sacrificial, 2 µm)", C.text, 12);
          }
          // polysilicon
          let wob = 0;
          if (step >= 9 && !reduceMotion) wob = 0.12 * Math.sin(2 * Math.PI * 0.9 * t);
          if (step >= 3) {
            const pc = step >= 9 ? mix(C.silicon, ROLE.mech, 0.7) : POLY, op = { stroke: C.bg, strokeAlpha: 0.45, strokeWidth: 0.8, bias: 0.02 };
            if (step <= 6) {
              g.box([X0, Y0, zO], [X1, Y1, zP], pc, op);
              g.box([ax[0], by[0], 0], [ax[1], by[1], zO], pc, op);
            } else {
              g.box([ax[0], by[0], 0], [ax[1], by[1], zP], pc, op);    // anchor
              // beam from anchor to tip, as segments so it can bend after release
              const n = step >= 9 ? 8 : 1, xa = ax[1], L = bx[1] - xa;
              const z = (u) => wob * (u * u * (3 - u)) / 2;
              for (let i = 0; i < n; i++) {
                const u0 = i / n, u1 = (i + 1) / n, x0 = xa + L * u0, x1 = xa + L * u1, z0 = z(u0), z1 = z(u1);
                const P = (x, y, zz) => [x, y, zz];
                g.poly([P(x0, by[0], zP + z0), P(x1, by[0], zP + z1), P(x1, by[1], zP + z1), P(x0, by[1], zP + z0)], pc, op);
                g.poly([P(x0, by[0], zO + z0), P(x1, by[0], zO + z1), P(x1, by[1], zO + z1), P(x0, by[1], zO + z0)], pc, op);
                g.poly([P(x0, by[0], zO + z0), P(x1, by[0], zO + z1), P(x1, by[0], zP + z1), P(x0, by[0], zP + z0)], pc, op);
                g.poly([P(x0, by[1], zO + z0), P(x1, by[1], zO + z1), P(x1, by[1], zP + z1), P(x0, by[1], zP + z0)], pc, op);
                if (i === n - 1) g.poly([P(x1, by[0], zO + z1), P(x1, by[1], zO + z1), P(x1, by[1], zP + z1), P(x1, by[0], zP + z1)], pc, op);
              }
              g.box([ax[0] - 0.7, by[0], zO], [ax[0], by[1], zP], pc, op);  // a short pad behind the anchor
            }
            if (step <= 6) g.text([1.4, Y0, (zO + zP) / 2], "poly-Si (structural, 2 µm)", C.white, 12);
            else g.text([0.6, by[0], zP + 0.35], step >= 9 ? "released poly-Si beam" : "poly-Si beam", C.white, 12);
          }
          // resist
          if (step >= 4 && step <= 7) {
            const exposed = step === 5;
            const rc = RESIST, xc = mix(RESIST, C.gold, 0.6), op = { stroke: C.bg, strokeAlpha: 0.4, strokeWidth: 0.8, bias: 0.03 };
            if (step <= 5) {
              // split into the beam-shaped part (shadowed by chrome) and the rest (exposed in step 5)
              g.box([bx[0], by[0], zP], [bx[1], by[1], zR], rc, op);
              const rest = [[[X0, Y0], [bx[0], Y1]], [[bx[1], Y0], [X1, Y1]], [[bx[0], Y0], [bx[1], by[0]]], [[bx[0], by[1]], [bx[1], Y1]]];
              rest.forEach(([a, b]) => g.box([a[0], a[1], zP], [b[0], b[1], zR], exposed ? xc : rc, op));
            } else g.box([bx[0], by[0], zP], [bx[1], by[1], zR], rc, op);
            g.text(step <= 5 ? [1.4, Y0, (zP + zR) / 2] : [0.6, by[0], zR + 0.3], step === 5 ? "exposed resist turns soluble" : "photoresist (1.4 µm)", C.white, 12);
          }
          // mask and UV light
          if (step === 5) {
            const zm = 2.5;
            g.poly([[X0, Y0, zm], [X1, Y0, zm], [X1, Y1, zm], [X0, Y1, zm]], "#bcd3e6", { alpha: 0.18, stroke: "#bcd3e6", strokeAlpha: 0.6, shade: false, bias: -0.5 });
            g.poly([[bx[0], by[0], zm + 0.01], [bx[1], by[0], zm + 0.01], [bx[1], by[1], zm + 0.01], [bx[0], by[1], zm + 0.01]], CHROME, { shade: false });
            g.text([X0 + 0.2, Y1, zm + 0.3], "photomask (chrome on glass)", C.text, 12);
            g.text([(bx[0] + bx[1]) / 2, 0, zm + 0.12], "chrome", C.text, 12);
            [[-2.6, -1.15], [-0.9, -1.15], [0.8, -1.15], [2.5, -1.15], [-2.6, 1.15], [-0.9, 1.15], [0.8, 1.15], [2.5, 1.15], [2.65, 0]].forEach(([x, y]) => {
              g.arrow([x, y, zm - 0.05], [x, y, zR + 0.08], C.gold, 2);
              g.line([x, y, zm + 0.7], [x, y, zm + 0.05], C.gold, 2);
            });
            g.text([2.9, Y0, zm + 0.9], "UV 365 nm", C.gold, 12);
          }
          if (step >= 9) {
            g.arrow([0.9, by[0] - 0.05, 0.02], [0.9, by[0] - 0.05, zO - 0.02], C.yellow, 2);
            g.arrow([0.9, by[0] - 0.05, zO - 0.02], [0.9, by[0] - 0.05, 0.02], C.yellow, 2);
            g.text([0.9, by[0] - 0.4, 0.2], "gap 2 µm", C.yellow, 12);
          }
        },
      });
      sc.canvas.getContext("2d").lineJoin = "round";   // no miter spikes on outlined labels
      const notes = [
        "start: a polished single-crystal silicon wafer, (100) surface",
        "oxide grown/deposited everywhere: 2 µm, conformal (LPCVD or thermal, ~1100 °C)",
        "mask 1: litho + HF etch open an anchor window down to the wafer",
        "LPCVD polysilicon at ~600 °C, 10 nm/min: 2 µm takes 200 min; it fills the anchor",
        "spin-coat positive resist: 1.4 µm at 4000 rpm (thickness ∝ 1/√rpm)",
        "mask 2: UV through the photomask; the chrome shadows the beam shape",
        "develop: the exposed (soluble) resist washes away; a beam-shaped stencil remains",
        "reactive-ion etch: poly is removed wherever the resist does not cover it",
        "strip the resist (solvent or O₂ plasma)",
        "release: HF dissolves the oxide; dry without a meniscus (critical-point dryer) to avoid stiction",
      ];
      ui.steps([
        "Bare (100) wafer. Everything will be built on its top surface: <b>surface micromachining</b>.",
        "Deposit the <b>sacrificial layer</b>: 2 µm of SiO₂. Its thickness becomes the gap \\(g_0\\) under the beam.",
        "Lithography + etch an <b>anchor</b> hole through the oxide, where the beam will be fixed to the wafer.",
        "Deposit the <b>structural layer</b>: 2 µm of polysilicon, the beam thickness \\(t\\). It also fills the anchor hole.",
        "Spin on photoresist: film thickness \\(\\propto 1/\\sqrt{\\text{rpm}}\\).",
        "Expose through the mask. Smallest printable line \\(R=k_1\\lambda/\\mathrm{NA}\\) (or \\(\\approx\\sqrt{\\lambda g}\\) for a proximity gap \\(g\\)).",
        "Develop: positive resist dissolves where it was exposed. The resist now has the shape of the beam (\\(L\\times w\\)).",
        "Anisotropic plasma etch transfers the pattern into the poly; the oxide below acts as an etch stop.",
        "Strip the resist. The beam is patterned but still glued to the oxide.",
        "Release in HF: the oxide vanishes, the beam is free above a gap \\(g_0=2\\) µm. Capillary pressure \\(2\\gamma/g_0=72\\) kPa while drying is why careful drying matters.",
      ], (i) => { step = i; ui.read.innerHTML = `step ${i + 1} of 10 · <b>${notes[i]}</b>`; sc.render(); });
    },
  });

  // ═════════════════ b2-etch-profile: isotropic vs KOH vs DRIE ═════════════════
  register("b2-etch-profile", {
    title: "Etch profiles · isotropic bowl, KOH V-groove at 54.74°, DRIE vertical trench",
    target: "After this you can predict the shape and depth of a trench from the mask opening W and the etch type, including the self-limiting KOH depth d = W/√2.",
    caption: "cross-section through the wafer (grey) under a hard mask (pale blue) with an opening W. The etchant is shown in blue. Isotropic etching undercuts the mask by the etch depth; KOH stops on the slow (111) planes at 54.74°, so the groove closes at depth (W/2)·tan 54.74° = W/√2 however long you wait; DRIE goes straight down, with scallops from each etch/passivate cycle (enlarged here). Use the stepper to derive the KOH geometry.",
    links: [
      { id: "B5", why: "KOH back-side etching makes the thin membrane of a pressure sensor" },
      { id: "B4", why: "DRIE cuts the vertical combs of accelerometers and gyroscopes" },
      { id: "C2", why: "channel cross-sections (V, round, rectangular) set the hydraulic resistance" },
      { id: "A4", why: "piezoresistors sit at the edge of KOH membranes, where the stress is largest" },
    ],
    build(fig, ui) {
      let mode = "koh", W = 60, d = 50, step = 0;
      const P = plane(ui.body, { w: 640, xr: [-80, 80], yr: [-78, 20], grid: false, axes: false, label: "etch cross-section" });
      const si = S("rect", { x: P.X(-80), y: P.Y(0), width: P.X(80) - P.X(-80), height: P.Y(-78) - P.Y(0), fill: C.silicon }, P.gMain);
      const etch = S("path", { fill: C.water, "fill-opacity": 0.55, stroke: C.water, "stroke-width": 1.5 }, P.gMain);
      const maskL = S("rect", { fill: OXIDE }, P.gMain), maskR = S("rect", { fill: OXIDE }, P.gMain);
      const geo = S("g", {}, P.gTop);
      const ttl = P.text(C.text, 14, null, "start");
      function setMask() {
        const th = 3;
        maskL.setAttribute("x", P.X(-80)); maskL.setAttribute("y", P.Y(th)); maskL.setAttribute("width", P.X(-W / 2) - P.X(-80)); maskL.setAttribute("height", P.Y(0) - P.Y(th));
        maskR.setAttribute("x", P.X(W / 2)); maskR.setAttribute("y", P.Y(th)); maskR.setAttribute("width", P.X(80) - P.X(W / 2)); maskR.setAttribute("height", P.Y(0) - P.Y(th));
      }
      const pt = (x, y) => P.X(x).toFixed(1) + "," + P.Y(y).toFixed(1);
      function line(x0, y0, x1, y1, col, dash, w) { S("line", { x1: P.X(x0), y1: P.Y(y0), x2: P.X(x1), y2: P.Y(y1), stroke: col, "stroke-width": w || 1.6, "stroke-dasharray": dash || "" }, geo); }
      function txt(x, y, s, col, anchor, size) { const e = S("text", { x: P.X(x), y: P.Y(y), fill: col, "font-size": size || 13, "text-anchor": anchor || "middle", "dominant-baseline": "middle", "font-family": "var(--font-mono, monospace)", "paint-order": "stroke", stroke: C.bg, "stroke-width": 3 }, geo); e.textContent = s; }
      function draw() {
        geo.innerHTML = "";
        setMask();
        let dd = d, info = "";
        if (mode === "iso") {
          const r = d * P.s;
          etch.setAttribute("d", `M${pt(-W / 2 - d, 0)} A${r},${r} 0 0 0 ${pt(-W / 2, -d)} L${pt(W / 2, -d)} A${r},${r} 0 0 0 ${pt(W / 2 + d, 0)} Z`);
          line(-W / 2 - d, 6, -W / 2, 6, C.red, "", 2); txt(-W / 2 - d / 2, 10, "undercut " + fmt(d, 0), C.red, "middle", 12);
          info = `isotropic: depth ${fmt(d, 1)} µm, top width W + 2d = <b>${fmt(W + 2 * d, 1)} µm</b> (undercut ${fmt(d, 1)} µm under each mask edge)`;
        } else if (mode === "koh") {
          const dmax = W / SQ2;
          dd = Math.min(d, dmax);
          const xf = W / 2 - dd / SQ2;
          etch.setAttribute("d", `M${pt(-W / 2, 0)} L${pt(-xf, -dd)} L${pt(xf, -dd)} L${pt(W / 2, 0)} Z`);
          // geometry overlays, following the stepper
          if (step >= 1) {
            const R = Math.min(10, W / 3), cx = W / 2, arc = [];  // arc at the right mask edge, from the surface (pointing left) down to the wall
            for (let q = 0; q <= 16; q++) { const th = Math.PI + ((ANG * Math.PI) / 180) * (q / 16); arc.push(pt(cx + R * Math.cos(th), R * Math.sin(th))); }
            S("polyline", { points: arc.join(" "), fill: "none", stroke: C.gold, "stroke-width": 2.2 }, geo);
            txt(cx - R - 1.5, -R * 0.45, "54.74°", C.gold, "end", 12.5);
          }
          if (step >= 2) {
            const run = Math.min(12, W / 2), x0 = -W / 2;
            line(x0, 0, x0 + run, 0, C.green, "4 3", 2); line(x0 + run, 0, x0 + run, -run * SQ2, C.green, "4 3", 2);
            txt(x0 + run / 2, -3.5, "r", C.green, "middle", 12); txt(x0 + run + 2, -run * SQ2 / 2, "drop √2·r", C.green, "start", 12);
          }
          if (step >= 3 || d >= dmax) {
            line(0, 0, 0, -dmax, C.yellow, "5 4", 1.6);
            txt(2, -dmax - 6, "d = W/√2 = " + fmt(dmax, 1) + " µm", C.yellow, "start", 13);
          }
          if (step >= 4) {
            txt(-78, -64, "membrane from the back: W_back = W_mem + √2·d", C.teal, "start", 12.5);
            txt(-78, -70, "(505 µm deep, 1000 µm membrane → 1714 µm opening)", C.teal, "start", 12);
          }
          info = d >= dmax ? `KOH: the (111) walls have met; the groove <b>stopped by itself</b> at d = (W/2)·tan 54.74° = W/√2 = <b>${fmt(dmax, 2)} µm</b>` :
            `KOH: floor at ${fmt(dd, 1)} µm, flat floor still ${fmt(2 * xf, 1)} µm wide; it will stop at W/√2 = ${fmt(dmax, 2)} µm`;
        } else {

      ui.button("KOH", () => { mode = "koh"; draw(); });
      ui.button("DRIE", () => { mode = "drie"; draw(); });
      ui.slider("opening W", 10, 100, 1, W, (v) => { W = v; draw(); return v + " µm"; });
      ui.slider("etch depth", 0, 75, 0.5, d, (v) => { d = v; draw(); return v + " µm"; });
      ui.steps([
        "A (100) wafer with a mask opening \\(W\\). KOH etches (100) planes 100–400× faster than (111) planes.",
        "The (111) planes meet the surface at \\(\\cos\\theta=\\mathbf n_{100}\\cdot\\mathbf n_{111}=1/\\sqrt3\\), so \\(\\theta=54.74°\\) and \\(\\tan\\theta=\\sqrt2\\).",
        "Each wall starts at the mask edge and drops \\(\\sqrt2\\) for every unit of run \\(r\\) inward.",
        "The walls meet after a run of \\(W/2\\): \\(d=\\tfrac W2\\tan54.74°=W/\\sqrt2\\approx0.707\\,W\\). Then only (111) is exposed and the etch stops.",
        "Reverse it for a membrane: a floor of width \\(W_{\\text{mem}}\\) at depth \\(d\\) needs \\(W_{\\text{back}}=W_{\\text{mem}}+\\sqrt2\\,d\\) (505 µm deep, 1 mm membrane: 1714 µm).",
      ], (i) => { step = i; mode = "koh"; if (i >= 3) d = 75; draw(); });
    },
  });

  // ═════════════════ b2-wafer-yield: dies, defects and cost ═════════════════
  register("b2-wafer-yield", {
    title: "Wafer map · dies per wafer, random defects, and the cost of one good chip",
    target: "After this you can estimate how many chips fit on a wafer, what fraction survive random defects (Y = e^(−n_d A)), and why small dies are cheap.",
    caption: "a 200 mm wafer cut into square dies. Red dots are random defects (particles); a die hit by one is dead (red), the others are good (green). Grow the die and watch two effects at once: fewer dies fit, and each one is more likely to catch a defect. The counted numbers jitter around the formulas, as random samples should.",
    links: [
      { id: "B4", why: "a phone accelerometer die is about 2 mm × 2 mm: thousands per wafer" },
      { id: "A8", why: "defects are random: the same Poisson statistics as photon shot noise" },
      { id: "C5", why: "glass and PDMS chips for diagnostics follow the same cost logic" },
    ],
    build(fig, ui) {
      let a = 6, nd = 0.5, seed = 7;
      const Wd = 640, Hd = 400, dpr = Math.min(2, window.devicePixelRatio || 1);
      const cv = H("canvas", { width: Wd * dpr, height: Hd * dpr }, ui.body);
      cv.style.cursor = "default";
      const ctx = cv.getContext("2d");
      const R = 100, sc = 1.85, cx = 225, cy = 200;   // mm, px per mm
      function draw() {
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.fillStyle = C.bg; ctx.fillRect(0, 0, Wd, Hd);
        ctx.beginPath(); ctx.arc(cx, cy, R * sc, 0, 2 * Math.PI); ctx.fillStyle = "#2a3038"; ctx.fill();
        ctx.strokeStyle = C.silicon; ctx.lineWidth = 1.5; ctx.stroke();
        // defects (uniform in the disc; count = n_d × area)
        const r = rng(seed), nDef = Math.round(nd * Math.PI * 10 * 10), defs = [];
        for (let i = 0; i < nDef; i++) { const rr = R * Math.sqrt(r()), th = 2 * Math.PI * r(); defs.push([rr * Math.cos(th), rr * Math.sin(th)]); }
        // dies on a grid centred on the wafer
        const n = Math.ceil(R / a) + 1;
        let tot = 0, good = 0;
        for (let i = -n; i < n; i++) for (let j = -n; j < n; j++) {
          const x0 = i * a, y0 = j * a, x1 = x0 + a, y1 = y0 + a;
          const far = Math.max(Math.hypot(x0, y0), Math.hypot(x1, y0), Math.hypot(x0, y1), Math.hypot(x1, y1));
          if (far > R - 3) continue;   // 3 mm edge exclusion
          tot++;
          const hit = defs.some(([x, y]) => x >= x0 && x < x1 && y >= y0 && y < y1);
          if (!hit) good++;
          ctx.fillStyle = hit ? "rgba(252,98,85,0.55)" : "rgba(131,193,103,0.55)";
          ctx.fillRect(cx + x0 * sc + 0.5, cy + y0 * sc + 0.5, a * sc - 1, a * sc - 1);
        }
        ctx.fillStyle = C.red;
        defs.forEach(([x, y]) => { ctx.beginPath(); ctx.arc(cx + x * sc, cy + y * sc, 2.2, 0, 2 * Math.PI); ctx.fill(); });
        // numbers panel
        const A = a * a, Nf = Math.floor((Math.PI * R * R) / A - (Math.PI * 2 * R) / Math.sqrt(2 * A)), Yf = Math.exp(-nd * A / 100);
        const lines = [
          ["die " + fmt(a, 1) + " × " + fmt(a, 1) + " mm", C.text],
          ["defects " + fmt(nd, 2) + " /cm² (" + nDef + ")", C.red],
          ["", C.text],
          ["dies counted   " + tot, C.text],
          ["formula N_die  " + Nf, C.dim],
          ["good counted   " + good, C.green],
          ["yield counted  " + fmt((100 * good) / Math.max(1, tot), 1) + " %", C.green],
          ["e^(−n_d·A)     " + fmt(100 * Yf, 1) + " %", C.dim],
          ["", C.text],
          ["wafer €2000", C.text],
          ["€ per good die " + (good ? fmt(2000 / good, good > 1000 ? 3 : 2) : "∞"), C.yellow],
        ];
        ctx.font = "13px JetBrains Mono, ui-monospace, monospace"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
        lines.forEach(([s, col], i) => { ctx.fillStyle = col; ctx.fillText(s, 440, 70 + i * 24); });
        ctx.fillStyle = C.dim; ctx.fillText("200 mm wafer", 12, 18);
        ui.read.innerHTML = `${tot} dies, ${good} good (${fmt((100 * good) / Math.max(1, tot), 1)} %) → <b style="color:${C.yellow}">€${good ? fmt(2000 / good, 3) : "∞"}</b> per good die · ` +
          `formulas: N ≈ ${Nf}, Y = e<sup>−n<sub>d</sub>A</sup> = ${fmt(Yf, 3)}, €${fmt(2000 / (Nf * Yf), 3)}`;
      }
      ui.slider("die side", 2, 20, 0.5, a, (v) => { a = v; draw(); return fmt(v, 1) + " mm"; });
      ui.slider("defect density n_d", 0, 2, 0.05, nd, (v) => { nd = v; draw(); return fmt(v, 2) + " /cm²"; });
      ui.button("new wafer (new defects)", () => { seed = (seed * 9301 + 49297) % 233280 || 1; draw(); });
      draw();
    },
  });
})();

</script>
<script>
/* ── B3.js ── */
/* B3 — micromechanics: widgets for docs/B3-micromechanics-beams-springs-and-resonators.md */
(function () {
  "use strict";
  const { register, C, ROLE, scene3d, chart, S, fmt, mix, css, ramp, loop, reduceMotion } = VIZ;
  // core.js sizes every <svg> in a figure to 100% width; keep MathJax's own SVGs (stepper math) at their natural size
  if (!document.getElementById("viz-mjx-fix")) {
    const st = document.createElement("style");
    st.id = "viz-mjx-fix";
    st.textContent = "figure.viz mjx-container svg { display: inline; width: auto; height: auto; }";
    document.head.appendChild(st);
  }

  const E = 169e9, RHO = 2330, CF = (1.875104 ** 2) / (2 * Math.PI) / Math.sqrt(12), KT = 1.380649e-23 * 298.15;
  // first bending mode of a cantilever, normalised to 1 at the tip, and its curvature normalised to 1 at the root
  const BETA = 1.875104, SIG = 0.734096;
  const phi = (s) => (Math.cosh(BETA * s) - Math.cos(BETA * s) - SIG * (Math.sinh(BETA * s) - Math.sin(BETA * s))) / 2.0;
  const PHI1 = phi(1);
  const curv = (s) => (Math.cosh(BETA * s) + Math.cos(BETA * s) - SIG * (Math.sinh(BETA * s) + Math.sin(BETA * s))) / 2.0;

  // ═════════════════ b3-cantilever-3d ═════════════════
  register("b3-cantilever-3d", {
    title: "3D · a silicon cantilever bends: x = F/k with k = Ewt³/4L³, and rings at f₀ = 0.1615 (t/L²)√(E/ρ)",
    target: "After this you can predict how far a silicon beam bends, where its strain is largest, and why doubling its thickness makes it 8× stiffer and 2× higher in pitch.",
    caption: "lengths are to scale with each other, but the thickness is drawn about 7× and the deflection about 40× larger (clipped for very soft beams). The colour on the top surface is the surface strain (dark blue = none → yellow = most); it is always largest at the clamped root, which is where a piezoresistor goes. Step through the math to build k from the bending moment. Press “vibrate” to see the first mode shape (slowed down about 100 000×): the tip moves most, the root strains most.",
    links: [
      { id: "A2", why: "the root strain is what a strain gauge or piezoresistor reads" },
      { id: "B4", why: "the same beams become the springs that hold an accelerometer's proof mass" },
      { id: "B2", why: "this is the beam released in the surface-micromachining process" },
      { id: "B1", why: "k ∝ ℓ and m ∝ ℓ³ make f₀ ∝ 1/ℓ" },
    ],
    build(fig, ui) {
      let L = 200, w = 20, t = 2, F = 1, step = 0, vib = false;
      const props = () => {
        const Lm = L * 1e-6, wm = w * 1e-6, tm = t * 1e-6, Fn = F * 1e-6;
        const k = (E * wm * tm ** 3) / (4 * Lm ** 3), x = Fn / k, sig = (6 * Fn * Lm) / (wm * tm * tm);
        const f0 = CF * (tm / (Lm * Lm)) * Math.sqrt(E / RHO), m = RHO * Lm * wm * tm, meff = k / (2 * Math.PI * f0) ** 2;
        return { k, x, sig, eps: sig / E, f0, m, meff };
      };
      const sc = scene3d(ui.body, {
        w: 640, h: 360, scale: 92, yaw: -0.5, pitch: 0.38, center: [1.2, 0, -0.25], animate: !reduceMotion,
        draw(g, time, s3) {
          const p = props();
          const Ld = L * 0.009, wd = w * 0.022, td = t * 0.06, nu = 20;
          s3.o.center[0] = Ld / 2 - 0.2;
          const zTip = vib ? 0.7 * Math.sin(2 * Math.PI * 0.7 * time) : -Math.min(1.6, p.x * 1e6 * 0.35);
          const shape = (s) => (vib ? zTip * (phi(s) / PHI1) : zTip * (s * s * (3 - s)) / 2);
          const strainAt = (s) => (vib ? Math.abs(zTip / 0.7) * curv(s) / curv(0) * 0.85 : Math.min(1, (p.eps / 150e-6) * (1 - s)));
          // clamp block and chip
          g.box([-0.7, -0.75, -1.3], [0, 0.75, td / 2], C.silicon, { stroke: C.bg, strokeAlpha: 0.5, strokeWidth: 0.8, bias: -0.5 });
          g.text([-0.35, -0.75, -0.8], "anchor", C.text, 12);
          const top = (s) => step >= 2 || vib ? ramp(strainAt(s)) : step === 1 ? mix(C.silicon, ROLE.mech, 0.9 * (1 - s)) : mix(C.silicon, C.white, 0.15);
          for (let i = 0; i < nu; i++) {
            const s0 = i / nu, s1 = (i + 1) / nu, x0 = Ld * s0, x1 = Ld * s1, z0 = shape(s0), z1 = shape(s1), sm = (s0 + s1) / 2;
            const a = [x0, -wd / 2], b = [x1, wd / 2];
            g.poly([[x0, a[1], z0 + td / 2], [x1, a[1], z1 + td / 2], [x1, b[1], z1 + td / 2], [x0, b[1], z0 + td / 2]], top(sm), { shade: false });
            g.poly([[x0, a[1], z0 - td / 2], [x1, a[1], z1 - td / 2], [x1, b[1], z1 - td / 2], [x0, b[1], z0 - td / 2]], C.silicon);
            g.poly([[x0, a[1], z0 - td / 2], [x1, a[1], z1 - td / 2], [x1, a[1], z1 + td / 2], [x0, a[1], z0 + td / 2]], C.silicon);
            g.poly([[x0, b[1], z0 - td / 2], [x1, b[1], z1 - td / 2], [x1, b[1], z1 + td / 2], [x0, b[1], z0 + td / 2]], C.silicon);
          }
          const zL = shape(1);
          g.poly([[Ld, -wd / 2, zL - td / 2], [Ld, wd / 2, zL - td / 2], [Ld, wd / 2, zL + td / 2], [Ld, -wd / 2, zL + td / 2]], C.silicon);
          if (!vib) {
            g.arrow([Ld - 0.05, 0, zL + td / 2 + 0.8], [Ld - 0.05, 0, zL + td / 2 + 0.03], ROLE.mech, 3.5);
            g.text([Ld + 0.1, 0, zL + td / 2 + 0.9], "F = " + fmt(F, 2) + " µN", ROLE.mech, 13, "left");
          }
          if (step === 1 && !vib) {
            // bending moment diagram M(x) = F(L − x), drawn as a purple triangle on the wall behind the beam
            const yb = -wd / 2 - 0.35, hM = 0.8, z0 = -0.45;
            g.poly([[0, yb, z0], [Ld, yb, z0], [0, yb, z0 - hM]], ROLE.mech, { alpha: 0.4, shade: false, stroke: ROLE.mech, strokeAlpha: 0.9 });
            g.text([0.05, yb, z0 - hM - 0.18], "M = FL at the root", ROLE.mech, 12, "left");

    build(fig, ui) {

        const r = rng(seed), true_ = [], acc = [], gyro = [], fuse = [], lo = [], hi = [];
        let th = 0, f = 0, e2f = 0, e2a = 0, n = 0;
        const sRate = N * Math.sqrt(fs), al = tau / (tau + dt);
        for (let i = 0; i <= Tm * fs; i++) {
          const t = i * dt, tt = 6 * Math.sin((2 * Math.PI * t) / 25), rate = ((6 * 2 * Math.PI) / 25) * Math.cos((2 * Math.PI * t) / 25);
          const meas = rate + bias + sRate * gauss(r);
          const a = tt + sAcc * gauss(r);
          if (i > 0) { th += meas * dt; f = al * (f + meas * dt) + (1 - al) * a; }
          if (i % 5 === 0) { true_.push([t, tt]); gyro.push([t, th]); fuse.push([t, f]); acc.push([t, a]); const c = tt + bias * t; lo.push([t, c - N * Math.sqrt(t)]); hi.push([t, c + N * Math.sqrt(t)]); }
          if (t > 10) { e2f += (f - tt) ** 2; e2a += (a - tt) ** 2; n++; }
        }
        // make the ±N√t band visible even when it is thin: at least ±0.15° wide
        band.set(lo.map(([t, v], j) => [t, Math.min(v, (lo[j][1] + hi[j][1]) / 2 - 0.15)]), hi.map(([t, v], j) => [t, Math.max(v, (lo[j][1] + hi[j][1]) / 2 + 0.15)]));
        lTrue.set(true_); lAcc.set(acc); lGyro.set(gyro); lFuse.set(fuse);
        const endErr = th - 6 * Math.sin((2 * Math.PI * Tm) / 25);
        lab1.set(3, 16.4, "gyro only");
        lab3.set(30, 16.4, "accelerometer tilt");
        lab2.set(74, 16.4, "fused (complementary)");
        ui.read.innerHTML =
          `after ${Tm} s: <span style="color:${C.red}">gyro-only error = ${fmt(endErr, 2)}°</span> ` +
          `(bias predicts Ω_b·t = ${fmt(bias * Tm, 2)}°, noise adds ±N_Ω√t = ±${fmt(N * Math.sqrt(Tm), 2)}°)<br>` +
          `<span style="color:${C.blue}">accelerometer rms error = ${fmt(Math.sqrt(e2a / n), 2)}°</span> (vibration) · ` +
          `<span style="color:${C.green}">fused rms error = ${fmt(Math.sqrt(e2f / n), 2)}°</span> with τ = ${fmt(tau, 1)} s · ` +
          `ARW = 60·N_Ω = ${fmt(60 * N, 2)} °/√h`;
      }
      ui.slider("gyro bias Ω_b", 0, 0.1, 0.005, bias, (v) => { bias = v; run(); return fmt(v, 3) + " °/s"; });
      ui.slider("noise N_Ω", 0.002, 0.05, 0.002, N, (v) => { N = v; run(); return fmt(v, 3) + " °/s/√Hz"; });
      ui.slider("blend τ", 0.2, 20, 0.2, tau, (v) => { tau = v; run(); return fmt(v, 1) + " s"; });
      ui.button("new noise", () => { seed = (seed * 7919 + 13) % 100000; run(); });
      run();
    },
  });
})();
