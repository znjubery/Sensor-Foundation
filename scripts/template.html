<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Sensor Foundations Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: a field notebook — fixed contents rail on the left, one reading column; the whiteboard section is a chalkboard. */
:root {
  --paper: #f5f6f1;
  --sheet: #fcfcf9;
  --ink: #1c2420;
  --muted: #5a665f;
  --line: #d9dfd6;
  --accent: #2c6a52;
  --part-a: #3a4fb0;
  --part-b: #a76a0c;
  --part-c: #2f7d4f;
  --hook-bg: #eef3ea;
  --key-bg: #f1f3fb;
  --warn-bg: #fbf3e6;
  --warn-line: #d9a441;
  --board: #22332b;
  --board-edge: #5b4630;
  --chalk: #e8eee4;
  --chalk-dim: #b9c7bc;
  --chalk-yellow: #f3df8a;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --font-chalk: "Caveat", "Comic Sans MS", cursive;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131915; --sheet: #182019; --ink: #e3e8e2; --muted: #9aa79f; --line: #2c3730;
    --accent: #6cc39d; --part-a: #93a3f2; --part-b: #e2ad55; --part-c: #73c793;
    --hook-bg: #1d2a22; --key-bg: #1d2133; --warn-bg: #2b2416; --warn-line: #b88a33;
    --board: #1b2a22; --board-edge: #6b5338; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131915; --sheet: #182019; --ink: #e3e8e2; --muted: #9aa79f; --line: #2c3730;
  --accent: #6cc39d; --part-a: #93a3f2; --part-b: #e2ad55; --part-c: #73c793;
  --hook-bg: #1d2a22; --key-bg: #1d2133; --warn-bg: #2b2416; --warn-line: #b88a33;
  --board: #1b2a22; --board-edge: #6b5338; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.62; }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; border-right: 1px solid var(--line);
  padding-block: 28px; padding-inline: 20px; font-family: var(--font-display); font-size: 14px; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.2; }
.brand small { display: block; font-weight: 500; font-size: 12.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0; }
.rail nav { display: grid; gap: 18px; margin-top: 24px; }
.rail h3 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); font-weight: 600; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.rail a { display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: baseline; padding: 5px 8px; border-radius: 6px;
  color: var(--ink); text-decoration: none; line-height: 1.3; }
.rail a:hover { background: var(--hook-bg); }
.rail a[aria-current="page"] { background: var(--hook-bg); font-weight: 600; }
.rail .id { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--pc, var(--muted)); }
.rail .tick { color: var(--accent); font-size: 12px; }
.mobile-nav { display: none; }

main { min-width: 0; padding-block: 40px 80px; padding-inline: 32px; }
.sheet { max-width: 46rem; margin: 0 auto; }
.crumb { font-family: var(--font-display); font-size: 12px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--pc, var(--muted)); font-weight: 600; }
.sheet h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1.15; letter-spacing: -0.02em; margin: 6px 0 14px; text-wrap: balance; }
.sheet h1 .num { color: var(--pc, var(--accent)); margin-right: 0.35em; }
.sheet h2 { font-family: var(--font-display); font-weight: 650; font-size: 1.32rem; line-height: 1.25; margin: 0 0 12px; text-wrap: balance; }
.sheet h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; margin: 22px 0 8px; }
.sheet p, .sheet li { max-width: 68ch; }
.sheet blockquote { margin: 0 0 22px; padding: 10px 14px; border-left: 3px solid var(--pc, var(--accent)); background: var(--sheet);
  font-family: var(--font-display); font-size: 14px; line-height: 1.5; color: var(--muted); }
.sheet blockquote p { margin: 0; }
.sheet code { font-family: var(--font-mono); font-size: 0.86em; background: var(--hook-bg); padding: 0.08em 0.3em; border-radius: 4px; }
.sheet pre { background: var(--sheet); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; }
.sheet pre code { background: none; padding: 0; }
.tablewrap { overflow-x: auto; margin: 14px 0 20px; border: 1px solid var(--line); border-radius: 8px; background: var(--sheet); }
.sheet table { border-collapse: collapse; width: 100%; font-size: 15px; line-height: 1.45; }
.sheet th { text-align: left; font-family: var(--font-display); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }
.sheet th, .sheet td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.sheet tr:last-child td { border-bottom: 0; }
.sheet hr { border: 0; border-top: 1px solid var(--line); margin: 28px 0; }
mjx-container[display="true"] { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding-block: 2px; }
mjx-container { font-size: 104%; }

section.sec { margin: 0 0 30px; }
section.sec-hook { background: var(--hook-bg); border-radius: 12px; padding: 18px 22px 6px; }
section.sec-hook h2::before, section.sec-key h2::before, section.sec-warn h2::before, section.sec-test h2::before, section.sec-deriv h2::before, section.sec-check h2::before {
  display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
section.sec-hook h2::before { content: "Real-world hook"; }
section.sec-key { background: var(--key-bg); border-radius: 12px; padding: 18px 22px 8px; }
section.sec-key h2::before { content: "Remember these"; }
section.sec-deriv { border-top: 2px dashed var(--line); padding-top: 20px; }
section.sec-deriv h2::before { content: "Elaboration"; }
section.sec-check h2::before { content: "By hand"; }
section.sec-warn { background: var(--warn-bg); border-left: 4px solid var(--warn-line); border-radius: 0 12px 12px 0; padding: 16px 20px 6px; }
section.sec-warn h2::before { content: "Careful"; }
section.sec-test h2::before { content: "Check yourself"; }
section.sec-remember { font-family: var(--font-display); font-size: 1.08rem; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 12px 2px; }
section.sec-remember h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }

/* The chalkboard: same look in both themes, framed like a classroom board */
section.sec-board { background: var(--board); color: var(--chalk); border: 10px solid var(--board-edge); border-radius: 6px;
  padding: 20px 24px 10px; box-shadow: inset 0 0 60px rgba(0,0,0,0.35); }
section.sec-board h2 { font-family: var(--font-chalk); font-size: 2rem; font-weight: 600; color: var(--chalk-yellow); letter-spacing: 0; }
section.sec-board strong, section.sec-board b { color: var(--chalk-yellow); }
section.sec-board em { color: var(--chalk); }
section.sec-board a { color: var(--chalk-yellow); }
section.sec-board li::marker { color: var(--chalk-dim); }
section.sec-board code { background: rgba(255,255,255,0.08); color: var(--chalk); }
section.sec-board mjx-container { color: var(--chalk); }
section.sec-board .tablewrap { background: transparent; border-color: rgba(255,255,255,0.18); }
section.sec-board th, section.sec-board td { border-color: rgba(255,255,255,0.14); color: var(--chalk); }

details { border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; margin: 6px 0 10px; background: var(--sheet); }
summary { cursor: pointer; font-family: var(--font-display); font-size: 13.5px; font-weight: 600; color: var(--accent); }
details[open] summary { margin-bottom: 6px; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 40px; font-family: var(--font-display); }
.pager a { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; text-decoration: none; color: var(--ink); background: var(--sheet); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }
.pager .next { text-align: right; grid-column: 2; }
.known { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 14px; color: var(--muted); margin: 0 0 22px; }
.known input { width: 18px; height: 18px; accent-color: var(--accent); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { display: none; }
  .mobile-nav { display: flex; gap: 10px; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
    background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; font-family: var(--font-display); }
  .mobile-nav b { font-size: 14px; white-space: nowrap; }
  .mobile-nav select { min-width: 0; flex: 1; font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); }
  main { padding-block: 24px 60px; padding-inline: 16px; }
  .sheet h1 { font-size: 1.6rem; }
  section.sec-hook, section.sec-key, section.sec-warn { padding-inline: 16px; }
  section.sec-board { padding-inline: 14px; border-width: 6px; }
  body { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise 0.25s ease-out; } }
@keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
</style>

<div class="mobile-nav"><b>Sensor notebook</b><select id="jump" aria-label="Go to note"></select></div>
<div class="app">
  <aside class="rail">
    <div class="brand">Sensor Foundations<small>MEMS, microfluidics &amp; electronic sensors: 19 connected, interactive notes</small></div>
    <nav id="toc"></nav>
  </aside>
  <main><article class="sheet" id="sheet"><p>Loading the notes…</p></article></main>
</div>

<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]], displayMath: [["\\[", "\\]"]] },
  svg: { fontCache: "global" },
  startup: { typeset: false, pageReady() { return MathJax.startup.defaultPageReady().then(() => { window.__mjReady = true; typesetSheet(); }); } }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg-full.js" async></script>
<script>
/*@@VIZ@@*/
</script>
<script>
const DATA = /*@@DATA@@*/;
const pages = DATA.pages;
const byId = Object.fromEntries(pages.map(p => [p.id, p]));
const partColor = { A: "var(--part-a)", B: "var(--part-b)", C: "var(--part-c)" };
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let known = store.get("sf-known") || {};

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// Pull math and code out before Markdown sees them, then put math back for MathJax.
function renderMarkdown(md) {
  const code = [], math = [];
  md = md.replace(/```[\s\S]*?```/g, m => `CODEBLK${code.push(m) - 1}X`);
  md = md.replace(/\\\$/g, "DOLLARSIGNX");
  md = md.replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => `MATHDISP${math.push({ t, d: true }) - 1}X`);
  md = md.replace(/\$((?:[^$\\\n]|\\.|\n(?!\s*\n))+?)\$/g, (m, t) => `MATHINL${math.push({ t, d: false }) - 1}X`);
  md = md.replace(/CODEBLK(\d+)X/g, (m, i) => code[+i]);
  let html = marked.parse(md, { gfm: true });
  html = html.replace(/MATH(DISP|INL)(\d+)X/g, (m, k, i) => {
    const t = esc(math[+i].t);
    return math[+i].d ? `<span class="disp">\\[${t}\\]</span>` : `\\(${t}\\)`;
  });
  return html.replace(/DOLLARSIGNX/g, "$");
}

const SECTION_KINDS = [
  ["hook", "sec-hook"], ["the key equations", "sec-key"], ["derivation", "sec-deriv"], ["worked check", "sec-check"],
  ["whiteboard", "sec-board"], ["common mistakes", "sec-warn"], ["self-test", "sec-test"], ["remember", "sec-remember"]
];

function sectionize(root) {
  const kids = [...root.childNodes];
  let current = null;
  for (const node of kids) {
    if (node.nodeName === "H2") {
      const text = node.textContent.toLowerCase();
      const kind = (SECTION_KINDS.find(([k]) => text.startsWith(k)) || [, ""])[1];
      current = document.createElement("section");
      current.className = "sec " + kind;
      root.insertBefore(current, node);
    }
    if (current) current.appendChild(node);
  }
  root.querySelectorAll("table").forEach(t => {
    const w = document.createElement("div"); w.className = "tablewrap";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
}

function typesetSheet() {
  if (window.__mjReady && MathJax.typesetPromise) {
    const el = document.getElementById("sheet");
    MathJax.typesetClear([el]);
    MathJax.typesetPromise([el]).catch(err => console.warn(err));
  }
}

function buildNav() {
  const toc = document.getElementById("toc");
  const jump = document.getElementById("jump");
  const groups = [["", "Overview"], ...Object.entries(DATA.parts)];
  toc.innerHTML = groups.map(([part, label]) => {
    const items = pages.filter(p => p.part === part).map(p =>
      `<li><a href="#${p.id}" data-id="${p.id}" style="--pc:${partColor[p.part] || "var(--muted)"}">` +
      `<span class="id">${p.part ? p.id : "·"}</span><span>${esc(p.short)}</span><span class="tick">${known[p.id] ? "✓" : ""}</span></a></li>`).join("");
    return `<div><h3>${part ? "Part " + part + " · " : ""}${esc(label)}</h3><ol>${items}</ol></div>`;
  }).join("");
  jump.innerHTML = groups.map(([part, label]) =>
    `<optgroup label="${part ? "Part " + part + " — " : ""}${esc(label)}">` +
    pages.filter(p => p.part === part).map(p => `<option value="${p.id}">${p.part ? p.id + " " : ""}${esc(p.short)}</option>`).join("") +
    `</optgroup>`).join("");
  jump.addEventListener("change", () => { location.hash = jump.value; });
}

function show(id) {
  const page = byId[id] || byId.home;
  const sheet = document.getElementById("sheet");
  const pc = partColor[page.part] || "var(--accent)";
  sheet.style.setProperty("--pc", pc);
  let md = page.md;
  let head = "";
  if (page.part) {
    md = md.replace(/^#\s.*\n/, "");
    head = `<div class="crumb">Part ${page.part} · ${esc(DATA.parts[page.part])}</div>` +
      `<h1><span class="num">${page.id}</span>${esc(page.short)}</h1>` +
      `<label class="known"><input type="checkbox" id="known-${page.id}" ${known[page.id] ? "checked" : ""}> I can explain this without notes</label>`;
  }
  sheet.innerHTML = head + `<div class="body">${renderMarkdown(md)}</div>`;
  sectionize(sheet.querySelector(".body"));
  if (window.VIZ) { VIZ.fits(sheet, { page, graph: DATA.graph }); VIZ.mount(sheet, { page, graph: DATA.graph }); }
  const i = pages.indexOf(page), prev = pages[i - 1], next = pages[i + 1];
  sheet.insertAdjacentHTML("beforeend", `<nav class="pager">` +
    (prev ? `<a href="#${prev.id}"><small>Previous</small>${prev.part ? prev.id + " " : ""}${esc(prev.short)}</a>` : "") +
    (next ? `<a class="next" href="#${next.id}"><small>Next</small>${next.part ? next.id + " " : ""}${esc(next.short)}</a>` : "") + `</nav>`);
  const box = document.getElementById("known-" + page.id);
  if (box) box.addEventListener("change", () => { known[page.id] = box.checked; store.set("sf-known", known); buildNav(); markCurrent(page.id); });
  markCurrent(page.id);
  document.title = page.part ? `${page.id} ${page.short} · Sensor Foundations Notebook` : "Sensor Foundations Notebook";
  store.set("sf-last", page.id);
  window.scrollTo(0, 0);
  typesetSheet();
}

function markCurrent(id) {
  document.querySelectorAll(".rail a").forEach(a => { if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const jump = document.getElementById("jump"); if (jump) jump.value = id;
}

buildNav();
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || store.get("sf-last") || "home");
</script>
