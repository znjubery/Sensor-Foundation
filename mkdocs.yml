      - 'A3. Capacitive sensors': A3-capacitive-sensors.md
      - 'A4. Piezoelectric, piezoresistive & magnetic sensors': A4-piezoelectric-piezoresistive-and-magnetic-sensors.md
      - 'A5. Optical sensors: photodiodes, image sensors, LiDAR': A5-optical-sensors-photodiodes-image-sensors-and-lidar.md
      - 'A6. Electrochemical sensors & biosensors': A6-electrochemical-sensors-and-biosensors.md
      - 'A7. Signal conditioning: amplifiers, filters, ADCs': A7-signal-conditioning-amplifiers-filters-and-adcs.md
      - 'A8. Noise, resolution, calibration & drift': A8-noise-resolution-calibration-and-drift.md
      - 'A9. Sensor fusion & the Kalman filter': A9-sensor-fusion-and-the-kalman-filter.md
  - 'Part B · MEMS':
      - 'B1. Scaling laws: why small is different': B1-scaling-laws-why-small-is-different.md
