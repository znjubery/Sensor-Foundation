site_name: Sensor Foundations Notebook
site_description: "MEMS, microfluidics & electronic sensors: 19 connected, interactive notes"
repo_url: https://github.com/znjubery/Sensor-Foundation
theme:
  name: material
  features: [navigation.sections, navigation.footer, content.code.copy]
markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
nav:
